id: gen-s-3246-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) girdi klasöründeki her .csv dosyasını işle.
  2) Her dosyanın ilk satırındaki başlığı olduğu gibi koru.
  3) Başlıktan sonraki her satırı "sehir-tarih-olcum" biçiminde tek bir satıra dönüştür.
  4) Her dosyanın adını, o dosyanın sehir sütunundaki ilk değerle değiştir.
  5) Elde edilen dosyaları cikti klasörüne yaz.

setup: |
  mkdir -p girdi
  seq 1 3 | while read i; do
    printf 'sehir,tarih,olcum\n' > "girdi/dosya$i.csv"
    printf 'sehir%d,2024-01-0%d,%d\n' "$i" "$i" "$((i*3))" >> "girdi/dosya$i.csv"
    printf 'sehir%d,2024-01-0%d,%d\n' "$i" "$((i+1))" "$((i*5))" >> "girdi/dosya$i.csv"
  done

goal_tr: >
  girdi klasorundeki her .csv dosyasi icin, dosyanin ilk satirindaki basligi
  koruyup geri kalan satirlari "sehir-tarih-olcum" biciminde tek bir satira
  cevirip, dosya adini sehir sutunundaki ilk degerle degistirerek cikti
  klasorune yaz.

reference_solution: |
  mkdir -p cikti
  seq 1 3 | while read i; do
    f="girdi/dosya$i.csv"
    ad=$(tail -n +2 "$f" | head -n 1 | cut -d, -f1)
    { head -n 1 "$f"; tail -n +2 "$f" | awk -F, '{print $1"-"$2"-"$3}'; } > "cikti/$ad.csv"
  done
  printf 'bitti\n'

outputs:
  - {path: cikti, kind: dir}

checks:
  - {op: dir_entries_eq, path: cikti, value: [sehir1.csv, sehir2.csv, sehir3.csv]}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3246
    bundle: uret
    tools:
    - printf
    - seq
    konu: hava-durumu-kayitlari
    hedef: yeniden-duzenle
    girdi: duz-metin
    kaynak: cok-dosya
    cikti: yeniden-adlandirilmis
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: kirli-veri
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
