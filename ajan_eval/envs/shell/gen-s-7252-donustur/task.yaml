id: gen-s-7252-donustur
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Atölyedeki havalandırma paneli için haftalık bir izleme raporu hazırlıyoruz; geçen sefer sensör listesiyle ölçüm kayıtları ayrı ayrı duruyordu ve herkesin elinde farklı bir kâğıt dolaşıyordu. Bugün de öğleden sonrayı bu iki kaydı tek bir yerde toplamakla geçirdim, ama bir türlü düzenli bir çıktı alamadım. Elimde sensorler.txt ve olcumler.txt dosyaları var; bunları sensör kimliğine göre eşleştirip her sensör için id, ad, sehir ve olcum değerini içeren bir JSON dizisi oluşturmanı ve bunu sonuc.json dosyasına yazmanı istiyorum. Bu arada ortada tuzak.txt diye bir dosya var, ona hiç dokunma, o işe yaramaz.

setup: |
  cat > sensorler.txt <<'EOF'
  S01|Sicaklik|Ankara
  S02|Nem|Istanbul
  S03|Basinc|Izmir
  S04|Isik|Bursa
  EOF

  printf 'S01 000000123\nS02 000000456\nS03 000000789\nS04 000000321\n' > olcumler.txt

  printf 'S99 000000999\n' > tuzak.txt

goal_tr: >
  sensorler.txt ve olcumler.txt dosyalarini sensor kimligine gore
  birlestirip her sensor icin id, ad, sehir ve olcum degerini iceren bir
  JSON dizisi ureterek sonuc.json dosyasina yaz; tuzak.txt dosyasini
  kullanma.

reference_solution: |
  join -t'|' -1 1 -2 1 -o 0,1.2,1.3,2.2 <(sort -t'|' -k1,1 sensorler.txt) <(sed 's/\r$//' olcumler.txt | sort -k1,1) | awk -F'|' 'BEGIN{print "["} {printf "%s{\"id\":\"%s\",\"ad\":\"%s\",\"sehir\":\"%s\",\"deger\":%d}", (NR>1?",":""), $1, $2, $3, $4} END{print "\n]"}' > sonuc.json

outputs:
  - {path: sonuc.json, kind: json}

checks:
  - {op: json_eq, path: sonuc.json, value: []}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7252
    bundle: birlestir
    tools:
    - join
    - sort
    konu: sensor-olcumleri
    hedef: donustur
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: json
    kesif: yok
    uslup: baglam-gomulu
    direnc: crlf
    bukulme: tuzak-dosya
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
