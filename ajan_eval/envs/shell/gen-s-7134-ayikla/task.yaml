id: gen-s-7134-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) /workspace dizinindeki kalemler.csv dosyasını oku.
  2) Her satırdaki kalem alanını ters çevir.
  3) Tutarı 100'den büyük olan satırları seç.
  4) Seçilen satırların ters çevrilmiş kalem adlarını, her satırda bir tane olacak şekilde /workspace dizinindeki kalemler.txt dosyasına yaz.

setup: |
  cat > kalemler.csv <<'CSV'
  tarih,kalem,tutar
  2024-01-03,kira,1500
  2024-01-05,kirtasiye,75
  2024-01-08,kira,1500
  2024-01-09,ulasim,220
  2024-01-12,kirtasiye,75
  CSV

goal_tr: >
  kalemler.csv dosyasindaki her satirin kalem alanini ters cevirip, tutari
  100'den buyuk olan satirlarin ters cevrilmis kalem adlarini kalemler.txt
  dosyasina her satirda bir tane olacak sekilde yaz

reference_solution: |
  tail -n +2 kalemler.csv | awk -F, '$3 > 100 {print $2}' > gecici.txt
  cut -d, -f1 gecici.txt > /dev/null
  rev gecici.txt > kalemler.txt
  rm gecici.txt

outputs:
  - {path: kalemler.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: kalemler.txt, value: [arik, arik, misalu]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7134
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: muhasebe-kalemleri
    hedef: ayikla
    girdi: csv
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
