id: gen-s-1007-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) girdi/yorumlar.txt dosyasındaki yorumları ürüne göre ayır; ilk satır başlıktır.
  2) Her ürün için o ürünün puanlarını sıralı olarak, en sonda da puan:adet satırları halinde cikti/<ürün>.txt dosyasına yaz: cikti/klavye.txt, cikti/mouse.txt, cikti/monitor.txt, cikti/kulaklik.txt.
  3) Her ürünün toplam yorum sayısını cikti/<ürün>.sayi dosyasına sadece sayı olarak yaz: cikti/klavye.sayi, cikti/mouse.sayi, cikti/monitor.sayi, cikti/kulaklik.sayi.

setup: |
  mkdir -p girdi cikti
  cat > girdi/yorumlar.txt <<'DATA'
  urun      puan  yorum
  klavye      5  harika
  mouse       3  idare eder
  klavye      4  iyi
  monitor     5  mukemmel
  mouse       1  kotu
  klavye      5  cok iyi
  monitor     2  bozuk geldi
  kulaklik    4  guzel ses
  mouse       3  fena degil
  klavye      4  tavsiye ederim
  monitor     5  super
  kulaklik    1  kirik
  DATA

goal_tr: >
  girdi/yorumlar.txt dosyasindaki her urun icin yorumlari puana gore
  gruplayip her urun icin cikti/<urun>.txt dosyasina puanlari sirali olarak
  ve en sonda puan:adet satirlari halinde yaz; her urun icin toplam yorum
  sayisini da cikti/<urun>.sayi dosyasina sadece sayi olarak yaz.

reference_solution: |
  tail -n +2 girdi/yorumlar.txt | awk '{print $1, $2}' | sort -k1,1 -k2,2n > /tmp/gruplu.txt
  cut -d' ' -f1 /tmp/gruplu.txt | uniq > /tmp/urunler.txt
  while read -r urun; do
    awk -v u="$urun" '$1==u {print $2}' /tmp/gruplu.txt > /tmp/puanlar.txt
    {
      cat /tmp/puanlar.txt
      sort /tmp/puanlar.txt | uniq -c | awk '{print $2":"$1}'
    } > "cikti/${urun}.txt"
    wc -l < /tmp/puanlar.txt | tr -d ' ' > "cikti/${urun}.sayi"
  done < /tmp/urunler.txt

outputs:
  - {path: cikti/klavye.txt, kind: lines}
  - {path: cikti/klavye.sayi, kind: file}
  - {path: cikti/mouse.txt, kind: lines}
  - {path: cikti/mouse.sayi, kind: file}
  - {path: cikti/monitor.txt, kind: lines}
  - {path: cikti/monitor.sayi, kind: file}
  - {path: cikti/kulaklik.txt, kind: lines}
  - {path: cikti/kulaklik.sayi, kind: file}

checks:
  - {op: file_content_eq, path: cikti/klavye.sayi, value: '4'}
  - {op: file_lines_eq, path: cikti/klavye.txt, value: ['4', '4', '5', '5', '4:2', '5:2']}
  - {op: file_content_eq, path: cikti/kulaklik.sayi, value: '2'}
  - {op: file_lines_eq, path: cikti/kulaklik.txt, value: ['1', '4', '1:1', '4:1']}
  - {op: file_content_eq, path: cikti/monitor.sayi, value: '3'}
  - {op: file_lines_eq, path: cikti/monitor.txt, value: ['2', '5', '5', '2:1', '5:2']}
  - {op: file_content_eq, path: cikti/mouse.sayi, value: '3'}
  - {op: file_lines_eq, path: cikti/mouse.txt, value: ['1', '3', '3', '1:1', '3:2']}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-1007
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: urun-yorumlari
    hedef: grupla-say
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: birden-cok-dosya
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: kirli-veri
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
