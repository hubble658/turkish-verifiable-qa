id: gen-s-7225-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  veri altındaki gerçek kargolar.csv dosyasından her şehre göre teslim edilen kargo sayısını hesapla; cikti dizininde her şehir için dosya adı şehir adı olan ve içinde sadece o şehirdeki teslim sayısı yazan dosyalar oluştur (cikti/Ankara, cikti/Izmir). Yedek dosyayı kullanma.

setup: |
  mkdir -p veri
  cat > veri/kargolar.csv <<'CSV'
  takip_no,sehir,durum
  TR100,Ankara,yolda
  TR101,Izmir,teslim
  TR102,Ankara,teslim
  TR103,Bursa,yolda
  TR104,Izmir,yolda
  CSV
  cat > veri/kargolar.csv.yedek <<'CSV'
  takip_no,sehir,durum
  TR999,Ankara,teslim
  CSV

goal_tr: >
  veri altindaki gercek kargo csv dosyasini (yedek dosyayi degil) bulup,
  icindeki her sehre gore teslim edilen kargo sayisini hesapla ve cikti
  dizininde her sehir icin sehir adiyla bir dosya olustur, dosya adi sehir
  adi olacak ve icinde sadece o sehirdeki teslim sayisi yazacak

reference_solution: |
  mkdir -p cikti
  f=$(find veri -name '*.csv' ! -name '*.yedek' | head -n 1)
  awk -F, 'NR>1 && $3=="teslim" {sayi[$2]++} END {for (s in sayi) print s, sayi[s]}' "$f" > gecici.txt
  while read -r sehir sayi; do
    printf '%s\n' "$sayi" > "cikti/$sehir"
  done < gecici.txt
  rm -f gecici.txt

outputs:
  - {path: cikti, kind: dir}
  - {path: cikti/Ankara, kind: file}
  - {path: cikti/Izmir, kind: file}

checks:
  - {op: dir_entries_eq, path: cikti, value: [Ankara, Izmir]}
  - {op: file_content_eq, path: cikti/Ankara, value: '1'}
  - {op: file_content_eq, path: cikti/Izmir, value: '1'}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7225
    bundle: awk
    tools:
    - awk
    konu: kargo-takibi
    hedef: ozetle
    girdi: csv
    kaynak: iki-dosya-capraz
    cikti: dizin-yapisi
    kesif: dosyayi-bul
    uslup: terse
    direnc: yok
    bukulme: tuzak-dosya
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
