id: gen-s-4095-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  randevular.txt'deki randevulardan iptaller.txt'de numarası olanları çıkar. Kalan randevu sayısını sonuc.txt'ye sadece sayı olarak yaz.

setup: |
  mkdir -p /workspace
  cat > randevular.txt <<'DATA'
  101 Ali Kardiyoloji
  102 Ayse Noroloji
  103 Can Kardiyoloji
  104 Deniz Ortopedi
  105 Ece Noroloji
  106 Fatma Kardiyoloji
  107 Gokhan Ortopedi
  108 Hale Noroloji
  DATA
  cat > iptaller.txt <<'DATA'
  102
  105
  107
  DATA

goal_tr: >
  randevular.txt dosyasindaki randevulardan, iptaller.txt dosyasinda
  numarasi bulunanlari cikarip kalan randevu sayisini sonuc.txt dosyasina
  sadece sayi olarak yaz

reference_solution: |
  cut -d' ' -f1 randevular.txt | sort > tum_nolar.txt
  sort iptaller.txt > iptal_nolar.txt
  comm -23 tum_nolar.txt iptal_nolar.txt > kalan_nolar.txt
  wc -l < kalan_nolar.txt > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '5'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4095
    bundle: kume-farki
    tools:
    - comm
    - sort
    konu: hastane-randevulari
    hedef: ayikla
    girdi: log-satiri
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: yok
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
