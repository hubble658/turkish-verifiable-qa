id: gen-s-7321-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14
prompt: 'kayitlar klasöründeki sabit genişlikli dosyaların tümünü birleştirip her tür için tutar toplamını büyükten küçüğe
  sıralı olarak ozet.csv dosyasına tur,toplam biçiminde yaz.


  İlk satır tur,toplam başlığı olsun.

  '
setup: 'mkdir -p kayitlar

  cat > kayitlar/ocak.txt <<''K''

  1001  GELIR     5000

  1002  GIDER     1200

  1003  GELIR     3000

  1004  GIDER     1200

  1005  GELIR     5000

  K

  cat > kayitlar/subat.txt <<''K''

  1006  GIDER     1200

  1007  GELIR     3000

  1008  GIDER      700

  1009  GELIR     3000

  1010  GIDER     1200

  K

  cat > kayitlar/mart.txt <<''K''

  1011  GELIR     5000

  1012  GIDER      700

  1013  GELIR     5000

  1014  GIDER     1200

  1015  GELIR     3000

  K

  '
goal_tr: 'kayitlar klasorundeki her sabit-genislikli dosyayi birlestirip her tur ve tutar cifti icin tutar toplamini buyukten
  kucuge sirali olarak tur,toplam biciminde ozet.csv dosyasina yaz

  '
reference_solution: '{ echo tur,toplam; cat kayitlar/*.txt | awk ''{t[$2]+=$3} END{for(k in t) print k","t[k]}'' | sort -t,
  -k2,2nr; } > ozet.csv

  '
outputs: []
checks:
- op: file_lines_eq
  path: ozet.csv
  as_set: false
  value:
  - tur,toplam
  - GELIR,32000
  - GIDER,7400
metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7321
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: muhasebe-kalemleri
    hedef: ozetle
    girdi: sabit-genislik
    kaynak: cok-dosya
    cikti: csv
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
  duzeltme:
    neden: altin_yanlis
    not: Altın anlamsızdı ('1200,0'); 'tür ve tutar çifti' ifadesi tur,toplam biçimiyle çelişiyordu.
