id: gen-s-7026-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi/yorumlar.csv dosyasındaki ürün,yorum,puan satırları arasında tekrar edenleri tekilleştir. Tekilleştirilmiş kayıtları ürün adına göre artan sırada cikti/urun_yorumlari.txt dosyasına yaz. Ayrıca her ürün için kaç yorum kaldığını cikti/ozet.txt dosyasına ürün adı ve sayı olarak yaz; bu dosyada her satırda bir ürün ve ona karşılık gelen yorum sayısı bulunsun.

setup: |
  mkdir -p girdi
  cat > girdi/yorumlar.csv <<'CSV'
  urun,yorum,puan
  kalem,cok guzel,5
  defter,idare eder,3
  kalem,cok guzel,5
  silgi,kotu,1
  defter,idare eder,3
  kalem,fena degil,4
  silgi,kotu,1
  CSV

goal_tr: >
  girdi/yorumlar.csv icindeki tekrar eden urun,yorum,puan satirlarini
  tekillestirip urun adina gore artan sirada cikti/urun_yorumlari.txt
  dosyasina yaz ve her urun icin kac yorum kaldigini cikti/ozet.txt
  dosyasina urun ve sayi olarak yaz

reference_solution: |
  mkdir -p cikti
  tail -n +2 girdi/yorumlar.csv | sort -u | sort -t, -k1,1 > cikti/urun_yorumlari.txt
  cut -d, -f1 cikti/urun_yorumlari.txt | sort | uniq -c | awk '{print $2, $1}' > cikti/ozet.txt

outputs:
  - {path: cikti, kind: dir}
  - {path: cikti/urun_yorumlari.txt, kind: lines}
  - {path: cikti/ozet.txt, kind: lines}

checks:
  - {op: dir_entries_eq, path: cikti, value: [ozet.txt, urun_yorumlari.txt]}
  - {op: file_lines_eq, path: cikti/ozet.txt, value: [defter 1, kalem 2, silgi 1]}
  - {op: file_lines_eq, path: cikti/urun_yorumlari.txt, value: ['defter,idare eder,3', 'kalem,cok guzel,5', 'kalem,fena degil,4', 'silgi,kotu,1']}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7026
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: urun-yorumlari
    hedef: donustur
    girdi: csv
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: tekrar-eden-kayit
    bukulme: olcek
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
