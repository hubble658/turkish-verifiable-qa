id: gen-s-7001-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Geçen hafta sunucularda yaşadığımız disk ve bağlantı sorunlarını incelemek için log kayıtlarını karıştırıyordum, üç ayrı sunucudan gelen kayıtlar dağınık halde duruyor ve hangi hataların tekrar ettiğini bir türlü net göremiyorum. Bu yüzden loglar dizinindeki tüm CSV dosyalarındaki kayıtları bir araya toplayıp sadece hata seviyesindekilere odaklanmak istiyorum. Seviye alanı HATA olan satırlardaki mesaj alanlarını al, her benzersiz mesajdan yalnızca bir tane kalacak şekilde tekrarları ele ve bu mesajları alfabetik olarak sıralayıp hatalar.txt dosyasına her satırda bir mesaj olacak şekilde yaz.

setup: |
  mkdir -p loglar
  cat > loglar/sunucu1.csv <<'CSV'
  tarih,seviye,mesaj
  2024-01-01,BILGI,sistem basladi
  2024-01-01,HATA,disk dolu
  2024-01-02,UYARI,bellek az
  2024-01-02,HATA,disk dolu
  CSV
  cat > loglar/sunucu2.csv <<'CSV'
  tarih,seviye,mesaj
  2024-01-03,HATA,baglanti koptu
  2024-01-03,BILGI,yedek alindi
  2024-01-04,HATA,disk dolu
  2024-01-04,UYARI,zaman asimi
  CSV
  cat > loglar/sunucu3.csv <<'CSV'
  tarih,seviye,mesaj
  2024-01-05,HATA,zaman asimi
  2024-01-05,BILGI,kullanici giris yapti
  2024-01-06,HATA,disk dolu
  CSV

goal_tr: >
  loglar dizinindeki tum CSV dosyalarinda seviye alani HATA olan satirlarin
  mesaj alanlarini, her benzersiz mesajdan yalnizca bir kez olacak sekilde
  alfabetik olarak sirala ve hatalar.txt dosyasina her satirda bir mesaj
  olacak sekilde yaz.

reference_solution: |
  : > hatalar.txt
  for f in loglar/*.csv; do
    ad=$(basename "$f")
    dizin=$(dirname "$f")
    tail -n +2 "$dizin/$ad" | awk -F, '$2=="HATA"{print $3}'
  done | sort -u > hatalar.txt

outputs:
  - {path: hatalar.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: hatalar.txt, value: [baglanti koptu, disk dolu, zaman asimi]}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7001
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: sunucu-loglari
    hedef: denetle
    girdi: csv
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: baglam-gomulu
    direnc: tekrar-eden-kayit
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
