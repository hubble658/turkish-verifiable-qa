id: gen-s-4059-denetle
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) arsiv/istanbul.tsv ve arsiv/ankara.tsv dosyalarını incele.
  2) Her iki dosyada da geçen tarih satırlarını belirle.
  3) Bu ortak tarih satırlarını ortak.tsv dosyasına yaz.

setup: |
  mkdir -p arsiv
  cat > arsiv/istanbul.tsv <<'TSV'
  tarih	sehir	olay
  2024-01-01	istanbul	kar
  2024-01-02	istanbul	yagmur
  2024-01-03	istanbul	kar
  TSV
  cat > arsiv/ankara.tsv <<'TSV'
  tarih	sehir	olay
  2024-01-01	ankara	kar
  2024-01-02	ankara	sis
  2024-01-03	ankara	kar
  TSV

goal_tr: >
  arsiv/istanbul.tsv ve arsiv/ankara.tsv dosyalarinda her iki dosyada da
  gecen tarih satirlarini ortak.tsv olarak yaz

reference_solution: |
  comm -12 <(sort arsiv/istanbul.tsv) <(sort arsiv/ankara.tsv) > ortak.tsv

outputs:
  - {path: ortak.tsv, kind: file}

checks:
  - {op: file_content_eq, path: ortak.tsv, value: "tarih\tsehir\tolay"}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4059
    bundle: kume-farki
    tools:
    - comm
    - sort
    konu: hava-durumu-kayitlari
    hedef: denetle
    girdi: tsv
    kaynak: iki-dosya-capraz
    cikti: yeniden-adlandirilmis
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
