id: gen-s-7080-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12
prompt: '1) depo/arsiv/parca_a.txt ve depo/arsiv/parca_b.txt dosyalarındaki her satırın ilk alanındaki renk adını grupla.


  2) Her renk için toplam sayıyı hesapla.


  3) Sonucu, renk anahtarları ile toplam değerlerinden oluşan bir JSON nesnesi olarak cikti.json dosyasına yaz.

  '
setup: 'mkdir -p depo/arsiv

  cat > depo/arsiv/parca_a.txt <<''EOF''

  kirmizi 3

  mavi 5

  kirmizi 1

  yesil 2

  mavi 4

  EOF

  cat > depo/arsiv/parca_b.txt <<''EOF''

  yesil 7

  kirmizi 6

  mavi 2

  sari 9

  EOF

  '
goal_tr: 'depo altindaki parca_a.txt ve parca_b.txt dosyalarindaki her satirin ilk alanindaki renk adlarini gruplayip her
  renk icin toplam sayisini hesapla ve sonucu renk anahtarlari ile toplam degerlerinden olusan bir JSON nesnesi olarak cikti.json
  dosyasina yaz.

  '
reference_solution: 'cat depo/arsiv/parca_a.txt depo/arsiv/parca_b.txt | awk ''{t[$1]+=$2} END {printf "{"; n=0; for(k in
  t){if(n++)printf ","; printf "\"%s\":%s",k,t[k]} print "}"}'' > cikti.json

  '
outputs: []
checks:
- op: json_eq
  path: cikti.json
  value:
    kirmizi: 10
    mavi: 11
    sari: 9
    yesil: 9
