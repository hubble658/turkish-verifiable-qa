id: gen-s-7333-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  veri altındaki .csv dosyalarını veri/cikti/ altına aynı adla .tsv olarak, noktalı virgül yerine sekmeyle yaz; her birinin başına veri/cikti/sira.txt'deki numarayla eşleşen başlık satırı ekle. ankara.tsv, izmir.tsv, bursa.tsv ve sira.txt oluşsun.

setup: |
  mkdir -p veri
  printf 'sehir;tarih;sicaklik\nankara;2024-01-01;3\nankara;2024-01-02;5\n' > veri/ankara.csv
  printf 'sehir;tarih;sicaklik\nizmir;2024-01-01;12\nizmir;2024-01-02;14\n' > veri/izmir.csv
  printf 'sehir;tarih;sicaklik\nbursa;2024-01-01;7\nbursa;2024-01-02;9\n' > veri/bursa.csv
  printf 'bu bir tuzak dosyadir, kayit degildir\n' > veri/notlar.txt
  printf 'sehir;tarih;sicaklik\nankara;2024-01-03;4\n' > veri/ankara.csv.yedek

goal_tr: >
  veri klasorundeki .csv ile biten hava durumu kayit dosyalarini bulup her
  birini veri/cikti/ altinda ayni adla .tsv uzantili olarak yeniden uret;
  ayrac olarak noktali virgul yerine sekme kullan ve her dosyanin basina
  veri/cikti/sira.txt dosyasindaki sira numarasiyla eslesen bir baslik
  satiri ekle.

reference_solution: |
  mkdir -p veri/cikti
  seq 1 3 > veri/cikti/sira.txt
  i=0
  for f in $(find veri -maxdepth 1 -type f -name '*.csv' | sort); do
    i=$((i + 1))
    ad=$(basename "$f" .csv)
    no=$(sed -n "${i}p" veri/cikti/sira.txt)
    printf 'kayit_no\t%s\n' "$no" > "veri/cikti/$ad.tsv"
    tr ';' '\t' < "$f" >> "veri/cikti/$ad.tsv"
  done

outputs:
  - {path: veri/cikti/ankara.tsv, kind: file}
  - {path: veri/cikti/izmir.tsv, kind: file}
  - {path: veri/cikti/bursa.tsv, kind: file}
  - {path: veri/cikti/sira.txt, kind: file}

checks:
  - {op: file_lines_eq, path: veri/cikti/ankara.tsv, value: ["kayit_no\t1", "sehir\ttarih\tsicaklik", "ankara\t2024-01-01\t3", "ankara\t2024-01-02\t5"]}
  - {op: file_lines_eq, path: veri/cikti/bursa.tsv, value: ["kayit_no\t2", "sehir\ttarih\tsicaklik", "bursa\t2024-01-01\t7", "bursa\t2024-01-02\t9"]}
  - {op: file_lines_eq, path: veri/cikti/izmir.tsv, value: ["kayit_no\t3", "sehir\ttarih\tsicaklik", "izmir\t2024-01-01\t12", "izmir\t2024-01-02\t14"]}
  - {op: file_lines_eq, path: veri/cikti/sira.txt, value: ['1', '2', '3']}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7333
    bundle: uret
    tools:
    - printf
    - seq
    konu: hava-durumu-kayitlari
    hedef: donustur
    girdi: duz-metin
    kaynak: cok-dosya
    cikti: yeniden-adlandirilmis
    kesif: dosyayi-bul
    uslup: terse
    direnc: yok
    bukulme: tuzak-dosya
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
