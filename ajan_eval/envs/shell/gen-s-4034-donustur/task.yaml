id: gen-s-4034-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  gonderiler klasöründeki tüm tsv dosyalarını incele; durum sütunu teslim olan satırların toplam sayısını bul ve bu toplamı sonuc.txt dosyasına yalnızca sayı olarak yaz.

setup: |
  mkdir -p gonderiler
  printf 'takip_no\tsehir\tdurum\n' > gonderiler/a.tsv
  seq 1 3 | while read i; do
    case $i in
      1) printf 'TR001\tAnkara\tteslim\n' >> gonderiler/a.tsv ;;
      2) printf 'TR002\tIzmir\tdagitim\n' >> gonderiler/a.tsv ;;
      3) printf 'TR003\tAnkara\tteslim\n' >> gonderiler/a.tsv ;;
    esac
  done
  printf 'takip_no\tsehir\tdurum\n' > gonderiler/b.tsv
  seq 4 6 | while read i; do
    case $i in
      4) printf 'TR004\tBursa\ttransfer\n' >> gonderiler/b.tsv ;;
      5) printf 'TR005\tAnkara\tteslim\n' >> gonderiler/b.tsv ;;
      6) printf 'TR006\tIzmir\tteslim\n' >> gonderiler/b.tsv ;;
    esac
  done
  printf 'takip_no\tsehir\tdurum\n' > gonderiler/c.tsv
  seq 7 9 | while read i; do
    case $i in
      7) printf 'TR007\tBursa\ttransfer\n' >> gonderiler/c.tsv ;;
      8) printf 'TR008\tAnkara\tdagitim\n' >> gonderiler/c.tsv ;;
      9) printf 'TR009\tBursa\tteslim\n' >> gonderiler/c.tsv ;;
    esac
  done

goal_tr: >
  gonderiler klasorundeki tum tsv dosyalarinda durum sutunu teslim olan
  satirlarin toplam sayisini sonuc.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  printf '%s\n' gonderiler/*.tsv > liste.txt
  seq 1 1 >/dev/null
  cut -f3 $(cat liste.txt) | grep -c '^teslim$' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '5'}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4034
    bundle: uret
    tools:
    - printf
    - seq
    konu: kargo-takibi
    hedef: donustur
    girdi: tsv
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
