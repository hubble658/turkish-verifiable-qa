id: gen-s-3145-onar
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Vardiya planlamasıyla uğraşırken insan kaynaklarından gelen listelerin hep farklı bir düzende olduğunu fark ettik; bir gün saat aralıkları iki nokta üst üste, ertesi gün tire ile ayrılmış hâlde geliyor. Bu yüzden vardiya.txt dosyasındaki her satırı tek bir düzene oturtup kaydetmemiz gerekiyor. Ayrıca isimlerin hep büyük harfle yazılması konusunda bir kuralımız var, o yüzden listedeki isimleri de bu kurala uydurmamız lazım.

  Elindeki vardiya.txt dosyasındaki her satırı "isim|başlangıç|bitiş" biçimine çevir; burada isim kısmı büyük harfli olacak. Ortaya çıkan düzeltilmiş satır listesini duzeltilmis.txt dosyasına yaz.

setup: |
  cat > vardiya.txt <<'EOF'
  Ali     : 08:00-16:00
  Veli    : 16:00-24:00
  Ayse    : 00:00-08:00
  Fatma   : 08:00-16:00
  Mehmet  : 16:00-24:00
  EOF

goal_tr: >
  vardiya.txt dosyasindaki her satiri "isim|baslangic|bitis" bicimine
  cevirip isimlerin buyuk harfli oldugu satir listesini duzeltilmis.txt
  dosyasina yaz

reference_solution: |
  sed 's/^\([^:]*\)[[:space:]]*:[[:space:]]*\([^ ]*\)-\(.*\)$/\1|\2|\3/' vardiya.txt > adim1.txt
  tr -d ' ' < adim1.txt > adim2.txt
  tr '[:lower:]' '[:upper:]' < adim2.txt > adim3.txt
  sed 's/|/|/' adim3.txt > duzeltilmis.txt

outputs:
  - {path: duzeltilmis.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: duzeltilmis.txt, value: ['ALI|08:00|16:00', 'VELI|16:00|24:00', 'AYSE|00:00|08:00', 'FATMA|08:00|16:00', 'MEHMET|16:00|24:00']}

