id: gen-s-7067-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  olcumler klasöründeki tüm .ini dosyalarındaki sensör adlarını birlikte değerlendir; her adın kaç kez geçtiğini gösteren, ad ve sayı sütunlarından oluşan bir CSV dosyası oluştur ve bunu sensor_sayim.csv olarak kaydet.

setup: |
  mkdir -p olcumler
  cat > olcumler/hat1.ini <<'INI'
  [sensor]
  ad=sicaklik
  deger=21
  [sensor]
  ad=sicaklik
  deger=21
  [sensor]
  ad=nem
  deger=45
  INI
  cat > olcumler/hat2.ini <<'INI'
  [sensor]
  ad=nem
  deger=45
  [sensor]
  ad=basinc
  deger=100
  [sensor]
  ad=sicaklik
  deger=22
  INI
  cat > olcumler/hat3.ini <<'INI'
  [sensor]
  ad=basinc
  deger=100
  [sensor]
  ad=basinc
  deger=100
  [sensor]
  ad=nem
  deger=45
  INI

goal_tr: >
  olcumler klasorundeki tum .ini dosyalarindaki sensor adlarini birlikte
  degerlendirip her adin kac kez gectigini ad ve sayi sutunlarindan olusan
  csv olarak sensor_sayim.csv dosyasina yaz

reference_solution: |
  cat olcumler/*.ini | grep '^ad=' | cut -d= -f2 | sort | uniq -c | awk '{print $2","$1}' > sensor_sayim.csv
  test "$(wc -l < sensor_sayim.csv)" -gt 0

outputs:
  - {path: sensor_sayim.csv, kind: file}

checks:
  - {op: file_lines_eq, path: sensor_sayim.csv, value: ['basinc,3', 'nem,3', 'sicaklik,3']}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7067
    bundle: say
    tools:
    - grep
    - wc
    konu: sensor-olcumleri
    hedef: grupla-say
    girdi: ini
    kaynak: cok-dosya
    cikti: csv
    kesif: dolayli-hedef
    uslup: duz-hedef
    direnc: tekrar-eden-kayit
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
