id: gen-s-7119-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  /workspace altındaki depo/surum_a ve depo/surum_b dizinlerini karşılaştır; iki dizinde de aynı ada sahip olan dosyalardan içeriği birbirinden farklı olanların sayısını bul ve bu sayıyı sonuc.txt dosyasına yalnızca sayı olarak yaz.

setup: |
  mkdir -p depo/surum_a depo/surum_b
  cat > depo/surum_a/envanter.csv <<'CSV'
  urun,adet,fiyat
  kalem,10,5
  defter,3,20
  silgi,7,2
  CSV
  cat > depo/surum_b/envanter.csv <<'CSV'
  urun,adet,fiyat
  kalem,12,5
  defter,3,20
  silgi,7,2
  CSV
  cat > depo/surum_a/liste.txt <<'TXT'
  kalem
  defter
  silgi
  TXT
  cat > depo/surum_b/liste.txt <<'TXT'
  kalem
  defter
  silgi
  TXT
  cat > depo/surum_a/notlar.txt <<'TXT'
  ilk surum
  TXT
  cat > depo/surum_b/notlar.txt <<'TXT'
  ikinci surum
  TXT

goal_tr: >
  depo/surum_a ve depo/surum_b dizinlerindeki ayni adli dosyalari
  karsilastirip icerigi farkli olan dosyalarin sayisini sonuc.txt'ye sadece
  sayi olarak yaz

reference_solution: |
  find depo/surum_a -type f -printf '%f\n' | sort > /tmp/a_isim
  find depo/surum_b -type f -printf '%f\n' | sort > /tmp/b_isim
  comm -12 /tmp/a_isim /tmp/b_isim > /tmp/ortak
  while read -r ad; do
    if ! diff -q "depo/surum_a/$ad" "depo/surum_b/$ad" >/dev/null; then
      echo "$ad"
    fi
  done < /tmp/ortak > /tmp/farkli
  wc -l < /tmp/farkli > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '2'}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7119
    bundle: karsilastir
    tools:
    - diff
    - comm
    konu: envanter
    hedef: denetle
    girdi: csv
    kaynak: dizin-agaci
    cikti: tek-sayi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
