id: gen-s-4150-karsilastir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) randevular/bekleme/randevu.txt ve randevular/tamamlanan/randevu.txt dosyalarını satır satır karşılaştır.

  2) Yalnızca randevular/bekleme/randevu.txt içinde olup randevular/tamamlanan/randevu.txt içinde olmayan satırları belirle.

  3) Belirlediğin bu satırları /workspace dizinindeki fark.txt dosyasına her satırda bir tane olacak şekilde yaz.

setup: |
  mkdir -p randevular/bekleme randevular/tamamlanan
  cat > randevular/bekleme/randevu.txt <<'TXT'
  Ahmet    | 09:30 | 101
  Mehmet   | 10:15 | 102
  Fatma    | 11:00 | 103
  TXT
  cat > randevular/tamamlanan/randevu.txt <<'TXT'
  Ahmet    | 09:30 | 101
  Fatma    | 11:00 | 103
  TXT

goal_tr: >
  randevular/bekleme/randevu.txt ile randevular/tamamlanan/randevu.txt
  dosyalarini satir satir karsilastirip yalnizca bekleme dosyasinda olan
  satirlari fark.txt'ye yaz

reference_solution: |
  diff randevular/bekleme/randevu.txt randevular/tamamlanan/randevu.txt | grep '^<' | sed 's/^< //' > /tmp/fark.txt
  sort /tmp/fark.txt > /tmp/sira.txt
  sort randevular/bekleme/randevu.txt > /tmp/b.txt
  comm -12 /tmp/sira.txt /tmp/b.txt > fark.txt

outputs:
  - {path: fark.txt, kind: lines}

checks:
  - {op: file_content_eq, path: fark.txt, value: 'Mehmet   | 10:15 | 102'}

metadata:
  domain: karsilastir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4150
    bundle: karsilastir
    tools:
    - diff
    - comm
    konu: hastane-randevulari
    hedef: karsilastir
    girdi: sabit-genislik
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
