id: gen-s-7235-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) depo dizin ağacındaki tüm gonderi.csv dosyalarını bul.
  2) Bulunan gonderi.csv dosyalarında durum sütunu teslim olan satırların toplam sayısını hesapla.
  3) Bu toplam sayıyı sonuc.txt dosyasına sadece sayı olacak şekilde yaz.

setup: |
  mkdir -p depo/2024/istanbul depo/2024/ankara depo/2024/izmir depo/2023/bursa
  cat > depo/2024/istanbul/gonderi.csv <<'CSV'
  takip_no,sehir,durum
  TR001,istanbul,teslim
  TR002,istanbul,iptal
  TR003,istanbul,teslim
  CSV
  cat > depo/2024/ankara/gonderi.csv <<'CSV'
  takip_no,sehir,durum
  TR004,ankara,teslim
  TR005,ankara,teslim
  CSV
  cat > depo/2024/izmir/gonderi.csv <<'CSV'
  takip_no,sehir,durum
  TR006,izmir,iptal
  TR007,izmir,teslim
  TR008,izmir,teslim
  CSV
  cat > depo/2023/bursa/gonderi.csv <<'CSV'
  takip_no,sehir,durum
  TR009,bursa,teslim
  TR010,bursa,iptal
  CSV
  cat > depo/2024/istanbul/notlar.txt <<'TXT'
  bu dosya csv degil
  TXT

goal_tr: >
  depo dizin agacindaki tum gonderi.csv dosyalarini bulup durum sutunu
  teslim olan satirlarin toplam sayisini sonuc.txt dosyasina sadece sayi
  olarak yaz

reference_solution: |
  find depo -type f -name 'gonderi.csv' > /tmp/liste.txt
  cat $(cat /tmp/liste.txt) | awk -F, 'NR==1 || $3=="teslim" {next} {n++} END {print n+0}' > sonuc.txt
  d=$(dirname depo/2024/istanbul/gonderi.csv); b=$(basename depo/2024/istanbul/gonderi.csv); test -n "$d" -a -n "$b"

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '6'}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7235
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: kargo-takibi
    hedef: denetle
    girdi: csv
    kaynak: dizin-agaci
    cikti: tek-sayi
    kesif: dosyayi-bul
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
