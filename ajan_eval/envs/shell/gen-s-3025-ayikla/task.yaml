id: gen-s-3025-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14
prompt: 'Atölyedeki sensör ağı büyüdükçe ham kayıtları elle gözden geçirmek iyice zorlaştı; artık sabahları ilk işim dün gece
  biriken kayıtlara bakmak oluyor. Elimizdeki sensor.log dosyasında zaman zaman bozuk satırlar da birikiyor, bunları ayıklamadan
  sağlıklı bir özet çıkaramıyorum.


  Bu yüzden sensor.log içindeki geçerli ölçüm satırlarından sensör adını, sıcaklık ve nem değerlerini ayıklayıp her sensör
  için ortalama sıcaklık ve ortalama nemi hesaplamanı, bozuk satırları atlamanı ve sonucu sonuc.json dosyasına bir JSON nesnesi
  olarak yazmanı istiyorum.


  JSON biçimi: {"<sensör adı>": {"ortalama_sicaklik": <sayı>, "ortalama_nem": <sayı>}}.

  '
setup: 'cat > sensor.log <<''LOG''

  2024-01-01T00:00:00 sensor=A1 temp=21.5 nem=40

  2024-01-01T00:05:00 sensor=A1 temp=22.0 nem=41

  GARBAGE satiri

  2024-01-01T00:10:00 sensor=B2 temp=23.4 nem=39

  2024-01-01T00:15:00 sensor=A1 temp=20.8 nem=42

  2024-01-01T00:20:00 sensor=B2 temp=24.1 nem=38

  2024-01-01T00:25:00 sensor=A1 temp=21.9 nem=40

  LOG

  '
goal_tr: 'sensor.log icindeki gecerli olcum satirlarindan sensor adi, sicaklik ve nem degerlerini ayiklayip her sensor icin
  ortalama sicaklik ve nemi hesaplayarak sonuc.json dosyasina JSON nesnesi olarak yaz; bozuk satirlari atla.

  '
reference_solution: "grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2} sensor=[A-Z0-9]+ temp=[0-9.]+ nem=[0-9.]+$'\
  \ sensor.log | cut -d' ' -f2- > temiz.txt\nawk '{print $1, $2, $3}' temiz.txt | sed 's/sensor=//; s/temp=//; s/nem=//' >\
  \ ayik.txt\nawk '{s[$1]+=$2; n[$1]+=$3; c[$1]++} END {for (k in s) printf \"%s %.2f %.2f\\n\", k, s[k]/c[k], n[k]/c[k]}'\
  \ ayik.txt | sort > ort.txt\n{\n  printf '{\\n'\n  awk 'BEGIN{first=1} {if(!first) printf \",\\n\"; first=0; printf \" \
  \ \\\"%s\\\": {\\\"ortalama_sicaklik\\\": %s, \\\"ortalama_nem\\\": %s}\", $1, $2, $3}' ort.txt\n  printf '\\n}\\n'\n} |\
  \ tee sonuc.json\n"
outputs:
- path: sonuc.json
  kind: json
checks:
- op: json_eq
  path: sonuc.json
  value:
    A1:
      ortalama_sicaklik: 21.55
      ortalama_nem: 40.75
    B2:
      ortalama_sicaklik: 23.75
      ortalama_nem: 38.5
