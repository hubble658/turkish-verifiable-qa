id: gen-s-4029-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14
prompt: 'kayitlar klasöründeki tüm json dosyalarını birleştirip gun değeri 30''dan büyük olan kayıtların üye adlarını tekrarsız
  ve alfabetik olarak gecikmis.txt dosyasına yaz.

  '
setup: 'mkdir -p kayitlar

  cat > kayitlar/a.json <<''JSON''

  {"uye": "ayse", "kitap": "Kirmizi", "gun": 12}

  {"uye": "mehmet", "kitap": "Mavi", "gun": 35}

  {"uye": "ayse", "kitap": "Yesil", "gun": 40}

  JSON

  cat > kayitlar/b.json <<''JSON''

  {"uye": "zeynep", "kitap": "Sari", "gun": 5}

  {"uye": "mehmet", "kitap": "Kirmizi", "gun": 50}

  JSON

  cat > kayitlar/c.json <<''JSON''

  {"uye": "ali", "kitap": "Mavi", "gun": 60}

  {"uye": "zeynep", "kitap": "Yesil", "gun": 8}

  JSON

  '
goal_tr: 'kayitlar klasorundeki tum json dosyalarini birlestirip gun degeri 30''dan buyuk olan kayitlarin uye adlarini tekrarsiz
  ve alfabetik olarak gecikmis.txt dosyasina yaz

  '
reference_solution: 'python3 - <<''PY''

  import glob, json

  a = {json.loads(s)["uye"] for f in glob.glob("kayitlar/*.json") for s in open(f) if s.strip() and json.loads(s)["gun"] >
  30}

  open("gecikmis.txt", "w").write("".join(x + "\n" for x in sorted(a)))

  PY

  '
outputs: []
checks:
- op: file_lines_eq
  path: gecikmis.txt
  as_set: false
