id: gen-s-4165-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiya.ini dosyasındaki rol değeri kasiyer olan personel sayısını bul ve sonuc.txt dosyasına sadece sayı olarak yaz.

  Şu şartlar sağlanmalı:
  - vardiya.ini dosyasındaki her personel bölümünde rol değeri kontrol edilmeli.
  - Yalnızca rol değeri kasiyer olan personel sayılmalı.
  - sonuc.txt dosyası oluşturulmalı.
  - sonuc.txt dosyasının içeriği yalnızca sayıdan oluşmalı; başka metin, etiket veya açıklama bulunmamalı.

setup: |
  cat > vardiya.ini <<'INI'
  [personel]
  isim = ahmet
  rol = kasiyer

  [personel]
  isim = zeynep
  rol = depo

  [personel]
  isim = murat
  rol = kasiyer

  [personel]
  isim = elif
  rol = depo

  [personel]
  isim = kerem
  rol = kasiyer
  INI

goal_tr: >
  vardiya.ini dosyasindaki rol degeri kasiyer olan personel sayisini
  sonuc.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  sed -n 's/^rol *= *//p' vardiya.ini | tr -d '[:space:]' > roller.txt
  grep -c '^kasiyer$' roller.txt > sonuc.txt
  rm roller.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '0'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4165
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: personel-vardiyalari
    hedef: ayikla
    girdi: ini
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: kabul-kriteri
    direnc: baslik-yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
