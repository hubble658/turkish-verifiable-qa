id: gen-s-4064-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) ölçümler dizin ağacındaki tüm sabit genişlikli ölçüm dosyalarındaki sensör kimliklerini topla.

  2) istasyon_a ve istasyon_b için ortak sensör kümesini comm kullanarak belirle.

  3) Bu ortak sensörler için toplam sıcaklık ve nem değerlerini hesapla.

  4) Hesaplanan toplam değerleri denetim.json dosyasına geçerli bir JSON nesnesi olarak yaz.

setup: |
  mkdir -p olcumler/istasyon_a olcumler/istasyon_b
  cat > olcumler/istasyon_a/sicaklik.txt <<'EOF'
  S001 021
  S002 034
  S003 019
  EOF
  cat > olcumler/istasyon_a/nem.txt <<'EOF'
  S001 045
  S002 052
  S003 041
  EOF
  cat > olcumler/istasyon_b/sicaklik.txt <<'EOF'
  S001 027
  S002 022
  S003 031
  EOF
  cat > olcumler/istasyon_b/nem.txt <<'EOF'
  S001 060
  S002 048
  S003 055
  EOF

goal_tr: >
  olcumler dizin agacindaki tum sabit genislikli olcum dosyalarindaki sensor
  kimliklerini toplayip iki istasyonun ortak sensor kumesini comm ile
  belirle, bu ortak sensorler icin toplam sicaklik ve nem degerlerini
  hesaplayip denetim.json dosyasina gecerli bir JSON nesnesi olarak yaz

reference_solution: |
  find olcumler/istasyon_a -type f | sort | xargs cat > a.txt
  find olcumler/istasyon_b -type f | sort | xargs cat > b.txt
  cut -c1-4 a.txt | sort -u > a_id.txt
  cut -c1-4 b.txt | sort -u > b_id.txt
  comm -12 a_id.txt b_id.txt > ortak.txt
  awk '{t[$1]+=$2; n[$1]+=$3} END {for (s in t) printf "%s %d %d\n", s, t[s], n[s]}' a.txt b.txt | sort > toplam_a.txt
  awk '{t[$1]+=$2; n[$1]+=$3} END {for (s in t) printf "%s %d %d\n", s, t[s], n[s]}' a.txt b.txt | sort > toplam_b.txt
  join ortak.txt toplam_a.txt | sort > ortak_toplam.txt
  { printf '{\n'; awk 'BEGIN{first=1} {if(!first) printf ",\n"; printf "  \"%s\": {\"sicaklik\": %d, \"nem\": %d}", $1, $2, $3; first=0} END{printf "\n}\n"}' ortak_toplam.txt; } > denetim.json
  diff ortak_toplam.txt ortak_toplam.txt > /dev/null
  rm -f a.txt b.txt a_id.txt b_id.txt ortak.txt toplam_a.txt toplam_b.txt ortak_toplam.txt

outputs:
  - {path: denetim.json, kind: json}

checks:
  - {op: json_eq, path: denetim.json, value: {S001: {sicaklik: 153, nem: 0}, S002: {sicaklik: 156, nem: 0}, S003: {sicaklik: 146, nem: 0}}}

