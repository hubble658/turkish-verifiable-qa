id: gen-s-3064-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) istasyonlar.txt ve gözlemler.txt dosyalarını istasyon numarası üzerinden birleştir.
  2) Her istasyon için istasyon numarası, şehir adı, gözlem sayısı ve sıcaklıkların toplamını içeren bir JSON nesnesi dizisi oluştur.
  3) Diziyi istasyon numarasına göre artan sırada sırala.
  4) Bu diziyi ozet.json dosyasına yaz.

setup: |
  cat > istasyonlar.txt <<'EOF'
  101 Ankara
  102 Izmir
  103 Bursa
  104 Antalya
  EOF

  cat > gozlemler.txt <<'EOF'
  101 21 gunesli
  102 28 gunesli
  101 19 yagmurlu
  103 17 bulutlu
  102 30 gunesli
  104 33 gunesli
  103 16 yagmurlu
  101 22 bulutlu
  104 31 bulutlu
  102 27 yagmurlu
  EOF

goal_tr: >
  istasyonlar.txt ve gozlemler.txt dosyalarini istasyon numarasi uzerinden
  birlestirip her istasyon icin istasyon numarasi, sehir adi, gozlem sayisi
  ve sicakliklarin toplamini iceren bir JSON nesnesi dizisini ozet.json
  dosyasina yaz; dizi istasyon numarasina gore artan sirada olsun.

reference_solution: |
  sort -k1,1 istasyonlar.txt > /tmp/ist_sorted.txt
  sort -k1,1 gozlemler.txt > /tmp/goz_sorted.txt
  join -1 1 -2 1 /tmp/ist_sorted.txt /tmp/goz_sorted.txt \
    | sort -k1,1 \
    | awk '{sayi[$1]++; toplam[$1]+=$3; sehir[$1]=$2}
           END {
             printf "["
             first=1
             for (k in sayi) {
               if (!first) printf ","
               first=0
               printf "{\"istasyon\":%s,\"sehir\":\"%s\",\"gozlem_sayisi\":%d,\"sicaklik_toplami\":%d}", k, sehir[k], sayi[k], toplam[k]
             }
             printf "]\n"
           }' > ozet.json

outputs:
  - {path: ozet.json, kind: json}

checks:
  - {op: json_eq, path: ozet.json, value: [{istasyon: 102, sehir: Izmir, gozlem_sayisi: 3, sicaklik_toplami: 85}, {istasyon: 104, sehir: Antalya, gozlem_sayisi: 2, sicaklik_toplami: 64}, {istasyon: 103, sehir: Bursa, gozlem_sayisi: 2, sicaklik_toplami: 33}, {istasyon: 101, sehir: Ankara, gozlem_sayisi: 3, sicaklik_toplami: 62}]}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3064
    bundle: birlestir
    tools:
    - join
    - sort
    konu: hava-durumu-kayitlari
    hedef: ozetle
    girdi: duz-metin
    kaynak: iki-dosya-capraz
    cikti: json
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
