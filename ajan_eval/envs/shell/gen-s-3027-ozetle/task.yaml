id: gen-s-3027-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  notlar dizinindeki tüm .txt dosyalarındaki öğrenci notlarının toplamını ve öğrenci sayısını hesapla; sonucu ozet.json dosyasına {"toplam":<sayi>,"ogrenci":<sayi>} biçiminde yaz.

setup: |
  mkdir -p notlar/sinif_a notlar/sinif_b
  cat > notlar/sinif_a/ali.txt <<'T'
  ali 80
  ayse 90
  T
  cat > notlar/sinif_a/veli.txt <<'T'
  veli 70
  T
  cat > notlar/sinif_b/can.txt <<'T'
  can 60
  T
  cat > notlar/sinif_b/deniz.txt <<'T'
  deniz 100
  T

goal_tr: >
  notlar dizini agacindaki tum .txt dosyalarindaki ogrenci adi ve notlarin
  toplamini ve ogrenci sayisini hesaplayip ozet.json dosyasina
  {"toplam":<sayi>,"ogrenci":<sayi>} biciminde yaz

reference_solution: |
  grep -rl '' notlar --include='*.txt' | xargs cat | awk '{t+=$2; n+=1} END {printf "{\"toplam\":%d,\"ogrenci\":%d}\n", t, n}' > ozet.json

outputs:
  - {path: ozet.json, kind: json}

checks:
  - {op: json_eq, path: ozet.json, value: {toplam: 400, ogrenci: 5}}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3027
    bundle: cok-dosya-ara
    tools:
    - xargs
    - grep
    konu: ogrenci-notlari
    hedef: ozetle
    girdi: duz-metin
    kaynak: dizin-agaci
    cikti: json
    kesif: dosyayi-bul
    uslup: terse
    direnc: baslik-yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
