id: gen-s-7010-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  logs/sunucu.log ve logs/kurallar.txt dosyalarını ilk alanlarındaki koda göre eşleştir. Eşleşen her kod için kod değerini, sunucu değerini ve kural değerini; ardından iki değer arasındaki farkın mutlak değerini yaz, değerler birbirine eşitse fark yerine 0 yaz. Bu satırları başlık satırı olmadan CSV biçiminde denetim.csv dosyasına kaydet ve satırlar kod alanına göre artan sırada olsun.

setup: |
  mkdir -p logs
  cat > logs/sunucu.log <<'LOG'
  K1 BILGI 120
  K2 HATA 045
  K3 UYARI 300
  K4 HATA 007
  K5 BILGI 210
  K6 HATA 099
  LOG
  cat > logs/kurallar.txt <<'TXT'
  K1 BILGI 100
  K2 HATA 050
  K3 UYARI 250
  K4 HATA 010
  K5 BILGI 200
  K6 HATA 090
  TXT

goal_tr: >
  logs/sunucu.log ile logs/kurallar.txt dosyalarini ilk alan (kod) uzerinden
  eslestirip, her kod icin kod, sunucu degeri ve kural degeri arasindaki
  farkin mutlak degerini, degerler esitse 0 yazarak denetim.csv dosyasina
  basliksiz CSV olarak uret; satirlar kod alanina gore artan sirada olsun.

reference_solution: |
  awk 'NR==FNR{if($1 in k){k[$1]=$3}; next} {d=$3-k[$1]; if(d<0)d=-d; printf "%s,%d,%d\n", $1, $3, k[$1]}' logs/kurallar.txt logs/sunucu.log | sort -t, -k1,1 > denetim.csv

outputs:
  - {path: denetim.csv, kind: csv}

checks:
  - {op: file_lines_eq, path: denetim.csv, value: ['K1,120,0', 'K2,45,0', 'K3,300,0', 'K4,7,0', 'K5,210,0', 'K6,99,0']}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7010
    bundle: awk
    tools:
    - awk
    konu: sunucu-loglari
    hedef: denetle
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: csv
    kesif: yok
    uslup: duz-hedef
    direnc: bom
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
