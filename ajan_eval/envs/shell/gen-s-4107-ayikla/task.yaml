id: gen-s-4107-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  loglar klasöründeki tüm .log dosyalarında HATA ile başlayan satırları bul. Bu satırlardan her farklı olanı yalnızca bir kez içerecek şekilde, sıralı olarak hatalar.txt dosyasına yaz.

setup: |
  mkdir -p loglar
  cat > loglar/a.log <<'LOG'
  BILGI basladi
  HATA disk dolu
  UYARI bellek az
  HATA disk dolu
  LOG
  cat > loglar/b.log <<'LOG'
  HATA baglanti koptu
  BILGI devam
  HATA disk dolu
  UYARI yavas
  LOG
  cat > loglar/c.log <<'LOG'
  HATA zaman asimi
  HATA disk dolu
  BILGI bitti
  LOG

goal_tr: >
  loglar klasorundeki tum .log dosyalarindaki HATA ile baslayan satirlari,
  her farkli satirdan yalnizca bir kez olacak bicimde sirali olarak
  hatalar.txt dosyasina yaz

reference_solution: |
  find loglar -type f -name '*.log' | xargs cat | grep '^HATA' | sort -u > hatalar.txt

outputs:
  - {path: hatalar.txt, kind: file}

checks:
  - {op: file_lines_eq, path: hatalar.txt, value: [HATA baglanti koptu, HATA disk dolu, HATA zaman asimi]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4107
    bundle: bul-tasi
    tools:
    - find
    - xargs
    konu: sunucu-loglari
    hedef: ayikla
    girdi: log-satiri
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: tekrar-eden-kayit
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
