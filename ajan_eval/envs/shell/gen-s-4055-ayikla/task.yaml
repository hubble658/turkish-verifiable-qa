id: gen-s-4055-ayikla
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiya klasöründeki tüm csv dosyalarını incele; vardiya sütunu gunduz olan satırların toplam sayısını bul ve bu sayıyı toplam.txt dosyasına sadece sayı olarak yaz.

  Su sartlar saglanmali:
  - vardiya klasöründeki tüm csv dosyaları (gun1.csv, gun2.csv, gun3.csv, gun4.csv) dikkate alınmalı.
  - Sadece vardiya sütunu gunduz olan satırlar sayılmalı.
  - Sonuç /workspace/toplam.txt dosyasına yazılmalı.
  - toplam.txt içeriği sadece sayı olmalı; başka metin, etiket veya açıklama bulunmamalı.

setup: |
  mkdir -p vardiya
  cat > vardiya/gun1.csv <<'CSV'
  ad,vardiya
  ali,gunduz
  ayse,gece
  CSV
  cat > vardiya/gun2.csv <<'CSV'
  ad,vardiya
  mehmet,gunduz
  zeynep,gunduz
  CSV
  cat > vardiya/gun3.csv <<'CSV'
  ad,vardiya
  can,gece
  CSV
  printf 'ad,vardiya\r\neda,gunduz\r\n' > vardiya/gun4.csv

goal_tr: >
  vardiya klasorundeki tum csv dosyalarinda vardiya sutunu gunduz olan satir
  sayisini toplam.txt dosyasina sadece sayi olarak yaz.

reference_solution: |
  for f in vardiya/*.csv; do cut -d, -f2 "$f" | rev | cut -c1-6 | rev; done | grep -c '^gunduz$' > toplam.txt

outputs:
  - {path: toplam.txt, kind: file}

checks:
  - {op: file_content_eq, path: toplam.txt, value: '3'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4055
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: personel-vardiyalari
    hedef: ayikla
    girdi: json
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: kabul-kriteri
    direnc: crlf
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
