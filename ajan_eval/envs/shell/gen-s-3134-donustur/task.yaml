id: gen-s-3134-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi/yorumlar.txt ve girdi/ek_yorumlar.txt içindeki satırları birleştirip id'ye göre tekrarları ele, id,urun,puan başlıklı ve id'ye göre artan sıralı yorumlar.csv üret; satır sonu CR'leri temizle. Sonucu yorumlar.csv.gz ve yorumlar.tar olarak paketle.

setup: |
  mkdir -p girdi
  printf 'id  urun      puan\r\n001 kalem     5\r\n002 defter    3\r\n003 silgi     4\r\n' > girdi/yorumlar.txt
  printf 'id  urun      puan\r\n002 defter    4\r\n004 kalem     2\r\n005 kalem     5\r\n' > girdi/ek_yorumlar.txt

goal_tr: >
  girdi/yorumlar.txt ve girdi/ek_yorumlar.txt dosyalarindaki sabit
  genislikli satirlari birlestirip id alanina gore tekrarlari eleyerek
  id,urun,puan baslikli ve satirlari id degerine gore artan sirada olan
  yorumlar.csv dosyasini uret; her iki dosyadaki satir sonlarindaki CR
  karakterlerini temizle ve sonucu hem gzip ile yorumlar.csv.gz hem de tar
  ile yorumlar.tar olarak paketle.

reference_solution: |
  tr -d '\r' < girdi/yorumlar.txt > girdi/yorumlar.tmp
  tr -d '\r' < girdi/ek_yorumlar.txt > girdi/ek_yorumlar.tmp
  { head -n 1 girdi/yorumlar.tmp; tail -n +2 girdi/yorumlar.tmp; tail -n +2 girdi/ek_yorumlar.tmp; } | sort -k1,1 -u | awk 'BEGIN{OFS=","} NR==1{print "id","urun","puan"; next} {print $1,$2,$3}' > yorumlar.csv
  gzip -c yorumlar.csv > yorumlar.csv.gz
  tar -cf yorumlar.tar yorumlar.csv
  rm -f girdi/yorumlar.tmp girdi/ek_yorumlar.tmp

outputs:
  - {path: yorumlar.csv, kind: file}
  - {path: yorumlar.csv.gz, kind: file}
  - {path: yorumlar.tar, kind: file}

checks:
  - {op: file_lines_eq, path: yorumlar.csv, value: ['id,urun,puan', '002,defter,3', '003,silgi,4', '004,kalem,2', '005,kalem,5', 'id,urun,puan']}
  - {op: run_stdout_eq, cmd: gzip -dc yorumlar.csv.gz, value: 'id,urun,puan

    002,defter,3

    003,silgi,4

    004,kalem,2

    005,kalem,5

    id,urun,puan'}
  - {op: run_stdout_eq, cmd: tar -tf yorumlar.tar | sort, value: yorumlar.csv}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3134
    bundle: arsiv
    tools:
    - tar
    - gzip
    konu: urun-yorumlari
    hedef: donustur
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: csv
    kesif: yok
    uslup: terse
    direnc: crlf
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
