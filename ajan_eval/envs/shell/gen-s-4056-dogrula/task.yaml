id: gen-s-4056-dogrula
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) veri dizinindeki .ini uzantılı dosyalar arasından yalnızca randevular.ini dosyasını ele al; randevular_yedek.ini ve randevular.ini.bak dosyalarını dikkate alma.

  2) randevular.ini dosyasındaki "durum = onaylandi" satırlarının sayısını bul.

  3) Bu sayıyı onayli_sayisi.txt dosyasına yalnızca sayı olacak şekilde yaz; başka hiçbir metin veya açıklama ekleme.

setup: |
  mkdir -p veri
  cat > veri/randevular.ini <<'INI'
  [randevu]
  hasta = Ayse Yilmaz
  doktor = Kardiyoloji
  saat = 09:30
  durum = onaylandi

  [randevu]
  hasta = Mehmet Demir
  doktor = Ortopedi
  saat = 10:15
  durum = iptal

  [randevu]
  hasta = Zeynep Kaya
  doktor = Noroloji
  saat = 11:00
  durum = onaylandi
  INI
  cat > veri/randevular_yedek.ini <<'INI'
  [randevu]
  hasta = Ali Veli
  doktor = Goz
  saat = 14:00
  durum = onaylandi

  [randevu]
  hasta = Fatma Sahin
  doktor = Dahiliye
  saat = 15:30
  durum = iptal
  INI
  cat > veri/randevular.ini.bak <<'INI'
  [randevu]
  hasta = Hayalet Hasta
  doktor = Yok
  saat = 00:00
  durum = iptal
  INI

goal_tr: >
  veri dizinindeki .ini uzantili dosyalar arasindan yalnizca randevular.ini
  dosyasindaki "durum = onaylandi" satirlarinin sayisini onayli_sayisi.txt
  dosyasina sadece sayi olarak yaz

reference_solution: |
  find veri -type f -name '*.ini' -print | sort > dosyalar.txt
  grep -n 'randevular.ini$' dosyalar.txt | cut -d: -f1 > /dev/null
  sed -n '/^\[randevu\]/,$p' veri/randevular.ini | tr -d '\r' | grep -c '^durum = onaylandi$' > onayli_sayisi.txt

outputs:
  - {path: onayli_sayisi.txt, kind: file}

checks:
  - {op: file_content_eq, path: onayli_sayisi.txt, value: '2'}

metadata:
  domain: dogrula
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4056
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: hastane-randevulari
    hedef: dogrula
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: dosyayi-bul
    uslup: numarali-emir
    direnc: yok
    bukulme: tuzak-dosya
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
