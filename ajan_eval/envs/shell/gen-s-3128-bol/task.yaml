id: gen-s-3128-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiya/personel.txt dosyasındaki her satırda ilk alan personelin adı, ikinci alan başlangıç saati. Her personel için bolumler dizini altında adıyla aynı isimde bir alt dizin oluşturulmasını ve bu dizindeki baslangic.txt dosyasına personelin başlangıç saatinin yazılmasını istiyorum; örneğin bolumler/Ali/baslangic.txt Ali'nin başlangıç saatini içermeli.

setup: |
  mkdir -p vardiya
  cat > vardiya/personel.txt <<'TXT'
  Ali 08:00 16:00
  Ayse 16:00 00:00
  Can 00:00 08:00
  Deniz 08:00 16:00
  Ece 16:00 00:00
  Fatma 00:00 08:00
  TXT

goal_tr: >
  vardiya/personel.txt dosyasindaki her satiri ilk alani personel adi,
  ikinci alani baslangic saati olacak sekilde okuyup her personel icin
  bolumler dizininde adiyla ayni olan bir alt dizin olustur ve o dizinin
  icindeki baslangic.txt dosyasina personelin baslangic saatini yaz.

reference_solution: |
  mkdir -p bolumler
  cut -d' ' -f1,2 vardiya/personel.txt | tee /tmp/adaylar.txt | while read ad bas; do mkdir -p "bolumler/$ad"; printf '%s\n' "$bas" > "bolumler/$ad/baslangic.txt"; done

outputs:
  - {path: bolumler, kind: dir}
  - {path: bolumler/Ali/baslangic.txt, kind: file}
  - {path: bolumler/Ayse/baslangic.txt, kind: file}
  - {path: bolumler/Can/baslangic.txt, kind: file}
  - {path: bolumler/Deniz/baslangic.txt, kind: file}
  - {path: bolumler/Ece/baslangic.txt, kind: file}
  - {path: bolumler/Fatma/baslangic.txt, kind: file}

checks:
  - {op: dir_entries_eq, path: bolumler, value: [Ali, Ayse, Can, Deniz, Ece, Fatma]}
  - {op: file_content_eq, path: bolumler/Ali/baslangic.txt, value: '08:00'}
  - {op: file_content_eq, path: bolumler/Ayse/baslangic.txt, value: '16:00'}
  - {op: file_content_eq, path: bolumler/Can/baslangic.txt, value: '00:00'}
  - {op: file_content_eq, path: bolumler/Deniz/baslangic.txt, value: '08:00'}
  - {op: file_content_eq, path: bolumler/Ece/baslangic.txt, value: '16:00'}
  - {op: file_content_eq, path: bolumler/Fatma/baslangic.txt, value: '00:00'}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3128
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: personel-vardiyalari
    hedef: bol
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
