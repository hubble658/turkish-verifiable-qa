id: gen-s-4133-ozetle
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) hava.csv dosyasındaki her şehir için sıcaklık değerlerinin en düşük ve en yüksek olanını bul.
  2) Her şehir adını anahtar, o şehre ait en düşük ve en yüksek sıcaklık değerlerini içeren bir nesneyi değer olarak kullanacak şekilde geçerli bir JSON nesnesi oluştur.
  3) Bu JSON nesnesini ozet.json dosyasına yaz.

setup: |
  cat > hava.csv <<'CSV'
  tarih,sehir,sicaklik
  2024-01-01,Ankara,5
  2024-01-02,Izmir,12
  2024-01-03,Ankara,7
  2024-01-04,Istanbul,9
  2024-01-05,Izmir,14
  2024-01-06,Ankara,5
  2024-01-07,Istanbul,11
  CSV

goal_tr: >
  hava.csv dosyasindaki her sehir icin sicaklik degerlerinin en dusuk ve en
  yuksek olanini bulup sehir adi anahtar, en dusuk ve en yuksek degerleri
  iceren bir nesne deger olacak sekilde gecerli bir JSON nesnesi olarak
  ozet.json dosyasina yaz

reference_solution: |
  tail -n +2 hava.csv | awk -F, '{if(!($2 in mn)){mn[$2]=$3; mx[$2]=$3} if($3<mn[$2])mn[$2]=$3; if($3>mx[$2])mx[$2]=$3} END{printf "{\n"; n=0; for(k in mn){n++; printf "  \"%s\": {\"min\": %s, \"max\": %s}", k, mn[k], mx[k]; if(n<length(mn))printf ","; printf "\n"} printf "}\n"}' > ozet.json
  head -n 1 ozet.json > /dev/null

outputs:
  - {path: ozet.json, kind: json, run: cat ozet.json}

checks:
  - {op: json_eq, path: ozet.json, value: {Izmir: {min: 12, max: 14}, Ankara: {min: 5, max: 7}, Istanbul: {min: 9, max: 11}}}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4133
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: hava-durumu-kayitlari
    hedef: ozetle
    girdi: csv
    kaynak: tek-dosya
    cikti: json
    kesif: yok
    uslup: numarali-emir
    direnc: tekrar-eden-kayit
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
