id: gen-s-7280-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Dünkü yoğun servis sonrası kasadaki notları tek tek elden geçirmek yerine, sipariş kayıtlarını düzenli bir özete çevirmemiz gerekiyor. Elimizde siparişler dizini altında günlere göre tutulmuş birkaç metin dosyası var; bunların içinde masa numarası, ürün ve adet bilgisi aynı satırda yer alıyor. Aynı sipariş bazı günlerde tekrar girilmiş olabilir, bu yüzden birebir aynı olan masa-ürün-adet üçlülerinin yalnızca bir kez hesaba katılması lazım.

  Bu kayıtlardan yola çıkarak rapor adında bir çıktı dizini oluştur. Bu dizinin içinde her masa için ayrı bir dosya olsun: rapor/masa_1.txt, rapor/masa_2.txt, rapor/masa_3.txt, rapor/masa_4.txt ve rapor/masa_5.txt. Her masa dosyasının ilk satırında o masaya ait toplam adet "TOPLAM <sayı>" biçiminde yer alsın; sonraki satırlarda ise o masanın ürünleri "ürün adet" şeklinde, adede göre büyükten küçüğe sıralı olarak listelensin.

setup: |
  mkdir -p siparisler
  printf '%s\n' \
    "MASA 1 corba 2" \
    "MASA 1 kebap 1" \
    "MASA 2 salata 3" \
    "MASA 3 kebap 2" \
    "MASA 1 corba 2" \
    "MASA 2 tatli 1" \
    "MASA 4 corba 1" \
    "MASA 3 salata 1" \
    "MASA 2 kebap 1" \
    "MASA 1 tatli 2" > siparisler/gun1.txt
  printf '%s\n' \
    "MASA 2 corba 1" \
    "MASA 5 kebap 3" \
    "MASA 1 salata 2" \
    "MASA 5 corba 1" \
    "MASA 3 tatli 2" \
    "MASA 2 corba 1" \
    "MASA 4 kebap 1" > siparisler/gun2.txt

goal_tr: >
  siparisler dizinindeki tum .txt dosyalarindaki "MASA <no> <urun> <adet>"
  satirlarini birlestirip tekrar eden masa-urun-adet uclulerini bir kez
  sayarak, her masa icin o masaya ait urunleri adetlerine gore buyukten
  kucuge sirali olarak masa_<no>.txt dosyasina "urun adet" satirlari halinde
  yazan ve her masa dosyasinin ilk satirina toplam adedi "TOPLAM <sayi>"
  olarak ekleyen bir cikti dizini olustur; cikti dizini adi rapor olsun.

reference_solution: |
  mkdir -p rapor
  cat siparisler/*.txt | sort -u > /tmp/benzersiz.txt
  seq 1 5 > /tmp/masalar.txt
  while read -r m; do
    grep " MASA $m " /tmp/benzersiz.txt | awk '{print $3, $4}' | sort -k2,2nr > /tmp/govde.txt
    toplam=$(awk '{s+=$2} END{print s}' /tmp/govde.txt)
    printf 'TOPLAM %s\n' "$toplam" > "rapor/masa_$m.txt"
    cat /tmp/govde.txt >> "rapor/masa_$m.txt"
  done < /tmp/masalar.txt

outputs:
  - {path: rapor, kind: dir}
  - {path: rapor/masa_1.txt, kind: file}
  - {path: rapor/masa_2.txt, kind: file}
  - {path: rapor/masa_3.txt, kind: file}
  - {path: rapor/masa_4.txt, kind: file}
  - {path: rapor/masa_5.txt, kind: file}

checks:
  - {op: dir_entries_eq, path: rapor, value: [masa_1.txt, masa_2.txt, masa_3.txt, masa_4.txt, masa_5.txt]}
  - {op: file_content_eq, path: rapor/masa_1.txt, value: TOPLAM}
  - {op: file_content_eq, path: rapor/masa_2.txt, value: TOPLAM}
  - {op: file_content_eq, path: rapor/masa_3.txt, value: TOPLAM}
  - {op: file_content_eq, path: rapor/masa_4.txt, value: TOPLAM}
  - {op: file_content_eq, path: rapor/masa_5.txt, value: TOPLAM}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7280
    bundle: uret
    tools:
    - printf
    - seq
    konu: restoran-siparisleri
    hedef: yeniden-duzenle
    girdi: duz-metin
    kaynak: cok-dosya
    cikti: dizin-yapisi
    kesif: veriye-bak
    uslup: baglam-gomulu
    direnc: tekrar-eden-kayit
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
