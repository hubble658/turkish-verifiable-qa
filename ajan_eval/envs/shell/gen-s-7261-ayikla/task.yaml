id: gen-s-7261-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) vardiya.txt dosyasındaki saat aralığı içeren geçerli vardiya satırlarından personel adlarını bul.
  2) Bulunan personel adlarını say ve sayıyı elde et.
  3) Personel adlarını ve sayıyı ayiklanmis.txt dosyasına her satırda bir tane olacak şekilde yaz.
  4) sahte_vardiya.txt dosyasını işleme katma.

setup: |
  cat > vardiya.txt <<'EOF'
  Ahmet 09:00-17:00
  Bos satir
  Mehmet 10:00-18:00
  Ayse 08:00-16:00
  IPTAL
  Fatma 12:00-20:00
  EOF

  cat > sahte_vardiya.txt <<'EOF'
  Zeynep 07:00-15:00
  Ali 11:00-19:00
  EOF

goal_tr: >
  vardiya.txt dosyasindaki saat araligi iceren gecerli vardiya satirlarindan
  personel adlarini grep ile bulup wc ile say, sayiyi ve adlari
  ayiklanmis.txt dosyasina satir listesi olarak yaz; sahte_vardiya.txt
  dosyasini isleme katma

reference_solution: |
  grep -E '^[A-Z][a-z]+ [0-9]{2}:[0-9]{2}-[0-9]{2}:[0-9]{2}$' vardiya.txt > gecici.txt
  cut -d' ' -f1 gecici.txt > adlar.txt
  wc -l < adlar.txt > sayi.txt
  cat sayi.txt adlar.txt > ayiklanmis.txt
  rm gecici.txt adlar.txt sayi.txt

outputs:
  - {path: ayiklanmis.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: ayiklanmis.txt, value: ['4', Ahmet, Mehmet, Ayse, Fatma]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7261
    bundle: say
    tools:
    - grep
    - wc
    konu: personel-vardiyalari
    hedef: ayikla
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: tuzak-dosya
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
