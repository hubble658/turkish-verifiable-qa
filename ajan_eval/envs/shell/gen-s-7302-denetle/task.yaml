id: gen-s-7302-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Sabah toplantısında denetim ekibinden gelen talep yine gündemdeydi; muhasebe kayıtlarının dağınık durması yüzünden geçen hafta epey sıkıntı çektik. Öğleden sonra da eski arşiv klasörlerini karıştırırken bir sürü .ini dosyasına rastladım, hepsinde de bakiye satırları var ama hangisinin hangi yıla ait olduğu belli değil. Bu karmaşayı bir düzene sokmak istiyorum artık.

  muhasebe dizin ağacındaki bütün .ini dosyalarında geçen bakiye satırlarını, ait oldukları dosyanın yolu ile birlikte "yol:satır" biçiminde sıralı olarak denetim.txt dosyasına yaz.

setup: |
  mkdir -p muhasebe/2024/ocak muhasebe/2024/subat muhasebe/arsiv
  cat > muhasebe/2024/ocak/kasa.ini <<'INI'
  [hesap]
  ad=kasa
  tur=aktif
  bakiye=1200
  INI
  cat > muhasebe/2024/ocak/banka.ini <<'INI'
  [hesap]
  ad=banka
  tur=aktif
  bakiye=8500
  INI
  cat > muhasebe/2024/subat/kasa.ini <<'INI'
  [hesap]
  ad=kasa
  tur=aktif
  bakiye=1100
  INI
  cat > muhasebe/2024/subat/gider.ini <<'INI'
  [hesap]
  ad=gider
  tur=pasif
  bakiye=430
  INI
  cat > muhasebe/arsiv/eski.ini <<'INI'
  [hesap]
  ad=arsiv
  tur=pasif
  bakiye=0
  INI

goal_tr: >
  muhasebe dizin agacindaki tum .ini dosyalarinda gecen bakiye satirlarini
  dosya yolu ile birlikte "yol:satir" biciminde sirali olarak denetim.txt
  dosyasina yaz

reference_solution: |
  find muhasebe -type f -name '*.ini' | sort > /tmp/ini.listesi
  while read -r f; do grep '^bakiye=' "$f" | sed "s|^|$f:|"; done < /tmp/ini.listesi > denetim.txt
  wc -l < denetim.txt > /tmp/sayi
  grep -c 'bakiye=' denetim.txt > /dev/null
  rm -f /tmp/ini.listesi /tmp/sayi

outputs:
  - {path: denetim.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: denetim.txt, value: ['muhasebe/2024/ocak/banka.ini:bakiye=8500', 'muhasebe/2024/ocak/kasa.ini:bakiye=1200', 'muhasebe/2024/subat/gider.ini:bakiye=430', 'muhasebe/2024/subat/kasa.ini:bakiye=1100', 'muhasebe/arsiv/eski.ini:bakiye=0']}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7302
    bundle: say
    tools:
    - grep
    - wc
    konu: muhasebe-kalemleri
    hedef: denetle
    girdi: ini
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
