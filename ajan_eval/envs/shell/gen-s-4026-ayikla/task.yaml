id: gen-s-4026-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiya dizini ve alt dizinlerindeki tüm .csv dosyalarını ele al. Bu dosyalardaki her satırın başına, o satırın geldiği dosyanın adını "dosya:satır" biçiminde ekle ve elde ettiğin tüm satırları tek bir satır listesi olarak vardiya_listesi.txt dosyasına yaz.

setup: |
  mkdir -p vardiya/aralik vardiya/hafta
  cat > vardiya/aralik/pazartesi.csv <<'CSV'
  ad,vardiya
  Ayse,09:00-17:00
  Mehmet,09:00-17:00
  CSV
  cat > vardiya/aralik/sali.csv <<'CSV'
  ad,vardiya
  Ayse,12:00-20:00
  Zeynep,12:00-20:00
  CSV
  cat > vardiya/hafta/carsamba.csv <<'CSV'
  ad,vardiya
  Mehmet,08:00-16:00
  Zeynep,08:00-16:00
  CSV
  cat > vardiya/hafta/persembe.csv <<'CSV'
  ad,vardiya
  Ayse,10:00-18:00
  Mehmet,10:00-18:00
  CSV

goal_tr: >
  vardiya dizinindeki tum .csv dosyalarindaki her satirin basina dosya adini
  "dosya:satir" biciminde ekleyip tek bir satir listesi olarak
  vardiya_listesi.txt dosyasina yaz

reference_solution: |
  find vardiya -name '*.csv' | sort | while read -r f; do tee /dev/null < "$f" | cut -d, -f1,2 | sed "s|^|$(basename "$f"):|"; done > vardiya_listesi.txt

outputs:
  - {path: vardiya_listesi.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: vardiya_listesi.txt, value: ['pazartesi.csv:ad,vardiya', 'pazartesi.csv:Ayse,09:00-17:00', 'pazartesi.csv:Mehmet,09:00-17:00', 'sali.csv:ad,vardiya', 'sali.csv:Ayse,12:00-20:00', 'sali.csv:Zeynep,12:00-20:00', 'carsamba.csv:ad,vardiya', 'carsamba.csv:Mehmet,08:00-16:00', 'carsamba.csv:Zeynep,08:00-16:00', 'persembe.csv:ad,vardiya', 'persembe.csv:Ayse,10:00-18:00', 'persembe.csv:Mehmet,10:00-18:00']}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4026
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: personel-vardiyalari
    hedef: ayikla
    girdi: csv
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
