id: gen-s-3126-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) vardiya.log dosyasındaki her satırdan personel adını ve görev yerini alıp "ad yer" ikililerini grupla.

  2) Her ikilinin kaç kez geçtiğini say ve ikilileri azalan sayıma göre sırala; sayımlar eşitse ikiliyi alfabetik sıraya göre sırala.

  3) Sonucu her satırda "sayım ad yer" biçiminde olacak şekilde gruplar.txt dosyasına yaz.

setup: |
  cat > vardiya.log <<'LOG'
  2024-03-01 08:00 Ayse depo
  2024-03-01 08:00 Mehmet kasa
  2024-03-01 16:00 Ayse kasa
  2024-03-02 08:00 Zeynep depo
  2024-03-02 16:00 Mehmet depo
  2024-03-02 16:00 Zeynep kasa
  2024-03-03 08:00 Ayse depo
  2024-03-03 08:00 Mehmet kasa
  2024-03-03 16:00 Zeynep depo
  LOG

goal_tr: >
  vardiya.log dosyasindaki her satirdan personel adini ve gorev yerini alip
  "ad yer" ikililerini gruplayarak her ikilinin kac kez gectigini azalan
  sayima gore, esitlikte ikiliyi alfabetik siraya gore sirala ve her satirda
  "sayim ad yer" biciminde olacak sekilde gruplar.txt dosyasina yaz

reference_solution: |
  awk '{print $3, $4}' vardiya.log > /tmp/ikili.txt
  sort /tmp/ikili.txt > /tmp/sirali.txt
  uniq -c /tmp/sirali.txt > /tmp/sayim.txt
  sort -k1,1nr -k2,2 -k3,3 /tmp/sayim.txt > /tmp/son.txt
  awk '{print $1, $2, $3}' /tmp/son.txt > gruplar.txt

outputs:
  - {path: gruplar.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: gruplar.txt, value: [2 Ayse depo, 2 Mehmet kasa, 2 Zeynep depo, 1 Ayse kasa, 1 Mehmet depo, 1 Zeynep kasa]}

