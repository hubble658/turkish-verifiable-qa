id: gen-s-4163-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  muhasebe klasöründeki tüm defter dosyalarını tarayıp, içlerinde geçen her kalem türünü yalnızca bir kez içerecek şekilde, kalem türüne göre alfabetik sıraya dizerek ve her satırda önce kalem türü sonra o kalem türüne ait toplam tutar yer alacak biçimde ozet.txt dosyasını oluştur.

setup: |
  mkdir -p muhasebe
  cat > "muhasebe/ocak defteri.txt" <<'TXT'
  fatura 1000
  kira 2500
  fatura 750
  TXT
  cat > "muhasebe/subat defteri.txt" <<'TXT'
  kira 2500
  fatura 500
  kira 2500
  TXT
  cat > "muhasebe/mart defteri.txt" <<'TXT'
  fatura 1000
  kira 2500
  fatura 750
  TXT

goal_tr: >
  muhasebe klasorundeki tum defter dosyalarinda gecen her kalem turunu bir
  kez, kalem turune gore alfabetik sirada, her satirda kalem turu ve toplam
  tutar olacak sekilde ozet.txt dosyasina yaz

reference_solution: |
  grep -h -o '^[a-z]*' muhasebe/*defter*.txt | sort | uniq -c | awk '{print $2, $1}' > ozet.txt
  wc -l ozet.txt >> ozet.txt

outputs:
  - {path: ozet.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: ozet.txt, value: [fatura 5, kira 4, 2 ozet.txt]}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4163
    bundle: say
    tools:
    - grep
    - wc
    konu: muhasebe-kalemleri
    hedef: ozetle
    girdi: duz-metin
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: kisit-sakli
    direnc: bosluklu-ad
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
