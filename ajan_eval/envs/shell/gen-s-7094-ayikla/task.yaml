id: gen-s-7094-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) veri/siparisler.txt ve veri/fiyatlar.txt dosyalarını sabit genişlikli sütunlarına göre oku.
  2) Siparişleri fiyatlarla birleştirip her siparişin tutarını hesapla.
  3) Sipariş no, ürün, adet ve tutar alanlarını içeren geçerli bir JSON dizisini cikti/siparisler.json dosyasına yaz.

setup: |
  mkdir -p veri cikti
  cat > veri/siparisler.txt <<'DATA'
  1001Pizza     2
  1002Salata    1
  1003Makarna   3
  1004Corba     1
  1005Kofte     2
  1006Pizza     1
  1007Salata    4
  DATA
  cat > veri/fiyatlar.txt <<'DATA'
  Pizza     45
  Salata    30
  Makarna   55
  Corba     25
  Kofte     60
  DATA

goal_tr: >
  veri/siparisler.txt ve veri/fiyatlar.txt dosyalarini sabit genislikteki
  sutunlarina gore birlestirip her siparisin tutarini hesaplayarak siparis
  no, urun, adet ve tutar alanlarini iceren gecerli bir JSON dizisini
  cikti/siparisler.json dosyasina yaz.

reference_solution: |
  cut -c1-4,5-14,15-15 veri/siparisler.txt | grep -v '^$' > cikti/_sip.txt
  cut -c1-10,11-13 veri/fiyatlar.txt | grep -v '^$' > cikti/_fiyat.txt
  awk 'NR==FNR{f[$1]=$2;next}{gsub(/ /,"",$2);gsub(/ /,"",$3);printf "{\"siparis\":\"%s\",\"urun\":\"%s\",\"adet\":%d,\"tutar\":%d}\n",$1,$2,$3,$3*f[$2]}' cikti/_fiyat.txt cikti/_sip.txt | xargs -d '\n' | sed 's/^/[/;s/$/]/;s/} {/},{/g' > cikti/siparisler.json
  rm -f cikti/_sip.txt cikti/_fiyat.txt

outputs:
  - {path: cikti/siparisler.json, kind: json}

checks:
  - {op: json_eq, path: cikti/siparisler.json, value: [{siparis: 1001Pizza, urun: '2', adet: 0, tutar: 0}, {siparis: 1002Salata, urun: '1', adet: 0, tutar: 0}, {siparis: 1003Makarna, urun: '3', adet: 0, tutar: 0}, {siparis: 1004Corba, urun: '1', adet: 0, tutar: 0}, {siparis: 1005Kofte, urun: '2', adet: 0, tutar: 0}, {siparis: 1006Pizza, urun: '1', adet: 0, tutar: 0}, {siparis: 1007Salata, urun: '4', adet: 0, tutar: 0}]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7094
    bundle: cok-dosya-ara
    tools:
    - xargs
    - grep
    konu: restoran-siparisleri
    hedef: ayikla
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: json
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
