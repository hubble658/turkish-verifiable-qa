id: gen-s-4114-toplu-yeniden-adlandir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  envanter dizin ağacındaki .dat uzantılı tüm dosyaları bul; her birini, uzantısız adının sonuna _tamam eklenmiş yeni bir adla aynı dizinde kopyala. Örneğin a.dat dosyası a_tamam.dat olarak kopyalanmalı. Sonuçta envanter/a_tamam.dat, envanter/alt/b_tamam.dat, envanter/alt/veri_tamam.dat ve envanter/z_tamam.dat dosyaları oluşmalı.

  Şu şartlar sağlanmalı:
  - envanter dizini ve alt dizinleri taranmalı, .dat uzantılı dosyaların tamamı işlenmeli.
  - envanter/a.dat dosyasının kopyası envanter/a_tamam.dat olarak aynı dizinde yer almalı.
  - envanter/alt/b.dat dosyasının kopyası envanter/alt/b_tamam.dat olarak aynı dizinde yer almalı.
  - envanter/alt/veri.dat dosyasının kopyası envanter/alt/veri_tamam.dat olarak aynı dizinde yer almalı.
  - envanter/z.dat dosyasının kopyası envanter/z_tamam.dat olarak aynı dizinde yer almalı.
  - .dat uzantılı olmayan dosyalar (örneğin envanter/alt/not.dat.bak ve envanter/alt/README) kopyalanmamalı.
  - Özgün .dat dosyaları olduğu gibi korunmalı, taşınmamalı veya değiştirilmemeli.

setup: |
  mkdir -p envanter/alt envanter/bos
  printf '{"id":1,"ad":"kirmizi"}' > envanter/a.dat
  printf '{"id":2,"ad":"mavi"}' > envanter/alt/b.dat
  printf '{"id":3,"ad":"yesil"}' > envanter/alt/not.dat.bak
  printf '{"id":4,"ad":"sari"}' > envanter/z.dat
  printf 'bu bir tuzak dosya' > envanter/alt/README
  printf '{"id":5,"ad":"mor"}' > envanter/alt/veri.dat

goal_tr: >
  envanter dizin agacindaki .dat uzantili dosyalari, uzantisiz adlarinin
  sonuna _tamam eklenmis yeni adlarla ayni dizinde kopyala (ornek: a.dat ->
  a_tamam.dat)

reference_solution: |
  find envanter -type f -name '*.dat' | while read -r f; do
    d=$(dirname "$f")
    b=$(basename "$f" .dat)
    cp "$f" "$d/${b}_tamam.dat"
  done

outputs:
  - {path: envanter/a_tamam.dat, kind: file}
  - {path: envanter/alt/b_tamam.dat, kind: file}
  - {path: envanter/alt/veri_tamam.dat, kind: file}
  - {path: envanter/z_tamam.dat, kind: file}

checks:
  - {op: json_eq, path: envanter/a_tamam.dat, value: {id: 1, ad: kirmizi}}
  - {op: json_eq, path: envanter/alt/b_tamam.dat, value: {id: 2, ad: mavi}}
  - {op: json_eq, path: envanter/alt/veri_tamam.dat, value: {id: 5, ad: mor}}
  - {op: json_eq, path: envanter/z_tamam.dat, value: {id: 4, ad: sari}}

metadata:
  domain: toplu-yeniden-adlandir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4114
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: envanter
    hedef: toplu-yeniden-adlandir
    girdi: json
    kaynak: dizin-agaci
    cikti: birden-cok-dosya
    kesif: yok
    uslup: kabul-kriteri
    direnc: son-newline-yok
    bukulme: tuzak-dosya
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
