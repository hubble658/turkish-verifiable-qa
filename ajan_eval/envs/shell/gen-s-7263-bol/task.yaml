id: gen-s-7263-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  arsiv/randevular.tsv ve arsiv/hastalar.tsv dosyalarını hasta_id üzerinden birleştir; durumu tamamlandi olan randevuları şehir bazında gruplayıp her şehir için sehir,tamamlanan_randevu_sayisi başlıklı CSV içeriğini şehir adına göre alfabetik sıralı olarak ozet.csv dosyasına yaz. arsiv içindeki diğer dosyaları dikkate alma.

setup: |
  mkdir -p arsiv
  cat > arsiv/randevular.tsv <<'TSV'
  hasta_id	klinik	tarih	durum
  H001	Kardiyoloji	2024-03-01	tamamlandi
  H002	Noroloji	2024-03-01	iptal
  H003	Kardiyoloji	2024-03-02	tamamlandi
  H004	Ortopedi	2024-03-02	tamamlandi
  H005	Noroloji	2024-03-03	beklemede
  H006	Kardiyoloji	2024-03-03	tamamlandi
  H007	Ortopedi	2024-03-04	iptal
  H008	Noroloji	2024-03-04	tamamlandi
  TSV
  cat > arsiv/hastalar.tsv <<'TSV'
  hasta_id	ad	sehir
  H001	Ali	Ankara
  H002	Ayse	Izmir
  H003	Can	Ankara
  H004	Deniz	Bursa
  H005	Ece	Izmir
  H006	Fatma	Ankara
  H007	Gokhan	Bursa
  H008	Hale	Izmir
  TSV
  cat > "arsiv/eski kayitlar.tsv" <<'TSV'
  hasta_id	klinik	tarih	durum
  H999	Kardiyoloji	2024-01-01	tamamlandi
  TSV

goal_tr: >
  arsiv/randevular.tsv ile arsiv/hastalar.tsv dosyalarini hasta_id uzerinden
  birlestirip durumu tamamlandi olan randevulari sehir bazinda gruplayarak
  her sehir icin sehir,tamamlanan_randevu_sayisi baslikli CSV'yi sehir adina
  gore alfabetik sirali olarak ozet.csv dosyasina yaz; arsiv icindeki baska
  dosyalari dikkate alma.

reference_solution: |
  tar -czf girdi.tar.gz arsiv/randevular.tsv arsiv/hastalar.tsv
  gzip -dk girdi.tar.gz
  mkdir -p acik
  tar -xf girdi.tar -C acik
  join -t "$(printf '\t')" -1 1 -2 1 <(tail -n +2 acik/arsiv/randevular.tsv | sort -t "$(printf '\t')" -k1,1) <(tail -n +2 acik/arsiv/hastalar.tsv | sort -t "$(printf '\t')" -k1,1) | awk -F'\t' '$4=="tamamlandi"{print $5}' | sort | uniq -c | awk '{print $2","$1}' | { printf 'sehir,tamamlanan_randevu_sayisi\n'; cat; } > ozet.csv

outputs:
  - {path: ozet.csv, kind: file}

checks:
  - {op: file_lines_eq, path: ozet.csv, value: ['sehir,tamamlanan_randevu_sayisi', 'Ali,1', 'Can,1', 'Deniz,1', 'Fatma,1', 'Hale,1']}

