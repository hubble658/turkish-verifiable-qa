id: gen-s-4003-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) /workspace/siparisler.txt dosyasındaki her masa için masa_1, masa_2, masa_3, masa_4 ve masa_5 adlı alt dizinleri oluştur.

  2) Her masa_<no> dizininin içine, siparisler.txt dosyasındaki yalnızca o masaya ait satırların aynen kopyalandığı bir siparisler.txt dosyası yaz.

  3) Her masa_<no> dizininin içine, o masanın tüm siparişlerinin adet ile fiyat çarpımlarının toplamını yalnızca bir sayı olarak içeren bir toplam.txt dosyası yaz.

  4) Sonuçta masa_1 ile masa_5 arasındaki her masa için bir dizin ve bu dizinlerin içinde siparisler.txt ile toplam.txt dosyalarının bulunduğu bir dizin yapısı oluşsun.

setup: |
  mkdir -p /workspace
  cat > /workspace/siparisler.txt <<'DATA'
  masa:1 urun:corba adet:2 fiyat:45
  masa:1 urun:salata adet:1 fiyat:60
  masa:2 urun:corba adet:1 fiyat:45
  masa:2 urun:kebap adet:2 fiyat:120
  masa:3 urun:salata adet:3 fiyat:60
  masa:3 urun:corba adet:1 fiyat:45
  masa:4 urun:kebap adet:1 fiyat:120
  masa:4 urun:salata adet:2 fiyat:60
  masa:5 urun:corba adet:4 fiyat:45
  masa:5 urun:kebap adet:1 fiyat:120
  DATA

goal_tr: >
  siparisler.txt dosyasindaki her masa icin masa_<no> adli bir alt dizin
  olusturup, o masaya ait satirlarin aynen kopyalandigi siparisler.txt
  dosyasini ve o masanin toplam tutarini (adet*fiyat toplamlari) sadece sayi
  olarak iceren toplam.txt dosyasini bu dizinlerin icine yaz; boylece masa_1
  ile masa_5 arasindaki her masa icin bir dizin olusan bir dizin yapisi uret

reference_solution: |
  cut -d' ' -f1 siparisler.txt | sort -u | while read -r alan; do
    masa=$(echo "$alan" | cut -d: -f2)
    mkdir -p "masa_$masa"
    grep "^masa:$masa " siparisler.txt > "masa_$masa/siparisler.txt"
    grep "^masa:$masa " siparisler.txt | awk -F'[ :]' '{toplam += $6 * $8} END {print toplam}' > "masa_$masa/toplam.txt"
  done
  wc -l siparisler.txt

outputs:
  - {path: masa_1/siparisler.txt, kind: file}
  - {path: masa_1/toplam.txt, kind: file}
  - {path: masa_2/siparisler.txt, kind: file}
  - {path: masa_2/toplam.txt, kind: file}
  - {path: masa_3/siparisler.txt, kind: file}
  - {path: masa_3/toplam.txt, kind: file}
  - {path: masa_4/siparisler.txt, kind: file}
  - {path: masa_4/toplam.txt, kind: file}
  - {path: masa_5/siparisler.txt, kind: file}
  - {path: masa_5/toplam.txt, kind: file}

checks:
  - {op: file_lines_eq, path: masa_1/siparisler.txt, value: ['masa:1 urun:corba adet:2 fiyat:45', 'masa:1 urun:salata adet:1 fiyat:60']}
  - {op: file_content_eq, path: masa_1/toplam.txt, value: '150'}
  - {op: file_lines_eq, path: masa_2/siparisler.txt, value: ['masa:2 urun:corba adet:1 fiyat:45', 'masa:2 urun:kebap adet:2 fiyat:120']}
  - {op: file_content_eq, path: masa_2/toplam.txt, value: '285'}
  - {op: file_lines_eq, path: masa_3/siparisler.txt, value: ['masa:3 urun:salata adet:3 fiyat:60', 'masa:3 urun:corba adet:1 fiyat:45']}
  - {op: file_content_eq, path: masa_3/toplam.txt, value: '225'}
  - {op: file_lines_eq, path: masa_4/siparisler.txt, value: ['masa:4 urun:kebap adet:1 fiyat:120', 'masa:4 urun:salata adet:2 fiyat:60']}
  - {op: file_content_eq, path: masa_4/toplam.txt, value: '240'}
  - {op: file_lines_eq, path: masa_5/siparisler.txt, value: ['masa:5 urun:corba adet:4 fiyat:45', 'masa:5 urun:kebap adet:1 fiyat:120']}
  - {op: file_content_eq, path: masa_5/toplam.txt, value: '300'}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4003
    bundle: say
    tools:
    - grep
    - wc
    konu: restoran-siparisleri
    hedef: denetle
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
