id: gen-s-3184-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  defter klasöründeki adı .tsv ile biten dosyaların tümünde ilk kolondaki hesap adlarını birlikte grupla ve her hesap için toplam geçiş sayısını hesapla. Sonucu, her satırda hesap adı ve sekme ile ayrılmış sayı olacak biçimde, hesap adına göre artan sırada sayim.tsv dosyasına yaz.

setup: |
  mkdir -p defter
  cat > defter/ocak.tsv <<'TSV'
  kasa	100
  bankalar	250
  kasa	50
  satislar	400
  TSV
  cat > defter/subat.tsv <<'TSV'
  bankalar	75
  satislar	300
  kasa	25
  satislar	100
  TSV
  cat > defter/notlar.txt <<'TXT'
  bu dosya tsv degil, atlanmali
  kasa	999
  TXT

goal_tr: >
  defter klasorundeki adi .tsv ile biten her dosyadaki hesap adlarini (ilk
  kolon) tum dosyalar uzerinde birlikte gruplayip her hesap icin toplam
  gecis sayisini bul ve sonucu hesap<TAB>sayi biciminde, hesap adina gore
  artan sirali olarak sayim.tsv dosyasina yaz.

reference_solution: |
  cat defter/*.tsv | cut -f1 | sort | uniq -c | awk '{print $2 "\t" $1}' | sort > sayim.tsv

outputs:
  - {path: sayim.tsv, kind: file}

checks:
  - {op: file_lines_eq, path: sayim.tsv, value: ["bankalar\t2", "kasa\t3", "satislar\t3"]}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3184
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: muhasebe-kalemleri
    hedef: grupla-say
    girdi: tsv
    kaynak: cok-dosya
    cikti: yeniden-adlandirilmis
    kesif: veriye-bak
    uslup: duz-hedef
    direnc: yok
    bukulme: tuzak-dosya
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
