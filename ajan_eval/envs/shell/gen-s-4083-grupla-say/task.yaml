id: gen-s-4083-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  kayitlar dizinindeki tüm .txt dosyalarında ikinci alanı randevu olan satırları ele al; bu satırların üçüncü alanındaki poliklinik adlarını gruplayıp her poliklinik adının kaç kez geçtiğini, artan adım numarasıyla birlikte "adım sayısı" biçiminde poliklinik_sayilari.txt dosyasına yaz.

setup: |
  mkdir -p kayitlar
  cat > kayitlar/randevu_01.txt <<'TXT'
  2010 randevu kardiyoloji
  2015 randevu noroloji
  2030 randevu kardiyoloji
  TXT
  cat > kayitlar/randevu_02.txt <<'TXT'
  2010 randevu ortopedi
  2045 randevu kardiyoloji
  2100 randevu noroloji
  TXT
  cat > kayitlar/randevu_03.txt <<'TXT'
  2015 randevu ortopedi
  2030 randevu ortopedi
  2100 randevu kardiyoloji
  TXT

goal_tr: >
  kayitlar dizinindeki tum .txt dosyalarinda ikinci alani randevu olan
  satirlarin ucuncu alanindaki poliklinik adlarini gruplayip her poliklinik
  icin kac kez gectigini "adim sayisi" biciminde artan adim numarasiyla
  birlikte poliklinik_sayilari.txt dosyasina yaz

reference_solution: |
  find kayitlar -type f -name '*.txt' -exec cat {} + > tum_kayitlar.txt
  awk '$2 == "randevu" { print $3 }' tum_kayitlar.txt > poliklinikler.txt
  sort poliklinikler.txt | uniq -c > gecici_sayim.txt
  wc -l < gecici_sayim.txt > toplam.txt
  awk '{ print NR, $2, $1 }' gecici_sayim.txt > poliklinik_sayilari.txt

outputs:
  - {path: poliklinik_sayilari.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: poliklinik_sayilari.txt, value: [1 kardiyoloji 4, 2 noroloji 2, 3 ortopedi 3]}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4083
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: hastane-randevulari
    hedef: grupla-say
    girdi: duz-metin
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: bom
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
