id: gen-s-7064-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  notlar dizinindeki her CSV dosyasını ele al. Her dosyanın ilk satırını başlık, sonraki satırlarını veri olarak ayır ve her dosya için başlığı ile veri satırlarından ilkini tek bir JSON nesnesi olarak notlar/ozet.json dosyasına yaz. Boş olan dosyalarda başlık ve ilk satır null olsun.

setup: |
  mkdir -p notlar
  cat > notlar/notlar.csv <<'CSV'
  ad,soyad,not
  ayse,yilmaz,85
  mehmet,demir,72
  zeynep,kaya,91
  ali,celik,64
  fatma,ozturk,78
  can,arslan,55
  CSV
  touch notlar/bos.csv

goal_tr: >
  notlar dizinindeki her CSV dosyasi icin ilk satiri baslik, sonraki
  satirlari veri olarak ayirip, her dosyanin basligini ve veri satirlarindan
  ilkini tek bir JSON nesnesi olarak notlar/ozet.json dosyasina yaz; bos
  dosyalar icin baslik ve ilk satir null olsun.

reference_solution: |
  for f in $(find notlar -name '*.csv' | sort); do
    b=$(head -n 1 "$f")
    v=$(tail -n +2 "$f" | head -n 1)
    printf '%s\t%s\n' "${b:-null}" "${v:-null}"
  done > notlar/gecici.tsv
  awk -F'\t' 'BEGIN{print "{"} {gsub(/"/,"\\\"",$1); gsub(/"/,"\\\"",$2); printf "%s  \"%s\": {\"baslik\": \"%s\", \"ilk_satir\": \"%s\"}", (NR>1?",\n":""), FILENAME, $1, $2} END{print "\n}"}' notlar/gecici.tsv > notlar/ozet.json
  rm notlar/gecici.tsv

outputs:
  - {path: notlar/ozet.json, kind: json}

checks:
  - {op: json_eq, path: notlar/ozet.json, value: {notlar/gecici.tsv: {baslik: 'ad,soyad,not', ilk_satir: 'ayse,yilmaz,85'}}}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7064
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: ogrenci-notlari
    hedef: bol
    girdi: csv
    kaynak: dizin-agaci
    cikti: json
    kesif: yok
    uslup: kisit-sakli
    direnc: bos-dosya
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
