id: gen-s-3152-toplu-yeniden-adlandir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  arsiv dizini altındaki tüm .ini dosyalarını incele; her birinin içindeki sicaklik değerine bak. sicaklik değeri 10'dan büyük olan dosyaların sayısını bul ve bu sayıyı sonuc.txt dosyasına yalnızca sayı olarak yaz.

setup: |
  mkdir -p arsiv
  cat > arsiv/istanbul.ini <<'INI'
  sehir=istanbul
  sicaklik=14
  durum=parcali_bulutlu
  INI
  cat > arsiv/ankara.ini <<'INI'
  sehir=ankara
  sicaklik=9
  durum=yagmurlu
  INI
  cat > arsiv/izmir.ini <<'INI'
  sehir=izmir
  sicaklik=18
  durum=gunesli
  INI

goal_tr: >
  arsiv dizini altindaki .ini dosyalarindan her birinin icindeki sicaklik
  degerini okuyup, sicakligi 10'dan buyuk olan dosya sayisini sonuc.txt'ye
  sadece sayi olarak yaz.

reference_solution: |
  find arsiv -name '*.ini' -print0 | xargs -0 -I{} awk -F= '$1=="sicaklik" && $2+0>10 {print FILENAME}' {} > gecici.txt
  wc -l < gecici.txt > sonuc.txt
  rm gecici.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '2'}

metadata:
  domain: toplu-yeniden-adlandir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3152
    bundle: bul-tasi
    tools:
    - find
    - xargs
    konu: hava-durumu-kayitlari
    hedef: toplu-yeniden-adlandir
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
