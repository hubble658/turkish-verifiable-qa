id: gen-s-4161-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) sensor_a.txt ve sensor_b.txt dosyalarındaki S01, S02, S03 sensör değerlerini karşılaştır.

  2) Yalnızca iki dosyada da aynı olan değerleri "SXX:NNNNNN" biçiminde esit.txt dosyasına yaz.

  3) Yalnızca sensor_a.txt dosyasında olan değerleri "SXX:NNNNNN" biçiminde sadece_a.txt dosyasına yaz.

  4) Yalnızca sensor_b.txt dosyasında olan değerleri "SXX:NNNNNN" biçiminde sadece_b.txt dosyasına yaz.

setup: |
  cat > sensor_a.txt <<'EOF'
  S01:000123
  S02:000456
  S03:000789
  EOF
  cat > sensor_b.txt <<'EOF'
  S01:000111
  S02:000456
  S03:000999
  EOF

goal_tr: >
  sensor_a.txt ve sensor_b.txt dosyalarindaki S01,S02,S03 sensor degerlerini
  karsilastirip, yalnizca iki dosyada ayni olan degerleri esit.txt, yalnizca
  sensor_a.txt'de olanlari sadece_a.txt, yalnizca sensor_b.txt'de olanlari
  sadece_b.txt dosyalarina "SXX:NNNNNN" biciminde yaz.

reference_solution: |
  cut -d: -f2 sensor_a.txt | rev > /tmp/a_rev.txt
  cut -d: -f2 sensor_b.txt | rev > /tmp/b_rev.txt
  paste /tmp/a_rev.txt /tmp/b_rev.txt | awk '$1==$2 {print $1}' | rev | sed 's/^/S/' > /tmp/esit_val.txt
  paste /tmp/a_rev.txt /tmp/b_rev.txt | awk '$1!=$2 {print $1}' | rev | sed 's/^/S/' > /tmp/sadece_a_val.txt
  paste /tmp/a_rev.txt /tmp/b_rev.txt | awk '$1!=$2 {print $2}' | rev | sed 's/^/S/' > /tmp/sadece_b_val.txt
  nl -ba /tmp/esit_val.txt | awk '{print "S0"$1":"$2}' | cut -d: -f1,3 > /tmp/esit_out.txt
  # Daha basit ve dogru: dogrudan sensor id ile eslestir
  cat > /tmp/build.sh <<'SH'
  i=0
  while read line; do
    i=$((i+1))
    id=$(printf "S%02d" $i)
    val=$(echo "$line" | cut -d: -f2)
    echo "$id:$val"
  done
  SH
  paste sensor_a.txt sensor_b.txt | awk -F'[: \t]+' '{if($2==$4) print $1":"$2}' > esit.txt
  paste sensor_a.txt sensor_b.txt | awk -F'[: \t]+' '{if($2!=$4) print $1":"$2}' > sadece_a.txt
  paste sensor_a.txt sensor_b.txt | awk -F'[: \t]+' '{if($2!=$4) print $3":"$4}' > sadece_b.txt

outputs:
  - {path: esit.txt, kind: file}
  - {path: sadece_a.txt, kind: file}
  - {path: sadece_b.txt, kind: file}

checks:
  - {op: file_content_eq, path: esit.txt, value: 'S02:000456'}
  - {op: file_lines_eq, path: sadece_a.txt, value: ['S01:000123', 'S03:000789']}
  - {op: file_lines_eq, path: sadece_b.txt, value: ['S01:000111', 'S03:000999']}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4161
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: sensor-olcumleri
    hedef: donustur
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: birden-cok-dosya
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
