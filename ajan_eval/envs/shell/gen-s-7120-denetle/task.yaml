id: gen-s-7120-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Lojistik ekibi bugün şehir bazlı rota planlamasını yeniden gözden geçiriyordu; sabah toplantısında kargo kayıtlarındaki şehir çiftlerinin hangi saatlerle örtüştüğünü bir türlü net göremediklerinden yakındılar. Ben de öğleden sonrayı bu eşleştirmeyi düzenli çıktılara dökmeye ayırdım. /workspace altındaki veri dizininde kargo.log ve rota.log dosyaları duruyor; bunları kullanarak iki ayrı sonuç dosyası hazırlamanı istiyorum.

  veri dizinindeki kargo.log ve rota.log dosyalarını bulup birleştirerek, her kargo satırındaki şehir çiftini rota.log'daki saat değeriyle eşleştir ve sonucu cikti/rota_eslesme.txt dosyasına "kargo_kodu cift saat" biçiminde yaz. Eşleşmeyen kargo kodlarını ise cikti/eslesmeyen.txt dosyasına yalnızca kargo kodu olacak şekilde, her satırda bir tane olacak biçimde yaz.

setup: |
  mkdir -p veri cikti
  cat > veri/kargo.log <<'LOG'
  K001 ISTANBUL ANKARA 10:00
  K002 ANKARA IZMIR 11:00
  K003 IZMIR ISTANBUL 12:00
  K004 ANKARA ISTANBUL 13:00
  K005 BURSA ANKARA 14:00
  LOG
  cat > veri/rota.log <<'LOG'
  ISTANBUL ANKARA 6
  ANKARA IZMIR 8
  IZMIR ISTANBUL 10
  ANKARA ISTANBUL 5
  LOG

goal_tr: >
  veri altindaki kargo.log ve rota.log dosyalarini find ile bulup xargs ile
  birlestirerek, her kargo satirindaki sehir ciftini rota.log'daki saat
  degeriyle eslestirip cikti/rota_eslesme.txt dosyasina "kargo_kodu cift
  saat" biciminde yaz ve eslesmeyen kargo kodlarini cikti/eslesmeyen.txt
  dosyasina sadece kargo kodu olarak yaz

reference_solution: |
  find veri -name 'kargo.log' -o -name 'rota.log' | sort | xargs cat > /tmp/birlesik.txt
  awk 'BEGIN{while((getline line < "cikti/eslesmeyen.txt")>0){} }' /dev/null 2>/dev/null; rm -f cikti/eslesmeyen.txt
  awk 'NR==FNR{r[$1" "$2]=$3; next} {k=$2" "$3; if(k in r) print $1, k, r[k]; else print $1 >> "cikti/eslesmeyen.txt"}' veri/rota.log veri/kargo.log > cikti/rota_eslesme.txt
  touch cikti/eslesmeyen.txt

outputs:
  - {path: cikti/rota_eslesme.txt, kind: file}
  - {path: cikti/eslesmeyen.txt, kind: file}

checks:
  - {op: file_content_eq, path: cikti/eslesmeyen.txt, value: K005}
  - {op: file_lines_eq, path: cikti/rota_eslesme.txt, value: [K001 ISTANBUL ANKARA 6, K002 ANKARA IZMIR 8, K003 IZMIR ISTANBUL 10, K004 ANKARA ISTANBUL 5]}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7120
    bundle: bul-tasi
    tools:
    - find
    - xargs
    konu: kargo-takibi
    hedef: denetle
    girdi: log-satiri
    kaynak: iki-dosya-capraz
    cikti: birden-cok-dosya
    kesif: dosyayi-bul
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
