id: gen-s-7327-dogrula
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  kargolar.tsv dosyasındaki satırlardan DURUM alanı TESLIM olanların TAKIP değerlerini, başlık satırı olmadan, her satırda bir takip numarası olacak şekilde teslim.txt dosyasına yaz.

  Şu şartlar sağlanmalı:
  - /workspace dizininde teslim.txt dosyası oluşturulmalı.
  - teslim.txt içinde yalnızca DURUM alanı TESLIM olan satırların TAKIP değerleri bulunmalı.
  - teslim.txt içinde başlık satırı yer almamalı.
  - Her satırda yalnızca bir takip numarası olmalı.

setup: |
  cat > kargolar.tsv <<'TSV'
  TAKIP	SEHIR	DURUM
  TR100	ANKARA	TESLIM
  TR101	IZMIR	DAGITIM
  TR102	ANKARA	BEKLEMEDE
  TR103	ISTANBUL	TESLIM
  TR104	IZMIR	TESLIM
  TSV

goal_tr: >
  kargolar.tsv dosyasindaki satirlardan DURUM alani TESLIM olanlarin TAKIP
  degerlerini, baslik satiri olmadan, her satirda bir takip numarasi olacak
  sekilde teslim.txt dosyasina yaz

reference_solution: |
  sed '1d' kargolar.tsv | tr '\t' ' ' | awk '$3=="TESLIM"{print $1}' > teslim.txt

outputs:
  - {path: teslim.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: teslim.txt, value: [TR100, TR103, TR104]}

metadata:
  domain: dogrula
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7327
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: kargo-takibi
    hedef: dogrula
    girdi: tsv
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
