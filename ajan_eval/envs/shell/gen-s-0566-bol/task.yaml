  {"hastane":"Merkez","randevular":[

  {"id":1,"hasta":"Ali Veli","bolum":"Kardiyoloji","durum":"onaylandi"},

  {"id":2,"hasta":"Ayse Yilmaz","bolum":"Dermatoloji","durum":"beklemede"},

  {"id":3,"hasta":"Mehmet Kaya","bolum":"Kardiyoloji","durum":"iptal"},

  {"id":4,"hasta":"Fatma Demir","bolum":"Noroloji","durum":"onaylandi"},

  {"id":5,"hasta":"Hasan Celik","bolum":"Dermatoloji","durum":"onaylandi"},

  {"id":6,"hasta":"Zeynep Arslan","bolum":"Kardiyoloji","durum":"beklemede"},

  {"id":7,"hasta":"Emre Sahin","bolum":"Noroloji","durum":"onaylandi"},

  {"id":8,"hasta":"Elif Ozturk","bolum":"Kardiyoloji","durum":"onaylandi"}

  ]}

  JSON

  '
goal_tr: 'randevular.json icindeki durum degeri "onaylandi" olan randevularin bolum degerlerini tekrarsiz ve alfabetik sirali
  olarak, her satirda bir bolum olacak sekilde bolumler.txt dosyasina yaz; ayrica bu bolumlerin toplam sayisini sadece sayi
  olarak bolum_sayisi.txt dosyasina yaz.

  '
reference_solution: 'python3 - <<''PY''

  import json

  r = json.load(open("randevular.json"))["randevular"]

  b = sorted({x["bolum"] for x in r if x["durum"] == "onaylandi"})

  open("bolumler.txt", "w").write("".join(k + "\n" for k in b))

  open("bolum_sayisi.txt", "w").write(f"{len(b)}\n")

  PY

  '
