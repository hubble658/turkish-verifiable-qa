id: gen-s-7092-dogrula
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  muhasebe/kalemler.txt dosyasındaki sabit genişlikli kayıtları doğrula. Her satırın ilk alanı 4 haneli hesap kodu, ikinci alanı ALACAK veya BORC, üçüncü alanı 1 ile 9999999 arasında bir tam sayı olmalı. Geçerli satırları muhasebe/gecerli/ dizinine hesap kodu adiyla, geçersiz satırları muhasebe/gecersiz/ dizinine satır numarası adiyla yaz.

setup: |
  mkdir -p muhasebe
  cat > muhasebe/kalemler.txt <<'DATA'
  1001 ALACAK      1250000
  1002 BORC         340500
  1003 ALACAK       98000
  1004 BORC             0
  1005 ALACAK      777700
  1006 BORC         12345
  1007 ALACAK          50
  DATA

goal_tr: >
  muhasebe/kalemler.txt icindeki sabit genislikli kayitlari dogrula; her
  satirin ilk alani 4 haneli hesap kodu, ikinci alani ALACAK veya BORC,
  ucuncu alani 1 ile 9999999 arasinda bir tam sayi olmali ve gecerli
  satirlari muhasebe/gecerli/ dizinine hesap kodu adiyla, gecersiz satirlari
  muhasebe/gecersiz/ dizinine satir numarasi adiyla yaz.

reference_solution: |
  mkdir -p muhasebe/gecerli muhasebe/gecersiz
  awk '{ ok = ($1 ~ /^[0-9][0-9][0-9][0-9]$/ && ($2 == "ALACAK" || $2 == "BORC") && $3 ~ /^[0-9]+$/ && $3+0 >= 1 && $3+0 <= 9999999); if (ok) print $0 > ("muhasebe/gecerli/" $1); else print $0 > ("muhasebe/gecersiz/" NR) }' muhasebe/kalemler.txt

outputs:
  - {path: muhasebe/gecerli, kind: dir}
  - {path: muhasebe/gecersiz, kind: dir}

checks:
  - {op: dir_entries_eq, path: muhasebe/gecerli, value: ['1001', '1002', '1003', '1005', '1006', '1007']}
  - {op: dir_entries_eq, path: muhasebe/gecersiz, value: ['4']}

metadata:
  domain: dogrula
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7092
    bundle: awk
    tools:
    - awk
    konu: muhasebe-kalemleri
    hedef: dogrula
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
