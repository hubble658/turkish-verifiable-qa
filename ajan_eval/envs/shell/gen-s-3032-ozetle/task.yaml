id: gen-s-3032-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) siparisler.txt dosyasındaki her satırda adet ile fiyatı çarparak satır tutarını hesapla.
  2) Aynı masa numarasına ait satır tutarlarını toplayarak her masa için toplam tutarı bul.
  3) En yüksek toplam tutara sahip masanın numarasını tek sayı olarak masa.txt dosyasına yaz.

setup: |
  cat > siparisler.txt <<'DATA'
  masa:4 urun:corba adet:2 fiyat:45
  masa:1 urun:salata adet:1 fiyat:60
  masa:4 urun:salata adet:1 fiyat:60
  masa:2 urun:corba adet:3 fiyat:45
  masa:1 urun:corba adet:2 fiyat:45
  masa:4 urun:corba adet:1 fiyat:45
  masa:2 urun:salata adet:2 fiyat:60
  masa:3 urun:corba adet:1 fiyat:45
  masa:1 urun:salata adet:2 fiyat:60
  masa:3 urun:salata adet:1 fiyat:60
  DATA

goal_tr: >
  siparisler.txt dosyasindaki her satirda adet ve fiyat carpilip satir
  tutari bulunur, ayni masa numarasina ait tutarlar toplanir ve en yuksek
  toplam tutara sahip masanin numarasi tek sayi olarak masa.txt dosyasina
  yazilir

reference_solution: |
  python3 - <<'PY'
  toplam = {}
  with open('siparisler.txt') as f:
      for satir in f:
          p = satir.split()
          masa = p[0].split(':')[1]
          adet = int(p[2].split(':')[1])
          fiyat = int(p[3].split(':')[1])
          toplam[masa] = toplam.get(masa, 0) + adet * fiyat
  en = max(toplam, key=lambda m: toplam[m])
  with open('masa.txt', 'w') as out:
      out.write(en + '\n')
  PY

outputs:
  - {path: masa.txt, kind: file}

checks:
  - {op: file_content_eq, path: masa.txt, value: '1'}

