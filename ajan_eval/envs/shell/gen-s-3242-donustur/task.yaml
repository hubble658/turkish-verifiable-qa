id: gen-s-3242-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) girdi/sicaklik.txt ve girdi/nem.txt dosyalarını oku.
  2) İki dosyada da geçen ortak sensör kimliklerini belirle.
  3) Ortak sensörlerin her biri için önce nem, sonra sıcaklık değerini "sicaklik nem" sırasıyla değil, ters çevrilmiş biçimde yaz.
  4) Sonucu cikti/satirlar.txt dosyasına, her satırda bir sensör olacak şekilde kaydet.

setup: |
  mkdir -p girdi cikti
  cat > girdi/sicaklik.txt <<'DATA'
  s1 21
  s2 18
  s3 25
  DATA
  cat > girdi/nem.txt <<'DATA'
  s1 40
  s2 55
  s3 30
  DATA

goal_tr: >
  girdi/sicaklik.txt ve girdi/nem.txt dosyalarindaki sensor kimliklerini
  karsilastirip her iki dosyada da gecen sensorler icin sicaklik ve nem
  degerlerini ters cevrilmis bicimde cikti/satirlar.txt dosyasina "sicaklik
  nem" sirasiyla yaz.

reference_solution: |
  cut -d' ' -f1 girdi/sicaklik.txt | sort > /tmp/a.txt
  cut -d' ' -f1 girdi/nem.txt | sort > /tmp/b.txt
  comm -12 /tmp/a.txt /tmp/b.txt > /tmp/ortak.txt
  join /tmp/ortak.txt girdi/sicaklik.txt | join - girdi/nem.txt | awk '{print $2, $3}' | rev > cikti/satirlar.txt

outputs:
  - {path: cikti/satirlar.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: cikti/satirlar.txt, value: [04 12, 55 81, 03 52]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3242
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: sensor-olcumleri
    hedef: donustur
    girdi: duz-metin
    kaynak: iki-dosya-capraz
    cikti: satir-listesi
    kesif: dolayli-hedef
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
