id: gen-s-4038-birlestir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) vardiya/personel.txt dosyasını oku ve burada tanımlı personel numaralarını belirle.
  2) vardiya/gun1/kayit.txt ve vardiya/gun2/kayit.txt dosyalarını oku ve bu dosyalarda geçen personel numaralarını belirle.
  3) 1. ve 2. adımda belirlenen numaralardan yalnızca personel.txt içinde tanımlı olanlar arasından benzersiz olanların sayısını hesapla.
  4) Hesapladığın benzersiz personel numarası sayısını sonuc.txt dosyasına sadece sayı olacak şekilde yaz.

setup: |
  mkdir -p vardiya/gun1 vardiya/gun2
  cat > vardiya/gun1/kayit.txt <<'EOF'
  101 sabah
  102 aksam
  103 gece
  EOF
  cat > vardiya/gun2/kayit.txt <<'EOF'
  102 sabah
  104 gece
  105 aksam
  EOF
  cat > vardiya/personel.txt <<'EOF'
  101 Ayse
  102 Burak
  103 Ceren
  104 Deniz
  105 Efe
  EOF

goal_tr: >
  vardiya dizinindeki gun1 ve gun2 alt dizinlerindeki kayit.txt dosyalarinda
  gecen ve personel.txt icinde tanimli olan benzersiz personel numarasi
  sayisini sonuc.txt'ye sadece sayi olarak yaz

reference_solution: |
  cat vardiya/gun1/kayit.txt vardiya/gun2/kayit.txt | awk '{print $1}' | sort -u > /tmp/aktif.txt
  cut -d' ' -f1 vardiya/personel.txt | sort -u > /tmp/tum.txt
  join /tmp/aktif.txt /tmp/tum.txt | wc -l > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '5'}

metadata:
  domain: birlestir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4038
    bundle: birlestir
    tools:
    - join
    - sort
    konu: personel-vardiyalari
    hedef: birlestir
    girdi: log-satiri
    kaynak: dizin-agaci
    cikti: tek-sayi
    kesif: dolayli-hedef
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
