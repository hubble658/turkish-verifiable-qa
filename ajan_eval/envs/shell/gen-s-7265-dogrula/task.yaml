goal_tr: >
  kayitlar.txt dosyasindaki satirlardan yalnizca ilk alani gecerli bir il
  kodu olanlari birak; kalan satirlarin ilk alanlarini tekrarsiz olarak say
  ve sonuc.txt dosyasina sadece bu sayiyi yaz.

reference_solution: |
  grep -E '^[A-Z]{3} ' kayitlar.txt | cut -d' ' -f1 | sort -u > gecici.txt
  wc -l < gecici.txt > sonuc.txt
  rm -f gecici.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '6'}

