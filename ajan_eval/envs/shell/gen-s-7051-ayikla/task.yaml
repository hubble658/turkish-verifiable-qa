id: gen-s-7051-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi/kalemler.txt ile girdi/eslesme.txt dosyalarını kalem numarasına göre birleştir; her satır "HESAP-tutar" biçiminde olsun ve tutarın rakamları ters yazılsın. girdi/bos.txt boş olduğu için atlanacak, sonuç girdi/ayiklanmis.txt dosyasına yazılacak.

setup: |
  mkdir -p girdi
  cat > girdi/kalemler.txt <<'KALEM'
  1001|alacak|1250
  1002|borc|430
  1003|alacak|980
  KALEM
  cat > girdi/eslesme.txt <<'ESLE'
  1001|KASA
  1002|BANKA
  1003|KASA
  ESLE
  : > girdi/bos.txt

goal_tr: >
  girdi/kalemler.txt ile girdi/eslesme.txt dosyalarini kalem numarasina gore
  birlestirip her satiri "HESAP-tutar" biciminde ve tutari ters cevrilmis
  rakamlarla yazan, girdi/bos.txt bos oldugu icin onu atlayan sonucu
  girdi/ayiklanmis.txt dosyasina uret

reference_solution: |
  cut -d'|' -f1,2,3 girdi/kalemler.txt > /tmp/k.txt
  cut -d'|' -f1,2 girdi/eslesme.txt > /tmp/e.txt
  join -t'|' -1 1 -2 1 /tmp/k.txt /tmp/e.txt | while IFS='|' read -r no yon tutar hesap; do
    printf '%s-%s\n' "$hesap" "$(printf '%s' "$tutar" | rev)"
  done > girdi/ayiklanmis.txt
  if [ ! -s girdi/bos.txt ]; then cat girdi/bos.txt >> girdi/ayiklanmis.txt; fi

outputs:
  - {path: girdi/ayiklanmis.txt, kind: file, run: cat girdi/ayiklanmis.txt}

checks:
  - {op: file_lines_eq, path: girdi/ayiklanmis.txt, value: [KASA-0521, BANKA-034, KASA-089]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7051
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: muhasebe-kalemleri
    hedef: ayikla
    girdi: log-satiri
    kaynak: iki-dosya-capraz
    cikti: yeniden-adlandirilmis
    kesif: yok
    uslup: terse
    direnc: bos-dosya
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
