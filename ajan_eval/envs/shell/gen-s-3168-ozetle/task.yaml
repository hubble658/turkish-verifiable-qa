id: gen-s-3168-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi/depo_a.csv ve girdi/depo_b.csv dosyalarındaki ürün satırlarını ürün anahtarı üzerinden birleştir; her ürün için toplam adedi ve toplam tutarı (adet × fiyat) hesapla. Sonucu, başlık satırı urun,toplam_adet,toplam_tutar olan bir CSV olarak cikti/envanter_ozet.csv dosyasına yaz. Başlık satırları ve girdi/notlar.csv gibi geçerli sütun yapısı olmayan dosyalar dikkate alınmasın. Çıktı, ürün adına göre alfabetik sıralı olsun.

  Şu şartlar sağlanmalı:
  - cikti/envanter_ozet.csv dosyası oluşturulmuş olmalı.
  - Dosyanın ilk satırı tam olarak urun,toplam_adet,toplam_tutar başlığını içermeli.
  - girdi/depo_a.csv ve girdi/depo_b.csv içindeki tüm geçerli ürün satırları birleştirilmiş olmalı; aynı ürün adı tek satırda toplanmalı.
  - Her ürün için toplam_adet, o ürünün tüm depolardaki adetlerinin toplamı olmalı.
  - Her ürün için toplam_tutar, o ürünün her satırındaki adet × fiyat değerlerinin toplamı olmalı.
  - girdi/notlar.csv ve başlık satırları çıktıya dahil edilmemeli.
  - Çıktı satırları ürün adına göre alfabetik olarak sıralanmış olmalı.

setup: |
  mkdir -p girdi
  cat > girdi/depo_a.csv <<'CSV'
  urun,adet,fiyat
  kalem,10,5
  defter,3,20
  silgi,7,2
  CSV
  cat > girdi/depo_b.csv <<'CSV'
  urun,adet,fiyat
  kalem,4,5
  defter,6,20
  makas,2,15
  CSV
  printf 'bu dosya tuzak\n' > girdi/notlar.csv

goal_tr: >
  girdi/depo_a.csv ve girdi/depo_b.csv dosyalarindaki urun satirlarini urun
  anahtari uzerinden birlestirip her urun icin toplam adedi ve toplam tutari
  (adet*fiyat) hesaplayarak urun,toplam_adet,toplam_tutar baslikli CSV
  olarak cikti/envanter_ozet.csv dosyasina yaz; baslik satirlari ve
  notlar.csv gibi gecerli sutun yapisi olmayan dosyalar dikkate alinmaz,
  cikti urun adina gore alfabetik sirali olur.

reference_solution: |
  mkdir -p cikti
  cat girdi/depo_a.csv girdi/depo_b.csv > /tmp/ham.csv
  python3 -c "
  import csv
  from collections import defaultdict
  adet = defaultdict(int)
  tutar = defaultdict(int)
  with open('/tmp/ham.csv') as f:
      for row in csv.reader(f):
          if len(row) != 3 or row[0] == 'urun':
              continue
          try:
              a = int(row[1]); p = int(row[2])
          except ValueError:
              continue
          adet[row[0]] += a
          tutar[row[0]] += a * p
  with open('/tmp/toplam.csv', 'w') as f:
      w = csv.writer(f)
      for u in sorted(adet):
          w.writerow([u, adet[u], tutar[u]])
  "
  { echo "urun,toplam_adet,toplam_tutar"; cat /tmp/toplam.csv; } > cikti/envanter_ozet.csv
  mv cikti/envanter_ozet.csv cikti/envanter_ozet_final.csv && mv cikti/envanter_ozet_final.csv cikti/envanter_ozet.csv

outputs:
  - {path: cikti/envanter_ozet.csv, kind: file}

checks:
  - {op: file_lines_eq, path: cikti/envanter_ozet.csv, value: ['urun,toplam_adet,toplam_tutar', 'defter,9,180', 'kalem,14,70', 'makas,2,30', 'silgi,7,14']}

