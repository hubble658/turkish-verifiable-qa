id: gen-s-7213-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) kitaplar klasöründeki tüm tsv dosyalarını, başlık satırı hariç, tek bir bütün halinde birleştir.

  2) Birleşen veriyi tür sütununa göre grupla ve her tür için toplam adet değerini hesapla.

  3) Sonucu, her satırda tür ve toplam_adet değerleri birer sekme ile ayrılmış olacak şekilde tur_toplam.tsv dosyasına yaz.

  4) Satırları tür adına göre artan sırada sırala.

  5) Dosyanın son satırının sonunda newline karakteri olmasın.

setup: |
  mkdir -p kitaplar
  printf 'kitap_id\ttur\tadet\n' > kitaplar/a.tsv
  printf 'K001\troman\t3\nK002\tsiir\t1\n' >> kitaplar/a.tsv
  printf 'kitap_id\ttur\tadet\n' > kitaplar/b.tsv
  printf 'K003\troman\t5\nK004\tdeneme\t2\n' >> kitaplar/b.tsv
  printf 'kitap_id\ttur\tadet\n' > kitaplar/c.tsv
  printf 'K005\tsiir\t4\nK006\troman\t2\n' >> kitaplar/c.tsv
  printf 'K007\tdeneme\t6' >> kitaplar/c.tsv

goal_tr: >
  kitaplar klasorundeki tum tsv dosyalarini baslik satiri haric birlestirip
  tur sutununa gore gruplayarak her tur icin "tur<TAB>toplam_adet"
  satirlarini tur adina gore artan sirada tur_toplam.tsv dosyasina yaz; son
  satirin sonunda newline olmasin.

reference_solution: |
  cd kitaplar
  { printf 'tur\tadet\n'; for f in $(printf '%s\n' *.tsv | sort); do tail -n +2 "$f"; done; } > /tmp/ham.tsv
  awk -F'\t' 'NR>1 { s[$2]+=$3 } END { for (t in s) printf "%s\t%d\n", t, s[t] }' /tmp/ham.tsv | sort > /tmp/ozet.tsv
  { printf 'tur\tadet\n'; cat /tmp/ozet.tsv; } > /tmp/tam.tsv
  for i in $(seq 1 1); do printf '%s' "$(cat /tmp/tam.tsv)" > /workspace/tur_toplam.tsv; done
  cd /workspace

outputs:
  - {path: tur_toplam.tsv, kind: file, run: cat tur_toplam.tsv}

checks:
  - {op: file_lines_eq, path: tur_toplam.tsv, value: ["tur\tadet", "deneme\t8", "roman\t10", "siir\t5"]}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7213
    bundle: uret
    tools:
    - printf
    - seq
    konu: kutuphane-kayitlari
    hedef: bol
    girdi: tsv
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: son-newline-yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
