id: gen-s-3123-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10
prompt: 'urunler.csv ve yorumlar.csv dosyalarını ürün kodu üzerinden birleştirip yorum puanı 3 ve üzeri olan kayıtların ürün
  adını ve yorum puanını sekmeyle ayrılmış biçimde iyi_yorumlar.txt dosyasına yaz.

  '
setup: 'cat > urunler.csv <<''CSV''

  P001,Klarnet,1299

  P002,Keman,2450

  P003,Flut,899

  P004,Trompet,1780

  P005,Bateri,3200

  CSV


  cat > yorumlar.csv <<''CSV''

  P003,5

  P001,4

  P004,3

  P003,2

  P005,5

  P002,4

  P001,1

  P005,3

  CSV

  '
goal_tr: 'urunler.csv ve yorumlar.csv dosyalarini urun kodu uzerinden birlestirip yorumu 3 ve uzeri olan kayitlarin urun adi
  ile yorum puanini sekmeyle ayrilmis olarak iyi_yorumlar.txt dosyasina yaz

  '
reference_solution: 'awk -F, ''NR==FNR {u[$1]=$2; next} $2>=3 {print u[$1] "\t" $2}'' urunler.csv yorumlar.csv > iyi_yorumlar.txt

  '
outputs: []
checks:
- op: file_lines_eq
  path: iyi_yorumlar.txt
  value:
  - "Flut\t5"
  - "Klarnet\t4"
  - "Trompet\t3"
  - "Bateri\t5"
  - "Keman\t4"
  - "Bateri\t3"
