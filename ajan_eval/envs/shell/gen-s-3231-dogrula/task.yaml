id: gen-s-3231-dogrula
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) girdi/personel.csv ve girdi/vardiyalar.csv dosyalarını id ve vardiya sütunlarına göre birleştir.

  2) Birleştirilen veriden her vardiya için o vardiyadaki personelin adını ve vardiyanın saatini al.

  3) gunduz vardiyasındaki her personel için cikti/gunduz.txt dosyasına her satırda bir kişi olacak şekilde "ad saat" biçiminde yaz.

  4) gece vardiyasındaki her personel için cikti/gece.txt dosyasına her satırda bir kişi olacak şekilde "ad saat" biçiminde yaz.

setup: |
  mkdir -p girdi cikti
  printf 'id,ad,vardiya\n1,Ali,gunduz\n2,Ayse,gece\n3,Can,gunduz\n4,Deniz,gece' > girdi/personel.csv
  printf 'vardiya,saat\ngece,20:00\ngunduz,08:00' > girdi/vardiyalar.csv

goal_tr: >
  girdi/personel.csv ile girdi/vardiyalar.csv dosyalarini id ve vardiya
  sutunlarina gore birlestirip her vardiya icin cikti/<vardiya>.txt
  dosyasina o vardiyadaki personelin adini ve vardiyanin saatini "ad saat"
  biciminde yaz.

reference_solution: |
  tr -d '\r' < girdi/personel.csv | tail -n +2 | while IFS=, read -r id ad vardiya; do saat=$(tr -d '\r' < girdi/vardiyalar.csv | sed -n "s/^${vardiya},//p"); printf '%s %s\n' "$ad" "$saat" >> "cikti/${vardiya}.txt"; done

outputs:
  - {path: cikti/gunduz.txt, kind: file}
  - {path: cikti/gece.txt, kind: file}

checks:
  - {op: file_content_eq, path: cikti/gece.txt, value: 'Ayse 20:00'}
  - {op: file_lines_eq, path: cikti/gunduz.txt, value: ['Ali 08:00', 'Can 08:00']}

metadata:
  domain: dogrula
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3231
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: personel-vardiyalari
    hedef: dogrula
    girdi: csv
    kaynak: iki-dosya-capraz
    cikti: birden-cok-dosya
    kesif: dosyayi-bul
    uslup: numarali-emir
    direnc: son-newline-yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
