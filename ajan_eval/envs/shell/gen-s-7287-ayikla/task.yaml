id: gen-s-7287-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  envanter.txt dosyasındaki "adet:" ile başlayan satırların son alanlarını, dosyadaki sıraları korunarak adetler.txt adlı bir satır listesine yaz. adetler.txt içinde her satırda bir adet değeri bulunsun ve bu değerler yalnızca sayı olsun.

setup: |
  cat > envanter.txt <<'EOF'
  depo: merkez
  urun: kalem
  adet: 120
  urun: defter
  adet: 45
  depo: sube
  urun: silgi
  adet: 30
  urun: kalem
  adet: 75
  urun: defter
  adet: 12
  EOF

goal_tr: >
  envanter.txt dosyasindaki "adet:" ile baslayan satirlarin son alanini,
  dosyadaki sirayla, adetler.txt adli satir listesine yaz.

reference_solution: |
  grep '^adet:' envanter.txt > gecici.txt
  head -n 5 gecici.txt | awk '{print $2}' > adetler.txt
  tail -n +1 adetler.txt > gecici2.txt
  mv gecici2.txt adetler.txt
  rm gecici.txt

outputs:
  - {path: adetler.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: adetler.txt, value: ['120', '45', '30', '75', '12']}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7287
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: envanter
    hedef: ayikla
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
