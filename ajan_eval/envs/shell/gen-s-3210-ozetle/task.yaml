id: gen-s-3210-ozetle
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi/sensorler.ini dosyasındaki sensör kodlarını girdi/olcumler.ini dosyasındaki ölçümlerle eşleştir ve yalnızca her iki dosyada da bulunan sensörler için "KOD TOPLAM" biçiminde, koda göre artan sırada satırlar halinde cikti/satirlar.txt dosyasına yaz. Yalnızca bir dosyada geçen kodlar ve toplamı olmayan kodlar dışarıda kalsın.

setup: |
  mkdir -p girdi cikti
  cat > girdi/sensorler.ini <<'INI'
  S01=depo
  S02=sera
  S03=atolye
  S04=depo
  INI
  cat > girdi/olcumler.ini <<'INI'
  S01=17
  S02=23
  S05=41
  S03=9
  S03=12
  S01=5
  S09=99
  S02=7
  INI

goal_tr: >
  girdi/sensorler.ini dosyasindaki sensor kodlarini girdi/olcumler.ini
  dosyasindaki olcumlerle eslestirip, yalnizca her iki dosyada da bulunan
  sensorler icin "KOD TOPLAM" biciminde, koda gore artan sirada satirlar
  halinde cikti/satirlar.txt dosyasina yaz; baska dosyada gecen kodlar ve
  toplami olmayan kodlar disarida kalsin.

reference_solution: |
  sort girdi/sensorler.ini > /tmp/sol.txt
  sort girdi/olcumler.ini > /tmp/sag.txt
  join -t= /tmp/sol.txt /tmp/sag.txt | awk -F= '{t[$1]+=$3} END {for (k in t) print k, t[k]}' | sort > cikti/satirlar.txt

outputs:
  - {path: cikti/satirlar.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: cikti/satirlar.txt, value: [S01 22, S02 30, S03 21]}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3210
    bundle: birlestir
    tools:
    - join
    - sort
    konu: sensor-olcumleri
    hedef: ozetle
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: tuzak-dosya
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
