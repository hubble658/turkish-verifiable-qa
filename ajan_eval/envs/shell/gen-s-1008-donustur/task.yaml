id: gen-s-1008-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  siparisler.log dosyasındaki her satır alan=değer çiftlerinden oluşuyor. Her satırı, alan adlarının anahtar olduğu bir JSON nesnesine çevirip bütün satırları bir JSON dizisi halinde siparisler.json dosyasına yazmanı istiyorum; bu arada adet ve fiyat alanları metin olarak değil sayı olarak yer almalı. Elimdeki kayıtların tamamı bu dosyada olsun.

setup: |
  cat > siparisler.log <<'LOG'
  masa=12|urun=mercimek-corbasi|adet=2|fiyat=45
  masa=3|urun=izgara-kofte|adet=1|fiyat=120
  masa=12|urun=ayran|adet=4|fiyat=15
  masa=7|urun=sezar-salata|adet=1|fiyat=85
  masa=3|urun=baklava|adet=2|fiyat=60
  LOG

goal_tr: >
  siparisler.log dosyasindaki her satiri alan adlari anahtar olan bir JSON
  nesnesine cevirip, satirlari JSON dizisi olarak siparisler.json dosyasina
  yaz; sayisal alanlar adet ve fiyat sayi olsun.

reference_solution: |
  cut -d'|' -f1 siparisler.log | rev | cut -d'=' -f1 | rev > /tmp/masa.txt
  cut -d'|' -f2 siparisler.log | rev | cut -d'=' -f1 | rev > /tmp/urun.txt
  cut -d'|' -f3 siparisler.log | rev | cut -d'=' -f1 | rev > /tmp/adet.txt
  cut -d'|' -f4 siparisler.log | rev | cut -d'=' -f1 | rev > /tmp/fiyat.txt
  paste -d'|' /tmp/masa.txt /tmp/urun.txt /tmp/adet.txt /tmp/fiyat.txt | awk -F'|' 'BEGIN{printf "["} {printf "%s{\"masa\":%s,\"urun\":\"%s\",\"adet\":%s,\"fiyat\":%s}", (NR>1?",":""), $1, $2, $3, $4} END{print "]"}' > siparisler.json

outputs:
  - {path: siparisler.json, kind: json}

checks:
  - {op: json_eq, path: siparisler.json, value: [{masa: 12, urun: mercimek-corbasi, adet: 2, fiyat: 45}, {masa: 3, urun: izgara-kofte, adet: 1, fiyat: 120}, {masa: 12, urun: ayran, adet: 4, fiyat: 15}, {masa: 7, urun: sezar-salata, adet: 1, fiyat: 85}, {masa: 3, urun: baklava, adet: 2, fiyat: 60}]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-1008
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: restoran-siparisleri
    hedef: donustur
    girdi: log-satiri
    kaynak: tek-dosya
    cikti: json
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
