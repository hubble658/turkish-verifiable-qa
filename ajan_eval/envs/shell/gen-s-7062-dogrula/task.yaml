id: gen-s-7062-dogrula
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) uyeler.json dosyasındaki her üyeyi "id|ad|email|yas" biçiminde tek satıra yaz.
  2) Email alanı "@ornek.com" ile biten üyeleri gecerli.txt dosyasına yaz.
  3) Email alanı "@ornek.com" ile bitmeyen üyeleri gecersiz.txt dosyasına yaz.

setup: |
  cat > uyeler.json <<'JSON'
  [
    {"id": 1, "ad": "Ali Veli", "email": "ali@ornek.com", "yas": 30},
    {"id": 2, "ad": "Ayse Fatma", "email": "ayse@ornek.com", "yas": 25},
    {"id": 3, "ad": "Can Deniz", "email": "can@ornek.com", "yas": 40},
    {"id": 4, "ad": "Derya Su", "email": "derya@ornek.com", "yas": 35},
    {"id": 5, "ad": "Emre Kaya", "email": "emre@ornek.com", "yas": 28}
  ]
  JSON
  printf '%s' "$(cat uyeler.json)" > uyeler.json

goal_tr: >
  uyeler.json dosyasindaki her uyeyi "id|ad|email|yas" biciminde tek satira
  yazip, email alani "@ornek.com" ile bitenleri gecerli.txt dosyasina ve
  bitmeyenleri gecersiz.txt dosyasina yaz

reference_solution: |
  sed -n 's/.*"id": \([0-9]*\), "ad": "\([^"]*\)", "email": "\([^"]*\)", "yas": \([0-9]*\).*/\1|\2|\3|\4/p' uyeler.json | tr -d '\r' > hepsi.txt
  grep '@ornek\.com$' hepsi.txt > gecerli.txt
  grep -v '@ornek\.com$' hepsi.txt > gecersiz.txt
  rm hepsi.txt

outputs:
  - {path: gecerli.txt, kind: file}
  - {path: gecersiz.txt, kind: file}

checks:
  - {op: is_file, path: gecerli.txt}
  - {op: file_lines_eq, path: gecersiz.txt, value: [1|Ali Veli|ali@ornek.com|30, 2|Ayse Fatma|ayse@ornek.com|25, 3|Can Deniz|can@ornek.com|40, 4|Derya Su|derya@ornek.com|35, 5|Emre Kaya|emre@ornek.com|28]}

metadata:
  domain: dogrula
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7062
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: kutuphane-kayitlari
    hedef: dogrula
    girdi: json
    kaynak: tek-dosya
    cikti: birden-cok-dosya
    kesif: yok
    uslup: numarali-emir
    direnc: son-newline-yok
    bukulme: olcek
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
