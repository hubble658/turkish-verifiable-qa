id: gen-s-3059-arsivle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi/bolgeler.log ile girdi/sunucular.log'u ilk alana göre birleştir; her bölge için arsiv/<bolge>/ altında sunucu adını içeren bolge.log oluştur ve tüm arsiv dizinini arsiv.tar.gz olarak sıkıştır.

setup: |
  mkdir -p girdi
  printf 'kuzey  01 BILGI acilis\nkuzey  02 HATA disk\nguney  03 BILGI giris\nguney  04 HATA zaman\ndogu   05 UYARI bellek\nbati   06 HATA baglanti\n' > girdi/bolgeler.log
  printf 'kuzey  sunucu1\nguney  sunucu2\ndogu   sunucu3\nbati   sunucu4\n' > girdi/sunucular.log

goal_tr: >
  girdi/bolgeler.log ile girdi/sunucular.log dosyalarini ilk alana gore
  birlestirip her bolge icin arsiv/<bolge>/ altinda sunucu adini iceren
  bolge.log dosyasini olustur ve tum arsiv dizinini gzip ile arsiv.tar.gz
  olarak sikistir

reference_solution: |
  mkdir -p arsiv
  join -1 1 -2 1 <(sort girdi/bolgeler.log) <(sort girdi/sunucular.log) | while read -r bolge kod seviye mesaj sunucu; do mkdir -p "arsiv/$bolge"; printf '%s %s %s %s\n' "$kod" "$seviye" "$mesaj" "$sunucu" >> "arsiv/$bolge/bolge.log"; done
  tar -cf - arsiv | gzip > arsiv.tar.gz

outputs:
  - {path: arsiv, kind: dir}
  - {path: arsiv.tar.gz, kind: file}

checks:
  - {op: dir_entries_eq, path: arsiv, value: [bati, dogu, guney, kuzey]}
  - {op: run_stdout_eq, cmd: tar -tzf arsiv.tar.gz | sort, value: 'arsiv/

    arsiv/bati/

    arsiv/bati/bolge.log

    arsiv/dogu/

    arsiv/dogu/bolge.log

    arsiv/guney/

    arsiv/guney/bolge.log

    arsiv/kuzey/

    arsiv/kuzey/bolge.log'}

metadata:
  domain: arsivle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3059
    bundle: arsiv
    tools:
    - tar
    - gzip
    konu: sunucu-loglari
    hedef: arsivle
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: dizin-yapisi
    kesif: yok
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
