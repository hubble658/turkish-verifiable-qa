id: gen-s-4028-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sunucu.log dosyasındaki her satırın son alanını ters çevir ve aynı ters çevrilmiş satır birden fazla kez geçiyorsa yalnızca ilk geçişi tut; bu benzersiz satırlardan oluşan listeyi ters.log dosyasına yaz. Bu işlemde tuzak.log dosyasını kullanma.

setup: |
  cat > sunucu.log <<'LOG'
  2024-01-01 BILGI basladi
  2024-01-02 HATA disk dolu
  2024-01-03 BILGI giris yapti
  2024-01-04 HATA disk dolu
  2024-01-05 UYARI bellek az
  2024-01-06 HATA baglanti koptu
  LOG
  cat > tuzak.log <<'LOG'
  2024-02-01 HATA tuzak bir
  2024-02-02 HATA tuzak iki
  LOG

goal_tr: >
  sunucu.log dosyasindaki her satirin son alanini ters cevirip, ayni ters
  cevrilmis satir birden fazla kez geciyorsa yalnizca ilk gecisi tutarak
  benzersiz satirlardan olusan listeyi ters.log dosyasina yaz (tuzak.log
  dosyasini kullanma).

reference_solution: |
  rev sunucu.log | cut -d' ' -f1 | awk '!seen[$0]++' > ters.log

outputs:
  - {path: ters.log, kind: lines}

checks:
  - {op: file_lines_eq, path: ters.log, value: [idalsab, ulod, itpay, za, utpok]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4028
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: sunucu-loglari
    hedef: donustur
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: veriye-bak
    uslup: kisit-sakli
    direnc: tekrar-eden-kayit
    bukulme: tuzak-dosya
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
