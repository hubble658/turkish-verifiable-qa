id: gen-s-4017-donustur
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  notlar.tar.gz arşivinin içindeki notlar.txt dosyasını kullan. Bu dosyadaki her satır "ad not" biçiminde; yani satırın başında bir ad, ardından bir sayı var. Bu satırların her birini {"ad": <ad>, "not": <sayi>} biçimindeki bir nesneye dönüştür ve tüm bu nesneleri geçerli bir JSON dizisi olarak notlar.json dosyasına yaz.

setup: |
  mkdir -p veri
  cat > veri/notlar.txt <<'TXT'
  ali 90
  veli 75
  ayse 88
  TXT
  tar -czf notlar.tar.gz veri/notlar.txt
  rm -rf veri

goal_tr: >
  notlar.tar.gz arsivindeki notlar.txt dosyasindaki her satiri "ad not"
  biciminden {"ad": <ad>, "not": <sayi>} bicimine donusturup notlar.json
  dosyasina gecerli bir JSON dizisi olarak yaz

reference_solution: |
  tar -xzf notlar.tar.gz
  gzip -dc notlar.tar.gz | tar -xO veri/notlar.txt | awk 'BEGIN{printf "["} {printf "%s{\"ad\": \"%s\", \"not\": %s}", (NR>1?",":""), $1, $2} END{printf "]\n"}' > notlar.json

outputs:
  - {path: notlar.json, kind: json}

checks:
  - {op: json_eq, path: notlar.json, value: [{ad: ali, not: 90}, {ad: veli, not: 75}, {ad: ayse, not: 88}]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4017
    bundle: arsiv
    tools:
    - tar
    - gzip
    konu: ogrenci-notlari
    hedef: donustur
    girdi: json
    kaynak: tarball
    cikti: json
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: olcek
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
