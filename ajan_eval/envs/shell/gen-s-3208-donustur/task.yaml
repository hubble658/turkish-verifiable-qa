id: gen-s-3208-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  siparisler klasöründeki her .txt dosyasını ayrı bir .csv dosyasına dönüştür. Çıktılar siparisler klasöründe aynı adla .csv uzantısıyla yer alsın: siparisler/ocak.csv, siparisler/subat.csv ve siparisler/mart.csv. Dönüştürme sırasında satır sonları CRLF'den LF'ye çevrilsin ve her çıktı dosyasındaki kayıtlar MASA değerlerine göre artan sırada olsun.

setup: |
  mkdir -p siparisler
  printf 'MASA|URUN|ADET\r\n1|corba|2\r\n2|kebap|1\r\n1|salata|1\r\n' > siparisler/ocak.txt
  printf 'MASA|URUN|ADET\r\n3|pizza|4\r\n2|cay|3\r\n3|makarna|2\r\n' > siparisler/subat.txt
  printf 'MASA|URUN|ADET\r\n1|kebap|1\r\n4|cay|5\r\n4|corba|2\r\n' > siparisler/mart.txt

goal_tr: >
  siparisler klasorundeki her .txt dosyasini ayri bir .csv dosyasina
  donustur; her cikti dosyasi siparisler klasorunde ayni adla .csv
  uzantisiyla yer alsin, CRLF satir sonlari LF olsun ve MASA degerlerine
  gore artan sirada olsun

reference_solution: |
  for i in $(seq 1 3); do
    case $i in
      1) b=ocak ;;
      2) b=subat ;;
      3) b=mart ;;
    esac
    f="siparisler/$b.txt"
    printf 'MASA,URUN,ADET\n' > "siparisler/$b.csv"
    tail -n +2 "$f" | tr -d '\r' | sort -t'|' -k1,1n | tr '|' ',' >> "siparisler/$b.csv"
  done

outputs:
  - {path: siparisler/ocak.csv, kind: file}
  - {path: siparisler/subat.csv, kind: file}
  - {path: siparisler/mart.csv, kind: file}

checks:
  - {op: file_lines_eq, path: siparisler/mart.csv, value: ['MASA,URUN,ADET', '1,kebap,1', '4,cay,5', '4,corba,2']}
  - {op: file_lines_eq, path: siparisler/ocak.csv, value: ['MASA,URUN,ADET', '1,corba,2', '1,salata,1', '2,kebap,1']}
  - {op: file_lines_eq, path: siparisler/subat.csv, value: ['MASA,URUN,ADET', '2,cay,3', '3,makarna,2', '3,pizza,4']}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3208
    bundle: uret
    tools:
    - printf
    - seq
    konu: restoran-siparisleri
    hedef: donustur
    girdi: json
    kaynak: cok-dosya
    cikti: birden-cok-dosya
    kesif: yok
    uslup: kisit-sakli
    direnc: crlf
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
