id: gen-s-3113-toplu-yeniden-adlandir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  gelen/siparisler.txt dosyasındaki her satırda geçen masa kodunu oku ve bu kodun gelen/masalar.txt içinde tanımlı masalardan birine ait olduğu durumda, ilgili satırı islenmis/ dizini altında masa koduyla aynı ada sahip bir dosyaya yönlendir. Sonrasında islenmis/ altında oluşan dosyaların sayısını sonuc.txt dosyasına yaz; bu dosyanın içeriği yalnızca sayıdan oluşsun, başka bir ifade ya da açıklama bulunmasın.

setup: |
  mkdir -p gelen islenmis
  cat > gelen/siparisler.txt <<'TXT'
  MASA-1 corba 2
  MASA-2 salata 1
  MASA-1 kebap 3
  MASA-3 corba 1
  MASA-2 kebap 2
  MASA-4 tatli 4
  MASA-3 salata 2
  MASA-1 tatli 1
  TXT
  cat > gelen/masalar.txt <<'TXT'
  MASA-1
  MASA-2
  MASA-3
  MASA-4
  MASA-5
  TXT

goal_tr: >
  gelen/siparisler.txt icindeki her satirda gecen masa kodunu,
  gelen/masalar.txt icinde tanimli olan masalarin islenmis/ altinda ayni
  adli dosyasina yonlendir ve islenmis/ altinda olusan dosya sayisini
  sonuc.txt'ye sadece sayi olarak yaz

reference_solution: |
  cut -d' ' -f1 gelen/siparisler.txt | sort -u > /tmp/aktif.txt
  comm -12 /tmp/aktif.txt <(sort gelen/masalar.txt) > /tmp/gecerli.txt
  while read -r masa; do
    hedef="$(dirname "islenmis/x")/$(basename "$masa").txt"
    grep "^$masa " gelen/siparisler.txt > "$hedef"
  done < /tmp/gecerli.txt
  ls islenmis | wc -l > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}
  - {path: islenmis, kind: dir}

checks:
  - {op: dir_entries_eq, path: islenmis, value: [MASA-1.txt, MASA-2.txt, MASA-3.txt, MASA-4.txt]}
  - {op: file_content_eq, path: sonuc.txt, value: '4'}

metadata:
  domain: toplu-yeniden-adlandir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3113
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: restoran-siparisleri
    hedef: toplu-yeniden-adlandir
    girdi: log-satiri
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
