id: gen-s-4086-birlestir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  muhasebe dizin ağacındaki .csv uzantılı gerçek kalem dosyasını bul, CRLF satır sonlarını temizle ve hesap kodu ile tutar sütunlarını hesaplar.txt'deki kod-isim çiftiyle kod üzerinden birleştirip kod, ad, tutar alanlarını içeren geçerli bir JSON dizisi olarak muhasebe/ozet.json dosyasına yaz.

setup: |
  mkdir -p muhasebe/2024
  cat > muhasebe/2024/hesaplar.txt <<'EOF'
  100 KASA
  101 ALINAN CEKLER
  102 BANKALAR
  EOF
  printf '100,1500.00\r\n101,250.50\r\n102,900.75\r\n' > muhasebe/2024/kalemler.csv
  printf '100,1500.00\r\n101,250.50\r\n102,900.75\r\n' > muhasebe/2024/kalemler.csv.bak
  cat > muhasebe/notlar.txt <<'EOF'
  bu dosya hesap degil
  EOF

goal_tr: >
  muhasebe dizin agacindaki .csv uzantili tek gercek kalem dosyasini bulup
  (uzantisi .csv olmayan yedek dosyayi yok say), icindeki CRLF satir
  sonlarini temizleyerek hesap kodu ve tutar sutunlarini hesaplar.txt'deki
  kod-isim ciftiyle kod uzerinden birlestir ve her hesap icin kod, ad, tutar
  alanlarini iceren gecerli bir JSON dizisi olarak muhasebe/ozet.json
  dosyasina yaz.

reference_solution: |
  find muhasebe -type f -name '*.csv' | while read f; do
    tr -d '\r' < "$f" | sort -t, -k1,1 > /tmp/kalem.tmp
    sort -k1,1 muhasebe/2024/hesaplar.txt > /tmp/hesap.tmp
    join -t, -1 1 -2 1 /tmp/kalem.tmp /tmp/hesap.tmp
  done | awk -F, 'BEGIN{print "["} {printf "%s{\"kod\":\"%s\",\"ad\":\"%s\",\"tutar\":%s}", (NR>1?",":""), $1, $3, $2} END{print "]"}' > muhasebe/ozet.json

outputs:
  - {path: muhasebe/ozet.json, kind: json}

checks:
  - {op: json_eq, path: muhasebe/ozet.json, value: []}

metadata:
  domain: birlestir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4086
    bundle: birlestir
    tools:
    - join
    - sort
    konu: muhasebe-kalemleri
    hedef: birlestir
    girdi: duz-metin
    kaynak: dizin-agaci
    cikti: json
    kesif: dosyayi-bul
    uslup: terse
    direnc: crlf
    bukulme: tuzak-dosya
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
