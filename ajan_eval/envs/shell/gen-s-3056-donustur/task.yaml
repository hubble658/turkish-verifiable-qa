id: gen-s-3056-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  notlar klasöründeki her .ini dosyasını ele al. Dosya içindeki ad değerinin büyük harfe çevrilmiş hali, o dosyanın adıyla aynı olan durumlar için, bu adı taşıyan bir .txt dosyasını yine notlar klasörüne yaz; yani notlar/ALI.txt, notlar/AYSE.txt ve notlar/MEHMET.txt dosyaları oluşsun. Ayrıca tüm öğrencilerin ad ve not değerlerini, ad ile not arasında iki nokta olacak biçimde, dosyaların başlangıçtaki sırası korunarak notlar/ozet.txt dosyasına yaz.

setup: |
  mkdir -p notlar
  cat > notlar/ali.ini <<'EOF'
  [ogrenci]
  ad = Ali
  sinif = 10
  not = 85
  EOF
  cat > notlar/ayse.ini <<'EOF'
  [ogrenci]
  ad = Ayse
  sinif = 11
  not = 92
  EOF
  cat > notlar/mehmet.ini <<'EOF'
  [ogrenci]
  ad = Mehmet
  sinif = 10
  not = 78
  EOF

goal_tr: >
  notlar klasorundeki her .ini dosyasini, icindeki ad degerini buyuk harfe
  cevirip ayni adi tasiyan .txt dosyasi olarak notlar klasorune yaz (ad
  degeri dosya adiyla ayni olan dosyalar icin), ve tum ogrencilerin ad ile
  not degerlerini iki nokta ile ayrilmis bicimde notlar/ozet.txt dosyasina
  sirasi korunarak yaz.

reference_solution: |
  for f in notlar/*.ini; do
    ad=$(grep '^ad' "$f" | cut -d'=' -f2 | tr -d ' ')
    not=$(grep '^not' "$f" | cut -d'=' -f2 | tr -d ' ')
    ust=$(printf '%s' "$ad" | tr 'a-z' 'A-Z')
    printf '%s:%s\n' "$ust" "$not"
  done | tee notlar/ozet.txt | while IFS=: read -r a n; do
    printf '%s\n' "$a" > "notlar/$a.txt"
  done

outputs:
  - {path: notlar/ozet.txt, kind: file}
  - {path: notlar/ALI.txt, kind: file}
  - {path: notlar/AYSE.txt, kind: file}
  - {path: notlar/MEHMET.txt, kind: file}

checks:
  - {op: file_content_eq, path: notlar/ALI.txt, value: ALI}
  - {op: file_content_eq, path: notlar/AYSE.txt, value: AYSE}
  - {op: file_content_eq, path: notlar/MEHMET.txt, value: MEHMET}
  - {op: file_lines_eq, path: notlar/ozet.txt, value: ['ALI:85', 'AYSE:92', 'MEHMET:78']}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3056
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: ogrenci-notlari
    hedef: donustur
    girdi: ini
    kaynak: cok-dosya
    cikti: yeniden-adlandirilmis
    kesif: dolayli-hedef
    uslup: duz-hedef
    direnc: baslik-yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
