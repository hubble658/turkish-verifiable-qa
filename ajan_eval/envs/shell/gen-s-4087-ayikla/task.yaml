id: gen-s-4087-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) hava.csv dosyasındaki başlık satırını atlayarak her satırın ikinci alanındaki gün değerini ve üçüncü alanındaki sıcaklık değerini oku.

  2) Gün bazında tüm satırlardaki sıcaklık değerlerinin toplamını hesapla.

  3) En yüksek toplama sahip günün numarasını bul.

  4) Bulduğun gün numarasını sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  cat > hava.csv <<'CSV'
  sehir;gun;sicaklik
  ankara;1;12
  ankara;2;15
  ankara;3;9
  izmir;1;22
  izmir;2;24
  bursa;1;7
  CSV

goal_tr: >
  hava.csv dosyasindaki her satirin ikinci alanindaki degeri (gun) ve ucuncu
  alanindaki degeri (sicaklik) alip gun bazinda tum satirlarin sicaklik
  toplamini hesapla, en yuksek toplama sahip gunun numarasini sonuc.txt
  dosyasina sadece sayi olarak yaz (baslik satirini atla)

reference_solution: |
  tail -n +2 hava.csv | cut -d';' -f2,3 > gecici.txt
  cut -d';' -f1 gecici.txt | sort -n | uniq > gunler.txt
  cut -d';' -f1 gecici.txt > sadece_gun.txt
  cut -d';' -f2 gecici.txt > sadece_sicaklik.txt
  paste -d';' sadece_gun.txt sadece_sicaklik.txt | awk -F';' '{toplam[$1]+=$2} END {for (g in toplam) print g, toplam[g]}' | sort -k2 -n | tail -n 1 | cut -d' ' -f1 > sonuc.txt
  rm -f gecici.txt gunler.txt sadece_gun.txt sadece_sicaklik.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '1'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4087
    bundle: sutun
    tools:
    - cut
    - paste
    konu: hava-durumu-kayitlari
    hedef: ayikla
    girdi: csv
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
