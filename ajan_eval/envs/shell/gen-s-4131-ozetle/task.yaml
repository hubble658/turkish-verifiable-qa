id: gen-s-4131-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Laboratuvardaki sensör kayıtları gün içinde farklı dosyalara dağılmış durumda; ben de akşamları oturup hangi sensörün ne durumda olduğunu elle tek tek not almaktan yoruldum. Artık elime geçen ham kayıtlardan derli toplu bir özet çıkarmak istiyorum ki sabah geldiğimde tek bir dosyaya bakıp karar verebileyim. Bu yüzden /workspace içindeki olcumler.ini dosyasındaki her sensör bölümünden sıcaklık ve nem değerlerini alıp, sensör adı, sıcaklık ve nem sütunlarından oluşan virgülle ayrılmış bir ozet.csv dosyası oluşturmanı istiyorum; satırlar sensör adına göre artan sırada olsun. Bu işi yaparken yedek.ini dosyasını kullanma, sadece olcumler.ini üzerinden ilerle.

setup: |
  cat > olcumler.ini <<'INI'
  [sensor:A]
  sicaklik=21
  nem=40
  [sensor:B]
  sicaklik=19
  nem=55
  [sensor:C]
  sicaklik=25
  nem=30
  INI
  cat > yedek.ini <<'INI'
  [sensor:X]
  sicaklik=99
  nem=99
  INI

goal_tr: >
  olcumler.ini dosyasindaki her sensor bolumunden sicaklik ve nem
  degerlerini alarak, sensor adi, sicaklik ve nem sutunlarindan olusan
  virgulle ayrilmis ozet.csv dosyasini sensor adina gore artan sirada yaz;
  yedek.ini dosyasini kullanma.

reference_solution: |
  grep -E '^\[sensor:|^sicaklik=|^nem=' olcumler.ini | cut -d= -f2 | cut -d']' -f1 | paste - - - | sort | awk -F'\t' '{print $1","$2","$3}' > ozet.csv

outputs:
  - {path: ozet.csv, kind: file}

checks:
  - {op: file_lines_eq, path: ozet.csv, value: ['[sensor:A,21,40', '[sensor:B,19,55', '[sensor:C,25,30']}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4131
    bundle: sutun
    tools:
    - cut
    - paste
    konu: sensor-olcumleri
    hedef: ozetle
    girdi: ini
    kaynak: tek-dosya
    cikti: csv
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: tuzak-dosya
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
