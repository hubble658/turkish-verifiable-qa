id: gen-s-3203-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Sabah toplantısında sistem izleme ekranındaki rakamların tutmadığından şikayet ettiler; kimse hangi log dosyasında ne kadar sorun biriktiğini tek bakışta göremiyor. Ben de bugün logları derleyip ekip için tek bir özet çıkarmaya karar verdim. Elimde loglar klasörü var, içinde .csv uzantılı dosyalar tutuluyor; mesela dogrudan-erisim.csv ve gecikmeli yanit.csv gibi. Bu klasördeki her .csv dosyasını tarayıp, dosya adını (uzantısı olmadan) anahtar yapan bir JSON nesnesi oluşturmanı istiyorum. Her anahtarın değeri, o dosyadaki BILGI dışındaki satırların, yani seviyesi HATA ya da UYARI olan satırların sayısı olsun; sadece sayı yazılsın, başka bir şey eklenmesin. Sonucu ozet.json dosyasına yaz.

setup: |
  mkdir -p loglar
  cat > loglar/dogrudan-erisim.csv <<'CSV'
  zaman,seviye,mesaj
  2024-01-01T10:00:00,BILGI,sistem basladi
  2024-01-01T10:05:00,HATA,disk dolu
  2024-01-01T10:10:00,UYARI,bellek az
  CSV
  cat > "loglar/gecikmeli yanit.csv" <<'CSV'
  zaman,seviye,mesaj
  2024-01-01T11:00:00,HATA,baglanti koptu
  2024-01-01T11:30:00,BILGI,tekrar denendi
  CSV

goal_tr: >
  loglar klasorundeki her .csv dosyasinin dosya adini (uzantisiz) ve
  icindeki BILGI disi (yani HATA veya UYARI) satirlarin sayisini iceren bir
  JSON nesnesi uretip ozet.json dosyasina yaz; anahtarlar dosya adlari
  olsun.

reference_solution: |
  out=""
  for f in loglar/*.csv; do
    d=$(dirname "$f")
    b=$(basename "$f" .csv)
    c=$(grep -c -E ',(HATA|UYARI),' "$d/$b.csv")
    out="$out\"$b\":$c,"
  done
  printf '{%s}\n' "${out%,}" > ozet.json

outputs:
  - {path: ozet.json, kind: json}

checks:
  - {op: json_eq, path: ozet.json, value: {dogrudan-erisim: 2, gecikmeli yanit: 1}}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3203
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: sunucu-loglari
    hedef: yeniden-duzenle
    girdi: csv
    kaynak: cok-dosya
    cikti: json
    kesif: yok
    uslup: baglam-gomulu
    direnc: bosluklu-ad
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
