id: gen-s-4090-toplu-yeniden-adlandir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  not defteri klasöründeki ogrenci-notlari.ini ve sinif-listesi.ini dosyalarındaki verileri çaprazlayarak, 10-A sınıfındaki öğrencilerin notlarının toplamını sonuc.txt dosyasına sadece sayı olarak yaz.

  Şu şartlar sağlanmalı:
  - sonuc.txt dosyası oluşturulmalı.
  - sonuc.txt içinde yalnızca 10-A sınıfındaki öğrencilerin notlarının toplamı yer almalı.
  - sonuc.txt içeriği sadece sayı olmalı; başka metin, etiket veya açıklama bulunmamalı.
  - Toplam, ogrenci-notlari.ini ve sinif-listesi.ini dosyalarındaki veriler çaprazlanarak hesaplanmalı.
  - sonuc.txt dosyası "not defteri" klasörü dışında, çalışma dizininde oluşturulmalı.

setup: |
  mkdir -p "not defteri"
  cat > "not defteri/ogrenci-notlari.ini" <<'INI'
  [ayse]
  not = 85
  sinif = 10-A

  [mehmet]
  not = 70
  sinif = 10-B

  [zeynep]
  not = 95
  sinif = 10-A

  [can]
  not = 60
  sinif = 10-B
  INI
  cat > "not defteri/sinif-listesi.ini" <<'INI'
  [10-A]
  ogrenciler = ayse,zeynep

  [10-B]
  ogrenciler = mehmet,can
  INI

goal_tr: >
  "not defteri" klasorunde bulunan ogrenci-notlari.ini ve sinif-listesi.ini
  dosyalarindaki verileri caprazlayarak, 10-A sinifindaki ogrencilerin
  notlarinin toplamini sonuc.txt dosyasina sadece sayi olarak yaz.

reference_solution: |
  mkdir -p "islenmis"
  mv "not defteri/ogrenci-notlari.ini" "islenmis/notlar.ini"
  mv "not defteri/sinif-listesi.ini" "islenmis/siniflar.ini"
  awk -F'=' '/^\[10-A\]/{f=1} /^\[10-B\]/{f=0} f && /ogrenciler/{print $2}' "islenmis/siniflar.ini" | tr ',' '\n' | sort > "islenmis/hedef-ogrenciler.txt"
  awk -F'=' '/^\[/{gsub(/[\[\]]/,"",$0); k=$0} /not/{print k" "$2}' "islenmis/notlar.ini" | sort > "islenmis/tum-notlar.txt"
  join "islenmis/hedef-ogrenciler.txt" "islenmis/tum-notlar.txt" | awk '{s+=$2} END{print s}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '180'}
  - {op: not_exists, path: not defteri/ogrenci-notlari.ini}
  - {op: not_exists, path: not defteri/sinif-listesi.ini}

metadata:
  domain: toplu-yeniden-adlandir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4090
    bundle: dosya-duzen
    tools:
    - mkdir
    - mv
    konu: ogrenci-notlari
    hedef: toplu-yeniden-adlandir
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: veriye-bak
    uslup: kabul-kriteri
    direnc: bosluklu-ad
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
