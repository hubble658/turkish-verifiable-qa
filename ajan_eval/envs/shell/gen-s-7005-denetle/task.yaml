id: gen-s-7005-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Girdi ağacındaki her kalemler.csv dosyasından başlık satırı hariç hesap ve tutar alanlarını alıp tekrarsız (hesap,tutar) çiftlerini "hesap,tutar" biçimiyle denetim/ altında girdi yapısını aynalayan dizin yapısı olarak yaz; her csv için aynı yolda kalemler.txt oluşsun. Tüm dosyaların birleşik tekrarsız hali denetim/birlesik.txt'ye, fark ve karşılaştırma çıktıları da denetim/fark.txt ile denetim/diff.txt'ye gelsin.

setup: |
  mkdir -p girdi/2024/ocak girdi/2024/subat girdi/2023/aralik
  cat > girdi/2024/ocak/kalemler.csv <<'CSV'
  tarih,hesap,tutar
  2024-01-03,100,1500
  2024-01-05,200,750
  2024-01-09,100,320
  CSV
  cat > girdi/2024/subat/kalemler.csv <<'CSV'
  tarih,hesap,tutar
  2024-02-01,100,1500
  2024-02-04,300,90
  2024-02-11,200,750
  2024-02-19,100,320
  CSV
  cat > girdi/2023/aralik/kalemler.csv <<'CSV'
  tarih,hesap,tutar
  2023-12-02,100,1500
  2023-12-08,200,750
  2023-12-15,100,320
  CSV
  cat > girdi/beklenen.csv <<'CSV'
  100,1500
  100,320
  200,750
  CSV

goal_tr: >
  girdi dizin agacindaki her kalemler.csv dosyasindan baslik satiri
  disindaki kayitlarin hesap ve tutar alanlarini alip, tekrarsiz
  (hesap,tutar) ciftlerini "hesap,tutar" bicimiyle denetim/ altinda girdi
  yapisini aynalayan bir dizin-yapisi olarak yaz; her csv icin ayni yolda
  bir .txt dosyasi olussun ve tum dosyalarin birlesik tekrarsiz hali
  denetim/birlesik.txt'ye gelsin.

reference_solution: |
  mkdir -p denetim
  find girdi -name kalemler.csv | sort | while read -r f; do
    d=$(dirname "$f")
    out="denetim/${d#girdi/}"
    mkdir -p "$out"
    tail -n +2 "$f" | cut -d, -f2,3 | sort -u > "$out/kalemler.txt"
  done
  find denetim -name kalemler.txt | sort | xargs cat | sort -u > denetim/birlesik.txt
  comm -3 <(sort -u girdi/beklenen.csv) <(sort -u denetim/birlesik.txt) > denetim/fark.txt
  diff <(sort -u girdi/beklenen.csv) <(sort -u denetim/birlesik.txt) > denetim/diff.txt || true

outputs:
  - {path: denetim/2024/ocak/kalemler.txt, kind: file}
  - {path: denetim/2024/subat/kalemler.txt, kind: file}
  - {path: denetim/2023/aralik/kalemler.txt, kind: file}
  - {path: denetim/birlesik.txt, kind: file}
  - {path: denetim/fark.txt, kind: file}
  - {path: denetim/diff.txt, kind: file}

checks:
  - {op: file_lines_eq, path: denetim/2023/aralik/kalemler.txt, value: ['100,1500', '100,320', '200,750']}
  - {op: file_lines_eq, path: denetim/2024/ocak/kalemler.txt, value: ['100,1500', '100,320', '200,750']}
  - {op: file_lines_eq, path: denetim/2024/subat/kalemler.txt, value: ['100,1500', '100,320', '200,750', '300,90']}
  - {op: file_lines_eq, path: denetim/birlesik.txt, value: ['100,1500', '100,320', '200,750', '300,90']}
  - {op: file_lines_eq, path: denetim/diff.txt, value: [3a4, '> 300,90']}
  - {op: file_content_eq, path: denetim/fark.txt, value: '300,90'}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7005
    bundle: karsilastir
    tools:
    - diff
    - comm
    konu: muhasebe-kalemleri
    hedef: denetle
    girdi: csv
    kaynak: dizin-agaci
    cikti: dizin-yapisi
    kesif: yok
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
