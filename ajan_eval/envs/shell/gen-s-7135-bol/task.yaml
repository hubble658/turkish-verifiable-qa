id: gen-s-7135-bol
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) notlar dizinindeki a.json ve b.json dosyalarını oku.
  2) Her iki dosyadaki öğrencilerden notu 50 ve üzeri olanların adlarını belirle; önce a.json'daki uygun öğrencileri, sonra b.json'daki uygun öğrencileri kendi iç sıralarıyla ele al.
  3) Belirlenen adları her satırda bir ad olacak şekilde gecen.txt dosyasına yaz.

setup: |
  mkdir -p notlar
  printf '{"ad":"Ali","not":90}\n{"ad":"Veli","not":40}\n{"ad":"Ayse","not":75}\n{"ad":"Can","not":55}\n{"ad":"Ece","not":30}' > notlar/a.json
  printf '{"ad":"Deniz","not":85}\n{"ad":"Bora","not":60}\n{"ad":"Selin","not":20}' > notlar/b.json

goal_tr: >
  notlar dizinindeki a.json ve b.json dosyalarindaki ogrencilerden notu 50
  ve uzeri olanlarin adlarini, a.json sonra b.json sirasiyla birer satir
  olarak gecen.txt dosyasina yaz

reference_solution: |
  cat notlar/a.json notlar/b.json | grep '"not":' | awk -F'"' '{print $4, $8}' | awk '$2 >= 50 {print $1}' > gecici.txt
  head -n 2 gecici.txt > gecen.txt
  tail -n 2 gecici.txt >> gecen.txt
  rm gecici.txt

outputs:
  - {path: gecen.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: gecen.txt, value: [Ece, Ece]}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7135
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: ogrenci-notlari
    hedef: bol
    girdi: json
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: yok
    uslup: numarali-emir
    direnc: son-newline-yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
