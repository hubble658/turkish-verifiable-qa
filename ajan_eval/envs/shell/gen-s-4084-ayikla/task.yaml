id: gen-s-4084-ayikla
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8
prompt: 'depo klasöründeki a.tsv ve b.tsv dosyalarının ikisinde de geçen ürün adlarını, başlık satırı hariç, tekrarsız olarak
  alfabetik sırada ortak.txt dosyasına yaz; her satırda bir ürün adı olsun.


  Çıktıyı çalışma dizininin kökünde (ortak.txt) oluştur, alt dizine yazma.

  '
setup: "mkdir -p depo\ncat > depo/a.tsv <<'TSV'\nurun\tadet\tfiyat\nelma\t10\t5\narmut\t4\t7\nmuz\t20\t3\nTSV\ncat > depo/b.tsv\
  \ <<'TSV'\nurun\tadet\tfiyat\nelma\t2\t5\nkivi\t9\t6\nmuz\t1\t3\nTSV\ncat > depo/c.tsv <<'TSV'\nurun\tadet\tfiyat\narmut\t\
  6\t7\nkivi\t3\t6\nuzum\t8\t4\nTSV\n"
goal_tr: 'depo klasorundeki a.tsv ve b.tsv dosyalarinda gecen urun adlarini (baslik satiri haric) tekrarsiz olarak alfabetik
  sirada ortak.txt dosyasina her satirda bir ad olacak sekilde yaz

  '
reference_solution: 'tail -n +2 depo/a.tsv | cut -f1 | sort -u > /tmp/a.txt

  tail -n +2 depo/b.tsv | cut -f1 | sort -u > /tmp/b.txt

  comm -12 /tmp/a.txt /tmp/b.txt > ortak.txt

  '
outputs:
- path: ortak.txt
  kind: lines
checks:
- op: file_lines_eq
  path: ortak.txt
  value:
  - elma
  - muz
metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4084
    bundle: kume-farki
