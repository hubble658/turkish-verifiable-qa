# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  randevular.csv dosyasındaki veri satırlarını poliklinik sütununa göre grupla; her poliklinik grubunun içindeki satırları hasta_id değerine göre artan sırada tut ve grupları poliklinik adına göre alfabetik sırada birleştir. Elde ettiğin sonucu, başlık satırı da dahil olmak üzere poliklinik_bolumleri.csv dosyasına yaz.

setup: |
  cat > randevular.csv <<'CSV'
  hasta_id,poliklinik,tarih,durum
  1001,kardiyoloji,2024-03-01,tamamlandi
  1002,ortopedi,2024-03-01,iptal
  1003,kardiyoloji,2024-03-02,tamamlandi
