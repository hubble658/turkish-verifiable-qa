goal_tr: >
  randevular.csv dosyasindaki veri satirlarini poliklinik sutununa gore
  grupla; her poliklinigin satirlarini kendi icinde hasta_id'ye gore artan
  sirada tut ve gruplari poliklinik adina gore alfabetik sirada birlestirip
  baslik satiriyla birlikte poliklinik_bolumleri.csv dosyasina yaz

reference_solution: |
  head -n 1 randevular.csv > poliklinik_bolumleri.csv
  tail -n +2 randevular.csv | sort -t, -k2,2 -k1,1n >> poliklinik_bolumleri.csv

