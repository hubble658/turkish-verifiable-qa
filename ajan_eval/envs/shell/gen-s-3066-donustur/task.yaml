id: gen-s-3066-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  /workspace dizinindeki kayitlar.log dosyasındaki her satırın ilk 19 karakterini alıp bu parçaları ters çevirerek sonuc.txt dosyasına yaz; her parça sonuc.txt içinde ayrı bir satırda yer alsın ve dosyanın son satırı da yeni satır karakteriyle bitsin. kayitlar.log.bak dosyasını işleme katma.

setup: |
  cat > kayitlar.log <<'LOG'
  2024-05-01 10:00:00 BILGI sistem basladi
  2024-05-01 10:01:12 HATA disk dolu
  2024-05-01 10:02:33 UYARI bellek az
  2024-05-01 10:03:44 HATA baglanti koptu
  LOG
  printf '2024-05-01 10:04:55 HATA yok sayilacak\n' > kayitlar.log.bak

goal_tr: >
  kayitlar.log dosyasindaki her satirin ilk 19 karakterini alip, bu
  parcalari ters cevirip, sonuc.txt dosyasina her satir bir parca olacak
  sekilde yaz (son satirda da newline olsun); kayitlar.log.bak dosyasini
  isleme katma

reference_solution: |
  cut -c1-19 kayitlar.log | rev > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: sonuc.txt, value: ['00:00:01 10-50-4202', '21:10:01 10-50-4202', '33:20:01 10-50-4202', '44:30:01 10-50-4202']}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3066
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: sunucu-loglari
    hedef: donustur
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: son-newline-yok
    bukulme: tuzak-dosya
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
