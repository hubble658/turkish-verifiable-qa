id: gen-s-4152-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  logs dizinindeki her .log dosyasını yedek dizinine taşı. Taşınan her dosyanın adı, özgün dosya adının sonuna _arsiv eklenmiş ve uzantısı .txt olmuş biçimde olsun. Hedef yolu, her dosya için dirname ile logs'un üst dizinine göre hesapla. Böylece logs/sunucu_alpha.log, logs/sunucu_beta.log ve logs/sunucu_gamma.log dosyaları yedek dizinine sırasıyla yedek/sunucu_alpha_arsiv.txt, yedek/sunucu_beta_arsiv.txt ve yedek/sunucu_gamma_arsiv.txt adlarıyla yer alsın.

setup: |
  mkdir -p logs yedek
  cat > logs/sunucu_alpha.log <<'LOG'
  BILGI basladi
  HATA disk
  LOG
  cat > logs/sunucu_beta.log <<'LOG'
  UYARI bellek
  BILGI devam
  LOG
  cat > logs/sunucu_gamma.log <<'LOG'
  HATA zaman asimi
  LOG

goal_tr: >
  logs dizinindeki her .log dosyasini, dosya adinin sonuna _arsiv eklenmis
  ve uzantisi .txt olmus bicimde, hedef yol dirname ile logs'un ust dizinine
  gore hesaplanarak yedek dizinine tasi.

reference_solution: |
  for f in logs/*.log; do d=$(dirname "$f"); b=$(basename "$f" .log); mv "$f" "${d}/../yedek/${b}_arsiv.txt"; done

outputs:
  - {path: yedek, kind: dir}
  - {path: yedek/sunucu_alpha_arsiv.txt, kind: file}
  - {path: yedek/sunucu_beta_arsiv.txt, kind: file}
  - {path: yedek/sunucu_gamma_arsiv.txt, kind: file}

checks:
  - {op: dir_entries_eq, path: yedek, value: [sunucu_alpha_arsiv.txt, sunucu_beta_arsiv.txt, sunucu_gamma_arsiv.txt]}
  - {op: file_lines_eq, path: yedek/sunucu_alpha_arsiv.txt, value: [BILGI basladi, HATA disk]}
  - {op: file_lines_eq, path: yedek/sunucu_beta_arsiv.txt, value: [UYARI bellek, BILGI devam]}
  - {op: file_content_eq, path: yedek/sunucu_gamma_arsiv.txt, value: HATA zaman asimi}
  - {op: not_exists, path: logs/sunucu_alpha.log}
  - {op: not_exists, path: logs/sunucu_beta.log}
  - {op: not_exists, path: logs/sunucu_gamma.log}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4152
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: sunucu-loglari
    hedef: yeniden-duzenle
    girdi: duz-metin
    kaynak: cok-dosya
    cikti: yeniden-adlandirilmis
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
