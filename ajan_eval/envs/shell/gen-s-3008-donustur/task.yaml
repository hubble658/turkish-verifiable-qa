id: gen-s-3008-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14
prompt: 'randevular dizinindeki tüm CSV dosyalarındaki veri satırlarını birleştirip hasta_id, poliklinik ve tarih alanlarını
  virgülle ayrılmış olarak birlesik_randevular.csv dosyasına yaz. Başlık satırı sadece bir kez en üstte yer alsın ve durum
  alanı boş olan satırlar bu dosyaya dahil edilmesin.

  '
setup: 'mkdir -p randevular

  cat > randevular/randevu_a.csv <<''CSV''

  hasta_id;poliklinik;tarih;durum

  101;Kardiyoloji;2024-03-01;onaylandi

  102;Noroloji;2024-03-01;iptal

  103;Kardiyoloji;2024-03-02;onaylandi

  CSV

  cat > randevular/randevu_b.csv <<''CSV''

  hasta_id;poliklinik;tarih;durum

  104;Ortopedi;2024-03-02;onaylandi

  105;Noroloji;2024-03-03;beklemede

  106;Kardiyoloji;2024-03-03;iptal

  CSV

  cat > randevular/randevu_c.csv <<''CSV''

  hasta_id;poliklinik;tarih;durum

  107;Ortopedi;2024-03-04;onaylandi

  108;Kardiyoloji;2024-03-04;onaylandi

  CSV

  '
goal_tr: 'randevular dizinindeki tum CSV dosyalarindaki veri satirlarini birlestirip hasta_id,poliklinik ve tarih alanlarini
  virgulle ayrilmis tek bir birlesik_randevular.csv dosyasina yaz; baslik satirini bir kez en uste koy ve durum alani bos
  olan satirlari disarida birak.

  '
reference_solution: '{ echo hasta_id,poliklinik,tarih; for f in randevular/*.csv; do tail -n +2 "$f"; done | awk -F'';'' ''$4!=""
  {print $1","$2","$3}''; } > birlesik_randevular.csv

  '
