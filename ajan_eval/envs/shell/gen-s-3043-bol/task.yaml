id: gen-s-3043-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  logs dizinindeki tüm tsv dosyalarında başlığı atla, seviyesi HATA olan satırların mesaj sütununu "dosya:" önekiyle birlikte hatalar.txt dosyasına her satırda bir tane olacak şekilde yaz.

setup: |
  mkdir -p logs
  cat > logs/kuzey.tsv <<'TSV'
  zaman	seviye	mesaj
  10:01	BILGI	sistem basladi
  10:02	HATA	disk dolu
  10:03	HATA	baglanti koptu
  TSV
  cat > logs/guney.tsv <<'TSV'
  zaman	seviye	mesaj
  10:04	BILGI	kullanici giris yapti
  10:05	UYARI	bellek az
  10:06	HATA	zaman asimi
  TSV

goal_tr: >
  logs dizinindeki tum tsv dosyalarinin basligini atlayip yalnizca seviye
  sutunu HATA olan satirlarin mesaj sutununu, dosya adi onekini "dosya:" ile
  birlikte birlestirip hatalar.txt dosyasina satir listesi olarak yaz

reference_solution: |
  { for f in logs/*.tsv; do tail -n +2 "$f" | awk -F'\t' -v d="$(basename "$f")" '$2=="HATA"{print d":"$3}'; done; } > hatalar.txt
  cat hatalar.txt | tee /dev/null >/dev/null
  cut -d: -f2- hatalar.txt >/dev/null

outputs:
  - {path: hatalar.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: hatalar.txt, value: ['guney.tsv:zaman asimi', 'kuzey.tsv:disk dolu', 'kuzey.tsv:baglanti koptu']}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3043
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: sunucu-loglari
    hedef: bol
    girdi: tsv
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: dolayli-hedef
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
