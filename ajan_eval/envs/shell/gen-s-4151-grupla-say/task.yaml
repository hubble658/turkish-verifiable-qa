id: gen-s-4151-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) veri klasöründeki her kargo JSON dosyasını oku ve her birinden sehir ve durum alanlarını al.

  2) Elde ettiğin sehir ve durum bilgilerinden yola çıkarak, her sehir için o sehirdeki durumların sayısını hesapla.

  3) Hesapladığın sehir bazlı durum sayılarını içeren geçerli bir JSON nesnesi oluştur.

  4) Bu JSON nesnesini ozet.json dosyasına yaz.

setup: |
  mkdir -p veri
  cat > veri/kargo_001.json <<'JSON'
  {"takip_no": "TR001", "sehir": "Ankara", "durum": "teslim"}
  JSON
  cat > veri/kargo_002.json <<'JSON'
  {"takip_no": "TR002", "sehir": "Izmir", "durum": "yolda"}
  JSON
  cat > veri/kargo_003.json <<'JSON'
  {"takip_no": "TR003", "sehir": "Ankara", "durum": "yolda"}
  JSON
  cat > veri/kargo_004.json <<'JSON'
  {"takip_no": "TR004", "sehir": "Bursa", "durum": "teslim"}
  JSON
  cat > veri/kargo_005.json <<'JSON'
  {"takip_no": "TR005", "sehir": "Izmir", "durum": "teslim"}
  JSON
  cat > veri/kargo_006.json <<'JSON'
  {"takip_no": "TR006", "sehir": "Ankara", "durum": "teslim"}
  JSON

goal_tr: >
  veri klasorundeki her kargo JSON dosyasindan sehir ve durum alanlarini
  okuyup sehir bazinda durum sayilarini iceren gecerli bir JSON nesnesini
  ozet.json dosyasina yaz

reference_solution: |
  python3 - <<'PY'
  import json, glob, os
  ozet = {}
  for yol in sorted(glob.glob("veri/*.json")):
      with open(yol, encoding="utf-8") as f:
          kayit = json.load(f)
      sehir = kayit["sehir"]
      durum = kayit["durum"]
      ozet.setdefault(sehir, {})
      ozet[sehir][durum] = ozet[sehir].get(durum, 0) + 1
  with open("ozet.json", "w", encoding="utf-8") as f:
      json.dump(ozet, f, ensure_ascii=False, sort_keys=True, indent=2)
  PY

outputs:
  - {path: ozet.json, kind: json}

checks:
  - {op: json_eq, path: ozet.json, value: {Ankara: {teslim: 2, yolda: 1}, Bursa: {teslim: 1}, Izmir: {teslim: 1, yolda: 1}}}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4151
    bundle: python-veri
    tools:
    - python3
    konu: kargo-takibi
    hedef: grupla-say
