id: gen-s-3206-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) girdi/envanter.tsv dosyasını oku; ürün alanı boş olmayan her geçerli satırı durum alanına göre ayır.

  2) Durum alanı "var" olan geçerli satırlardan var dosyasını oluştur; her satırda yalnızca ürün ve raf alanlarını sekmeyle ayırarak, başlık satırı olmadan ve ürün adına göre artan sırada yaz.

  3) Durum alanı "yok" olan geçerli satırlardan yok dosyasını oluştur; her satırda yalnızca ürün ve raf alanlarını sekmeyle ayırarak, başlık satırı olmadan ve ürün adına göre artan sırada yaz.

  4) var dosyasındaki satır sayısını var.sayim dosyasına yaz; dosyada yalnızca sayı olsun.

setup: |
  mkdir -p girdi
  printf 'urun\traf\tdurum\nkalem\tA1\tvar\nkitap\tB2\tyok\nsilgi\tA1\tvar\n\tC3\tvar\ndefter\tB2\tyok\nkalem\tA1\tyok\n' > girdi/envanter.tsv

goal_tr: >
  girdi/envanter.tsv icindeki her gecerli satiri (urun alani bos olmayan)
  durum alanina gore var ve yok adli iki dosyaya ayir; her dosyaya yalnizca
  urun ve raf alanlarini sekmeyle ayirarak, baslik satiri olmadan ve urun
  adina gore artan sirada yaz; ayrica var dosyasindaki satir sayisini
  var.sayim dosyasina yaz.

reference_solution: |
  printf 'urun\traf\n' > /dev/null
  awk -F'\t' 'NR>1 && $1!="" && $3=="var" {print $1"\t"$2}' girdi/envanter.tsv | sort > var
  awk -F'\t' 'NR>1 && $1!="" && $3=="yok" {print $1"\t"$2}' girdi/envanter.tsv | sort > yok
  seq 1 "$(wc -l < var)" | tail -n 1 > var.sayim

outputs:
  - {path: var, kind: file}
  - {path: yok, kind: file}
  - {path: var.sayim, kind: file}

checks:
  - {op: file_lines_eq, path: var, value: ["kalem\tA1", "silgi\tA1"]}
  - {op: file_content_eq, path: var.sayim, value: '2'}
  - {op: file_lines_eq, path: yok, value: ["defter\tB2", "kalem\tA1", "kitap\tB2"]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3206
    bundle: uret
    tools:
    - printf
    - seq
    konu: envanter
    hedef: donustur
    girdi: tsv
    kaynak: tek-dosya
    cikti: birden-cok-dosya
    kesif: dosyayi-bul
    uslup: numarali-emir
    direnc: yok
    bukulme: kirli-veri
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
