id: gen-s-3099-sirala-sec
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  erisim.json içindeki kayıtları kullanıcı adına göre grupla; her kullanıcının OK giriş sayısını bul. Sayıya göre çoktan aza, eşitlikte kullanıcı adına göre alfabetik sıralayıp "kullanıcı sayı" biçiminde her satırda bir tane olacak şekilde sirali.txt dosyasına yaz.

setup: |
  cat > erisim.json <<'JSON'
  {"kayitlar":[
  {"kullanici":"ayse","durum":"OK"},
  {"kullanici":"mehmet","durum":"OK"},
  {"kullanici":"ayse","durum":"HATA"},
  {"kullanici":"zeynep","durum":"OK"},
  {"kullanici":"mehmet","durum":"HATA"},
  {"kullanici":"ayse","durum":"OK"},
  {"kullanici":"zeynep","durum":"HATA"},
  {"kullanici":"mehmet","durum":"OK"},
  {"kullanici":"zeynep","durum":"OK"},
  {"kullanici":"ayse","durum":"OK"}
  ]}
  JSON

goal_tr: >
  erisim.json dosyasindaki kayitlari kullanici adina gore gruplayip, her
  kullanici icin basarili (OK) giris sayisini bul; sayilara gore coktan aza
  sirala, esitlikte kullanici adini alfabetik sirala ve "kullanici sayi"
  biciminde satirlar halinde sirali.txt dosyasina yaz

reference_solution: |
  sed 's/[{}]//g; s/\[//g; s/\]//g' erisim.json | tr ',' '\n' | grep '"kullanici"' | cut -d'"' -f4 > /tmp/kullanicilar.txt
  sed 's/[{}]//g; s/\[//g; s/\]//g' erisim.json | tr ',' '\n' | grep '"durum"' | cut -d'"' -f4 > /tmp/durumlar.txt
  paste /tmp/kullanicilar.txt /tmp/durumlar.txt | awk '$2=="OK"{print $1}' | sort | uniq -c | awk '{print $2, $1}' | sort -k2,2nr -k1,1 > sirali.txt
  rm -f /tmp/kullanicilar.txt /tmp/durumlar.txt

outputs:
  - {path: sirali.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: sirali.txt, value: [ayse 3, mehmet 2, zeynep 2]}

metadata:
  domain: sirala-sec
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3099
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: sunucu-loglari
    hedef: sirala-sec
    girdi: json
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: veriye-bak
    uslup: terse
    direnc: yok
    bukulme: kirli-veri
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
