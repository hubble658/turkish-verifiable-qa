id: gen-s-7331-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Kafam bugünlerde hava durumu kayıtlarıyla epey meşgul; elimde günlük hava kayıtlarının tutulduğu bir dosya var ve bu kayıtlardan şehir bazında özetler çıkarmam gerekiyor. Özellikle İstanbul'un kaç gün güneşli geçtiğini merak ediyorum, çünkü bir arkadaşımla tatil planı yaparken bu bilgiye dayanarak karar vereceğiz.

  Bu yüzden hava.log dosyasındaki satırlara bakarak şehre göre kaç günün güneşli olduğunu bul, sonra İstanbul için çıkan bu sayıyı sonuc.txt dosyasına yaz. Dosyanın içinde sadece sayı olsun, başka bir şey olmasın.

setup: |
  cat > hava.log <<'LOG'
  2024-01-01 ISTANBUL 12 gunesli
  2024-01-01 ANKARA 8 bulutlu
  2024-01-02 ISTANBUL 14 gunesli
  2024-01-02 ANKARA 9 yagmurlu
  2024-01-03 ISTANBUL 11 bulutlu
  2024-01-03 ANKARA 7 karli
  2024-01-04 ISTANBUL 13 gunesli
  2024-01-04 ANKARA 10 bulutlu
  2024-01-05 ISTANBUL 15 gunesli
  2024-01-05 ANKARA 6 yagmurlu
  LOG

goal_tr: >
  hava.log dosyasindaki satirlardan sehre gore kac gunun gunesli oldugunu
  bul ve ISTANBUL icin olan sayiyi sonuc.txt dosyasina sadece sayi olarak
  yaz

reference_solution: |
  grep 'ISTANBUL' hava.log | grep 'gunesli' | wc -l > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '4'}

