id: gen-s-7241-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Veri ekibinden gelen günlük raporları tek tek açıp bakmaktan yorulduk; her şehir kendi dosyasını gönderiyor ve bir bakışta hangi olayın ne kadar sık yaşandığını göremiyoruz. Bugün de kayitlar klasöründeki istanbul.csv, ankara.csv ve izmir.csv dosyalarıyla uğraşıp durdum, artık tek bir özet istiyorum. Bu klasördeki tüm csv dosyalarını birleştirip her olay türünün kaç kez geçtiğini saysın; sonucu olay adı ile sayı arasında bir boşluk olacak şekilde, olay sayısına göre azalan sırada olaylar.txt dosyasına yazsın.

setup: |
  mkdir -p kayitlar
  cat > kayitlar/istanbul.csv <<'CSV'
  sehir,tarih,olay
  istanbul,2024-01-01,gunesli
  istanbul,2024-01-02,yagmurlu
  istanbul,2024-01-03,gunesli
  CSV
  cat > kayitlar/ankara.csv <<'CSV'
  sehir,tarih,olay
  ankara,2024-01-01,karli
  ankara,2024-01-02,gunesli
  ankara,2024-01-03,yagmurlu
  CSV
  cat > kayitlar/izmir.csv <<'CSV'
  sehir,tarih,olay
  izmir,2024-01-01,gunesli
  izmir,2024-01-02,gunesli
  izmir,2024-01-03,gunesli
  CSV

goal_tr: >
  kayitlar klasorundeki tum csv dosyalarini birlestirip her olay turunun kac
  kez gectigini, olay adi ve sayi arasinda bosluk olacak sekilde olay
  sayisina gore azalan sirada olaylar.txt dosyasina yaz

reference_solution: |
  find kayitlar -name '*.csv' | sort | xargs tail -n +2 | cut -d, -f3 | sort | uniq -c | sort -rn | awk '{print $2, $1}' > olaylar.txt
  wc -l < olaylar.txt >> olaylar.txt

outputs:
  - {path: olaylar.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: olaylar.txt, value: [gunesli 6, yagmurlu 2, '2', karli 1, ==> 1, ==> 1, ==> 1, '7']}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7241
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: hava-durumu-kayitlari
    hedef: ozetle
    girdi: csv
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: dosyayi-bul
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
