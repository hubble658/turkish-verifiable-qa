id: gen-s-3137-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) logs dizinindeki .ini dosyalarını incele ve her birinde yazan dosya adını bul.
  2) Bulduğun her dosya adına karşılık gelen .log dosyasındaki ERROR ile başlayan satırların sayısını hesapla.
  3) Tüm bu sayıları topla ve sonucu sonuc.txt dosyasına sadece sayı olacak şekilde yaz.

setup: |
  mkdir -p logs
  cat > logs/uygulama.ini <<'INI'
  [log]
  seviye=INFO
  dosya=uygulama.log
  INI
  cat > logs/sunucu.ini <<'INI'
  [log]
  seviye=WARN
  dosya=sunucu.log
  INI
  cat > logs/uygulama.log <<'LOG'
  INFO basladi
  WARN yavas
  INFO devam
  LOG
  cat > logs/sunucu.log <<'LOG'
  WARN bellek
  ERROR coktu
  WARN tekrar
  LOG
  cat > logs/ag.log <<'LOG'
  ERROR koptu
  INFO baglandi
  LOG

goal_tr: >
  logs dizinindeki .ini dosyalarinda yazan dosya adlarina karsilik gelen
  .log dosyalarindaki ERROR ile baslayan satirlarin toplam sayisini
  sonuc.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  find logs -name '*.ini' -exec sed -n 's/^dosya=//p' {} \; | sort -u > /tmp/adlar.txt
  while read -r ad; do find logs -name "$ad"; done < /tmp/adlar.txt > /tmp/yollar.txt
  xargs grep -c '^ERROR' < /tmp/yollar.txt > /tmp/sayilar.txt
  awk -F: '{t+=$NF} END{print t+0}' /tmp/sayilar.txt | tee /tmp/toplam.txt | wc -l > /dev/null
  cat /tmp/toplam.txt > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '1'}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3137
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: sunucu-loglari
    hedef: grupla-say
    girdi: ini
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: dolayli-hedef
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
