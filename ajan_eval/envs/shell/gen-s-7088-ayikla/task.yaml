id: gen-s-7088-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) randevular.csv ve doktorlar.csv dosyalarını bölüm sütunu üzerinden birleştir.

  2) Her randevu için hasta adının ters çevrilmiş halini, bölümü ve doktor adını noktalı virgülle ayrılmış olarak randevular_yeni.csv dosyasına yaz.

setup: |
  cat > randevular.csv <<'CSV'
  1001;Ayse;Kardiyoloji;2024-03-04
  1002;Mehmet;Noroloji;2024-03-05
  1003;Zeynep;Kardiyoloji;2024-03-06
  1004;Ali;Ortopedi;2024-03-07
  CSV
  cat > doktorlar.csv <<'CSV'
  Kardiyoloji;Dr. Kaya
  Noroloji;Dr. Demir
  Ortopedi;Dr. Yilmaz
  CSV

goal_tr: >
  randevular.csv ile doktorlar.csv dosyalarini bolum sutunu uzerinden
  birlestirip her randevu icin hasta adinin ters cevrilmis halini, bolumu ve
  doktor adini noktali virgulle ayrilmis olarak randevular_yeni.csv
  dosyasina yaz.

reference_solution: |
  join -t';' -1 3 -2 1 <(sort -t';' -k3,3 randevular.csv) <(sort -t';' -k1,1 doktorlar.csv) | while IFS=';' read -r bolum id hasta tarih doktor; do printf '%s;%s;%s\n' "$(printf '%s' "$hasta" | rev)" "$(cut -d';' -f1 <<<"$bolum")" "$doktor"; done > randevular_yeni.csv

outputs:
  - {path: randevular_yeni.csv, kind: file}

checks:
  - {op: file_lines_eq, path: randevular_yeni.csv, value: [esyA;Kardiyoloji;Dr. Kaya, penyeZ;Kardiyoloji;Dr. Kaya, temheM;Noroloji;Dr. Demir, ilA;Ortopedi;Dr. Yilmaz]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7088
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: hastane-randevulari
    hedef: ayikla
    girdi: json
    kaynak: iki-dosya-capraz
    cikti: yeniden-adlandirilmis
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
