id: gen-s-7272-onar
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  hava.txt dosyasındaki her satırı "şehir sıcaklık" biçimine çevirip aynı sırayı koruyarak duzeltilmis.txt dosyasına satır listesi olarak yaz. Şehir sütunu ilk üç karakterden, sıcaklık sütunu son beş karakterden oluşsun.

setup: |
  cat > hava.txt <<'EOF'
  IST 0012 18.5
  ANK 0025 21.0
  IZM 0007 27.3
  BUR 0031 14.2
  ANT 0019 25.8
  EOF

goal_tr: >
  hava.txt dosyasindaki her satiri "sehir sicaklik" bicimine cevirip ayni
  sirada satir listesi olarak duzeltilmis.txt dosyasina yaz; sehir sutunu
  ilk uc karakter, sicaklik sutunu son bes karakter olsun.

reference_solution: |
  python3 - <<'PY'
  lines = []
  with open('hava.txt') as f:
      for line in f:
          line = line.rstrip('\n')
          if not line:
              continue
          sehir = line[0:3]
          sicaklik = line[-5:]
          lines.append(sehir + ' ' + sicaklik)
  with open('duzeltilmis.txt', 'w') as out:
      out.write('\n'.join(lines) + '\n')
  PY

outputs:
  - {path: duzeltilmis.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: duzeltilmis.txt, value: [IST  18.5, ANK  21.0, IZM  27.3, BUR  14.2, ANT  25.8]}

metadata:
  domain: onar
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7272
