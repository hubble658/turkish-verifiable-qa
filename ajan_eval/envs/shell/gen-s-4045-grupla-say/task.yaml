id: gen-s-4045-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  "hava kayitlari/olcumler.txt" içindeki sabit genişlikli satırlardan şehir koduna göre sıcaklık toplamını ve kayıt sayısını hesapla; şehir koduna göre artan sırada "hava kayitlari/ozet_toplam.txt" ve "hava kayitlari/ozet_sayi.txt" dosyalarına yaz. "hava kayitlari/notlar.txt" dosyasını işleme katma.

setup: |
  mkdir -p "hava kayitlari"
  cat > "hava kayitlari/olcumler.txt" <<'DATA'
  IST 20240101 12 8
  ANK 20240101 05 3
  IZM 20240101 17 11
  IST 20240102 13 9
  ANK 20240102 04 2
  IZM 20240102 18 12
  IST 20240103 11 7
  ANK 20240103 06 4
  IZM 20240103 16 10
  DATA
  cat > "hava kayitlari/notlar.txt" <<'DATA'
  bu dosya ozetleme icin degil, sadece not
  IST 20240104 99 99
  DATA

goal_tr: >
  "hava kayitlari/olcumler.txt" dosyasindaki sabit genislikli satirlardan
  sehir kodunu ve sicaklik alanini kullanarak her sehir icin sicaklik
  toplamini ve kayit sayisini hesapla; sonuclari sehir koduna gore artan
  sirada "hava kayitlari/ozet_toplam.txt" ve "hava kayitlari/ozet_sayi.txt"
  dosyalarina yaz, notlar.txt dosyasini isleme katma.

reference_solution: |
  cd "hava kayitlari"
  awk '{toplam[$1]+=$3; sayi[$1]++} END {for (s in toplam) print s, toplam[s]}' olcumler.txt | sort > ozet_toplam.txt
  awk '{sayi[$1]++} END {for (s in sayi) print s, sayi[s]}' olcumler.txt | sort > ozet_sayi.txt

outputs:
  - {path: hava kayitlari/ozet_toplam.txt, kind: file}
  - {path: hava kayitlari/ozet_sayi.txt, kind: file}

checks:
  - {op: file_lines_eq, path: hava kayitlari/ozet_sayi.txt, value: [ANK 3, IST 3, IZM 3]}
  - {op: file_lines_eq, path: hava kayitlari/ozet_toplam.txt, value: [ANK 15, IST 36, IZM 51]}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4045
    bundle: awk
    tools:
    - awk
    konu: hava-durumu-kayitlari
    hedef: grupla-say
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: birden-cok-dosya
    kesif: yok
    uslup: terse
    direnc: bosluklu-ad
    bukulme: tuzak-dosya
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
