id: gen-s-3175-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) arşiv dizinindeki kargolar.ini ve rotalar.ini dosyalarını kargo kimliğine göre birleştir.

  2) Birleştirme sonucunda durumu gönderildi olan her kargo için "kimlik rota" biçiminde satırlar oluştur.

  3) Bu satırları kimliğe göre artan sırada ciktilar.txt dosyasına yaz.

setup: |
  mkdir -p arsiv
  cat > arsiv/kargolar.ini <<'INI'
  [K001]
  durum=gonderildi
  sehir=Ankara
  [K002]
  durum=teslim
  sehir=Izmir
  [K003]
  durum=gonderildi
  sehir=Bursa
  [K004]
  durum=iptal
  sehir=Ankara
  INI
  cat > arsiv/rotalar.ini <<'INI'
  [K001]
  rota=Ankara->Istanbul
  [K002]
  rota=Izmir->Ankara
  [K003]
  rota=Bursa->Ankara
  [K004]
  rota=Ankara->Izmir
  INI

goal_tr: >
  arsiv altinda bulunan kargolar.ini ve rotalar.ini dosyalarini kargo
  kimligine gore birlestirip, durumu gonderildi olan her kargo icin "kimlik
  rota" biciminde satirlari kimlige gore artan sirada ciktilar.txt dosyasina
  yaz

reference_solution: |
  mkdir -p is
  sed -n 's/^\[\(.*\)\]$/\1/p' arsiv/kargolar.ini > is/kimlikler.txt
  paste -d' ' is/kimlikler.txt <(sed -n 's/^durum=//p' arsiv/kargolar.ini) <(sed -n 's/^rota=//p' arsiv/rotalar.ini) > is/birlesik.txt
  awk '$2=="gonderildi"{print $1" "$3}' is/birlesik.txt | sort > ciktilar.txt
  mv is/birlesik.txt arsiv/birlesik.txt

outputs:
  - {path: ciktilar.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: ciktilar.txt, value: [K001 Ankara->Istanbul, K003 Bursa->Ankara]}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3175
    bundle: dosya-duzen
    tools:
    - mkdir
    - mv
    konu: kargo-takibi
    hedef: yeniden-duzenle
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: satir-listesi
    kesif: dosyayi-bul
    uslup: numarali-emir
    direnc: yok
    bukulme: kirli-veri
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
