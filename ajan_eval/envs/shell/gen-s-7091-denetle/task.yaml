id: gen-s-7091-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  dnm dizini altındaki vardiya.log dosyasında geçen her personel numarasını, vardiya/personel.map dosyasındaki eşleşmeyle denetle. Yalnızca personel.map içinde tanımlı olan personel numaralarından kaç farklı tanesinin logda geçtiğini bul ve bu sayıyı sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  mkdir -p vardiya dnm
  cat > vardiya/personel.map <<'MAP'
  101:Zeynep
  102:Murat
  103:Elif
  104:Kaan
  105:Selin
  MAP
  cat > dnm/vardiya.log <<'LOG'
  101 GUNDUZ
  102 GECE
  103 GUNDUZ
  104 GECE
  105 GUNDUZ
  101 GECE
  102 GUNDUZ
  LOG

goal_tr: >
  dnm dizini altindaki vardiya.log dosyasinda gecen her personel numarasini
  vardiya/personel.map dosyasindaki eslesmeyle denetle ve yalnizca
  personel.map icinde tanimli olan personel numaralarindan kac farkli
  tanesinin logda gectigini sonuc.txt dosyasina sadece sayi olarak yaz.

reference_solution: |
  grep -o '^[0-9][0-9]*' dnm/vardiya.log > /tmp/log_ids.txt
  cut -d: -f1 vardiya/personel.map > /tmp/map_ids.txt
  sort -u /tmp/log_ids.txt > /tmp/log_ids_u.txt
  comm -12 /tmp/log_ids_u.txt <(sort -u /tmp/map_ids.txt) > /tmp/valid_ids.txt
  wc -l < /tmp/valid_ids.txt > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '5'}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7091
    bundle: say
    tools:
    - grep
    - wc
    konu: personel-vardiyalari
    hedef: denetle
    girdi: log-satiri
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
