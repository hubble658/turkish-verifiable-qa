id: gen-s-4057-denetle
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) defter klasöründeki .kayit uzantılı her dosyayı bul.
  2) Bulduğun her .kayit dosyasını, dosya adından uzantısı çıkarılıp sonuna .denetim eklenmiş yeni adıyla aynı klasörde yeniden adlandır; böylece defter/ocak.kayit defter/ocak.denetim olur ve defter/subat.kayit defter/subat.denetim olur.
  3) defter klasöründe artık ocak.denetim ve subat.denetim dosyalarının bulunduğunu doğrula.

setup: |
  mkdir -p defter
  printf '1001|gider|kira|1500\r\n1002|gelir|satis|3200\r\n' > defter/ocak.kayit
  printf '1003|gider|maas|4200\r\n' > defter/subat.kayit
  printf 'aciklama|tarih|not\r\n' > defter/ozet.tmp

goal_tr: >
  defter klasorundeki .kayit uzantili her dosyayi, dosya adindan uzantisi
  cikarilip sonuna .denetim eklenmis yeni adiyla ayni klasorde yeniden
  adlandir.

reference_solution: |
  for f in defter/*.kayit; do mv "$f" "$(dirname "$f")/$(basename "$f" .kayit).denetim"; done

outputs:
  - {path: defter/ocak.denetim, kind: file}
  - {path: defter/subat.denetim, kind: file}

checks:
  - {op: file_lines_eq, path: defter/ocak.denetim, value: [1001|gider|kira|1500, 1002|gelir|satis|3200]}
  - {op: file_content_eq, path: defter/subat.denetim, value: 1003|gider|maas|4200}
  - {op: not_exists, path: defter/ocak.kayit}
  - {op: not_exists, path: defter/subat.kayit}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4057
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: muhasebe-kalemleri
    hedef: denetle
    girdi: log-satiri
    kaynak: cok-dosya
    cikti: yeniden-adlandirilmis
    kesif: yok
    uslup: numarali-emir
    direnc: crlf
    bukulme: tuzak-dosya
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
