prompt: 'kalemler.tsv dosyasındaki kayıtları durum sütununa göre ikiye ayır: durumu odendi olanları odendi.tsv dosyasına,
  durumu bekliyor olanları bekliyor.tsv dosyasına yaz. Her iki dosyada da başlık satırı bulunsun. Ayrıca her iki dosyada CRLF
  satır sonlarını LF yap ve kayıtları tutar sütununa göre küçükten büyüğe sırala. Son olarak odendi.tsv ve bekliyor.tsv dosyalarını
  karşılaştırıp sonucu karsilastirma.tsv dosyasına yaz.


  Şu şartlar sağlanmalı:

  - odendi.tsv dosyası yalnızca durumu odendi olan kayıtları içermeli ve başlık satırıyla başlamalı.

  - bekliyor.tsv dosyası yalnızca durumu bekliyor olan kayıtları içermeli ve başlık satırıyla başlamalı.

  - Her iki dosyada satır sonları LF olmalı, CRLF kalmamalı.

  - Her iki dosyadaki kayıtlar tutar sütununa göre küçükten büyüğe sıralı olmalı.

  - karsilastirma.tsv dosyası odendi.tsv ve bekliyor.tsv karşılaştırılarak oluşturulmalı.

  - kalemler.tsv dosyasındaki hiçbir kayıt kaybolmamalı; odendi ve bekliyor dışında durum değeri bulunmamalı.

  '
setup: 'printf ''kalem\ttutar\tdurum\r\nkira\t1200\todendi\r\nsu\t150\todendi\r\nelektrik\t300\tbekliyor\r\ninternet\t200\todendi\r\ndogalgaz\t450\tbekliyor\r\nasansor\t75\todendi\r\n''
  > kalemler.tsv

  for i in $(seq 1 40); do printf ''kalem%02d\t%d\t%s\r\n'' "$i" "$((i * 10))" "$( [ $((i % 3)) -eq 0 ] && echo bekliyor ||
  echo odendi )"; done >> kalemler.tsv

  '
goal_tr: 'kalemler.tsv dosyasindaki durum sutunu odendi olan kalemleri odendi.tsv, bekliyor olanlari bekliyor.tsv dosyasina
  baslik satiriyla birlikte ayikla; CRLF satir sonlarini LF yap ve her iki dosyayi tutar sutununa gore kucukten buyuge sirala.

  '
reference_solution: 'tr -d ''\r'' < kalemler.tsv > temiz.tsv

  head -n 1 temiz.tsv > odendi.tsv

  awk -F''\t'' ''NR>1 && $3=="odendi"'' temiz.tsv | sort -t$''\t'' -k2,2n >> odendi.tsv

  head -n 1 temiz.tsv > bekliyor.tsv

  awk -F''\t'' ''NR>1 && $3=="bekliyor"'' temiz.tsv | sort -t$''\t'' -k2,2n >> bekliyor.tsv

  cut -f1,2 odendi.tsv | paste -d''\t'' - bekliyor.tsv > karsilastirma.tsv

  '
