id: gen-s-4092-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) kargo.tsv dosyasındaki gönderi türlerini incele.
  2) Her gönderi türü için ayrı bir tsv dosyası oluştur: dosya adı tur_standart.tsv, tur_ekspres.tsv ve tur_kargo.tsv olsun.
  3) Her dosyanın ilk satırında kargo.tsv ile aynı başlık satırı yer alsın.
  4) Her dosyada yalnızca ilgili gönderi türüne ait satırlar bulunsun.

setup: |
  cat > kargo.tsv <<'EOF'
  takip_no	gonderi_turu	agirlik_kg	sehir
  TR1001	standart	2.5	Ankara
  TR1002	ekspres	1.0	Istanbul
  TR1003	standart	7.8	Izmir
  TR1004	ekspres	3.4	Ankara
  TR1005	kargo	12.0	Bursa
  EOF

goal_tr: >
  kargo.tsv dosyasindaki her gonderi turu icin ayri bir tsv dosyasi uret:
  dosya adi tur_<gonderi_turu>.tsv olsun, ilk satir baslik olsun ve sadece o
  tura ait satirlar yer alsin.

reference_solution: |
  cut -f2 kargo.tsv | tail -n +2 | sort -u > /tmp/turler.txt
  while read -r tur; do
    { head -n1 kargo.tsv; grep -P "\t${tur}\t" kargo.tsv; } | tee "tur_${tur}.tsv" > /dev/null
  done < /tmp/turler.txt

outputs:
  - {path: tur_standart.tsv, kind: file}
  - {path: tur_ekspres.tsv, kind: file}
  - {path: tur_kargo.tsv, kind: file}

checks:
  - {op: file_lines_eq, path: tur_ekspres.tsv, value: ["takip_no\tgonderi_turu\tagirlik_kg\tsehir", "TR1002\tekspres\t1.0\tIstanbul", "TR1004\tekspres\t3.4\tAnkara"]}
  - {op: file_lines_eq, path: tur_kargo.tsv, value: ["takip_no\tgonderi_turu\tagirlik_kg\tsehir", "TR1005\tkargo\t12.0\tBursa"]}
  - {op: file_lines_eq, path: tur_standart.tsv, value: ["takip_no\tgonderi_turu\tagirlik_kg\tsehir", "TR1001\tstandart\t2.5\tAnkara", "TR1003\tstandart\t7.8\tIzmir"]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4092
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: kargo-takibi
    hedef: donustur
    girdi: tsv
    kaynak: tek-dosya
    cikti: birden-cok-dosya
    kesif: yok
    uslup: numarali-emir
    direnc: crlf
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
