id: gen-s-4009-karsilastir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  gelen/birinci.ini ve gelen/ikinci.ini içindeki ortak satırları ortak.ini dosyasına yaz; sonunda newline olmasın.

setup: |
  mkdir -p gelen
  printf '1001|KASA|1500\n1002|BANKA|4200\n1003|ALACAK|780\n' > gelen/birinci.ini
  printf '1002|BANKA|4200\n1003|ALACAK|900\n1004|BORC|310\n' > gelen/ikinci.ini

goal_tr: >
  gelen/birinci.ini ve gelen/ikinci.ini dosyalarindaki satirlari
  karsilastir; her iki dosyada da birebir ayni olan satirlari, sonunda
  newline olmadan, ortak.ini adli dosyaya yaz.

reference_solution: |
  sort gelen/birinci.ini -o /tmp/a.srt
  sort gelen/ikinci.ini -o /tmp/b.srt
  comm -12 /tmp/a.srt /tmp/b.srt | tr -d '\n' > ortak.ini

outputs:
  - {path: ortak.ini, kind: file}

checks:
  - {op: file_content_eq, path: ortak.ini, value: 1002|BANKA|4200}

metadata:
  domain: karsilastir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4009
    bundle: kume-farki
    tools:
    - comm
    - sort
    konu: muhasebe-kalemleri
    hedef: karsilastir
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: yeniden-adlandirilmis
    kesif: yok
    uslup: terse
    direnc: son-newline-yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
