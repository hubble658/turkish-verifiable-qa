id: gen-s-7303-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) hava.tsv dosyasındaki ölçüm sütunundaki değerlerin toplamını hesapla.
  2) hava_eski.tsv dosyasını hesaba katma.
  3) Bulduğun toplamı sonuc.txt dosyasına yalnızca sayı olarak yaz.

setup: |
  cat > hava.tsv <<'EOF'
  sehir	tarih	olcum
  ankara	2024-01-01	5
  istanbul	2024-01-01	12
  ankara	2024-01-02	7
  izmir	2024-01-01	18
  istanbul	2024-01-02	9
  ankara	2024-01-03	4
  EOF
  cat > hava_eski.tsv <<'EOF'
  sehir	tarih	olcum
  ankara	2023-12-01	3
  istanbul	2023-12-01	11
  EOF

goal_tr: >
  hava.tsv dosyasindaki olcum sutunundaki degerlerin toplamini sonuc.txt
  dosyasina sadece sayi olarak yaz; hava_eski.tsv dosyasini hesaba katma.

reference_solution: |
  tail -n +2 hava.tsv | cut -f3 | tr '\n' '+' | sed 's/+$//' > gecici.txt
  awk '{print}' gecici.txt > /dev/null
  sed 's/$/\n/' gecici.txt | awk '{s+=$0} END {print s}' > sonuc.txt
  rm gecici.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '5'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7303
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: hava-durumu-kayitlari
    hedef: ayikla
    girdi: tsv
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: tuzak-dosya
