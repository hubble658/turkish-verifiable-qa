id: gen-s-7073-toplu-yeniden-adlandir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Vardiya kayıtlarını düzenli tutmak için bir arşivleme düzeni kurmam gerekiyordu ama gün boyunca başka işler çıkınca bu iş sürekli ertelendi. Şimdi eski kayıtları bir araya toplayıp düzenli bir yapıya kavuşturmak istiyorum. Elimde vardiya dizini altında arsiv ve aktif adında iki alt dizin var; buralarda farklı tarihlere ait günlük kayıtlar tutuluyor.

  vardiya dizini ağacındaki tüm .log uzantılı dosyaları vardiya/arsivlenmis dizinine taşı. Bu dizin şu an yok, önce onu oluşturman gerekiyor. Taşırken dosya adlarını da düzenle: arsiv altındaki kayıtlar arsiv_2024-01-01.log, arsiv_2024-01-02.log biçiminde; aktif altındaki kayıtlar ise aktif_2024-01-03.log biçiminde adlandırılsın. Yani vardiya/arsivlenmis altında sonuç olarak arsiv_2024-01-01.log, arsiv_2024-01-02.log ve aktif_2024-01-03.log dosyaları bulunmalı. .log uzantılı olmayan dosyalara ise hiç dokunma; örneğin vardiya/aktif/notlar.txt olduğu yerde kalsın.

setup: |
  mkdir -p vardiya/arsiv vardiya/aktif
  cat > vardiya/arsiv/2024-01-01.log <<'LOG'
  V001 sabah geldi
  V002 aksam geldi
  LOG
  cat > vardiya/arsiv/2024-01-02.log <<'LOG'
  V001 sabah geldi
  LOG
  cat > vardiya/aktif/2024-01-03.log <<'LOG'
  V002 sabah geldi
  V003 gece geldi
  LOG
  cat > vardiya/aktif/notlar.txt <<'TXT'
  bu bir tuzak dosyadir
  TXT

goal_tr: >
  vardiya dizini agacindaki .log uzantili dosyalari, arsiv altindakiler
  arsiv_2024-01-01.log biciminde, aktif altindakiler aktif_2024-01-03.log
  biciminde olacak sekilde vardiya/arsivlenmis dizinine tasi; .log disindaki
  dosyalara dokunma

reference_solution: |
  mkdir -p vardiya/arsivlenmis
  find vardiya/arsiv -maxdepth 1 -type f -name '*.log' -exec basename {} .log \; | sed 's/^/arsiv_/' > /tmp/adlar.txt
  find vardiya/aktif -maxdepth 1 -type f -name '*.log' -exec basename {} .log \; | sed 's/^/aktif_/' >> /tmp/adlar.txt
  find vardiya/arsiv vardiya/aktif -maxdepth 1 -type f -name '*.log' | sort | paste -d' ' - /tmp/adlar.txt | while read src dst; do mv "$src" "vardiya/arsivlenmis/$dst.log"; done

outputs:
  - {path: vardiya/arsivlenmis, kind: dir}
  - {path: vardiya/arsivlenmis/arsiv_2024-01-01.log, kind: file}
  - {path: vardiya/arsivlenmis/arsiv_2024-01-02.log, kind: file}
  - {path: vardiya/arsivlenmis/aktif_2024-01-03.log, kind: file}
  - {path: vardiya/aktif/notlar.txt, kind: file}

checks:
  - {op: dir_entries_eq, path: vardiya/arsivlenmis, value: [aktif_2024-01-03.log, arsiv_2024-01-01.log, arsiv_2024-01-02.log]}
  - {op: file_content_eq, path: vardiya/arsivlenmis/aktif_2024-01-03.log, value: V001 sabah geldi}
  - {op: file_lines_eq, path: vardiya/arsivlenmis/arsiv_2024-01-01.log, value: [V002 sabah geldi, V003 gece geldi]}
  - {op: file_lines_eq, path: vardiya/arsivlenmis/arsiv_2024-01-02.log, value: [V001 sabah geldi, V002 aksam geldi]}
  - {op: not_exists, path: vardiya/aktif/2024-01-03.log}
  - {op: not_exists, path: vardiya/arsiv/2024-01-01.log}
  - {op: not_exists, path: vardiya/arsiv/2024-01-02.log}

