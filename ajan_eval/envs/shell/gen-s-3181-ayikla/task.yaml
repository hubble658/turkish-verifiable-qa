id: gen-s-3181-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14
prompt: 'notlar.json dosyasındaki her öğrencinin adını ve notunu "ad:not" biçiminde içeren, notu 50 ve üzeri olan öğrencileri
  notlarına göre büyükten küçüğe sıralı olarak gecen.txt dosyasına her satırda bir öğrenci olacak şekilde yaz.

  '
setup: 'cat > notlar.json <<''JSON''

  {"ogrenciler":[

  {"ad":"ayse","not":85},

  {"ad":"mehmet","not":42},

  {"ad":"zeynep","not":91},

  {"ad":"can","not":58},

  {"ad":"elif","not":73}

  ]}

  JSON

  '
goal_tr: 'notlar.json icindeki her ogrencinin adini ve notunu "ad:not" biciminde iceren, notu 50 ve uzeri olan ogrencileri
  notlarina gore buyukten kucuge sirali olarak gecen.txt dosyasina satir satir yaz

  '
reference_solution: 'python3 - <<''PY''

  import json

  o = [x for x in json.load(open("notlar.json"))["ogrenciler"] if x["not"] >= 50]

  o.sort(key=lambda x: -x["not"])

  open("gecen.txt", "w").write("".join(f"{x[''ad'']}:{x[''not'']}\n" for x in o))

  PY

  '
