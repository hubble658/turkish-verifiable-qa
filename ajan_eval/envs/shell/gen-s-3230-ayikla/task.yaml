id: gen-s-3230-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  kutuphane dizin ağacındaki tüm .json dosyalarından kitap adlarını topla ve her satırda bir kitap adı olacak şekilde alfabetik sıralı olarak kitaplar.txt dosyasına yaz.

  Şu şartlar sağlanmalı:
  - kutuphane dizini altındaki tüm .json dosyaları taranmalı (edebiyat, bilim ve tarih alt dizinlerindekiler dahil).
  - Her .json dosyasındaki "kitap" alanının değeri toplanmalı.
  - Toplanan kitap adları alfabetik olarak sıralanmalı.
  - Çıktı, çalışma dizinindeki kitaplar.txt dosyasına yazılmalı.
  - kitaplar.txt içinde her satırda yalnızca bir kitap adı bulunmalı.

setup: |
  mkdir -p kutuphane/edebiyat kutuphane/bilim kutuphane/tarih
  printf '{"kitap":"Kar","yazar":"Orhan Pamuk","yil":2002}\n{"kitap":"Ince Memed","yazar":"Yasar Kemal","yil":1955}\n' > kutuphane/edebiyat/kitaplar.json
  printf '{"kitap":"Kosmos","yazar":"Carl Sagan","yil":1980}\n{"kitap":"Genom","yazar":"Matt Ridley","yil":1999}\n{"kitap":"Evrenin Kisa Tarihi","yazar":"Stephen Hawking","yil":1988}\n' > kutuphane/bilim/kitaplar.json
  printf '{"kitap":"Osmanli Tarihi","yazar":"Halil Inalcik","yil":1973}\n' > kutuphane/tarih/kitaplar.json

goal_tr: >
  kutuphane dizin agacindaki tum .json dosyalarindan kitap adlarini toplayip
  her satirda bir kitap adi olacak sekilde alfabetik sirali olarak
  kitaplar.txt dosyasina yaz

reference_solution: |
  find kutuphane -name '*.json' -type f | sort | xargs cat | cut -d'"' -f4 | sort | tee kitaplar.txt > /dev/null

outputs:
  - {path: kitaplar.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: kitaplar.txt, value: [Evrenin Kisa Tarihi, Genom, Ince Memed, Kar, Kosmos, Osmanli Tarihi]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3230
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: kutuphane-kayitlari
    hedef: ayikla
    girdi: json
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: yok
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
