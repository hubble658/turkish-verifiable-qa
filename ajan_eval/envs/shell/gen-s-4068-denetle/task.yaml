id: gen-s-4068-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) randevular.txt dosyasındaki her doktor için randevu sayısını bul.

  2) Doktor adlarını alfabetik olarak sırala ve her doktorun randevu sayısını {"doktor": sayı, ...} biçiminde geçerli JSON olarak denetim.json dosyasına yaz.

setup: |
  cat > randevular.txt <<'RANDEVU'
  1001 2024-01-05 09:00 DR AYKUT
  1002 2024-01-05 09:30 DR AYKUT
  1003 2024-01-05 10:00 DR BORA
  1004 2024-01-06 09:00 DR BORA
  1005 2024-01-06 09:30 DR AYKUT
  1006 2024-01-06 10:00 DR CEYDA
  1007 2024-01-07 11:00 DR CEYDA
  1008 2024-01-07 11:30 DR AYKUT
  1009 2024-01-07 12:00 DR BORA
  1010 2024-01-08 09:00 DR CEYDA
  RANDEVU
  printf '%s' "$(cat randevular.txt)" > randevular.txt

goal_tr: >
  randevular.txt dosyasindaki her doktor icin randevu sayisini bulup, doktor
  adlarina gore alfabetik sirali olarak {"doktor": sayi, ...} biciminde
  gecerli JSON olarak denetim.json dosyasina yaz

reference_solution: |
  cut -d' ' -f5- randevular.txt | sort | uniq -c | sort -k2 > sayimlar.txt
  awk '{printf "%s\"%s\": %s", (NR>1?", ":""), substr($0, index($0,$2)), $1} END {print ""}' sayimlar.txt > govde.txt
  printf '{%s}\n' "$(cat govde.txt)" > denetim.json
  cat denetim.json

outputs:
  - {path: denetim.json, kind: json}

checks:
  - {op: json_eq, path: denetim.json, value: {AYKUT: 4, BORA: 3, CEYDA: 3}}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4068
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: hastane-randevulari
    hedef: denetle
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: json
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: son-newline-yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
