id: gen-s-3245-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) siparisler/restoran.txt ve siparisler/bolge.txt dosyalarını restoran kimliğine göre birleştir.
  2) Her bölge için sipariş adedini ve toplam tutarı hesapla.
  3) Sonucu bolge,adet,toplam başlıklarıyla, bölge adına göre artan sırada siparisler/bolge_ozet.csv dosyasına yaz.

setup: |
  mkdir -p siparisler
  cat > siparisler/restoran.txt <<'TXT'
  R001  Pizza    12
  R002  Corba     7
  R003  Salata    9
  R004  Pizza    15
  R005  Corba     4
  R006  Makarna  11
  TXT
  cat > siparisler/bolge.txt <<'TXT'
  R001  Ankara
  R002  Izmir
  R003  Ankara
  R004  Bursa
  R005  Izmir
  TXT

goal_tr: >
  siparisler/restoran.txt ve siparisler/bolge.txt dosyalarini restoran
  kimligine gore birlestirip, her bolge icin siparis adedi ve toplam tutari
  hesaplayarak bolge,adet,toplam basliklariyla siparisler/bolge_ozet.csv
  dosyasina bolge adina gore artan sirada yaz

reference_solution: |
  mkdir -p siparisler/gecici
  awk '{print $1, $3}' siparisler/restoran.txt | sort -k1,1 > siparisler/gecici/tutar.txt
  sort -k1,1 siparisler/bolge.txt > siparisler/gecici/bolge_sirali.txt
  join -1 1 -2 1 siparisler/gecici/tutar.txt siparisler/gecici/bolge_sirali.txt | awk '{adet[$3]++; toplam[$3]+=$2} END {for (b in adet) print b "," adet[b] "," toplam[b]}' | sort -t, -k1,1 > siparisler/gecici/govde.csv
  printf 'bolge,adet,toplam\n' > siparisler/gecici/ozet.csv
  cat siparisler/gecici/govde.csv >> siparisler/gecici/ozet.csv
  mv siparisler/gecici/ozet.csv siparisler/bolge_ozet.csv
  rm -rf siparisler/gecici

outputs:
  - {path: siparisler/bolge_ozet.csv, kind: csv, run: cat siparisler/bolge_ozet.csv}

checks:
  - {op: file_lines_eq, path: siparisler/bolge_ozet.csv, value: ['bolge,adet,toplam', 'Ankara,2,21', 'Bursa,1,15', 'Izmir,2,11']}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3245
    bundle: dosya-duzen
    tools:
    - mkdir
    - mv
    konu: restoran-siparisleri
    hedef: bol
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: csv
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
