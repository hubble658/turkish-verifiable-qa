id: gen-s-3131-bol
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Sevkiyat ekibi bu hafta bölge bazlı raporları elle çıkarıyordu ve her seferinde aynı tabloları tekrar tekrar düzenlemek epey zaman yiyor. Ben de bu işi bir kereye mahsus otomatikleştirip arşivlemek istedim, böylece hem rapor hem de sıkıştırılmış hali tek yerde durur. Çalışma dizininde sevkiyat klasörü altında siparisler.csv dosyası hazır; içinde siparis_id, musteri, urun, adet ve bolge sütunları var. Bu dosyadaki satırları bolge sütununa göre gruplayıp, her bölge için sipariş sayısını ve toplam adedi içeren ozet.json dosyasını oluştur. Ardından bu ozet.json dosyasını gzip ile sıkıştırıp ozet.json.gz olarak elde et ve son olarak ozet.json.gz dosyasını sevkiyat.tar arşivine, arşiv içinde yine ozet.json.gz adıyla paketle.

setup: |
  mkdir -p sevkiyat
  cat > sevkiyat/siparisler.csv <<'CSV'
  siparis_id,musteri,urun,adet,bolge
  1001,Ayse,lahmacun,3,istanbul
  1002,Mehmet,pide,2,ankara
  1003,Zeynep,kebap,1,istanbul
  1004,Ali,lahmacun,5,izmir
  1005,Fatma,pide,4,ankara
  1006,Can,kebap,2,izmir
  1007,Elif,lahmacun,1,istanbul
  CSV

goal_tr: >
  sevkiyat/siparisler.csv dosyasindaki satirlari bolge sutununa gore
  gruplayip her bolge icin siparis sayisini ve toplam adedi iceren ozet.json
  dosyasini uret; bu dosyayi gzip ile ozet.json.gz olarak sikistir ve
  sevkiyat.tar arsivine ozet.json.gz olarak paketle.

reference_solution: |
  awk -F, 'NR>1 {sayi[$5]++; adet[$5]+=$4} END {printf "{"; n=0; for (b in sayi) {n++; if (n>1) printf ","; printf "\"%s\":{\"siparis\":%d,\"adet\":%d}", b, sayi[b], adet[b]} printf "}\n"}' sevkiyat/siparisler.csv | sort > ozet.json
  gzip -c ozet.json > ozet.json.gz
  tar -cf sevkiyat.tar ozet.json.gz

outputs:
  - {path: ozet.json, kind: json}
  - {path: ozet.json.gz, kind: file}
  - {path: sevkiyat.tar, kind: file}

checks:
  - {op: json_eq, path: ozet.json, value: {ankara: {siparis: 2, adet: 6}, istanbul: {siparis: 3, adet: 5}, izmir: {siparis: 2, adet: 7}}}
  - {op: run_stdout_eq, cmd: gzip -dc ozet.json.gz, value: '{"ankara":{"siparis":2,"adet":6},"istanbul":{"siparis":3,"adet":5},"izmir":{"siparis":2,"adet":7}}'}
  - {op: run_stdout_eq, cmd: tar -tf sevkiyat.tar | sort, value: ozet.json.gz}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3131
    bundle: arsiv
    tools:
    - tar
    - gzip
    konu: restoran-siparisleri
    hedef: bol
    girdi: csv
    kaynak: tek-dosya
    cikti: json
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
