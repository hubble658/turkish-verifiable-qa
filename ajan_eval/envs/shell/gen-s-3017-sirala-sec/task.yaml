id: gen-s-3017-sirala-sec
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) kutuphane/arsiv dizinindeki her dosyayı incele.
  2) Her dosyadaki yil satirindaki değeri çıkar.
  3) En büyük yila sahip dosyayi belirle.
  4) O dosyadaki raf değerini al.
  5) Bu raf değerini sonuc.txt dosyasina sadece değer olarak yaz.

setup: |
  mkdir -p kutuphane/arsiv
  cat > kutuphane/arsiv/a.txt <<'TXT'
  kitap: Simyaci
  yil: 1988
  raf: A3
  TXT
  cat > kutuphane/arsiv/b.txt <<'TXT'
  kitap: Tutunamayanlar
  yil: 1971
  raf: B1
  TXT
  cat > kutuphane/arsiv/c.txt <<'TXT'
  kitap: Ince Memed
  yil: 1955
  raf: A1
  TXT
  cat > kutuphane/arsiv/d.txt <<'TXT'
  kitap: Kuyucakli Yusuf
  yil: 1922
  raf: C7
  TXT

goal_tr: >
  kutuphane/arsiv dizinindeki her dosyadan yil satirindaki degeri cikarip en
  buyuk yila sahip dosyanin raf degerini sonuc.txt'ye sadece deger olarak
  yaz

reference_solution: |
  awk 'FNR==2{y=$2} FNR==3{r=$2; print y, r}' kutuphane/arsiv/*.txt | sort -k1,1n | tail -n1 | awk '{print $2}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: A3}

metadata:
  domain: sirala-sec
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3017
    bundle: awk
    tools:
    - awk
    konu: kutuphane-kayitlari
    hedef: sirala-sec
    girdi: duz-metin
    kaynak: dizin-agaci
    cikti: tek-sayi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
