id: gen-s-3042-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) sevkiyat/kargolar.txt dosyasındaki her kargo için, kargonun varış şehri arsiv/teslim.txt dosyasında teslim edilmiş olarak işaretliyse kargo kodunu ve varış şehrini belirle.

  2) Bu kargo kodlarını ve varış şehirlerini "KOD SEHIR" biçiminde, kargo koduna göre artan sırada denetim.txt dosyasına yaz.

  3) denetim.txt dosyasındaki satır sayısını denetim.sayisi dosyasına yaz.

  4) İşlemde kullanılan kaynak dosyaların adlarını kaynaklar.listesi dosyasına yaz.

setup: |
  mkdir -p sevkiyat arsiv
  cat > sevkiyat/kargolar.txt <<'K'
  K001 ISTANBUL ANKARA
  K002 IZMIR BURSA
  K003 ANKARA IZMIR
  K004 BURSA ISTANBUL
  K005 ANKARA BURSA
  K006 IZMIR ANKARA
  K007 ISTANBUL IZMIR
  K008 BURSA ANKARA
  K009 ANKARA ISTANBUL
  K010 IZMIR BURSA
  K011 ISTANBUL ANKARA
  K012 BURSA IZMIR
  K013 ANKARA BURSA
  K014 IZMIR ISTANBUL
  K015 ISTANBUL BURSA
  K016 ANKARA IZMIR
  K017 BURSA ANKARA
  K018 IZMIR ANKARA
  K019 ISTANBUL IZMIR
  K020 ANKARA ISTANBUL
  K
  cat > arsiv/teslim.txt <<'T'
  K001
  K002
  K004
  K005
  K007
  K008
  K010
  K011
  K013
  K014
  K016
  K017
  K019
  K020
  T

goal_tr: >
  sevkiyat/kargolar.txt icindeki her kargo icin, kargonun varis sehri
  arsiv/teslim.txt dosyasinda teslim edilmis olarak isaretliyse kargo kodunu
  ve varis sehrini "KOD SEHIR" biciminde, kargo koduna gore artan sirada
  denetim.txt dosyasina yaz.

reference_solution: |
  awk 'NR==FNR{t[$1]=1;next} $1 in t{print $1, $3}' arsiv/teslim.txt sevkiyat/kargolar.txt | sort > denetim.txt
  wc -l < denetim.txt > denetim.sayisi
  find sevkiyat arsiv -type f | sort > kaynaklar.listesi

outputs:
  - {path: denetim.txt, kind: lines}
  - {path: denetim.sayisi, kind: file}
  - {path: kaynaklar.listesi, kind: file}

checks:
  - {op: file_content_eq, path: denetim.sayisi, value: '14'}
  - {op: file_lines_eq, path: denetim.txt, value: [K001 ANKARA, K002 BURSA, K004 ISTANBUL, K005 BURSA, K007 IZMIR, K008 ANKARA, K010 BURSA, K011 ANKARA, K013 BURSA, K014 ISTANBUL, K016 IZMIR, K017 ANKARA, K019 IZMIR, K020 ISTANBUL]}
  - {op: file_lines_eq, path: kaynaklar.listesi, value: [arsiv/teslim.txt, sevkiyat/kargolar.txt]}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3042
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: kargo-takibi
    hedef: denetle
    girdi: duz-metin
    kaynak: iki-dosya-capraz
    cikti: satir-listesi
    kesif: dolayli-hedef
    uslup: numarali-emir
    direnc: yok
    bukulme: olcek
    adim: 4
    image: verifiable-dataset/base:latest
