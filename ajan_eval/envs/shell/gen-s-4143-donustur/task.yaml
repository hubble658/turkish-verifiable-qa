id: gen-s-4143-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  yorumlar klasöründeki tüm .txt dosyalarındaki satırlara bakıp bunlardan benzersiz olanların sayısını bul ve bu sayıyı sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  mkdir -p yorumlar
  cat > yorumlar/a.txt <<'TXT'
  urun harika
  urun harika
  kargo hizli
  TXT
  cat > yorumlar/b.txt <<'TXT'
  urun harika
  fiyat pahali
  kargo hizli
  kargo hizli
  TXT
  cat > yorumlar/c.txt <<'TXT'
  urun harika
  TXT

goal_tr: >
  yorumlar klasorundeki tum .txt dosyalarindaki satirlarin benzersiz
  olanlarinin sayisini sonuc.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  cat yorumlar/*.txt > hepsi.txt
  sort hepsi.txt > sirali.txt
  uniq sirali.txt > benzersiz.txt
  wc -l < benzersiz.txt > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '3'}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4143
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: urun-yorumlari
    hedef: donustur
    girdi: duz-metin
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: kirli-veri
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
