id: gen-s-3180-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) kayitlar dizin ağacındaki tüm .log dosyalarını tara.
  2) Her satırı "tarih | kayit_no | aciklama | tutar | tur" biçiminden "kayit_no;tarih;tur;tutar" biçimine çevir.
  3) Her girdi dosyası için cikti/ altında, dosyanın bulunduğu dizinin adını taşıyan bir dizinde, girdiyle aynı adda bir çıktı dosyası oluştur: cikti/ocak/defter.log, cikti/subat/defter.log, cikti/arsiv/eski.log.

setup: |
  mkdir -p kayitlar/2024/ocak kayitlar/2024/subat kayitlar/arsiv
  cat > kayitlar/2024/ocak/defter.log <<'LOG'
  01.01.2024 | 1001 | kira | 15000 | BORC
  02.01.2024 | 1002 | elektrik | 2300 | BORC
  03.01.2024 | 1003 | tahsilat | 5000 | ALACAK
  LOG
  cat > kayitlar/2024/subat/defter.log <<'LOG'
  01.02.2024 | 2001 | su | 800 | BORC
  02.02.2024 | 2002 | tahsilat | 12000 | ALACAK
  LOG
  cat > kayitlar/arsiv/eski.log <<'LOG'
  01.12.2023 | 9001 | kira | 14000 | BORC
  LOG

goal_tr: >
  kayitlar dizin agacindaki tum .log dosyalarini tara; her satiri "tarih |
  kayit_no | aciklama | tutar | tur" biciminden "kayit_no;tarih;tur;tutar"
  bicimine cevir ve her girdi dosyasi icin dosyanin kendi dizin adini
  tasiyan, girdiyle ayni adi koruyan cikti dosyasini cikti/ altinda olustur

reference_solution: |
  find kayitlar -type f -name '*.log' | while read -r f; do
    d=$(basename "$(dirname "$f")")
    mkdir -p "cikti/$d"
    awk -F' \\| ' '{gsub(/^ +| +$/,"",$1);gsub(/^ +| +$/,"",$2);gsub(/^ +| +$/,"",$3);gsub(/^ +| +$/,"",$4);gsub(/^ +| +$/,"",$5); print $2";"$1";"$5";"$4}' "$f" > "cikti/$d/$(basename "$f")"
  done

outputs:
  - {path: cikti, kind: dir}
  - {path: cikti/ocak/defter.log, kind: lines}
  - {path: cikti/subat/defter.log, kind: lines}
  - {path: cikti/arsiv/eski.log, kind: lines}

checks:
  - {op: dir_entries_eq, path: cikti, value: [arsiv, ocak, subat]}
  - {op: file_content_eq, path: cikti/arsiv/eski.log, value: 9001;01.12.2023;BORC;14000}
  - {op: file_lines_eq, path: cikti/ocak/defter.log, value: [1001;01.01.2024;BORC;15000, 1002;02.01.2024;BORC;2300, 1003;03.01.2024;ALACAK;5000]}
  - {op: file_lines_eq, path: cikti/subat/defter.log, value: [2001;01.02.2024;BORC;800, 2002;02.02.2024;ALACAK;12000]}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3180
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: muhasebe-kalemleri
    hedef: yeniden-duzenle
    girdi: log-satiri
    kaynak: dizin-agaci
    cikti: birden-cok-dosya
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
