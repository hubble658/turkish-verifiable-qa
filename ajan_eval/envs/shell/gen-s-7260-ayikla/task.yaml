id: gen-s-7260-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Vardiya planlamasıyla uğraşan bir ekibiz ve aylık çizelgeleri ayrı ayrı klasörlerde tutuyoruz. Her ay kendi ekip.csv dosyasına sahip ama artık hepsini bir arada görebileceğimiz tek bir özet çıkarına ihtiyacımız var; yoksa her seferinde klasör klasör gezip duruyoruz. Bu yüzden vardiya dizini altındaki tüm ekip.csv dosyalarını tarayıp vardiya değerlerini büyük harfe çevirecek ve her satırın başına o satırın geldiği dosyanın yolunu ilk sütun olarak ekleyecek bir işe ihtiyacım var. Sonuçta tüm satırlar tek bir vardiya_ozet.csv dosyasında toplanmalı ve başlık satırı yalnızca bir kez, en başta yer almalı.

setup: |
  mkdir -p vardiya/ocak vardiya/subat vardiya/mart
  cat > vardiya/ocak/ekip.csv <<'CSV'
  ad,gun,vardiya
  ali,01,gece
  ayse,01,gunduz
  can,02,gece
  deniz,02,gunduz
  CSV
  cat > vardiya/subat/ekip.csv <<'CSV'
  ad,gun,vardiya
  ali,01,gunduz
  ayse,01,gece
  can,02,gunduz
  deniz,02,gece
  CSV
  cat > vardiya/mart/ekip.csv <<'CSV'
  ad,gun,vardiya
  ali,01,gece
  ayse,02,gece
  can,01,gunduz
  CSV

goal_tr: >
  vardiya dizini altindaki tum ekip.csv dosyalarindaki vardiya degerlerini
  buyuk harfe cevirip, dosya yolunu ilk sutun olarak ekleyerek tum satirlari
  tek bir vardiya_ozet.csv dosyasinda biriktir; baslik satiri bir kez en
  basta yer alsin.

reference_solution: |
  find vardiya -name ekip.csv | sort | while read -r f; do
    sed "s|^|$f,|" "$f"
  done | sed '1s/^[^,]*,//' > vardiya_ozet.csv
  sed -i 's/gunduz/GUNDUZ/g; s/gece/GECE/g' vardiya_ozet.csv
  tr 'a-z' 'A-Z' < vardiya/ocak/ekip.csv | head -n 1 > /dev/null

outputs:
  - {path: vardiya_ozet.csv, kind: file}

checks:
  - {op: file_lines_eq, path: vardiya_ozet.csv, value: ['ad,gun,vardiya', 'vardiya/mart/ekip.csv,ali,01,GECE', 'vardiya/mart/ekip.csv,ayse,02,GECE', 'vardiya/mart/ekip.csv,can,01,GUNDUZ', 'vardiya/ocak/ekip.csv,ad,gun,vardiya', 'vardiya/ocak/ekip.csv,ali,01,GECE', 'vardiya/ocak/ekip.csv,ayse,01,GUNDUZ', 'vardiya/ocak/ekip.csv,can,02,GECE', 'vardiya/ocak/ekip.csv,deniz,02,GUNDUZ', 'vardiya/subat/ekip.csv,ad,gun,vardiya', 'vardiya/subat/ekip.csv,ali,01,GUNDUZ', 'vardiya/subat/ekip.csv,ayse,01,GECE', 'vardiya/subat/ekip.csv,can,02,GUNDUZ', 'vardiya/subat/ekip.csv,deniz,02,GECE']}

