id: gen-s-4081-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  notlar.csv dosyasındaki her öğrencinin ad, soyad, vize ve final alanlarını iki nokta ile birleştir; virgülleri boşluğa çevirerek her satırı "ad soyad vize final" biçiminde notlar.txt dosyasına yaz.

setup: |
  cat > notlar.csv <<'CSV'
  ad,soyad,vize,final
  ayse,yilmaz,70,80
  mehmet,demir,60,55
  zeynep,kaya,90,95
  ali,celik,40,50
  CSV

goal_tr: >
  notlar.csv dosyasindaki her ogrenci icin "ad soyad vize final" alanlarini
  iki nokta ile birlestirip, virgulleri bosluga cevirerek, her satiri "ad
  soyad vize final" biciminde notlar.txt dosyasina yaz

reference_solution: |
  cut -d, -f1,2 notlar.csv > adlar.txt
  cut -d, -f3,4 notlar.csv > puanlar.txt
  paste -d' ' adlar.txt puanlar.txt | tr ',' ' ' > notlar.txt
  rm adlar.txt puanlar.txt

outputs:
  - {path: notlar.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: notlar.txt, value: [ad soyad vize final, ayse yilmaz 70 80, mehmet demir 60 55, zeynep kaya 90 95, ali celik 40 50]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4081
    bundle: sutun
    tools:
    - cut
    - paste
    konu: ogrenci-notlari
    hedef: donustur
    girdi: csv
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: tuzak-dosya
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
