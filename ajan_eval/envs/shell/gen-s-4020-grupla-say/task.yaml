id: gen-s-4020-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  envanter klasöründeki depo_a.tsv ve depo_b.tsv dosyalarındaki ürün satırlarını ürün adına göre eşleştir; her iki depoda da bulunan ürünlerin toplam adet sayısını hesapla ve bu toplamı toplam.txt dosyasına sadece sayı olarak yaz.

setup: |
  mkdir -p envanter
  cat > envanter/depo_a.tsv <<'TSV'
  urun	kategori	adet
  kalem	kirtasiye	12
  defter	kirtasiye	5
  klavye	elektronik	3
  mouse	elektronik	7
  masa	mobilya	2
  TSV
  cat > envanter/depo_b.tsv <<'TSV'
  urun	kategori	adet
  kalem	kirtasiye	4
  defter	kirtasiye	1
  monitor	elektronik	2
  sandalye	mobilya	6
  TSV

goal_tr: >
  envanter/depo_a.tsv ve envanter/depo_b.tsv dosyalarindaki urun satirlarini
  urun adina gore eslestirip her iki depoda da bulunan urunlerin toplam adet
  sayisini toplam.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  grep -v '^urun' envanter/depo_a.tsv | sort > /tmp/a.txt
  grep -v '^urun' envanter/depo_b.tsv | sort > /tmp/b.txt
  join -t "$(printf '\t')" /tmp/a.txt /tmp/b.txt | xargs -d '\n' printf '%s\n' | awk -F'\t' '{s+=$3+$5} END{print s}' > toplam.txt

outputs:
  - {path: toplam.txt, kind: file}

checks:
  - {op: file_content_eq, path: toplam.txt, value: '22'}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4020
    bundle: cok-dosya-ara
    tools:
    - xargs
    - grep
    konu: envanter
    hedef: grupla-say
    girdi: tsv
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: veriye-bak
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
