id: gen-s-4019-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) envanter.txt dosyasını oku.
  2) Her satırdaki noktalı virgülleri boşluğa çevir.
  3) Tüm harfleri büyük harfe dönüştür.
  4) Elde edilen satırları satir-listesi.txt dosyasına yaz.

setup: |
  cat > envanter.txt <<'EOF'
  sunucu-01;DELL;16GB;aktif
  sunucu-02;HP;32GB;bakimda
  anahtar-01;CISCO;4GB;aktif
  yazici-01;CANON;1GB;arizali
  terminal-05;LENOVO;8GB;aktif
  EOF

goal_tr: >
  envanter.txt dosyasindaki her satirdaki noktali virgulleri bosluga
  cevirip, tum harfleri buyuk harfe donusturerek satir-listesi.txt dosyasina
  yaz

reference_solution: |
  sed 's/;/\t/g' envanter.txt | tr 'a-z' 'A-Z' | tr '\t' ' ' > satir-listesi.txt

outputs:
  - {path: satir-listesi.txt, kind: lines, run: cat satir-listesi.txt}

checks:
  - {op: file_lines_eq, path: satir-listesi.txt, value: [SUNUCU-01 DELL 16GB AKTIF, SUNUCU-02 HP 32GB BAKIMDA, ANAHTAR-01 CISCO 4GB AKTIF, YAZICI-01 CANON 1GB ARIZALI, TERMINAL-05 LENOVO 8GB AKTIF]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4019
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: envanter
    hedef: donustur
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
