id: gen-s-7027-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  kitaplik altındaki CSV dosyasını bul. Bu dosyada ödünç sütunu 5'ten büyük olan satırların başlık ve yazar alanlarını iki nokta ile birleştirip sik-sik.txt dosyasına yaz. Kalan satırların id ve yıl alanlarını virgül ile birleştirip seyrek.txt dosyasına yaz. sik-sik.txt dosyasındaki satır sayısını adet.txt dosyasına yalnızca sayı olarak yaz.

setup: |
  mkdir -p kitaplik
  cat > kitaplik/kitaplar.csv <<'CSV'
  id,baslik,yazar,yil,odunc
  1,Sessiz Ev,Orhan Pamuk,1983,3
  2,Tutunamayanlar,Ouz Atay,1971,7
  3,Kurk Mantolu Madonna,Sabahattin Ali,1943,12
  4,Ince Memed,Yasar Kemal,1955,5
  5,Huzur,Ahmet Hamdi Tanpinar,1949,2
  6,Aylak Adam,Yusuf Atilgan,1959,9
  7,Bereketli Topraklar,Umut,1954,4
  CSV

goal_tr: >
  kitaplik altindaki CSV dosyasini bul; odunc sutunu 5'ten buyuk olan
  satirlarin baslik ve yazar alanlarini iki nokta ile birlestirip
  sik-sik.txt dosyasina, kalan satirlarin id ve yil alanlarini virgul ile
  birlestirip seyrek.txt dosyasina yaz; sik-sik.txt satir sayisini adet.txt
  dosyasina sadece sayi olarak yaz

reference_solution: |
  kaynak=$(find kitaplik -name '*.csv' | head -n 1)
  awk -F, 'NR>1 && $5>5 {print $2 ": " $3}' "$kaynak" > sik-sik.txt
  awk -F, 'NR>1 && $5<=5 {print $1 "," $4}' "$kaynak" > seyrek.txt
  grep -c . sik-sik.txt > adet.txt
  wc -l < adet.txt

outputs:
  - {path: sik-sik.txt, kind: file}
  - {path: seyrek.txt, kind: file}
  - {path: adet.txt, kind: file}

checks:
  - {op: file_content_eq, path: adet.txt, value: '3'}
  - {op: file_lines_eq, path: seyrek.txt, value: ['1,1983', '4,1955', '5,1949', '7,1954']}
  - {op: file_lines_eq, path: sik-sik.txt, value: ['Tutunamayanlar: Ouz Atay', 'Kurk Mantolu Madonna: Sabahattin Ali', 'Aylak Adam: Yusuf Atilgan']}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7027
    bundle: say
    tools:
    - grep
    - wc
    konu: kutuphane-kayitlari
    hedef: ozetle
    girdi: csv
    kaynak: tek-dosya
    cikti: birden-cok-dosya
    kesif: dosyayi-bul
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
