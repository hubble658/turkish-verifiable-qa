id: gen-s-4016-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) raf/uyeler.txt ve arsiv/oduncler.txt dosyalarını üye numarasına göre birleştir.

  2) Birleştirme sonucunda durumu aktif olan üyeleri, her satırda üye numarası, ad soyad ve ödünç sayısı olacak şekilde aktif_uyeler.txt dosyasına yaz.

  3) Durumu pasif olan üyeleri, her satırda üye numarası, ad soyad ve ödünç sayısı olacak şekilde pasif_uyeler.txt dosyasına yaz.

  4) Birleştirme sırasında eşleşen kayıtları bulunan.txt dosyasına yaz.

  5) Aktif ve pasif üye sayılarını sayim.txt dosyasına yaz.

setup: |
  mkdir -p raf arsiv
  cat > raf/uyeler.txt <<'TXT'
  1001 Ali Kaya         aktif
  1002 Veli Demir       pasif
  1003 Ayse Yilmaz      aktif
  1004 Can Ozturk       pasif
  1005 Zeynep Arslan    aktif
  TXT
  cat > arsiv/oduncler.txt <<'TXT'
  1001 1003 12
  1002 1001 5
  1003 1005 8
  1004 1002 3
  1005 1004 7
  TXT

goal_tr: >
  raf/uyeler.txt ve arsiv/oduncler.txt dosyalarini uye numarasina gore
  birlestirerek, durumu aktif olan uyeleri her satirda uye numarasi, ad
  soyad ve odunc sayisi olacak sekilde aktif_uyeler.txt dosyasina, pasif
  olanlari ise pasif_uyeler.txt dosyasina yaz

reference_solution: |
  find raf arsiv -name '*.txt' | sort > bulunan.txt
  join -1 1 -2 1 <(sort raf/uyeler.txt) <(sort arsiv/oduncler.txt) | awk '$5=="aktif"{print $1, $2, $3, $6}' > aktif_uyeler.txt
  join -1 1 -2 1 <(sort raf/uyeler.txt) <(sort arsiv/oduncler.txt) | awk '$5=="pasif"{print $1, $2, $3, $6}' > pasif_uyeler.txt
  wc -l aktif_uyeler.txt pasif_uyeler.txt > sayim.txt

outputs:
  - {path: aktif_uyeler.txt, kind: file}
  - {path: pasif_uyeler.txt, kind: file}
  - {path: bulunan.txt, kind: lines}
  - {path: sayim.txt, kind: file}

checks:
  - {op: is_file, path: aktif_uyeler.txt}
  - {op: file_lines_eq, path: bulunan.txt, value: [arsiv/oduncler.txt, raf/uyeler.txt]}
  - {op: is_file, path: pasif_uyeler.txt}
  - {op: file_lines_eq, path: sayim.txt, value: [0 aktif_uyeler.txt, 0 pasif_uyeler.txt, 0 total]}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4016
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: kutuphane-kayitlari
    hedef: denetle
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: birden-cok-dosya
    kesif: dosyayi-bul
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
