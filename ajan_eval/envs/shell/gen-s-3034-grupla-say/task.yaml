id: gen-s-3034-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  notlar klasöründeki .txt dosyalarındaki her öğrenci adının kaç not satırında geçtiğini bul ve öğrenci adına göre alfabetik sırayla "ad sayı" biçiminde her satırda bir öğrenci olacak şekilde sayim.txt dosyasına yaz. yedek klasörünü ve diğer klasörleri bu sayıma dahil etme.

setup: |
  mkdir -p notlar yedek
  printf 'Ali 90\r\nAyse 85\r\nAli 70\r\n' > notlar/a.txt
  printf 'Ayse 60\r\nMehmet 75\r\nAli 100\r\n' > notlar/b.txt
  printf 'Mehmet 50\r\nZeynep 95\r\n' > notlar/c.txt
  printf 'Ali 10\r\nAyse 20\r\n' > yedek/eski.txt

goal_tr: >
  notlar klasorundeki .txt dosyalarinda her ogrenci adinin kac not satirinda
  gectigini ogrenci adina gore alfabetik olarak "ad sayi" biciminde
  satir-listesi olarak sayim.txt dosyasina yaz; yedek klasorunu ve diger
  klasorleri dahil etme.

reference_solution: |
  find notlar -type f -name '*.txt' | sort > /tmp/dosyalar.txt
  tr -d '\r' < /tmp/dosyalar.txt | xargs cat > /tmp/hepsi.txt
  cut -d' ' -f1 /tmp/hepsi.txt | sort | uniq -c | sed 's/^ *//' > /tmp/sayim.txt
  awk '{print $2, $1}' /tmp/sayim.txt | sort > sayim.txt
  grep -c . sayim.txt | wc -l > /tmp/satir.txt

outputs:
  - {path: sayim.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: sayim.txt, value: [Ali 3, Ayse 2, Mehmet 2, Zeynep 1]}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3034
    bundle: say
    tools:
    - grep
    - wc
    konu: ogrenci-notlari
    hedef: grupla-say
    girdi: log-satiri
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: crlf
    bukulme: tuzak-dosya
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
