id: gen-s-3217-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  veri dizinindeki .log uzantılı dosyayı bulup içindeki HATA seviyeli satırların saat ve mesaj alanlarını "saat|mesaj" biçiminde hatalar.txt dosyasına yaz.

setup: |
  mkdir -p veri
  printf '10:00:01\tBILGI\tsistem basladi\n10:00:05\tHATA\tdisk dolu\n10:00:09\tUYARI\tbellek az\n10:00:12\tHATA\tbaglanti koptu\n10:00:20\tBILGI\tkullanici girdi\n' > veri/sunucu.log
  printf '10:00:01\tBILGI\tbu tuzak dosyadir\n10:00:05\tHATA\tyanlis kayit\n' > veri/sunucu.log.yedek
  printf 'sahte satir\n' > veri/notlar.tsv

goal_tr: >
  veri dizinindeki .log uzantili dosyayi bulup icindeki HATA seviyeli
  satirlarin saat ve mesaj alanlarini "saat|mesaj" biciminde hatalar.txt
  dosyasina yaz

reference_solution: |
  find veri -maxdepth 1 -type f -name '*.log' > /tmp/loglist.txt
  logfile=$(head -n 1 /tmp/loglist.txt)
  awk -F'\t' '$2=="HATA" {print $1"|"$3}' "$logfile" > hatalar.txt
  printf '%s\n' "$(wc -l < hatalar.txt) satir" > /tmp/sayim.txt
  seq 1 1 > /dev/null

outputs:
  - {path: hatalar.txt, kind: lines, run: cat hatalar.txt}

checks:
  - {op: file_lines_eq, path: hatalar.txt, value: ['10:00:05|disk dolu', '10:00:12|baglanti koptu']}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3217
    bundle: uret
    tools:
    - printf
    - seq
    konu: sunucu-loglari
    hedef: yeniden-duzenle
    girdi: tsv
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: yok
    bukulme: tuzak-dosya
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
