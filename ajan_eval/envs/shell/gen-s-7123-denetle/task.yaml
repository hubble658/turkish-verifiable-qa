id: gen-s-7123-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  kayitlar.txt dosyasındaki her satırda birden fazla boşlukları tek boşluğa indir ve alanları kayit_no, kitap, yazar, yil, durum başlıklarıyla kayitlar.csv dosyasına CSV olarak yaz. Bu CSV'ye yalnızca durum alanı ödünç olan satırları dahil et. Ayrıca kayitlar.csv dosyasındaki satır sayısını satir_sayisi.txt dosyasına yaz; bu dosyada sadece sayı olsun ve her satırda bir tane bulunsun.

setup: |
  cat > kayitlar.txt <<'KAY'
  1001 Nutuk Mustafa Kemal Ataturk 1927 odunc
  1002 Tutunamayanlar Oguz Atay 1971 rafta
  1003  Kiralik Konak  Sait Faik Abasiyanik  1944  odunc
  1004 Bozkurtlar Cengiz Aytmatov 1977 kayip
  1005  Ince Memed  Yasar Kemal  1955  rafta
  1006 Huzur  Ahmet Hamdi Tanpinar 1949 odunc
  1007   Yaban   Yakup Kadri Karaosmanoglu   1932   hasarli
  1008 Calikusu Resat Nuri Guntekin 1922 odunc
  1009  Mai ve Siyah  Halit Ziya Usakligil  1897  rafta
  1010 Karartma Geceleri  Rifat Ilgaz 1974 odunc
  KAY

goal_tr: >
  kayitlar.txt dosyasindaki her satirdan fazla bosluklari tek bosluga
  indirip alanlari kayit_no,kitap,yazar,yil,durum basliklariyla kayitlar.csv
  dosyasina CSV olarak yaz; yalnizca durum alani odunc olan satirlari dahil
  et

reference_solution: |
  sed 's/  */ /g; s/^ //; s/ $//' kayitlar.txt > temiz.txt
  grep ' odunc$' temiz.txt > odunc.txt
  awk '{printf "%s,%s,%s,%s,%s\n", $1, $2, $3, $4, $5}' odunc.txt > govde.csv
  printf 'kayit_no,kitap,yazar,yil,durum\n' > kayitlar.csv
  cat govde.csv >> kayitlar.csv
  wc -l < kayitlar.csv > satir_sayisi.txt

outputs:
  - {path: kayitlar.csv, kind: file}
  - {path: satir_sayisi.txt, kind: file}

checks:
  - {op: file_lines_eq, path: kayitlar.csv, value: ['kayit_no,kitap,yazar,yil,durum', '1001,Nutuk,Mustafa,Kemal,Ataturk', '1003,Kiralik,Konak,Sait,Faik', '1006,Huzur,Ahmet,Hamdi,Tanpinar', '1008,Calikusu,Resat,Nuri,Guntekin', '1010,Karartma,Geceleri,Rifat,Ilgaz']}
  - {op: file_content_eq, path: satir_sayisi.txt, value: '6'}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7123
    bundle: say
