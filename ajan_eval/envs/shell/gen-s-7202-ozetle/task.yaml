id: gen-s-7202-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) vardiyalar.csv dosyasını oku.
  2) Her personel için gündüz vardiyasına kaç kez çıktığını say.
  3) Her personel için gece vardiyasına kaç kez çıktığını say.
  4) Sonuçları personel,gece,gunduz sütunlarıyla ozet.csv dosyasına yaz.
  5) ozet.csv dosyasındaki satırları personel adına göre alfabetik olarak sırala.

setup: |
  cat > vardiyalar.csv <<'CSV'
  personel,gun,vardiya
  Ayse,Pazartesi,gunduz
  Ayse,Sali,gunduz
  Ayse,Carsamba,gece
  Mehmet,Pazartesi,gece
  Mehmet,Sali,gece
  Mehmet,Carsamba,gunduz
  Zeynep,Pazartesi,gunduz
  Zeynep,Sali,gece
  Zeynep,Carsamba,gece
  Ali,Pazartesi,gece
  Ali,Sali,gunduz
  Ali,Carsamba,gunduz
  CSV

goal_tr: >
  vardiyalar.csv dosyasindaki her personel icin kac kez gunduz ve kac kez
  gece vardiyasina ciktigini sayip, personel,gece,gunduz sutunlariyla
  personel adina gore alfabetik sirali olarak ozet.csv dosyasina yaz

reference_solution: |
  tail -n +2 vardiyalar.csv | cut -d, -f1,3 | sort | uniq -c | awk '{print $2","$3","$1}' | awk -F, '{g[$1]+=($2=="gece"?$3:0); d[$1]+=($2=="gunduz"?$3:0)} END{print "personel,gece,gunduz"; for(p in g) print p","g[p]","d[p]}' | (read h; echo "$h"; sort) > ozet.csv

outputs:
  - {path: ozet.csv, kind: file}

checks:
  - {op: file_lines_eq, path: ozet.csv, value: ['personel,gece,gunduz', 'Ali,0,0', 'Ayse,0,0', 'Mehmet,0,0', 'Zeynep,0,0']}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7202
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: personel-vardiyalari
    hedef: ozetle
    girdi: csv
    kaynak: tek-dosya
    cikti: csv
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: olcek
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
