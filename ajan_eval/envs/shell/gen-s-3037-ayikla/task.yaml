    - grep
    konu: restoran-siparisleri
    hedef: ayikla
    girdi: log-satiri
    kaynak: iki-dosya-capraz
    cikti: birden-cok-dosya
    kesif: dosyayi-bul
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 2
