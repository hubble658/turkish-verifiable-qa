id: gen-s-3045-grupla-say
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Vardiya planlamasıyla uğraşan bir ekibiz ve elimizdeki iki ayrı dosyada personelin rolleri ile kimin hangi vardiyada olduğu dağınık halde duruyor. Her sabah toplantıda "bu vardiyada kaç kişi var, kaçı hemşire" diye sorup duruyoruz, ama bunu elle saymak hem vakit alıyor hem de karışıklığa yol açıyor. Bu yüzden vardiya/personel.ini ve vardiya/gorev.ini dosyalarını kişi bölümlerine göre birleştirip, her vardiya için o vardiyada kaç kişinin bulunduğunu ve bu kişiler içinde kaçının rolünün hemşire olduğunu vardiya sırasına göre gösteren bir özet çıkarmak istiyoruz. Sonucu vardiya/ozet.csv dosyasına, ilk satırı "vardiya,toplam,hemsire" olacak şekilde yaz.

setup: |
  mkdir -p vardiya
  cat > vardiya/personel.ini <<'INI'
  [ayse]
  rol=hemsire
  [mehmet]
  rol=doktor
  [zeynep]
  rol=hemsire
  [ali]
  rol=guvenlik
  [fatma]
  rol=doktor
  INI
  cat > vardiya/gorev.ini <<'INI'
  [ayse]
  vardiya=gunduz
  [mehmet]
  vardiya=gece
  [zeynep]
  vardiya=gece
  [ali]
  vardiya=gunduz
  [fatma]
  vardiya=gunduz
  INI

goal_tr: >
  vardiya/personel.ini ve vardiya/gorev.ini dosyalarini kisi bolumlerine
  gore birlestirip her vardiya icin kac kisinin o vardiyada oldugunu ve bu
  kisiler icinde kacinin rolu hemsire oldugunu vardiya sirasina gore
  vardiya/ozet.csv dosyasina "vardiya,toplam,hemsire" baslik satiriyla yaz

reference_solution: |
  grep -H '^vardiya=' vardiya/gorev.ini | sed 's/:vardiya=/ /' > /tmp/g.txt
  grep -H '^rol=' vardiya/personel.ini | sed 's/:rol=/ /' > /tmp/r.txt
  join -1 1 -2 1 <(sort -k1,1 /tmp/g.txt) <(sort -k1,1 /tmp/r.txt) | awk '{t[$2]++; if($3=="hemsire") h[$2]++} END{print "vardiya,toplam,hemsire"; for(v in t) print v","t[v]","h[v]+0}' | sort > vardiya/ozet.csv
  wc -l < vardiya/ozet.csv > /dev/null

outputs:
  - {path: vardiya/ozet.csv, kind: file}

checks:
  - {op: file_content_eq, path: vardiya/ozet.csv, value: 'vardiya,toplam,hemsire'}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3045
    bundle: say
    tools:
    - grep
    - wc
    konu: personel-vardiyalari
    hedef: grupla-say
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: csv
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
