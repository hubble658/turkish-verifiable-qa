id: gen-s-3190-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16
prompt: 'veri/kargolar.ini içindeki kayıtları veri/gecerli.txt''teki kodlarla karşılaştır; yalnızca geçerli kodların adet
  değerlerini şehir bazında toplayıp sonuc.json''a geçerli bir JSON nesnesi olarak yaz.


  JSON nesnesinde anahtar şehir adı, değer toplam adet olsun (ör. {"Ankara": 3}).

  '
setup: 'mkdir -p veri

  cat > veri/kargolar.ini <<''INI''

  [K001]

  sehir=Ankara

  durum=yolda

  adet=3

  [K002]

  sehir=Izmir

  durum=teslim

  adet=1

  [K003]

  sehir=Ankara

  durum=yolda

  adet=2

  [K004]

  sehir=Bursa

  durum=teslim

  adet=5

  [K005]

  sehir=Izmir

  durum=yolda

  adet=1

  INI

  cat > veri/gecerli.txt <<''TXT''

  K001

  K002

  K004

  TXT

  '
goal_tr: 'veri/kargolar.ini icindeki her kayit bolumunu veri/gecerli.txt icinde gecen kargo kodlariyla karsilastirip yalnizca
  gecerli kodlarin adet degerlerini sehir bazinda toplayarak sonuc.json dosyasina gecerli bir JSON nesnesi olarak yaz

  '
reference_solution: "python3 - <<'PY'\nimport configparser, json\nc = configparser.ConfigParser()\nc.read(\"veri/kargolar.ini\"\
  )\ng = open(\"veri/gecerli.txt\").read().split()\nt = {}\nfor k in g:\n    t[c[k][\"sehir\"]] = t.get(c[k][\"sehir\"], 0)\
  \ + int(c[k][\"adet\"])\njson.dump(t, open(\"sonuc.json\", \"w\"))\nPY\n"
outputs: []
checks:
- op: json_eq
  path: sonuc.json
  value:
    Ankara: 3
    Izmir: 1
    Bursa: 5
