id: gen-s-7286-karsilastir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) veri/istanbul.txt ve veri/ankara.txt dosyalarını oku.
  2) İki dosyada da aynı tarih satırında aynı sıcaklık değerinin bulunduğu günlerin sayısını bul.
  3) Bulduğun sayıyı sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  mkdir -p veri
  cat > veri/istanbul.txt <<'TXT'
  2024-03-01 12
  2024-03-02 14
  2024-03-03 11
  2024-03-04 15
  2024-03-05 13
  TXT
  cat > veri/ankara.txt <<'TXT'
  2024-03-01 9
  2024-03-02 14
  2024-03-03 7
  2024-03-04 15
  2024-03-05 10
  TXT

goal_tr: >
  veri/istanbul.txt ve veri/ankara.txt dosyalarinda ayni tarih satirinda
  ayni sicaklik degerini tasiyan gun sayisini sonuc.txt dosyasina sadece
  sayi olarak yaz

reference_solution: |
  awk '{print $1" "$2}' veri/istanbul.txt | sort > /tmp/ist.srt
  awk '{print $1" "$2}' veri/ankara.txt | sort > /tmp/ank.srt
  comm -12 /tmp/ist.srt /tmp/ank.srt > /tmp/ortak.srt
  wc -l < /tmp/ortak.srt > sonuc.txt
  cat sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '2'}

metadata:
  domain: karsilastir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7286
    bundle: kume-farki
    tools:
    - comm
    - sort
    konu: hava-durumu-kayitlari
    hedef: karsilastir
    girdi: json
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
