id: gen-s-4158-birlestir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  olcumler/sensorler dizinindeki kayitlar.csv dosyasındaki her ölçümü, aynı dizindeki sensorler.csv dosyasındaki sid-konum eşleşmesiyle birleştir. Sonuçta her satırı "sid konum deger" biçiminde olan rapor.txt dosyasını oluştur. Bu dizindeki yedek_eski.csv ve notlar.txt dosyalarındaki veriler rapora girmesin.

setup: |
  mkdir -p olcumler/sensorler
  printf 'sid,konum\r\nS01,kuzey\r\nS02,guney\r\nS03,dogu\r\n' > olcumler/sensorler/sensorler.csv
  printf 'S01,12.5\r\nS02,7.0\r\nS03,19.2\r\nS01,13.1\r\nS02,6.4\r\nS01,12.9\r\n' > olcumler/sensorler/kayitlar.csv
  printf 'S99,99.9\r\nS01,0.0\r\n' > olcumler/sensorler/yedek_eski.csv
  printf 'bu dosya bir tuzaktir\r\n' > olcumler/sensorler/notlar.txt

goal_tr: >
  olcumler/sensorler dizinindeki kayitlar.csv dosyasindaki her olcumu,
  sensorler.csv dosyasindaki sid-konum eslesmesiyle birlestirip her satiri
  "sid konum deger" biciminde olan rapor.txt dosyasini olustur;
  yedek_eski.csv ve notlar.txt dosyalarindaki veriler rapora girmesin.

reference_solution: |
  sed -i 's/\r$//' olcumler/sensorler/sensorler.csv olcumler/sensorler/kayitlar.csv
  sort -t, -k1,1 olcumler/sensorler/kayitlar.csv > /tmp/kayitlar.sorted
  sort -t, -k1,1 olcumler/sensorler/sensorler.csv > /tmp/sensorler.sorted
  join -t, -1 1 -2 1 /tmp/kayitlar.sorted /tmp/sensorler.sorted | awk -F, '{print $1, $3, $2}' > rapor.txt

outputs:
  - {path: rapor.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: rapor.txt, value: [S01 kuzey 12.5, S01 kuzey 12.9, S01 kuzey 13.1, S02 guney 6.4, S02 guney 7.0, S03 dogu 19.2]}

metadata:
  domain: birlestir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4158
    bundle: birlestir
    tools:
    - join
    - sort
    konu: sensor-olcumleri
    hedef: birlestir
    girdi: json
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: crlf
    bukulme: tuzak-dosya
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
