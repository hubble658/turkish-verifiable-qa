id: gen-s-3162-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi/sunucu.ini dosyasındaki her bölümü, cikti dizininde bölüm adıyla aynı isimli bir alt dizine dönüştürmeni istiyorum. Bölümdeki her anahtar=değer satırı, o dizinde anahtarın adını taşıyan .ver uzantılı bir dosyaya yalnızca değeri yazılarak kaydedilsin; yani cikti/genel/ad.ver, cikti/genel/bolge.ver, cikti/disk/kullanilan.ver, cikti/disk/toplam.ver, cikti/ag/gelen.ver ve cikti/ag/giden.ver oluşmalı.

setup: |
  mkdir -p girdi
  tee girdi/sunucu.ini > /dev/null <<'INI'
  [genel]
  ad = sunucu1
  bolge = istanbul

  [disk]
  kullanilan = 82
  toplam = 100

  [ag]
  gelen = 1450
  giden = 980
  INI

goal_tr: >
  girdi/sunucu.ini dosyasindaki her bolumu cikti dizininde bolum adiyla ayni
  isimli bir alt dizine donustur ve her bolumun anahtar=deger satirlarini o
  dizin icindeki anahtar.ver dosyasina sadece degeri yazarak kaydet

reference_solution: |
  mkdir -p cikti
  grep '^\[' girdi/sunucu.ini | cut -d'[' -f2 | cut -d']' -f1 | tee bolumler.txt | while read b; do
    mkdir -p "cikti/$b"
    awk -v b="$b" '
      /^\[/ { inb = ($0 == "[" b "]"); next }
      inb && /=/ {
        split($0, kv, "=")
        k = kv[1]; v = kv[2]
        gsub(/^[ \t]+|[ \t]+$/, "", k)
        gsub(/^[ \t]+|[ \t]+$/, "", v)
        print v > ("cikti/" b "/" k ".ver")
      }
    ' girdi/sunucu.ini
  done

outputs:
  - {path: cikti, kind: dir}
  - {path: cikti/genel/ad.ver, kind: file}
  - {path: cikti/genel/bolge.ver, kind: file}
  - {path: cikti/disk/kullanilan.ver, kind: file}
  - {path: cikti/disk/toplam.ver, kind: file}
  - {path: cikti/ag/gelen.ver, kind: file}
  - {path: cikti/ag/giden.ver, kind: file}

checks:
  - {op: dir_entries_eq, path: cikti, value: [ag, disk, genel]}
  - {op: file_content_eq, path: cikti/ag/gelen.ver, value: '1450'}
  - {op: file_content_eq, path: cikti/ag/giden.ver, value: '980'}
  - {op: file_content_eq, path: cikti/disk/kullanilan.ver, value: '82'}
  - {op: file_content_eq, path: cikti/disk/toplam.ver, value: '100'}
  - {op: file_content_eq, path: cikti/genel/ad.ver, value: sunucu1}
  - {op: file_content_eq, path: cikti/genel/bolge.ver, value: istanbul}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3162
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: sunucu-loglari
    hedef: donustur
    girdi: ini
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: dolayli-hedef
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
