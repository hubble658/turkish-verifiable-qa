id: gen-s-3073-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Dünkü yoğun servis sonrası kasa raporlarını kapatmaya çalışıyoruz; akşamki vardiyada gelen siparişlerin dökümü bir kenarda duruyor ve yarın sabah müdüre yemek bazında özet çıkarmamız gerekiyor. Elinde siparişler.txt dosyası var, içinde sabit genişlikli kayıtlar halinde sipariş satırları tutuluyor. Bu satırlardan yemek adını, adedi ve birim fiyatı ayrıştır; aynı yemek adı ve birim fiyat birden fazla kez geçse bile her yemek için tek bir kayıt olacak şekilde adet ve tutar toplamlarını hesapla. Sonucu, her yemek için "adet" ve "tutar" alanlarını içeren geçerli bir JSON nesnesi olarak ozet.json dosyasına yaz.

setup: |
  cat > siparisler.txt <<'DATA'
  1001  Adana    2  180
  1002  Urfa     1  150
  1003  Adana    3  180
  1004  Iskender 1  220
  1005  Urfa     2  150
  1006  Adana    2  180
  DATA

goal_tr: >
  siparisler.txt dosyasindaki sabit genislikli kayitlardan yemek adini,
  adedi ve birim fiyati ayristirip, ayni yemek adi ve birim fiyati
  tekrarlanmayacak sekilde yemek bazinda adet ve tutar toplamlarini
  hesaplayarak, her yemek icin "adet" ve "tutar" alanlarini iceren gecerli
  bir JSON nesnesini ozet.json dosyasina yaz

reference_solution: |
  cut -c7-15 siparisler.txt | sed 's/ *$//' > yemek.tmp
  cut -c16-17 siparisler.txt > adet.tmp
  cut -c18-21 siparisler.txt | sed 's/ *$//' > fiyat.tmp
  paste -d' ' yemek.tmp adet.tmp fiyat.tmp | sort -k1,1 -k3,3n | awk '{a[$1]=$2; f[$1]=$3} END {printf "{\n"; n=0; for(y in a) sirali[++n]=y; for(i=1;i<=n;i++){for(j=i+1;j<=n;j++){if(sirali[i]>sirali[j]){t=sirali[i];sirali[i]=sirali[j];sirali[j]=t}}} for(i=1;i<=n;i++){y=sirali[i]; printf "  \"%s\": {\"adet\": %d, \"tutar\": %d}%s\n", y, a[y], a[y]*f[y], (i<n?",":"")} printf "}\n"}' > ozet.json

outputs:
  - {path: ozet.json, kind: json}

checks:
  - {op: json_eq, path: ozet.json, value: {Adana: {adet: 3, tutar: 540}, Iskender: {adet: 1, tutar: 220}, Urfa: {adet: 2, tutar: 300}}}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3073
    bundle: sutun
    tools:
    - cut
    - paste
    konu: restoran-siparisleri
    hedef: donustur
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: json
    kesif: yok
    uslup: baglam-gomulu
    direnc: tekrar-eden-kayit
    bukulme: yok
    adim: 4
