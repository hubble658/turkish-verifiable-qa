id: gen-s-7262-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  siparisler klasöründeki tüm .log dosyalarındaki geçerli satırları birleştir; ürün adına göre gruplayıp her ürünün toplam adetini "urun toplam" biçiminde, ürün adına göre artan sırada urun-toplam.txt dosyasına yaz, satır sayısını da satir-sayisi.txt dosyasına yaz.

setup: |
  mkdir -p siparisler
  cat > siparisler/ocak.log <<'LOG'
  masa:1 urun:pizza adet:2
  masa:2 urun:pizza adet:1
  masa:1 urun:salata adet:3
  masa:3 urun:makarna adet:2
  LOG
  cat > siparisler/subat.log <<'LOG'
  masa:2 urun:makarna adet:4
  masa:3 urun:pizza adet:1
  masa:1 urun:pizza adet:2
  LOG
  cat > siparisler/mart.log <<'LOG'
  masa:2 urun:salata adet:1
  BOS
  masa:1 urun:makarna adet:2
  masa:2 urun:pizza adet:1
  LOG

goal_tr: >
  siparisler klasorundeki tum .log dosyalarindaki gecerli satirlari
  birlestirip urun adina gore gruplayarak her urun icin toplam adet sayisini
  "urun toplam" biciminde urun adina gore artan sirada urun-toplam.txt
  dosyasina yaz

reference_solution: |
  find siparisler -type f -name '*.log' | sort | xargs cat | grep '^masa:' > gecerli.txt
  awk '{n=0; for(i=1;i<=NF;i++){split($i,a,":"); if(a[1]=="urun") u=a[2]; if(a[1]=="adet") n=a[2]} s[u]+=n} END{for(k in s) print k, s[k]}' gecerli.txt | sort > urun-toplam.txt
  wc -l < gecerli.txt > satir-sayisi.txt

outputs:
  - {path: urun-toplam.txt, kind: lines}
  - {path: satir-sayisi.txt, kind: file}

checks:
  - {op: file_content_eq, path: satir-sayisi.txt, value: '10'}
  - {op: file_lines_eq, path: urun-toplam.txt, value: [makarna 8, pizza 7, salata 4]}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7262
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: restoran-siparisleri
    hedef: grupla-say
    girdi: log-satiri
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: terse
    direnc: yok
    bukulme: kirli-veri
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
