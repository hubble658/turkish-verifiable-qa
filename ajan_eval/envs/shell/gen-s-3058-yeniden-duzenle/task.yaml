id: gen-s-3058-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  gonderiler klasöründeki her .ini dosyasından durum değerini oku ve durumu "yolda" olan dosyalardaki agirlik değerlerinin toplamını bul. Sonucu toplam.txt dosyasına yaz; bu dosyada sadece sayı olsun, başka bir şey bulunmasın.

setup: |
  mkdir -p gonderiler
  printf '%s\n' '[kargo]' 'takip_no=TR1001' 'durum=yolda' 'agirlik=12' > gonderiler/a.ini
  printf '%s\n' '[kargo]' 'takip_no=TR1002' 'durum=teslim' 'agirlik=7' > gonderiler/b.ini
  printf '%s\n' '[kargo]' 'takip_no=TR1003' 'durum=yolda' 'agirlik=25' > gonderiler/c.ini
  printf '%s\n' '[kargo]' 'takip_no=TR1004' 'durum=iptal' 'agirlik=3' > gonderiler/d.ini

goal_tr: >
  gonderiler klasorundeki her .ini dosyasindan durum degerini okuyup durumu
  "yolda" olan dosyalardaki agirlik degerlerinin toplamini toplam.txt
  dosyasina sadece sayi olarak yaz

reference_solution: |
  n=$(ls gonderiler/*.ini | wc -l)
  for i in $(seq 1 "$n"); do
    f=$(ls gonderiler/*.ini | sed -n "${i}p")
    d=$(sed -n 's/^durum=//p' "$f")
    if [ "$d" = "yolda" ]; then
      sed -n 's/^agirlik=//p' "$f"
    fi
  done | awk '{s+=$1} END {printf "%d\n", s}' > toplam.txt

outputs:
  - {path: toplam.txt, kind: file}

checks:
  - {op: file_content_eq, path: toplam.txt, value: '37'}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3058
    bundle: uret
    tools:
    - printf
    - seq
    konu: kargo-takibi
    hedef: yeniden-duzenle
    girdi: ini
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: veriye-bak
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
