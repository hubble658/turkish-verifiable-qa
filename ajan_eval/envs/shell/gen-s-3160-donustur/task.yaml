id: gen-s-3160-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  hava.tar.gz arşivindeki tüm tsv dosyalarındaki ölçüm değerlerinin toplamını toplam.txt dosyasına sadece sayı olarak yaz.

setup: |
  mkdir -p arsiv
  cat > arsiv/istanbul.tsv <<'TSV'
  tarih	sehir	olcum
  2024-01-01	istanbul	7
  2024-01-02	istanbul	9
  2024-01-03	istanbul	11
  TSV
  cat > arsiv/ankara.tsv <<'TSV'
  tarih	sehir	olcum
  2024-01-01	ankara	3
  2024-01-02	ankara	5
  2024-01-03	ankara	8
  TSV
  tar -cf hava.tar arsiv
  gzip hava.tar

goal_tr: >
  hava.tar.gz arsivindeki tum tsv dosyalarindaki olcum degerlerinin
  toplamini toplam.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  mkdir -p acilan
  gzip -dc hava.tar.gz | tar -xf - -C acilan
  cat acilan/arsiv/*.tsv | awk -F'\t' 'NR>1 {t+=$3} END {print t}' > toplam.txt

outputs:
  - {path: toplam.txt, kind: file}

checks:
  - {op: file_content_eq, path: toplam.txt, value: '43'}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3160
    bundle: arsiv
    tools:
    - tar
    - gzip
    konu: hava-durumu-kayitlari
    hedef: donustur
    girdi: tsv
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
