id: gen-s-4098-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensor.json dosyasındaki her satırda bulunan ölçüm dizisindeki değerlerin, tüm satırlar üzerindeki toplamını hesapla ve bu toplamı sonuc.txt dosyasına yaz. sonuc.txt içinde toplam dışında hiçbir şey olmasın; yalnızca toplam sayı yer alsın.

  Şu şartlar sağlanmalı:
  - sensor.json dosyası okunmalı ve her satırdaki ölçüm dizisindeki tüm değerler hesaba katılmalı.
  - Tüm satırlardaki değerlerin genel toplamı doğru hesaplanmalı.
  - sonuc.txt dosyası oluşturulmalı ve içinde yalnızca toplam sayı bulunmalı; başka metin, etiket veya açıklama olmamalı.
  - Çalışma dizini /workspace olmalı.

setup: |
  cat > sensor.json <<'JSON'
  {"sensor":"sicaklik","birim":"C","olcumler":[12,15,9,18,22,7,14]}
  {"sensor":"nem","birim":"%","olcumler":[40,55,61,48,52,39,44]}
  {"sensor":"basinc","birim":"kPa","olcumler":[101,98,103,99,100,102,97]}
  {"sensor":"isik","birim":"lux","olcumler":[300,450,220,380,410,290,360]}
  JSON

goal_tr: >
  sensor.json dosyasindaki her satirda yer alan olcum dizisindeki degerlerin
  tum satirlar uzerindeki toplamini hesaplayip sonuc.txt dosyasina sadece bu
  toplam sayisini yaz.

reference_solution: |
  cut -d'[' -f2 sensor.json > dizi.txt
  tr -d ']}' < dizi.txt > sayilar.txt
  tr ',' '\n' < sayilar.txt > tek.txt
  paste -sd+ tek.txt > ifade.txt
  awk '{print "0+" $0}' ifade.txt > toplam.txt
  awk -F'+' '{s=0; for(i=1;i<=NF;i++) s+=$i; print s}' toplam.txt > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '3546'}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4098
    bundle: sutun
    tools:
    - cut
    - paste
    konu: sensor-olcumleri
    hedef: ozetle
    girdi: json
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: kabul-kriteri
    direnc: yok
    bukulme: olcek
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
