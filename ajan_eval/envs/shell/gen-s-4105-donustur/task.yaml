id: gen-s-4105-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) girdi/yorumlar.txt ve girdi/urunler.txt dosyalarını ürün kimliği üzerinden birleştir.

  2) Her yorum için yorum_id, urun_adi ve puan sütunlarından oluşan satırları, yorum_id sayısal sırasına göre dizerek girdi/ozet.csv dosyasına yaz.

  3) girdi/ozet.csv dosyasının ilk satırını başlık satırı yap.

setup: |
  mkdir -p girdi
  printf '%s\n' \
  '1|urun-101|5|harika urun' \
  '2|urun-102|3|idare eder' \
  '3|urun-101|4|begendim' \
  '4|urun-103|1|bozuk geldi' \
  '5|urun-102|5|cok iyi' \
  '6|urun-101|2|beklentimi karsilamadi' \
  '7|urun-104|4|fiyat performans' \
  '8|urun-103|3|ortalama' > girdi/yorumlar.txt
  seq 1 4 | while read i; do
    case "$i" in
      1) printf 'urun-101|Kalem\n' ;;
      2) printf 'urun-102|Defter\n' ;;
      3) printf 'urun-103|Silgi\n' ;;
      4) printf 'urun-104|Cetvel\n' ;;
    esac
  done > girdi/urunler.txt

goal_tr: >
  girdi/yorumlar.txt ve girdi/urunler.txt dosyalarini urun kimligi uzerinden
  birlestirip her yorum icin yorum_id,urun_adi,puan sutunlarindan olusan
  satirlari yorum_id sayisal sirasinda girdi/ozet.csv dosyasina yaz; ilk
  satir baslik olsun.

reference_solution: |
  seq 1 8 | while read i; do
    head -n "$i" girdi/yorumlar.txt | tail -n 1
  done | sort -t'|' -k2,2 | join -t'|' -1 2 -2 1 - <(sort -t'|' -k1,1 girdi/urunler.txt) | sort -t'|' -k1,1n | awk -F'|' 'BEGIN{printf "yorum_id,urun_adi,puan\n"}{printf "%s,%s,%s\n", $1, $3, $4}' > girdi/ozet.csv

outputs:
  - {path: girdi/ozet.csv, kind: file}

checks:
  - {op: file_lines_eq, path: girdi/ozet.csv, value: ['yorum_id,urun_adi,puan', 'urun-101,5,harika urun', 'urun-101,4,begendim', 'urun-101,2,beklentimi karsilamadi', 'urun-102,3,idare eder', 'urun-102,5,cok iyi', 'urun-103,1,bozuk geldi', 'urun-103,3,ortalama', 'urun-104,4,fiyat performans']}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4105
    bundle: uret
    tools:
    - printf
    - seq
    konu: urun-yorumlari
    hedef: donustur
    girdi: log-satiri
    kaynak: iki-dosya-capraz
    cikti: csv
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: olcek
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
