id: gen-s-3193-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  muhasebe/defter.txt ve muhasebe/fisler.txt dosyalarındaki kalem satırlarını ilk alan (hesap kodu) bazında karşılaştır. Yalnızca fisler.txt içinde olup defter.txt içinde olmayan satırları, fisler.txt'deki sırayı koruyarak fark.txt dosyasına yaz.

setup: |
  mkdir -p muhasebe
  cat > muhasebe/defter.txt <<'EOF'
  1001 kasa 500
  1002 banka 1200
  1003 alicilar 300
  1004 stok 800
  1005 demirbas 2500
  1006 borclar 400
  EOF
  cat > muhasebe/fisler.txt <<'EOF'
  1001 kasa 500
  1002 banka 1200
  1004 stok 800
  1007 avans 150
  1008 ortaklar 900
  1009 kasa 500
  EOF

goal_tr: >
  muhasebe/defter.txt ve muhasebe/fisler.txt dosyalarindaki kalem
  satirlarini ilk alan (hesap kodu) bazinda karsilastir; yalnizca fisler.txt
  icinde olup defter.txt icinde olmayan satirlari, fisler.txt'deki sirayla
  fark.txt dosyasina yaz.

reference_solution: |
  cut -d' ' -f1 muhasebe/defter.txt | sort > /tmp/defter_kod.txt
  cut -d' ' -f1 muhasebe/fisler.txt | sort > /tmp/fisler_kod.txt
  comm -13 /tmp/defter_kod.txt /tmp/fisler_kod.txt > /tmp/sadece_fis.txt
  grep -F -f /tmp/sadece_fis.txt muhasebe/fisler.txt > fark.txt
  diff fark.txt fark.txt > /dev/null

outputs:
  - {path: fark.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: fark.txt, value: [1007 avans 150, 1008 ortaklar 900, 1009 kasa 500]}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3193
    bundle: karsilastir
    tools:
    - diff
    - comm
    konu: muhasebe-kalemleri
    hedef: denetle
    girdi: duz-metin
    kaynak: iki-dosya-capraz
    cikti: satir-listesi
    kesif: veriye-bak
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
