id: gen-s-3164-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  siparisler.log dosyasındaki her satırı "MASA=<masa> URUN=<urun> ADET=<adet> FIYAT=<fiyat>" biçimine dönüştürüp siparisler.txt dosyasına satır listesi olarak yaz.

setup: |
  cat > siparisler.log <<'LOG'
  MASA=1|URUN=mercimek-corbasi|ADET=2|FIYAT=45
  MASA=2|URUN=izgara-tavuk|ADET=1|FIYAT=120
  MASA=1|URUN=ayran|ADET=3|FIYAT=15
  MASA=3|URUN=karniyarik|ADET=2|FIYAT=95
  MASA=2|URUN=baklava|ADET=1|FIYAT=60
  LOG

goal_tr: >
  siparisler.log dosyasindaki her satiri "MASA=<masa> URUN=<urun>
  ADET=<adet> FIYAT=<fiyat>" bicimine donusturup siparisler.txt dosyasina
  satir listesi olarak yaz

reference_solution: |
  tr '|' '\n' < siparisler.log | sed -n '1~4h;2~4H;3~4H;4~4{H;g;s/\n/ /gp}' > siparisler.txt

outputs:
  - {path: siparisler.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: siparisler.txt, value: [MASA=1 URUN=mercimek-corbasi ADET=2 FIYAT=45, MASA=2 URUN=izgara-tavuk ADET=1 FIYAT=120, MASA=1 URUN=ayran ADET=3 FIYAT=15, MASA=3 URUN=karniyarik ADET=2 FIYAT=95, MASA=2 URUN=baklava ADET=1 FIYAT=60]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3164
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: restoran-siparisleri
    hedef: donustur
    girdi: log-satiri
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
