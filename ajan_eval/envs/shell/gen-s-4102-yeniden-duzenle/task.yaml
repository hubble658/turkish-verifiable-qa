id: gen-s-4102-yeniden-duzenle
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  /workspace dizinindeki siparisler.txt ve iptaller.txt dosyalarındaki kayıtları kullanarak, her iki dosyada da geçmeyen sipariş numaralarının sayısını bul ve bu sayıyı tek bir sayı olarak sonuc.txt dosyasına yaz.

setup: |
  mkdir -p /workspace
  printf '000101202503150001Alice\n000202202503150002Bob\n000303202503160003Cara\n' > siparisler.txt
  printf '000202202503150002Bob\n000303202503160003Cara\n000404202503170004Dan\n' > iptaller.txt

goal_tr: >
  siparisler.txt ve iptaller.txt dosyalarindaki kayitlardan, her iki dosyada
  da gecmeyen siparis numaralarinin sayisini tek sayi olarak sonuc.txt'ye
  yaz.

reference_solution: |
  seq 1 3 | while read i; do sed -n "${i}p" siparisler.txt; done | cut -c1-6 | sort > /tmp/siparisler_ids.txt
  seq 1 3 | while read i; do sed -n "${i}p" iptaller.txt; done | cut -c1-6 | sort > /tmp/iptaller_ids.txt
  printf '%s\n' "$(comm -23 /tmp/siparisler_ids.txt /tmp/iptaller_ids.txt | wc -l)" > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '1'}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4102
    bundle: uret
    tools:
    - printf
    - seq
    konu: restoran-siparisleri
    hedef: yeniden-duzenle
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: tuzak-dosya
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
