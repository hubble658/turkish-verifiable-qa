id: gen-s-3151-ayikla
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiyalar.txt dosyasındaki gündüz vardiyasında çalışan personelin toplam saat sayısını hesapla ve sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  cat > vardiyalar.txt <<'DATA'
  Ali:gunduz:8
  Veli:gece:6
  Ayse:gunduz:7
  Fatma:gece:9
  DATA

goal_tr: >
  vardiyalar.txt dosyasindaki gunduz vardiyasinda calisan personelin toplam
  saat sayisini sonuc.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  cut -d: -f2,3 vardiyalar.txt | grep '^gunduz' | cut -d: -f2 | paste -sd+ | awk '{print $0}' | xargs -I{} sh -c 'echo {}' | awk -F+ '{s=0; for(i=1;i<=NF;i++) s+=$i; print s}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '15'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3151
    bundle: sutun
    tools:
    - cut
    - paste
    konu: personel-vardiyalari
    hedef: ayikla
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
