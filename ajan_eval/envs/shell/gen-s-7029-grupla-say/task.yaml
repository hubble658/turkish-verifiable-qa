id: gen-s-7029-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  veri/notlar.tsv dosyasındaki öğrenci-ders-sayı satırlarını kullanarak, .bak ile biten dosyaları yok sayarak cikti dizini altında her ders için ayrı bir dizin oluştur. Her ders dizininin içine, o dersteki her öğrenci için öğrenci adını taşıyan bir .txt dosyası koy; bu dosyada yalnızca o öğrencinin o dersteki not ortalaması tam sayı olarak, aşağı yuvarlanmış biçimde yazsın. Her ders dizininde ayrıca _ortalama adlı bir dosya olsun; bu dosyada o dersin genel ortalaması tam sayı olarak, aşağı yuvarlanmış biçimde yazsın. Beklenen dizinler ve dosyalar: cikti, cikti/Matematik, cikti/Matematik/Ali.txt, cikti/Matematik/Ayse.txt, cikti/Matematik/Can.txt, cikti/Matematik/_ortalama, cikti/Fizik, cikti/Fizik/Ali.txt, cikti/Fizik/Ayse.txt, cikti/Fizik/Can.txt, cikti/Fizik/_ortalama, cikti/Kimya, cikti/Kimya/Ali.txt, cikti/Kimya/Ayse.txt, cikti/Kimya/Can.txt, cikti/Kimya/_ortalama.

  Şu şartlar sağlanmalı:
  - veri/notlar.tsv.bak dosyasındaki satırlar hiçbir hesaplamaya dahil edilmemeli.
  - cikti altında yalnızca notlar.tsv içinde geçen dersler için dizin oluşturulmalı: Matematik, Fizik ve Kimya.
  - Her ders dizininde o dersteki her öğrenci için öğrenci adını taşıyan bir .txt dosyası bulunmalı (Ali.txt, Ayse.txt, Can.txt).
  - Her öğrenci dosyasında yalnızca tek bir tam sayı olmalı; bu sayı öğrencinin o dersteki not ortalaması aşağı yuvarlanmış halidir.
  - Her ders dizininde _ortalama adlı bir dosya bulunmalı ve içinde yalnızca o dersin genel ortalaması tam sayı olarak, aşağı yuvarlanmış biçimde yazmalı.
  - Dosya içeriklerinde sayı dışında ek metin, etiket veya başlık bulunmamalı.

setup: |
  mkdir -p veri
  cat > veri/notlar.tsv <<'TSV'
  Ali	Matematik	85
  Ayse	Matematik	90
  Ali	Fizik	70
  Ayse	Fizik	60
  Can	Matematik	75
  Can	Fizik	80
  Ali	Kimya	95
  Ayse	Kimya	55
  Can	Kimya	65
  TSV
  cat > veri/notlar.tsv.bak <<'TSV'
  Zeynep	Matematik	100
  Zeynep	Fizik	100
  TSV
  mkdir -p cikti

goal_tr: >
  veri/notlar.tsv dosyasindaki ogrenci-ders-sayi satirlarindan, .bak ile
  biten dosyalari yok sayarak, her ders icin cikti/<ders> adli bir dizin
  olustur ve o dizine ogrenci adini tasiyan, icinde sadece o ogrencinin o
  dersteki not ortalamasi (tam sayi, asagi yuvarlanmis) yazan bir dosya koy

reference_solution: |
  find veri -type f -name '*.tsv' ! -name '*.bak' > /tmp/kaynaklar.txt
  awk -F'\t' '{ top[$2]+=$3; n[$2]++ } END { for (d in top) print d, int(top[d]/n[d]) }' veri/notlar.tsv > /tmp/dersler.txt
  while read -r ders ort; do mkdir -p "cikti/$ders"; echo "$ort" > "cikti/$ders/_ortalama"; done < /tmp/dersler.txt
  awk -F'\t' '{ print $2, $1, $3 }' veri/notlar.tsv | sort -k1,1 -k2,2 > /tmp/ogrenci_ders.txt
  while read -r ders ogr not; do echo "$not" > "cikti/$ders/$ogr.txt"; done < /tmp/ogrenci_ders.txt

outputs:
  - {path: cikti, kind: dir}
  - {path: cikti/Matematik, kind: dir}
  - {path: cikti/Matematik/Ali.txt, kind: file}
  - {path: cikti/Matematik/Ayse.txt, kind: file}
  - {path: cikti/Matematik/Can.txt, kind: file}
  - {path: cikti/Matematik/_ortalama, kind: file}
  - {path: cikti/Fizik, kind: dir}
  - {path: cikti/Fizik/Ali.txt, kind: file}
  - {path: cikti/Fizik/Ayse.txt, kind: file}
  - {path: cikti/Fizik/Can.txt, kind: file}
  - {path: cikti/Fizik/_ortalama, kind: file}
  - {path: cikti/Kimya, kind: dir}
  - {path: cikti/Kimya/Ali.txt, kind: file}
  - {path: cikti/Kimya/Ayse.txt, kind: file}
  - {path: cikti/Kimya/Can.txt, kind: file}
  - {path: cikti/Kimya/_ortalama, kind: file}

checks:
  - {op: dir_entries_eq, path: cikti/Fizik, value: [Ali.txt, Ayse.txt, Can.txt, _ortalama]}
  - {op: dir_entries_eq, path: cikti/Kimya, value: [Ali.txt, Ayse.txt, Can.txt, _ortalama]}
  - {op: dir_entries_eq, path: cikti/Matematik, value: [Ali.txt, Ayse.txt, Can.txt, _ortalama]}
  - {op: dir_entries_eq, path: cikti, value: [Fizik, Kimya, Matematik]}
  - {op: file_content_eq, path: cikti/Fizik/Ali.txt, value: '70'}
  - {op: file_content_eq, path: cikti/Fizik/Ayse.txt, value: '60'}
  - {op: file_content_eq, path: cikti/Fizik/Can.txt, value: '80'}
  - {op: file_content_eq, path: cikti/Fizik/_ortalama, value: '70'}
  - {op: file_content_eq, path: cikti/Kimya/Ali.txt, value: '95'}
  - {op: file_content_eq, path: cikti/Kimya/Ayse.txt, value: '55'}
  - {op: file_content_eq, path: cikti/Kimya/Can.txt, value: '65'}
  - {op: file_content_eq, path: cikti/Kimya/_ortalama, value: '71'}
  - {op: file_content_eq, path: cikti/Matematik/Ali.txt, value: '85'}
  - {op: file_content_eq, path: cikti/Matematik/Ayse.txt, value: '90'}
  - {op: file_content_eq, path: cikti/Matematik/Can.txt, value: '75'}
  - {op: file_content_eq, path: cikti/Matematik/_ortalama, value: '83'}

