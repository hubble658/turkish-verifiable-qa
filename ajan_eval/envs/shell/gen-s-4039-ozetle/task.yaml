id: gen-s-4039-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  yorumlar.txt'teki her ürün için yorum sayısını ve puan toplamını ürün sırasına göre ozet.csv dosyasına urun,yorum_sayisi,puan_toplami başlığıyla yaz.

setup: |
  cat > yorumlar.txt <<'EOF'
  urun: kalem
  puan: 5
  urun: kalem
  puan: 3
  urun: defter
  puan: 4
  urun: kalem
  puan: 5
  urun: defter
  puan: 2
  urun: silgi
  puan: 1
  urun: defter
  puan: 4
  urun: silgi
  puan: 5
  EOF

goal_tr: >
  yorumlar.txt icindeki her urun icin kac yorum oldugunu ve puanlarin
  toplamini urun sirasina gore "urun,yorum_sayisi,puan_toplami" baslikli CSV
  olarak ozet.csv dosyasina yaz

reference_solution: |
  grep '^urun: ' yorumlar.txt | cut -d' ' -f2 | sort | uniq -c | awk '{print $2","$1}' > /tmp/sayim.txt
  grep '^puan: ' yorumlar.txt | paste - - <(grep '^urun: ' yorumlar.txt) | awk '{s[$2]+=$4} END {for (u in s) print u","s[u]}' | sort > /tmp/toplam.txt
  { echo "urun,yorum_sayisi,puan_toplami"; join -t, /tmp/sayim.txt /tmp/toplam.txt | awk -F, '{print $1","$2","$3}'; } > ozet.csv
  wc -l < ozet.csv > /dev/null

outputs:
  - {path: ozet.csv, kind: file}

checks:
  - {op: file_lines_eq, path: ozet.csv, value: ['urun,yorum_sayisi,puan_toplami', 'defter,3,0', 'silgi,2,0']}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4039
    bundle: say
    tools:
    - grep
    - wc
    konu: urun-yorumlari
    hedef: ozetle
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: csv
    kesif: yok
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
