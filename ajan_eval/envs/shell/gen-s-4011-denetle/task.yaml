id: gen-s-4011-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Bugün epey yoğun bir gündü, bir yandan ürün yorumlarını gözden geçiriyor bir yandan da hangi ürünlerin hâlâ geçerli olduğunu takip etmeye çalışıyorum. Elimde veri/yorumlar.txt içinde ürünlere gelen yorumlar var, bir de veri/gecerli.txt içinde hâlâ geçerli saydığımız ürünlerin listesi duruyor. Bu iki listeyi karşılaştırıp sadece hâlâ geçerli olan ürünlere ait yorumları görmek istiyorum, gerisi benim için fazlalık.

  Bunu bana sonuc.txt dosyasına yazar mısın? veri/yorumlar.txt içindeki her yorum satırının ilk alanını, veri/gecerli.txt içindeki satırların ilk alanlarıyla karşılaştır; yalnızca her iki dosyada da ilk alanı ortak olan yorumları, artan kimlik sırasına göre bir satır listesi halinde sonuc.txt'ye yaz.

setup: |
  mkdir -p veri
  printf '0007|urunA|5|harika\n0012|urunB|2|idare eder\n0019|urunC|4|guzel\n0025|urunD|1|kotu\n0031|urunE|3|fena degil' > veri/yorumlar.txt
  printf '0007|urunA\n0012|urunB\n0019|urunC\n0033|urunF\n0040|urunG\n0025|urunD' > veri/gecerli.txt

goal_tr: >
  veri/yorumlar.txt icinde gecen her yorum satirini, ilk alani
  veri/gecerli.txt icindeki ilk alanlarla karsilastir, yalnizca iki dosyada
  da ilk alani ortak olan yorumlari artan kimlik sirasina gore satir listesi
  olarak sonuc.txt'ye yaz.

reference_solution: |
  cut -d'|' -f1 veri/yorumlar.txt | sort > /tmp/a.txt
  cut -d'|' -f1 veri/gecerli.txt | sort > /tmp/b.txt
  comm -12 /tmp/a.txt /tmp/b.txt > /tmp/ortak.txt
  sort veri/yorumlar.txt > /tmp/yorum_sirali.txt
  join -t'|' -1 1 -2 1 -o 2.1,2.2,2.3,2.4 /tmp/ortak.txt /tmp/yorum_sirali.txt > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: sonuc.txt, value: [0007|urunA|5|harika, 0012|urunB|2|idare eder, 0019|urunC|4|guzel, 0025|urunD|1|kotu]}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4011
    bundle: kume-farki
    tools:
    - comm
    - sort
    konu: urun-yorumlari
    hedef: denetle
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: satir-listesi
    kesif: dosyayi-bul
    uslup: baglam-gomulu
    direnc: son-newline-yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
