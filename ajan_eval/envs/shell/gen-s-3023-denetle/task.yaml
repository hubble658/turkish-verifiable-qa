id: gen-s-3023-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) envanter dizin ağacındaki her kayıt.json dosyasını bul ve her biri için, dosyanın bulunduğu dizinin adını ve dosyanın ilk satırındaki ad alanının değerini belirle.

  2) Bu dizin adı ve ad değerlerini "<dizinadi>:<ad>" biçiminde, her biri kendi satırında olacak şekilde denetim.txt dosyasına yaz; dizin adları alfabetik sırada olsun.

setup: |
  mkdir -p envanter/bolge_a envanter/bolge_b envanter/bolge_c
  cat > envanter/bolge_a/kayit.json <<'J'
  {"ad":"sunucu01","tur":"fiziksel","durum":"aktif"}
  J
  cat > envanter/bolge_b/kayit.json <<'J'
  {"ad":"sunucu02","tur":"sanal","durum":"bakimda"}
  J
  cat > envanter/bolge_c/notlar.txt <<'T'
  bu dizinde json yok
  T

goal_tr: >
  envanter dizin agacindaki her kayit.json dosyasinin bulundugu dizinin
  adini (bolge_a, bolge_b gibi) ve dosyanin ilk satirindaki ad alaninin
  degerini "<dizinadi>:<ad>" biciminde, her biri kendi satirinda olacak
  sekilde denetim.txt dosyasina yaz; dizin adlari alfabetik sirada olsun

reference_solution: |
  find envanter -name kayit.json | sort | while read f; do d=$(basename "$(dirname "$f")"); a=$(sed -n 's/.*"ad":"\([^"]*\)".*/\1/p' "$f" | head -n 1); echo "$d:$a"; done > denetim.txt

outputs:
  - {path: denetim.txt, kind: file}

checks:
  - {op: file_lines_eq, path: denetim.txt, value: ['bolge_a:sunucu01', 'bolge_b:sunucu02']}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3023
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: envanter
    hedef: denetle
    girdi: json
    kaynak: dizin-agaci
    cikti: birden-cok-dosya
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
