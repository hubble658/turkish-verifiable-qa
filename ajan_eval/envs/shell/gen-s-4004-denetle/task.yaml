    konu: kutuphane-kayitlari
    hedef: denetle
    girdi: ini
    kaynak: tek-dosya
    cikti: birden-cok-dosya
    kesif: yok
    uslup: baglam-gomulu
    direnc: tekrar-eden-kayit
    bukulme: tuzak-dosya
    adim: 4
