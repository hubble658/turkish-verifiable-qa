id: gen-s-4142-onar
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) notlar dizinindeki her öğrenci dosyasındaki büyük O harfini 0 ile değiştir.

  2) Elde edilen içerikte iki nokta karakterlerini boşluk olacak şekilde düzenle.

  3) cikti dizinini oluştur.

  4) Düzenlenmiş içeriği cikti dizininde aynı adla kaydet: cikti/ali veli.txt, cikti/ayse kaya.txt ve cikti/mehmet demir.txt.

setup: |
  mkdir -p notlar
  printf 'ad soyad:ali veli\nmatematik:85\nfizik:70\nkimya:9O\n' > 'notlar/ali veli.txt'
  printf 'ad soyad:ayse kaya\nmatematik:95\nfizik:88\nkimya:76\n' > 'notlar/ayse kaya.txt'
  printf 'ad soyad:mehmet demir\nmatematik:6O\nfizik:55\nkimya:72\n' > 'notlar/mehmet demir.txt'

goal_tr: >
  notlar dizinindeki her ogrenci dosyasinda gecen buyuk O harfini 0 ile
  degistirip, sonucu iki nokta yerine bosluk olacak sekilde duzenleyip cikti
  dizinindeki ayni adli dosyaya yaz ve cikti dizinini olustur.

reference_solution: |
  mkdir -p cikti
  for f in notlar/*.txt; do
    sed 's/O/0/g' "$f" | tr ':' ' ' > "cikti/$(basename "$f")"
  done

outputs:
  - {path: cikti, kind: dir}
  - {path: cikti/ali veli.txt, kind: file}
  - {path: cikti/ayse kaya.txt, kind: file}
  - {path: cikti/mehmet demir.txt, kind: file}

checks:
  - {op: dir_entries_eq, path: cikti, value: [ali veli.txt, ayse kaya.txt, mehmet demir.txt]}
  - {op: file_lines_eq, path: cikti/ali veli.txt, value: [ad soyad ali veli, matematik 85, fizik 70, kimya 90]}
  - {op: file_lines_eq, path: cikti/ayse kaya.txt, value: [ad soyad ayse kaya, matematik 95, fizik 88, kimya 76]}
  - {op: file_lines_eq, path: cikti/mehmet demir.txt, value: [ad soyad mehmet demir, matematik 60, fizik 55, kimya 72]}

metadata:
  domain: onar
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4142
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: ogrenci-notlari
    hedef: onar
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: bosluklu-ad
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
