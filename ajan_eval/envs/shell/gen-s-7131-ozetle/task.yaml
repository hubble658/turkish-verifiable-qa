id: gen-s-7131-ozetle
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) envanter.csv dosyasındaki her ürün için ürün adıyla birlikte "adet,fiyat" ikilisini "urun: adet fiyat" biçiminde envanter_ozet.txt dosyasına yaz.

  2) envanter_ozet.txt dosyasındaki satır sayısını satir_sayisi.txt dosyasına sadece sayı olarak yaz.

setup: |
  cat > envanter.csv <<'CSV'
  urun,adet,fiyat
  kalem,10,5
  defter,3,20
  silgi,7,2
  cetvel,1,15
  CSV

goal_tr: >
  envanter.csv dosyasindaki her urun icin "adet,fiyat" ikilisini urun adiyla
  birlikte "urun: adet fiyat" biciminde envanter_ozet.txt dosyasina yaz ve
  bu dosyadaki satir sayisini satir_sayisi.txt dosyasina sadece sayi olarak
  yaz

reference_solution: |
  grep -v '^urun' envanter.csv | awk -F, '{print $1": "$2" "$3}' > envanter_ozet.txt
  wc -l < envanter_ozet.txt > satir_sayisi.txt

outputs:
  - {path: envanter_ozet.txt, kind: lines}
  - {path: satir_sayisi.txt, kind: file}

checks:
  - {op: file_lines_eq, path: envanter_ozet.txt, value: ['kalem: 10 5', 'defter: 3 20', 'silgi: 7 2', 'cetvel: 1 15']}
  - {op: file_content_eq, path: satir_sayisi.txt, value: '4'}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7131
    bundle: say
    tools:
    - grep
    - wc
    konu: envanter
    hedef: ozetle
    girdi: csv
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
