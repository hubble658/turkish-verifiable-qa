id: gen-s-7078-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) notlar dizini altındaki her .ini dosyasını bul; her biri için dosyanın bulunduğu klasörün adını ve dosya adını uzantısız olarak alt alta yaz.

  2) Aynı dosyaların her birinin [not] bölümünde değeri 75'ten büyük olan satırların sayısını bul ve bu sayıları topla.

  3) Elde ettiğin klasör adları, uzantısız dosya adları ve toplam sayıyı sonuc.txt dosyasına yaz; sonuç sadece sayı olsun.

setup: |
  mkdir -p notlar/10 notlar/11
  cat > notlar/10/ali.ini <<'INI'
  [bilgi]
  ad = Ali
  sinif = 10

  [not]
  matematik = 85
  fizik = 70
  INI
  cat > notlar/11/ayse.ini <<'INI'
  [bilgi]
  ad = Ayse
  sinif = 11

  [not]
  matematik = 90
  kimya = 95
  INI
  cat > notlar/10/veli.ini <<'INI'
  [bilgi]
  ad = Veli
  sinif = 10

  [not]
  fizik = 60
  kimya = 80
  INI

goal_tr: >
  notlar dizini altindaki her .ini dosyasinin bulundugu klasorun adini ve
  dosya adini (uzantisiz) alt alta yazip, her dosyanin [not] bolumunde
  degeri 75'ten buyuk olan satir sayilarinin toplamini sonuc.txt dosyasina
  sadece sayi olarak yaz

reference_solution: |
  find notlar -name '*.ini' | while read -r f; do
    d=$(basename "$(dirname "$f")")
    n=$(basename "$f" .ini)
    echo "$d/$n"
  done > liste.txt
  for f in notlar/*/*.ini; do
    sed -n '/^\[not\]/,/^\[/p' "$f" | grep -E '= *[0-9]+' | awk -F= '$2+0 > 75' | wc -l
  done | awk '{s+=$1} END{print s}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '4'}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7078
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: ogrenci-notlari
    hedef: yeniden-duzenle
    girdi: ini
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: numarali-emir
    direnc: baslik-yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
