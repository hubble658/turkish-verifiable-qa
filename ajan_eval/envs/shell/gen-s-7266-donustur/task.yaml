id: gen-s-7266-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Kafeteryanın vardiya defteri artık iyice kabardı; her gün aynı isimler aynı görevlerle tekrar tekrar yazılıyor ve kimin hangi işte görevlendirildiğini görmek için tüm sayfaları karıştırmak gerekiyor. Müdür artık tek bir özet liste istiyor; tekrarlar ayıklanıp düzenli bir şekilde önüne konsun istiyor. Bu yüzden vardiya.log dosyasındaki her satırdan tarih ve saat alanlarını at, geriye kalan "ad görev" ikililerini tekilleştirip alfabetik olarak sırala ve sonuc.txt dosyasına her satırda bir tane olacak şekilde yaz.

setup: |
  cat > vardiya.log <<'LOG'
  2024-03-01 08:00 Ayse depo
  2024-03-01 16:00 Mehmet kasa
  2024-03-02 08:00 Ayse depo
  2024-03-02 16:00 Mehmet kasa
  2024-03-03 08:00 Zeynep kasa
  2024-03-03 16:00 Ayse depo
  2024-03-04 08:00 Mehmet depo
  2024-03-04 16:00 Zeynep kasa
  LOG

goal_tr: >
  vardiya.log dosyasindaki her satirdan tarih ve saat alanlarini atip kalan
  "ad gorev" ikililerini tekillestirip alfabetik olarak sirala ve sonuc.txt
  dosyasina her satirda bir tane olacak sekilde yaz

reference_solution: |
  cut -d' ' -f3- vardiya.log | sort | uniq > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: sonuc.txt, value: [Ayse depo, Mehmet depo, Mehmet kasa, Zeynep kasa]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7266
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: personel-vardiyalari
    hedef: donustur
    girdi: log-satiri
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
