id: gen-s-7308-dogrula
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  yorumlar dizin ağacındaki her .txt dosyasını CRLF satır sonlarından arındırıp sekme ile ayrılmış alanlarını koruyarak duzgun-yorumlar dizininda aynı göreli dizin yapısıyla yeniden üret; her dosyanın satır sayısını duzgun-yorumlar/sayim.txt dosyasına "goreli_yol<TAB>satir_sayisi" biçiminde sıralı olarak yaz.

setup: |
  mkdir -p yorumlar/arsiv yorumlar/gecici
  printf 'id:1\tskor:5\tyorum:urun guzel\r\n' > yorumlar/a.txt
  printf 'id:2\tskor:3\tyorum:kargo gec\r\n' > yorumlar/b.txt
  printf 'id:3\tskor:4\tyorum:fiyat iyi\r\n' > yorumlar/arsiv/c.txt
  printf 'id:4\tskor:2\tyorum:bozuk cikti\r\n' > yorumlar/arsiv/d.txt
  printf 'id:5\tskor:5\tyorum:tekrar alirim\r\n' > yorumlar/gecici/e.txt
  printf 'id:6\tskor:1\tyorum:berbat\r\n' > yorumlar/gecici/f.txt

goal_tr: >
  yorumlar dizin agacindaki her .txt dosyasini CRLF satir sonlarindan
  arindirip sekme ile ayrilmis alanlarini koruyarak duzgun-yorumlar
  dizininda ayni goreli dizin yapisiyla yeniden uret ve her dosyanin satir
  sayisini duzgun-yorumlar/sayim.txt dosyasina "goreli_yol<TAB>satir_sayisi"
  biciminde sirali olarak yaz

reference_solution: |
  find yorumlar -type f -name '*.txt' | sort | while IFS= read -r f; do
    rel=${f#yorumlar/}
    mkdir -p "duzgun-yorumlar/$(dirname "$rel")"
    tr -d '\r' < "$f" | sed 's/[[:space:]]*$//' > "duzgun-yorumlar/$rel"
  done
  find duzgun-yorumlar -type f -name '*.txt' | sort | while IFS= read -r f; do
    printf '%s\t%s\n' "${f#duzgun-yorumlar/}" "$(wc -l < "$f" | tr -d ' ')"
  done > duzgun-yorumlar/sayim.txt

outputs:
  - {path: duzgun-yorumlar, kind: dir}
  - {path: duzgun-yorumlar/sayim.txt, kind: lines}

checks:
  - {op: dir_entries_eq, path: duzgun-yorumlar, value: [a.txt, arsiv, b.txt, gecici, sayim.txt]}
  - {op: file_lines_eq, path: duzgun-yorumlar/sayim.txt, value: ["a.txt\t1", "arsiv/c.txt\t1", "arsiv/d.txt\t1", "b.txt\t1", "gecici/e.txt\t1", "gecici/f.txt\t1", "sayim.txt\t6"]}

metadata:
  domain: dogrula
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7308
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: urun-yorumlari
    hedef: dogrula
    girdi: log-satiri
    kaynak: dizin-agaci
    cikti: dizin-yapisi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: crlf
    bukulme: olcek
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
