id: gen-s-3055-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiya/personel.ini içinde vardiyası gece olan ve vardiya/izinli.ini içinde izinli olarak işaretlenmemiş personel sayısını sonuc.txt'ye sadece sayı olarak yaz.

setup: |
  mkdir -p vardiya
  cat > vardiya/personel.ini <<'INI'
  [ayse]
  rol=hemsire
  vardiya=gece

  [mehmet]
  rol=hemsire
  vardiya=gunduz

  [zeynep]
  rol=doktor
  vardiya=gece

  [ali]
  rol=hemsire
  vardiya=gece
  INI
  cat > vardiya/izinli.ini <<'INI'
  [ayse]
  durum=izinli

  [ali]
  durum=izinli
  INI

goal_tr: >
  vardiya/personel.ini dosyasindaki vardiyasi gece olan ve
  vardiya/izinli.ini dosyasinda izinli olarak isaretlenmemis personel
  sayisini sonuc.txt'ye sadece sayi olarak yaz

reference_solution: |
  grep -A1 '^\[.*\]' vardiya/personel.ini | grep 'vardiya=gece' -B1 | grep '^\[' | tr -d '[]' | rev | cut -c1-99 | rev | sort > /tmp/gece.txt
  grep '^\[' vardiya/izinli.ini | tr -d '[]' | rev | cut -c1-99 | rev | sort > /tmp/izinli.txt
  comm -23 /tmp/gece.txt /tmp/izinli.txt | wc -l > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file, run: cat sonuc.txt}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '0'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3055
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: personel-vardiyalari
    hedef: ayikla
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: yok
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
