id: gen-s-4088-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) veri/sıcaklık.tsv ve veri/nem.tsv dosyalarını incele; ilk satırları başlık satırı olarak ele al.

  2) Bu iki dosyada başlık satırları hariç ortak olarak geçen gün değerlerini belirle.

  3) Belirlediğin gün değerlerini artan sırada, her satırda bir gün olacak şekilde ortak.txt dosyasına yaz.

setup: |
  mkdir -p veri
  cat > veri/sicaklik.tsv <<'TSV'
  gun	sicaklik
  P1	21
  P2	19
  P3	24
  P4	22
  P5	27
  TSV
  cat > veri/nem.tsv <<'TSV'
  gun	nem
  P1	40
  P3	55
  P4	61
  P6	48
  TSV

goal_tr: >
  veri/sicaklik.tsv ve veri/nem.tsv dosyalarinda ortak olarak gecen gun
  degerlerini (ilk satir basliklari haric) artan sirada, her satirda bir gun
  olacak sekilde ortak.txt dosyasina yaz.

reference_solution: |
  tail -n +2 veri/sicaklik.tsv | cut -f1 | sort > /tmp/a.txt
  tail -n +2 veri/nem.tsv | cut -f1 | sort > /tmp/b.txt
  comm -12 /tmp/a.txt /tmp/b.txt > ortak.txt
  rm -f /tmp/a.txt /tmp/b.txt

outputs:
  - {path: ortak.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: ortak.txt, value: [P1, P3, P4]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4088
    bundle: kume-farki
    tools:
    - comm
    - sort
    konu: sensor-olcumleri
    hedef: ayikla
    girdi: tsv
    kaynak: iki-dosya-capraz
    cikti: satir-listesi
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
