id: gen-s-4025-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) veri/urunler.json ve veri/yorumlar.json dosyalarını urun_id üzerinden birleştir.
  2) Her ürün için urun_id, ad, ortalama puan ve yorum sayisini hesapla.
  3) Sonuçları urun_id sırasına göre virgülle ayrılmış olarak rapor.csv dosyasına yaz.
  4) rapor.csv dosyasının ilk satırı urun_id,ad,ortalama_puan,yorum_sayisi başlığı olsun.

setup: |
  mkdir -p veri
  cat > veri/urunler.json <<'JSON'
  {"id":1,"ad":"Kulaklik-A1","fiyat":250}
  {"id":2,"ad":"Klavye-B2","fiyat":480}
  {"id":3,"ad":"Mouse-C3","fiyat":150}
  {"id":4,"ad":"Monitor-D4","fiyat":1200}
  JSON
  cat > veri/yorumlar.json <<'JSON'
  {"urun_id":1,"puan":5}
  {"urun_id":1,"puan":3}
  {"urun_id":2,"puan":4}
  {"urun_id":2,"puan":2}
  {"urun_id":3,"puan":5}
  {"urun_id":4,"puan":1}
  JSON

goal_tr: >
  veri/urunler.json ve veri/yorumlar.json dosyalarini urun_id uzerinden
  birlestirip her urun icin urun_id, ad, ortalama puan ve yorum sayisini
  virgulle ayrilmis olarak urun_id sirasina gore rapor.csv dosyasina yaz;
  ilk satir urun_id,ad,ortalama_puan,yorum_sayisi basligi olsun.

reference_solution: |
  awk -F'[:,}]' 'NR==FNR{id="";ad="";for(i=1;i<=NF;i++){if($i ~ /"id"/)id=$(i+1);if($i ~ /"ad"/){ad=$(i+1);gsub(/"/,"",ad)}};isim[id]=ad;next}{uid="";p="";for(i=1;i<=NF;i++){if($i ~ /"urun_id"/)uid=$(i+1);if($i ~ /"puan"/)p=$(i+1)};toplam[uid]+=p;sayi[uid]++}END{print "urun_id,ad,ortalama_puan,yorum_sayisi";for(u=1;u<=4;u++){if(u in isim)printf "%d,%s,%.1f,%d\n",u,isim[u],toplam[u]/sayi[u],sayi[u]}}' veri/urunler.json veri/yorumlar.json > rapor.csv

outputs:
  - {path: rapor.csv, kind: file}

checks:
  - {op: file_lines_eq, path: rapor.csv, value: ['urun_id,ad,ortalama_puan,yorum_sayisi', '1,Kulaklik-A1,4.0,2', '2,Klavye-B2,3.0,2', '3,Mouse-C3,5.0,1', '4,Monitor-D4,1.0,1']}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4025
    bundle: awk
    tools:
    - awk
    konu: urun-yorumlari
    hedef: denetle
    girdi: json
    kaynak: iki-dosya-capraz
    cikti: csv
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: olcek
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
