id: gen-s-4010-donustur
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  loglar.txt dosyasındaki her satırı ters çevirip ilk 10 karakterini al ve bu değerleri virgülle birleştirerek csv.txt dosyasına yaz.

  Şu şartlar sağlanmalı:
  - loglar.txt dosyasındaki her satır ayrı ayrı işlenmeli.
  - Her satırın ters çevrilmiş halinin ilk 10 karakteri alınmalı.
  - Elde edilen değerler virgülle birleştirilmeli.
  - Sonuç csv.txt dosyasına yazılmalı.
  - Çalışma dizini /workspace olmalı.

setup: |
  cat > loglar.txt <<'LOG'
  2024-01-01 10:00:00 OK sistem basladi
  2024-01-01 10:05:00 ERR disk dolu
  2024-01-01 10:10:00 OK kullanici giris yapti
  2024-01-01 10:15:00 WRN bellek az
  2024-01-01 10:20:00 ERR baglanti koptu
  LOG

goal_tr: >
  loglar.txt dosyasindaki her satiri ters cevirip ilk 10 karakterini alarak
  ve virgulle birlestirerek csv.txt dosyasina yaz

reference_solution: |
  rev loglar.txt | cut -c1-10 > csv.txt

outputs:
  - {path: csv.txt, kind: file}

checks:
  - {op: file_lines_eq, path: csv.txt, value: [idalsab me, ulod ksid, itpay siri, za kelleb, utpok itna]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4010
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: sunucu-loglari
    hedef: donustur
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: csv
    kesif: yok
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
