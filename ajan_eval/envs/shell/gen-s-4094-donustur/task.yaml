id: gen-s-4094-donustur
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  envanter.json içindeki her ürünün kod alanındaki sayıyı ters çevirip adet ile çarp, tüm sonuçları topla ve sonucu sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  cat > envanter.json <<'JSON'
  {"urunler":[
  {"ad":"kalem","kod":"KL-1023","adet":12},
  {"ad":"defter","kod":"DF-2048","adet":5},
  {"ad":"silgi","kod":"SG-3311","adet":8},
  {"ad":"cetvel","kod":"CV-4400","adet":3}
  ]}
  JSON

goal_tr: >
  envanter.json icindeki her urunun kod alanindaki sayi kismini ters cevirip
  adet ile carpip, tum urunler icin bulunan bu carpimlarin toplamini
  sonuc.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  grep -o '"kod":"[A-Z]*-[0-9]*"' envanter.json | cut -d- -f2 | tr -d '"' | rev | paste -d' ' - <(grep -o '"adet":[0-9]*' envanter.json | cut -d: -f2) | awk '{t+=$1*$2} END{print t}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '89618'}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4094
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: envanter
    hedef: donustur
    girdi: json
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
