id: gen-s-4089-donustur
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  hastalar.txt ve randevular.txt dosyalarındaki kayıtları müşteri numarasına göre eşleştirip hasta_no;ad_soyad;bolum;tarih;saat sütunlarından oluşan randevu.csv dosyasını oluştur. Oluşan randevu.csv dosyasının sonunda satır sonu karakteri bulunmasın.

setup: |
  cat > hastalar.txt <<'EOF'
  101;Ayse Yilmaz;Kardiyoloji
  102;Mehmet Demir;Noroloji
  103;Zeynep Kaya;Kardiyoloji
  104;Ali Ozturk;Ortopedi
  EOF
  cat > randevular.txt <<'EOF'
  101;2024-03-05;09:30
  102;2024-03-05;10:15
  103;2024-03-06;14:00
  104;2024-03-06;16:45
  EOF

goal_tr: >
  hastalar.txt ve randevular.txt dosyalarini musteri numarasina gore
  birlestirip hasta_no;ad_soyad;bolum;tarih;saat sutunlarindan olusan ve
  sonunda satir sonu karakteri bulunmayan randevu.csv dosyasini uret.

reference_solution: |
  paste -d';' hastalar.txt randevular.txt | cut -d';' -f1,2,3,5,6 | tr -d '\n' > randevu.csv

outputs:
  - {path: randevu.csv, kind: file}

checks:
  - {op: file_content_eq, path: randevu.csv, value: '101;Ayse Yilmaz;Kardiyoloji;2024-03-05;09:30102;Mehmet Demir;Noroloji;2024-03-05;10:15103;Zeynep Kaya;Kardiyoloji;2024-03-06;14:00104;Ali Ozturk;Ortopedi;2024-03-06;16:45'}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4089
    bundle: sutun
    tools:
    - cut
    - paste
    konu: hastane-randevulari
    hedef: donustur
    girdi: log-satiri
    kaynak: iki-dosya-capraz
    cikti: csv
    kesif: yok
    uslup: kisit-sakli
    direnc: son-newline-yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
