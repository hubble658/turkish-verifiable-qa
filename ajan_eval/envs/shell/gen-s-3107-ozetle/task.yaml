id: gen-s-3107-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  notlar dizin ağacındaki tüm .ini dosyalarındaki not= satırlarında geçen sayıların toplamını hesapla ve bu toplamı toplam.txt dosyasına yalnızca sayı olarak yaz.

setup: |
  mkdir -p notlar/2019 notlar/2020/defterler
  cat > notlar/2019/ali.ini <<'INI'
  ad=Ali
  not=85
  INI
  cat > notlar/2020/defterler/ayse.ini <<'INI'
  ad=Ayse
  not=90
  INI
  cat > notlar/2020/defterler/mehmet.ini <<'INI'
  ad=Mehmet
  not=70
  INI
  cat > notlar/2020/okul.txt <<'TXT'
  bu bir ini dosyasi degil
  not=100
  TXT

goal_tr: >
  notlar dizin agacindaki tum .ini dosyalarindaki not= satirlarindaki
  sayilarin toplamini toplam.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  find notlar -type f -name '*.ini' -exec awk -F= '/^not=/{s+=$2} END{print s}' {} + > toplam.txt

outputs:
  - {path: toplam.txt, kind: file}

checks:
  - {op: file_content_eq, path: toplam.txt, value: '245'}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3107
    bundle: awk
    tools:
    - awk
    konu: ogrenci-notlari
    hedef: ozetle
    girdi: ini
    kaynak: dizin-agaci
    cikti: tek-sayi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
