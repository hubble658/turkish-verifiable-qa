id: gen-s-7006-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depo klasöründeki gonderiler.txt ve teslimatlar.txt dosyalarındaki takip numaralarını karşılaştır. gonderiler.txt içinde olup teslimatlar.txt içinde olmayan takip numaralarının sayısını bul ve bu sayıyı sonuc.txt dosyasına yalnızca sayı olarak yaz.

setup: |
  mkdir -p depo
  cat > depo/gonderiler.txt <<'TXT'
  TR1001 sevk edildi
  TR1002 sevk edildi
  TR1003 sevk edildi
  TR1004 sevk edildi
  TR1005 sevk edildi
  TXT
  cat > depo/teslimatlar.txt <<'TXT'
  TR1001 teslim edildi
  TR1003 teslim edildi
  TR1005 teslim edildi
  TXT

goal_tr: >
  depo klasorundeki gonderiler.txt ve teslimatlar.txt dosyalarindaki takip
  numaralarini karsilastirip, gonderiler.txt icinde olup teslimatlar.txt
  icinde olmayan takip numarasi sayisini sonuc.txt dosyasina sadece sayi
  olarak yaz.

reference_solution: |
  head -n 5 depo/gonderiler.txt | cut -d' ' -f1 | sort > /tmp/g.txt
  tail -n 3 depo/teslimatlar.txt | cut -d' ' -f1 | sort > /tmp/t.txt
  comm -23 /tmp/g.txt /tmp/t.txt | wc -l > sonuc.txt
  rm -f /tmp/g.txt /tmp/t.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '2'}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7006
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: kargo-takibi
    hedef: bol
    girdi: duz-metin
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
