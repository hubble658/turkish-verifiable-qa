id: gen-s-0071-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14
prompt: 'book*.txt dosyalarındaki her kitabın Title ve Author bilgilerini çıkararak books_processed adlı bir dizin oluşturun
  ve her kitabın bilgilerini bu dizin altında ayrı bir JSON nesnesi olarak saklayın.


  Her kitap için books_processed/<kaynak dosya adı>.json dosyası olsun (ör. book1.json), içeriği {"Title": ..., "Author":
  ...}.

  '
setup: 'cat > book1.txt <<''EOF''

  Title: The Great Gatsby

  Author: F. Scott Fitzgerald

  Year: 1925

  Genre: Fiction

  EOF


  cat > book2.txt <<''EOF''

  Title: 1984

  Author: George Orwell

  Year: 1949

  Genre: Dystopian

  EOF


  cat > book3.txt <<''EOF''

  Title: To Kill a Mockingbird

  Author: Harper Lee

  Year: 1960

  Genre: Fiction

  EOF


  cat > README.txt <<''EOF''

  This directory contains book records.

  Ignore this file.

  EOF

  '
goal_tr: 'book*.txt dosyalarındaki her bir kitabın Title ve Author bilgilerini çıkararak, her kitabın ayrı bir JSON nesnesi
  olarak yer aldığı ve her nesnenin bir alt dizinde saklandığı bir yapı oluşturun.

  '
reference_solution: "python3 - <<'PY'\nimport glob, json, os\nos.makedirs(\"books_processed\", exist_ok=True)\nfor f in glob.glob(\"\
  book*.txt\"):\n    d = dict(s.strip().split(\": \", 1) for s in open(f) if \": \" in s)\n    json.dump({\"Title\": d[\"\
  Title\"], \"Author\": d[\"Author\"]}, open(\"books_processed/\" + f[:-4] + \".json\", \"w\"))\nPY\n"
outputs: []
checks:
- op: dir_entries_eq
  path: books_processed
  value:
  - book1.json
  - book2.json
  - book3.json
- op: json_eq
  path: books_processed/book1.json
  value:
    Title: The Great Gatsby
    Author: F. Scott Fitzgerald
- op: json_eq
  path: books_processed/book2.json
  value:
    Title: '1984'
    Author: George Orwell
- op: json_eq
  path: books_processed/book3.json
  value:
    Title: To Kill a Mockingbird
    Author: Harper Lee
