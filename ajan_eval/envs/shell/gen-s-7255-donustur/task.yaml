id: gen-s-7255-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12
prompt: 'arsiv klasöründeki tüm csv dosyalarını önce tar ile tek bir arşive topla, ardından gzip ile sıkıştırıp randevular.tar.gz
  dosyasını oluştur. Son olarak arşivdeki toplam satır sayısını sonuc.txt dosyasına sadece sayı olacak şekilde yaz.


  Çıktıyı çalışma dizininin kökünde (randevular.tar.gz ve sonuc.txt) oluştur, alt dizine yazma.

  '
setup: 'mkdir -p arsiv

  cat > arsiv/ocak.csv <<''CSV''

  hasta,bolum,tarih

  Ali,Kardiyoloji,2024-01-05

  Ayse,Noroloji,2024-01-07

  CSV

  cat > arsiv/subat.csv <<''CSV''

  hasta,bolum,tarih

  Can,Ortopedi,2024-02-11

  Deniz,Kardiyoloji,2024-02-15

  CSV

  '
goal_tr: 'arsiv klasorundeki tum csv dosyalarini once tar ile tek bir arsive topla, sonra gzip ile sikistirip randevular.tar.gz
  olustur ve arsivdeki toplam satir sayisini sonuc.txt''ye sadece sayi olarak yaz

  '
reference_solution: 'tar cf randevular.tar arsiv

  gzip randevular.tar

  tar xzOf randevular.tar.gz | wc -l > sonuc.txt

  '
outputs:
- path: randevular.tar.gz
  kind: file
- path: sonuc.txt
  kind: file
checks:
- op: run_stdout_eq
  cmd: tar -tzf randevular.tar.gz | sort
  value: 'arsiv/

    arsiv/ocak.csv

    arsiv/subat.csv'
- op: file_content_eq
  path: sonuc.txt
  value: '6'
metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7255
    bundle: arsiv
    tools:
    - tar
    - gzip
    konu: hastane-randevulari
    hedef: donustur
    girdi: csv
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
  duzeltme:
    neden: yol_belirsiz
    not: Çıktının yeri yazmıyordu.
