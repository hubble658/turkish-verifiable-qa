id: gen-s-7116-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  siparisler/siparisler.txt dosyasındaki her satırı masa numarasına göre grupla ve siparisler/ozet dizininde her masa için MASA-1.txt, MASA-2.txt, MASA-3.txt dosyalarını oluştur. Her dosyada o masanın toplam_adet ve toplam_tutar değerleri sadece sayı olarak yer alsın.

setup: |
  mkdir -p siparisler
  cat > siparisler/siparisler.txt <<'DATA'
  Masa: 3 | Urun: Corba | Adet: 2 | Fiyat: 45
  Masa: 1 | Urun: Pizza | Adet: 1 | Fiyat: 120
  Masa: 3 | Urun: Pizza | Adet: 1 | Fiyat: 120
  Masa: 2 | Urun: Salata | Adet: 3 | Fiyat: 30
  Masa: 1 | Urun: Corba | Adet: 1 | Fiyat: 45
  Masa: 2 | Urun: Pizza | Adet: 2 | Fiyat: 120
  Masa: 3 | Urun: Salata | Adet: 1 | Fiyat: 30
  DATA

goal_tr: >
  siparisler/siparisler.txt icindeki her siparis satirini ayristirip masa
  numarasina gore gruplayarak siparisler/ozet dizininde her masa icin
  MASA-<numara>.txt dosyasi uret; her dosyada o masanin toplam adedi ve
  toplam tutari "toplam_adet: <sayi>" ve "toplam_tutar: <sayi>" satirlari
  olarak yer alsin

reference_solution: |
  mkdir -p siparisler/ozet
  awk -F'|' '{gsub(/[^0-9]/,"",$1); gsub(/[^0-9]/,"",$3); gsub(/[^0-9]/,"",$4); adet[$1]+=$3; tutar[$1]+=$3*$4} END {for (m in adet) print m, adet[m], tutar[m]}' siparisler/siparisler.txt | sort -n > /tmp/ozet_ara.txt
  while read -r masa adet tutar; do
    printf 'toplam_adet: %s\ntoplam_tutar: %s\n' "$adet" "$tutar" > "siparisler/ozet/MASA-$masa.txt"
  done < /tmp/ozet_ara.txt
  rm -f /tmp/ozet_ara.txt
  python3 - <<'PY'
  import os
  d = "siparisler/ozet"
  assert os.path.isdir(d)
  print("ozet dizini hazir")
  PY

outputs:
  - {path: siparisler/ozet, kind: dir}
  - {path: siparisler/ozet/MASA-1.txt, kind: file}
  - {path: siparisler/ozet/MASA-2.txt, kind: file}
  - {path: siparisler/ozet/MASA-3.txt, kind: file}

checks:
  - {op: dir_entries_eq, path: siparisler/ozet, value: [MASA-1.txt, MASA-2.txt, MASA-3.txt]}
  - {op: file_lines_eq, path: siparisler/ozet/MASA-1.txt, value: ['toplam_adet: 2', 'toplam_tutar: 165']}
  - {op: file_lines_eq, path: siparisler/ozet/MASA-2.txt, value: ['toplam_adet: 5', 'toplam_tutar: 330']}
  - {op: file_lines_eq, path: siparisler/ozet/MASA-3.txt, value: ['toplam_adet: 4', 'toplam_tutar: 240']}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7116
    bundle: python-veri
    tools:
    - python3
    konu: restoran-siparisleri
    hedef: ozetle
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: veriye-bak
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
