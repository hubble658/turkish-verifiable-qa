id: gen-s-7074-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depo klasöründe adında boşluk geçen .tsv dosyalarının her birinden son satırı al ve bu satırların toplam satır sayısını toplam.txt dosyasına sadece sayı olarak yaz.

  Şu şartlar sağlanmalı:
  - depo klasöründeki yalnızca adında boşluk geçen .tsv dosyaları dikkate alınmalı; adında boşluk geçmeyen .tsv dosyaları işleme katılmamalı.
  - Her uygun .tsv dosyasından yalnızca son satır alınmalı.
  - Elde edilen satırların toplam sayısı hesaplanmalı.
  - Sonuç, çalışma dizinindeki toplam.txt dosyasına yalnızca sayı olarak yazılmalı; başka hiçbir metin, etiket veya açıklama bulunmamalı.

setup: |
  mkdir -p depo
  printf 'urun\tadet\tfiyat\nkalem\t10\t5\ndefter\t3\t12\nsilgi\t7\t2\n' > "depo/urun listesi.tsv"
  printf 'urun\tadet\tfiyat\ncetvel\t4\t6\nkalem\t2\t5\n' > "depo/yedek liste.tsv"

goal_tr: >
  depo klasorundeki adinda bosluk gecen .tsv dosyalarinin her birinden son
  satiri al ve bu satirlarin toplam satir sayisini toplam.txt dosyasina
  sadece sayi olarak yaz

reference_solution: |
  find depo -name '* *.tsv' | sort > dosyalar.txt
  while IFS= read -r f; do tail -n 1 "$f"; done < dosyalar.txt > son_satirlar.txt
  head -n 1 dosyalar.txt > /dev/null
  wc -l < son_satirlar.txt > toplam.txt

outputs:
  - {path: toplam.txt, kind: file}

checks:
  - {op: file_content_eq, path: toplam.txt, value: '2'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7074
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: envanter
    hedef: ayikla
    girdi: tsv
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: kabul-kriteri
    direnc: bosluklu-ad
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
