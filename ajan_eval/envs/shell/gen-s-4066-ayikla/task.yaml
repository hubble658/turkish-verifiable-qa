id: gen-s-4066-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiya_a.json ve vardiya_b.json içindeki ad, gün ve saat alanları birebir aynı olan ortak kayıt sayısını bulup sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  cat > vardiya_a.json <<'JSON'
  {"kayitlar": [
    {"ad": "ali", "gun": "pazartesi", "saat": 8},
    {"ad": "ayse", "gun": "pazartesi", "saat": 9},
    {"ad": "can", "gun": "sali", "saat": 8},
    {"ad": "deniz", "gun": "sali", "saat": 10},
    {"ad": "ece", "gun": "carsi", "saat": 7}
  ]}
  JSON

  cat > vardiya_b.json <<'JSON'
  {"kayitlar": [
    {"ad": "ali", "gun": "pazartesi", "saat": 8},
    {"ad": "fatma", "gun": "sali", "saat": 9},
    {"ad": "can", "gun": "sali", "saat": 8},
    {"ad": "gokhan", "gun": "carsi", "saat": 6},
    {"ad": "ece", "gun": "carsi", "saat": 7}
  ]}
  JSON

goal_tr: >
  vardiya_a.json ve vardiya_b.json dosyalarindaki kayitlar arasinda hem ad
  hem gun hem saat alanlari birebir ayni olan kac ortak kayit bulundugunu
  sonuc.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  tail -n +1 vardiya_a.json | grep -o '{"ad": "[a-z]*", "gun": "[a-z]*", "saat": [0-9]*}' | sort > /tmp/a.txt
  tail -n +1 vardiya_b.json | grep -o '{"ad": "[a-z]*", "gun": "[a-z]*", "saat": [0-9]*}' | sort > /tmp/b.txt
  comm -12 /tmp/a.txt /tmp/b.txt > /tmp/ortak.txt
  head -n 100000 /tmp/ortak.txt > /tmp/ortak_sinirli.txt
  wc -l < /tmp/ortak_sinirli.txt > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '3'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4066
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: personel-vardiyalari
    hedef: ayikla
    girdi: json
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: veriye-bak
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
