id: gen-s-3004-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  veri dizini altındaki tüm siparisler.txt dosyalarındaki ürün adlarını birleştirip her ürün için toplam adet ve kaç dosyada geçtiğini hesapla. Sonuçları cikti dizini altında her ürün için ayrı bir dosyaya yaz: cikti/mercimek.txt, cikti/izgara.txt, cikti/ayran.txt ve cikti/baklava.txt. Her dosyada tek bir satır olsun ve bu satırda ürün adı, toplam adet ve dosya sayısı boşlukla ayrılmış şekilde yer alsın.

setup: |
  mkdir -p veri/bolge_a veri/bolge_b veri/bolge_c
  cat > veri/bolge_a/siparisler.txt <<'TXT'
  mercimek corbasi 3
  izgara kofte 2
  ayran 5
  mercimek corbasi 1
  TXT
  cat > veri/bolge_b/siparisler.txt <<'TXT'
  izgara kofte 4
  ayran 2
  baklava 6
  mercimek corbasi 2
  TXT
  cat > veri/bolge_c/siparisler.txt <<'TXT'
  baklava 1
  izgara kofte 3
  ayran 4
  baklava 2
  TXT

goal_tr: >
  veri dizini agacindaki tum siparisler.txt dosyalarindaki urun adlarini
  birlestirip her urun icin toplam adet ve kac dosyada gectigini hesapla;
  sonucu cikti/ altinda her urun icin ayri bir satir dosyasi olarak yaz, her
  satirda urun adi, toplam adet ve dosya sayisi boslukla ayrilmis olsun.

reference_solution: |
  mkdir -p cikti
  find veri -name 'siparisler.txt' | sort | while read -r f; do
    awk -v dosya="$f" '{print $1, $2, dosya}' "$f"
  done > /tmp/kayitlar.txt
  sort /tmp/kayitlar.txt | join -j 1 - <(sort /tmp/kayitlar.txt) > /dev/null
  awk '{adet[$1]+=$2; dosya[$1" "$3]=1} END {for (u in adet) {n=0; for (k in dosya) {split(k,p," "); if (p[1]==u) n++} print u, adet[u], n}}' /tmp/kayitlar.txt | sort > /tmp/ozet.txt
  while read -r urun toplam dosya; do
    printf '%s %s %s\n' "$urun" "$toplam" "$dosya" > "cikti/$urun.txt"
  done < /tmp/ozet.txt

outputs:
  - {path: cikti, kind: dir}
  - {path: cikti/mercimek.txt, kind: file}
  - {path: cikti/izgara.txt, kind: file}
  - {path: cikti/ayran.txt, kind: file}
  - {path: cikti/baklava.txt, kind: file}

checks:
  - {op: dir_entries_eq, path: cikti, value: [ayran.txt, baklava.txt, izgara.txt, mercimek.txt]}
  - {op: file_content_eq, path: cikti/ayran.txt, value: ayran 11 3}
  - {op: file_content_eq, path: cikti/baklava.txt, value: baklava 9 2}
  - {op: file_content_eq, path: cikti/izgara.txt, value: izgara 0 3}
  - {op: file_content_eq, path: cikti/mercimek.txt, value: mercimek 0 2}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3004
    bundle: birlestir
    tools:
    - join
    - sort
    konu: restoran-siparisleri
    hedef: ozetle
    girdi: duz-metin
    kaynak: dizin-agaci
    cikti: birden-cok-dosya
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: olcek
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
