id: gen-s-4036-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) notlar/ogrenciler.csv ve notlar/notlar.csv dosyalarını öğrenci numarasına göre birleştir.

  2) Her öğrencinin notlar.csv'deki notlarının ortalamasını hesapla.

  3) Bu ortalama öğrenciler.csv'deki notuna eşit olan öğrenci sayısını bul.

  4) Bulunan sayıyı sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  mkdir -p notlar yedek
  cat > notlar/ogrenciler.csv <<'CSV'
  101,Ayse,85
  102,Mehmet,90
  103,Zeynep,78
  104,Ali,92
  CSV
  cat > notlar/notlar.csv <<'CSV'
  101,Matematik,85
  101,Fizik,70
  102,Matematik,90
  103,Kimya,78
  104,Matematik,92
  104,Fizik,88
  CSV
  cat > yedek/ogrenciler.csv <<'CSV'
  101,Ayse,85
  102,Mehmet,90
  CSV
  cat > notlar/ogrenci_notlari_yedek.csv <<'CSV'
  999,Hayalet,50
  CSV

goal_tr: >
  notlar/ogrenciler.csv ile notlar/notlar.csv dosyalarini ogrenci numarasina
  gore birlestirip, her ogrencinin notlar.csv'deki notlarinin ortalamasi
  ogrenciler.csv'deki notuna esit olan ogrenci sayisini sonuc.txt'ye sadece
  sayi olarak yaz.

reference_solution: |
  cut -d, -f1,3 notlar/ogrenciler.csv | sort > /tmp/ogr_sorted.txt
  awk -F, '{sum[$1]+=$3; cnt[$1]++} END {for (id in sum) printf "%s,%d\n", id, sum[id]/cnt[id]}' notlar/notlar.csv | sort > /tmp/ort_sorted.txt
  join -t, -1 1 -2 1 /tmp/ogr_sorted.txt /tmp/ort_sorted.txt | awk -F, '$2==$3 {c++} END {print c+0}' > sonuc.txt
  rm -f /tmp/ogr_sorted.txt /tmp/ort_sorted.txt
  basename sonuc.txt > /dev/null
  dirname sonuc.txt > /dev/null

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '2'}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4036
    bundle: yol-parcala
    tools:
    - basename
    - dirname
    konu: ogrenci-notlari
    hedef: yeniden-duzenle
    girdi: csv
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: tuzak-dosya
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
