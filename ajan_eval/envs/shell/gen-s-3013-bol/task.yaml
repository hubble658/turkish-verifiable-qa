id: gen-s-3013-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi/sunucu.ini dosyasındaki her bir bölüm başlığını, yani köşeli parantezle başlayan satırları, geldikleri sırayla ele alıp köşeli parantezleri çıkararak yalnızca bölüm adı olarak bolumler.txt dosyasına yaz; her bölüm adı bu dosyada kendi satırında yer alsın.

setup: |
  mkdir -p girdi
  printf '%s\n' \
    '[genel]' \
    'ad=alpha' \
    'seviye=3' \
    '' \
    '[ag]' \
    'host=10.0.0.1' \
    'port=8080' \
    'not=ilk satir' \
    'not=ikinci satir' \
    '  ' \
    '[disk]' \
    'yol=/var/log' \
    'boyut=12G' \
    > girdi/sunucu.ini

goal_tr: >
  girdi/sunucu.ini dosyasindaki her bir bolum basligini ([ ile baslayan
  satirlar) sirasiyla, koseli parantezler olmadan, yalnizca bolum adi olarak
  bolumler.txt dosyasina birer satir halinde yaz.

reference_solution: |
  printf '%s\n' "$(grep -n '^\[' girdi/sunucu.ini | sort -n -t: -k1,1 | cut -d: -f2- | sed 's/^\[//; s/\]$//')" > bolumler.txt
  seq 1 3 >/dev/null

outputs:
  - {path: bolumler.txt, kind: lines, run: cat bolumler.txt}

checks:
  - {op: file_lines_eq, path: bolumler.txt, value: [genel, ag, disk]}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3013
    bundle: uret
    tools:
    - printf
    - seq
    konu: sunucu-loglari
    hedef: bol
    girdi: ini
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: dolayli-hedef
    uslup: duz-hedef
    direnc: yok
    bukulme: kirli-veri
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
