id: gen-s-7024-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  olcumler.tsv dosyasındaki başlık satırını atla. Kalan her satırı sensor, tarih ve deger alanlarından oluşan bir JSON nesnesine dönüştür. Aynı olan satırları yalnızca bir kez al. Elde ettiğin tüm nesneleri sırayı koruyarak bir JSON dizisi halinde ozet.json dosyasına yaz.

setup: |
  cat > olcumler.tsv <<'TSV'
  sensor	tarih	deger
  S1	2024-01-01	10
  S2	2024-01-01	20
  S1	2024-01-01	10
  S3	2024-01-02	5
  S2	2024-01-01	20
  S1	2024-01-02	7
  TSV

goal_tr: >
  olcumler.tsv dosyasindaki baslik satirini atlayip her satiri
  {"sensor":...,"tarih":...,"deger":...} biciminde bir JSON nesnesine cevir,
  tekrar eden satirlari yalnizca bir kez al ve tum nesneleri sirayla bir
  JSON dizisi olarak ozet.json dosyasina yaz

reference_solution: |
  tail -n +2 olcumler.tsv | sort -u | awk -F'\t' 'BEGIN{printf "["} {printf "%s{\"sensor\":\"%s\",\"tarih\":\"%s\",\"deger\":%s}", (NR>1?",":""), $1, $2, $3} END{print "]"}' > ozet.json

outputs:
  - {path: ozet.json, kind: json}

checks:
  - {op: json_eq, path: ozet.json, value: [{sensor: S1, tarih: '2024-01-01', deger: 10}, {sensor: S1, tarih: '2024-01-02', deger: 7}, {sensor: S2, tarih: '2024-01-01', deger: 20}, {sensor: S3, tarih: '2024-01-02', deger: 5}]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7024
    bundle: awk
    tools:
    - awk
    konu: sensor-olcumleri
    hedef: donustur
    girdi: tsv
    kaynak: tek-dosya
    cikti: json
    kesif: veriye-bak
    uslup: duz-hedef
    direnc: tekrar-eden-kayit
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
