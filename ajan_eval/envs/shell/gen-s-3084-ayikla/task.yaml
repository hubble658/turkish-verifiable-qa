id: gen-s-3084-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  siparisler dizin ağacındaki tüm .txt dosyalarındaki satırları birleştir; her satır "|" karakteriyle ayrılmış alanlardan oluşuyor. Bu satırları ürün adına göre gruplayarak her ürün için toplam adet ve toplam tutarı hesapla ve sonucu ürün adı anahtarli geçerli bir JSON nesnesi olarak siparisler/ozet.json dosyasına yaz; bu dosyada her ürün için toplam adet ve toplam tutar yer alsın, siparisler/siparisler.csv dosyasına ise dokunma.

setup: |
  mkdir -p siparisler/2024
  cat > siparisler/2024/ocak.txt <<'TXT'
  101|kebap|2|120
  102|corba|1|40
  103|kebap|3|180
  TXT
  cat > siparisler/2024/subat.txt <<'TXT'
  201|pide|1|90
  202|kebap|2|120
  203|corba|4|160
  TXT
  cat > siparisler/siparisler.csv <<'CSV'
  301|kebap|1|60
  302|pide|2|180
  303|corba|1|40
  CSV

goal_tr: >
  siparisler dizin agacindaki tum .txt dosyalarindaki satirlari birlestirip,
  her satiri "|" ile ayirip urun adina gore gruplayarak toplam adet ve
  toplam tutari hesapla ve sonucu urun adi anahtarli gecerli bir JSON
  nesnesi olarak siparisler/ozet.json dosyasina yaz

reference_solution: |
  cat siparisler/2024/ocak.txt siparisler/2024/subat.txt > siparisler/gecici.txt
  cut -d'|' -f2,3,4 siparisler/gecici.txt > siparisler/ayik.txt
  awk -F'|' '{adet[$1]+=$2; tutar[$1]+=$3} END {for (u in adet) printf "%s|%d|%d\n", u, adet[u], tutar[u]}' siparisler/ayik.txt | sort > siparisler/grup.txt
  awk -F'|' 'BEGIN {printf "{"} {if (NR>1) printf ","; printf "\"%s\":{\"adet\":%d,\"tutar\":%d}", $1, $2, $3} END {printf "}\n"}' siparisler/grup.txt | tee siparisler/ozet.json > /dev/null

outputs:
  - {path: siparisler/ozet.json, kind: json}

checks:
  - {op: json_eq, path: siparisler/ozet.json, value: {corba: {adet: 5, tutar: 200}, kebap: {adet: 7, tutar: 420}, pide: {adet: 1, tutar: 90}}}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3084
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: restoran-siparisleri
    hedef: ayikla
    girdi: json
    kaynak: dizin-agaci
    cikti: json
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: kirli-veri
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
