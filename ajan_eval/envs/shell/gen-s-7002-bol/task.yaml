id: gen-s-7002-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi klasöründeki tüm csv dosyalarını incele. Bu dosyalardaki geçerli minC ve maxC değerlerini kullanarak her şehir için minC ve maxC ortalamalarını hesapla. Geçersiz ya da boş değerleri ortalamaya katma. Sonucu sonuc.json dosyasına yaz; bu dosya şehir adlarını anahtar olarak kullanan geçerli bir JSON nesnesi olsun ve her şehir için minC ve maxC ortalamalarını içersin.

setup: |
  mkdir -p girdi
  cat > girdi/istanbul.csv <<'CSV'
  sehir,tarih,minC,maxC
  istanbul,2024-01-01,3,9
  istanbul,2024-01-02,,11
  istanbul,2024-01-03,5,
  CSV
  cat > girdi/ankara.csv <<'CSV'
  sehir,tarih,minC,maxC
  ankara,2024-01-01,-2,4
  ankara,2024-01-02,-1,6
  ankara,2024-01-03,0,7
  CSV

goal_tr: >
  girdi klasorundeki tum csv dosyalarindaki gecerli minC ve maxC degerlerini
  kullanarak her sehir icin minC ve maxC ortalamalarini hesapla ve
  sonuc.json dosyasina sehir adina gore bu iki ortalamayi iceren gecerli bir
  JSON nesnesi olarak yaz.

reference_solution: |
  cut -d, -f1,3,4 girdi/*.csv | tail -n +2 | awk -F, '$1!="" && $2!="" && $3!="" {n[$1]++; s1[$1]+=$2; s2[$1]+=$3} END {for (c in n) printf "%s %.2f %.2f\n", c, s1[c]/n[c], s2[c]/n[c]}' | sort | tee /tmp/ort.txt >/dev/null
  awk 'BEGIN{printf "{"} {printf "%s\"%s\": {\"minC\": %s, \"maxC\": %s}", (NR>1?",":""), $1, $2, $3} END{printf "}\n"}' /tmp/ort.txt > sonuc.json

outputs:
  - {path: sonuc.json, kind: json}

checks:
  - {op: json_eq, path: sonuc.json, value: {ankara: {minC: -1.0, maxC: 5.67}, istanbul: {minC: 3.0, maxC: 9.0}, sehir: {minC: 0.0, maxC: 0.0}}}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7002
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: hava-durumu-kayitlari
    hedef: bol
    girdi: csv
    kaynak: cok-dosya
    cikti: json
    kesif: veriye-bak
    uslup: duz-hedef
    direnc: yok
    bukulme: kirli-veri
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
