id: gen-s-3141-sirala-sec
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) vardiya dizin ağacındaki tüm .csv dosyalarındaki veri satırlarını, başlık satırı hariç, birleştir.

  2) Birleştirilen satırları gun alanına göre artan sırada sırala.

  3) Sıralanmış satırların her birini ad,gun,vardiya biçiminde tut.

  4) Bu satırları vardiya_sirali.csv dosyasına yaz.

setup: |
  mkdir -p vardiya/ocak vardiya/subat
  cat > vardiya/ocak/kayit.csv <<'CSV'
  ad,gun,vardiya
  elif,3,gece
  burak,1,gunduz
  cem,2,aksam
  CSV
  cat > vardiya/subat/kayit.csv <<'CSV'
  ad,gun,vardiya
  deniz,2,gece
  emre,1,aksam
  CSV
  cat > vardiya/ocak/notlar.txt <<'TXT'
  bu dosya csv degil
  TXT

goal_tr: >
  vardiya dizin agacindaki tum .csv dosyalarindaki veri satirlarini (baslik
  haric) gun alanina gore artan sirada birlestirip, her satiri
  ad,gun,vardiya biciminde tutarak vardiya_sirali.csv dosyasina yaz.

reference_solution: |
  find vardiya -type f -name '*.csv' | sort > /tmp/dosyalar.txt
  awk 'FNR==1{next} {print}' $(cat /tmp/dosyalar.txt) > /tmp/hepsi.txt
  ( echo 'ad,gun,vardiya'; sort -t, -k2,2n /tmp/hepsi.txt ) > vardiya_sirali.csv
  awk -F, 'NR>1{print $1}' vardiya_sirali.csv | wc -l > /tmp/sayi.txt

outputs:
  - {path: vardiya_sirali.csv, kind: file}

checks:
  - {op: file_lines_eq, path: vardiya_sirali.csv, value: ['ad,gun,vardiya', 'burak,1,gunduz', 'emre,1,aksam', 'cem,2,aksam', 'deniz,2,gece', 'elif,3,gece']}

metadata:
  domain: sirala-sec
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3141
    bundle: awk
    tools:
    - awk
    konu: personel-vardiyalari
    hedef: sirala-sec
    girdi: csv
    kaynak: dizin-agaci
    cikti: csv
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
