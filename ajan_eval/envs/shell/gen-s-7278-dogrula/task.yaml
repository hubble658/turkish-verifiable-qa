id: gen-s-7278-dogrula
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  olcumler.tsv dosyasını kullanarak sonuc.csv dosyasını oluştur. olcumler.tsv içindeki başlık satırını atla; kalan satırlardan deger alanı sayısal olmayan veya durum alanı OK olmayan satırları geçersiz say. Geçerli satır sayısını ve toplam satır sayısını hesapla ve sonuc.csv dosyasına "gecerli,toplam" başlığıyla tek bir veri satırı olarak yaz.

setup: |
  cat > olcumler.tsv <<'TSV'
  sensor	tarih	deger	durum
  S01	2024-01-01	12.5	OK
  S02	2024-01-01	-3.2	OK
  S01	2024-01-02	14.0	OK
  S03	2024-01-02	abc	HATA
  S02	2024-01-03	7.8	OK
  S04	2024-01-03	0	OK
  S01	2024-01-04	11.1	OK
  S03	2024-01-04	5.5	HATA
  TSV

goal_tr: >
  olcumler.tsv dosyasindaki baslik satirini atlayip, deger alani sayisal
  olmayan veya durum alani OK olmayan satirlari gecersiz sayarak, kalan
  gecerli satir sayisini ve toplam satir sayisini grep ile hesaplayip
  sonuc.csv dosyasina "gecerli,toplam" basligiyla tek veri satiri olarak yaz

reference_solution: |
  toplam=$(grep -c '^S' olcumler.tsv)
  gecersiz=$(grep -E '^S[0-9]+[[:space:]]+[0-9-]+[[:space:]]+[^0-9.-]|HATA' olcumler.tsv | grep -c '^S')
  gecerli=$((toplam - gecersiz))
  printf 'gecerli,toplam\n%s,%s\n' "$gecerli" "$toplam" > sonuc.csv
  wc -l < sonuc.csv

outputs:
  - {path: sonuc.csv, kind: file}

checks:
  - {op: file_lines_eq, path: sonuc.csv, value: ['gecerli,toplam', '6,8']}

metadata:
  domain: dogrula
  language: tr
  generated: true
  pipeline: spec-1
