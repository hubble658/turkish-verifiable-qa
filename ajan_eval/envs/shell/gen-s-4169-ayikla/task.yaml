id: gen-s-4169-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  muhasebe/kalemler.tsv ve muhasebe/durum.tsv dosyalarını kalem kodu üzerinden birleştir; durumu ödendi olan kalemlerin tutar toplamını toplam.txt dosyasına yalnızca sayı olarak yaz.

setup: |
  mkdir -p muhasebe
  printf 'K101\tmalzeme\t120\nK102\thizmet\t80\nK103\tmalzeme\t45\nK104\tkira\t300' > muhasebe/kalemler.tsv
  printf 'K101\todendi\nK102\todendi\nK103\todendi\nK104\tbeklemede' > muhasebe/durum.tsv

goal_tr: >
  muhasebe/kalemler.tsv ile muhasebe/durum.tsv dosyalarini kalem kodu
  uzerinden birlestirip durumu odendi olan kalemlerin tutar toplamini
  toplam.txt dosyasina sadece sayi olarak yaz

reference_solution: |
  cut -f1,3 muhasebe/kalemler.tsv > /tmp/k.txt
  cut -f1,2 muhasebe/durum.tsv > /tmp/d.txt
  join -t "$(printf '\t')" /tmp/k.txt /tmp/d.txt > /tmp/j.txt
  grep 'odendi' /tmp/j.txt | cut -f3 | xargs printf '%s\n' | awk '{s+=$1} END {print s}' > toplam.txt

outputs:
  - {path: toplam.txt, kind: file}

checks:
  - {op: file_content_eq, path: toplam.txt, value: '0'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4169
    bundle: cok-dosya-ara
    tools:
    - xargs
    - grep
    konu: muhasebe-kalemleri
    hedef: ayikla
    girdi: tsv
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: yok
    uslup: duz-hedef
    direnc: son-newline-yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
