id: gen-s-7237-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) kayitlar klasöründeki her metin dosyasında "sicaklik" geçen satırları bul.
  2) Bulunan satırları, ait oldukları dosya adının önekini koruyarak birleştir.
  3) Birleştirilen satırları sicak.txt dosyasına yaz.

setup: |
  mkdir -p kayitlar
  cat > kayitlar/istanbul.txt <<'EOF'
  2024-03-01 istanbul sicaklik 12
  2024-03-02 istanbul sicaklik 14
  2024-03-03 istanbul yagmur 9
  EOF
  cat > kayitlar/ankara.txt <<'EOF'
  2024-03-01 ankara sicaklik 5
  2024-03-02 ankara kar 1
  2024-03-03 ankara sicaklik 7
  EOF
  cat > kayitlar/izmir.txt <<'EOF'
  2024-03-01 izmir yagmur 16
  2024-03-02 izmir sicaklik 18
  2024-03-03 izmir sicaklik 20
  EOF

goal_tr: >
  kayitlar klasorundeki her metin dosyasinda "sicaklik" gecen satirlari
  dosya adi onekini koruyarak birlestirip sicak.txt dosyasina yaz

reference_solution: |
  grep -l 'sicaklik' kayitlar/*.txt > /tmp/dosyalar.txt
  xargs -a /tmp/dosyalar.txt grep 'sicaklik' > sicak.txt

outputs:
  - {path: sicak.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: sicak.txt, value: ['kayitlar/ankara.txt:2024-03-01 ankara sicaklik 5', 'kayitlar/ankara.txt:2024-03-03 ankara sicaklik 7', 'kayitlar/istanbul.txt:2024-03-01 istanbul sicaklik 12', 'kayitlar/istanbul.txt:2024-03-02 istanbul sicaklik 14', 'kayitlar/izmir.txt:2024-03-02 izmir sicaklik 18', 'kayitlar/izmir.txt:2024-03-03 izmir sicaklik 20']}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7237
    bundle: cok-dosya-ara
    tools:
    - xargs
    - grep
    konu: hava-durumu-kayitlari
    hedef: ayikla
    girdi: duz-metin
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
