id: gen-s-7200-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  gelen dizinindeki her .log dosyasını satır satır inceleyip yalnızca HATA içerikli satırların tam metnini tekrarsız olarak topla; sonucu, dosya adına göre artan sırada işlenerek islenen/loglar.json dosyasına geçerli bir JSON dizisi olarak yaz ve işlenmiş dosyaları islenen dizinine taşı.

setup: |
  mkdir -p gelen islenen
  cat > gelen/a.log <<'LOG'
  2024-01-01 BILGI sistem basladi
  2024-01-01 HATA disk dolu
  2024-01-02 BILGI kullanici giris yapti
  2024-01-02 HATA baglanti koptu
  2024-01-03 UYARI bellek az
  LOG
  cat > gelen/b.log <<'LOG'
  2024-01-01 HATA disk dolu
  2024-01-04 HATA zaman asimi
  2024-01-04 BILGI yedek alindi
  2024-01-05 UYARI cpu yuksek
  LOG
  : > gelen/bos.log

goal_tr: >
  gelen dizinindeki her .log dosyasini satir satir inceleyip yalnizca HATA
  icerikli satirlarin tam metnini tekrarsiz olarak toplayan, sonucu dosya
  adina gore artan sirada islenen/loglar.json dosyasina gecerli bir JSON
  dizisi olarak yazan ve islenmis dosyalari islenen dizinine tasiyan bir
  cozum uret.

reference_solution: |
  mkdir -p islenen
  for f in $(find gelen -maxdepth 1 -name '*.log' | sort); do
    b=$(basename "$f")
    grep 'HATA' "$f" 2>/dev/null | sed "s|^|$b\t|"
  done | sort -u -k2 | cut -f2- > islenen/_hatalar.txt
  awk 'BEGIN{printf "["} {if(n++)printf ","; printf "\"%s\"", $0} END{printf "]\n"}' islenen/_hatalar.txt > islenen/loglar.json
  rm -f islenen/_hatalar.txt
  for f in $(find gelen -maxdepth 1 -name '*.log' | sort); do mv "$f" islenen/; done

outputs:
  - {path: islenen/loglar.json, kind: json}
  - {path: islenen, kind: dir}

checks:
  - {op: dir_entries_eq, path: islenen, value: [a.log, b.log, bos.log, loglar.json]}
  - {op: json_eq, path: islenen/loglar.json, value: [2024-01-01 HATA disk dolu, 2024-01-02 HATA baglanti koptu, 2024-01-04 HATA zaman asimi]}
  - {op: not_exists, path: gelen/a.log}
  - {op: not_exists, path: gelen/b.log}
  - {op: not_exists, path: gelen/bos.log}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7200
    bundle: dosya-duzen
    tools:
    - mkdir
    - mv
    konu: sunucu-loglari
    hedef: bol
    girdi: duz-metin
    kaynak: iki-dosya-capraz
    cikti: json
    kesif: veriye-bak
    uslup: duz-hedef
    direnc: bos-dosya
    bukulme: tuzak-dosya
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
