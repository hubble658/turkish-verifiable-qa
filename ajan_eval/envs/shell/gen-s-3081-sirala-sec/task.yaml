id: gen-s-3081-sirala-sec
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14
prompt: 'vardiya/personel.ini ve vardiya/gece.ini dosyalarında ortak olan personeli bul; bu kişilerin puanlarını büyükten
  küçüğe sırala. Sıralamanın en başındaki, yani en yüksek puanlı personelin puanını tek bir sayı olarak vardiya/sonuc.txt
  dosyasına yaz.

  '
setup: 'mkdir -p vardiya

  cat > vardiya/personel.ini <<''INI''

  [ayse]

  rol=hemsire

  puan=12

  [mehmet]

  rol=hemsire

  puan=7

  [zeynep]

  rol=doktor

  puan=19

  [ali]

  rol=doktor

  puan=5

  [fatma]

  rol=hemsire

  puan=15

  INI

  cat > vardiya/gece.ini <<''INI''

  [ayse]

  vardiya=gece

  [zeynep]

  vardiya=gece

  [fatma]

  vardiya=gece

  INI

  '
goal_tr: 'vardiya/personel.ini ve vardiya/gece.ini dosyalarinda ortak olan personelin puanlarini buyukten kucuge sirala ve
  en yuksek puanli personelin puanini tek sayi olarak vardiya/sonuc.txt dosyasina yaz.

  '
reference_solution: 'awk -F= ''/^\[/{k=$0; gsub(/[][]/,"",k)} /^puan=/{print k" "$2}'' vardiya/personel.ini | sort > /tmp/p.txt

  awk ''/^\[/{gsub(/[][]/,""); print}'' vardiya/gece.ini | sort -u > /tmp/g.txt

  join /tmp/p.txt /tmp/g.txt | sort -k2,2nr | head -n1 | cut -d'' '' -f2 > vardiya/sonuc.txt

  '
outputs: []
checks:
- op: file_content_eq
  path: vardiya/sonuc.txt
  value: '19'
