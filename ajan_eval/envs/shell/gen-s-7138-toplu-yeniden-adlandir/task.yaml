id: gen-s-7138-toplu-yeniden-adlandir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depo klasörü altındaki tüm csv dosyalarını tarayıp içlerindeki siparis_id değerlerini tek bir listede topla ve bu listeyi depo/siparis_id_listesi.txt dosyasına her satırda bir id yer alacak şekilde yaz; mevcut csv dosyalarının içeriği değiştirilmemeli.

setup: |
  mkdir -p depo/arsiv
  cat > depo/siparisler.csv <<'CSV'
  siparis_id,musteri,yemek
  101,Ayse,kebap
  102,Mehmet,pizza
  103,Zeynep,salat
  104,Ali,kebap
  105,Fatma,pizza
  CSV
  cat > depo/arsiv/eski_siparisler.csv <<'CSV'
  siparis_id,musteri,yemek
  201,Can,cigkofte
  202,Elif,pizza
  203,Burak,salat
  CSV

goal_tr: >
  depo altindaki tum csv dosyalarini bulup her birindeki siparis_id
  degerlerini tek bir listeye topla ve depo/siparis_id_listesi.txt dosyasina
  her satirda bir id olacak sekilde yaz

reference_solution: |
  find depo -name '*.csv' > depo/csv_dosyalari.txt
  mkdir -p depo/gecici
  while read -r f; do
    tail -n +2 "$f" | cut -d, -f1 >> depo/gecici/idler.txt
  done < depo/csv_dosyalari.txt
  sort -n depo/gecici/idler.txt > depo/siparis_id_listesi.txt
  mv depo/gecici/idler.txt depo/gecici/idler_yedek.txt

outputs:
  - {path: depo/siparis_id_listesi.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: depo/siparis_id_listesi.txt, value: ['101', '102', '103', '104', '105', '201', '202', '203']}

metadata:
  domain: toplu-yeniden-adlandir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7138
    bundle: dosya-duzen
    tools:
    - mkdir
    - mv
    konu: restoran-siparisleri
    hedef: toplu-yeniden-adlandir
    girdi: csv
    kaynak: iki-dosya-capraz
    cikti: satir-listesi
    kesif: dosyayi-bul
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
