id: gen-s-3082-dogrula
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) /workspace dizinindeki kargolar.csv dosyasını oku; durum sütununda "yolda" veya "teslim" değeri olmayan kayıtları belirle.

  2) Bu kayıtların takip_no değerlerini, her satırda yalnızca bir takip numarası olacak şekilde /workspace dizinindeki gecersiz.txt dosyasına yaz.

setup: |
  cat > kargolar.csv <<'CSV'
  takip_no,gonderen,alici,durum,sehir
  TR1001,Ali,Veli,yolda,Istanbul
  TR1002,Ayse,Can,teslim,Ankara
  TR1003,Deniz,Ece,yolda,Izmir
  TR1004,Fatma,Gizem,kayip,Bursa
  TR1005,Emre,Su,teslim,Antalya
  TR1006,Burak,Eda,yolda,Istanbul
  CSV

goal_tr: >
  kargolar.csv dosyasindaki durum sutunu yolda veya teslim olmayan
  kayitlarin takip_no degerlerini gecersiz.txt dosyasina her satirda bir
  takip numarasi olacak sekilde yaz

reference_solution: |
  python3 - <<'PY'
  import csv
  rows = list(csv.DictReader(open('kargolar.csv', newline='')))
  bad = [r['takip_no'] for r in rows if r['durum'] not in ('yolda', 'teslim')]
  with open('gecersiz.txt', 'w') as f:
      f.write('\n'.join(bad) + ('\n' if bad else ''))
  PY

outputs:
  - {path: gecersiz.txt, kind: lines}

checks:
  - {op: file_content_eq, path: gecersiz.txt, value: TR1004}

metadata:
  domain: dogrula
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3082
    bundle: python-veri
    tools:
    - python3
    konu: kargo-takibi
    hedef: dogrula
    girdi: csv
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
