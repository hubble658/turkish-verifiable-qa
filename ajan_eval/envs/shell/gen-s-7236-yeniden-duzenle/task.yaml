id: gen-s-7236-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) veri klasöründeki tek csv dosyasını bul.
  2) Bu csv dosyasının ilk satırının başlık olduğunu varsay ve başlık satırını çıktıya dahil etme.
  3) Kalan her satırdaki tarih, şehir ve sıcaklık alanlarını bir JSON nesnesi olarak yaz.
  4) Tüm bu nesneleri içeren bir JSON dizisi üret.
  5) Bu diziyi veri/ozet.json dosyasına yaz.

setup: |
  mkdir -p veri
  cat > veri/kayitlar.csv <<'CSV'
  tarih,sehir,sicaklik
  2024-01-01,ankara,3
  2024-01-01,izmir,12
  2024-01-02,ankara,5
  2024-01-02,izmir,14
  2024-01-03,ankara,1
  2024-01-03,izmir,11
  CSV

goal_tr: >
  veri klasoru altindaki tek csv dosyasini bulup her satiri tarih, sehir ve
  sicaklik alanlarini iceren bir JSON nesnesi olarak yazan bir JSON dizisi
  ureten veri/ozet.json dosyasini olustur; ilk satir basliktir ve ciktiya
  girmez

reference_solution: |
  CSV=$(find veri -name '*.csv')
  SATIR=$(tail -n +2 "$CSV" | wc -l)
  printf '[\n' > veri/ozet.json
  seq 1 "$SATIR" | while read -r n; do
    tail -n +2 "$CSV" | sed -n "${n}p" | awk -F, '{printf "  {\"tarih\": \"%s\", \"sehir\": \"%s\", \"sicaklik\": %s}", $1, $2, $3}'
    if [ "$n" -lt "$SATIR" ]; then printf ','; fi
    printf '\n'
  done >> veri/ozet.json
  printf ']\n' >> veri/ozet.json

outputs:
  - {path: veri/ozet.json, kind: json}

checks:
  - {op: json_eq, path: veri/ozet.json, value: [{tarih: '2024-01-01', sehir: ankara, sicaklik: 3}, {tarih: '2024-01-01', sehir: izmir, sicaklik: 12}, {tarih: '2024-01-02', sehir: ankara, sicaklik: 5}, {tarih: '2024-01-02', sehir: izmir, sicaklik: 14}, {tarih: '2024-01-03', sehir: ankara, sicaklik: 1}, {tarih: '2024-01-03', sehir: izmir, sicaklik: 11}]}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7236
    bundle: uret
    tools:
