id: gen-s-3140-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) siparisler.tsv ve fiyatlar.tsv dosyalarını URUN sütunu üzerinden birleştir.
  2) Her MASA için toplam tutarı hesapla.
  3) Masaları tutara göre azalan sırada, eşitlik durumunda masa koduna göre artan sırada sırala.
  4) Masa ve tutar çiftlerinden oluşan JSON dizisini masa_tutarlari.json dosyasına yaz.

setup: |
  cat > siparisler.tsv <<'TSV'
  MASA	URUN	ADET
  M1	corba	2
  M2	pizza	1
  M1	corba	1
  M3	salat	3
  M2	pizza	2
  TSV

  cat > fiyatlar.tsv <<'TSV'
  URUN	FIYAT
  corba	40
  pizza	90
  salat	55
  TSV

goal_tr: >
  siparisler.tsv ile fiyatlar.tsv dosyalarini URUN sutunu uzerinden
  birlestirip her MASA icin toplam tutari hesapla ve masalari tutara gore
  azalan sirada, esitlikte masa koduna gore artan sirada olacak sekilde masa
  ve tutar ciftlerinden olusan bir JSON dizisi olarak masa_tutarlari.json
  dosyasina yaz

reference_solution: |
  tail -n +2 siparisler.tsv | cut -f1,2,3 > gecici_siparisler.tsv
  tail -n +2 fiyatlar.tsv > gecici_fiyatlar.tsv
  awk -F'\t' 'NR==FNR{fiyat[$1]=$2; next} {tutar[$1]+=$3*fiyat[$2]} END{for(m in tutar) print m"\t"tutar[m]}' gecici_fiyatlar.tsv gecici_siparisler.tsv > gecici_toplam.tsv
  sort -t$'\t' -k2,2nr -k1,1 gecici_toplam.tsv > gecici_sirali.tsv
  rev gecici_sirali.tsv | rev > gecici_sirali2.tsv
  awk -F'\t' 'BEGIN{printf "["} {printf "%s{\"masa\": \"%s\", \"tutar\": %d}", (NR>1?", ":""), $1, $2} END{print "]"}' gecici_sirali2.tsv > masa_tutarlari.json
  rm -f gecici_siparisler.tsv gecici_fiyatlar.tsv gecici_toplam.tsv gecici_sirali.tsv gecici_sirali2.tsv

outputs:
  - {path: masa_tutarlari.json, kind: json}

checks:
  - {op: json_eq, path: masa_tutarlari.json, value: [{masa: M2, tutar: 270}, {masa: M3, tutar: 165}, {masa: M1, tutar: 120}]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3140
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: restoran-siparisleri
    hedef: ayikla
    girdi: tsv
    kaynak: iki-dosya-capraz
    cikti: json
    kesif: dolayli-hedef
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
