id: gen-s-7014-donustur
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  /workspace dizinindeki siparisler.ini dosyasında yer alan adet değerlerinin toplamını hesapla ve bu toplamı yalnızca sayı olarak toplam.txt dosyasına yaz. Dosyada başka hiçbir metin, etiket veya açıklama bulunmasın; sadece toplam sayı yer alsın.

setup: |
  cat > siparisler.ini <<'INI'
  [masa1]
  urun=corba
  adet=2
  [masa2]
  urun=kebap
  adet=1
  [masa3]
  urun=corba
  adet=3
  INI
  cat > siparisler.ini.bak <<'BAK'
  [masa9]
  urun=corba
  adet=99
  BAK

goal_tr: >
  siparisler.ini dosyasindaki adet degerlerinin toplamini toplam.txt
  dosyasina sadece sayi olarak yaz

reference_solution: |
  grep '^adet=' siparisler.ini | cut -d= -f2 | rev | cut -c1- | rev | paste -sd+ | xargs -I{} echo "{}" | xargs -I{} sh -c 'echo $(( {} ))' > toplam.txt

outputs:
  - {path: toplam.txt, kind: file}

checks:
  - {op: file_content_eq, path: toplam.txt, value: '6'}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7014
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: restoran-siparisleri
    hedef: donustur
    girdi: ini
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: tuzak-dosya
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
