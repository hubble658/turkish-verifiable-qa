id: gen-s-7226-sirala-sec
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depo dizini ve altındaki raf1, raf2, raf3 klasörlerinde yer alan kayit.txt dosyalarındaki tüm satırları birleştir; aynı olan satırlar tekrar etmeyecek şekilde yalnızca bir kez yer alsın ve satırlar alfabetik olarak sıralansın. Elde edilen benzersiz satırları, her satırda bir tane olacak biçimde sonuc.txt dosyasına yaz.

setup: |
  mkdir -p depo/raf1 depo/raf2 depo/raf3
  cat > depo/raf1/kayit.txt <<'TXT'
  kalem
  defter
  silgi
  TXT
  cat > depo/raf2/kayit.txt <<'TXT'
  defter
  cetvel
  kalem
  TXT
  cat > depo/raf3/kayit.txt <<'TXT'
  silgi
  pergel
  defter
  TXT

goal_tr: >
  depo dizini agacindaki tum kayit.txt dosyalarindaki satirlari birlestirip
  benzersiz satirlari alfabetik olarak sirala ve sonuc.txt dosyasina her
  satiri bir kez olacak sekilde yaz

reference_solution: |
  find depo -name kayit.txt -type f | sort | xargs cat | sort | uniq > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: sonuc.txt, value: [cetvel, defter, kalem, pergel, silgi]}

metadata:
  domain: sirala-sec
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7226
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: envanter
    hedef: sirala-sec
    girdi: log-satiri
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
