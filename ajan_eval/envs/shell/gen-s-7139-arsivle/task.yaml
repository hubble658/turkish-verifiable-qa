id: gen-s-7139-arsivle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  veri klasöründeki sicaklik.txt ve nem.txt dosyalarındaki verileri sensör kimliğine göre birleştir; sıcaklığı 20.0 üzerinde olan sensörlerin "kimlik sıcaklık nem" satırlarını yedek/sicak-nemli.txt dosyasına yaz ve bu dosyayı yedek/sicak-nemli.tar.gz arşivine koy.

setup: |
  mkdir -p veri yedek
  cat > veri/sicaklik.txt <<'TXT'
  sensorA 21.5
  sensorB 19.0
  sensorC 23.1
  sensorD 18.4
  TXT
  cat > veri/nem.txt <<'TXT'
  sensorA 45
  sensorB 52
  sensorC 38
  sensorD 61
  TXT

goal_tr: >
  veri klasorundeki sicaklik.txt ve nem.txt dosyalarini sensor kimligine
  gore birlestirip, sicakligi 20.0 uzerinde olan sensorlerin "kimlik
  sicaklik nem" satirlarini yedek/sicak-nemli.txt dosyasina yaz ve bu
  dosyayi yedek/sicak-nemli.tar.gz arsivine koy

reference_solution: |
  join <(sort veri/sicaklik.txt) <(sort veri/nem.txt) | awk '$2+0 > 20.0 {print $1, $2, $3}' > yedek/sicak-nemli.txt
  tar -czf yedek/sicak-nemli.tar.gz -C yedek sicak-nemli.txt
  find yedek -name 'sicak-nemli.*' | sort

outputs:
  - {path: yedek/sicak-nemli.txt, kind: lines}
  - {path: yedek/sicak-nemli.tar.gz, kind: file}

checks:
  - {op: run_stdout_eq, cmd: tar -tzf yedek/sicak-nemli.tar.gz | sort, value: sicak-nemli.txt}
  - {op: file_lines_eq, path: yedek/sicak-nemli.txt, value: [sensorA 21.5 45, sensorC 23.1 38]}

metadata:
  domain: arsivle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7139
    bundle: secerek-arsivle
    tools:
