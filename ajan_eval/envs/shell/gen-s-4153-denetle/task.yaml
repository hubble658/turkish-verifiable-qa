id: gen-s-4153-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Bugün vardiya değişiminde kasadaki sipariş kayıtlarıyla ilgili bir uyuşmazlık çıktı; depodaki liste ile yedekteki liste bir türlü tutmuyor. Ben de iki listeyi yan yana koyup aradaki farkı net görmek istiyorum. depo ve yedek klasörlerindeki siparisler.txt dosyalarını karşılaştır, depo altındaki dosyada olup yedekte bulunmayan satırların sayısını bul ve bu sayıyı depo klasörüne fark.txt adıyla yaz.

setup: |
  mkdir -p depo yedek
  cat > depo/siparisler.txt <<'TXT'
  masa:4 urun:corba adet:2
  masa:4 urun:salata adet:1
  masa:7 urun:corba adet:3
  masa:7 urun:pizza adet:2
  masa:9 urun:salata adet:4
  masa:9 urun:pizza adet:1
  TXT
  cat > yedek/siparisler.txt <<'TXT'
  masa:4 urun:corba adet:2
  masa:4 urun:salata adet:1
  masa:7 urun:corba adet:3
  masa:7 urun:pizza adet:2
  masa:9 urun:salata adet:4
  TXT

goal_tr: >
  depo ve yedek klasorlerindeki siparisler.txt dosyalarini karsilastir; depo
  altindaki dosyada yedekte bulunmayan satir sayisini bul ve bu sayiyi
  fark.txt adiyla depo klasorune yaz

reference_solution: |
  find . -name 'siparisler.txt' -type f | sort > /tmp/dosyalar.txt
  comm -23 <(sort depo/siparisler.txt) <(sort yedek/siparisler.txt) > /tmp/eksik.txt
  wc -l < /tmp/eksik.txt > depo/fark.txt

outputs:
  - {path: depo/fark.txt, kind: file}

checks:
  - {op: file_content_eq, path: depo/fark.txt, value: '1'}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4153
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: restoran-siparisleri
    hedef: denetle
    girdi: duz-metin
    kaynak: iki-dosya-capraz
    cikti: yeniden-adlandirilmis
    kesif: dosyayi-bul
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
