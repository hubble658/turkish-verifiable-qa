id: gen-s-3165-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Bugün atölyedeki iki farklı ölçüm cihazının kayıtlarını karşılaştırmamız gerekti; biri diğerinden biraz farklı değerler üretiyor ve aradaki sapmayı görmek istiyoruz. Elimizde veri klasöründe sensor_a.csv ve sensor_b.csv dosyaları var, ikisi de id ve deger sütunlarını içeriyor. Bu iki dosyadaki aynı id'ye sahip satırları id bazında eşleştirip, her id için sensor_b'deki değerden sensor_a'daki değeri çıkararak farkı hesapla. Sonucu, her id için id ve fark alanlarını içeren geçerli bir JSON nesnesi olarak cikti.json dosyasına yaz.

setup: |
  mkdir -p veri
  cat > veri/sensor_a.csv <<'CSV'
  id,deger
  S1,12
  S2,7
  S3,19
  S4,4
  CSV
  cat > veri/sensor_b.csv <<'CSV'
  id,deger
  S1,15
  S2,7
  S3,21
  S4,9
  CSV

goal_tr: >
  veri/sensor_a.csv ve veri/sensor_b.csv dosyalarindaki ayni id'ye sahip
  satirlari id bazinda eslestirip her id icin iki degerin farkini (sensor_b
  eksi sensor_a) hesapla ve sonucu id ile fark alanlarini iceren gecerli bir
  JSON nesnesi olarak cikti.json dosyasina yaz.

reference_solution: |
  cut -d, -f1,2 veri/sensor_a.csv | tail -n +2 | sort > /tmp/a.txt
  cut -d, -f1,2 veri/sensor_b.csv | tail -n +2 | sort > /tmp/b.txt
  join -t, -1 1 -2 1 /tmp/a.txt /tmp/b.txt > /tmp/c.txt
  awk -F, 'BEGIN{printf "{"} {printf "%s\"%s\": %d", (NR>1?", ":""), $1, $3-$2} END{printf "}\n"}' /tmp/c.txt | tee cikti.json

outputs:
  - {path: cikti.json, kind: json}

checks:
  - {op: json_eq, path: cikti.json, value: {S1: 3, S2: 0, S3: 2, S4: 5}}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3165
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: sensor-olcumleri
    hedef: donustur
    girdi: csv
    kaynak: iki-dosya-capraz
    cikti: json
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
