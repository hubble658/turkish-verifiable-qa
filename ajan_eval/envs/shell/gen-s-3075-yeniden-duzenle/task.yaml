id: gen-s-3075-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) girdi/envanter.txt ve girdi/bolumler.txt dosyalarını okuyup her ürünün adını, bölüm kodunu ve adedini belirle.
  2) Bölüm kodlarını girdi/bolumler.txt içindeki depo adlarıyla eşleştir.
  3) Her ürün için, depo adı, alt çizgi ve 1'den ürünün adedine kadar olan sıra numarasından oluşan adlarla cikti dizini altında alt dizinler oluştur (örnek: cikti/Depo-A_1, cikti/Depo-A_12, cikti/Depo-B_1, cikti/Depo-B_7, cikti/Depo-B_9, cikti/Depo-C_25).
  4) Oluşturduğun her alt dizinin içine, adı ürünün adı olan ve içinde yalnızca ürünün adı yazan tek bir dosya koy (örnek: cikti/Depo-A_1/Kalem.txt içinde yalnızca Kalem; cikti/Depo-A_12/Kalem.txt içinde yalnızca Kalem; cikti/Depo-B_1/Defter.txt içinde yalnızca Defter; cikti/Depo-B_7/Defter.txt içinde yalnızca Defter; cikti/Depo-B_9/Makas.txt içinde yalnızca Makas; cikti/Depo-C_25/Cetvel.txt içinde yalnızca Cetvel).

setup: |
  mkdir -p girdi
  printf 'ID  ADI       BOLUM  ADET\n' > girdi/envanter.txt
  printf '001 Kalem     A      12\n' >> girdi/envanter.txt
  printf '002 Defter    B      07\n' >> girdi/envanter.txt
  printf '003 Silgi     A      03\n' >> girdi/envanter.txt
  printf '004 Cetvel    C      25\n' >> girdi/envanter.txt
  printf '005 Makas     B      09\n' >> girdi/envanter.txt
  printf 'A  Depo-A\n' > girdi/bolumler.txt
  printf 'B  Depo-B\n' >> girdi/bolumler.txt
  printf 'C  Depo-C\n' >> girdi/bolumler.txt

goal_tr: >
  girdi/envanter.txt ve girdi/bolumler.txt dosyalarini caprazlayarak her
  urun icin adet kadar alt dizin olustur; her dizin, urunun bolum kodunun
  karsilik geldigi depo adi ile alt cizgi ve 1'den adede kadar olan sira
  numarasindan olussun ve icinde yalnizca urunun adi yazan tek bir dosya
  bulunsun (ornek: cikti/Depo-A_1/Kalem.txt icinde yalnizca Kalem).

reference_solution: |
  mkdir -p cikti
  awk 'NR>1 {print $1, $2, $3, $4}' girdi/envanter.txt > /tmp/urunler.txt
  awk '{print $1, $2}' girdi/bolumler.txt > /tmp/bolumler.txt
  join -1 3 -2 1 <(sort -k3,3 /tmp/urunler.txt) <(sort -k1,1 /tmp/bolumler.txt) | while read -r bolum id adi adet depo; do
    seq 1 "$adet" | while read -r n; do
      mkdir -p "cikti/${depo}_$n"
      printf '%s\n' "$adi" > "cikti/${depo}_$n/$adi.txt"
    done
  done

outputs:
  - {path: cikti, kind: dir}
  - {path: cikti/Depo-A_1/Kalem.txt, kind: file}
  - {path: cikti/Depo-A_12/Kalem.txt, kind: file}
  - {path: cikti/Depo-B_1/Defter.txt, kind: file}
  - {path: cikti/Depo-B_7/Defter.txt, kind: file}
  - {path: cikti/Depo-B_9/Makas.txt, kind: file}
  - {path: cikti/Depo-C_25/Cetvel.txt, kind: file}

checks:
  - {op: dir_entries_eq, path: cikti, value: [Depo-A_1, Depo-A_10, Depo-A_11, Depo-A_12, Depo-A_2, Depo-A_3, Depo-A_4, Depo-A_5, Depo-A_6, Depo-A_7, Depo-A_8, Depo-A_9, Depo-B_1, Depo-B_2, Depo-B_3, Depo-B_4, Depo-B_5, Depo-B_6, Depo-B_7, Depo-B_8, Depo-B_9, Depo-C_1, Depo-C_10, Depo-C_11, Depo-C_12, Depo-C_13, Depo-C_14, Depo-C_15, Depo-C_16, Depo-C_17, Depo-C_18, Depo-C_19, Depo-C_2, Depo-C_20, Depo-C_21, Depo-C_22, Depo-C_23, Depo-C_24, Depo-C_25, Depo-C_3, Depo-C_4, Depo-C_5, Depo-C_6, Depo-C_7, Depo-C_8, Depo-C_9]}
  - {op: file_content_eq, path: cikti/Depo-A_1/Kalem.txt, value: Kalem}
  - {op: file_content_eq, path: cikti/Depo-A_12/Kalem.txt, value: Kalem}
  - {op: file_content_eq, path: cikti/Depo-B_1/Defter.txt, value: Defter}
  - {op: file_content_eq, path: cikti/Depo-B_7/Defter.txt, value: Defter}
  - {op: file_content_eq, path: cikti/Depo-B_9/Makas.txt, value: Makas}
  - {op: file_content_eq, path: cikti/Depo-C_25/Cetvel.txt, value: Cetvel}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3075
    bundle: uret
    tools:
    - printf
    - seq
    konu: envanter
    hedef: yeniden-duzenle
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: dizin-yapisi
    kesif: veriye-bak
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
