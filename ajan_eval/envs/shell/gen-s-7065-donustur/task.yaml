id: gen-s-7065-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiya dizinindeki tüm .tsv dosyalarındaki veri satırlarını, yani başlık satırı hariç geri kalan satırları oku. Her bir satırı "ad|tarih|vardiya" biçimine dönüştür ve tüm bu dosyalardan gelen dönüştürülmüş satırları dosya adına göre sıralı olacak şekilde satir-listesi.txt dosyasına yaz.

setup: |
  mkdir -p vardiya
  cat > vardiya/ocak.tsv <<'TSV'
  ad	tarih	vardiya
  Ali	2024-01-01	gunduz
  Ayse	2024-01-01	gece
  Can	2024-01-02	gunduz
  Deniz	2024-01-02	gece
  TSV
  cat > vardiya/subat.tsv <<'TSV'
  ad	tarih	vardiya
  Ali	2024-02-01	gece
  Ayse	2024-02-01	gunduz
  Can	2024-02-02	gece
  Deniz	2024-02-02	gunduz
  TSV

goal_tr: >
  vardiya dizinindeki tum .tsv dosyalarindaki veri satirlarini (baslik
  haric) okuyup her satiri "ad|tarih|vardiya" bicimine donusturerek tum
  dosyalardan gelen satirlari dosya adina gore sirali sekilde
  satir-listesi.txt dosyasina yaz

reference_solution: |
  python3 -c "
  import glob
  out = []
  for f in sorted(glob.glob('vardiya/*.tsv')):
      with open(f) as fh:
          for line in fh.readlines()[1:]:
              out.append('|'.join(line.rstrip('\n').split('\t')))
  print('\n'.join(out))
  " > satir-listesi.txt

outputs:
  - {path: satir-listesi.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: satir-listesi.txt, value: [Ali|2024-01-01|gunduz, Ayse|2024-01-01|gece, Can|2024-01-02|gunduz, Deniz|2024-01-02|gece, Ali|2024-02-01|gece, Ayse|2024-02-01|gunduz, Can|2024-02-02|gece, Deniz|2024-02-02|gunduz]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7065
    bundle: python-veri
    tools:
    - python3
    konu: personel-vardiyalari
    hedef: donustur
    girdi: tsv
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: veriye-bak
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
