id: gen-s-4162-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  loglar dizin ağacındaki tüm .tsv dosyalarını işle. Her .tsv dosyasındaki tarih ve seviye alanlarını iki nokta ile birleştirip "tarih:seviye" biçimine dönüştür. Her dosya için, o dosyanın yolunu belirten bir başlık satırı ve ardından dönüştürülmüş satırları içeren bir blok oluştur. Tüm dosyaları yol adına göre artan sırada işle ve sonucu donusum.txt dosyasına yaz.

  Şu şartlar sağlanmalı:
  - donusum.txt dosyası oluşturulmalı.
  - loglar dizin ağacındaki tüm .tsv dosyaları işlenmeli.
  - Her .tsv dosyasındaki tarih ve seviye alanları iki nokta ile birleştirilerek "tarih:seviye" biçimine dönüştürülmeli.
  - Her dosya için bir satır bloğu oluşturulmalı ve bu bloğun başında dosya yolunu belirten bir başlık satırı bulunmalı.
  - Dosyalar yol adına göre artan sırada işlenmeli.
  - Tüm çıktı donusum.txt dosyasına yazılmalı.

setup: |
  mkdir -p loglar/uygulama loglar/sistem
  cat > loglar/uygulama/erisim.tsv <<'TSV'
  tarih	seviye	mesaj
  2024-05-01	INFO	kullanici giris yapti
  2024-05-01	WARN	oturum suresi doldu
  2024-05-02	ERROR	disk dolu
  TSV
  cat > loglar/sistem/cron.tsv <<'TSV'
  tarih	seviye	mesaj
  2024-05-01	INFO	yedekleme basladi
  2024-05-02	ERROR	yedekleme basarisiz
  TSV
  cat > loglar/sistem/ag.tsv <<'TSV'
  tarih	seviye	mesaj
  2024-05-01	WARN	gecikme yuksek
  2024-05-02	INFO	baglanti kuruldu
  TSV

goal_tr: >
  loglar dizin agacindaki tum .tsv dosyalarini tarih ve seviye alanlarini
  iki nokta ile birlestirip "tarih:seviye" bicimine donusturerek, dosya
  basina bir satir blogu halinde ve dosya yolu belirten bir baslik satiriyla
  birlikte, tum dosyalar yol adina gore artan sirada olacak sekilde
  donusum.txt dosyasina yaz.

reference_solution: |
  find loglar -type f -name '*.tsv' | sort | while read -r f; do
    printf '%s\n' "$f"
    sed '1d' "$f" | cut -f1,2 | tr '\t' ':'
  done > donusum.txt

outputs:
  - {path: donusum.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: donusum.txt, value: [loglar/sistem/ag.tsv, '2024-05-01:WARN', '2024-05-02:INFO', loglar/sistem/cron.tsv, '2024-05-01:INFO', '2024-05-02:ERROR', loglar/uygulama/erisim.tsv, '2024-05-01:INFO', '2024-05-01:WARN', '2024-05-02:ERROR']}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-4162
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: sunucu-loglari
    hedef: donustur
    girdi: tsv
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: yok
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
