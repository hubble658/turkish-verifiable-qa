id: gen-s-3194-yeniden-duzenle
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  siparisler.txt dosyasındaki sabit genişlikli kayıtları, her satırda sipariş numarası, ürün adı ve toplam tutar boşlukla ayrılmış biçimde olacak şekilde düzenle; toplam tutar adet ile birim fiyatın çarpımı olsun. Sonucu yine siparisler.txt dosyasına yaz.

setup: |
  seq 1 6 | while read i; do
    case $i in
      1) printf '%s\n' '0001  Adana Kebap     2  120' ;;
      2) printf '%s\n' '0002  Mercimek Corbasi 1   45' ;;
      3) printf '%s\n' '0003  Kunefe          3   80' ;;
      4) printf '%s\n' '0004  Ayran           4   20' ;;
      5) printf '%s\n' '0005  Adana Kebap     1  120' ;;
      6) printf '%s\n' '0006  Kunefe          2   80' ;;
    esac
  done > siparisler.txt

goal_tr: >
  siparisler.txt dosyasindaki sabit genislikli kayitlari, her satirda
  siparis numarasi, urun adi ve toplam tutar (adet ile birim fiyatin
  carpimi) boslukla ayrilmis bicimde olacak sekilde siparisler.txt yerine
  yaz

reference_solution: |
  seq 1 1 | while read _; do
    awk '{printf "%s %s %d\n", $1, substr($0,7,15), $3*$4}' siparisler.txt > gecici.txt
  done && mv gecici.txt siparisler.txt

outputs:
  - {path: siparisler.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: siparisler.txt, value: [0001 Adana Kebap     0, 0002 Mercimek Corbas 0, 0003 Kunefe          240, 0004 Ayran           80, 0005 Adana Kebap     0, 0006 Kunefe          160]}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-3194
    bundle: uret
    tools:
    - printf
    - seq
    konu: restoran-siparisleri
    hedef: yeniden-duzenle
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
