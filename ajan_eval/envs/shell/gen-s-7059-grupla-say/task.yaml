id: gen-s-7059-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10
prompt: 'veri/istasyonlar.txt ve veri/olcumler.txt dosyalarını istasyon kodu üzerinden birleştirip her istasyon için kod,
  sehir, olcum_sayisi ve toplam_sicaklik satırlarını şehir adına göre artan sırada sonuc.txt dosyasına yaz; veri/olcumler.txt.yedek
  dosyasını yok say.


  Alanlar sekmeyle ayrılsın.

  '
setup: 'mkdir -p veri

  cat > veri/istasyonlar.txt <<''EOF''

  IST01 Ankara

  IST02 Izmir

  IST03 Bursa

  IST04 Antalya

  EOF

  cat > veri/olcumler.txt <<''EOF''

  IST01 20240115 12

  IST02 20240115 18

  IST01 20240116 10

  IST03 20240115 7

  IST02 20240116 19

  IST04 20240115 21

  IST01 20240117 9

  IST03 20240116 6

  IST02 20240117 20

  IST04 20240116 22

  EOF

  cat > veri/olcumler.txt.yedek <<''EOF''

  IST01 20240115 99

  IST02 20240115 99

  IST03 20240115 99

  EOF

  '
goal_tr: 'veri/istasyonlar.txt ve veri/olcumler.txt dosyalarini istasyon kodu uzerinden birlestirip her istasyon icin "kod<TAB>sehir<TAB>olcum_sayisi<TAB>toplam_sicaklik"
  satirini sehir adina gore artan sirada sonuc.txt dosyasina yaz; veri/olcumler.txt.yedek dosyasini yok say.

  '
reference_solution: "awk 'NR==FNR{sehir[$1]=$2; next} $1 in sehir{sayi[$1]++; top[$1]+=$3} END{for(k in sehir) printf \"%s\\\
  t%s\\t%d\\t%d\\n\", k, sehir[k], sayi[k]+0, top[k]+0}' veri/istasyonlar.txt veri/olcumler.txt | sort -t'\t' -k2,2 > sonuc.txt\n"
outputs:
- path: sonuc.txt
  kind: lines
checks:
- op: file_lines_eq
  path: sonuc.txt
  value:
  - "IST01\tAnkara\t3\t31"
  - "IST04\tAntalya\t2\t43"
  - "IST03\tBursa\t2\t13"
  - "IST02\tIzmir\t3\t57"
