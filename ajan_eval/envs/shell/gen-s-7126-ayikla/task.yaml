id: gen-s-7126-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiya dizin ağacındaki yalnızca .ini uzantılı dosyaları bulup her birinden ad ve rol değerlerini çıkar ve ad ile rol sütunlarını sekmeyle birleştirip satır listesi olarak personel.tsv dosyasına yaz.

setup: |
  mkdir -p vardiya/ocak vardiya/subat vardiya/arsiv
  cat > vardiya/ocak/pazartesi.ini <<'INI'
  [vardiya]
  ad=ayse
  rol=hemsire
  saat=08:00
  INI
  cat > vardiya/ocak/sali.ini <<'INI'
  [vardiya]
  ad=mehmet
  rol=doktor
  saat=09:00
  INI
  cat > vardiya/subat/pazartesi.ini <<'INI'
  [vardiya]
  ad=zeynep
  rol=hemsire
  saat=08:00
  INI
  cat > vardiya/subat/carsamba.ini <<'INI'
  [vardiya]
  ad=ali
  rol=teknisyen
  saat=10:00
  INI
  cat > vardiya/arsiv/eski.ini <<'INI'
  [vardiya]
  ad=can
  rol=doktor
  saat=11:00
  INI
  cat > vardiya/arsiv/notlar.txt <<'TXT'
  [vardiya]
  ad=sahte
  rol=sahte
  saat=00:00
  TXT

goal_tr: >
  vardiya dizin agacindaki yalnizca .ini uzantili dosyalari bulup her
  birinden ad ve rol degerlerini cikar ve ad ile rol sutunlarini sekmeyle
  birlestirip satir listesi olarak personel.tsv dosyasina yaz

reference_solution: |
  find vardiya -type f -name '*.ini' | sort > /tmp/ini.listesi
  cut -d= -f2 /tmp/ini.listesi | paste - - > personel.tsv

outputs:
  - {path: personel.tsv, kind: lines}
  - {path: vardiya, kind: dir}

checks:
  - {op: file_lines_eq, path: personel.tsv, value: ["vardiya/arsiv/eski.ini\tvardiya/ocak/pazartesi.ini", "vardiya/ocak/sali.ini\tvardiya/subat/carsamba.ini", vardiya/subat/pazartesi.ini]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7126
    bundle: sutun
    tools:
    - cut
    - paste
    konu: personel-vardiyalari
    hedef: ayikla
    girdi: ini
    kaynak: dizin-agaci
    cikti: satir-listesi
    kesif: dosyayi-bul
    uslup: duz-hedef
    direnc: yok
    bukulme: tuzak-dosya
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
