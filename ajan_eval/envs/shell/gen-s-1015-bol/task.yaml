id: gen-s-1015-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  vardiya klasöründeki .tsv dosyalarında personel vardiyaları duruyor ve bunları tek listede görmek istiyorum. Her satır grup<TAB>ad<TAB>saat biçiminde olsun; grup, satırın geldiği dosyanın uzantısız adı, ad ve saat ise satırın kendi sütunları. Dosyanın sonunda yeni satır karakteri bulunmasın. Satırlar dosya adına göre artan sırada dizilip vardiya_listesi.txt dosyasına yazılsın.

setup: |
  mkdir -p vardiya
  printf 'Ali\t09:00-17:00\nVeli\t10:00-18:00\nAyse\t08:00-16:00' | tee vardiya/gunduz.tsv > /dev/null
  printf 'Can\t12:00-20:00\nDeniz\t13:00-21:00\nEce\t11:00-19:00' | tee vardiya/aksam.tsv > /dev/null
  printf 'Fatma\t14:00-22:00\nGokhan\t15:00-23:00' | tee vardiya/gece.tsv > /dev/null

goal_tr: >
  vardiya klasorundeki her .tsv dosyasindaki satirlari, dosya adi
  (uzantisiz) ve o satirin ikinci sutunu "grup<TAB>ad<TAB>saat" biciminde
  birlestirip tum satirlari dosya adina gore artan sirada
  vardiya_listesi.txt dosyasina yaz; dosya sonunda yeni satir olmasin

reference_solution: |
  for f in vardiya/*.tsv; do
    grup=$(basename "$f" .tsv)
    cut -f1,2 "$f" | sed "s/^/$grup\t/"
  done | sort | tee vardiya_listesi.txt > /dev/null
  printf '%s' "$(cat vardiya_listesi.txt)" > vardiya_listesi.txt

outputs:
  - {path: vardiya_listesi.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: vardiya_listesi.txt, value: ["aksam\tCan\t12:00-20:00", "aksam\tDeniz\t13:00-21:00", "aksam\tEce\t11:00-19:00", "gece\tFatma\t14:00-22:00", "gece\tGokhan\t15:00-23:00", "gunduz\tAli\t09:00-17:00", "gunduz\tAyse\t08:00-16:00", "gunduz\tVeli\t10:00-18:00"]}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-1015
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: personel-vardiyalari
    hedef: bol
    girdi: tsv
    kaynak: cok-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: kisit-sakli
    direnc: son-newline-yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
