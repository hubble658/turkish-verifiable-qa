id: gen-s-7312-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  arsiv/notlar.tar.gz arşiv dosyasının içindeki notlar.txt dosyasını açıp, içindeki her satırı olduğu gibi satirlar.txt dosyasına yaz.

setup: |
  mkdir -p arsiv
  cat > notlar.txt <<'NOT'
  Ali 85
  Ayse 92
  Mehmet 78
  Zeynep 85
  Can 64
  Elif 92
  Burak 78
  NOT
  tar -czf arsiv/notlar.tar.gz notlar.txt

goal_tr: >
  arsiv/notlar.tar.gz icindeki notlar.txt dosyasini acip icindeki her satiri
  oldugu gibi satirlar.txt dosyasina yaz

reference_solution: |
  tar -xzf arsiv/notlar.tar.gz -O notlar.txt | gzip | gzip -d > satirlar.txt

outputs:
  - {path: satirlar.txt, kind: lines}
  - {path: notlar.txt, kind: file}

checks:
  - {op: file_lines_eq, path: satirlar.txt, value: [Ali 85, Ayse 92, Mehmet 78, Zeynep 85, Can 64, Elif 92, Burak 78]}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7312
    bundle: arsiv
    tools:
    - tar
    - gzip
    konu: ogrenci-notlari
    hedef: bol
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
