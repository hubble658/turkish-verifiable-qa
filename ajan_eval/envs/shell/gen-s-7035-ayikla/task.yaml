id: gen-s-7035-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  veri/olcumler.csv ile veri/konumlar.csv dosyalarını sensör kimliği üzerinden birleştirmeni istiyorum. Konumu olan her satır konum,sensor,sicaklik başlıklarıyla ve sıcaklığa göre artan sırada cikti/konumlu.csv dosyasına yazılsın; konumu olmayan satırlar ise sensor,sicaklik başlıklarıyla cikti/konumsuz.csv dosyasına gitsin.

setup: |
  mkdir -p veri cikti
  printf 'id,sicaklik\r\nS01,21\r\nS02,19\r\nS03,25\r\nS04,22\r\n' > veri/olcumler.csv
  printf 'sensor,konum\nS01,kuzey\nS02,guney\nS03,dogu\n' > veri/konumlar.csv

goal_tr: >
  veri/olcumler.csv ve veri/konumlar.csv dosyalarini sensor kimligi
  uzerinden birlestirip, konumu olan her satiri cikti/konumlu.csv dosyasina
  konum,sensor,sicaklik basliklariyla ve sicakliga gore artan sirada yaz,
  konumu olmayan satirlari cikti/konumsuz.csv dosyasina sensor,sicaklik
  basliklariyla yaz.

reference_solution: |
  sed 's/\r$//' veri/olcumler.csv > /tmp/olcumler.tmp
  sed 's/\r$//' veri/konumlar.csv > /tmp/konumlar.tmp
  tail -n +2 /tmp/olcumler.tmp | sort -t, -k1,1 > /tmp/o.srt
  tail -n +2 /tmp/konumlar.tmp | sort -t, -k1,1 > /tmp/k.srt
  join -t, -1 1 -2 1 /tmp/o.srt /tmp/k.srt | cut -d, -f2,1,3 | sort -t, -k3,3n > /tmp/birlesik.tmp
  printf 'konum,sensor,sicaklik\n' > cikti/konumlu.csv
  cat /tmp/birlesik.tmp >> cikti/konumlu.csv
  comm -23 /tmp/o.srt /tmp/k.srt | cut -d, -f1,2 | rev | sed 's/,/ /' | rev | sed 's/ /,/' > /tmp/tek.tmp
  printf 'sensor,sicaklik\n' > cikti/konumsuz.csv
  cat /tmp/tek.tmp >> cikti/konumsuz.csv

outputs:
  - {path: cikti/konumlu.csv, kind: file}
  - {path: cikti/konumsuz.csv, kind: file}

checks:
  - {op: file_lines_eq, path: cikti/konumlu.csv, value: ['konum,sensor,sicaklik', 'S01,21,kuzey', 'S02,19,guney', 'S03,25,dogu']}
  - {op: file_lines_eq, path: cikti/konumsuz.csv, value: ['sensor,sicaklik', 'S01,21', 'S02,19', 'S03,25', 'S04,22']}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-7035
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: sensor-olcumleri
    hedef: ayikla
    girdi: csv
    kaynak: iki-dosya-capraz
    cikti: birden-cok-dosya
    kesif: dosyayi-bul
    uslup: kisit-sakli
    direnc: crlf
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
