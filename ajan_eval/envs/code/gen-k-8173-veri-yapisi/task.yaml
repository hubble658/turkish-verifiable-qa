  uretmeli.

reference_solution: |
  cat > catalog/tree.py <<'TREE'
  from catalog.errors import DuplicateError, EmptyTreeError, NotFoundError
  from catalog.records import build_record


  class Node:
      def __init__(self, record):
          self.record = record
          self.left = None
          self.right = None


  class DocumentTree:
      def __init__(self):
          self.root = None
          self._size = 0

      def insert(self, key, title, body):
          record = build_record(key, title, body)
          if self.root is None:
              self.root = Node(record)
              self._size = 1
              return record
          node = self.root
          while True:
              if key == node.record.key:
                  raise DuplicateError(key)
              if key < node.record.key:
                  if node.left is None:
                      node.left = Node(record)
                      self._size += 1
                      return record
                  node = node.left
              else:
                  if node.right is None:
                      node.right = Node(record)
                      self._size += 1
                      return record
                  node = node.right

      def find(self, key):
          node = self.root
          while node is not None:
              if key == node.record.key:
                  return node.record
              if key < node.record.key:
                  node = node.left
              else:
                  node = node.right
          raise NotFoundError(key)

      def remove(self, key):
          if self.root is None:
              raise EmptyTreeError("tree is empty")
          parent = None
          node = self.root
          while node is not None and node.record.key != key:
              parent = node
              if key < node.record.key:
                  node = node.left
              else:
                  node = node.right
          if node is None:
              raise NotFoundError(key)
          removed = node.record
          if node.left is not None and node.right is not None:
              succ_parent = node
              succ = node.right
              while succ.left is not None:
                  succ_parent = succ
                  succ = succ.left
              node.record = succ.record
              parent = succ_parent
              node = succ
          child = node.left if node.left is not None else node.right
          if parent is None:
              self.root = child
          elif parent.left is node:
              parent.left = child
          else:
              parent.right = child
          self._size -= 1
          return removed

      def in_order(self):
          keys = []
          stack = []
          node = self.root
          while stack or node is not None:
              while node is not None:
                  stack.append(node)
                  node = node.left
              node = stack.pop()
              keys.append(node.record.key)
              node = node.right
          return keys

      def depth(self):
          best = 0
          stack = [(self.root, 1)]
          while stack:
              node, level = stack.pop()
              if node is None:
                  continue
              if level > best:
                  best = level
              stack.append((node.left, level + 1))
              stack.append((node.right, level + 1))
          return best

      def size(self):
          return self._size

      def titles_by_depth(self):
          levels = {}
          stack = [(self.root, 1)]
          while stack:
              node, level = stack.pop()
              if node is None:
                  continue
              levels.setdefault(level, []).append(node.record.title)
              stack.append((node.right, level + 1))
              stack.append((node.left, level + 1))
          return levels
  TREE

