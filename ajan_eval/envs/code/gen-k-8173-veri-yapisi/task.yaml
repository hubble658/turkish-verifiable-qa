  find eksik anahtar icin NotFoundError yukseltmeli, remove silinen Record'u
  dondurmeli ve bos agacta EmptyTreeError yukseltmeli, in_order anahtarlari
  sirali liste olarak vermeli, depth en derin dugumun seviyesini (bos agac
  0) dondurmeli, size dugum sayisini vermeli, titles_by_depth ise {seviye:
