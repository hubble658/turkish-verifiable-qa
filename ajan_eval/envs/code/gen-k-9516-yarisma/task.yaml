  - {path: exam/parser.py, kind: program, run: 'python3 -c ''from exam.parser import parse_line as f; assert f("ada,50.5")==("ada",50.5), f("ada,50.5"); print("ILERLEME-TAMAM")'''}
  - {path: exam/simulator.py, kind: program, run: 'python3 -c ''from exam.simulator import ExamSimulator as C; s=C(["ada,50.5","bora,49.5"]); assert s.curve(10.0)==[("ada",60.5),("bora",59.5)], s.curve(10.0); print("REGRESYON-TAMAM")'''}

