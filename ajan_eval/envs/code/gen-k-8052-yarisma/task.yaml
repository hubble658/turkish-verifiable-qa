# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  schedule.py dosyasındaki ShiftLog sınıfına üç ekleme yap. Birincisi, add ile kaydedilen saatlik değişimleri önek-toplam ile biriktirip her saatin toplam kapsamasını döndüren prefix() metodu olsun. İkincisi, iki ShiftLog nesnesini + operatörü ile birleştirip yeni bir ShiftLog nesnesi döndüren __add__ metodu tanımlansın. Üçüncüsü de += işlemini destekleyen __iadd__ metodu eklensin.

setup: |
  cat > shifts.txt <<'DATA'
  0 8
  3 5
  1 4
  2 6
  DATA
  cat > schedule.py <<'PY'
  class ShiftLog:
      def __init__(self):
          self._events = {}

      def add(self, hour, delta):
          self._events[hour] = self._events.get(hour, 0) + delta

      def coverage(self):
          return dict(self._events)
  PY

goal_tr: >
  schedule.py icindeki ShiftLog sinifina, add ile kaydedilen saatlik
  degisimleri onek-toplam ile biriktirip her saatin toplam kapsamasini
  donduren prefix() metodunu ekle; ayrica iki ShiftLog nesnesini + operatoru
  ile birlestirip yeni bir ShiftLog donduren __add__ ve +='i destekleyen
  __iadd__ tanimla.

reference_solution: |
  cat > schedule.py <<'PY'
  class ShiftLog:
      def __init__(self):
          self._events = {}

      def add(self, hour, delta):
          self._events[hour] = self._events.get(hour, 0) + delta

      def coverage(self):
          return dict(self._events)

      def prefix(self):
          total = 0
          result = {}
          for hour in sorted(self._events):
              total += self._events[hour]
              result[hour] = total
          return result

      def __add__(self, other):
          merged = ShiftLog()
          for hour, delta in self._events.items():
              merged.add(hour, delta)
          for hour, delta in other._events.items():
              merged.add(hour, delta)
          return merged

      def __iadd__(self, other):
          for hour, delta in other._events.items():
              self.add(hour, delta)
          return self
  PY

