# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensor/reader.py içindeki read_series fonksiyonu, sıfır ve negatif okumaları da akışa dahil etsin; yalnızca pozitif değerleri değil, tüm okumaları versin. Ardından sensor/stats.py içindeki max_value fonksiyonu, serideki en büyük değeri döndürecek şekilde düzeltilsin; sum_value fonksiyonu ise doğru çalışmaya devam etsin.

setup: |
  mkdir -p sensor
  cat > sensor/reader.py <<'READER'
  def read_series(stream):
      """Yield (name, value) pairs from lines like 'temp 21.5'."""
      for line in stream:
          line = line.strip()
          if not line:
              continue
          name, raw = line.split()
          value = float(raw)
          if value > 0:
              yield name, value
  READER
  cat > sensor/stats.py <<'STATS'
  from sensor.reader import read_series


  def make_accumulator(func):
      def wrapper(stream):
          acc = None
          for _, value in read_series(stream):
              if acc is None:
                  acc = value
              else:
                  acc = func(acc, value)
          if acc is None:
              return 0.0
          return acc
      return wrapper


  @make_accumulator
  def sum_value(acc, value):
      return acc + value


  @make_accumulator
  def max_value(acc, value):
      if value < acc:
          return value
      return acc
  STATS

goal_tr: >
  sensor/reader.py icindeki read_series fonksiyonunun sifir ve negatif
  okumalari da akisa katmasini sagla, ardindan sensor/stats.py icindeki
  max_value fonksiyonunu serideki en buyuk degeri dondurecek bicimde duzelt;
  sum_value dogru kalmalidir.

