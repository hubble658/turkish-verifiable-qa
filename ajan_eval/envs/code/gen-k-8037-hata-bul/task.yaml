# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) flights/booking.py dosyasını aç ve load_report fonksiyonunu incele.

  2) load_report fonksiyonunun her uçuş için "KOD dolu/kapasite" biçiminde bir satır üretmesini sağla; satırdaki dolu değeri o uçuşta onaylanan koltuk sayısı, kapasite değeri ise uçuşun toplam koltuk sayısı olsun.

  3) load_report fonksiyonunun doğru kapasite değerini kullanmasını sağla ve ürettiği satırları liste olarak döndürmesini koru.

setup: |
  mkdir -p flights
  cat > flights/legs.py <<'LEGS'
  def build_legs(routes):
      legs = {}
      for code, (src, dst, seats) in routes.items():
          legs[code] = {"origin": src, "dest": dst, "seats": seats}
      return legs
  LEGS
  cat > flights/inventory.py <<'INV'
  def make_counter(seats):
      remaining = [seats]

      def take(n):
          if n <= remaining[0]:
              remaining[0] -= n
              return True
          return False

      def left():
          return remaining[0]

      return take, left
  INV
  cat > flights/booking.py <<'BOOK'
  from flights.legs import build_legs
  from flights.inventory import make_counter


  def reserve(routes, requests):
      legs = build_legs(routes)
      counters = {}
      for code in routes:
          counters[code] = make_counter(legs[code]["seats"])
      confirmed = []
      for code, n in requests:
          take, _ = counters[code]
          if take(n):
              confirmed.append((code, n))
      return confirmed


  def load_report(routes, requests):
      legs = build_legs(routes)
      confirmed = reserve(routes, requests)
      used = {}
      for code, n in confirmed:
          used[code] = used.get(code, 0) + n
      lines = []
      for code in routes:
          cap = legs[code]["seat"]
          lines.append("%s %d/%d" % (code, used.get(code, 0), cap))
      return lines
  BOOK

goal_tr: >
  flights/booking.py icindeki load_report fonksiyonunu, her ucus icin "KOD
  dolu/kapasite" satirini dogru uretecek bicimde duzelt.

