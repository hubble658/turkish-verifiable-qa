# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  bank/statement.py dosyasındaki Statement.load metodu şu an boş satıra denk geldiğinde işlemeyi kesiyor; bunu boş satırları atlayıp dosyadaki tüm satırları işleyecek şekilde düzelt. Ayrıca total() metodu tüm hareketlerin toplamını döndürsün.

setup: |
  mkdir -p bank
  cat > bank/ledger.py <<'LEDGER'
  class Ledger:
      def __init__(self):
          self._entries = []

      def add(self, amount):
          self._entries.append(amount)

      def balance(self):
          total = 0
          for amount in self._entries:
              total += amount
          return total
  LEDGER
  cat > bank/statement.py <<'STATEMENT'
  from bank.ledger import Ledger


  class Statement:
      def __init__(self):
          self.ledger = Ledger()

      def load(self, lines):
          for line in lines:
              line = line.strip()
              if not line:
                  return
              self.ledger.add(int(line))

      def total(self):
          return self.ledger.balance()
  STATEMENT
  printf '10\n20\n30\n' > txn.txt

goal_tr: >
  bank/statement.py icindeki Statement.load metodunu, bos satirlari atlayip
  tum satirlari isleyecek ve total() tum hareketlerin toplamini dondurecek
  bicimde duzelt.

reference_solution: |
  cat > bank/statement.py <<'STATEMENT'
  from bank.ledger import Ledger


  class Statement:
      def __init__(self):
          self.ledger = Ledger()

      def load(self, lines):
          for line in lines:
              line = line.strip()
              if not line:
                  continue
              self.ledger.add(int(line))

      def total(self):
          return self.ledger.balance()
  STATEMENT

