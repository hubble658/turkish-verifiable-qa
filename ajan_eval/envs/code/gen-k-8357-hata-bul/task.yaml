id: gen-k-8357-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  route/paths.py içindeki cheapest_paths fonksiyonunu, eşit uzaklıktaki düğümler çıktıda düğüm adına göre alfabetik sıralanacak şekilde düzelt.

setup: |
  mkdir -p route
  cat > route/loader.py <<'LOADER'
  def load_edges(path):
      edges = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              a, b, w = line.split(',')
              edges.append((a, b, int(w)))
      return edges
  LOADER
  cat > route/graph.py <<'GRAPH'
  from route.loader import load_edges


  def build_adj(path):
      adj = {}
      for a, b, w in load_edges(path):
          adj.setdefault(a, []).append((b, w))
          adj.setdefault(b, [])
      return adj
  GRAPH
  cat > route/paths.py <<'PATHS'
  from route.graph import build_adj


  def cheapest_paths(path, src):
      adj = build_adj(path)
      dist = {src: 0}
      order = [src]
      seen = set()
      while order:
          node = order.pop(0)
          if node in seen:
              continue
          seen.add(node)
          for nxt, w in adj.get(node, []):
              cand = dist[node] + w
              if nxt not in dist or cand < dist[nxt]:
                  dist[nxt] = cand
              order.append(nxt)
      return sorted(dist.items(), key=lambda kv: kv[1])
  PATHS
  cat > net.txt <<'NET'
  A,B,1
  A,C,1
  B,D,5
  C,D,5
  D,E,2
  NET

goal_tr: >
  route/paths.py icindeki cheapest_paths fonksiyonunu, esit uzakliktaki
  dugumlerin cikti sirasini dugum adina gore alfabetik yapacak bicimde
  duzelt.

reference_solution: |
  cat > route/paths.py <<'PATHS'
  from route.graph import build_adj


  def cheapest_paths(path, src):
      adj = build_adj(path)
      dist = {src: 0}
      order = [src]
      seen = set()
      while order:
          node = order.pop(0)
          if node in seen:
              continue
          seen.add(node)
          for nxt, w in adj.get(node, []):
              cand = dist[node] + w
              if nxt not in dist or cand < dist[nxt]:
                  dist[nxt] = cand
              order.append(nxt)
      return sorted(dist.items(), key=lambda kv: (kv[1], kv[0]))
  PATHS

