id: gen-k-5061-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) pricing/discount.py dosyasını aç ve apply_discount fonksiyonunu incele.

  2) apply_discount fonksiyonundaki erken dönüşü kaldır.

  3) Fonksiyonu, indirim oranı sıfırdan büyük olduğunda indirimi tüm ürünlere uygulayacak ve listenin tamamını döndürecek şekilde düzelt.

setup: |
  mkdir -p pricing
  cat > pricing/parse.py <<'PARSE'
  def parse_lines(text):
      items = []
      for line in text.strip().splitlines():
          name, price = line.split(',')
          items.append((name, float(price)))
      return items
  PARSE
  cat > pricing/discount.py <<'DISCOUNT'
  from pricing.parse import parse_lines


  def apply_discount(text, rate):
      items = parse_lines(text)
      out = []
      for name, price in items:
          if rate > 0:
              out.append((name, price * (1.0 - rate)))
              return out
          out.append((name, price))
      return out
  DISCOUNT
  cat > pricing/bill.py <<'BILL'
  from pricing.discount import apply_discount


  def total(text, rate):
      items = apply_discount(text, rate)
      return round(sum(p for _, p in items), 2)
  BILL
  cat > prices.txt <<'TXT'
  widget,10.00
  gadget,4.00
  bolt,2.00
  TXT

goal_tr: >
  pricing/discount.py icindeki apply_discount fonksiyonunu, indirim orani
  sifirdan buyuk oldugunda TUM urunlere indirimi uygulayip listenin tamamini
  dondurecek bicimde duzelt; erken donusu kaldir.

reference_solution: |
  cat > pricing/discount.py <<'DISCOUNT'
  from pricing.parse import parse_lines


  def apply_discount(text, rate):
      items = parse_lines(text)
      out = []
      for name, price in items:
          if rate > 0:
              out.append((name, price * (1.0 - rate)))
          else:
              out.append((name, price))
      return out
  DISCOUNT

