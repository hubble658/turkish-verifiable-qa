prompt: |
  1) weblog/trie/store.py dosyasındaki DictNodeStore sınıfının __init__, get_child, set_child, children, terminal ve set_terminal metotlarındaki NotImplementedError gövdelerini çalışır biçimde gerçekleştir; sınıf sözlük tabanlı bir düğüm deposu olsun.

  2) weblog/trie/prefix.py dosyasındaki PrefixTrie sınıfının __init__, insert, count ve completions metotlarındaki NotImplementedError gövdelerini çalışır biçimde gerçekleştir.

  3) PrefixTrie'nin insert metodu verilen segmentleri ağaca eklesin, count metodu verilen segmentlerin sayacını döndürsün.

  4) PrefixTrie'nin completions metodu verilen segment önekine uyan yollar içinde en yüksek sayaca sahip olan yolu döndürsün.

