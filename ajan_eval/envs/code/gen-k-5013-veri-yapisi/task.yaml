goal_tr: >
  weblog/trie/store.py ve weblog/trie/prefix.py dosyalarindaki
  NotImplementedError govdelerini, DictNodeStore sozluk tabanli dugum
  deposunu ve PrefixTrie'nin insert/count/completions metotlarini calisir
  bicimde gerceklestir; completions verilen segment onekine uyan yollar
  icinde en yuksek sayaci olan yolu dondursun.

reference_solution: |
  cat > weblog/trie/store.py <<'STORE'
  from weblog.trie.base import NodeStore


  class DictNodeStore(NodeStore):
      def __init__(self):
          self._children = {}
          self._terminal = None

      def get_child(self, label):
          return self._children.get(label)

      def set_child(self, label, node):
          self._children[label] = node

      def children(self):
          return sorted(self._children.items())

      def terminal(self):
          return self._terminal

      def set_terminal(self, value):
          self._terminal = value
  STORE
  cat > weblog/trie/prefix.py <<'PREFIX'
  from weblog.trie.store import DictNodeStore


  class PrefixTrie:
      """Trie over path segments; each node may carry a hit counter."""

      def __init__(self, store_factory=DictNodeStore):
          self._store_factory = store_factory
          self._root = store_factory()

      def insert(self, segments):
          node = self._root
          for label in segments:
              child = node.get_child(label)
              if child is None:
                  child = self._store_factory()
                  node.set_child(label, child)
              node = child
          node.set_terminal((node.terminal() or 0) + 1)

      def _walk(self, segments):
          node = self._root
          for label in segments:
              node = node.get_child(label)
              if node is None:
                  return None
          return node

      def count(self, segments):
          node = self._walk(segments)
          if node is None:
              return 0
          return node.terminal() or 0

      def completions(self, prefix):
          node = self._walk(prefix)
          if node is None:
              return None
          best = None
          best_count = 0
          stack = [(node, list(prefix))]
          while stack:
              current, trail = stack.pop()
              hits = current.terminal()
              if hits and hits > best_count:
                  best_count = hits
                  best = list(trail)
              for label, child in current.children():
                  stack.append((child, trail + [label]))
          return best
  PREFIX

