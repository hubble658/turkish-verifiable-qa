goal_tr: >
  plans/trie/node.py, plans/trie/store.py, plans/validate/rules.py ve
  plans/registry.py dosyalarindaki iskeleti, ic ice Node yapisi uzerinden
  abonelik plan kodlarini kaydedip cozen tam calisan bir trie
  gerceklestirmesiyle doldur; her metod NotImplementedError yerine dogru
  govdeye sahip olsun.

reference_solution: |
  cat > plans/trie/node.py <<'NODE'
  from dataclasses import dataclass, field


  @dataclass
  class Node:
      children: dict = field(default_factory=dict)
      plan_id: str = ""

      def insert(self, segment, pid):
          if segment == "":
              self.plan_id = pid
              return
          head, rest = segment[0], segment[1:]
          if head not in self.children:
              self.children[head] = Node()
          self.children[head].insert(rest, pid)

      def lookup(self, segment):
          if segment == "":
              return self.plan_id
          head, rest = segment[0], segment[1:]
          if head not in self.children:
              return ""
          return self.children[head].lookup(rest)
  NODE
  cat > plans/trie/store.py <<'STORE'
  from plans.trie.node import Node


  class PlanTrie:
      def __init__(self):
          self.root = Node()

      def add(self, code, pid):
          self.root.insert(code, pid)

      def find(self, code):
          return self.root.lookup(code)
  STORE
  cat > plans/validate/rules.py <<'RULES'
  def normalize(code):
      return code.strip().lower()


  def is_valid(code):
      return len(code) > 0 and code.isalpha()
  RULES
  cat > plans/registry.py <<'REG'
  from plans.trie.store import PlanTrie
  from plans.validate.rules import normalize, is_valid


  class Registry:
      def __init__(self):
          self.trie = PlanTrie()

      def register(self, code, pid):
          c = normalize(code)
          if not is_valid(c):
              raise ValueError("bad code: " + code)
          self.trie.add(c, pid)

      def resolve(self, code):
          return self.trie.find(normalize(code))
  REG

ara_adim: |
  cat > plans/validate/rules.py <<'RULES'
  def normalize(code):
