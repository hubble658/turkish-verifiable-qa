# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  grid/aggregator.py dosyasındaki Aggregator sınıfının reset metodunu, toplamı gerçekten sıfırlayacak şekilde düzelt. Ayrıca grid/pipeline.py dosyasındaki run_batches fonksiyonunun her parti için yalnızca o partinin tüketimini döndürmesini sağla.

  Şu şartlar sağlanmalı:
  - grid/aggregator.py içindeki Aggregator.reset metodu çağrıldığında toplam gerçekten sıfırlanmalı.
  - grid/pipeline.py içindeki run_batches fonksiyonu her parti için yalnızca o partinin tüketimini döndürmeli.
  - Başlangıçta var olan grid/reading.py ve grid/pipeline.py dosyalarındaki mevcut yapı ve isimler korunmalı.

setup: |
  mkdir -p grid
  cat > grid/reading.py <<'READING'
  class Reading:
      def __init__(self, meter_id, kwh):
          self.meter_id = meter_id
          self.kwh = kwh

      def __add__(self, other):
          if isinstance(other, Reading):
              return Reading(self.meter_id + "+" + other.meter_id, self.kwh + other.kwh)
          return Reading(self.meter_id, self.kwh + other)

      def __radd__(self, other):
          return Reading(self.meter_id, self.kwh + other)

      def __repr__(self):
          return "Reading(%r, %r)" % (self.meter_id, self.kwh)
  READING
  cat > grid/aggregator.py <<'AGG'
  from grid.reading import Reading


  class Aggregator:
      def __init__(self):
          self.total = Reading("", 0.0)

      def add(self, reading):
          self.total = self.total + reading
          return self.total

      def reset(self):
          return self.total
  AGG
  cat > grid/pipeline.py <<'PIPE'
  from grid.aggregator import Aggregator


  def run_batches(batches):
      agg = Aggregator()
      results = []
      for batch in batches:
          for reading in batch:
              agg.add(reading)
          results.append(agg.total.kwh)
          agg.reset()
      return results
  PIPE

goal_tr: >
  grid/aggregator.py icindeki Aggregator.reset metodunu, toplami gercekten
  sifirlayacak ve grid/pipeline.py icindeki run_batches fonksiyonunun her
  parti icin yalnizca o partinin tuketimini dondurmesini saglayacak bicimde
  duzelt.

reference_solution: |
  cat > grid/aggregator.py <<'AGG'
  from grid.reading import Reading


  class Aggregator:
      def __init__(self):
          self.total = Reading("", 0.0)

      def add(self, reading):
          self.total = self.total + reading
          return self.total

      def reset(self):
          self.total = Reading("", 0.0)
          return self.total
  AGG

outputs:
