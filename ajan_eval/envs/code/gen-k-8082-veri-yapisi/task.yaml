  docs/store.py'deki DocumentStore'un __iter__, stream ve search metotlarını generator olarak yaz. __iter__ (id, token listesi) çiftlerini sırayla, stream(chunk) demetleri chunk boyutunda parçalı, search(term) term geçen belgelerin id'lerini üretsin.

