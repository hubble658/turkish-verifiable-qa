goal_tr: >
  docs/store.py icindeki DocumentStore sinifinin __iter__, stream ve search
  metotlarini; __iter__ dugumleri (id, token listesi) ciftleri halinde
  sirayla dolasan bir generator olacak, stream(chunk) bagli listeyi chunk
  boyutunda demetler halinde parcali akitan bir generator olacak ve
  search(term) icinde term token'i gecen belgelerin id'lerini sirayla ureten
  bir generator olacak bicimde gerceklestir.

reference_solution: |
  cat > docs/store.py <<'STORE'
  from docs.tokens import tokenize


  class DocumentStore:
      def __init__(self):
          self._head = None
          self._tail = None
          self._size = 0

      def append(self, doc_id, line):
          node = {"id": doc_id, "tokens": tokenize(line), "next": None}
          if self._head is None:
              self._head = node
          else:
              self._tail["next"] = node
          self._tail = node
          self._size += 1
          return self

      def __len__(self):
          return self._size

      def __iter__(self):
          node = self._head
          while node is not None:
              yield node["id"], list(node["tokens"])
              node = node["next"]

      def stream(self, chunk):
          if chunk <= 0:
              raise ValueError("chunk must be positive")
          batch = []
          for doc_id, tokens in self:
              batch.append((doc_id, tokens))
              if len(batch) == chunk:
                  yield batch
                  batch = []
          if batch:
              yield batch

      def search(self, term):
          for doc_id, tokens in self:
              if term in tokens:
                  yield doc_id
  STORE

