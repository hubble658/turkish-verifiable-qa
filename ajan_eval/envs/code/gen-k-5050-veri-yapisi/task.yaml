prompt: |
  1) depo/cache.py içindeki LruCache sınıfını gerçekleştir; önbellek en fazla capacity kayıt tutmalı, kapasite aşıldığında en eski kullanılan kayıt atılmalı, her get çağrısı hit/miss sayaçlarını güncellemeli ve bir kayda erişim onu en yeni konuma taşımalı.

  2) depo/inventory.py içindeki build_inventory fonksiyonunu gerçekleştir; depo/records.py içindeki make_ledger ile üretilen kayıtları LruCache kullanarak bir envantere dönüştürsün.

  3) depo/inventory.py içindeki peek_inventory fonksiyonunu gerçekleştir; verilen envanterde bir isme bakıp kaydı döndürsün.

