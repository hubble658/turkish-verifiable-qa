      raise NotImplementedError


  def peek_inventory(inventory, name):
      raise NotImplementedError
  INV

goal_tr: >
  depo/cache.py icindeki LruCache sinifini ve depo/inventory.py icindeki
  build_inventory ile peek_inventory fonksiyonlarini gerceklestir: onbellek
  en fazla capacity kayit tutmali, kapasite asilinca en eski kullanilan
  kayit atilmali, her get cagrisi hit/miss sayaclarini guncellemeli ve bir
  kayda erisim onu en yeni konuma tasimali.

reference_solution: |
  cat > depo/cache.py <<'CACHE'
  class LruCache:
      def __init__(self, capacity):
          if capacity < 1:
              raise ValueError("capacity must be >= 1")
          self.capacity = capacity
          self._data = {}
          self._order = []
          self.hits = 0
          self.misses = 0

      def get(self, key):
          if key in self._data:
              self.hits += 1
              self._order.remove(key)
              self._order.append(key)
              return self._data[key]
          self.misses += 1
          return None

      def put(self, key, value):
          if key in self._data:
              self._order.remove(key)
          elif len(self._data) >= self.capacity:
              oldest = self._order.pop(0)
              del self._data[oldest]
          self._data[key] = value
          self._order.append(key)

      def stats(self):
          return {"hits": self.hits, "misses": self.misses, "size": len(self._data)}
  CACHE
  cat > depo/inventory.py <<'INV'
  from depo.cache import LruCache
  from depo.records import make_ledger


  def build_inventory(entries, capacity):
      cache = LruCache(capacity)
      for row in make_ledger(entries):
          cache.put(row["name"], row["qty"])
      return cache


  def peek_inventory(inventory, name):
      return inventory.get(name)
  INV

