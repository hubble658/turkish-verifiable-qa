split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 22

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Depo ekibi için hazırladığımız sipariş raporu üzerinde son birkaç gündür uğraşıyoruz; müşterilerden gelen geri bildirimler can sıkıcı olmaya başladı. Dün akşam bir kez daha baktım, sorun yalnızca rakamlarda değil, raporun kendisini toplama biçiminde de var. Şimdi bunu düzeltmeni istiyorum.

  store/report/summary.py, store/core/items.py ve store/core/totals.py dosyalarındaki davranışları düzelt. Satır tutarları ve genel toplam, miktar ile birim fiyatın çarpımı olacak şekilde hesaplanmalı; şu an çıkan değer bu çarpımdan farklı. Ayrıca aynı sku birden fazla satırda geçtiğinde miktarların birleştirilmesi gerekiyor, şu an birleşmiyor. Son olarak rapor, satır sayısı olarak ham satır sayısını bildiriyor; bunun yerine birleştirilmiş benzersiz satır sayısını bildirmeli.

setup: |
  mkdir -p store/core store/report
  cat > store/core/__init__.py <<'EOF'
  EOF
  cat > store/report/__init__.py <<'EOF'
  EOF
  cat > store/core/items.py <<'ITEMS'
  def build_index(rows):
      index = {}
      for row in rows:
          sku = row["sku"]
          index[sku] = {"qty": row["qty"], "price": row["price"]}
      return index
  ITEMS
  cat > store/core/totals.py <<'TOTALS'
  from store.core.items import build_index


  def line_total(entry):
      return entry["qty"] + entry["price"]


  def grand_total(rows):
      index = build_index(rows)
      return sum(line_total(v) for v in index.values())
  TOTALS
  cat > store/report/summary.py <<'SUMMARY'
  from store.core.totals import grand_total


  def describe(rows):
      return {"count": len(rows), "total": grand_total(rows)}
  SUMMARY
  cat > orders.py <<'DATA'
  ORDERS = [
      {"sku": "A1", "qty": 2, "price": 10.0},
      {"sku": "B2", "qty": 3, "price": 5.0},
      {"sku": "C3", "qty": 1, "price": 2.5},
  ]
  DATA

goal_tr: >
  store paketindeki siparis raporu yanlis toplam uretiyor: satir tutarlari
  ve genel toplam, miktar ile birim fiyatin carpimi olmasi gerekirken farkli
  bir deger cikiyor; ayrica ayni sku birden fazla satirda gectiginde
  miktarlar birlesmiyor ve rapor satir sayisini ham satir sayisi olarak
  bildiriyor. Bu davranislari duzelt.

reference_solution: |
  cat > store/core/items.py <<'ITEMS'
  def build_index(rows):
      index = {}
      for row in rows:
          sku = row["sku"]
          if sku in index:
              index[sku]["qty"] += row["qty"]
          else:
              index[sku] = {"qty": row["qty"], "price": row["price"]}
      return index
  ITEMS
  cat > store/core/totals.py <<'TOTALS'
  from store.core.items import build_index


  def line_total(entry):
      return entry["qty"] * entry["price"]


  def grand_total(rows):
      index = build_index(rows)
      return sum(line_total(v) for v in index.values())
  TOTALS
  cat > store/report/summary.py <<'SUMMARY'
  from store.core.totals import grand_total


  def describe(rows):
      return {"count": len({r["sku"] for r in rows}), "total": grand_total(rows)}
  SUMMARY

