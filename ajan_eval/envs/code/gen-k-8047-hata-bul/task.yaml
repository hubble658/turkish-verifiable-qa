# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  lib/desk.py içindeki Desk.checkout metodunu, başarılı bir ödünç işleminde ödünç alan kişinin adını değil, ödünç verilen kitabın başlığını döndürecek şekilde düzelt. Başarısız durumlardaki mevcut davranış aynı kalsın; yalnızca başarılı ödünçte dönen değer kitabın başlığı olsun.

setup: |
  mkdir -p lib
  cat > lib/borrowers.py <<'BORROWERS'
  from abc import ABC, abstractmethod


  class BorrowerBase(ABC):
      @abstractmethod
      def can_borrow(self, count=1):
          raise NotImplementedError

      @abstractmethod
      def record(self, book_id):
          raise NotImplementedError


  class Borrower(BorrowerBase):
      def __init__(self, name, limit):
          self.name = name
          self.limit = limit
          self.loans = []

      def can_borrow(self, count=1):
          return len(self.loans) + count <= self.limit

      def record(self, book_id):
          self.loans.append(book_id)


  def make_borrower(name, limit):
      return Borrower(name, limit)
  BORROWERS
  cat > lib/catalog.py <<'CATALOG'
  class Catalog:
      def __init__(self):
          self.titles = {}

      def add(self, book_id, title, copies):
          self.titles[book_id] = {"title": title, "copies": copies}

      def title_of(self, book_id):
          return self.titles[book_id]["title"]

      def available(self, book_id):
          return self.titles[book_id]["copies"] > 0

      def take_copy(self, book_id):
          self.titles[book_id]["copies"] -= 1
  CATALOG
  cat > lib/desk.py <<'DESK'
  from lib.borrowers import make_borrower
  from lib.catalog import Catalog


  class Desk:
      def __init__(self):
          self.catalog = Catalog()
          self.borrowers = {}

      def register(self, name, limit):
          self.borrowers[name] = make_borrower(name, limit)

      def checkout(self, name, book_id):
          borrower = self.borrowers[name]
          if not borrower.can_borrow():
              return "limit"
          if not self.catalog.available(book_id):
              return "unavailable"
          borrower.record(book_id)
          self.catalog.take_copy(book_id)
          return name
  DESK

goal_tr: >
  lib/desk.py icindeki Desk.checkout metodunu, basarili bir oduncte oduncu
  adini degil odunc verilen kitabin basligini dondurecek bicimde duzelt.

reference_solution: |
  cat > lib/desk.py <<'DESK'
  from lib.borrowers import make_borrower
  from lib.catalog import Catalog


  class Desk:
      def __init__(self):
          self.catalog = Catalog()
          self.borrowers = {}

      def register(self, name, limit):
          self.borrowers[name] = make_borrower(name, limit)

      def checkout(self, name, book_id):
          borrower = self.borrowers[name]
          if not borrower.can_borrow():
              return "limit"
          if not self.catalog.available(book_id):
              return "unavailable"
          borrower.record(book_id)
          self.catalog.take_copy(book_id)
          return self.catalog.title_of(book_id)
  DESK

