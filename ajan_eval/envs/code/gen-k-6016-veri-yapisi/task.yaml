goal_tr: >
  callcenter/stack.py icindeki CallStack sinifini ve callcenter/agent.py
  icindeki AgentSession sinifini, calls.txt dosyasindan okunan cagri
  kayitlarini LIFO yigin mantigiyla isleyip her ajanin aktif cagrisini,
  toplam cagri sayisini ve bitirilen cagrilarin sure toplamini dogru
  dondurecek bicimde gerceklestir.

reference_solution: |
  cat > callcenter/stack.py <<'STACK'
  class CallStack:
      """A LIFO stack of active call records for one agent."""

      def __init__(self):
          self._items = []

      def push(self, record):
          self._items.append(record)

      def pop(self):
          if not self._items:
              raise IndexError("pop from empty CallStack")
          return self._items.pop()

      def peek(self):
          if not self._items:
              raise IndexError("peek from empty CallStack")
          return self._items[-1]

      def is_empty(self):
          return len(self._items) == 0

      def depth(self):
          return len(self._items)
  STACK
  cat > callcenter/agent.py <<'AGENT'
  from callcenter.stack import CallStack


  class AgentSession:
      """Tracks a single agent's calls using a LIFO stack."""

      def __init__(self, name):
          self.name = name
          self.stack = CallStack()
          self._total = 0
          self._finished = 0

      def start_call(self, call_id):
          self.stack.push(call_id)
          self._total += 1

      def end_call(self):
          if self.stack.is_empty():
              raise IndexError("no active call to end")
          return self.stack.pop()

      def current_call(self):
          if self.stack.is_empty():
              return None
          return self.stack.peek()

      def call_count(self):
          return self._total
  AGENT

