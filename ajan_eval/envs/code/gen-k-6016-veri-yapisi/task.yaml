          self.stack = CallStack()

      def start_call(self, call_id):
          raise NotImplementedError

      def end_call(self):
          raise NotImplementedError

      def current_call(self):
          raise NotImplementedError

      def call_count(self):
          raise NotImplementedError
  AGENT
  cat > calls.txt <<'CALLS'
