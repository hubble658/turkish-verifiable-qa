prompt: |
  Bugün çağrı merkezindeki yoğunluktan başımız ağrıdı; ajanların hangi aramada olduğunu, kaç arama aldıklarını ve ne kadar süre konuştuğunu bir türlü düzenli tutamıyoruz. Elimizdeki ham kayıtlar bir yerde duruyor ama bunları anlamlı biçimde işleyen bir yapı yok, o yüzden her seferinde elle bakıyoruz ve hata yapıyoruz. Artık şu işi düzgün bir kod yapısına oturtmamız lazım.

  callcenter/stack.py dosyasındaki CallStack sınıfını, çağrı kayıtlarını LIFO yığın mantığıyla tutacak şekilde gerçekleştir; yığına kayıt ekleme, çıkarma, en üstteki kaydı görme, yığının boş olup olmadığını sorma ve derinliğini öğrenme davranışları çalışsın. callcenter/agent.py dosyasındaki AgentSession sınıfı da bu yığını kullanarak bir ajanın aktif çağrısını, o ajanın toplam çağrı sayısını ve bitirdiği çağrıların süre toplamını doğru döndürsün; bir çağrı başlatma ve bitirme adımları bu sayıları tutarlı biçimde güncellesin. callcenter/log_store.py içindeki read_calls fonksiyonunu da kullanarak calls.txt dosyasındaki her satırdaki ajan ve süre bilgisini okuyup bu yapıya besleyebilelim. callcenter/log_store.py dosyasını yeniden yazma, sadece mevcut haliyle kullan.

setup: |
  mkdir -p callcenter
  cat > callcenter/log_store.py <<'LOGSTORE'
  def read_calls(path):
      """Read a call log file. Each line: <agent>,<duration_seconds>."""
      entries = []
      with open(path, "r", encoding="ascii") as handle:
          for line in handle:
              line = line.strip()
              if not line:
                  continue
              agent, duration = line.split(",")
              entries.append((agent, int(duration)))
      return entries
  LOGSTORE
