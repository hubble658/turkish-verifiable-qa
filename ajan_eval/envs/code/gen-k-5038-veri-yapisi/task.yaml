      def __init__(self, code, weight):
          self.code = code
          self.weight = weight
          self.left = None
          self.right = None


  class ShipmentTree:
      def __init__(self):
          self.root = None

      def insert(self, code, weight):
          raise NotImplementedError

      def total_weight(self):
          raise NotImplementedError

      def heaviest(self):
          raise NotImplementedError

      def inorder(self):
          raise NotImplementedError
  TREE
  cat > cargo/report.py <<'REPORT'
  from cargo.tree import ShipmentTree


  def build_tree(events):
      tree = ShipmentTree()
      for code, weight in events:
          tree.insert(code, weight)
      return tree


  def summarize(events):
      tree = build_tree(events)
      return {
          "total": tree.total_weight(),
          "heaviest": tree.heaviest(),
          "codes": tree.inorder(),
      }
  REPORT
  cat > cargo/main.py <<'MAIN'
  import sys

  from cargo.events import parse_events
  from cargo.report import summarize


  def run(text):
      events = parse_events(text)
      result = summarize(events)
      print("total=%.1f" % result["total"])
      print("heaviest=%s" % result["heaviest"])
      print("codes=%s" % ",".join(result["codes"]))


  if __name__ == "__main__":
      run(sys.stdin.read())
  MAIN

goal_tr: >
  cargo/tree.py icindeki ShipmentTree sinifini tam olarak gerceklestir:
  insert kodu ikili arama agaci kuralina gore yerlestirsin (ayni kod tekrar
  gelirse agirligi guncellensin), total_weight tum agirliklarin toplamini,
  heaviest en agir kargonun kodunu, inorder ise kodlari kucukten buyuge
  sirali dondursun.

reference_solution: |
  cat > cargo/tree.py <<'TREE'
  class Node:
      def __init__(self, code, weight):
          self.code = code
          self.weight = weight
          self.left = None
          self.right = None


  class ShipmentTree:
      def __init__(self):
          self.root = None

      def insert(self, code, weight):
          if self.root is None:
              self.root = Node(code, weight)
              return
          node = self.root
          while True:
              if code < node.code:
                  if node.left is None:
                      node.left = Node(code, weight)
                      return
                  node = node.left
              elif code > node.code:
                  if node.right is None:
                      node.right = Node(code, weight)
                      return
                  node = node.right
              else:
                  node.weight = weight
                  return

      def total_weight(self):
          total = 0.0
          stack = [self.root]
          while stack:
              node = stack.pop()
              if node is None:
                  continue
              total += node.weight
              stack.append(node.left)
              stack.append(node.right)
          return total

      def heaviest(self):
          best_code = None
          best_weight = None
          stack = [self.root]
          while stack:
              node = stack.pop()
              if node is None:
                  continue
              if best_weight is None or node.weight > best_weight:
                  best_weight = node.weight
                  best_code = node.code
              stack.append(node.left)
              stack.append(node.right)
          return best_code

      def inorder(self):
          codes = []
          stack = []
          node = self.root
          while stack or node is not None:
              while node is not None:
                  stack.append(node)
                  node = node.left
              node = stack.pop()
              codes.append(node.code)
              node = node.right
          return codes
  TREE

