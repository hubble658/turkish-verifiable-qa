  mkdir -p cargo
  cat > cargo/events.py <<'EVENTS'
  def parse_events(text):
      events = []
      for line in text.strip().splitlines():
          if not line.strip():
              continue
          code, weight = line.split()
          events.append((code, float(weight)))
      return events
  EVENTS
  cat > cargo/tree.py <<'TREE'
