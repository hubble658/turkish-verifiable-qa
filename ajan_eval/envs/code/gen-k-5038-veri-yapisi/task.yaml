prompt: |
  cargo/tree.py dosyasındaki ShipmentTree sınıfını tam olarak çalışır hale getir. insert metodu kodu ikili arama ağacı kuralına göre yerleştirsin; aynı kod tekrar geldiğinde yeni düğüm eklenmesin, mevcut düğümün ağırlığı güncellensin. total_weight ağaçtaki tüm ağırlıkların toplamını döndürsün. heaviest en ağır kargonun kodunu döndürsün. inorder ise kodları küçükten büyüğe sıralı biçimde döndürsün. Sınıfın dışındaki Node tanımı ve diğer dosyalar olduğu gibi kalmalı; yalnızca cargo/tree.py üzerinde çalış.

