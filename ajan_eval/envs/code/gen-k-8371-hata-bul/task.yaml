split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  roster/core/plan.py dosyasındaki Plan.is_valid metodunu düzelt. Metot, aynı işçiye ait sıfır uzunluklu vardiyaları ya da tam komşu (bitişik) vardiyaları çakışmış saymasın; yalnızca gerçekten çakışan vardiyalar geçersiz kılsın. Farklı işçilerin aynı saatte vardiyası olması geçerli kabul edilmeye devam etsin.

setup: |
  mkdir -p roster roster/core
  cat > roster/core/shifts.py <<'SHIFTS'
  from dataclasses import dataclass


  @dataclass
  class Shift:
      worker: str
      start: int
      end: int

      def overlaps(self, other):
          return self.start < other.end and other.start < self.end
  SHIFTS
  cat > roster/core/plan.py <<'PLAN'
  from dataclasses import dataclass, field
  from roster.core.shifts import Shift


  @dataclass
  class Plan:
      shifts: list = field(default_factory=list)

      def add(self, shift):
          self.shifts.append(shift)

      def is_valid(self):
          for i, a in enumerate(self.shifts):
              for b in self.shifts[i + 1:]:
                  if a.worker == b.worker and a.overlaps(b):
                      return False
          return True
  PLAN
  cat > roster/service.py <<'SERVICE'
  from roster.core.plan import Plan


  def build_plan(rows):
      plan = Plan()
      for worker, start, end in rows:
          from roster.core.shifts import Shift
          plan.add(Shift(worker, start, end))
      return plan


  def schedule_ok(rows):
      return build_plan(rows).is_valid()
  SERVICE

goal_tr: >
  roster/core/plan.py icindeki Plan.is_valid metodunu, ayni iscinin sifir
  uzunluklu ya da tam komsu (bitisik) vardiyalari cakismis saymayacak
  bicimde duzelt; farkli iscilerin ayni saatte olmasi gecerli kalsin.

reference_solution: |
  cat > roster/core/plan.py <<'PLAN'
  from dataclasses import dataclass, field
  from roster.core.shifts import Shift


  @dataclass
  class Plan:
      shifts: list = field(default_factory=list)

      def add(self, shift):
          self.shifts.append(shift)

      def is_valid(self):
          for i, a in enumerate(self.shifts):
              for b in self.shifts[i + 1:]:
                  if a.worker != b.worker:
                      continue
                  if a.start == a.end or b.start == b.end:
                      continue
                  if a.overlaps(b):
                      return False
          return True
  PLAN

