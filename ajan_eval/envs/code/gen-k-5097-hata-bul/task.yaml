id: gen-k-5097-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  library/loans.py içindeki make_lender fabrikasını öyle bir hale getir ki, her çağrıldığında bağımsız bir ödünç kaydı tutan bir lender üretsin. Varsayılan count ile çağrıldığında ise önceki çağrıların geçmişine sızmasın; yani her yeni lender kendi temiz geçmişiyle başlasın. Sadece library/loans.py dosyasını düzelt, başka bir şey ekleme.

setup: |
  mkdir -p library
  cat > library/catalog.py <<'CATALOG'
  def build_catalog(records):
      catalog = {}
      for title, total in records:
          catalog[title] = total
      return catalog
  CATALOG
  cat > library/loans.py <<'LOANS'
  from library.catalog import build_catalog


  def make_lender(records):
      catalog = build_catalog(records)

      def lend(title, count=1, log=[]):
          if catalog.get(title, 0) < count:
              return False
          catalog[title] -= count
          log.append((title, count))
          return True

      def history():
          return list(log)

      return lend, history
  LOANS

goal_tr: >
  library/loans.py icindeki make_lender fabrikasini, her cagrildiginda
  bagimsiz bir odunc kaydi tutan ve varsayilan count ile cagrildiginda
  onceki cagrilarin gecmisine sizmayan bir lender uretecek bicimde duzelt.

reference_solution: |
  cat > library/loans.py <<'LOANS'
  from library.catalog import build_catalog


  def make_lender(records):
      catalog = build_catalog(records)
      log = []

      def lend(title, count=1):
          if catalog.get(title, 0) < count:
              return False
          catalog[title] -= count
          log.append((title, count))
          return True

      def history():
          return list(log)

      return lend, history
  LOANS

