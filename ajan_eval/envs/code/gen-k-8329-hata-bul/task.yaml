split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  bank/ledger.py içindeki Ledger.totals metodunu her hesap için toplamı doğru hesaplayacak şekilde düzelt. bank/report.py ve bank/audit.py değişmeden çalışsın.

setup: |
  mkdir -p bank
  cat > bank/ledger.py <<'LEDGER'
  class Ledger:
      def __init__(self):
          self._rows = []

      def add(self, account, amount):
          self._rows.append((account, amount))

      def totals(self):
          out = {}
          for account, amount in self._rows:
              out[account] = out[account] + amount
          return out
  LEDGER
  cat > bank/audit.py <<'AUDIT'
  from bank.ledger import Ledger


  def audit(stream):
      led = Ledger()
      for line in stream:
          line = line.strip()
          if not line:
              continue
          account, amount = line.split()
          led.add(account, int(amount))
      return led.totals()
  AUDIT
  cat > bank/report.py <<'REPORT'
  from bank.audit import audit


  def summarize(stream):
      totals = audit(stream)
      lines = []
      for account in sorted(totals):
          lines.append("%s %d" % (account, totals[account]))
      return "\n".join(lines)
  REPORT

goal_tr: >
  bank/ledger.py icindeki Ledger.totals metodunu, her hesap icin toplamin
  dogru hesaplanacagi bicimde duzelt; bank/report.py ve bank/audit.py
  degismeden calismali.

reference_solution: |
  cat > bank/ledger.py <<'LEDGER'
  class Ledger:
      def __init__(self):
          self._rows = []

      def add(self, account, amount):
          self._rows.append((account, amount))

      def totals(self):
          out = {}
          for account, amount in self._rows:
              out[account] = out.get(account, 0) + amount
          return out
  LEDGER

