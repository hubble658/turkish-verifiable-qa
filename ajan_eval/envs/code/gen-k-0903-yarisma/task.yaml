    [idx.insert(Flight(c,o,d,m)) for c,o,d,m in rows]; assert len(idx)==5; assert idx.find(95).code=="DD4"; assert idx.find(70).code
    in ("AA1","CC3"); assert idx.find(40).code=="EE5"; assert idx.find(41) is None; assert idx.find(200) is None; print("TAMAM")'
  value: TAMAM
