id: gen-k-0903-yarisma
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10
prompt: 'flights/core/query.py dosyasını yaz. Bu dosyada FlightIndex adında bir sınıf tanımla. Sınıf, Flight nesnelerini süreye
  göre artan sırada tutsun. insert metodu yeni bir Flight''ı sıralı biçimde eklesin. find metodu ise verilen hedef süreyi
  ikili arama ile bulup bu süreye sahip ilk Flight nesnesini döndürsün; eşleşen bir Flight yoksa None döndürsün.


  len(index) kayıtlı Flight sayısını döndürsün.

  '
setup: "mkdir -p flights\ncat > flights/__init__.py <<'INIT'\nINIT\nmkdir -p flights/core\ncat > flights/core/__init__.py\
  \ <<'CINIT'\nCINIT\ncat > flights/core/records.py <<'RECORDS'\nclass Flight:\n    def __init__(self, code, origin, dest,\
  \ duration):\n        self.code = code\n        self.origin = origin\n        self.dest = dest\n        self.duration =\
  \ duration\n\n    def __lt__(self, other):\n        return self.duration < other.duration\n\n    def __eq__(self, other):\n\
  \        return self.duration == other.duration\n\n    def __repr__(self):\n        return \"Flight(%s,%s,%s,%d)\" % (self.code,\
  \ self.origin, self.dest, self.duration)\n\n\ndef load_flights(rows):\n    return [Flight(c, o, d, int(m)) for c, o, d,\
  \ m in rows]\nRECORDS\ncat > flights/core/schedule.py <<'SCHED'\ndef binary_search_min_duration(flights, target):\n    lo,\
  \ hi = 0, len(flights) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if flights[mid].duration == target:\n\
  \            return mid\n        elif flights[mid].duration < target:\n            lo = mid + 1\n        else:\n       \
  \     hi = mid - 1\n    return -1\nSCHED\n"
goal_tr: 'flights/core/query.py dosyasini yaz; Flight nesnelerini sureye gore artan sirada tutan ve verilen hedef sureyi ikili
  aramayla bulan bir FlightIndex sinifi tanimlasin (insert metodu sirali ekleme, find metodu hedef sureyi bulup ilk eslesen
  Flight''i dondursun, bulunamazsa None).

  '
reference_solution: "cat > flights/core/query.py <<'QUERY'\nfrom flights.core.records import Flight\n\n\nclass FlightIndex:\n\
  \    def __init__(self):\n        self._flights = []\n\n    def insert(self, flight):\n        lo, hi = 0, len(self._flights)\n\
  \        while lo < hi:\n            mid = (lo + hi) // 2\n            if self._flights[mid].duration < flight.duration:\n\
  \                lo = mid + 1\n            else:\n                hi = mid\n        self._flights.insert(lo, flight)\n\n\
  \    def find(self, duration):\n        lo, hi = 0, len(self._flights) - 1\n        while lo <= hi:\n            mid = (lo\
  \ + hi) // 2\n            if self._flights[mid].duration == duration:\n                return self._flights[mid]\n     \
  \       elif self._flights[mid].duration < duration:\n                lo = mid + 1\n            else:\n                hi\
  \ = mid - 1\n        return None\n\n    def __len__(self):\n        return len(self._flights)\nQUERY\n"
outputs:
- path: flights/core/query.py
  kind: program
  run: python3 -c 'from flights.core.records import Flight; from flights.core.query import FlightIndex; idx=FlightIndex();
    rows=[("AA1","IST","ANK",70),("BB2","IST","IZM",55),("CC3","ANK","IST",70),("DD4","IZM","ANK",95),("EE5","IST","ADA",40)];
    [idx.insert(Flight(c,o,d,m)) for c,o,d,m in rows]; assert len(idx)==5; assert idx.find(95).code=="DD4"; assert idx.find(70).code
    in ("AA1","CC3"); assert idx.find(40).code=="EE5"; assert idx.find(41) is None; assert idx.find(200) is None; print("TAMAM")'
