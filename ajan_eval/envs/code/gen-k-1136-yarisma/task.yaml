id: gen-k-1136-yarisma
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16
prompt: 'cal/report.py dosyasını oluştur. Bu dosyada EventCounter adında bir sınıf tanımla; sınıfın count_by_date çıktısını
  tutan bir counts alanı olsun. Sınıf, her çağrıldığında tarihleri artan sırada tek tek döndüren bir __iter__ metodu ile iterator
  protokolünü sağlasın. Ayrıca sınıfta toplam etkinlik sayısını veren bir total() metodu bulunsun.


  Kurucu olay satırlarının listesini alsın (EventCounter(lines)); counts tarih→adet sözlüğü olsun; yineleme (tarih, adet)
  çiftleri versin.

  '
setup: "mkdir -p cal\ncat > cal/events.py <<'EVENTS'\ndef parse_events(lines):\n    out = []\n    for line in lines:\n   \
  \     line = line.strip()\n        if not line:\n            continue\n        date, kind, count = line.split('|')\n   \
  \     out.append((date, kind, int(count)))\n    return out\nEVENTS\ncat > cal/counting.py <<'COUNTING'\nfrom cal.events\
  \ import parse_events\n\n\ndef count_by_date(lines):\n    counts = {}\n    for date, kind, count in parse_events(lines):\n\
  \        counts[date] = counts.get(date, 0) + count\n    return counts\nCOUNTING\ncat > events.txt <<'TXT'\n2024-03-01|meeting|2\n\
  2024-03-01|call|1\n2024-03-02|meeting|3\n2024-03-02|call|4\n2024-03-03|meeting|1\nTXT\n"
goal_tr: 'cal/report.py dosyasini yaz; EventCounter sinifi, count_by_date ciktisini tutan bir counts alanini ve her cagrida
  tarihleri artan sirada tek tek donduren bir __iter__ metodu (iterator protokolu) saglasin; ayrica total() toplam etkinlik
  sayisini versin.

  '
reference_solution: "cat > cal/report.py <<'REPORT'\nfrom cal.counting import count_by_date\n\n\nclass EventCounter:\n   \
  \ def __init__(self, lines):\n        self.counts = count_by_date(lines)\n\n    def __iter__(self):\n        for date in\
  \ sorted(self.counts):\n            yield date, self.counts[date]\n\n    def total(self):\n        return sum(self.counts.values())\n\
  REPORT\n"
