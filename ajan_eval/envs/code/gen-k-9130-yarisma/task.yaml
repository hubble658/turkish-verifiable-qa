# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Depodaki stok dosyalarını okuyup bütçeye göre ürün seçen küçük bir araç üzerinde çalışıyoruz; geçenlerde fark ettik ki seçim mantığı bütçeyi verimli kullanmıyor ve plan çıktısı da beklediğimiz biçimde gelmiyor. Bugünün işi bunları toparlamak oldu.

  depot/picker.py dosyasındaki greedy_pick fonksiyonunu, ürünleri birim fiyatı en düşük olandan başlayacak şekilde sıralayıp bütçe elverdiği ölçüde seçim yapacak biçimde düzelt; şu anki sürümde sıralama eksik. Ayrıca depot/plan.py içindeki build_plan fonksiyonunda seçilen ürünleri birleştirirken kullanılan ayırıcı "|" yerine "," olsun, yani plan çıktısı virgülle ayrılmış tek bir satır olarak gelsin. depot/reader.py dosyasındaki okuma davranışı olduğu gibi kalsın.

setup: |
  mkdir -p depot
  cat > depot/reader.py <<'READER'
  def read_stock(path):
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              sku, qty, price = line.split(',')
              yield sku, int(qty), float(price)
  READER
  cat > depot/picker.py <<'PICKER'
  from depot.reader import read_stock


  def greedy_pick(path, budget):
      remaining = budget
      picked = []
      for sku, qty, price in read_stock(path):
          if price <= remaining:
              picked.append(sku)
              remaining = remaining - price
      return picked
  PICKER
  cat > depot/plan.py <<'PLAN'
  from depot.picker import greedy_pick


  def build_plan(path, budget):
      items = greedy_pick(path, budget)
      return "|".join(items)
  PLAN
  cat > stock.csv <<'CSV'
  bolt,5,3.0
  nut,2,1.0
  gear,1,7.0
  cam,4,2.0
  CSV

goal_tr: >
  depot/picker.py icindeki greedy_pick fonksiyonunu birim fiyati en dusuk
  urunlerden butceye gore secim yapacak sekilde duzelt (siralama eksik) ve
  depot/plan.py icindeki build_plan fonksiyonundaki birlestirme ayiricisini
  "|" yerine "," yap; boylece plan ciktisi virgulle ayrilmis olsun.

reference_solution: |
  cat > depot/picker.py <<'PICKER'
  from depot.reader import read_stock


  def greedy_pick(path, budget):
      remaining = budget
      picked = []
      rows = sorted(read_stock(path), key=lambda r: r[2])
      for sku, qty, price in rows:
          if price <= remaining:
              picked.append(sku)
              remaining = remaining - price
      return picked
  PICKER
  cat > depot/plan.py <<'PLAN'
  from depot.picker import greedy_pick


  def build_plan(path, budget):
      items = greedy_pick(path, budget)
      return ",".join(items)
  PLAN

