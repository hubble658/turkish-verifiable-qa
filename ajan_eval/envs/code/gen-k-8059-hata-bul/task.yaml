# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Sabah stok ekibinden biri geldi, depo raporlarındaki toplamların bazı siparişlerde tutmadığından söz etti; ben de örnek olarak feed.txt üzerinden bakayım dedim. Bizim günlük akışta depo tarafında sipariş toplamlarını çıkaran küçük bir modül var, ama ilk kez görülen bir sipariş numarası geldiğinde toplamın yanlış çıktığını fark ettim; A100 ve B200 gibi ilk satırlarda işler karışıyor. Bu yüzden depot/totals.py içindeki order_totals fonksiyonunu, bir sipariş numarası ilk kez görüldüğünde de toplamın doğru hesaplanacağı biçimde düzeltmeni istiyorum; sonuçta depot/report.py içindeki summarize çıktısı A100=17.5 ve B200=10.0 satırlarını vermeli.

setup: |
  mkdir -p depot
  cat > depot/events.py <<'EVENTS'
  def iter_events(stream):
      for raw in stream:
          raw = raw.strip()
          if not raw or raw.startswith("#"):
              continue
          parts = raw.split("|")
          yield {"kind": parts[0], "order": parts[1], "qty": int(parts[2]), "unit": float(parts[3])}
  EVENTS
  cat > depot/totals.py <<'TOTALS'
  from depot.events import iter_events


  def order_totals(stream):
      totals = {}
      for ev in iter_events(stream):
          if ev["kind"] == "ship":
              totals[ev["order"]] = totals[ev["order"]] + ev["qty"] * ev["unit"]
          elif ev["kind"] == "return":
              totals[ev["order"]] = totals[ev["order"]] - ev["qty"] * ev["unit"]
      return totals
  TOTALS
  cat > depot/report.py <<'REPORT'
  from depot.totals import order_totals


  def summarize(stream):
      totals = order_totals(stream)
      lines = []
      for name in sorted(totals):
          lines.append("%s=%s" % (name, totals[name]))
      return lines
  REPORT
  cat > feed.txt <<'FEED'
  # daily order feed
  ship|A100|2|3.5
  ship|B200|1|10.0
  return|A100|1|3.5
  ship|A100|4|3.5
  FEED

goal_tr: >
  depot/totals.py icindeki order_totals fonksiyonunu, bir siparis numarasi
  ilk kez goruldugunde de toplamin dogru hesaplanacagi bicimde duzelt;
  boylece depot/report.py summarize ciktisi A100=17.5 ve B200=10.0
  satirlarini versin.

reference_solution: |
  cat > depot/totals.py <<'TOTALS'
  from depot.events import iter_events


  def order_totals(stream):
      totals = {}
      for ev in iter_events(stream):
          if ev["kind"] == "ship":
              totals[ev["order"]] = totals.get(ev["order"], 0.0) + ev["qty"] * ev["unit"]
          elif ev["kind"] == "return":
              totals[ev["order"]] = totals.get(ev["order"], 0.0) - ev["qty"] * ev["unit"]
      return totals
  TOTALS

outputs:
