prompt: |
  cargo/prefix.py dosyasındaki PrefixIndex sınıfını gerçek bir trie olacak şekilde tamamla; insert, count_with_prefix ve complete metotları çalışsın. Ayrıca cargo/service.py dosyasındaki TrackingService sınıfını, kayıt kodlarını bu trie üzerinde tutacak biçimde tamamla; register, count ve suggest metotları doğru sonuç versin. count_with_prefix ve count, verilen önekle başlayan kayıt kodlarının sayısını döndürsün. complete ve suggest, verilen önekle başlayan kodları öneri olarak döndürsün ve limit ile verilen sayıdan fazlasını döndürmesin. Mevcut CargoStore ve PrefixIndex yapılarını koru; yeni dosya oluşturma, yalnızca cargo/prefix.py ve cargo/service.py üzerinde çalış.

  Şu şartlar sağlanmalı:
  - cargo/prefix.py içindeki PrefixIndex sınıfı NotImplementedError fırlatmadan çalışır durumda olmalı.
  - insert, count_with_prefix ve complete metotları trie yapısı üzerinde doğru çalışmalı.
  - count_with_prefix, verilen önekle başlayan tüm kayıt kodlarının sayısını doğru döndürmeli.
  - complete, verilen önekle başlayan kodları döndürmeli ve limit sayısını aşmamalı.
  - cargo/service.py içindeki TrackingService sınıfı NotImplementedError fırlatmadan çalışır durumda olmalı.
  - register, count ve suggest metotları CargoStore ve PrefixIndex ile doğru biçimde bağlanmalı.
  - count, count_with_prefix ile aynı sayım sonucunu vermeli; suggest, complete ile aynı öneri davranışını vermeli.
  - CargoStore ve PrefixIndex sınıflarının mevcut arayüzleri korunmalı.

