goal_tr: >
  cargo/prefix.py icindeki PrefixIndex sinifini (insert, count_with_prefix,
  complete) ve cargo/service.py icindeki TrackingService sinifini, kayit
  kodlarini bir trie uzerinde tutup onek sayimi ve onek onerisi dogru
  calisacak bicimde gerceklestir.

reference_solution: |
  cat > cargo/prefix.py <<'PREFIX'
  class PrefixIndex:
      """Maps tracking codes to a prefix tree."""

      def __init__(self):
          self._root = {}

      def insert(self, code):
          node = self._root
          for ch in code:
              node = node.setdefault(ch, {})
          node.setdefault("", None)

      def count_with_prefix(self, prefix):
          node = self._root
          for ch in prefix:
              if ch not in node:
                  return 0
              node = node[ch]
          return self._count_terminals(node)

      def _count_terminals(self, node):
          total = 1 if "" in node else 0
          for key, child in node.items():
              if key == "":
                  continue
              total += self._count_terminals(child)
          return total

      def complete(self, prefix, limit):
          node = self._root
          for ch in prefix:
              if ch not in node:
                  return []
              node = node[ch]
          out = []
          self._collect(node, prefix, out, limit)
          out.sort()
          return out[:limit]

      def _collect(self, node, acc, out, limit):
          if len(out) >= limit:
              return
          if "" in node:
              out.append(acc)
          for key in sorted(node):
              if key == "":
                  continue
              self._collect(node[key], acc + key, out, limit)
  PREFIX
  cat > cargo/service.py <<'SERVICE'
  from cargo.store import CargoStore
  from cargo.prefix import PrefixIndex


  class TrackingService:
      """Wires the store and the prefix index together."""

      def __init__(self):
          self._store = CargoStore()
          self._index = PrefixIndex()

      def register(self, code):
          self._store.add(code)
          self._index.insert(code)

      def count(self, prefix):
          return self._index.count_with_prefix(prefix)

      def suggest(self, prefix, limit):
          return self._index.complete(prefix, limit)
  SERVICE

