id: gen-k-9103-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 20

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensor/report.py ve sensor/stats.py dosyalarındaki iki fonksiyonu düzeltmen gerekiyor. sensor/report.py içindeki summarize fonksiyonu, stdin'den gelen sensör satırlarından en yüksek değerli ölçümü "ad değer" biçiminde doğru döndürmeli; boş girdi verildiğinde ise "none 0.0" dönmeli. sensor/stats.py içindeki peak fonksiyonu ise eşit değerli ölçümlerde sonuncu ölçümü seçmeli. sensor/readings.py dosyasındaki iter_samples fonksiyonu satırları ayrıştırmak için kullanılıyor, onun davranışını değiştirmene gerek yok.

setup: |
  mkdir -p sensor
  cat > sensor/readings.py <<'READINGS'
  def iter_samples(lines):
      for line in lines:
          line = line.strip()
          if not line:
              continue
          parts = line.split()
          if len(parts) != 2:
              continue
          name, value = parts
          yield name, float(value)
  READINGS
  cat > sensor/stats.py <<'STATS'
  from sensor.readings import iter_samples


  def peak(samples):
      best_name = None
      best_value = None
      for name, value in samples:
          if best_value is None or value > best_value:
              best_name = name
              best_value = value
      return best_name, best_value
  STATS
  cat > sensor/report.py <<'REPORT'
  from sensor.readings import iter_samples
  from sensor.stats import peak


  def summarize(lines):
      samples = iter_samples(lines)
      name, value = peak(samples)
      return "%s %.1f" % (name, value)
  REPORT

goal_tr: >
  sensor/report.py icindeki summarize fonksiyonunu, stdin'den gelen sensor
  satirlarindan en yuksek degerli olcumu "ad deger" biciminde dogru
  dondurecek ve bos girdide "none 0.0" donecek bicimde duzelt;
  sensor/stats.py icindeki peak fonksiyonu esit degerlerde sonuncu olcumu
  secmeli.

reference_solution: |
  cat > sensor/readings.py <<'READINGS'
  def iter_samples(lines):
      for line in lines:
          line = line.strip()
          if not line:
              continue
          parts = line.split()
          if len(parts) != 2:
              continue
          name, value = parts
          yield name, float(value)
  READINGS
  cat > sensor/stats.py <<'STATS'
  from sensor.readings import iter_samples


  def peak(samples):
      best_name = None
      best_value = None
      for name, value in samples:
          if best_value is None or value >= best_value:
              best_name = name
              best_value = value
      return best_name, best_value
  STATS
  cat > sensor/report.py <<'REPORT'
  from sensor.readings import iter_samples
  from sensor.stats import peak


  def summarize(lines):
      samples = iter_samples(lines)
      name, value = peak(samples)
      if name is None:
          return "none 0.0"
      return "%s %.1f" % (name, value)
  REPORT

ara_adim: |
  cat > sensor/stats.py <<'STATS'
  from sensor.readings import iter_samples


  def peak(samples):
      best_name = None
      best_value = None
      for name, value in samples:
          if best_value is None or value >= best_value:
              best_name = name
              best_value = value
      return best_name, best_value
  STATS

outputs:
