# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Depo sayımlarını Excel'de tutmaktan yorulduk; birkaç haftadır stok hareketlerini küçük bir Python modülüne taşımaya çalışıyoruz. Bugün de gelen-giden malzeme kayıtlarını tek bir yerden geçirmek için söylediklerimizi toparlıyorum, ama önce şu kuyruk işini bitirmemiz lazım.

  stok/queue.py içindeki FifoQueue sınıfını baştan sona doldur: FIFO kuyruğu tam olarak çalışsın. Operatör aşırı yüklemeleri de olsun; __add__, __eq__, __bool__, __iter__, __len__ ve ayrıca peek, enqueue, dequeue metotları beklendiği gibi davransın. stok/movements.py içindeki net_change fonksiyonu da bu kuyruğu kullanarak hareketlerin toplamını doğru döndürsün.

setup: |
  mkdir -p stok
  cat > stok/queue.py <<'PY'
  class FifoQueue:
      def __init__(self):
          self._items = []

      def enqueue(self, item):
          raise NotImplementedError

      def dequeue(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError

      def __iter__(self):
          raise NotImplementedError

      def __bool__(self):
          raise NotImplementedError

      def __add__(self, other):
          raise NotImplementedError

      def __eq__(self, other):
          raise NotImplementedError
  PY
  cat > stok/movements.py <<'PY'
  from stok.queue import FifoQueue


  def net_change(movements):
      q = FifoQueue()
      for kind, amount in movements:
          if kind == "in":
              q.enqueue(amount)
          elif kind == "out":
              q.enqueue(-amount)
      return sum(q)
  PY

goal_tr: >
  stok/queue.py icindeki FifoQueue sinifini, operator asiri yuklemesiyle
  (__add__, __eq__, __bool__, __iter__, __len__, peek, enqueue, dequeue)
  FIFO kuyrugunu tam olarak gerceklestirecek bicimde doldur;
  stok/movements.py icindeki net_change bu kuyrugu kullanarak hareketlerin
  toplamini dogru dondursun.

reference_solution: |
  cat > stok/queue.py <<'PY'
  class FifoQueue:
      def __init__(self):
          self._items = []

      def enqueue(self, item):
          self._items.append(item)

      def dequeue(self):
          if not self._items:
              raise IndexError("dequeue from empty queue")
          return self._items.pop(0)

      def peek(self):
          if not self._items:
              raise IndexError("peek from empty queue")
          return self._items[0]

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          return iter(list(self._items))

      def __bool__(self):
          return len(self._items) > 0

      def __add__(self, other):
          if not isinstance(other, FifoQueue):
              return NotImplemented
          merged = FifoQueue()
          merged._items = list(self._items) + list(other._items)
          return merged

      def __eq__(self, other):
          if not isinstance(other, FifoQueue):
              return NotImplemented
          return self._items == other._items

      def __repr__(self):
          return "FifoQueue(" + repr(self._items) + ")"
  PY

