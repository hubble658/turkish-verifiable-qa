  - {path: weblog/report/summary.py, kind: program, run: 'python3 -c ''from weblog.report.summary import slowest_paths as f; assert f("access.log",2)==(["/index","/about"],0), f("access.log",2); assert f("access.log",3)==(["/index","/about","/docs"],0), f("access.log",3); assert f("access.log",1)==(["/index"],0); assert f("access.log",99)==(["/index","/about","/docs"],0); print("TAMAM")'''}

