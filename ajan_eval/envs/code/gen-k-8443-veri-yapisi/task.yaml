  1) depo/raf.py dosyasındaki raf_yerlesimi fonksiyonunu tamamla; stdin'den okunan yönlü depo-raf bağlantı listesini girdi olarak alıp her depo için erişilebilen rafları genişlik-öncelikli sırada döndürsün.

  2) depo/raf.py dosyasındaki en_yakin_depo fonksiyonunu tamamla; başlangıç deposundan her rafa olan en kısa mesafeyi hesaplayıp rafları en yakından en uzağa doğru mesafeyle birlikte döndürsün.

  3) depo/akis.py dosyasındaki calistir fonksiyonunu tamamla; raf_yerlesimi ve en_yakin_depo fonksiyonlarını kullanarak girdiyi işleyip her depo için erişilebilen rafları genişlik-öncelikli sırada ve başlangıç deposundan en yakın raftan uzaga doğru mesafeyle birlikte hesaplasın.

