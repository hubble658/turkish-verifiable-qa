goal_tr: >
  depo/raf.py icindeki raf_yerlesimi ve en_yakin_depo fonksiyonlarini,
  depo/akis.py icindeki calistir fonksiyonunu da tamamlayarak, stdin'den
  okunan yonlu depo-raf baglanti listesinden her depo icin erisilebilen
  raflari genislik-oncelikli sirada ve baslangic deposundan en yakin raftan
  uzaga dogru mesafeyle birlikte hesaplayacak bicimde doldur.

reference_solution: |
  cat > depo/raf.py <<'RAF'
  from collections import deque

  from depo.graph import build_graph


  def raf_yerlesimi(text):
      edges = []
      for line in text.strip().splitlines():
          line = line.strip()
          if not line:
              continue
          src, dst = line.split("->")
          edges.append((src.strip(), dst.strip()))
      graph = build_graph(edges)
      result = {}
      for node in sorted(graph):
          seen = []
          visited = {node}
          queue = deque([node])
          while queue:
              cur = queue.popleft()
              for nxt in graph[cur]:
                  if nxt not in visited:
                      visited.add(nxt)
                      seen.append(nxt)
                      queue.append(nxt)
          result[node] = seen
      return result


  def en_yakin_depo(text, start):
      edges = []
      for line in text.strip().splitlines():
          line = line.strip()
          if not line:
              continue
          src, dst = line.split("->")
          edges.append((src.strip(), dst.strip()))
      graph = build_graph(edges)
      dist = {start: 0}
      order = []
      queue = deque([start])
      while queue:
          cur = queue.popleft()
          for nxt in graph[cur]:
              if nxt not in dist:
                  dist[nxt] = dist[cur] + 1
                  order.append((nxt, dist[nxt]))
                  queue.append(nxt)
      return order
  RAF
  cat > depo/akis.py <<'AKIS'
  import sys

  from depo.raf import raf_yerlesimi, en_yakin_depo


  def calistir(text):
      lines = text.strip().splitlines()
      if not lines:
          return ""
      start = lines[0].strip()
      body = "\n".join(lines[1:])
      out = []
      for node, raflar in raf_yerlesimi(body).items():
          out.append(node + ":" + ",".join(raflar))
      out.append("BASLANGIC " + start)
      for raf, d in en_yakin_depo(body, start):
          out.append("  " + raf + " " + str(d))
      return "\n".join(out)


  if __name__ == "__main__":
      sys.stdout.write(calistir(sys.stdin.read()))
  AKIS

