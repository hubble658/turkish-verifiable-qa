id: gen-k-6000-yarisma
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) clinic/load.py dosyasını, her ziyaretin dakikasını önceki ziyaretlerin toplamına ekleyerek ilerleyen bir önek-toplam üretecek şekilde düzelt; total alanı her adımda kümülatif olarak artmalı ve hiçbir zaman sıfırlanmamalı.

  2) clinic/report.py dosyasını, load_series'ten gelen toplamları olduğu gibi döndürecek şekilde düzelt; toplam değerine fazladan +1 eklenmemeli.

  3) clinic/visits.py dosyasındaki iter_visits fonksiyonunu olduğu gibi koru; ziyaretleri tarih, hasta ve dakika üçlüsü olarak üretmeye devam etsin.

  4) Bu düzeltmelerden sonra running_totals, verilen kayıtlar için doğru kümülatif dakika listesini döndürsün; her kayıtta date, patient ve kümülatif total alanları bulunsun.

setup: |
  mkdir -p clinic
  cat > clinic/visits.py <<'VISITS'
  def iter_visits(records):
      for day in records:
          for visit in day["visits"]:
              yield day["date"], visit["patient"], visit["minutes"]
  VISITS
  cat > clinic/load.py <<'LOAD'
  from clinic.visits import iter_visits


  def load_series(records):
      out = []
      total = 0
      for date, patient, minutes in iter_visits(records):
          total = minutes
          out.append((date, patient, total))
      return out
  LOAD
  cat > clinic/report.py <<'REPORT'
  from clinic.load import load_series


  def running_totals(records):
      series = load_series(records)
      result = []
      for date, patient, total in series:
          result.append({"date": date, "patient": patient, "total": total + 1})
      return result
  REPORT
  cat > data.py <<'DATA'
  RECORDS = [
      {"date": "2024-05-01", "visits": [
          {"patient": "ada", "minutes": 10},
          {"patient": "bob", "minutes": 5},
      ]},
      {"date": "2024-05-02", "visits": [
          {"patient": "cy", "minutes": 20},
      ]},
  ]
  DATA

goal_tr: >
  clinic paketindeki uc modulu duzelt: load.py her ziyaretin dakikasini
  oncekilerle toplayan bir onek-toplam uretsin (total alani kumulatif olsun,
  sifirlanmasin), report.py ise bu toplamlari oldugu gibi dondursun
  (fazladan +1 eklemesin); boylece running_totals dogru kumulatif dakika
  listesini versin.

reference_solution: |
  cat > clinic/load.py <<'LOAD'
  from clinic.visits import iter_visits


  def load_series(records):
      out = []
      total = 0
      for date, patient, minutes in iter_visits(records):
          total += minutes
          out.append((date, patient, total))
      return out
  LOAD
  cat > clinic/report.py <<'REPORT'
  from clinic.load import load_series


  def running_totals(records):
      series = load_series(records)
      result = []
      for date, patient, total in series:
          result.append({"date": date, "patient": patient, "total": total})
      return result
  REPORT

