split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) arena/board.py dosyasındaki ScoreBoard sınıfını, add çağrıldığında yeni puanı tabloya ekleyecek şekilde düzelt; mevcut puanın üzerine yazmasın.

  2) Sıralama ve lider sorgularının bu toplam puana göre doğru sonuç döndürmesini sağla.

setup: |
  mkdir -p arena
  cat > arena/scores.py <<'SCORES'
  def load_scores(path):
      table = {}
      with open(path) as f:
          for line in f:
              line = line.strip()
              if not line:
                  continue
              name, value = line.split(',')
              table[name] = int(value)
      return table


  def best_player(table):
      return max(table, key=lambda n: table[n])
  SCORES
  cat > arena/board.py <<'BOARD'
  from arena.scores import load_scores, best_player


  class ScoreBoard:
      def __init__(self, path):
          self.table = load_scores(path)

      def add(self, name, points):
          if name in self.table:
              self.table[name] = points
          else:
              self.table[name] = points

      def total(self):
          return sum(self.table.values())

      def leader(self):
          return best_player(self.table)

      def ranked(self):
          return sorted(self.table, key=lambda n: self.table[n], reverse=True)
  BOARD
  cat > arena/__init__.py <<'INIT'
  INIT
  cat > scores.txt <<'DATA'
  ada,30
  bora,55
  can,20
  DATA

goal_tr: >
  arena/board.py icindeki ScoreBoard sinifini, add cagrildiginda yeni puani
  tabloya EKLEYECEK (mevcut puanin uzerine yazmayacak) ve siralama ile lider
  sorgularini bu toplam puana gore dogru dondurecek bicimde duzelt.

reference_solution: |
  cat > arena/board.py <<'BOARD'
  from arena.scores import load_scores, best_player


  class ScoreBoard:
      def __init__(self, path):
          self.table = load_scores(path)

      def add(self, name, points):
          if name in self.table:
              self.table[name] += points
          else:
              self.table[name] = points

      def total(self):
          return sum(self.table.values())

      def leader(self):
          return best_player(self.table)

      def ranked(self):
          return sorted(self.table, key=lambda n: self.table[n], reverse=True)
  BOARD

