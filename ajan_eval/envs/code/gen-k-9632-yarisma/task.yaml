# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) clinic/records.py, clinic/schedule.py ve clinic/report.py dosyalarının bulunduğu yapıyı koruyarak, randevu defterine kayıtların gerçekleşme sırasına göre değil, ters sıralamayla işlenmesine neden olan sorunu gider; deftere işlenen kayıtlar öncelik değeri büyük olan hastalar önce gelecek, öncelik değerleri eşit olduğunda ise daha önce başvuran hasta önce gelecek biçimde sıralansın.

  2) clinic/report.py içinde döndürülen hasta listesi, bu doğru sıralamayı yansıtacak şekilde üretilsin; liste ters sıralanmış kayıtlardan değil, öncelik ve başvuru sırasına göre doğru biçimde sıralanmış kayıtlardan oluşsun.

  3) clinic/records.py ve clinic/schedule.py dosyalarındaki mevcut yapıyı bozmadan, gerekli düzeltmeler yalnızca bu üç dosya üzerinde yapılsın; başka dosya ya da dizin oluşturulmasın.

setup: |
  mkdir -p clinic
  cat > clinic/records.py <<'REC'
  class Record:
      def __init__(self, patient, slot, priority):
          self.patient = patient
          self.slot = slot
          self.priority = priority


  class RecordBook:
      def __init__(self):
          self._by_patient = {}

      def add(self, record):
          self._by_patient[record.patient] = record

      def get(self, patient):
          return self._by_patient.get(patient)

      def patients(self):
          return list(self._by_patient.keys())
  REC
  cat > clinic/schedule.py <<'SCH'
  from clinic.records import Record


  class Schedule:
      def __init__(self):
          self._stack = []

      def push(self, patient, slot, priority):
          self._stack.append(Record(patient, slot, priority))

      def pop(self):
          return self._stack.pop()

      def is_empty(self):
          return not self._stack
  SCH
  cat > clinic/report.py <<'REP'
  from clinic.records import RecordBook
  from clinic.schedule import Schedule


  def build_schedule(book, requests):
      sched = Schedule()
      for patient, slot, priority in requests:
          sched.push(patient, slot, priority)
      return sched


  def finalize(book, requests):
      sched = build_schedule(book, requests)
      order = []
      while not sched.is_empty():
          rec = sched.pop()
          book.add(rec)
          order.append(rec.patient)
      return order
  REP

goal_tr: >
  Randevu defterindeki kayitlar gerceklesme sirasina gore degil, en son
  alinan randevu en once olacak bicimde ters siralaniyor; bunu duzelt ki
  oncelik degeri buyuk olan hastalar once, esitlikte ise once basvuran once
  olacak sekilde deftere islensin ve dondurulen hasta listesi bu dogru
  siralamayla uretilsin.

reference_solution: |
  cat > clinic/records.py <<'REC'
  class Record:
      def __init__(self, patient, slot, priority):
          self.patient = patient
          self.slot = slot
          self.priority = priority


  class RecordBook:
      def __init__(self):
          self._by_patient = {}

      def add(self, record):
          self._by_patient[record.patient] = record

      def get(self, patient):
          return self._by_patient.get(patient)

      def patients(self):
          return list(self._by_patient.keys())
  REC
  cat > clinic/schedule.py <<'SCH'
  from clinic.records import Record


  class Schedule:
      def __init__(self):
          self._stack = []

      def push(self, patient, slot, priority):
          self._stack.append(Record(patient, slot, priority))

      def pop(self):
          return self._stack.pop()

      def is_empty(self):
          return not self._stack

      def ordered(self):
          return sorted(self._stack, key=lambda r: (-r.priority, r.slot))
  SCH
  cat > clinic/report.py <<'REP'
  from clinic.records import RecordBook
  from clinic.schedule import Schedule


  def build_schedule(book, requests):
      sched = Schedule()
      for patient, slot, priority in requests:
          sched.push(patient, slot, priority)
      return sched


  def finalize(book, requests):
      sched = build_schedule(book, requests)
      order = []
      for rec in sched.ordered():
          book.add(rec)
          order.append(rec.patient)
      return order
  REP

