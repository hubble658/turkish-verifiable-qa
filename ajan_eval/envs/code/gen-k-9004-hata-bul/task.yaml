# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  stok/isleyici.py dosyasındaki hareketleri_uygula fonksiyonunda, hareketlerin işlenmesini yarıda kesen erken dönüşü kaldır; fonksiyon tüm hareketleri uyguladıktan sonra depoyu döndürsün. Ardından stok/rapor.py dosyasındaki stok_ozeti fonksiyonunda B2 miktarının yanlışlıkla bir fazla hesaplanmasına yol açan hatayı gider; dönen sözlükte B2 değeri depodaki gerçek miktarı yansıtmalı. stok/depo.py dosyasındaki Depo sınıfı ve satirlari_oku fonksiyonu ise olduğu gibi korunsun.

setup: |
  mkdir -p stok
  cat > stok/depo.py <<'DEPO'
  class Depo:
      def __init__(self):
          self._kayitlar = {}

      def ekle(self, kod, adet):
          self._kayitlar[kod] = self._kayitlar.get(kod, 0) + adet

      def cikar(self, kod, adet):
          self._kayitlar[kod] = self._kayitlar.get(kod, 0) - adet

      def miktar(self, kod):
          return self._kayitlar.get(kod, 0)


  def satirlari_oku(yol):
      kayitlar = []
      with open(yol) as f:
          for satir in f:
              satir = satir.strip()
              if not satir:
                  continue
              kod, islem, adet = satir.split(",")
              kayitlar.append((kod, islem, int(adet)))
      return kayitlar
  DEPO
  cat > stok/isleyici.py <<'ISLEYICI'
  from stok.depo import Depo, satirlari_oku


  def hareketleri_uygula(depo, kayitlar):
      for kod, islem, adet in kayitlar:
          if islem == "giris":
              depo.ekle(kod, adet)
          elif islem == "cikis":
              depo.cikar(kod, adet)
              return depo
      return depo


  def dosyadan_yukle(yol):
      depo = Depo()
      kayitlar = satirlari_oku(yol)
      return hareketleri_uygula(depo, kayitlar)
  ISLEYICI
  cat > stok/rapor.py <<'RAPOR'
  from stok.isleyici import dosyadan_yukle


  def stok_ozeti(yol):
      depo = dosyadan_yukle(yol)
      return {"A1": depo.miktar("A1"), "B2": depo.miktar("B2") + 1}
  RAPOR
  cat > hareketler.csv <<'CSV'
  A1,giris,10
  B2,giris,5
  A1,cikis,3
  B2,cikis,5
  A1,giris,2
  CSV

goal_tr: >
  stok/isleyici.py icindeki hareketleri_uygula fonksiyonundaki erken donusu
  kaldirip tum hareketleri isledikten sonra depoyu dondur; ardindan
  stok/rapor.py icindeki stok_ozeti fonksiyonunun B2 miktarini yanlislikla
  bir artirmasini duzelt.

