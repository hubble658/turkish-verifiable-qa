# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) bank/stream.py dosyasındaki hatayı gider; running_balance fonksiyonu her hesap için kendi bakiyesini ayrı ayrı takip etsin ve hesap adlarını bakiye değerlerine eşleyen doğru bir sözlük döndürsün.

  2) bank/report.py dosyasındaki hatayı gider; final_balances fonksiyonu verilen hesap adının bakiye değerini döndürsün.

  3) bank/ledger.py dosyasını, bu iki dosyanın ihtiyaç duyduğu yardımcı işlevi sağlayacak şekilde düzelt.

setup: |
  mkdir -p bank
  cat > bank/ledger.py <<'LEDGER'
  def make_counter(start=0):
      state = {"value": start}

      def bump(amount):
          state["value"] += amount
          return state["value"]

      return bump
  LEDGER
  cat > bank/stream.py <<'STREAM'
  from bank.ledger import make_counter


  def running_balance(chunks):
      bump = make_counter(0)
      totals = {}
      for chunk in chunks:
          for line in chunk.splitlines():
              if not line.strip():
                  continue
              account, amount = line.split(",")
              totals[account] = bump(int(amount))
      return totals
  STREAM
  cat > bank/report.py <<'REPORT'
  from bank.stream import running_balance


  def final_balances(chunks, account):
      totals = running_balance(chunks)
      return totals["account"]
  REPORT
  cat > chunks.txt <<'CHUNKS'
  alice,100
  bob,50
  alice,-30
  bob,20
  alice,10
  CHUNKS

goal_tr: >
  bank/stream.py ve bank/report.py icindeki hatalari gider; running_balance
  her hesap icin kendi bakiyesini ayri takip edip dogru sozluk dondursun ve
  final_balances verilen hesap adinin bakiye degerini dondursun.

reference_solution: |
  cat > bank/stream.py <<'STREAM'
  from bank.ledger import make_counter


  def running_balance(chunks):
      counters = {}
      for chunk in chunks:
          for line in chunk.splitlines():
              if not line.strip():
                  continue
              account, amount = line.split(",")
              if account not in counters:
                  counters[account] = make_counter(0)
              counters[account](int(amount))
      return {account: counter(0) for account, counter in counters.items()}
  STREAM
  cat > bank/report.py <<'REPORT'
  from bank.stream import running_balance


  def final_balances(chunks, account):
      totals = running_balance(chunks)
      return totals[account]
  REPORT

