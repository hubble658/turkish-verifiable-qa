# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) bank/audit.py dosyasındaki net_change fonksiyonunu, bir hesabın açılış kaydı ve tüm hareketleri sonunda oluşan net değişimi doğru hesaplayacak biçimde düzelt. Net değişimde açılış ve yatırma bakiyeyi artırsın, çekme azaltsın.

  2) Düzeltmeyi yalnızca bank/audit.py içinde yap; bank/ledger.py dosyasına dokunma.

  3) Değişiklikten sonra net_change fonksiyonunun açılış kaydını da hesaba kattığını doğrula.

setup: |
  mkdir -p bank
  cat > bank/ledger.py <<'LEDGER'
  class LedgerError(Exception):
      pass


  class UnknownAccount(LedgerError):
      pass


  class InsufficientFunds(LedgerError):
      pass


  class Ledger:
      def __init__(self):
          self._balances = {}
          self._history = {}

      def open(self, account, amount):
          if account in self._balances:
              raise LedgerError("already open: %s" % account)
          self._balances[account] = amount
          self._history[account] = [("open", amount)]

      def deposit(self, account, amount):
          if account not in self._balances:
              raise UnknownAccount(account)
          self._balances[account] += amount
          self._history[account].append(("deposit", amount))

      def withdraw(self, account, amount):
          if account not in self._balances:
              raise UnknownAccount(account)
          if amount > self._balances[account]:
              raise InsufficientFunds(account)
          self._balances[account] -= amount
          self._history[account].append(("withdraw", amount))

      def balance(self, account):
          if account not in self._balances:
              raise UnknownAccount(account)
          return self._balances[account]

      def history(self, account):
          if account not in self._balances:
              raise UnknownAccount(account)
          return list(self._history[account])
  LEDGER
  cat > bank/audit.py <<'AUDIT'
  from bank.ledger import Ledger, UnknownAccount, InsufficientFunds


  def net_change(ledger, account):
      total = 0
      for kind, amount in ledger.history(account):
          if kind == "deposit":
              total = total + amount
          elif kind == "withdraw":
              total = total - amount
      return total


  def replay(ledger, account):
      running = 0
      for kind, amount in ledger.history(account):
          running += amount
          yield kind, amount, running
  AUDIT

goal_tr: >
  bank/audit.py icindeki net_change fonksiyonunu, bir hesabin acilis kaydi
  ve tum hareketleri sonunda olusan net degisimi (acilis ve yatirma artirir,
  cekme azaltir) dogru hesaplayacak bicimde duzelt.

reference_solution: |
  cat > bank/audit.py <<'AUDIT'
  from bank.ledger import Ledger, UnknownAccount, InsufficientFunds


  def net_change(ledger, account):
      total = 0
      for kind, amount in ledger.history(account):
          if kind == "open":
              total = total + amount
          elif kind == "deposit":
              total = total + amount
          elif kind == "withdraw":
              total = total - amount
      return total


  def replay(ledger, account):
      running = 0
      for kind, amount in ledger.history(account):
          running += amount
          yield kind, amount, running
  AUDIT

