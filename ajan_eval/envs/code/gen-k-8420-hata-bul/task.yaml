# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Bugün ekipçe takvim verileriyle ilgili bir sorunu konuşuyorduk; toplantı notlarını günlere göre tarayan küçük bir araç yazmışız ama sonuçlar bir türlü beklendiği gibi çıkmıyor. Öğleden sonra da planner klasöründeki koda tekrar bakarken, bazı kelimelerin birden fazla günde geçtiğini ama aracın bunların yalnızca ilkini gördüğünü fark ettik. Bu yüzden planner/schedule.py dosyasındaki days_containing fonksiyonunu düzeltmeni istiyorum: EventStream üzerinde gezerken verilen anahtar kelimeyi içeren tüm günleri, artan sırayla döndürsün. Diğer dosyalara ve fonksiyonlara dokunma, sadece bu fonksiyonun davranışı düzelsin.

setup: |
  mkdir -p planner
  cat > planner/events.py <<'EVENTS'
  def load_events(path):
      events = []
      with open(path, "r", encoding="utf-8") as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              day, title = line.split("|", 1)
              events.append((int(day), title))
      return events


  class EventStream:
      def __init__(self, path):
          self._events = load_events(path)
          self._index = 0

      def __iter__(self):
          return self

      def __next__(self):
          if self._index >= len(self._events):
              raise StopIteration
          item = self._events[self._index]
          self._index += 1
          return item


  def iter_days(path):
      return EventStream(path)
  EVENTS
  cat > planner/schedule.py <<'SCHEDULE'
  from planner.events import iter_days


  def group_by_day(path):
      grouped = {}
      for day, title in iter_days(path):
          grouped.setdefault(day, []).append(title)
      return grouped


  def first_day_with(path, keyword):
      for day, title in iter_days(path):
          if keyword in title:
              return day
      return None


  def days_containing(path, keyword):
      result = []
      for day, title in iter_days(path):
          if keyword in title:
              result.append(day)
              return result
      return result
  SCHEDULE
  cat > events.txt <<'DATA'
  3|team sync
  3|design review
  5|retro
  7|design workshop
  7|team lunch
  DATA

goal_tr: >
  planner/schedule.py icindeki days_containing fonksiyonunu, EventStream
  uzerinde gezerken verilen anahtar kelimeyi iceren TUM gunleri artan sirada
  dondurecek bicimde duzelt.

reference_solution: |
  cat > planner/schedule.py <<'SCHEDULE'
  from planner.events import iter_days


  def group_by_day(path):
      grouped = {}
      for day, title in iter_days(path):
          grouped.setdefault(day, []).append(title)
      return grouped


  def first_day_with(path, keyword):
      for day, title in iter_days(path):
          if keyword in title:
              return day
      return None


  def days_containing(path, keyword):
      result = []
      for day, title in iter_days(path):
          if keyword in title:
              result.append(day)
      return result
  SCHEDULE

