  callcenter/queue/store.py içindeki CallQueue sınıfını bir öncelik kuyruğu olarak gerçekleştir; yüksek öncelikli arayan önce çıkar, aynı öncelikte olanlar geliş sırasını korusun. Kuyrukta enqueue, dequeue, peek, size ve pending işlemleri çalışsın. Ayrıca callcenter/queue/stream.py içindeki drain ve batches fonksiyonlarını bu kuyruğu tüketen generator olarak yaz; drain kuyruk boşalana kadar sırayla eleman üretsin, batches ise elemanları verilen boyutta gruplar halinde üretsin.

