goal_tr: >
  callcenter/queue/store.py icindeki CallQueue sinifini oncelik kuyrugu
  olarak gerceklestir (yuksek oncelik once cikar, ayni oncelikte gelis
  sirasi korunur) ve callcenter/queue/stream.py icindeki drain ile batches
  fonksiyonlarini bu kuyrugu tuketen generator olarak yaz.

reference_solution: |
  cat > callcenter/queue/store.py <<'PY'
  import heapq


  class CallQueue:
      def __init__(self):
          self._heap = []
          self._counter = 0

      def enqueue(self, caller, priority):
          heapq.heappush(self._heap, (-priority, self._counter, caller))
          self._counter += 1

      def dequeue(self):
          if not self._heap:
              raise IndexError("empty queue")
          return heapq.heappop(self._heap)[2]

      def peek(self):
          if not self._heap:
              raise IndexError("empty queue")
          return self._heap[0][2]

      def size(self):
          return len(self._heap)

      def pending(self):
          return [item[2] for item in sorted(self._heap)]
  PY
  cat > callcenter/queue/stream.py <<'PY'
  from callcenter.queue.store import CallQueue


  def drain(queue):
      while queue.size() > 0:
          yield queue.dequeue()


  def batches(queue, size):
      batch = []
      for caller in drain(queue):
          batch.append(caller)
          if len(batch) == size:
              yield batch
              batch = []
      if batch:
          yield batch
  PY

