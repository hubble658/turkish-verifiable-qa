prompt: |
  sensor/store.py, sensor/reader.py ve sensor/pipeline.py içindeki NotImplementedError'ları doldur; LRUStore kapasite sınırlı en-son-kullanılan önbellek, SeriesReader boş parçada EmptyChunkError, Pipeline feed ve last ile çalışsın. run_pipeline.py çıktısı 6 olsun.

setup: |
  mkdir -p sensor
  cat > sensor/errors.py <<'ERR'
  class SensorError(Exception):
      pass


  class StreamError(SensorError):
      pass


  class ChunkError(StreamError):
      pass


  class EmptyChunkError(ChunkError):
      pass
  ERR
  cat > sensor/store.py <<'STORE'
  from collections import OrderedDict


  class LRUStore:
      def __init__(self, capacity):
          raise NotImplementedError

      def get(self, key):
          raise NotImplementedError

      def put(self, key, value):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError
  STORE
  cat > sensor/reader.py <<'READER'
  from sensor.store import LRUStore
  from sensor.errors import EmptyChunkError


  class SeriesReader:
      def __init__(self, chunks, capacity):
          raise NotImplementedError

      def read(self):
          raise NotImplementedError
  READER
  cat > sensor/pipeline.py <<'PIPE'
  from sensor.store import LRUStore
  from sensor.reader import SeriesReader
  from sensor.errors import ChunkError


  class Pipeline:
      def __init__(self, capacity):
          raise NotImplementedError

      def feed(self, chunks):
          raise NotImplementedError

      def last(self, key):
          raise NotImplementedError
  PIPE
  cat > run_pipeline.py <<'MAIN'
  from sensor.pipeline import Pipeline
  from sensor.errors import SensorError


  def main():
      chunks = [
          [("a", 1), ("b", 2)],
          [("a", 3), ("c", 4)],
          [("b", 5), ("a", 6)],
      ]
      pipe = Pipeline(capacity=2)
      pipe.feed(chunks)
      try:
          print(pipe.last("a"))
      except SensorError as exc:
          print("error:", type(exc).__name__)


  if __name__ == "__main__":
      main()
  MAIN

goal_tr: >
  sensor/store.py, sensor/reader.py ve sensor/pipeline.py dosyalarindaki
  NotImplementedError govdelerini; LRUStore kapasite sinirli
  en-son-kullanilan onbellegi, SeriesReader parcali akisi okuyup bos parca
  geldiginde EmptyChunkError firlatmayi, Pipeline ise ortak LRUStore
  uzerinden feed ve last ile son degerleri verecek sekilde gerceklestir;
  run_pipeline.py ciktisi 6 olsun.

reference_solution: |
  cat > sensor/store.py <<'STORE'
  from collections import OrderedDict


  class LRUStore:
      def __init__(self, capacity):
          if capacity <= 0:
              raise ValueError("capacity must be positive")
          self.capacity = capacity
          self._data = OrderedDict()

      def get(self, key):
          if key not in self._data:
              return None
          self._data.move_to_end(key)
          return self._data[key]

      def put(self, key, value):
          if key in self._data:
              self._data.move_to_end(key)
          self._data[key] = value
          while len(self._data) > self.capacity:
              self._data.popitem(last=False)

      def __len__(self):
          return len(self._data)
  STORE
  cat > sensor/reader.py <<'READER'
  from sensor.store import LRUStore
  from sensor.errors import EmptyChunkError


  class SeriesReader:
      def __init__(self, chunks, capacity):
          self.chunks = chunks
          self.store = LRUStore(capacity)

      def read(self):
          for chunk in self.chunks:
              if not chunk:
                  raise EmptyChunkError("empty chunk")
              for key, value in chunk:
                  self.store.put(key, value)
          return self.store
  READER
  cat > sensor/pipeline.py <<'PIPE'
  from sensor.store import LRUStore
  from sensor.reader import SeriesReader
  from sensor.errors import ChunkError


  class Pipeline:
      def __init__(self, capacity):
          self.capacity = capacity
          self.store = LRUStore(capacity)

      def feed(self, chunks):
          reader = SeriesReader(chunks, self.capacity)
          try:
              self.store = reader.read()
          except ChunkError:
              raise
          return self

      def last(self, key):
          return self.store.get(key)
  PIPE

