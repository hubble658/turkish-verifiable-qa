split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) plans/billing.py dosyasındaki Billing sınıfını, abonelik yığınını doğru yöneten durumlu bir sınıf olacak biçimde düzelt.

  2) subscribe metodu, abone olunan planın fiyatını plans/registry.py üzerinden kaydetsin.

  3) undo_last metodu, en son eklenen planı hem fiyat kaydından hem de yığından çıkarsın.

  4) active metodu, kalan planları eklenme sırasında döndürsün.

setup: |
  mkdir -p plans
  cat > plans/registry.py <<'REG'
  class PlanRegistry:
      def __init__(self):
          self._plans = {}

      def register(self, name, price):
          self._plans[name] = price

      def price_of(self, name):
          return self._plans[name]

      def names(self):
          return sorted(self._plans)
  REG
  cat > plans/billing.py <<'BILL'
  from plans.registry import PlanRegistry


  class Billing:
      def __init__(self):
          self.registry = PlanRegistry()
          self._stack = []

      def subscribe(self, plan):
          self.registry.register(plan, len(self.registry.names()))
          self._stack.append(plan)

      def undo_last(self):
          if self._stack:
              self._stack.pop()

      def active(self):
          return list(self._stack)
  BILL
  cat > plans/__init__.py <<'INIT'
  INIT

goal_tr: >
  plans/billing.py icindeki Billing sinifini, abonelik yiginini dogru
  yoneten bir durumlu sinif olacak bicimde duzelt: subscribe planin fiyatini
  plans/registry.py uzerinden kaydetsin, undo_last en son eklenen plani hem
  fiyat kaydindan hem yigindan cikarsin, active kalan planlari eklenme
  sirasinda dondursun.

reference_solution: |
  cat > plans/billing.py <<'BILL'
  from plans.registry import PlanRegistry


  class Billing:
      def __init__(self):
          self.registry = PlanRegistry()
          self._stack = []

      def subscribe(self, plan, price):
          self.registry.register(plan, price)
          self._stack.append(plan)

      def undo_last(self):
          if self._stack:
              plan = self._stack.pop()
              self.registry.remove(plan)

      def active(self):
          return list(self._stack)
  BILL
  cat > plans/registry.py <<'REG'
  class PlanRegistry:
      def __init__(self):
          self._plans = {}

      def register(self, name, price):
          self._plans[name] = price

      def remove(self, name):
          self._plans.pop(name, None)

      def price_of(self, name):
          return self._plans[name]

      def names(self):
          return sorted(self._plans)
  REG

