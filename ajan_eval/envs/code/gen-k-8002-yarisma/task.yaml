# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  weblog/analyzer.py dosyasını oluştur. Bu dosyada, weblog/records.py içindeki PathCounter soyut protokolünü somutlaştıran bir DailyCounter sınıfı tanımla. DailyCounter, add metoduyla verilen yolu saysın ve best metoduyla en çok istenen yolu döndürsün; sayılar eşit olduğunda alfabetik olarak küçük olan yol kazansın. Ayrıca analyzer.py içinde en_popular_paths fonksiyonunu tanımla; bu fonksiyon iç içe sözlük yapısını (gün -> yol -> durum listesi) alsın, her gün için bir DailyCounter kullansın ve gün gün biriken sayaçlarla {gün: yol} biçiminde bir sözlük döndürsün.

setup: |
  mkdir -p weblog
  cat > weblog/records.py <<'REC'
  from abc import ABC, abstractmethod


  class PathCounter(ABC):
      """Soyut protokol: her gun icin yol sayimini tutan sayac."""

      @abstractmethod
      def add(self, path, status):
          raise NotImplementedError

      @abstractmethod
      def best(self):
          raise NotImplementedError


  class LogRecord:
      __slots__ = ("path", "status")

      def __init__(self, path, status):
          self.path = path
          self.status = status


  def parse_lines(lines):
      out = []
      for line in lines:
          line = line.strip()
          if not line:
              continue
          path, status = line.split(" ")
          out.append(LogRecord(path, int(status)))
      return out
  REC
  cat > weblog/nested.py <<'NEST'
  def group_by_day(records_by_day):
      """records_by_day: {day: [LogRecord, ...]} -> {day: {path: [status,...]}}"""
      grouped = {}
      for day, records in records_by_day.items():
          by_path = {}
          for rec in records:
              by_path.setdefault(rec.path, []).append(rec.status)
          grouped[day] = by_path
      return grouped
  NEST

goal_tr: >
  weblog/analyzer.py dosyasini yaz: weblog/records.py icindeki PathCounter
  soyut protokolunu somutlastiran bir DailyCounter sinifi tanimla (add ile
  yolu say, best ile en cok istenen yolu dondur, esitlikte alfabetik kucuk
  kazanir) ve ic ice sozluk yapisini (gun -> yol -> durum listesi) alip her
  gun icin bir DailyCounter kullanan, gun gun biriken sayaclarla {gun: yol}
  donduren en_popular_paths fonksiyonunu tanimla.

reference_solution: |
  cat > weblog/analyzer.py <<'AN'
  from weblog.records import PathCounter


  class DailyCounter(PathCounter):
      def __init__(self):
          self._counts = {}

      def add(self, path, status):
          self._counts[path] = self._counts.get(path, 0) + 1

      def best(self):
          best_path = None
          best_count = -1
          for path in sorted(self._counts):
              if self._counts[path] > best_count:
                  best_count = self._counts[path]
                  best_path = path
          return best_path


  def en_popular_paths(grouped):
      popular = {}
      for day in sorted(grouped):
          counter = DailyCounter()
          for path in sorted(grouped[day]):
              for status in grouped[day][path]:
                  counter.add(path, status)
          popular[day] = counter.best()
      return popular
  AN

