id: gen-k-8049-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  weblog/stats.py içindeki error_hosts fonksiyonunu düzelt: status >= 400 olan tüm kayıtların ana bilgisayar adlarını ilk görülme sırasına göre tekrarsız döndürsün, erken dönüş yapmasın.

setup: |
  mkdir -p weblog
  cat > weblog/records.py <<'RECORDS'
  from dataclasses import dataclass


  @dataclass
  class Access:
      host: str
      path: str
      status: int
      bytes_sent: int

      @classmethod
      def from_line(cls, line):
          host, path, status, size = line.split(" ")
          return cls(host, path, int(status), int(size))
  RECORDS
  cat > weblog/stats.py <<'STATS'
  from weblog.records import Access


  def load(text):
      return [Access.from_line(ln) for ln in text.strip().splitlines()]


  def error_hosts(records):
      seen = []
      for rec in records:
          if rec.status >= 400:
              if rec.host not in seen:
                  seen.append(rec.host)
              return seen
      return seen
  STATS
  cat > weblog/report.py <<'REPORT'
  from weblog.stats import load, error_hosts


  def summarize(text):
      records = load(text)
      hosts = error_hosts(records)
      return {
          "total": len(records),
          "errors": len(hosts),
          "hosts": hosts,
      }
  REPORT

goal_tr: >
  weblog/stats.py icindeki error_hosts fonksiyonunu duzelt: status >= 400
  olan TUM kayitlarin ana bilgisayar adlarini ilk gorulme sirasina gore
  tekrarsiz dondursun; erken donus yapmasin.

reference_solution: |
  cat > weblog/stats.py <<'STATS'
  from weblog.records import Access


  def load(text):
      return [Access.from_line(ln) for ln in text.strip().splitlines()]


  def error_hosts(records):
      seen = []
      for rec in records:
          if rec.status >= 400:
              if rec.host not in seen:
                  seen.append(rec.host)
      return seen
  STATS

