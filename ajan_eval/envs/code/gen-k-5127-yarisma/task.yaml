  arena/pipeline.py içindeki build_round_reader, verilen metin akışından satır satır okuyup her `round` bloğunu {"round": int, "scores": {isim: puan}} sözlüğüne çevirsin ve bonusları arena/score/rules.py kurallarıyla uygulasın. Dönen closure her çağrıldığında bir sonraki bloğu döndürsün, blok kalmayınca StopIteration yükseltsin.

