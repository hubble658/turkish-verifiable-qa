goal_tr: >
  arena/pipeline.py icindeki build_round_reader fonksiyonunu, verilen metin
  akisindan satir satir okuyup her `round` blogunu {"round": int, "scores":
  {isim: puan}} sozlugune ceviren ve bonuslari arena/score/rules.py
  kurallariyla uygulayan bir closure dondurecek bicimde yaz; closure her
  cagrildiginda bir sonraki blogu dondursun, blok kalmayinca StopIteration
  yukseltsin.

reference_solution: |
  cat > arena/pipeline.py <<'PY'
  from arena.parse.tokens import tokenize
  from arena.score.rules import base_points, apply_bonus


  def build_round_reader(stream):
      """Return a closure that yields one parsed round dict per call."""
      pending = []

      for raw in stream:
          line = raw.strip()
          if not line:
              continue
          tokens = tokenize(line)
          if not tokens:
              continue
          pending.append(tokens)

      index = [0]

      def next_round():
          while index[0] < len(pending):
              tokens = pending[index[0]]
              index[0] += 1
              if tokens[0][0] != 'round':
                  continue
              number = int(tokens[0][1])
              scores = {}
              for kind, payload in tokens[1:]:
                  if kind == 'player':
                      name, _, place = payload.partition('=')
                      scores[name.strip()] = base_points(int(place))
                  elif kind == 'bonus':
                      name, _, amount = payload.partition('=')
                      name = name.strip()
                      if name in scores:
                          scores[name] = apply_bonus(scores[name], int(amount))
                      else:
                          scores[name] = apply_bonus(0, int(amount))
              return {"round": number, "scores": scores}
          raise StopIteration

      return next_round
  PY

