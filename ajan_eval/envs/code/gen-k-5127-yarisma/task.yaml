  def tokenize(line):
      """Split a raw log line into (kind, payload) tokens.

      Kinds: 'round', 'player', 'bonus', 'end'.
      """
      out = []
      for chunk in line.split(';'):
          chunk = chunk.strip()
          if not chunk:
              continue
          head, _, rest = chunk.partition(':')
          out.append((head.strip(), rest.strip()))
      return out
  PY
