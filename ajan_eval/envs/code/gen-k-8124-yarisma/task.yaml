prompt: |
  maintenance/policy.py içindeki MaintenancePolicy sınıfına, verilen bütçeyi aşmadan en çok saat bakım yapılacak makineleri seçen bir select metodu ekle. Seçim (machine, hours) ikililerinden oluşan liste olsun ve saat/cost oranı büyükten küçüğe sıralansın.

setup: |
  mkdir -p maintenance
  cat > maintenance/records.py <<'RECORDS'
  def load_records(path):
      rows = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              machine, hours, cost = line.split(',')
              rows.append((machine, int(hours), int(cost)))
      return rows
  RECORDS
  cat > maintenance/policy.py <<'POLICY'
  from maintenance.records import load_records


  class MaintenancePolicy:
      def __init__(self, path, budget):
          self.records = load_records(path)
          self.budget = budget

      def select(self):
          raise NotImplementedError
  POLICY
  cat > maintenance/schedule.py <<'SCHEDULE'
  from maintenance.policy import MaintenancePolicy


  def build_schedule(path, budget):
      policy = MaintenancePolicy(path, budget)
      return policy.select()
  SCHEDULE
  cat > machines.txt <<'DATA'
  press,4,30
  lathe,7,10
  mill,2,25
  drill,9,5
  DATA

goal_tr: >
  maintenance/policy.py icindeki MaintenancePolicy sinifina, verilen butceyi
  asmadan en cok saat bakim yapilacak makineleri acgozlu secen select
  metodunu yaz; secim (machine, hours) ikililerinin listesi olsun ve
  saat/cost orani buyuk olandan kucuge dogru sirala.

reference_solution: |
  cat > maintenance/policy.py <<'POLICY'
  from maintenance.records import load_records


  class MaintenancePolicy:
      def __init__(self, path, budget):
          self.records = load_records(path)
          self.budget = budget

      def select(self):
          ranked = sorted(
              self.records,
              key=lambda r: r[1] / r[2],
              reverse=True,
          )
          chosen = []
          remaining = self.budget
          for machine, hours, cost in ranked:
              if cost <= remaining:
                  chosen.append((machine, hours))
                  remaining -= cost
          return chosen
  POLICY

