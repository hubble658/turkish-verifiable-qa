# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  fleet/dispatch.py içindeki DispatchQueue sınıfını, enqueue, dequeue, __len__, __iter__ ve __next__ metotlarını FIFO kuyruk davranışıyla gerçekleyecek şekilde doldur. enqueue kuyruğun sonuna eklesin, dequeue kuyruğun başından çıkarsın; __len__ kuyruktaki eleman sayısını döndürsün ve iterator protokolü elemanları giriş sırasıyla versin. fleet/report.py içindeki dispatch_order fonksiyonu, verilen plaka ve kapasite çiftlerini kuyruğa ekleyip iterator üzerinden plakaları giriş sırasında döndürsün. fleet/vehicle.py ve fleet/__init__.py dosyalarına dokunma.

setup: |
  mkdir -p fleet
  cat > fleet/__init__.py <<'INIT'
  INIT
  cat > fleet/vehicle.py <<'VEHICLE'
  class Vehicle:
      def __init__(self, plate, capacity):
          self.plate = plate
          self.capacity = capacity

      def __repr__(self):
          return "Vehicle(%s,%d)" % (self.plate, self.capacity)
  VEHICLE
  cat > fleet/dispatch.py <<'DISPATCH'
  class DispatchQueue:
      def __init__(self):
          self._items = []

      def enqueue(self, vehicle):
          raise NotImplementedError

      def dequeue(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError

      def __iter__(self):
          raise NotImplementedError
  DISPATCH
  cat > fleet/report.py <<'REPORT'
  from fleet.dispatch import DispatchQueue


  def dispatch_order(plates_caps):
      q = DispatchQueue()
      for plate, cap in plates_caps:
          q.enqueue(plate)
      return list(q)
  REPORT

goal_tr: >
  fleet/dispatch.py icindeki DispatchQueue sinifini, enqueue/dequeue/__len__
  ve iterator protokolunu (__iter__, __next__) FIFO kuyruk davranisiyla
  gercekleyecek bicimde doldur; boylece fleet/report.py dispatch_order
  plakalari giris sirasinda dondursun.

reference_solution: |
  cat > fleet/dispatch.py <<'DISPATCH'
  class DispatchQueue:
      def __init__(self):
          self._items = []

      def enqueue(self, vehicle):
          self._items.append(vehicle)

      def dequeue(self):
          if not self._items:
              raise IndexError("empty queue")
          return self._items.pop(0)

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          self._index = 0
          return self

      def __next__(self):
          if self._index >= len(self._items):
              raise StopIteration
          value = self._items[self._index]
          self._index += 1
          return value
  DISPATCH

