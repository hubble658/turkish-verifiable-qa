split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  fleet/report.py içindeki efficient_plates fonksiyonunu, 100 km başına yakıt tüketimi eşik değerine eşit veya altında kalan araçları seçecek şekilde düzelt.

setup: |
  mkdir -p fleet
  cat > fleet/parse.py <<'PARSE'
  def parse_log(text):
      rows = []
      for line in text.strip().splitlines():
          if not line.strip():
              continue
          plate, km, fuel = line.split(",")
          rows.append((plate.strip(), float(km), float(fuel)))
      return rows
  PARSE
  cat > fleet/aggregate.py <<'AGG'
  from fleet.parse import parse_log


  def by_plate(text):
      totals = {}
      for plate, km, fuel in parse_log(text):
          if plate in totals:
              prev_km, prev_fuel = totals[plate]
              totals[plate] = (prev_km + km, prev_fuel + fuel)
          else:
              totals[plate] = (km, fuel)
      return totals
  AGG
  cat > fleet/report.py <<'REPORT'
  from fleet.aggregate import by_plate


  def efficient_plates(text, max_l_per_100km):
      totals = by_plate(text)
      result = []
      for plate, (km, fuel) in totals.items():
          if km <= 0:
              continue
          if fuel / km * 100 > max_l_per_100km:
              result.append(plate)
      return sorted(result)
  REPORT

goal_tr: >
  fleet/report.py icindeki efficient_plates fonksiyonunu, 100 km basina
  yakit tuketimi esigin ALTINDA kalan araclari (esik degeri dahil) dogru
  sececek bicimde duzelt.

reference_solution: |
  cat > fleet/report.py <<'REPORT'
  from fleet.aggregate import by_plate


  def efficient_plates(text, max_l_per_100km):
      totals = by_plate(text)
      result = []
      for plate, (km, fuel) in totals.items():
          if km <= 0:
              continue
          if fuel / km * 100 <= max_l_per_100km:
              result.append(plate)
      return sorted(result)
  REPORT

