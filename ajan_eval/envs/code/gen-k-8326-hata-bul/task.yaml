# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Atölyedeki bakım kayıtlarını tuttuğumuz log dosyası iyice kabardı, artık vardiya çıkışlarında rapor çıkarmak tam bir işkenceye döndü. Geçen gün makinelerin toplam bakım saatini konuşurken herkesin elindeki sayı farklı çıktı, kimse birbirine güvenemez oldu. Ben de bu işi tek bir yerden, maintenance/summary.py üzerinden yürütelim dedim.

  maintenance/summary.py içindeki cumulative_hours fonksiyonu, elimizdeki kayıtların tamamına ait toplam bakım saatini doğru şekilde döndürsün istiyorum. Şu an verdiği sonuç bizi yanıltıyor; bütün kayıtları kapsayan gerçek toplamı versin, eksik ya da kaydırılmış bir sayı görmek istemiyorum.

setup: |
  mkdir -p maintenance
  cat > maintenance/records.py <<'RECORDS'
  def parse_records(text):
      rows = []
      for line in text.strip().splitlines():
          machine, hours, kind = line.split(',')
          rows.append((machine, int(hours), kind))
      return rows


  def total_hours(text):
      rows = parse_records(text)
      return sum(r[1] for r in rows)
  RECORDS
  cat > maintenance/summary.py <<'SUMMARY'
  from maintenance.records import parse_records


  def count_kind(text, kind):
      rows = parse_records(text)
      n = 0
      for r in rows:
          if r[2] == kind:
              n += 1
      return n


  def busiest_machine(text):
      rows = parse_records(text)
      totals = {}
      for machine, hours, kind in rows:
          totals[machine] = totals.get(machine, 0) + hours
      best = None
      for machine in totals:
          if best is None or totals[machine] > totals[best]:
              best = machine
      return best


  def cumulative_hours(text):
      rows = parse_records(text)
      def walk(i):
          if i >= len(rows):
              return 0
          return rows[i][1] + walk(i + 1)
      return walk(1)
  SUMMARY
  cat > log.txt <<'LOG'
  press,5,repair
  lathe,2,repair
  press,3,inspect
  mill,7,repair
  lathe,1,inspect
  LOG

goal_tr: >
  maintenance/summary.py icindeki cumulative_hours fonksiyonunu, kayitlarin
  tamamina ait toplam bakim saatini dogru dondurecek bicimde duzelt

reference_solution: |
  cat > maintenance/summary.py <<'SUMMARY'
  from maintenance.records import parse_records


  def count_kind(text, kind):
      rows = parse_records(text)
      n = 0
      for r in rows:
          if r[2] == kind:
              n += 1
      return n


  def busiest_machine(text):
      rows = parse_records(text)
      totals = {}
      for machine, hours, kind in rows:
          totals[machine] = totals.get(machine, 0) + hours
      best = None
      for machine in totals:
          if best is None or totals[machine] > totals[best]:
              best = machine
      return best


  def cumulative_hours(text):
      rows = parse_records(text)
      def walk(i):
          if i >= len(rows):
              return 0
          return rows[i][1] + walk(i + 1)
      return walk(0)
  SUMMARY

