# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  school/rank.py içindeki PriorityQueue.pop metodunu, her zaman en yüksek notu önce verecek şekilde düzelt. school/report.py içindeki top_courses fonksiyonunu, school/rank.py'de tanımlı ranked dekoratörünü kullanarak yaz ve en yüksek k dersi doğru sırada döndürecek biçimde tamamla; school/records.py ve school/rank.py dosyalarındaki mevcut yapı korunsun.

setup: |
  mkdir -p school
  cat > school/records.py <<'REC'
  class Transcript:
      def __init__(self):
          self._grades = []

      def add(self, course, grade):
          self._grades.append((course, grade))

      def courses(self):
          return list(self._grades)
  REC
  cat > school/rank.py <<'RANK'
  class PriorityQueue:
      def __init__(self):
          self._items = []

      def push(self, priority, value):
          self._items.append((priority, value))

      def pop(self):
          if not self._items:
              raise IndexError("empty")
          best = 0
          for i in range(1, len(self._items)):
              if self._items[i][0] < self._items[best][0]:
                  best = i
          return self._items.pop(best)[1]

      def __len__(self):
          return len(self._items)


  def ranked(method):
      def wrapper(self, k):
          return method(self, k)
      return wrapper
  RANK
  cat > school/report.py <<'REPORT'
  from school.rank import PriorityQueue


  def top_courses(transcript, k):
      pq = PriorityQueue()
      for course, grade in transcript.courses():
          pq.push(grade, course)
      result = []
      while len(result) < k and len(pq) > 0:
          result.append(pq.pop())
      return list(reversed(result))
  REPORT

goal_tr: >
  school/rank.py icindeki PriorityQueue.pop metodunu en yuksek notu once
  verecek sekilde duzelt ve school/report.py icindeki top_courses
  fonksiyonunu, school/rank.py'de tanimli ranked dekoratorunu kullanarak
  yazip en yuksek k dersi dogru sirada dondurecek bicimde tamamla.

reference_solution: |
  cat > school/rank.py <<'RANK'
  class PriorityQueue:
      def __init__(self):
          self._items = []

      def push(self, priority, value):
          self._items.append((priority, value))

      def pop(self):
          if not self._items:
              raise IndexError("empty")
          best = 0
          for i in range(1, len(self._items)):
              if self._items[i][0] > self._items[best][0]:
                  best = i
          return self._items.pop(best)[1]

      def __len__(self):
          return len(self._items)


  def ranked(method):
      def wrapper(self, k):
          pq = PriorityQueue()
          for course, grade in self.courses():
              pq.push(grade, course)
          result = []
          while len(result) < k and len(pq) > 0:
              result.append(pq.pop())
          return result
      return wrapper
  RANK
  cat > school/report.py <<'REPORT'
  from school.rank import ranked


  class Report:
      def __init__(self, transcript):
          self._transcript = transcript

      def courses(self):
          return self._transcript.courses()

      @ranked
      def top_courses(self, k):
          raise AssertionError("decorator must supply the body")


  def top_courses(transcript, k):
      return Report(transcript).top_courses(k)
  REPORT

