# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  routes paketindeki yol planlayıcısı bazı hedefler için boş yol döndürüyor, ulaşılabilen düğümlerde sıra çağrılar arasında değişiyor ve ağırlık karşılaştırması yanlış sonuç veriyor. Bu sorunları routes/plan.py, routes/graph.py ve routes/edges.py dosyalarında gider; planlayıcı her çağrıda aynı ve doğru sırayı verecek hale gelsin ve ulaşılabilen her hedef için hedefi de içeren bir yol dönsün.

setup: |
  mkdir -p routes
  cat > routes/edges.py <<'EDGES'
  def load_edges(text):
      out = []
      for line in text.strip().splitlines():
          left, weight = line.split(':')
          src, dst = left.split('>')
          out.append((src, dst, weight))
      return out
  EDGES
  cat > routes/graph.py <<'GRAPH'
  from routes.edges import load_edges


  class RouteGraph:
      def __init__(self, text):
          self.edges = load_edges(text)

      def neighbors(self, node):
          result = []
          for index, (src, dst, weight) in enumerate(self.edges):
              if src == node:
                  result.append((weight, index, dst))
          result.sort(key=lambda item: (item[0], item[1]))
          return [dst for _, _, dst in result]

      def reachable(self, start):
          seen = []
          stack = [start]
          while stack:
              node = stack.pop()
              if node in seen:
                  continue
              seen.append(node)
              for nxt in self.neighbors(node):
                  stack.append(nxt)
          return seen
  GRAPH
  cat > routes/plan.py <<'PLAN'
  from routes.graph import RouteGraph


  class RoutePlanner:
      def __init__(self, text):
          self.graph = RouteGraph(text)

      def route(self, start, goal):
          order = self.graph.reachable(start)
          if goal not in order:
              return []
          return order[:order.index(goal)]
  PLAN
  cat > net.txt <<'NET'
  A>B:5
  A>C:1
  C>D:2
  B>D:9
  D>E:3
  A>F:10
  A>G:9
  NET

goal_tr: >
  routes paketindeki yol planlayicisi bazi hedefler icin bos yol donduruyor,
  ulasilabilen dugumlerde sira cagrilar arasinda degisiyor ve agirlik
  karsilastirmasi yanlis sonuc veriyor; planlayici her cagrida ayni ve dogru
  sirayi versin, ulasilabilen her hedef icin hedefi de iceren yol donsun.

reference_solution: |
  cat > routes/edges.py <<'EDGES'
  def load_edges(text):
      out = []
      for line in text.strip().splitlines():
          left, weight = line.split(':')
          src, dst = left.split('>')
          out.append((src, dst, int(weight)))
      return out
  EDGES
  cat > routes/graph.py <<'GRAPH'
  from routes.edges import load_edges


  class RouteGraph:
      def __init__(self, text):
          self.edges = load_edges(text)

      def neighbors(self, node):
          result = []
          for index, (src, dst, weight) in enumerate(self.edges):
              if src == node:
                  result.append((weight, index, dst))
          result.sort(key=lambda item: (item[0], item[1]))
          return [dst for _, _, dst in result]

      def reachable(self, start):
          seen = []
          queue = [start]
          while queue:
              node = queue.pop(0)
              if node in seen:
                  continue
              seen.append(node)
              for nxt in self.neighbors(node):
                  if nxt not in seen:
                      queue.append(nxt)
          return seen
  GRAPH
  cat > routes/plan.py <<'PLAN'
  from routes.graph import RouteGraph


  class RoutePlanner:
      def __init__(self, text):
          self.graph = RouteGraph(text)

      def route(self, start, goal):
          order = self.graph.reachable(start)
          if goal not in order:
              return []
          return order[:order.index(goal) + 1]
  PLAN

