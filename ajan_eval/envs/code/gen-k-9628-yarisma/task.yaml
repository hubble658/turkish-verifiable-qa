# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) bank/reports/pairs.py dosyasındaki find_pair fonksiyonunu, aynı metin üzerinde art arda çağrıldığında her seferinde doğru çifti bulacak şekilde düzelt.

  2) bank/ledger/stream.py dosyasındaki EntryStream akışını, akış bağlamı kapandıktan sonra da aynı akışın yeniden tüketilebilmesini sağlayacak şekilde düzelt.

  3) bank/ledger/parse.py dosyasındaki ayrıştırmayı, negatif tutarlı hareketlerin toplamda doğru yorumlanmasını sağlayacak şekilde düzelt.

setup: |
  mkdir -p bank/ledger bank/reports
  cat > bank/ledger/parse.py <<'PY'
  def parse_entries(text):
      rows = []
      for line in text.splitlines():
          line = line.strip()
          if not line:
              continue
          parts = line.split(',')
          rows.append((parts[0], int(parts[1])))
      return rows
  PY
  cat > bank/ledger/stream.py <<'PY'
  from bank.ledger.parse import parse_entries


  class EntryStream:
      def __init__(self, text):
          self._rows = parse_entries(text)
          self._i = 0

      def __enter__(self):
          return self

      def __exit__(self, exc_type, exc, tb):
          self._rows = []
          return False

      def __iter__(self):
          return self

      def __next__(self):
          if self._i >= len(self._rows):
              raise StopIteration
          row = self._rows[self._i]
          self._i += 1
          return row
  PY
  cat > bank/reports/pairs.py <<'PY'
  from bank.ledger.stream import EntryStream


  def find_pair(text, target):
      with EntryStream(text) as stream:
          rows = list(stream)
      lo = 0
      hi = len(rows) - 1
      while lo < hi:
          total = rows[lo][1] + rows[hi][1]
          if total == target:
              return (rows[lo][0], rows[hi][0])
          if total < target:
              hi -= 1
          else:
              lo += 1
      return None
  PY
  cat > data.csv <<'CSV'
  salary,5000
  coffee,-4
  rent,-1500
  bonus,200
  books,-40
  CSV

goal_tr: >
  Banka hareketleri metnini okuyup iki farkli hareketin tutar toplami hedefe
  esit olan cifti donduren kodu oyle duzelt ki find_pair ayni metin uzerinde
  art arda cagrildiginda her seferinde dogru cifti bulsun, akis baglami
  kapandiktan sonra da ayni akis yeniden tuketilebilsin ve negatif tutarli
  hareketler toplamda dogru yorumlansin.

