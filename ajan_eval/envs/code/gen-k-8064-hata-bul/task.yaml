id: gen-k-8064-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) roster/records.py içindeki Shift sınıfını, her vardiyanın etiketleri yalnızca kendi kaydında tutacak ve bir vardiyaya eklenen etiket başka vardiyalara sızmayacak şekilde düzelt.

  2) roster/loader.py ve roster/summary.py dosyalarına hiç dokunma; ikisi de değişmeden kalsın.

  3) roster/summary.py içindeki summarise fonksiyonunun shifts.txt için döndürdüğü sonuç tam olarak [("ada",8,["night"]),("bora",5,["day"]),("cem",6,["night"])] olsun.

setup: |
  mkdir -p roster
  cat > roster/records.py <<'RECORDS'
  from dataclasses import dataclass


  @dataclass
  class Shift:
      worker: str
      hours: int
      tags: list = []

      def add_tag(self, tag):
          self.tags.append(tag)
          return self
  RECORDS
  cat > roster/loader.py <<'LOADER'
  from roster.records import Shift


  def load_shifts(path):
      shifts = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              worker, hours, tag = line.split(',')
              shifts.append(Shift(worker, int(hours)).add_tag(tag))
      return shifts
  LOADER
  cat > roster/summary.py <<'SUMMARY'
  from roster.loader import load_shifts


  def summarise(path):
      shifts = load_shifts(path)
      return [(s.worker, s.hours, list(s.tags)) for s in shifts]
  SUMMARY
  cat > shifts.txt <<'DATA'
  ada,8,night
  bora,5,day
  cem,6,night
  DATA

goal_tr: >
  1. roster/records.py icindeki Shift sinifinda her vardiyanin etiketlerinin
  birbirine sizmamasini sagla. 2. roster/loader.py ve roster/summary.py
  degismeden kalsin; roster/summary.py icindeki summarise fonksiyonu
  shifts.txt icin
  [("ada",8,["night"]),("bora",5,["day"]),("cem",6,["night"])] dondursun.

reference_solution: |
  cat > roster/records.py <<'RECORDS'
  from dataclasses import dataclass, field


  @dataclass
  class Shift:
      worker: str
      hours: int
      tags: list = field(default_factory=list)

      def add_tag(self, tag):
          self.tags.append(tag)
          return self
  RECORDS

outputs:
  - {path: roster/records.py, kind: program, run: 'python3 -c ''from roster.summary import summarise as f; r=f("shifts.txt"); assert r==[("ada",8,["night"]),("bora",5,["day"]),("cem",6,["night"])], r; from roster.records import Shift; a=Shift("x",1); b=Shift("y",2); a.add_tag("t"); assert b.tags==[], b.tags; assert a.tags==["t"]; assert Shift("z",3).tags==[]; print("TAMAM")'''}

checks:
  - {op: run_stdout_eq, cmd: 'python3 -c ''from roster.summary import summarise as f; r=f("shifts.txt"); assert r==[("ada",8,["night"]),("bora",5,["day"]),("cem",6,["night"])], r; from roster.records import Shift; a=Shift("x",1); b=Shift("y",2); a.add_tag("t"); assert b.tags==[], b.tags; assert a.tags==["t"]; assert Shift("z",3).tags==[]; print("TAMAM")''', value: TAMAM}

