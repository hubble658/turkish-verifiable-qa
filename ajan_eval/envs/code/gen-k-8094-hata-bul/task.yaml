id: gen-k-8094-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  weblog/parse.py içindeki parse_line fonksiyonunu, boş değerli alanlar da SimpleRecord içine doğru şekilde yazılacak biçimde düzelt; böylece count_by çağrıldığında KeyError oluşmasın.

setup: |
  mkdir -p weblog
  cat > weblog/schema.py <<'SCHEMA'
  from abc import ABC, abstractmethod


  class Record(ABC):
      @abstractmethod
      def get(self, key):
          ...

      @abstractmethod
      def keys(self):
          ...


  def make_record(fields):
      return SimpleRecord(fields)


  class SimpleRecord(Record):
      def __init__(self, fields):
          self._fields = dict(fields)

      def get(self, key):
          return self._fields[key]

      def keys(self):
          return list(self._fields.keys())
  SCHEMA
  cat > weblog/parse.py <<'PARSE'
  from weblog.schema import make_record


  def parse_line(line):
      parts = line.rstrip("\n").split(" ")
      fields = {}
      for token in parts:
          if "=" in token:
              k, v = token.split("=", 1)
              fields[k] = v
      return make_record(fields)
  PARSE
  cat > weblog/aggregate.py <<'AGG'
  from weblog.parse import parse_line


  def count_by(stream, key):
      counts = {}
      for line in stream:
          rec = parse_line(line)
          k = rec.get(key)
          counts[k] = counts.get(k, 0) + 1
      return counts
  AGG
  cat > weblog/run.py <<'RUN'
  import sys
  from weblog.aggregate import count_by


  def main():
      result = count_by(sys.stdin, "status")
      for k in sorted(result):
          print(k, result[k])


  if __name__ == "__main__":
      main()
  RUN
  cat > logs.txt <<'LOGS'
  ip=10.0.0.1 status=200 path=/a
  ip=10.0.0.2 status=404 path=/b
  ip=10.0.0.1 status=200 path=/c
  LOGS

goal_tr: >
  weblog/parse.py icindeki parse_line fonksiyonunu, bos degerli alanlar da
  dogru sekilde SimpleRecord icine yazilacak bicimde duzelt; boylece
  count_by cagrildiginda KeyError olusmasin.

reference_solution: |
  cat > weblog/parse.py <<'PARSE'
  from weblog.schema import make_record


  def parse_line(line):
      parts = line.rstrip("\n").split(" ")
      fields = {}
      for token in parts:
          if "=" in token:
              k, v = token.split("=", 1)
              fields[k] = v
      if "status" not in fields:
          fields["status"] = "unknown"
      return make_record(fields)
  PARSE

