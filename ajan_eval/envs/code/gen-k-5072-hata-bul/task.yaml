# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Kütüphane otomasyonu üzerinde çalışıyoruz ve ödünç masasındaki kayıtlarla ilgili bazı raporlar alıyoruz. Gün içinde personel, en uzun kitap adını çekmek istediğinde bazen beklenmedik sonuçlarla karşılaşıyor; aynı uzunlukta birden fazla kitap ödünç alındığında hangisinin öne çıkacağı tutarlı değil.

  library/desk.py içindeki LoanDesk.longest metodunu, ödünç kayıtları arasında en uzun kitap adını kararlı bir şekilde döndürecek biçimde düzelt. Eşitlik durumunda en erken ödünç alınan kayıt esas alınsın. Sadece library/desk.py üzerinde çalış.

setup: |
  mkdir -p library
  cat > library/errors.py <<'ERRORS'
  class LoanError(Exception):
      pass


  class BookUnavailable(LoanError):
      pass


  class MemberBlocked(LoanError):
      pass


  class LoanLimitReached(LoanError):
      pass
  ERRORS
  cat > library/catalog.py <<'CATALOG'
  class Catalog:
      def __init__(self):
          self._copies = {}

      def add(self, title, copies):
          self._copies[title] = self._copies.get(title, 0) + copies

      def available(self, title):
          return self._copies.get(title, 0)

      def take(self, title):
          if self._copies.get(title, 0) <= 0:
              raise KeyError(title)
          self._copies[title] -= 1

      def give_back(self, title):
          self._copies[title] = self._copies.get(title, 0) + 1
  CATALOG
  cat > library/members.py <<'MEMBERS'
  class Member:
      def __init__(self, name, blocked=False, limit=3):
          self.name = name
          self.blocked = blocked
          self.limit = limit
          self.loans = []


  class Roster:
      def __init__(self):
          self._members = {}

      def add(self, member):
          self._members[member.name] = member

      def get(self, name):
          return self._members[name]
  MEMBERS
  cat > library/desk.py <<'DESK'
  from library.catalog import Catalog
  from library.members import Roster
  from library.errors import BookUnavailable, MemberBlocked, LoanLimitReached


  class LoanDesk:
      def __init__(self, catalog, roster):
          self.catalog = catalog
          self.roster = roster
          self.log = []

      def borrow(self, member_name, title):
          member = self.roster.get(member_name)
          if member.blocked:
              raise MemberBlocked(member_name)
          if len(member.loans) >= member.limit:
              raise LoanLimitReached(member_name)
          self.catalog.take(title)
          member.loans.append(title)
          self.log.append((member_name, title))
          return True

      def longest(self):
          return sorted(self.log, key=lambda row: len(row[1]))[-1]
  DESK
  cat > library/__init__.py <<'INIT'
  INIT

goal_tr: >
  library/desk.py icindeki LoanDesk.longest metodunu, odunc kayitlari
  arasinda en uzun kitap adini kararli bir sekilde (esitlikte en erken odunc
  alinan kayit) dondurecek bicimde duzelt.

reference_solution: |
  cat > library/desk.py <<'DESK'
  from library.catalog import Catalog
  from library.members import Roster
  from library.errors import BookUnavailable, MemberBlocked, LoanLimitReached


  class LoanDesk:
      def __init__(self, catalog, roster):
          self.catalog = catalog
          self.roster = roster
          self.log = []

      def borrow(self, member_name, title):
          member = self.roster.get(member_name)
          if member.blocked:
              raise MemberBlocked(member_name)
          if len(member.loans) >= member.limit:
              raise LoanLimitReached(member_name)
          self.catalog.take(title)
          member.loans.append(title)
          self.log.append((member_name, title))
          return True

      def longest(self):
          best = None
          for row in self.log:
              if best is None or len(row[1]) > len(best[1]):
                  best = row
          return best
  DESK

