id: gen-k-2021-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  route/stack.py içindeki RouteStack sınıfını ve walk generator'ünü, rota parçalarını doğru sırayla biriktirip geri dönecek şekilde tamamla. Ayrıca route/describe.py içindeki describe fonksiyonunu, yığından baştan sona doğru yolu üretecek biçimde düzelt.

setup: |
  mkdir -p route
  cat > route/stack.py <<'STACK'
  class RouteStack:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          return self._items.pop()

      def peek(self):
          return self._items[-1]

      def __len__(self):
          return len(self._items)


  def walk(segments):
      stack = RouteStack()
      for seg in segments:
          if seg == "BACK":
              stack.pop()
          else:
              stack.push(seg)
      return stack
  STACK
  cat > route/describe.py <<'DESCRIBE'
  from route.stack import walk


  def describe(segments):
      stack = walk(segments)
      parts = []
      while len(stack) > 0:
          parts.append(stack.pop())
      return "/".join(parts)
  DESCRIBE

goal_tr: >
  route/stack.py icindeki RouteStack sinifini ve walk generator'unu, rota
  parcalarini dogru sirayla biriktirip geri donecek sekilde tamamla;
  route/describe.py icindeki describe fonksiyonunu da yigindan bastan sona
  dogru yolu uretecek bicimde duzelt.

reference_solution: |
  cat > route/stack.py <<'STACK'
  class RouteStack:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          return self._items.pop()

      def peek(self):
          return self._items[-1]

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          for item in self._items:
              yield item


  def walk(segments):
      stack = RouteStack()
      for seg in segments:
          if seg == "BACK":
              stack.pop()
          else:
              stack.push(seg)
      yield from stack
  STACK
  cat > route/describe.py <<'DESCRIBE'
  from route.stack import walk


  def describe(segments):
      parts = list(walk(segments))
      return "/".join(parts)
  DESCRIBE

ara_adim: |
  cat > route/stack.py <<'STACK'
  class RouteStack:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          return self._items.pop()

      def peek(self):
          return self._items[-1]

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          for item in self._items:
              yield item


  def walk(segments):
      stack = RouteStack()
      for seg in segments:
          if seg == "BACK":
              stack.pop()
          else:
              stack.push(seg)
      yield from stack
  STACK

