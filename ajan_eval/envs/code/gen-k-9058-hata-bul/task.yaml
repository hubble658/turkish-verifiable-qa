# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  bank/loader.py dosyasındaki yükleyici, hareket satırlarını virgül yerine noktalı virgül ile ayrıştıracak şekilde düzeltilsin. bank/report.py içindeki summarize fonksiyonu, hesapların toplamlarını satır satır liste yerine birleştirilmiş tek bir metin olarak döndürsün; her hesap için "hesap=toplam" biçimi korunsun ve tutarlar iki ondalık basamakla gösterilsin. bank/ledger.py içindeki Ledger sınıfı, bilinmeyen bir hesaba hareket uygulanmak istendiğinde UnknownAccount hatası yükseltsin; ayrıca accounts ve balance çağrıları geçerli hesaplar ile doğru bakiyeleri versin. Bu üç modülün dışındaki dosyalar olduğu gibi bırakılsın.

setup: |
  mkdir -p bank
  cat > bank/loader.py <<'LOADER'
  def load_ledger(path):
      entries = []
      with open(path, "r", encoding="ascii") as fh:
          for raw in fh:
              raw = raw.strip()
              if not raw or raw.startswith("#"):
                  continue
              parts = raw.split(",")
              entries.append({
                  "id": parts[0],
                  "kind": parts[1],
                  "amount": float(parts[2]),
                  "account": parts[3],
              })
      return entries
  LOADER
  cat > bank/ledger.py <<'LEDGER'
  class LedgerError(Exception):
      pass


  class UnknownAccount(LedgerError):
      pass


  class Ledger:
      def __init__(self, entries):
          self.entries = entries
          self._balances = {}
          self._kinds = {}
          for e in entries:
              self._balances[e["account"]] = 0.0
              self._kinds[e["kind"]] = self._kinds.get(e["kind"], 0) + 1

      def accounts(self):
          return sorted(self._balances)

      def kind_count(self, kind):
          return self._kinds.get(kind, 0)

      def apply(self, entry):
          acct = entry["account"]
          if acct not in self._balances:
              raise UnknownAccount(acct)
          if entry["kind"] == "deposit":
              self._balances[acct] += entry["amount"]
          else:
              self._balances[acct] -= entry["amount"]

      def balance(self, account):
          return self._balances[account]
  LEDGER
  cat > bank/report.py <<'REPORT'
  from bank.ledger import Ledger, UnknownAccount
  from bank.loader import load_ledger


  def account_totals(entries):
      led = Ledger(entries)
      for e in entries:
          led.apply(e)
      return {a: led.balance(a) for a in led.accounts()}


  def summarize(path):
      entries = load_ledger(path)
      totals = account_totals(entries)
      lines = []
      for acct in sorted(totals):
          lines.append("%s=%0.2f" % (acct, totals[acct]))
      return lines


  def count_kind(path, kind):
      entries = load_ledger(path)
      led = Ledger(entries)
      return led.kind_count(kind)
  REPORT
  cat > ledger.txt <<'DATA'
  t1;deposit;100.00;alice
  t2;deposit;50.00;bob
  t3;withdraw;20.00;alice
  t4;deposit;10.00;alice
  t5;withdraw;5.00;bob
  DATA

goal_tr: >
  bank paketindeki uc modulu duzelt: bank/loader.py hareket satirlarini
  noktali virgul ile ayristirsin, bank/report.py summarize fonksiyonu
  satirlari birlestirilmis tek bir metin dondursun, bank/ledger.py Ledger
  sinifi bilinmeyen hesap icin UnknownAccount yukseltsin ve bakiye/hesap
  listesi dogru olsun.

