# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  arena/board.py içindeki load_scores'un yanına with_scores dekoratörünü ekle; sardığı fonksiyonlara skorları en yüksekten en düşüğe, eşitlikte isim alfabetik olacak şekilde (name, pts) listesi olarak versin.

  Aynı dosyaya top_spread fonksiyonunu da with_scores ile sarılı ekle; skor listesini iki işaretçiyle tek geçişte tarayıp en yüksek ve en düşük skor farkını döndürsün.

setup: |
  mkdir -p arena
  cat > arena/board.py <<'BOARD'
  def load_scores(path):
      rows = []
      with open(path, "r") as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              name, pts = line.split(":")
              rows.append((name, int(pts)))
      return rows
  BOARD
  cat > scores.txt <<'DATA'
  ada:12
  bo:7
  cy:19
  di:7
  em:25
  fy:3
  DATA

goal_tr: >
  arena/board.py icindeki load_scores fonksiyonunun yanina, bir dosya yolunu
  alip icindeki skorlari okuyan ve @with_scores dekoratoru ile sarilmis
  fonksiyonlara (name, pts) ikililerinden olusan listeyi en yuksek skordan
  en dusuge dogru, esit skorlarda isim alfabetik sirasiyla duzenlenmis halde
  aktaran bir with_scores dekoratoru ekle; ardindan ayni dosyaya, dosya
  yolunu alip bu skor listesini iki isaretci ile tek gecisde tarayarak en
  yuksek skor ile en dusuk skorun farkini donduren top_spread fonksiyonunu
  @with_scores ile sarili bicimde ekle.

reference_solution: |
  cat > arena/board.py <<'BOARD'
  def load_scores(path):
      rows = []
      with open(path, "r") as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              name, pts = line.split(":")
              rows.append((name, int(pts)))
      return rows


  def with_scores(fn):
      def wrapper(path, *args, **kwargs):
          rows = load_scores(path)
          rows.sort(key=lambda r: (-r[1], r[0]))
          return fn(rows, *args, **kwargs)
      return wrapper


  @with_scores
  def top_spread(rows):
      lo = 0
      hi = len(rows) - 1
      if hi <= 0:
          return 0
      return rows[lo][1] - rows[hi][1]
  BOARD

