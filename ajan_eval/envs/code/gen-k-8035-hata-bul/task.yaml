# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  arena/session.py içindeki run_session fonksiyonunu düzelt. Şu anda her parça için ayrı bir ScoreBoard oluşturuyor; bunun yerine tüm parçalar boyunca tek bir ScoreBoard kullanılmasını sağla. Fonksiyon her parçayı bu tek board'a beslemeli ve her parça sonunda o ana kadar biriken toplamı döndürmeli. Yani dönüş değeri, her parça sonunda o parçaya kadar işlenen tüm verilerin birikmiş toplamı olmalı; son parçanın sonucu değil, her adımda biriken toplam. Sadece arena/session.py dosyasını değiştir; arena/rounds.py ve arena/score.py olduğu gibi kalsın.

setup: |
  mkdir -p arena
  cat > arena/rounds.py <<'ROUNDS'
  def round_stream(events):
      for event in events:
          kind, value = event
          if kind == "round":
              yield value
  ROUNDS
  cat > arena/score.py <<'SCORE'
  from arena.rounds import round_stream


  class ScoreBoard:
      def __init__(self):
          self.total = 0
          self.bonus = 0

      def feed(self, events):
          for value in round_stream(events):
              self.total += value
              if value >= 10:
                  self.bonus += 1
          return self.total + self.bonus
  SCORE
  cat > arena/session.py <<'SESSION'
  from arena.score import ScoreBoard


  def run_session(chunks):
      results = []
      for chunk in chunks:
          board = ScoreBoard()
          results.append(board.feed(chunk))
      return results[-1]
  SESSION

goal_tr: >
  arena/session.py icindeki run_session fonksiyonunu, tum parcalar boyunca
  tek bir ScoreBoard kullanip her parca sonunda biriken toplami dondurecek
  bicimde duzelt.

reference_solution: |
  cat > arena/session.py <<'SESSION'
  from arena.score import ScoreBoard


  def run_session(chunks):
      board = ScoreBoard()
      last = 0
      for chunk in chunks:
          last = board.feed(chunk)
      return last
  SESSION

outputs:
