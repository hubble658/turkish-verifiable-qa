# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) depot/inventory.py dosyasındaki make_counter fabrikasını, her çağrıldığında yalnızca o handle'a ait bağımsız bir sayaç durumu tutan ve bir handle döndüren biçimde düzelt.

  2) İki farklı handle'ın birbirinin sayaç durumunu paylaşmamasını sağla.

  3) depot/inventory.py içindeki modül seviyesindeki _TOTALS sözlüğünü kaldır.

setup: |
  mkdir -p depot
  cat > depot/reader.py <<'READER'
  def read_lines(stream):
      return [line.strip() for line in stream if line.strip()]
  READER
  cat > depot/inventory.py <<'INVENTORY'
  from depot.reader import read_lines

  _TOTALS = {"in": 0, "out": 0}


  def make_counter():
      def handle(line):
          op, _, qty = line.partition(" ")
          _TOTALS["in" if op == "IN" else "out"] += int(qty)
          return _TOTALS["in"] - _TOTALS["out"]

      return handle


  def run(stream):
      handle = make_counter()
      return [handle(line) for line in read_lines(stream)]
  INVENTORY
  printf 'IN 5\nIN 3\nOUT 4\nOUT 1\n' > stream.txt

goal_tr: >
  depot/inventory.py icindeki make_counter fabrikasini, her cagrildiginda
  kendi bagimsiz sayaclarini tutan bir handle dondurecek bicimde duzelt; iki
  farkli handle birbirinin durumunu paylasmamali ve modul seviyesindeki
  _TOTALS sozlugu kaldirilmalidir.

reference_solution: |
  cat > depot/inventory.py <<'INVENTORY'
  from depot.reader import read_lines


  def make_counter():
      counts = {"in": 0, "out": 0}

      def handle(line):
          op, _, qty = line.partition(" ")
          counts["in" if op == "IN" else "out"] += int(qty)
          return counts["in"] - counts["out"]

      return handle


  def run(stream):
      handle = make_counter()
      return [handle(line) for line in read_lines(stream)]
  INVENTORY

