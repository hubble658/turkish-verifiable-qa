max_turns: 24

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Depo raf yerleşim planından üretilen bölge toplamları ve raf doluluk değerleri, stoktan mal çıkarma sonucuyla tutarlı olsun. Plan yüklendikten sonra hangi bölgede ne kadar mal olduğu ve bir raf hücresinden mal çıkınca kalan miktar doğru hesaplansın. Bunun için depo/raf/rapor.py, depo/raf/geo.py ve depo/raf/kayit.py dosyaları hazır olsun; plan.json içindeki plan bu dosyalarla birlikte çalışsın.

setup: |
  mkdir -p depo/raf
  cat > depo/raf/geo.py <<'GEO'
  def slot_key(slot):
      return "%s#%s" % (slot["zone"], slot["aisle"])
  GEO
  cat > depo/raf/kayit.py <<'KAYIT'
  from dataclasses import dataclass, field


  @dataclass
  class Rack:
      slots: dict = field(default_factory=dict)

      def put(self, slot, sku, qty):
          key = "%s#%s" % (slot["zone"], slot["aisle"])
          self.slots.setdefault(key, {})[sku] = qty
          return key

      def take(self, slot, sku, qty):
          key = "%s#%s" % (slot["zone"], slot["aisle"])
          cell = self.slots[key]
          cell[sku] -= qty
          return cell[sku]
  KAYIT
  cat > depo/raf/rapor.py <<'RAPOR'
  from depo.raf.kayit import Rack
  from depo.raf.geo import slot_key


  def load_plan(rows):
      rack = Rack()
      for row in rows:
          slot = row["slot"]
          for sku, qty in row["items"].items():
              rack.put(slot, sku, qty)
      return rack


  def zone_totals(rack):
      totals = {}
      for key, cell in rack.slots.items():
          zone = key.split("-")[0]
          totals[zone] = totals.get(zone, 0) + sum(cell.values())
      return totals


  def slot_usage(rack, slot):
      key = slot_key(slot)
      return sum(rack.slots[key].values())
  RAPOR
  cat > plan.json <<'JSON'
  [
    {"slot": {"zone": "A", "aisle": "1"}, "items": {"bolt": 10, "nut": 4}},
    {"slot": {"zone": "A", "aisle": "2"}, "items": {"bolt": 3}},
    {"slot": {"zone": "B", "aisle": "1"}, "items": {"gear": 7}}
  ]
  JSON

goal_tr: >
  Depo raf yerlesim planindan uretilen bolge toplamlari ve raf doluluk
  degerleri ile stoktan mal cikarma sonucu tutarli olsun; plan yuklendikten
  sonra hangi bolgede ne kadar mal oldugu ve bir raf hucresinden mal cikinca
  kalan miktar dogru hesaplansin.

