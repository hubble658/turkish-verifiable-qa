goal_tr: >
  center/records.py, center/counts.py ve center/report.py icindeki
  NotImplementedError govdelerini gercek gerceklestirmelerle doldur; CallLog
  bagli listeye kayit ekleyip uzunlugunu ve listesini dondursun, count_pairs
  (arayan,aranan) ciftlerinin sayisini sozluk olarak versin, busiest_pair en
  cok gecen cifti dondursun.

reference_solution: |
  cat > center/records.py <<'RECORDS'
  class CallNode:
      __slots__ = ("caller", "callee", "next")

      def __init__(self, caller, callee, next=None):
          self.caller = caller
          self.callee = callee
          self.next = next


  class CallLog:
      def __init__(self):
          self.head = None
          self._count = 0

      def add(self, caller, callee):
          self.head = CallNode(caller, callee, self.head)
          self._count += 1

      def __len__(self):
          return self._count

      def to_list(self):
          out = []
          node = self.head
          while node is not None:
              out.append((node.caller, node.callee))
              node = node.next
          out.reverse()
          return out
  RECORDS
  cat > center/counts.py <<'COUNTS'
  from center.records import CallLog


  def count_pairs(log):
      tally = {}
      for caller, callee in log.to_list():
          key = (caller, callee)
          tally[key] = tally.get(key, 0) + 1
      return tally
  COUNTS
  cat > center/report.py <<'REPORT'
  from center.records import CallLog
  from center.counts import count_pairs


  def busiest_pair(log):
      tally = count_pairs(log)
      if not tally:
          return None
      best = None
      best_n = -1
      for key in sorted(tally):
          n = tally[key]
          if n > best_n:
              best = key
              best_n = n
      return best
  REPORT

