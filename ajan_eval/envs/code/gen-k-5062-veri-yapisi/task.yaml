  cat > sensor/stream.py <<'STREAM'
  import sys


  def read_series(stream):
      """Yield (timestamp, value) pairs from a text stream of 'ts value' lines."""
      for line in stream:
          line = line.strip()
          if not line:
              continue
          ts, val = line.split()
          yield int(ts), float(val)
  STREAM
  cat > sensor/graph.py <<'GRAPH'
  from abc import ABC, abstractmethod


  class DisjointSet(ABC):
      """Abstract protocol for a disjoint-set (union-find) data structure."""

      @abstractmethod
      def add(self, item):
          """Register a new singleton item."""

      @abstractmethod
      def find(self, item):
          """Return the representative of the set containing item."""

      @abstractmethod
      def union(self, a, b):
          """Merge the sets containing a and b."""

      @abstractmethod
      def components(self):
          """Return each component as a list of items in increasing order."""


  class UnionFind(DisjointSet):
      def __init__(self):
          raise NotImplementedError

      def add(self, item):
          raise NotImplementedError

      def find(self, item):
          raise NotImplementedError

      def union(self, a, b):
          raise NotImplementedError

      def components(self):
          raise NotImplementedError
  GRAPH
  cat > sensor/pipeline.py <<'PIPE'
  import sys

  from sensor.graph import UnionFind
  from sensor.stream import read_series


  def cluster(stream, threshold):
      uf = UnionFind()
      prev = None
      for ts, val in read_series(stream):
          uf.add(ts)
          if prev is not None:
              pts, pval = prev
              if abs(val - pval) <= threshold:
                  uf.union(pts, ts)
          prev = (ts, val)
      return uf.components()


  def main(argv):
      threshold = float(argv[1]) if len(argv) > 1 else 1.0
      groups = cluster(sys.stdin, threshold)
      for group in groups:
          print(" ".join(str(t) for t in group))
      return 0


  if __name__ == "__main__":
      sys.exit(main(sys.argv))
  PIPE

goal_tr: >
  sensor/graph.py icindeki DisjointSet soyut protokolunu uygulayan UnionFind
  sinifini gerceklestir: add yeni tekil eleman eklesin, find yol
  sikistirmasi yapip kume temsilcisini dondursun, union kucuk kumeyi buyuge
  baglayip boyutlari guncellesin, components ise her kumenin elemanlarini
  artan sirada dondursun.

reference_solution: |
  cat > sensor/graph.py <<'GRAPH'
  from abc import ABC, abstractmethod


  class DisjointSet(ABC):
      """Abstract protocol for a disjoint-set (union-find) data structure."""

      @abstractmethod
      def add(self, item):
          """Register a new singleton item."""

      @abstractmethod
      def find(self, item):
          """Return the representative of the set containing item."""

      @abstractmethod
      def union(self, a, b):
          """Merge the sets containing a and b."""

      @abstractmethod
      def components(self):
          """Return each component as a list of items in increasing order."""


  class UnionFind(DisjointSet):
      def __init__(self):
          self._parent = {}
          self._size = {}

      def add(self, item):
          if item not in self._parent:
              self._parent[item] = item
              self._size[item] = 1

      def find(self, item):
          root = item
          while self._parent[root] != root:
              root = self._parent[root]
          while self._parent[item] != root:
              self._parent[item], item = root, self._parent[item]
          return root

      def union(self, a, b):
          ra, rb = self.find(a), self.find(b)
          if ra == rb:
              return
          if self._size[ra] < self._size[rb]:
              ra, rb = rb, ra
          self._parent[rb] = ra
          self._size[ra] += self._size[rb]

      def components(self):
          groups = {}
          for item in self._parent:
              groups.setdefault(self.find(item), []).append(item)
          return [sorted(members) for members in groups.values()]
  GRAPH

