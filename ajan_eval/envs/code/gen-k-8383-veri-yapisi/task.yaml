# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  weblog/agg/queue.py içindeki EventQueue sınıfını gerçekleştir: push öğeyi kuyruğun sonuna koysun, pop ilk öğeyi çıkarsın ve boş kuyrukta IndexError yükseltsin, drain ise kalan tüm öğeleri FIFO sırasıyla döndürüp kuyruğu boşaltsın. İç içe geçmiş sözlükleri düz bir olay listesine açan bir kuyruk olmalı.

setup: |
  mkdir -p weblog/agg
  cat > weblog/__init__.py <<'PY'
  PY
  cat > weblog/agg/__init__.py <<'PY'
  PY
  cat > weblog/agg/queue.py <<'PY'
  class EventQueue:
      def __init__(self):
          raise NotImplementedError

      def push(self, item):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def drain(self):
          raise NotImplementedError
  PY
  cat > weblog/agg/replay.py <<'PY'
  from weblog.agg.queue import EventQueue


  def replay(events):
      q = EventQueue()
      for e in events:
          q.push(e)
      return q.drain()
  PY

goal_tr: >
  weblog/agg/queue.py icindeki EventQueue sinifini, ic ice gecmis (nested)
  sozlukleri duz bir olay listesine FIFO sirasiyla acan bir kuyruk olacak
  sekilde gerceklestir; push eklenen ogeyi kuyrugun sonuna koyar, pop ilk
  ogeyi cikarir ve bos kuyrukta IndexError yukseltir, drain ise kalan tum
  ogeleri sirayla dondurup kuyrugu bosaltir.

reference_solution: |
  cat > weblog/agg/queue.py <<'PY'
  class EventQueue:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          if not self._items:
              raise IndexError("pop from empty queue")
          return self._items.pop(0)

      def drain(self):
          out = []
          while self._items:
              out.append(self._items.pop(0))
          return out
  PY

