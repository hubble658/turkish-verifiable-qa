# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) meters/cache.py dosyasını oluştur; içinde LRUCache sınıfı kapasite parametresiyle kurulabilsin.

  2) LRUCache sınıfına get(key) metodu ekle; anahtar varsa değerini döndürsün ve o anahtarı en son kullanılan yapsın, anahtar yoksa None döndürsün.

  3) LRUCache sınıfına put(key, value) metodu ekle; anahtarı eklesin veya güncellesin ve kapasite aşıldığında en eski kullanılan anahtarı atsın.

  4) Aynı dosyaya cached_total(cache, meter_id, text) fonksiyonunu ekle; önce get ile önbelleğe baksın, değer yoksa meters.aggregate.total_by_meter sonucunu put ile saklayıp döndürsün.

setup: |
  mkdir -p meters
  cat > meters/readings.py <<'READINGS'
  def parse_line(line):
      meter_id, kwh = line.split(':')
      return meter_id.strip(), float(kwh)


  def load_readings(text):
      rows = []
      for line in text.strip().splitlines():
          rows.append(parse_line(line))
      return rows
  READINGS
  cat > meters/aggregate.py <<'AGG'
  from meters.readings import load_readings


  def total_by_meter(text):
      totals = {}
      for meter_id, kwh in load_readings(text):
          totals[meter_id] = totals.get(meter_id, 0.0) + kwh
      return totals
  AGG
  cat > input.txt <<'TXT'
  M1: 12.5
  M2: 3.0
  M1: 7.5
  M3: 1.0
  M2: 2.0
  TXT

goal_tr: >
  meters/cache.py dosyasini yaz: LRUCache sinifi kapasite ile kurulsun;
  get(key) degeri dondursun ve anahtari en son kullanilan yapsin, yoksa None
  dondursun; put(key, value) eklesin/guncellesin, kapasite asilinca en eski
  kullanilan anahtari atsin; cached_total(cache, meter_id, text) fonksiyonu
  get ile onbellege bakip yoksa meters.aggregate.total_by_meter sonucunu put
  ile saklayip dondursun.

reference_solution: |
  cat > meters/cache.py <<'CACHE'
  from collections import OrderedDict

  from meters.aggregate import total_by_meter


  class LRUCache:
      def __init__(self, capacity):
          self.capacity = capacity
          self.store = OrderedDict()

      def get(self, key):
          if key not in self.store:
              return None
          self.store.move_to_end(key)
          return self.store[key]

      def put(self, key, value):
          if key in self.store:
              self.store.move_to_end(key)
          self.store[key] = value
          while len(self.store) > self.capacity:
              self.store.popitem(last=False)


  def cached_total(cache, meter_id, text):
      hit = cache.get(meter_id)
      if hit is not None:
          return hit
      value = total_by_meter(text)[meter_id]
      cache.put(meter_id, value)
      return value
  CACHE

