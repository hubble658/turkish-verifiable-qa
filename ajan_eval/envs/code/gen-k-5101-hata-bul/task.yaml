split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  arena/engine/scoreboard.py içindeki Scoreboard.add metodu şu anda aynı oyuncuya tekrar puan geldiğinde önceki değerlerin üzerine yazıyor; bunun yerine aynı oyuncuya birden fazla turda gelen puan ve bonusların öncekilerin üzerine birikmesini sağla. Bu düzeltme sayesinde arena/tournament.py üzerinden alınan standings çıktısı, oyuncuların gerçek toplam puanlarına göre azalan sırada doğru sonucu versin. Sadece arena/engine/scoreboard.py dosyasında çalış, diğer dosyaların içeriğini değiştirme.

setup: |
  mkdir -p arena/engine
  cat > arena/engine/scoreboard.py <<'SCOREBOARD'
  from dataclasses import dataclass, field


  @dataclass
  class Entry:
      player: str
      points: int = 0
      bonus: int = 0

      def total(self):
          return self.points + self.bonus


  @dataclass
  class Scoreboard:
      entries: dict = field(default_factory=dict)

      def add(self, player, points, bonus=0):
          if player in self.entries:
              old = self.entries[player]
              old.points = points
              old.bonus = bonus
          else:
              self.entries[player] = Entry(player, points, bonus)
          return self.entries[player]

      def total_of(self, player):
          return self.entries[player].total()

      def leaderboard(self):
          rows = list(self.entries.values())
          rows.sort(key=lambda e: (-e.total(), e.player))
          return [(e.player, e.total()) for e in rows]
  SCOREBOARD
  cat > arena/engine/rounds.py <<'ROUNDS'
  from arena.engine.scoreboard import Scoreboard


  def run_rounds(events):
      board = Scoreboard()
      for player, points, bonus in events:
          board.add(player, points, bonus)
      return board
  ROUNDS
  cat > arena/tournament.py <<'TOURNAMENT'
  from arena.engine.rounds import run_rounds


  def standings(events):
      board = run_rounds(events)
      return board.leaderboard()
  TOURNAMENT

goal_tr: >
  arena/engine/scoreboard.py icindeki Scoreboard.add metodunu, ayni oyuncuya
  birden fazla turda gelen puan ve bonuslarin oncekilerin uzerine
  birikmesini saglayacak bicimde duzelt; boylece arena/tournament.py
  uzerinden alinan standings ciktisi oyuncularin gercek toplam puanlarina
  gore azalan sirada dogru sonucu versin.

reference_solution: |
  cat > arena/engine/scoreboard.py <<'SCOREBOARD'
  from dataclasses import dataclass, field


  @dataclass
  class Entry:
      player: str
      points: int = 0
      bonus: int = 0

      def total(self):
          return self.points + self.bonus


  @dataclass
  class Scoreboard:
      entries: dict = field(default_factory=dict)

      def add(self, player, points, bonus=0):
          if player in self.entries:
              old = self.entries[player]
              old.points = old.points + points
              old.bonus = old.bonus + bonus
          else:
              self.entries[player] = Entry(player, points, bonus)
          return self.entries[player]

      def total_of(self, player):
          return self.entries[player].total()

      def leaderboard(self):
          rows = list(self.entries.values())
          rows.sort(key=lambda e: (-e.total(), e.player))
          return [(e.player, e.total()) for e in rows]
  SCOREBOARD

