# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sessions/store/bst.py içindeki SessionTree sınıfını doldur: sid'e göre ikili arama ağacı tutsun, insert/lookup/size çalışsın. Aynı sid tekrar eklenirse DuplicateSession, olmayan sid'de MissingSession yükselsin.

setup: |
  mkdir -p sessions/store
  cat > sessions/errors.py <<'ERR'
  class SessionError(Exception):
      pass


  class DuplicateSession(SessionError):
      pass


  class MissingSession(SessionError):
      pass
  ERR
  cat > sessions/store/bst.py <<'BST'
  from sessions.errors import DuplicateSession, MissingSession


  class SessionTree:
      def __init__(self):
          raise NotImplementedError

      def insert(self, sid, user):
          raise NotImplementedError

      def lookup(self, sid):
          raise NotImplementedError

      def size(self):
          raise NotImplementedError
  BST
  cat > sessions/store/loader.py <<'LOAD'
  from sessions.store.bst import SessionTree


  def load_sessions(path):
      tree = SessionTree()
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              sid, user = line.split(',')
              tree.insert(sid, user)
      return tree
  LOAD
  cat > data.txt <<'DATA'
  s3,ada
  s1,bora
  s2,cem
  DATA

goal_tr: >
  sessions/store/bst.py icindeki SessionTree sinifini, sid anahtarina gore
  ikili arama agaci tutan ve insert/lookup/size metotlarini calistiran
  sekilde doldur; ayni sid ikinci kez eklenirse DuplicateSession, olmayan
  sid aranirsa MissingSession yukselsin.

reference_solution: |
  cat > sessions/store/bst.py <<'BST'
  from sessions.errors import DuplicateSession, MissingSession


  class _Node:
      __slots__ = ("sid", "user", "left", "right")

      def __init__(self, sid, user):
          self.sid = sid
          self.user = user
          self.left = None
          self.right = None


  class SessionTree:
      def __init__(self):
          self._root = None
          self._count = 0

      def insert(self, sid, user):
          if self._root is None:
              self._root = _Node(sid, user)
              self._count = 1
              return
          node = self._root
          while True:
              if sid == node.sid:
                  raise DuplicateSession(sid)
              if sid < node.sid:
                  if node.left is None:
                      node.left = _Node(sid, user)
                      self._count += 1
                      return
                  node = node.left
              else:
                  if node.right is None:
                      node.right = _Node(sid, user)
                      self._count += 1
                      return
                  node = node.right

      def lookup(self, sid):
          node = self._root
          while node is not None:
              if sid == node.sid:
                  return node.user
              node = node.left if sid < node.sid else node.right
          raise MissingSession(sid)

      def size(self):
          return self._count
  BST

