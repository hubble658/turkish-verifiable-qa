split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) tracking/scan.py adında bir modül oluştur.

  2) Bu modül standart girdiden okunan kargo olaylarını tracking.report.scan ile işlesin.

  3) İşlem sonucunda özeti "in=<n> out=<n> open=<n>" biçiminde tek satır olarak yazsın.

  4) tracking.errors.TrackingError alt sınıfı bir hata oluşursa, hata sınıfının adını stderr'e yazsın ve exit 1 döndürsün.

  5) Başarılı durumda exit 0 döndürsün.

setup: |
  mkdir -p tracking
  touch tracking/__init__.py
  cat > tracking/errors.py <<'ERRORS'
  class TrackingError(Exception):
      pass


  class ScanError(TrackingError):
      pass


  class UnknownCodeError(ScanError):
      pass


  class RouteError(TrackingError):
      pass
  ERRORS
  cat > tracking/events.py <<'EVENTS'
  from tracking.errors import UnknownCodeError


  def parse_events(text):
      events = []
      for line in text.splitlines():
          line = line.strip()
          if not line:
              continue
          code, direction = line.split(":")
          code = code.strip()
          direction = direction.strip()
          if direction not in ("in", "out"):
              raise UnknownCodeError("bad direction: " + direction)
          events.append((code, direction))
      return events
  EVENTS
  cat > tracking/audit.py <<'AUDIT'
  from tracking.errors import RouteError


  class Hub(object):
      def __init__(self):
          self.open_codes = set()
          self.in_count = 0
          self.out_count = 0

      def apply(self, code, direction):
          if direction == "in":
              if code in self.open_codes:
                  raise RouteError("duplicate arrival: " + code)
              self.open_codes.add(code)
              self.in_count += 1
          else:
              if code not in self.open_codes:
                  raise RouteError("unknown departure: " + code)
              self.open_codes.discard(code)
              self.out_count += 1

      def summary(self):
          return {
              "in": self.in_count,
              "out": self.out_count,
              "open": len(self.open_codes),
          }
  AUDIT
  cat > tracking/report.py <<'REPORT'
  from tracking.audit import Hub
  from tracking.events import parse_events


  def scan(text):
      hub = Hub()
      for code, direction in parse_events(text):
          hub.apply(code, direction)
      return hub.summary()
  REPORT

goal_tr: >
  tracking/scan.py adinda bir modul yaz; standart girdiden okunan kargo
  olaylarini tracking.report.scan ile isleyip ozeti "in=<n> out=<n>
  open=<n>" biciminde tek satir olarak yazsin, tracking.errors.TrackingError
  alt sinifi bir hata olusursa hata sinifinin adini stderr'e yazip exit 1
  dondursun, basarili durumda exit 0 dondursun.

reference_solution: |
  cat > tracking/scan.py <<'SCAN'
  import sys

  from tracking.errors import TrackingError
  from tracking.report import scan


  def main(argv=None):
      text = sys.stdin.read()
      try:
          summary = scan(text)
      except TrackingError as exc:
          sys.stderr.write(type(exc).__name__ + "\n")
          return 1
      sys.stdout.write(
          "in=%d out=%d open=%d\n" % (summary["in"], summary["out"], summary["open"])
      )
      return 0


  if __name__ == "__main__":
      sys.exit(main())
  SCAN

