reference_solution: |
  cat > kitchen.py <<'PY'
  class OrderQueue:
      """Priority queue of nested restaurant tickets.

      Each ticket is a dict:
          {"id": str, "priority": int, "items": [ {"name": str, "qty": int}, ... ]}
      Lower priority number means the ticket must be cooked sooner.
      """

      def __init__(self):
          self._entries = []
          self._seq = 0

      def push(self, ticket):
          self._entries.append((ticket["priority"], self._seq, ticket))
          self._seq += 1
          self._entries.sort(key=lambda e: (e[0], e[1]))

      def pop(self):
          if not self._entries:
              raise IndexError("pop from empty OrderQueue")
          return self._entries.pop(0)[2]

      def peek(self):
          if not self._entries:
              raise IndexError("peek from empty OrderQueue")
          return self._entries[0][2]

      def __len__(self):
          return len(self._entries)

      def total_items(self):
          return self._count_items([e[2] for e in self._entries])

      def _count_items(self, tickets):
          if not tickets:
              return 0
          head, *tail = tickets
          return self._count_items_in_basket(head["items"]) + self._count_items(tail)

      def _count_items_in_basket(self, items):
          if not items:
              return 0
          first, *rest = items
          return first["qty"] + self._count_items_in_basket(rest)
  PY

