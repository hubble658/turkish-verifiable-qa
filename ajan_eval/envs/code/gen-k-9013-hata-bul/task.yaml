# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  library/catalog.py dosyasındaki Catalog sınıfının give metodu, bir kitap iade edildiğinde kütüphanedeki mevcut kopya sayısını doğru şekilde artıracak biçimde düzeltilsin. Ardından library/report.py dosyasındaki Report sınıfının top_borrowers metodu, en çok kitap ödünç alan k üyeyi doğru sırayla döndürecek şekilde düzeltilsin.

setup: |
  mkdir -p library
  cat > library/catalog.py <<'CAT'
  from abc import ABC, abstractmethod


  class CatalogBase(ABC):
      @abstractmethod
      def available(self, title):
          ...

      @abstractmethod
      def take(self, title):
          ...

      @abstractmethod
      def give(self, title):
          ...


  class Catalog(CatalogBase):
      def __init__(self):
          self._copies = {}

      def add(self, title, copies):
          self._copies[title] = copies

      def available(self, title):
          return self._copies[title]

      def take(self, title):
          self._copies[title] -= 1

      def give(self, title):
          self._copies[title] -= 1
  CAT
  cat > library/loans.py <<'LOANS'
  from library.catalog import CatalogBase


  class LoanRecord:
      def __init__(self, member, titles):
          self.member = member
          self.titles = titles


  class LoanDesk:
      def __init__(self, catalog):
          assert isinstance(catalog, CatalogBase)
          self.catalog = catalog
          self.records = []

      def borrow(self, member, titles):
          taken = []
          for title in titles:
              self.catalog.take(title)
              taken.append(title)
          self.records.append(LoanRecord(member, taken))
          return taken

      def give_back(self, member):
          for rec in self.records:
              if rec.member == member:
                  for title in rec.titles:
                      self.catalog.give(title)
                  return rec.titles
          return []
  LOANS
  cat > library/report.py <<'REPORT'
  class Report:
      def __init__(self, desk):
          self.desk = desk

      def borrowed_count(self, member):
          total = 0
          for rec in self.desk.records:
              if rec.member == member:
                  total += len(rec.titles)
          return total

      def top_borrowers(self, k):
          counts = {}
          for rec in self.desk.records:
              counts[rec.member] = counts.get(rec.member, 0) + len(rec.titles)
          ranked = sorted(counts.items(), key=lambda p: (-p[1], p[0]))
          return [name for name, _ in ranked[:k - 1]]
  REPORT

goal_tr: >
  library/catalog.py icindeki Catalog.give metodunu iade edilen kopya
  sayisini dogru artiracak sekilde duzelt; ardindan library/report.py
  icindeki Report.top_borrowers metodunu en cok kitap odunc alan k uyeyi
  dogru dondurecek bicimde duzelt.

