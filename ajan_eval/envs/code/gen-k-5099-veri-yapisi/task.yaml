# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  logs/analytics.py dosyasındaki make_counter fonksiyonunu, son chunk_size kadar farklı IP adresini akılda tutan bir LRU önbelleği kullanan bir closure döndürecek şekilde gerçekleştir. Bu closure, count_status fonksiyonunda kullanıldığında verilen status kodu için önbellekte kalan farklı IP sayısını doğru hesaplamalı. Log satırlarını ayrıştırmak için logs/access.py içindeki parse_lines ve iter_chunks fonksiyonlarından yararlanılıyor; mevcut count_status akışı ve dosya yapısı korunmalı, yalnızca make_counter içindeki eksik gerçekleştirme tamamlanmalı.

setup: |
  mkdir -p logs
  touch logs/__init__.py
  cat > logs/access.py <<'ACCESS'
  def parse_lines(lines):
      records = []
      for line in lines:
          line = line.strip()
          if not line:
              continue
          ip, path, status = line.split()
          records.append((ip, path, int(status)))
      return records


  def iter_chunks(text, size):
      lines = text.splitlines()
      for i in range(0, len(lines), size):
          yield lines[i:i + size]
  ACCESS
  cat > logs/analytics.py <<'ANALYTICS'
  from logs.access import iter_chunks, parse_lines


  def make_counter(chunk_size):
      raise NotImplementedError


  def count_status(text, chunk_size, status):
      counter = make_counter(chunk_size)
      for chunk in iter_chunks(text, chunk_size):
          for ip, path, st in parse_lines(chunk):
              counter(ip, st)
      return counter.count(status)
  ANALYTICS
  cat > access.txt <<'TXT'
  10.0.0.1 /index 200
  10.0.0.2 /about 404
  10.0.0.1 /index 200
  10.0.0.3 /login 500
  10.0.0.2 /about 404
  10.0.0.1 /cart 200
  10.0.0.4 /index 200
  10.0.0.3 /login 500
  TXT

goal_tr: >
  logs/analytics.py icindeki make_counter fonksiyonunu, son chunk_size kadar
  farkli IP'yi akilda tutan bir LRU onbellek kullanan closure dondurecek ve
  count_status ile verilen status kodu icin onbellekte kalan farkli IP
  sayisini dogru hesaplayacak bicimde gerceklestir.

reference_solution: |
  cat > logs/analytics.py <<'ANALYTICS'
  from collections import OrderedDict

  from logs.access import iter_chunks, parse_lines


  def make_counter(chunk_size):
      seen = OrderedDict()

      def counter(ip, status):
          seen[ip] = status
          seen.move_to_end(ip)
          if len(seen) > chunk_size:
              seen.popitem(last=False)

      def count(status):
          return sum(1 for st in seen.values() if st == status)

      counter.count = count
      return counter


  def count_status(text, chunk_size, status):
      counter = make_counter(chunk_size)
      for chunk in iter_chunks(text, chunk_size):
          for ip, path, st in parse_lines(chunk):
              counter(ip, st)
      return counter.count(status)
  ANALYTICS

