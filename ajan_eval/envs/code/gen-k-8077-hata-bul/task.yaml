# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Muhasebe ekibi bu ay abonelik faturalarını kontrol ederken tutarların tutmadığını fark etti; birkaç müşterinin satırı eksik ya da yanlış çıkıyor, toplam da bir türlü beklenen rakama oturmuyor. Ben de günün geri kalanını bu işe ayırdım, çünkü raporun doğru olması ay sonu kapanışı için şart.

  billing/summary.py dosyasındaki render fonksiyonu stdin'den okunan abonelik olaylarını işleyip her müşterinin tutarını ve en sonda toplam tutarı verecek şekilde çalışmalı, ama şu anki hali bunu doğru yapmıyor. render fonksiyonunu, her müşteri için hesaplanan tutar ve TOTAL satırı doğru çıkacak biçimde düzeltir misin? Çıktıda her müşteri kendi satırında "müşteri=tutar" biçiminde görünsün, en son satır da "TOTAL=..." olsun; tutarlar sadece sayı olsun, başka bir şey karışmasın.

setup: |
  mkdir -p billing
  cat > billing/plans.py <<'PLANS'
  class PlanCatalog:
      def __init__(self, rows):
          self._rows = rows

      def lookup(self, code):
          for row in self._rows:
              if row["code"] == code:
                  return row
          return None
  PLANS
  cat > billing/usage.py <<'USAGE'
  from billing.plans import PlanCatalog


  def parse_events(text):
      events = []
      for line in text.strip().splitlines():
          if not line.strip():
              continue
          parts = line.split(":")
          events.append((parts[0], parts[1], int(parts[2])))
      return events


  class ChargeStream:
      def __init__(self, events, catalog):
          self._events = events
          self._catalog = catalog

      def __iter__(self):
          return self

      def __next__(self):
          if not self._events:
              raise StopIteration
          code, plan_code, units = self._events.pop(0)
          plan = self._catalog.lookup(plan_code)
          if plan is None:
              return next(self)
          return (code, plan["price"], units)
  USAGE
  cat > billing/summary.py <<'SUMMARY'
  from billing.plans import PlanCatalog
  from billing.usage import parse_events, ChargeStream


  def render(stream):
      text = stream.read()
      events = parse_events(text)
      catalog = PlanCatalog([
          {"code": "basic", "price": "10"},
          {"code": "pro", "price": "25"},
          {"code": "max", "price": "40"},
      ])
      total = 0
      lines = []
      for code, price, units in ChargeStream(events, catalog):
          total = total + price * units
          lines.append(code + "=" + str(price * units))
      lines.append("TOTAL=" + str(total))
      return "\n".join(lines)
  SUMMARY

goal_tr: >
  billing/summary.py icindeki render fonksiyonunu, stdin'den okunan abonelik
  olaylarindan her musterinin tutarini ve toplam tutari dogru hesaplayacak
  bicimde duzelt.

