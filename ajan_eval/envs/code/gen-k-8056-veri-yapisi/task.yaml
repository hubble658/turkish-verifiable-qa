# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Kütüphane otomasyonu üzerinde çalışıyoruz ve ödünç verme sıralaması bir türlü oturmadı; günün sonunda her seferinde aynı yerde takılıyoruz. Sıralamayı elle yapmak yerine kuyruğu koda bırakmak istiyoruz artık. Bu yüzden loans/queue.py içindeki LoanQueue sınıfını baştan sona, gerçekten çalışan bir gerçekleştirmeyle doldur: kuyruk en küçük öncelik değeri önce çıkacak biçimde, aynı öncelikte ise daha az gün kalan ödünçlü önce çıkacak biçimde davransın. push, pop, peek ve __len__ metotlarının dördü de çalışsın; şu an hepsi NotImplementedError ile duruyor ve loans/registry.py ile loans/service.py bu metotlara bağlı. Sadece loans/queue.py dosyasını doldur, diğer dosyalara dokunma.

setup: |
  mkdir -p loans
  cat > loans/queue.py <<'QUEUE'
  import heapq


  class LoanQueue:
      def __init__(self):
          self._heap = []

      def push(self, priority, item):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError
  QUEUE
  cat > loans/registry.py <<'REG'
  from loans.queue import LoanQueue


  def build_queue(records):
      q = LoanQueue()
      for rec in records:
          q.push(rec["priority"], (rec["title"], rec["days"]))
      return q
  REG
  cat > loans/service.py <<'SVC'
  from loans.registry import build_queue


  def next_loans(records, k):
      q = build_queue(records)
      out = []
      for _ in range(k):
          if len(q) == 0:
              break
          out.append(q.pop())
      return out
  SVC
  cat > records.txt <<'REC'
  priority,title,days
  1,novel,14
  5,atlas,7
  3,poems,21
  5,almanac,3
  2,essays,10
  REC

goal_tr: >
  loans/queue.py icindeki LoanQueue sinifini, oncelik kuyrugunu (en kucuk
  oncelik once cikacak bicimde) ve esit oncelikte daha az gun kalan oduncu
  once cikacak bicimde calistiran gercek bir gerceklestirmeyle doldur; push,
  pop, peek ve __len__ metotlarinin hepsi calissin.

reference_solution: |
  cat > loans/queue.py <<'QUEUE'
  import heapq


  class LoanQueue:
      def __init__(self):
          self._heap = []

      def push(self, priority, item):
          heapq.heappush(self._heap, (priority, item[1], item[0]))

      def pop(self):
          priority, days, title = heapq.heappop(self._heap)
          return (title, days)

      def peek(self):
          priority, days, title = self._heap[0]
          return (title, days)

      def __len__(self):
          return len(self._heap)
  QUEUE

outputs:
