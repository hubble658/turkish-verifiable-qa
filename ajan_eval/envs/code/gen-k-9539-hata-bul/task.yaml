  - {path: arena/ranking.py, kind: program, run: 'python3 -c ''from arena.ranking import make_tracker as f; reg,best,names=f(); reg("a"); reg("a"); assert names()==["a"], names(); print("ILERLEME-TAMAM")'''}
  - {path: arena/players.py, kind: program, run: 'python3 -c ''from arena.players import make_player as m, add_score as a; p=m("x"); a(p,4); a(p,7); assert p["scores"]==[4,7], p; print("REGRESYON-TAMAM")'''}

