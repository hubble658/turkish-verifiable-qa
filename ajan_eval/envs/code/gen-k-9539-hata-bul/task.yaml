  - {op: run_stdout_eq, cmd: 'python3 -c ''from arena.summary import run_session as f; r=f([("ana",3),("bo",5),("ana",9)]); assert r=={"ana":9,"bo":5}, r; print("TAMAM")''', value: TAMAM}
  - {op: run_stdout_eq, cmd: 'python3 -c ''from arena.players import make_player as m, add_score as a; p=m("x"); a(p,4); a(p,7); assert p["scores"]==[4,7], p; print("REGRESYON-TAMAM")''', value: REGRESYON-TAMAM}

