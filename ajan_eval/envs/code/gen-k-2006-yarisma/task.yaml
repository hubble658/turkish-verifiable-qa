id: gen-k-2006-yarisma
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  releasekit/report/prefix.py içindeki prefix_sums fonksiyonu, kendisine verilen her satır için ön ek toplamlarını eksiksiz döndürmeli; hiçbir ön ek toplamı atlanmamalı. Ardından releasekit/report/summary.py içindeki cumulative_span fonksiyonu, [lo, hi] aralığındaki (her iki uç dahil) sürüm zaman damgalarının toplamını doğru biçimde hesaplamalı. Bu iki dosyada yapılacak düzeltmeler releasekit/versions.py dosyasındaki parse_versions fonksiyonunun davranışını değiştirmemeli; sürümlerin ayrıştırılması aynı kalmalı. Çalışma sonunda releasekit/report/prefix.py, releasekit/report/summary.py ve releasekit/versions.py dosyaları beklendiği gibi çalışır durumda olmalı.

setup: |
  mkdir -p releasekit/report
  cat > releasekit/versions.py <<'PY'
  def parse_versions(text):
      out = []
      for line in text.strip().splitlines():
          if not line.strip():
              continue
          tag, ts = line.split()
          out.append((tag, int(ts)))
      return out
  PY
  cat > releasekit/report/prefix.py <<'PY'
  def prefix_sums(rows):
      totals = []
      running = 0
      for tag, ts in rows:
          running += ts
          totals.append(running)
      return totals[:len(rows) - 1]
  PY
  cat > releasekit/report/summary.py <<'PY'
  from releasekit.versions import parse_versions
  from releasekit.report.prefix import prefix_sums


  def cumulative_span(stream, lo, hi):
      rows = parse_versions(stream)
      totals = prefix_sums(rows)
      if lo == 0:
          return totals[hi]
      return totals[hi] - totals[lo]
  PY
  printf 'v1 10\nv2 20\nv3 30\nv4 40\n' > history.txt

goal_tr: >
  releasekit/report/prefix.py icindeki prefix_sums fonksiyonunun her on ek
  toplamini eksiksiz dondurmesini, ardindan releasekit/report/summary.py
  icindeki cumulative_span fonksiyonunun [lo, hi] araligindaki (iki ucu
  dahil) surum zaman damgalarinin toplamini dogru hesaplamasini sagla.

reference_solution: |
  cat > releasekit/report/prefix.py <<'PY'
  def prefix_sums(rows):
      totals = []
      running = 0
      for tag, ts in rows:
          running += ts
          totals.append(running)
      return totals
  PY
  cat > releasekit/report/summary.py <<'PY'
  from releasekit.versions import parse_versions
  from releasekit.report.prefix import prefix_sums


  def cumulative_span(stream, lo, hi):
      rows = parse_versions(stream)
      totals = prefix_sums(rows)
      if lo == 0:
          return totals[hi]
      return totals[hi] - totals[lo - 1]
  PY

ara_adim: |
  cat > releasekit/report/prefix.py <<'PY'
  def prefix_sums(rows):
      totals = []
      running = 0
      for tag, ts in rows:
          running += ts
          totals.append(running)
      return totals
  PY

