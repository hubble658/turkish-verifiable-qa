id: gen-k-8315-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) maintenance/stack.py dosyasındaki MaintenanceStack sınıfının __init__, push, pop, peek ve __len__ metotlarını gerçek bir yığın gerçekleştirmesiyle doldur; push ekleme yapsın, pop ve peek yığının son elemanını döndürsün ve __len__ yığındaki eleman sayısını versin.

  2) maintenance/stack.py dosyasındaki SafeMaintenanceStack sınıfında pop ve peek metotlarını öyle doldur ki boş yığın durumunda UnderflowError fırlatılsın, dolu yığında ise doğru eleman döndürülsün.

  3) maintenance/service.py dosyasını hiç değiştirmeden çalışacak şekilde maintenance/stack.py içindeki tüm metotları tamamla.

setup: |
  mkdir -p maintenance
  cat > maintenance/stack.py <<'STACK'
  class MaintenanceStack:
      def __init__(self):
          self._items = []

      def push(self, record):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError


  class MaintenanceError(Exception):
      pass


  class UnderflowError(MaintenanceError):
      pass


  class InvalidRecordError(MaintenanceError):
      pass


  class SafeMaintenanceStack(MaintenanceStack):
      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError
  STACK
  cat > maintenance/service.py <<'SERVICE'
  from maintenance.stack import SafeMaintenanceStack, InvalidRecordError


  REQUIRED = ("machine", "action")


  def validate(record):
      if not isinstance(record, dict):
          raise InvalidRecordError("record must be a dict")
      for key in REQUIRED:
          if key not in record or not str(record[key]).strip():
              raise InvalidRecordError("missing " + key)
      return {"machine": str(record["machine"]).strip(),
              "action": str(record["action"]).strip()}


  def undo_last(stack):
      return stack.pop()


  def last_record(stack):
      return stack.peek()


  def build(records):
      stack = SafeMaintenanceStack()
      for record in records:
          stack.push(validate(record))
      return stack
  SERVICE

goal_tr: >
  maintenance/stack.py icindeki MaintenanceStack ve SafeMaintenanceStack
  siniflarinin tum metotlarini gercek bir yigin gerceklestirmesiyle doldur;
  push/pop/peek/__len__ calissin ve SafeMaintenanceStack bos yiginda
  UnderflowError firlatsin, boylece maintenance/service.py degismeden
  calissin.

reference_solution: |
  cat > maintenance/stack.py <<'STACK'
  class MaintenanceStack:
      def __init__(self):
          self._items = []

      def push(self, record):
          self._items.append(record)

      def pop(self):
          return self._items.pop()

      def peek(self):
          return self._items[-1]

      def __len__(self):
          return len(self._items)


  class MaintenanceError(Exception):
      pass


  class UnderflowError(MaintenanceError):
      pass


  class InvalidRecordError(MaintenanceError):
      pass


  class SafeMaintenanceStack(MaintenanceStack):
      def pop(self):
          if len(self) == 0:
              raise UnderflowError("no records")
          return super().pop()

      def peek(self):
          if len(self) == 0:
              raise UnderflowError("no records")
          return super().peek()
  STACK

