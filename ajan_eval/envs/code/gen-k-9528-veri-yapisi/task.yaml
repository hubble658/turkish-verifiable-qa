goal_tr: >
  entries.txt icindeki hareketleri bagli liste uzerinde tutan bir banka
  defteri kur; make_ledger her cagrida bagimsiz bir defter dondursun,
  make_filter esik degerinin altindaki islemleri eleyen bir suzgec uretsin
  ve build_report suzulen hareketlerin id ile tutar ciftlerini sarmalayan
  bir closure sozlugu ile birlikte toplam tutari dondursun; balance ise tum
  hareketlerin toplamini versin.

reference_solution: |
  cat > bank/node.py <<'NODE'
  class Node:
      def __init__(self, txn_id, amount, next_node=None):
          self.txn_id = txn_id
          self.amount = amount
          self.next = next_node


  class TransactionList:
      def __init__(self):
          self.head = None
          self._size = 0

      def append(self, txn_id, amount):
          node = Node(txn_id, amount)
          if self.head is None:
              self.head = node
          else:
              cur = self.head
              while cur.next is not None:
                  cur = cur.next
              cur.next = node
          self._size += 1
          return node

      def size(self):
          return self._size

      def to_list(self):
          out = []
          cur = self.head
          while cur is not None:
              out.append((cur.txn_id, cur.amount))
              cur = cur.next
          return out


  def make_ledger():
      ledger = TransactionList()

      def append(txn_id, amount):
          return ledger.append(txn_id, amount)

      def snapshot():
          return ledger.to_list()

      def total():
          acc = 0
          cur = ledger.head
          while cur is not None:
              acc += cur.amount
              cur = cur.next
          return acc

      return {"append": append, "snapshot": snapshot, "total": total}


  def make_filter(threshold):
      def keep(txn_id, amount):
          return amount >= threshold
      return keep
  NODE
  cat > bank/report.py <<'REPORT'
  from bank.node import make_ledger, make_filter


  def build_report(entries):
      ledger = make_ledger()
      keep = make_filter(0)
      for txn_id, amount in entries:
          ledger["append"](txn_id, amount)
      kept = [pair for pair in ledger["snapshot"]() if keep(pair[0], pair[1])]
      total = 0
      for _, amount in kept:
          total += amount

      def render():
          return ";".join("%s:%d" % (tid, amt) for tid, amt in kept)

      return {"rows": kept, "total": total, "render": render}


  def balance(entries):
      ledger = make_ledger()
      for txn_id, amount in entries:
          ledger["append"](txn_id, amount)
      return ledger["total"]()
  REPORT

