prompt: |
  1) bank/node.py dosyasındaki make_ledger fonksiyonunu, entries.txt içindeki hareketleri bağlı liste üzerinde tutan ve her çağrıldığında bağımsız yeni bir defter döndürecek şekilde tamamla.

  2) bank/node.py dosyasındaki make_filter fonksiyonunu, verilen eşik değerinin altında kalan işlemleri eleyen bir süzgeç üretecek şekilde tamamla.

  3) bank/report.py dosyasındaki build_report fonksiyonunu, süzülen hareketlerin id ile tutar çiftlerini sarmalayan bir closure sözlüğü ile birlikte toplam tutarı döndürecek şekilde tamamla.

  4) bank/report.py dosyasındaki balance fonksiyonunu, tüm hareketlerin toplamını verecek şekilde tamamla.

