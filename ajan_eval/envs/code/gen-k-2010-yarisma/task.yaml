  - {op: run_stdout_eq, cmd: 'python3 -c ''from depo.paket.sayac import oku_skorlar as f; s=f("depo/veri.txt"); assert s["A"]=={"1":3,"2":5,"3":1}, s["A"]; assert s["D"]=={"1":2,"2":2,"3":2,"4":2}; print("TAMAM")''', value: TAMAM}
  - {op: run_stdout_eq, cmd: 'python3 -c ''from depo.paket.sayac import say_kutu as f; assert f("A",{"A":{"1":3,"2":5}}) == 8; assert f("X",{}) == 0; print("REGRESYON-TAMAM")''', value: REGRESYON-TAMAM}

