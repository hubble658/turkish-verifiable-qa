# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  pricing/avg.py dosyasındaki average_price fonksiyonunu, verilen bir borudan gelen tüm fiyatların ortalamasını doğru şekilde hesaplayacak hale getir. Şu an ilk değerden sonra fonksiyondan çıkıldığı için yalnızca ilk fiyat dönüyor; fonksiyon bunun yerine borudaki her fiyatı okuyup hepsinin ortalamasını döndürmeli. Hiç fiyat yoksa sonuç 0.0 olmalı.

setup: |
  mkdir -p pricing
  cat > pricing/stream.py <<'STREAM'
  def iter_lines(handle):
      for raw in handle:
          line = raw.strip()
          if line:
              yield line
  STREAM
  cat > pricing/parse.py <<'PARSE'
  from pricing.stream import iter_lines


  def iter_prices(handle):
      for line in iter_lines(handle):
          name, value = line.split(",")
          yield (name, float(value))
  PARSE
  cat > pricing/avg.py <<'AVG'
  from pricing.parse import iter_prices


  def average_price(handle):
      running = 0.0
      count = 0
      for _name, value in iter_prices(handle):
          running += value
          count += 1
          if count == 1:
              return running
      if count == 0:
          return 0.0
      return running / count
  AVG
  cat > prices.csv <<'CSV'
  apple,2.0
  banana,4.0
  cherry,6.0
  CSV

goal_tr: >
  pricing/avg.py icindeki average_price fonksiyonunu, borudan gelen tum
  fiyatlarin ortalamasini dogru hesaplayacak bicimde duzelt

reference_solution: |
  cat > pricing/avg.py <<'AVG'
  from pricing.parse import iter_prices


  def average_price(handle):
      running = 0.0
      count = 0
      for _name, value in iter_prices(handle):
          running += value
          count += 1
      if count == 0:
          return 0.0
      return running / count
  AVG

