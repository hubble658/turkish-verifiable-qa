  \n    def push(self, item):\n        self._items.append(item)\n\n    def pop(self):\n        raise NotImplementedError\n\
  \n    def peek(self):\n        raise NotImplementedError\n\n    def depth(self):\n        raise NotImplementedError\n\n\
  \    def __add__(self, other):\n        raise NotImplementedError\n\n    def __len__(self):\n        raise NotImplementedError\n\
  PY\ncat > depot/ledger.py <<'PY'\nfrom depot.stackcore import Stack\n\n\nclass Ledger:\n    def __init__(self):\n      \
  \  self._undo = Stack()\n        self._entries = {}\n\n    def record(self, key, amount):\n        self._undo.push((key,\
  \ amount))\n        self._entries[key] = self._entries.get(key, 0) + amount\n\n    def undo_last(self):\n        raise NotImplementedError\n\
  \n    def balance(self, key):\n        raise NotImplementedError\nPY\ncat > depot/audit.py <<'PY'\nfrom depot.ledger import\
  \ Ledger\n\n\nclass Audit:\n    def __init__(self):\n        self._ledger = Ledger()\n        self._history = Stack()\n\n\
  \    def apply(self, key, amount):\n        self._ledger.record(key, amount)\n        self._history.push((key, amount))\n\
  \n    def rollback(self):\n        raise NotImplementedError\n\n    def total(self, key):\n        raise NotImplementedError\n\
  PY\ncat > inventory.txt <<'TXT'\nbolt 5\nnut 3\nbolt 2\nTXT\n"
goal_tr: 'depot/stackcore.py, depot/ledger.py ve depot/audit.py icindeki NotImplementedError govdelerini gercek bir yigin
  (LIFO) uzerinden calisacak sekilde doldur; Stack pop/peek/depth/__add__/__len__, Ledger undo_last/balance ve Audit rollback/total
  dogru sonuc versin.

  '
reference_solution: "cat > depot/stackcore.py <<'PY'\nclass Stack:\n    def __init__(self):\n        self._items = []\n\n\
  \    def push(self, item):\n        self._items.append(item)\n\n    def pop(self):\n        if not self._items:\n      \
  \      raise IndexError(\"pop from empty stack\")\n        return self._items.pop()\n\n    def peek(self):\n        if not\
  \ self._items:\n            raise IndexError(\"peek from empty stack\")\n        return self._items[-1]\n\n    def depth(self):\n\
  \        return len(self._items)\n\n    def __add__(self, other):\n        merged = Stack()\n        merged._items = list(self._items)\
  \ + list(other._items)\n        return merged\n\n    def __len__(self):\n        return len(self._items)\nPY\ncat > depot/ledger.py\
  \ <<'PY'\nfrom depot.stackcore import Stack\n\n\nclass Ledger:\n    def __init__(self):\n        self._undo = Stack()\n\
  \        self._entries = {}\n\n    def record(self, key, amount):\n        self._undo.push((key, amount))\n        self._entries[key]\
  \ = self._entries.get(key, 0) + amount\n\n    def undo_last(self):\n        key, amount = self._undo.pop()\n        self._entries[key]\
  \ = self._entries.get(key, 0) - amount\n        return (key, amount)\n\n    def balance(self, key):\n        return self._entries.get(key,\
  \ 0)\nPY\ncat > depot/audit.py <<'PY'\nfrom depot.ledger import Ledger\nfrom depot.stackcore import Stack\n\n\nclass Audit:\n\
  \    def __init__(self):\n        self._ledger = Ledger()\n        self._history = Stack()\n\n    def apply(self, key, amount):\n\
  \        self._ledger.record(key, amount)\n        self._history.push((key, amount))\n\n    def rollback(self):\n      \
  \  key, amount = self._history.pop()\n        self._ledger.record(key, -amount)\n        return (key, amount)\n\n    def\
  \ total(self, key):\n        return self._ledger.balance(key)\nPY\n"
ara_adim: "cat > depot/stackcore.py <<'PY'\nclass Stack:\n    def __init__(self):\n        self._items = []\n\n    def push(self,\
  \ item):\n        self._items.append(item)\n\n    def pop(self):\n        if not self._items:\n            raise IndexError(\"\
  pop from empty stack\")\n        return self._items.pop()\n\n    def peek(self):\n        if not self._items:\n        \
  \    raise IndexError(\"peek from empty stack\")\n        return self._items[-1]\n\n    def depth(self):\n        return\
  \ len(self._items)\n\n    def __add__(self, other):\n        merged = Stack()\n        merged._items = list(self._items)\
  \ + list(other._items)\n        return merged\n\n    def __len__(self):\n        return len(self._items)\nPY\n"
