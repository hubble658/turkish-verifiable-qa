reference_solution: |
  cat > clinic/intervals.py <<'INTERVALS'
  """Core interval algebra used by the appointment planner."""


  class Interval:
      """A closed-open time range [start, end) on a linear scale."""

      def __init__(self, start, end):
          self.start = start
          self.end = end

      def overlaps(self, other):
          return self.start < other.end and other.start < self.end

      def merge(self, other):
          return Interval(min(self.start, other.start), max(self.end, other.end))

      def __repr__(self):
          return "Interval(%r, %r)" % (self.start, self.end)


  def normalize(intervals):
      live = [iv for iv in intervals if iv.start < iv.end]
      live.sort(key=lambda iv: (iv.start, iv.end))
      return live


  def merge_all(intervals):
      live = normalize(intervals)
      out = []
      for iv in live:
          if out and iv.start <= out[-1].end:
              out[-1] = out[-1].merge(iv)
          else:
              out.append(Interval(iv.start, iv.end))
      return out
  INTERVALS
  cat > clinic/planner.py <<'PLANNER'
  """Appointment planner built on top of clinic.intervals."""
  from clinic.intervals import Interval, merge_all, normalize


  class Planner:
      """Collects busy slots and answers free-window queries."""

      def __init__(self, busy):
          self.busy = list(busy)
          self._merged = None

      def add(self, start, end):
          self.busy.append(Interval(start, end))
          self._merged = None

      def merged(self):
          if self._merged is None:
              self._merged = merge_all(self.busy)
          return self._merged

      def free_slots(self, day_start, day_end):
          free = []
          cursor = day_start
          for iv in self.merged():
              if iv.start > cursor:
                  free.append(Interval(cursor, iv.start))
              cursor = max(cursor, iv.end)
          if cursor < day_end:
              free.append(Interval(cursor, day_end))
          return free
  PLANNER
  cat > clinic/loader.py <<'LOADER'
  """Reads appointment files into Interval objects."""
  from clinic.intervals import Interval


  def parse_line(line):
      start, end = line.split()
      return Interval(_to_seconds(start), _to_seconds(end))


  def _to_seconds(stamp):
      hh, mm = stamp.split(":")
      return int(hh) * 3600 + int(mm) * 60


  def load_busy(path):
      with open(path) as fh:
          return [parse_line(ln) for ln in fh.read().splitlines() if ln.strip()]
  LOADER

