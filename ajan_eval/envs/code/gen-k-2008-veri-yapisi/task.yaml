prompt: |
  clinic paketindeki aralık cebiri ve randevu planlayıcısı üzerinde çalışman gerekiyor. clinic/intervals.py dosyasında Interval sınıfını ve normalize ile merge_all fonksiyonlarını gerçekleştir; aralıklar kapalı-açık [start, end) biçiminde ve saniye cinsinden düşünülsün. Interval nesneleri iki aralığın çakışıp çakışmadığını ve birleşip birleşemeyeceğini söyleyebilmeli; normalize aralıkları başlangıca göre sıralayıp boş olanları atmalı; merge_all ise çakışan ya da birbirine değen aralıkları tek bir sıralı liste halinde birleştirmeli. clinic/planner.py içindeki Planner sınıfının add, merged ve free_slots metotlarını da tamamla: add yeni bir meşgul aralık ekleyebilmeli, merged birleştirilmiş meşgul listesini döndürmeli, free_slots ise verilen gün başlangıcı ve bitişi arasında boş kalan pencereleri doğru biçimde cevaplamalı.

  clinic/loader.py dosyasında ise randevu dosyalarını Interval nesnelerine çeviren parse_line ve load_busy fonksiyonlarını gerçekleştir. parse_line tek bir satırı okuyup bir Interval üretmeli, load_busy ise verilen yoldaki randevu dosyasını okuyup meşgul aralıkların listesini döndürmeli. Başlangıçta /workspace altında clinic/__init__.py, clinic/intervals.py, clinic/planner.py, clinic/loader.py ve appointments.txt dosyaları var; appointments.txt içinde her satırda "09:00 09:30" biçiminde başlangıç ve bitiş saatleri bulunuyor, bu saatleri saniye cinsine çevirerek aralıklara dönüştürmelisin. Amaç, bu paketin aralıkları saniye cinsinden birleştirmesi, randevu dosyasından okuyabilmesi ve boş pencere sorgusunu doğru yanıtlaması.

