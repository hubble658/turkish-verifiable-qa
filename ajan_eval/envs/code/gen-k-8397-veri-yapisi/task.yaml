  - {path: school/intervals.py, kind: program, run: 'python3 -c ''from school.transcript import summarize as s; from school.terms import merge_term_ranges as m; d={"A":[(2019,2021),(2020,2022)],"B":[(2023,2023)]}; assert s(d)=={"A":4,"B":1}, s(d); d2={"C":[(2000,2001),(2005,2006),(2001,2005)]}; assert s(d2)=={"C":7}, s(d2); d3={"D":[(2010,2012),(2016,2018)]}; assert s(d3)=={"D":6}, s(d3); assert m.cagri_sayisi==3, m.cagri_sayisi; print("TAMAM")'''}
