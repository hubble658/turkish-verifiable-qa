goal_tr: >
  stock/moves/cache.py icindeki make_lru fonksiyonunu kapasiteye sahip,
  get/put metotlari olan bir LRU onbellek closure'i dondurecek sekilde ve
  stock/moves/ledger.py icindeki Ledger sinifini bu onbellegi kullanip
  parcali akistan SKU basina net miktari dogru biriktirecek sekilde
  gerceklestir.

reference_solution: |
  cat > stock/moves/cache.py <<'CACHE'
  def make_lru(capacity):
      """Return an LRU cache closure with get/put methods."""
      store = {}
      order = []

      def touch(key):
          if key in order:
              order.remove(key)
          order.append(key)

      def get(key):
          if key not in store:
              return None
          touch(key)
          return store[key]

      def put(key, value):
          if key in store:
              store[key] = value
              touch(key)
              return
          if len(store) >= capacity:
              oldest = order.pop(0)
              del store[oldest]
          store[key] = value
          order.append(key)

      return {"get": get, "put": put}
  CACHE
  cat > stock/moves/ledger.py <<'LEDGER'
  from stock.moves.cache import make_lru


  class Ledger:
      """Accumulate net quantity per SKU from a stream of movement lines."""

      def __init__(self, capacity):
          self.cache = make_lru(capacity)

      def feed(self, chunk):
          nets = {}
          for line in chunk:
              sku, delta = line.split(",")
              nets[sku] = nets.get(sku, 0) + int(delta)
          for sku, delta in nets.items():
              prior = self.cache["get"](sku)
              base = prior if prior is not None else 0
              self.cache["put"](sku, base + delta)
          return nets

      def net(self, sku):
          return self.cache["get"](sku)
  LEDGER

