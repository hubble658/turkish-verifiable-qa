  stock/moves/cache.py içindeki make_lru'yu, verilen kapasiteye sahip get/put metotlu bir LRU önbellek closure'ı döndürecek şekilde tamamla. stock/moves/ledger.py'deki Ledger sınıfı bu önbelleği kullanıp parçalı akıştan SKU başına net miktarı doğru biriktirsin.

