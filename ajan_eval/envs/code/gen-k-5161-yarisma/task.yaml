goal_tr: >
  clinic/queue.py icindeki AppointmentQueue sinifini, push ile eklenen
  randevulari son-giren-ilk-cikar sirada tutan ve pop ile en son ekleneni
  donduren; __iter__ ile de yigini bozmadan sondan basa dogru dolasabilen
  bir yigin olarak gerceklestir; ardindan clinic/schedule.py icindeki
  build_schedule fonksiyonunu, verilen departman listesindeki her bolum icin
  o bolume ait randevulari sirayla yigina itip yigindan cekerek bolum
  adindan randevu listesine giden bir sozluk uretecek bicimde yaz.

reference_solution: |
  cat > clinic/queue.py <<'QUEUE'
  class AppointmentQueue:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          if not self._items:
              raise IndexError("pop from empty queue")
          return self._items.pop()

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          index = len(self._items) - 1
          while index >= 0:
              yield self._items[index]
              index -= 1
  QUEUE

  cat > clinic/schedule.py <<'SCHED'
  from clinic.queue import AppointmentQueue


  def build_schedule(visits, departments):
      schedule = {}
      for dept in departments:
          queue = AppointmentQueue()
          for code, kind, day in visits:
              if kind == dept:
                  queue.push((code, day))
          ordered = []
          while len(queue) > 0:
              ordered.append(queue.pop())
          schedule[dept] = ordered
      return schedule
  SCHED

