# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  game/scoreboard.py içindeki build_board fonksiyonunu düzelt. Öyle ki her "round" olayında oyuncuların o tur içinde topladığı puanlar sıfırlansın, ancak oyuncuların toplam puanları korunsun. Böylece her "round" olayından sonra o turda toplanan puanlar sıfırdan başlasın.

  Bunu yaparken game/state.py dosyasındaki mevcut yapıyı koru; gerekirse bu dosyada da gerekli düzenlemeleri yap. game/scoreboard.py içindeki leader fonksiyonu, en yüksek toplam puana sahip oyuncuyu doğru şekilde döndürmeye devam etsin.

  Şu şartlar sağlanmalı:
  - game/state.py ve game/scoreboard.py dosyaları mevcut olmalı.
  - build_board, "score" olaylarında puanları ilgili oyuncunun toplamına eklemeli.
  - build_board, "round" olayında oyuncuların tur içi puanlarını sıfırlamalı, toplam puanları değiştirmemeli.
  - Bir "round" olayından sonra gelen "score" olayları yeni turun puanı olarak sayılmalı.
  - leader, oyuncular arasından en yüksek toplam puana sahip oyuncunun adını döndürmeli.
  - Hiç oyuncu yoksa leader None döndürmeli.

setup: |
  mkdir -p game
  cat > game/state.py <<'STATE'
  def fresh_state():
      return {"players": {}, "round": 0}


  def add_score(state, name, points):
      players = state["players"]
      if name not in players:
          players[name] = {"total": 0, "history": []}
      players[name]["total"] += points
      players[name]["history"].append(points)
      state["round"] += 1
      return state


  def new_round(state):
      state["round"] += 1
      return state
  STATE
  cat > game/scoreboard.py <<'SCORE'
  from game.state import fresh_state, add_score, new_round


  def build_board(events):
      state = fresh_state()
      for event in events:
          kind = event["kind"]
          if kind == "score":
              add_score(state, event["name"], event["points"])
          elif kind == "round":
              new_round(state)
      return state


  def leader(state):
      players = state["players"]
      if not players:
          return None
      best = max(players.items(), key=lambda kv: kv[1]["total"])
      return best[0]
  SCORE

goal_tr: >
  game/scoreboard.py icindeki build_board fonksiyonunu, her tur olayinda
  oyuncularin tur-ici puanlarinin sifirlanip toplamin korunacagi ve leader
  fonksiyonunun en yuksek toplamli oyuncuyu dogru dondurecegi bicimde
  duzelt; boylece her "round" olayindan sonra o turda toplanan puanlar
  sifirdan baslasin.

reference_solution: |
  cat > game/state.py <<'STATE'
  def fresh_state():
      return {"players": {}, "round": 0}


  def add_score(state, name, points):
      players = state["players"]
      if name not in players:
          players[name] = {"total": 0, "history": []}
      players[name]["total"] += points
      players[name]["history"].append(points)
      return state


  def new_round(state):
      state["round"] += 1
      for info in state["players"].values():
          info["history"] = []
      return state
  STATE
  cat > game/scoreboard.py <<'SCORE'
  from game.state import fresh_state, add_score, new_round


  def build_board(events):
      state = fresh_state()
      for event in events:
          kind = event["kind"]
          if kind == "score":
              add_score(state, event["name"], event["points"])
          elif kind == "round":
              new_round(state)
      return state


  def leader(state):
      players = state["players"]
      if not players:
          return None
      best = max(players.items(), key=lambda kv: kv[1]["total"])
      return best[0]
  SCORE

