  cat > kitchen/__init__.py <<'PY'
  PY
  cat > kitchen/tree.py <<'PY'
  class OrderTree:
      def __init__(self):
          self.root = None

      def insert(self, key, value):
          raise NotImplementedError

      def __contains__(self, key):
          raise NotImplementedError

      def __iter__(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError

      def __add__(self, other):
          raise NotImplementedError

      def __getitem__(self, key):
          raise NotImplementedError
  PY
  cat > kitchen/parse.py <<'PY'
  from kitchen.tree import OrderTree


  def load_orders(path):
      tree = OrderTree()
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              name, qty, price = line.split(",")
              tree.insert(name, (int(qty), float(price)))
      return tree
  PY
  cat > kitchen/report.py <<'PY'
  from kitchen.parse import load_orders


  def merge_revenue(path_a, path_b):
      a = load_orders(path_a)
      b = load_orders(path_b)
      return len(a + b)


  def menu(path):
      tree = load_orders(path)
      return [name for name in tree]


  def price_of(path, name):
      tree = load_orders(path)
      return tree[name]
  PY
  cat > orders.txt <<'TXT'
  pizza,2,9.5
  salad,1,4.0
  pasta,3,7.25
  TXT
  cat > extra.txt <<'TXT'
  pizza,1,9.5
  soup,2,3.0
  TXT

goal_tr: >
  kitchen/tree.py icindeki OrderTree sinifini tam olarak gerceklestir:
  insert, __contains__, __iter__ (adlara gore alfabetik sirada), __len__
  (dugum sayisi), __add__ (iki agacin birlesimi, ayni adli anahtarda ikinci
  agacin degeri kazanir) ve __getitem__ (anahtarin qty*price degeri).

reference_solution: |
  cat > kitchen/tree.py <<'PY'
  class _Node:
      def __init__(self, key, value):
          self.key = key
          self.value = value
          self.left = None
          self.right = None


  class OrderTree:
      def __init__(self):
          self.root = None

      def insert(self, key, value):
          if self.root is None:
              self.root = _Node(key, value)
              return
          node = self.root
          while True:
              if key < node.key:
                  if node.left is None:
                      node.left = _Node(key, value)
                      return
                  node = node.left
              elif key > node.key:
                  if node.right is None:
                      node.right = _Node(key, value)
                      return
                  node = node.right
              else:
                  node.value = value
                  return

      def __contains__(self, key):
          node = self.root
          while node is not None:
              if key == node.key:
                  return True
              node = node.left if key < node.key else node.right
          return False

      def __iter__(self):
          stack = []
          node = self.root
          while stack or node is not None:
              while node is not None:
                  stack.append(node)
                  node = node.left
              node = stack.pop()
              yield node.key
              node = node.right

      def __len__(self):
          count = 0
          for _ in self:
              count += 1
          return count

      def __add__(self, other):
          result = OrderTree()
          for name in self:
              result.insert(name, self[name])
          for name in other:
              result.insert(name, other[name])
          return result

      def __getitem__(self, key):
          node = self.root
          while node is not None:
              if key == node.key:
                  return node.value[0] * node.value[1]
              node = node.left if key < node.key else node.right
          raise KeyError(key)
  PY

