  kitchen/tree.py içindeki OrderTree sınıfını tam olarak gerçekleştir: insert, __contains__, __iter__ (adlara göre alfabetik), __len__ (düğüm sayısı), __add__ (iki ağacın birleşimi; aynı adlı anahtarda ikinci ağacın değeri kazanır) ve __getitem__ (anahtarın qty*price değeri).

