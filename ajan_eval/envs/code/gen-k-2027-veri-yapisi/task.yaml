split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  fleet/queue.py içindeki VehicleQueue sınıfını tamamla. Sınıfın pop metodu kuyruktaki en eski elemanı çıkarsın ve döndürsün; böylece yapı FIFO düzeninde çalışsın. Sınıfın __iter__ metodu ise kuyruk tamamen boşalana kadar elemanları sırayla üretsin. Bu sayede fleet/dispatch.py içindeki dispatch_all fonksiyonu elemanları doğru sırada döndürsün. Sınıfın mevcut push ve __len__ davranışları olduğu gibi kalsın.

setup: |
  mkdir -p fleet
  cat > fleet/events.py <<'EVENTS'
  class EventLog:
      def __init__(self, lines):
          self._lines = list(lines)

      def __iter__(self):
          return self

      def __next__(self):
          if not self._lines:
              raise StopIteration
          return self._lines.pop(0)


  def load_events(path):
      with open(path) as fh:
          raw = [ln.strip() for ln in fh if ln.strip()]
      return EventLog(raw)
  EVENTS
  cat > fleet/queue.py <<'QUEUE'
  class VehicleQueue:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          raise NotImplementedError

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          raise NotImplementedError
  QUEUE
  cat > fleet/dispatch.py <<'DISPATCH'
  from fleet.queue import VehicleQueue


  def build_queue(events):
      q = VehicleQueue()
      for event in events:
          q.push(event)
      return q


  def dispatch_all(events):
      q = build_queue(events)
      out = []
      for item in q:
          out.append(item)
      return out
  DISPATCH
  cat > data.txt <<'DATA'
  ADD t1 north
  ADD t2 south
  ADD t3 east
  ADD t4 west
  DATA

goal_tr: >
  fleet/queue.py icindeki VehicleQueue sinifini tamamla: pop en eski elemani
  cikarsin (FIFO), __iter__ kuyrugu bosaltana kadar sirayla eleman uretsin;
  boylece fleet/dispatch.py icindeki dispatch_all dogru sirada sonuc
  dondursun

reference_solution: |
  cat > fleet/queue.py <<'QUEUE'
  class VehicleQueue:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          if not self._items:
              raise IndexError("pop from empty queue")
          return self._items.pop(0)

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          while self._items:
              yield self._items.pop(0)
  QUEUE

ara_adim: |
  cat > fleet/queue.py <<'QUEUE'
  class VehicleQueue:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          if not self._items:
              raise IndexError("pop from empty queue")
          return self._items.pop(0)

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          raise NotImplementedError
  QUEUE

