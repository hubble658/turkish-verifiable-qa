# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Sabah toplantıda rezervasyon modülünün yarım kaldığını söylediler, ben de oturdum dosyalara baktım. Şu an rezervasyon/rezerve.py içindeki rezervasyon_yap fonksiyonu ilk sorunlu istekte tüm işlemeyi kesip erken dönüyor; oysa bize listedeki bütün istekleri baştan sona işleyip her biri için ayrı sonuç döndüren bir sürüm lazım.

  rezervasyon/rezerve.py dosyasındaki rezervasyon_yap fonksiyonunu öyle düzelt ki uçuş bulunamasa veya koltuk dolu olsa bile listedeki tüm istekler sırayla işlensin ve her istek için bir sonuç döndürülsün. Başarılı olan istekler rezervasyon kodlarını sırayla üretilen sırayla almalı; başarısız olan istekler ise ne koltuk tüketmeli ne de kod almamalı.

setup: |
  mkdir -p rezervasyon
  cat > rezervasyon/kodlar.py <<'KODLAR'
  def kod_uret(prefix):
      sayac = [0]

      def uret():
          sayac[0] += 1
          return prefix + "-" + str(sayac[0])

      return uret
  KODLAR
  cat > rezervasyon/rezerve.py <<'REZERVE'
  from rezervasyon.kodlar import kod_uret


  def rezervasyon_yap(ucuslar, istekler):
      kod = kod_uret("RZ")
      sonuc = []
      for istek in istekler:
          ad = istek["ad"]
          ucus = istek["ucus"]
          if ucus not in ucuslar:
              sonuc.append((ad, "YOK"))
              return sonuc
          koltuk = ucuslar[ucus]
          if koltuk <= 0:
              sonuc.append((ad, "DOLU"))
              return sonuc
          ucuslar[ucus] = koltuk - 1
          sonuc.append((ad, kod()))
      return sonuc
  REZERVE

goal_tr: >
  rezervasyon/rezerve.py icindeki rezervasyon_yap fonksiyonunu, ucus yok
  veya koltuk dolu olsa bile listedeki tum istekleri isleyip her istek icin
  sonuc dondurecek bicimde duzelt; basarili istekler sirayla uretilen
  kodlari almali, basarisiz istekler koltuk tuketmemeli ve kod almamali.

reference_solution: |
  cat > rezervasyon/rezerve.py <<'REZERVE'
  from rezervasyon.kodlar import kod_uret


  def rezervasyon_yap(ucuslar, istekler):
      kod = kod_uret("RZ")
      sonuc = []
      for istek in istekler:
          ad = istek["ad"]
          ucus = istek["ucus"]
          if ucus not in ucuslar:
              sonuc.append((ad, "YOK"))
              continue
          koltuk = ucuslar[ucus]
          if koltuk <= 0:
              sonuc.append((ad, "DOLU"))
              continue
          ucuslar[ucus] = koltuk - 1
          sonuc.append((ad, kod()))
      return sonuc
  REZERVE

