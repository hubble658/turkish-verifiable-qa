# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  plans/queue/priority.py içindeki PriorityQueue sınıfını ve plans/report.py içindeki rank_plans fonksiyonunu gerçekleştir. data.txt dosyasındaki her satırdan ad, taban_fiyat ve koltuk bilgilerini okuyarak Plan nesneleri oluştur; ardından rank_plans bu planları aylık maliyete göre en pahalıdan en ucuza doğru sıralayıp yalnızca plan adlarını döndürsün. PriorityQueue önceliği büyük olan öğeyi önce verecek şekilde çalışsın ve rank_plans sıralamayı yaparken bu kuyruğu kullansın. plans/base/plan.py içindeki Plan sınıfını olduğu gibi kullan.

  Şu şartlar sağlanmalı:
  - plans/queue/priority.py içinde PriorityQueue sınıfı push, pop, peek, is_empty ve __len__ metotlarıyla eksiksiz gerçekleştirilmiş olmalı; NotImplementedError kalmamalı.
  - PriorityQueue.push öncelik değeri büyük olan öğeyi kuyruktan önce çıkaracak şekilde davranmalı.
  - plans/report.py içindeki rank_plans fonksiyonu NotImplementedError içermemeli ve sıralamayı PriorityQueue üzerinden yapmalı.
  - rank_plans, data.txt satırlarından okunan planları aylık maliyete göre en pahalıdan en ucuza doğru sıralı bir liste olarak döndürmeli.
  - rank_plans döndürdüğü listede yalnızca plan adlarını içermeli; başka alan yer almamalı.
  - data.txt satır biçimi ad,taban_fiyat,koltuk olarak korunmalı ve aylık maliyet taban_fiyat ile koltuk çarpımı üzerinden hesaplanmalı.
  - plans/base/plan.py içindeki Plan sınıfı değiştirilmeden kullanılmalı.

setup: |
  mkdir -p plans/base plans/queue
  cat > plans/base/plan.py <<'PLAN'
  class Plan:
      def __init__(self, name, base_price, seats):
          self.name = name
          self.base_price = base_price
          self.seats = seats

      def monthly_cost(self):
          return self.base_price * self.seats
  PLAN
  cat > plans/queue/priority.py <<'PRIORITY'
  class PriorityQueue:
      def __init__(self):
          self._items = []

      def push(self, priority, item):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def is_empty(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError
  PRIORITY
  cat > plans/report.py <<'REPORT'
  from plans.base.plan import Plan
  from plans.queue.priority import PriorityQueue


  def rank_plans(plans):
      raise NotImplementedError
  REPORT
  cat > data.txt <<'DATA'
  starter,10,2
  pro,25,3
  team,40,5
  DATA

goal_tr: >
  plans/queue/priority.py icindeki PriorityQueue sinifini ve plans/report.py
  icindeki rank_plans fonksiyonunu, data.txt satirlarindan
  (ad,taban_fiyat,koltuk) planlari okuyup aylik maliyete gore en pahalidan
  en ucuza dogru adlari dondurecek bicimde gerceklestir; PriorityQueue
  onceligi buyuk olan once cikacak sekilde calissin ve rank_plans onu
  kullanarak siralamayi yapsin.

reference_solution: |
  cat > plans/queue/priority.py <<'PRIORITY'
  class PriorityQueue:
      def __init__(self):
          self._items = []

      def push(self, priority, item):
          self._items.append((priority, item))
          self._items.sort(key=lambda pair: pair[0])

      def pop(self):
          return self._items.pop()[1]

      def peek(self):
          return self._items[-1][1]

      def is_empty(self):
          return not self._items

      def __len__(self):
          return len(self._items)
  PRIORITY
  cat > plans/report.py <<'REPORT'
  from plans.base.plan import Plan
  from plans.queue.priority import PriorityQueue


  def _parse(text):
      rows = []
      for line in text.strip().splitlines():
          name, base, seats = line.split(',')
          rows.append(Plan(name, float(base), int(seats)))
      return rows


  def rank_plans(text):
      queue = PriorityQueue()
      for plan in _parse(text):
          queue.push(plan.monthly_cost(), plan.name)
      ordered = []
      while not queue.is_empty():
          ordered.append(queue.pop())
      return ordered
  REPORT

