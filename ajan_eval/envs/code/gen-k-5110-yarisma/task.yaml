# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) callcenter/planner.py dosyasını oluştur.

  2) Bu dosyada greedy_schedule(stream, budget) fonksiyonunu tanımla; fonksiyon RecordStream context manager'ı ile kayıtları tüketsin.

  3) Fonksiyon, toplam maliyeti budget değerini aşmayacak şekilde kayıtları en düşük maliyetli olandan başlayarak açgözlü biçimde seçsin ve seçilen ajan adlarını liste olarak döndürsün.

setup: |
  mkdir -p callcenter data
  cat > callcenter/records.py <<'RECORDS'
  class RecordStream:
      """Reads raw call records from a text stream, one per line.

      Format: agent,duration,cost
      """

      def __init__(self, stream):
          self._stream = stream
          self._seen = 0

      def __enter__(self):
          return self

      def __exit__(self, exc_type, exc, tb):
          return False

      def __iter__(self):
          return self

      def __next__(self):
          for line in self._stream:
              line = line.strip()
              if not line:
                  continue
              agent, duration, cost = line.split(",")
              self._seen += 1
              return (agent, int(duration), float(cost))
          raise StopIteration

      @property
      def seen(self):
          return self._seen
  RECORDS
  cat > data/calls.txt <<'CALLS'
  alice,120,3.5
  bob,90,1.5
  carol,200,2.0
  dave,60,4.0
  CALLS

goal_tr: >
  callcenter/planner.py dosyasini yaz; greedy_schedule(stream, budget)
  fonksiyonu RecordStream context manager'i ile kayitlari tuketip, toplam
  maliyeti butceyi asmayan kayitlari once en dusuk maliyetli olacak sekilde
  acgozlu secip secilen ajan adlarini liste olarak dondursun.

reference_solution: |
  cat > callcenter/planner.py <<'PLANNER'
  from callcenter.records import RecordStream


  def greedy_schedule(stream, budget):
      with RecordStream(stream) as records:
          rows = list(records)
      rows.sort(key=lambda r: r[2])
      picked = []
      spent = 0.0
      for agent, _duration, cost in rows:
          if spent + cost <= budget:
              picked.append(agent)
              spent += cost
      return picked
  PLANNER

