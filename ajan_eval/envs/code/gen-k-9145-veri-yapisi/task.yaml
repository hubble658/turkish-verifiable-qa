split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 22

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  `roster/paths.py` içindeki `find_path` fonksiyonunu, hedefe ulaşılamadığında yanlış değeri döndürecek şekilde düzelt. Ardından `roster/schedule.py` içindeki `reachable_chain` fonksiyonunu, `find_path` fonksiyonuna `(start, goal)` çiftini geçerek doğru sonucu döndürecek biçimde düzelt. `roster/edges.py` dosyasına dokunma. `roster/coverage.py` dosyasındaki `covers_all` fonksiyonunun bu düzeltmelerden sonra beklendiği gibi çalışmasını sağla; `shifts.txt` içindeki kenar tanımları değişmemeli.

setup: |
  mkdir -p roster
  cat > roster/edges.py <<'E'
  def parse_edges(text):
      edges = []
      for line in text.strip().splitlines():
          if not line.strip():
              continue
          a, b = line.split("->")
          edges.append((a.strip(), b.strip()))
      return edges


  def build_adjacency(edges):
      adj = {}
      for a, b in edges:
          adj.setdefault(a, [])
          adj.setdefault(b, [])
          adj[a].append(b)
      return adj
  E
  cat > roster/paths.py <<'P'
  def find_path(adj, start, goal):
      stack = [start]
      seen = set()
      while stack:
          node = stack.pop()
          if node in seen:
              continue
          seen.add(node)
          if node == goal:
              return True
          for nxt in adj.get(node, []):
              stack.append(nxt)
      return True
  P
  cat > roster/schedule.py <<'S'
  from roster.edges import parse_edges, build_adjacency
  from roster.paths import find_path


  def reachable_chain(text, start, goal):
      adj = build_adjacency(parse_edges(text))
      return find_path(adj, start)
  S
  cat > roster/coverage.py <<'C'
  from roster.schedule import reachable_chain


  def covers_all(text, start, goals):
      return all(reachable_chain(text, start, g) for g in goals)
  C
  cat > shifts.txt <<'T'
  A -> B
  B -> C
  C -> D
  A -> D
  T

goal_tr: >
  roster/paths.py icindeki find_path fonksiyonunun hedefe ulasilamadiginda
  yanlis (False) dondurmesini sagla, ardindan roster/schedule.py icindeki
  reachable_chain fonksiyonunu find_path'e (start, goal) ciftini gecirerek
  dogru sonuc dondurecek bicimde duzelt.

reference_solution: |
  cat > roster/paths.py <<'P'
  def find_path(adj, start, goal):
      stack = [start]
      seen = set()
      while stack:
          node = stack.pop()
          if node in seen:
              continue
          seen.add(node)
          if node == goal:
              return True
          for nxt in adj.get(node, []):
              stack.append(nxt)
      return False
  P
  cat > roster/schedule.py <<'S'
  from roster.edges import parse_edges, build_adjacency
  from roster.paths import find_path


  def reachable_chain(text, start, goal):
      adj = build_adjacency(parse_edges(text))
      return find_path(adj, start, goal)
  S

ara_adim: |
  cat > roster/paths.py <<'P'
