prompt: |
  Küçük bir rota planlama aracı üzerinde çalışıyoruz; ekip ağ topolojilerini düğüm ve kenar ağırlıkları olarak tutuyor ve bu yapıyı sorgulamak için ortak bir arayüz kullanmak istiyor. Bugün route/segments.py tarafındaki ayrıştırma ve komşuluk kurma işleri oturdu, sıra graf sarmalayıcısına geldi.

  route/graph.py dosyasındaki RouteGraph sınıfında şu an boş duran iterator protokolünü tamamla: __iter__ düğümleri artan sırada döndürsün, __len__ düğüm sayısını versin, __contains__ ise bir düğümün grafta olup olmadığını söylesin. Aynı sınıftaki two_pointer_walk metodunu da, başlangıçtan hedefe iki-işaretçi (çift yönlü BFS) yöntemiyle en kısa düğüm listesini döndürecek şekilde gerçekleştir. Başlangıç veya hedef grafta yoksa boş liste, başlangıç hedefe eşitse tek elemanlı liste dönmesi gerekiyor.

setup: |
  mkdir -p route
  cat > route/segments.py <<'SEG'
  def load_segments(text):
      """Parse 'a b w' lines into a list of (a, b, weight) tuples."""
      out = []
      for line in text.strip().splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          a, b, w = line.split()
          out.append((a, b, int(w)))
      return out


  def build_adjacency(edges):
      """Return {node: [(neighbor, weight), ...]} sorted by neighbor."""
      adj = {}
      for a, b, w in edges:
          adj.setdefault(a, []).append((b, w))
          adj.setdefault(b, []).append((a, w))
      for node in adj:
          adj[node].sort()
      return adj
  SEG

  cat > route/graph.py <<'GRAPH'
  class RouteGraph:
      """Graph wrapper. Iterator protocol must be implemented."""

      def __init__(self, adjacency):
          self.adjacency = adjacency
          self._nodes = sorted(adjacency)

      def neighbors(self, node):
          return list(self.adjacency.get(node, []))

      def __iter__(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError

      def __contains__(self, node):
          raise NotImplementedError

      def two_pointer_walk(self, start, goal):
          raise NotImplementedError
  GRAPH

  cat > route/__init__.py <<'INIT'
  INIT

  cat > network.txt <<'NET'
  a b 4
  a c 1
  b d 2
  c d 5
  d e 3
  e f 7
  NET

goal_tr: >
  route/graph.py icindeki RouteGraph sinifinda iterator protokolunu
  (__iter__ dugumleri artan sirada, __len__ dugum sayisi, __contains__
  uyelik testi) ve two_pointer_walk metodunu, baslangictan hedefe
  iki-isaretci (cift yonlu BFS) yontemiyle en kisa dugum listesini
  dondurecek sekilde gerceklestir; baslangic veya hedef grafda yoksa bos
  liste, baslangic hedefe esitse tek elemanli liste don.

reference_solution: |
  cat > route/graph.py <<'GRAPH'
  class RouteGraph:
      """Graph wrapper with iterator protocol and a two-pointer path walk."""

      def __init__(self, adjacency):
          self.adjacency = adjacency
          self._nodes = sorted(adjacency)

      def neighbors(self, node):
          return list(self.adjacency.get(node, []))

      def __iter__(self):
          return iter(self._nodes)

      def __len__(self):
          return len(self._nodes)

      def __contains__(self, node):
          return node in self.adjacency

      def two_pointer_walk(self, start, goal):
          if start not in self.adjacency or goal not in self.adjacency:
              return []
          if start == goal:
              return [start]
          front = {start: [start]}
          back = {goal: [goal]}
          while front and back:
              if len(front) > len(back):
                  front, back = back, front
              nxt = {}
              for node, path in front.items():
                  for nb, _w in self.adjacency.get(node, []):
                      if nb in back:
                          if path[0] == start:
                              return path + back[nb][::-1]
                          return back[nb] + path[::-1]
                      if nb not in nxt:
                          nxt[nb] = path + [nb]
              front = nxt
          return []
  GRAPH

