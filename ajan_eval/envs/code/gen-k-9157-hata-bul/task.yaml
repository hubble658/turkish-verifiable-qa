# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  maintenance/rules.py ve maintenance/report.py dosyalarındaki hataları gider. maintenance/rules.py içindeki is_alert fonksiyonu 90.0 değerini alarm olarak saymasın; yalnızca 90.0'dan büyük değerler alarm olsun. maintenance/report.py içindeki alert_machines fonksiyonu ilk alarmda erken dönmek yerine tüm alarmları toplasın ve aynı makine birden fazla alarm üretse bile sonuçta o makineyi yalnızca bir kez döndürsün. maintenance/streams.py dosyası olayları okumaya devam etsin. Böylece events.txt için alarm listesi ["press","lathe"] olsun.

  Su sartlar saglanmali:
  - maintenance/rules.py içindeki is_alert, değeri tam 90.0 olan bir olayı alarm saymamalı; yalnızca 90.0'dan büyük değerleri alarm saymalı.
  - maintenance/report.py içindeki alert_machines, ilk alarmda erken dönmemeli; tüm olayları tarayıp alarm üreten makineleri toplamalı.
  - alert_machines aynı makineyi birden fazla alarm üretse bile sonuç listesinde yalnızca bir kez döndürmeli.
  - events.txt için alert_machines sonucu tam olarak ["press","lathe"] olmalı.
  - maintenance/streams.py dosyasındaki read_events davranışı korunmalı.

setup: |
  mkdir -p maintenance
  cat > maintenance/streams.py <<'STREAMS'
  def read_events(rows):
      for row in rows:
          if not row:
              continue
          parts = row.split("|")
          if len(parts) < 3:
              continue
          machine, kind, value = parts[0], parts[1], parts[2]
          yield {"machine": machine, "kind": kind, "value": value}
  STREAMS
  cat > maintenance/rules.py <<'RULES'
  def tagged(fn):
      def wrapper(event):
          result = fn(event)
          event["alert"] = result
          return result
      return wrapper


  @tagged
  def is_alert(event):
      return event["kind"] == "temp" and float(event["value"]) >= 90.0
  RULES
  cat > maintenance/report.py <<'REPORT'
  from maintenance.streams import read_events
  from maintenance.rules import is_alert


  def alert_machines(rows):
      out = []
      for ev in read_events(rows):
          if is_alert(ev):
              return [ev["machine"]]
      return out
  REPORT
  cat > events.txt <<'EV'
  press|temp|95.0
  press|vibe|3.0
  lathe|temp|88.0
  lathe|temp|91.5
  mill|temp|90.0
  EV

goal_tr: >
  maintenance zincirindeki iki hatayi gider: rules.py icindeki is_alert tam
  90.0 degeri alarm SAYMAMALI (90.0'dan buyuk olmali) ve report.py icindeki
  alert_machines ilk alarmda erken donmek yerine tum alarmlari toplayip ayni
  makineyi bir kez dondurmeli; boylece events.txt icin alarm listesi
  ["press","lathe"] olsun.

reference_solution: |
  cat > maintenance/rules.py <<'RULES'
  def tagged(fn):
      def wrapper(event):
          result = fn(event)
          event["alert"] = result
          return result
      return wrapper


  @tagged
  def is_alert(event):
      return event["kind"] == "temp" and float(event["value"]) > 90.0
  RULES
  cat > maintenance/report.py <<'REPORT'
  from maintenance.streams import read_events
  from maintenance.rules import is_alert


  def alert_machines(rows):
      out = []
      for ev in read_events(rows):
          if is_alert(ev):
              if ev["machine"] not in out:
                  out.append(ev["machine"])
      return out
  REPORT

