id: gen-k-5132-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) release/stack.py dosyasındaki ReleaseStack sınıfını gerçekle; push, pop, peek ve __len__ metotları ile context manager davranışı doğru çalışsın.

  2) release/loader.py içindeki load_history fonksiyonunun, releases.txt dosyasındaki satırları en eski sürüm en altta olacak biçimde yığına yüklemesini sağla.

setup: |
  mkdir -p release
  cat > release/stack.py <<'STACK'
  class ReleaseStack:
      def __init__(self):
          self._items = []

      def __enter__(self):
          return self

      def __exit__(self, exc_type, exc, tb):
          return False

      def push(self, item):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError
  STACK
  cat > release/loader.py <<'LOADER'
  from release.stack import ReleaseStack


  def load_history(path):
      with open(path, encoding="utf-8") as fh:
          lines = [ln.strip() for ln in fh if ln.strip()]
      with ReleaseStack() as st:
          for ln in lines:
              st.push(ln)
      return st
  LOADER
  cat > releases.txt <<'TXT'
  v1.0.0
  v1.1.0
  v2.0.0
  v2.1.0
  TXT

goal_tr: >
  release/stack.py icindeki ReleaseStack sinifini, push/pop/peek/__len__ ve
  context manager davranisi dogru calisacak sekilde gercekleyip,
  release/loader.py'nin releases.txt satirlarini en eski en altta olacak
  bicimde yigina yuklemesini sagla.

reference_solution: |
  cat > release/stack.py <<'STACK'
  class ReleaseStack:
      def __init__(self):
          self._items = []

      def __enter__(self):
          return self

      def __exit__(self, exc_type, exc, tb):
          return False

      def push(self, item):
          self._items.append(item)

      def pop(self):
          if not self._items:
              raise IndexError("pop from empty ReleaseStack")
          return self._items.pop()

      def peek(self):
          if not self._items:
              raise IndexError("peek from empty ReleaseStack")
          return self._items[-1]

      def __len__(self):
          return len(self._items)
  STACK

