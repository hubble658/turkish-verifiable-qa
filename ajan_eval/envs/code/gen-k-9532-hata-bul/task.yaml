# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Çağrı merkezi kayıtlarından en yoğun temsilciyi ve ilk k temsilciyi seçen raporu düzelt. callcenter/report.py, callcenter/ledger.py ve callcenter/events.py dosyaları üzerinde çalış.

  Şu şartlar sağlanmalı:
  - Eşit süreli temsilcilerde en yoğun temsilci seçimi yanlış temsilciyi öne alıyor; bu davranış kabul kriterlerine uygun hale gelmeli.
  - Bir kayıt türü toplamlara hiç yansımıyor; bu davranış da kabul kriterlerine uygun hale gelmeli.
  - callcenter/report.py içindeki busiest_agent ve top_agents fonksiyonları doğru sonuç vermeli.
  - callcenter/ledger.py toplamları doğru tutmalı.
  - callcenter/events.py kayıtları doğru normalize etmeli.

setup: |
  mkdir -p callcenter
  cat > callcenter/events.py <<'EVENTS'
  def normalize(event):
      kind, agent, duration = event
      return (kind.strip().lower(), agent.strip(), int(duration))


  class Duration:
      def __init__(self, seconds):
          self.seconds = seconds

      def __add__(self, other):
          return Duration(self.seconds + other.seconds)

      def __eq__(self, other):
          return self.seconds == other.seconds

      def __hash__(self):
          return hash(self.seconds)

      def __repr__(self):
          return "Duration(%d)" % self.seconds
  EVENTS
  cat > callcenter/ledger.py <<'LEDGER'
  from callcenter.events import normalize, Duration


  class Ledger:
      def __init__(self):
          self._totals = {}

      def add(self, event):
          kind, agent, duration = normalize(event)
          if kind == "talk":
              current = self._totals.get(agent, Duration(0))
              self._totals[agent] = current + Duration(duration)

      def totals(self):
          return dict(self._totals)
  LEDGER
  cat > callcenter/report.py <<'REPORT'
  from callcenter.ledger import Ledger


  def busiest_agent(events):
      ledger = Ledger()
      for event in events:
          ledger.add(event)
      totals = ledger.totals()
      if not totals:
          return None
      best = None
      for agent, total in totals.items():
          if best is None or total >= totals[best]:
              best = agent
      return best


  def top_agents(events, k):
      ledger = Ledger()
      for event in events:
          ledger.add(event)
      totals = ledger.totals()
      ordered = sorted(totals, key=lambda a: -totals[a].seconds)
      return ordered[:k]
  REPORT

goal_tr: >
  Cagri merkezi kayitlarindan en yogun temsilciyi ve ilk k temsilciyi secen
