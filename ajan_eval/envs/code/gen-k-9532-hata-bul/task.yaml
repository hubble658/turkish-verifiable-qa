reference_solution: |
  cat > callcenter/events.py <<'EVENTS'
  def normalize(event):
      kind, agent, duration = event
      return (kind.strip().lower(), agent.strip(), int(duration))


  class Duration:
      def __init__(self, seconds):
          self.seconds = seconds

      def __add__(self, other):
          return Duration(self.seconds + other.seconds)

      def __eq__(self, other):
          return self.seconds == other.seconds

      def __hash__(self):
          return hash(self.seconds)

      def __repr__(self):
          return "Duration(%d)" % self.seconds
  EVENTS
  cat > callcenter/ledger.py <<'LEDGER'
  from callcenter.events import normalize, Duration


  class Ledger:
      def __init__(self):
          self._totals = {}

      def add(self, event):
          kind, agent, duration = normalize(event)
          if kind in ("talk", "hold"):
              current = self._totals.get(agent, Duration(0))
              self._totals[agent] = current + Duration(duration)

      def totals(self):
          return dict(self._totals)
  LEDGER
  cat > callcenter/report.py <<'REPORT'
  from callcenter.ledger import Ledger


  def busiest_agent(events):
      ledger = Ledger()
      for event in events:
          ledger.add(event)
      totals = ledger.totals()
      if not totals:
          return None
      best = None
      for agent, total in totals.items():
          if best is None or total.seconds > totals[best].seconds:
              best = agent
      return best


  def top_agents(events, k):
      ledger = Ledger()
      for event in events:
          ledger.add(event)
      totals = ledger.totals()
      order = list(totals)
      order.sort(key=lambda a: -totals[a].seconds)
      return order[:k]
  REPORT

