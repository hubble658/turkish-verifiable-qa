# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depot/raf.py içindeki RafZinciri sınıfına ekle, toplam ve esik_uzerinde metotlarını yaz; depot/yerlesim.py'deki zincir_kur kayıtları bağlı listeye çevirsin, depot/rapor.py'deki rapor_uret en az esik adetli raf kodlarını sıralı döndürsün.

setup: |
  mkdir -p depot
  cat > depot/raf.py <<'RAF'
  class RafDugumu:
      def __init__(self, kod, adet):
          self.kod = kod
          self.adet = adet
          self.sonraki = None


  class RafZinciri:
      def __init__(self):
          self.bas = None

      def ekle(self, kod, adet):
          raise NotImplementedError

      def toplam(self):
          raise NotImplementedError

      def esik_uzerinde(self, esik):
          raise NotImplementedError
  RAF
  cat > depot/yerlesim.py <<'YER'
  from depot.raf import RafZinciri


  def zincir_kur(kayitlar):
      raise NotImplementedError
  YER
  cat > depot/rapor.py <<'RAPOR'
  from depot.yerlesim import zincir_kur


  def rapor_uret(kayitlar, esik):
      raise NotImplementedError
  RAPOR

goal_tr: >
  depot/raf.py icindeki RafZinciri sinifini (ekle, toplam, esik_uzerinde
  metotlariyla) ve depot/yerlesim.py ile depot/rapor.py icindeki
  fonksiyonlari, zincir_kur kayitlari bagli listeye cevirip rapor_uret en az
  esik adetli raf kodlarini sirali dondurecek bicimde gerceklestir

reference_solution: |
  cat > depot/raf.py <<'RAF'
  class RafDugumu:
      def __init__(self, kod, adet):
          self.kod = kod
          self.adet = adet
          self.sonraki = None


  class RafZinciri:
      def __init__(self):
          self.bas = None

      def ekle(self, kod, adet):
          yeni = RafDugumu(kod, adet)
          if self.bas is None:
              self.bas = yeni
              return
          imlec = self.bas
          while imlec.sonraki is not None:
              imlec = imlec.sonraki
          imlec.sonraki = yeni

      def toplam(self):
          toplam = 0
          imlec = self.bas
          while imlec is not None:
              toplam += imlec.adet
              imlec = imlec.sonraki
          return toplam

      def esik_uzerinde(self, esik):
          kodlar = []
          imlec = self.bas
          while imlec is not None:
              if imlec.adet >= esik:
                  kodlar.append(imlec.kod)
              imlec = imlec.sonraki
          return kodlar
  RAF
  cat > depot/yerlesim.py <<'YER'
  from depot.raf import RafZinciri


  def zincir_kur(kayitlar):
      zincir = RafZinciri()
      for kayit in kayitlar:
          zincir.ekle(kayit["kod"], kayit["adet"])
      return zincir
  YER
  cat > depot/rapor.py <<'RAPOR'
  from depot.yerlesim import zincir_kur


  def rapor_uret(kayitlar, esik):
      zincir = zincir_kur(kayitlar)
      kodlar = zincir.esik_uzerinde(esik)
      kodlar.sort()
      return {"toplam": zincir.toplam(), "secili": kodlar}
  RAPOR

