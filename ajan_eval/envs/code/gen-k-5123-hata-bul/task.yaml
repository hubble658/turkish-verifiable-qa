# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  shop/rank.py içindeki RevenueRanker.top_names metodunu düzelt. Metot, ciroya göre en yüksek k siparişin adını büyükten küçüğe doğru döndürmeli. Siparişlerin cirosu, shop/parse.py içindeki OrderParser.records metodunun ürettiği kayıtlardaki miktar ve fiyat değerlerinin çarpımıyla hesaplanır. shop/raw.py ve shop/parse.py dosyaları olduğu gibi kalmalı; yalnızca shop/rank.py üzerinde çalış.

setup: |
  mkdir -p shop
  cat > shop/raw.py <<'RAW'
  from abc import ABC, abstractmethod


  class LineSource(ABC):
      @abstractmethod
      def lines(self):
          ...


  class FileSource(LineSource):
      def __init__(self, path):
          self.path = path

      def lines(self):
          with open(self.path, encoding="utf-8") as fh:
              return [ln.strip() for ln in fh if ln.strip()]
  RAW
  cat > shop/parse.py <<'PARSE'
  from abc import ABC, abstractmethod

  from shop.raw import LineSource, FileSource


  class RecordParser(ABC):
      @abstractmethod
      def records(self):
          ...


  class OrderParser(RecordParser):
      def __init__(self, source):
          self.source = source

      def records(self):
          out = []
          for line in self.source.lines():
              name, qty, price = line.split(",")
              out.append((name, int(qty), float(price)))
          return out
  PARSE
  cat > shop/rank.py <<'RANK'
  from abc import ABC, abstractmethod

  from shop.parse import RecordParser, OrderParser
  from shop.raw import FileSource


  class Ranker(ABC):
      @abstractmethod
      def top_names(self, k):
          ...


  class RevenueRanker(Ranker):
      def __init__(self, parser):
          self.parser = parser

      def top_names(self, k):
          rows = self.parser.records()
          rows.sort(key=lambda r: r[1] * r[2])
          return [r[0] for r in rows[:k]]


  def top_names(path, k):
      return RevenueRanker(OrderParser(FileSource(path))).top_names(k)
  RANK
  cat > orders.txt <<'TXT'
  widget,3,4.0
  gadget,1,50.0
  bolt,10,0.5
  nut,2,10.0
  TXT

goal_tr: >
  shop/rank.py icindeki RevenueRanker.top_names metodunu, ciroya gore en
  yuksek k siparisin adini buyukten kucuge dogru dondurecek bicimde duzelt.

reference_solution: |
  cat > shop/rank.py <<'RANK'
  from abc import ABC, abstractmethod

  from shop.parse import RecordParser, OrderParser
  from shop.raw import FileSource


  class Ranker(ABC):
      @abstractmethod
      def top_names(self, k):
          ...


  class RevenueRanker(Ranker):
      def __init__(self, parser):
          self.parser = parser

      def top_names(self, k):
          rows = self.parser.records()
          rows.sort(key=lambda r: r[1] * r[2], reverse=True)
          return [r[0] for r in rows[:k]]


  def top_names(path, k):
      return RevenueRanker(OrderParser(FileSource(path))).top_names(k)
  RANK

outputs:
  - {path: shop/rank.py, kind: program, run: 'python3 -c ''from shop.rank import top_names as f, RevenueRanker as R, Ranker as A; from shop.parse import OrderParser as P; from shop.raw import FileSource as S; assert issubclass(R, A); r=R(P(S("orders.txt"))); assert r.top_names(2)==["gadget","nut"], r.top_names(2); assert r.top_names(1)==["gadget"]; assert r.top_names(4)==["gadget","nut","widget","bolt"]; assert f("orders.txt",3)==["gadget","nut","widget"]; print("TAMAM")'''}

