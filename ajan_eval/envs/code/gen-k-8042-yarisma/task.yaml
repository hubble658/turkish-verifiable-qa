# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  stockkit/ledger.py dosyasını oluştur. Bu dosyada bir StockLedger sınıfı tanımla; sınıf bir context manager olarak çalışsın, yani __enter__ ve __exit__ metotları tanımlı olsun. StockLedger nesnesi __init__ ile aldığı csv yollarını stockkit.io.reader üzerinden okusun ve sku bazında net hareketleri toplasın. Sınıfın apply(target) metodu, verilen hedef sözlüğü bu net hareketlerle güncellesin ve toplam net değişimi döndürsün.

  Şu şartlar sağlanmalı:
  - stockkit/ledger.py dosyası oluşturulmuş olmalı.
  - Dosyada StockLedger sınıfı tanımlı olmalı.
  - StockLedger sınıfı __enter__ ve __exit__ metotlarını içermeli.
  - __init__ metodu csv yollarını almalı ve bu yolları stockkit.io.reader üzerinden okumalı.
  - Okunan hareketler sku bazında net hareketlere indirgenmeli.
  - apply(target) metodu hedef sözlüğü net hareketlerle güncellemeli.
  - apply(target) metodu toplam net değişimi döndürmeli.

setup: |
  mkdir -p stockkit/io
  cat > stockkit/io/reader.py <<'READER'
  def read_moves(path):
      rows = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              sku, delta = line.split(',')
              rows.append((sku, int(delta)))
      return rows
  READER
  cat > stockkit/io/__init__.py <<'INIT'
  INIT
  cat > stockkit/__init__.py <<'INIT'
  INIT
  cat > moves_a.csv <<'CSV'
  bolt,5
  nut,-2
  bolt,3
  CSV
  cat > moves_b.csv <<'CSV'
  nut,7
  washer,4
  bolt,-1
  CSV

goal_tr: >
  stockkit/ledger.py dosyasini yaz: StockLedger sinifi bir context manager
  olacak (__enter__ ve __exit__ tanimli), __init__ ile verilen csv yollarini
  stockkit.io.reader uzerinden okuyup sku bazinda net hareketleri toplayacak
  ve apply(target) metodu hedef sozlugu bu net hareketlerle guncelleyip net
  degisimi dondurecek.

reference_solution: |
  cat > stockkit/ledger.py <<'LEDGER'
  from stockkit.io.reader import read_moves


  class StockLedger:
      def __init__(self, paths):
          self.paths = list(paths)
          self.net = {}
          self.closed = False

      def __enter__(self):
          for path in self.paths:
              for sku, delta in read_moves(path):
                  self.net[sku] = self.net.get(sku, 0) + delta
          return self

      def __exit__(self, exc_type, exc, tb):
          self.closed = True
          return False

      def apply(self, target):
          changes = {}
          for sku, delta in self.net.items():
              if delta != 0:
                  changes[sku] = delta
                  target[sku] = target.get(sku, 0) + delta
          return changes
  LEDGER

