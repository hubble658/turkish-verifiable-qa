split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 22

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  relpack/versions.py içindeki parse_stream'i sürümün tüm bileşenlerini (major.minor.patch) koruyacak şekilde düzelt. relpack/stack.py içindeki latest'i, her paket için en büyük sürümü döndüren @max_version dekoratörüyle çalışacak biçimde düzelt; relpack/report.py doğru raporu üretsin.

setup: |
  mkdir -p relpack
  cat > relpack/versions.py <<'VERS'
  def parse_stream(lines):
      out = []
      for line in lines:
          line = line.strip()
          if not line:
              continue
          name, ver = line.split("=")
          parts = ver.split(".")
          out.append((name, [int(p) for p in parts[:2]]))
      return out
  VERS
  cat > relpack/stack.py <<'STACK'
  from relpack.versions import parse_stream


  def build_history(pairs):
      history = {}
      for name, ver in pairs:
          history.setdefault(name, []).append(ver)
      return history


  def latest(pairs):
      hist = build_history(pairs)
      out = {}
      for name, versions in hist.items():
          out[name] = versions[0]
      return out


  def from_stream(lines):
      return latest(parse_stream(lines))
  STACK
  cat > relpack/report.py <<'REPORT'
  from relpack.stack import from_stream


  def render(lines):
      cur = from_stream(lines)
      lines_out = []
      for name in sorted(cur):
          lines_out.append(name + ":" + ".".join(str(p) for p in cur[name]))
      return "\n".join(lines_out)
  REPORT
  cat > input.txt <<'TXT'
  alpha=1.2.0
  beta=2.0.1
  alpha=1.3.0
  TXT

goal_tr: >
  relpack/versions.py icindeki parse_stream'i surumun TUM bilesenlerini
  (major.minor.patch) koruyacak sekilde duzelt ve relpack/stack.py icindeki
  latest'i, her paket icin surum listesindeki en buyuk surumu donduren bir
  `@max_version` dekoratoru kullanacak bicimde duzelt; boylece
  relpack/report.py dogru raporu uretsin.

reference_solution: |
  cat > relpack/versions.py <<'VERS'
  def parse_stream(lines):
      out = []
      for line in lines:
          line = line.strip()
          if not line:
              continue
          name, ver = line.split("=")
          parts = ver.split(".")
          out.append((name, [int(p) for p in parts]))
      return out
  VERS
  cat > relpack/stack.py <<'STACK'
  from relpack.versions import parse_stream


  def build_history(pairs):
      history = {}
      for name, ver in pairs:
          history.setdefault(name, []).append(ver)
      return history


  def max_version(func):
      def wrapper(versions):
          best = versions[0]
          for ver in versions:
              if ver > best:
                  best = ver
          return func(best)
      return wrapper


  @max_version
  def pick(best):
      return best


  def latest(pairs):
      hist = build_history(pairs)
      out = {}
      for name, versions in hist.items():
          out[name] = pick(versions)
      return out


  def from_stream(lines):
      return latest(parse_stream(lines))
  STACK

