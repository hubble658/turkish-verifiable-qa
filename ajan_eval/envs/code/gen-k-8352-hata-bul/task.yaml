split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  fleet/core/registry.py içindeki Registry.is_busy metodunu düzelt; dolu araçlar için True, boş araçlar için False döndürsün.

setup: |
  mkdir -p fleet/core
  cat > fleet/core/errors.py <<'ERRORS'
  class FleetError(Exception):
      pass


  class VehicleMissing(FleetError):
      pass


  class VehicleBusy(FleetError):
      pass
  ERRORS
  cat > fleet/core/registry.py <<'REGISTRY'
  from fleet.core.errors import VehicleMissing, VehicleBusy


  class Registry:
      def __init__(self):
          self._busy = {}

      def load(self, path):
          with open(path) as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  name, state = line.split(',')
                  self._busy[name] = (state == "busy")

      def is_busy(self, name):
          if name not in self._busy:
              raise VehicleMissing(name)
          return self._busy[name] is False

      def claim(self, name):
          if name not in self._busy:
              raise VehicleMissing(name)
          if self._busy[name]:
              raise VehicleBusy(name)
          self._busy[name] = True
          return name
  REGISTRY
  cat > fleet/__init__.py <<'INIT'
  INIT
  cat > fleet/core/__init__.py <<'CORE'
  CORE
  cat > fleet.txt <<'DATA'
  van-1,free
  van-2,busy
  truck-9,free
  DATA

goal_tr: >
  fleet/core/registry.py icindeki Registry.is_busy metodunu, dolu araclar
  icin True ve bos araclar icin False dondurecek bicimde duzelt.

reference_solution: |
  cat > fleet/core/registry.py <<'REGISTRY'
  from fleet.core.errors import VehicleMissing, VehicleBusy


  class Registry:
      def __init__(self):
          self._busy = {}

      def load(self, path):
          with open(path) as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  name, state = line.split(',')
                  self._busy[name] = (state == "busy")

      def is_busy(self, name):
          if name not in self._busy:
              raise VehicleMissing(name)
          return self._busy[name] is True

      def claim(self, name):
          if name not in self._busy:
              raise VehicleMissing(name)
          if self._busy[name]:
              raise VehicleBusy(name)
          self._busy[name] = True
          return name
  REGISTRY

outputs:
