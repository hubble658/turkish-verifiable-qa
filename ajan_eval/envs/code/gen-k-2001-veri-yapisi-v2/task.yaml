# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  /workspace dizinindeki docpipe paketinde DocStore sınıfını docpipe/store.py içinde append, find ve to_list metotlarıyla birlikte gerçekleştir; DocStore başlangıçta docpipe/records.py içindeki Doc ve Node veri sınıflarını kullanacak şekilde tanımlı. Ayrıca docpipe/report.py içindeki load_store ve longest_doc fonksiyonlarını yaz; load_store, stdin'den gelen "doc_id:govde" biçimindeki satırlardan bağlı liste tabanlı bir DocStore oluşturup döndürsün, longest_doc ise aynı satırlar üzerinden en uzun govdeye sahip belgenin doc_id'sini verecek bir Doc döndürsün. main.py bu fonksiyonları kullanarak önce toplam belge sayısını, ardından en uzun belgenin doc_id'sini yazdırıyor; bu çıktı doğru üretilecek. Gerekli dosyalar docpipe/store.py, docpipe/report.py ve docpipe/records.py; docpipe/records.py içindeki Doc ve Node tanımları ile main.py olduğu gibi kalmalı.

setup: |
  mkdir -p docpipe
  cat > docpipe/records.py <<'RECORDS'
  from dataclasses import dataclass


  @dataclass
  class Doc:
      doc_id: str
      body: str


  @dataclass
  class Node:
      doc: Doc
      next: "Node" = None
  RECORDS
  cat > docpipe/store.py <<'STORE'
  from docpipe.records import Doc, Node


  class DocStore:
      def __init__(self):
          self.head = None
          self.size = 0

      def append(self, doc):
          raise NotImplementedError

      def find(self, doc_id):
          raise NotImplementedError

      def to_list(self):
          raise NotImplementedError
  STORE
  cat > docpipe/report.py <<'REPORT'
  from docpipe.store import DocStore


  def load_store(lines):
      raise NotImplementedError


  def longest_doc(lines):
      raise NotImplementedError
  REPORT
  cat > main.py <<'MAIN'
  import sys
  from docpipe.report import load_store, longest_doc


  def main():
      lines = [ln.rstrip("\n") for ln in sys.stdin if ln.strip()]
      store = load_store(lines)
      print(store.size)
      print(longest_doc(lines).doc_id)


  if __name__ == "__main__":
      main()
  MAIN

goal_tr: >
  docpipe/store.py icindeki DocStore sinifini (append, find, to_list) ve
  docpipe/report.py icindeki load_store ile longest_doc fonksiyonlarini,
  stdin'den gelen "doc_id:govde" satirlarindan bagli liste kurup en uzun
  govdeli belgenin doc_id'sini ve toplam belge sayisini dogru uretecek
  bicimde gerceklestir.

reference_solution: |
  cat > docpipe/store.py <<'STORE'
  from docpipe.records import Doc, Node


  class DocStore:
      def __init__(self):
          self.head = None
          self.size = 0

      def append(self, doc):
          node = Node(doc)
          if self.head is None:
              self.head = node
          else:
              cur = self.head
              while cur.next is not None:
                  cur = cur.next
              cur.next = node
          self.size += 1

      def find(self, doc_id):
          cur = self.head
          while cur is not None:
              if cur.doc.doc_id == doc_id:
                  return cur.doc
              cur = cur.next
          return None

      def to_list(self):
          out = []
          cur = self.head
          while cur is not None:
              out.append(cur.doc)
              cur = cur.next
          return out
  STORE
  cat > docpipe/report.py <<'REPORT'
  from docpipe.records import Doc
  from docpipe.store import DocStore


  def load_store(lines):
      store = DocStore()
      for line in lines:
          doc_id, _, body = line.partition(":")
          store.append(Doc(doc_id.strip(), body.strip()))
      return store


  def longest_doc(lines):
      store = load_store(lines)
      best = None
      for doc in store.to_list():
          if best is None or len(doc.body) > len(best.body):
              best = doc
      return best
  REPORT

