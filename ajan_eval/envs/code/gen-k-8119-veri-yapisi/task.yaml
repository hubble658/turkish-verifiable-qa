goal_tr: >
  exam/results.py icindeki ResultStack sinifini
  push/pop/peek/__len__/last_of ile ve exam/gradebook.py icindeki
  latest_score ve rank_latest fonksiyonlarini, yigin bosken EmptyResults,
  ogrenci hic eklenmemisse MissingStudent firlatacak ve en son eklenen
  sonuclari dogru dondurecek sekilde gerceklestir.

reference_solution: |
  cat > exam/results.py <<'RESULTS'
  class ResultError(Exception):
      pass


  class EmptyResults(ResultError):
      pass


  class MissingStudent(ResultError):
      pass


  class ResultStack:
      def __init__(self):
          self._items = []
          self._seen = set()

      def push(self, student, score):
          self._items.append((student, score))
          self._seen.add(student)

      def pop(self):
          if not self._items:
              raise EmptyResults("stack is empty")
          return self._items.pop()

      def peek(self):
          if not self._items:
              raise EmptyResults("stack is empty")
          return self._items[-1]

      def __len__(self):
          return len(self._items)

      def last_of(self, student):
          if student not in self._seen:
              raise MissingStudent(student)
          for name, score in reversed(self._items):
              if name == student:
                  return score
          raise MissingStudent(student)
  RESULTS
  cat > exam/gradebook.py <<'GRADEBOOK'
  from exam.results import ResultStack, EmptyResults, MissingStudent


  def latest_score(stack, student):
      return stack.last_of(student)


  def rank_latest(stack, students):
      scored = [(s, stack.last_of(s)) for s in students]
      scored.sort(key=lambda pair: pair[1], reverse=True)
      return [name for name, _ in scored]
  GRADEBOOK

