# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  clinic/schedule.py'yi yeniden yaz: DaySchedule context manager olsun (girişte açık kaydı döndürsün, çıkışta kaynağı kapatsın) ve slots_for kayıtlı olmayan hasta için boş liste döndürsün.

setup: |
  mkdir -p clinic
  cat > clinic/records.py <<'REC'
  def load_records(path):
      rows = {}
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              pid, day, slot = line.split(',')
              rows.setdefault(pid, []).append((day, slot))
      return rows
  REC
  cat > clinic/schedule.py <<'SCHED'
  from clinic.records import load_records


  class DaySchedule:
      def __init__(self, path):
          self.rows = load_records(path)

      def slots_for(self, pid):
          return [slot for (day, slot) in self.rows[pid]]
  SCHED
  cat > clinic/report.py <<'REP'
  from clinic.schedule import DaySchedule


  class Report:
      def __init__(self, path):
          self.schedule = DaySchedule(path)

      def count(self, pid):
          return len(self.schedule.slots_for(pid))

      def busiest(self, pids):
          best = None
          best_n = -1
          for pid in pids:
              n = self.count(pid)
              if n > best_n:
                  best = pid
                  best_n = n
          return best
  REP
  cat > appointments.txt <<'TXT'
  p1,mon,09:00
  p1,tue,10:00
  p2,mon,11:00
  p2,wed,12:00
  p2,thu,13:00
  p3,fri,14:00
  TXT

goal_tr: >
  clinic/schedule.py dosyasini, DaySchedule sinifi bir context manager
  olacak sekilde (__enter__ acik kaydi dondurup __exit__ kaynagi kapatsin)
  ve slots_for kayitli olmayan hasta icin bos liste dondurecek bicimde
  yeniden yaz.

reference_solution: |
  cat > clinic/schedule.py <<'SCHED'
  from clinic.records import load_records


  class DaySchedule:
      def __init__(self, path):
          self.path = path
          self.rows = None

      def __enter__(self):
          self.rows = load_records(self.path)
          return self

      def __exit__(self, exc_type, exc, tb):
          self.rows = None
          return False

      def slots_for(self, pid):
          return [slot for (day, slot) in self.rows.get(pid, [])]
  SCHED

outputs:
