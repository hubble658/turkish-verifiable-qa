id: gen-k-8214-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) /workspace dizinindeki sessions.py dosyasını aç ve make_forest fonksiyonunu incele.

  2) make_forest fonksiyonunu, her (uid, peer) çifti için parent[uid] = peer atamasını doğrudan yapmak yerine, önce uid ve peer için find ile iki kök bulacak ve bu iki kökü birleştirecek biçimde düzelt.

  3) Bu değişiklikten sonra iç içe zincirlerde yer alan tüm kullanıcıların aynı grubu paylaşması sağlanmış olsun.

  4) sessions.py dosyasındaki find ve group_owner fonksiyonlarını koru; yalnızca make_forest fonksiyonunun davranışını düzelt.

  5) Dosyayı /workspace/sessions.py olarak kaydet.

setup: |
  cat > sessions.py <<'PY'
  def make_forest(events):
      parent = {}
      for uid, peer in events:
          parent.setdefault(uid, uid)
          parent.setdefault(peer, peer)
      for uid, peer in events:
          parent[uid] = peer
      return parent


  def find(parent, x):
      while parent[x] != x:
          x = parent[x]
      return x


  def group_owner(parent, uid):
      return find(parent, uid)
  PY

goal_tr: >
  sessions.py icindeki make_forest fonksiyonunu, parent[uid]=peer atamasini
  dogrudan yapmak yerine find ile iki kok bulup kokleri birlestirecek
  bicimde duzelt; boylece ic ice zincirlerdeki tum kullanicilar ayni grubu
  paylassin.

reference_solution: |
  cat > sessions.py <<'PY'
  def make_forest(events):
      parent = {}
      for uid, peer in events:
          parent.setdefault(uid, uid)
          parent.setdefault(peer, peer)
      for uid, peer in events:
          ra, rb = find(parent, uid), find(parent, peer)
          if ra != rb:
              parent[ra] = rb
      return parent


  def find(parent, x):
      while parent[x] != x:
          x = parent[x]
      return x


  def group_owner(parent, uid):
      return find(parent, uid)
  PY

