# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) /workspace/depot/queue.py dosyasındaki ReplenishQueue sınıfını, depo-envanteri partilerini öncelik kuyruğuna alacak biçimde gerçekleştir.

  2) Kuyruğa koyarken sıralamayı şöyle yap: önce yüksek öncelikli parti önce gelsin.

  3) Öncelikler eşitse, son-kullanma tarihi erken olan parti önce gelsin.

  4) Son-kullanma tarihleri de eşitse, SKU harf sırası küçük olan parti önce gelsin.

  5) peek, pop ve drain metotları, partileri bu sıralamaya göre doğru biçimde döndürsün.

setup: |
  mkdir -p depot
  cat > depot/records.py <<'RECORDS'
  from dataclasses import dataclass


  @dataclass(frozen=True)
  class Batch:
      sku: str
      units: int
      priority: int
      expires: int


  def load_batches(text):
      batches = []
      for line in text.strip().splitlines():
          sku, units, priority, expires = line.split(',')
          batches.append(Batch(sku, int(units), int(priority), int(expires)))
      return batches
  RECORDS
  cat > depot/queue.py <<'QUEUE'
  from depot.records import load_batches


  class ReplenishQueue:
      def __init__(self):
          raise NotImplementedError

      def push(self, batch):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def drain(self):
          raise NotImplementedError
  QUEUE
  cat > depot/planner.py <<'PLANNER'
  from depot.queue import ReplenishQueue
  from depot.records import load_batches


  def plan(text, limit):
      queue = ReplenishQueue()
      for batch in load_batches(text):
          queue.push(batch)
      return queue.drain()[:limit]
  PLANNER
  cat > stock.txt <<'STOCK'
  bolt,40,2,9
  nut,10,5,3
  washer,7,5,3
  screw,25,1,4
  rivet,60,3,1
  STOCK

goal_tr: >
  depot/queue.py icindeki ReplenishQueue sinifini, depo-envanteri
  partilerini once yuksek oncelik, esitlikte once erken son-kullanma tarihi,
  esitlikte once kucuk SKU harf sirasi olacak sekilde oncelik kuyruguna
  koyup peek/pop/drain ile dogru sirada veren bicimde gerceklestir.

reference_solution: |
  cat > depot/queue.py <<'QUEUE'
  import heapq

  from depot.records import load_batches


  class ReplenishQueue:
      def __init__(self):
          self._heap = []
          self._counter = 0

      def _key(self, batch):
          return (-batch.priority, batch.expires, batch.sku, self._counter)

      def push(self, batch):
          heapq.heappush(self._heap, (self._key(batch), batch))
          self._counter += 1

      def peek(self):
          if not self._heap:
              return None
          return self._heap[0][1]

      def pop(self):
          if not self._heap:
              return None
          return heapq.heappop(self._heap)[1]

      def drain(self):
          out = []
          while self._heap:
              out.append(self.pop())
          return out
  QUEUE

