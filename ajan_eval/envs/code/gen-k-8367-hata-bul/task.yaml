# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  `cargo/report.py` içindeki `latest_city` fonksiyonu, aynı koda ait kayıtlar arasında en büyük zaman damgasına sahip şehrin seçilmesini ve eşit zaman damgasında akışta sonra gelen kaydın kazanmasını garanti edecek biçimde düzeltilmeli. Fonksiyonun akıştaki kayıtları kod bazında gruplayıp her kod için tek bir şehri döndürmesi gerekiyor.

setup: |
  mkdir -p cargo
  cat > cargo/events.py <<'EVENTS'
  def split_events(stream):
      out = []
      for chunk in stream:
          for line in chunk.splitlines():
              line = line.strip()
              if line:
                  out.append(line)
      return out
  EVENTS
  cat > cargo/scan.py <<'SCAN'
  from cargo.events import split_events


  def scan(stream):
      seen = {}
      for line in split_events(stream):
          code, city, ts = line.split('|')
          seen.setdefault(code, []).append((int(ts), city))
      return seen
  SCAN
  cat > cargo/report.py <<'REPORT'
  from cargo.scan import scan


  def latest_city(stream):
      result = {}
      for code, items in scan(stream).items():
          items.sort(key=lambda item: -item[0])
          result[code] = items[0][1]
      return result
  REPORT
  cat > stream.txt <<'STREAM'
  TR1|ankara|100
  TR2|izmir|200
  TR1|bursa|150
  TR3|adana|300
  TR2|konya|250
  STREAM

goal_tr: >
  cargo/report.py icindeki latest_city fonksiyonunu, ayni koda ait kayitlar
  arasinda en buyuk zaman damgasina sahip sehrin secilmesini ve esit zaman
  damgasinda akista sonra gelen kaydin kazanmasini garanti edecek bicimde
  duzelt.

reference_solution: |
  cat > cargo/report.py <<'REPORT'
  from cargo.scan import scan


  def latest_city(stream):
      result = {}
      for code, items in scan(stream).items():
          best_ts = None
          best_city = None
          for ts, city in items:
              if best_ts is None or ts >= best_ts:
                  best_ts = ts
                  best_city = city
          result[code] = best_city
      return result
  REPORT

