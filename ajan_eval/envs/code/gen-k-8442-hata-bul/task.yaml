# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) diner/receipt.py dosyasını aç ve Receipt sınıfının average metodunu, boş bir sipariş için sıfıra bölme hatası vermeden 0.0 döndürecek şekilde düzelt.

setup: |
  mkdir -p diner
  cat > diner/__init__.py <<'PY'
  PY
  cat > diner/items.py <<'ITEMS'
  def parse_items(text):
      rows = []
      for line in text.strip().splitlines():
          if not line.strip():
              continue
          name, qty, price = line.split(',')
          rows.append((name, int(qty), float(price)))
      return rows


  def line_total(row):
      return row[1] * row[2]
  ITEMS
  cat > diner/totals.py <<'TOTALS'
  from diner.items import parse_items, line_total


  def total_for(text):
      rows = parse_items(text)
      return sum(line_total(r) for r in rows)


  def count_for(text):
      rows = parse_items(text)
      return len(rows)
  TOTALS
  cat > diner/receipt.py <<'RECEIPT'
  from diner.items import parse_items, line_total
  from diner.totals import total_for, count_for


  class Receipt:
      def __init__(self, text):
          self.text = text

      def __enter__(self):
          return self

      def __exit__(self, exc_type, exc, tb):
          return False

      def lines(self):
          return parse_items(self.text)

      def total(self):
          return total_for(self.text)

      def count(self):
          return count_for(self.text)

      def average(self):
          return self.total() / self.count()
  RECEIPT
  cat > order.txt <<'TXT'
  soup,2,6.5
  salad,1,4.0
  steak,3,12.0
  TXT

goal_tr: >
  diner/receipt.py icindeki Receipt sinifinin average metodunu, bos bir
  siparis icin sifira bolme hatasi vermeden 0.0 dondurecek bicimde duzelt.

reference_solution: |
  cat > diner/receipt.py <<'RECEIPT'
  from diner.items import parse_items, line_total
  from diner.totals import total_for, count_for


  class Receipt:
      def __init__(self, text):
          self.text = text

      def __enter__(self):
          return self

      def __exit__(self, exc_type, exc, tb):
          return False

      def lines(self):
          return parse_items(self.text)

      def total(self):
          return total_for(self.text)

      def count(self):
          return count_for(self.text)

      def average(self):
          n = self.count()
          if n == 0:
              return 0.0
          return self.total() / n
  RECEIPT

