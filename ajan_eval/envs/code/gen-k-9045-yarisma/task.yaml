id: gen-k-9045-yarisma
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  grid/stack.py içindeki ReadingStack okumaları eklenme sırasına göre (FIFO) versin; grid/meters.py içindeki total de iç içe RAW yapısındaki tüm okumaların toplamını doğru döndürsün.

setup: |
  mkdir -p grid
  cat > grid/stack.py <<'PY'
  class ReadingStack:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          return self._items.pop()

      def peek(self):
          return self._items[-1]

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          while self._items:
              yield self._items.pop(0)
  PY
  cat > grid/meters.py <<'PY'
  from grid.stack import ReadingStack


  def flatten(raw):
      out = []
      for region, sites in raw.items():
          for site, series in sites.items():
              stack = ReadingStack()
              for value in series:
                  stack.push(value)
              out.append((region, site, stack))
      return out


  def total(raw):
      acc = 0
      for region, site, stack in flatten(raw):
          for value in stack:
              acc = value
      return acc
  PY
  cat > grid/data.py <<'PY'
  RAW = {
      "north": {"a1": [3, 1, 4], "a2": [2, 7]},
      "south": {"b1": [5, 5, 5]},
  }
  PY

goal_tr: >
  grid/stack.py icindeki ReadingStack iteratorunun okumalari eklenme
  sirasinda (FIFO) vermesini, ve grid/meters.py icindeki total fonksiyonunun
  ic ice RAW yapisindaki tum sayac okumalarinin toplamini dogru dondurmesini
  sagla.

reference_solution: |
  cat > grid/stack.py <<'PY'
  class ReadingStack:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          return self._items.pop()

      def peek(self):
          return self._items[-1]

      def __len__(self):
          return len(self._items)

      def __iter__(self):
          while self._items:
              yield self._items.pop()
  PY
  cat > grid/meters.py <<'PY'
  from grid.stack import ReadingStack


  def flatten(raw):
      out = []
      for region, sites in raw.items():
          for site, series in sites.items():
              stack = ReadingStack()
              for value in series:
                  stack.push(value)
              out.append((region, site, stack))
      return out


  def total(raw):
      acc = 0
      for region, site, stack in flatten(raw):
          for value in stack:
              acc += value
      return acc
  PY

