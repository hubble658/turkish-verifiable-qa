id: gen-k-5005-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  rezervasyon/trie/agac.py dosyasındaki Trie sınıfının __iter__ metodunu düzelt; bu metot, ağaçtaki tüm (uçuş_kodu, kayıt) çiftlerini uçuş koduna göre artan sırada üretsin. Böylece rezervasyon/akis/rezervasyon.py dosyasındaki RezervasyonDefteri.tum_ucuslar metodu doğru uçuş kodlarını döndürsün.

  Şu şartlar sağlanmalı:
  - rezervasyon/trie/agac.py içindeki Trie.__iter__ artık boş bir üretici döndürmemeli; ağaçta eklenmiş tüm çiftleri üretmeli.
  - Üretilen her öğe bir (uçuş_kodu, kayıt) çifti olmalı.
  - Çiftler uçuş koduna göre artan sırada üretilmeli.
  - Aynı uçuş koduna sahip birden fazla kayıt varsa hepsi üretilmeli.
  - rezervasyon/akis/rezervasyon.py içindeki RezervasyonDefteri.tum_ucuslar, bu düzeltme sayesinde doğru uçuş kodlarını döndürmeli.
  - Mevcut ekle, ara ve onek_tara davranışları bozulmamalı.

setup: |
  mkdir -p rezervasyon/trie rezervasyon/akis
  cat > rezervasyon/trie/dugum.py <<'DUGUM'
  class Dugum:
      def __init__(self):
          self.cocuklar = {}
          self.kayitlar = []
  DUGUM
  cat > rezervasyon/trie/agac.py <<'AGAC'
  from rezervasyon.trie.dugum import Dugum


  class Trie:
      def __init__(self):
          self.kok = Dugum()
          self._boyut = 0

      def ekle(self, anahtar, kayit):
          dugum = self.kok
          for harf in anahtar:
              if harf not in dugum.cocuklar:
                  dugum.cocuklar[harf] = Dugum()
              dugum = dugum.cocuklar[harf]
          dugum.kayitlar.append(kayit)
          self._boyut += 1

      def ara(self, anahtar):
          dugum = self.kok
          for harf in anahtar:
              if harf not in dugum.cocuklar:
                  return []
              dugum = dugum.cocuklar[harf]
          return list(dugum.kayitlar)

      def onek_tara(self, onek):
          dugum = self.kok
          for harf in onek:
              if harf not in dugum.cocuklar:
                  return []
              dugum = dugum.cocuklar[harf]
          sonuc = []
          yigin = [dugum]
          while yigin:
              gecerli = yigin.pop()
              sonuc.extend(gecerli.kayitlar)
              for harf in gecerli.cocuklar:
                  yigin.append(gecerli.cocuklar[harf])
          return sonuc

      def __iter__(self):
          return iter([])

      def __len__(self):
          return self._boyut
  AGAC
  cat > rezervasyon/akis/rezervasyon.py <<'REZ'
  from rezervasyon.trie.agac import Trie


  class RezervasyonDefteri:
      """Ucus kodlarini anahtar, rezervasyon kayitlarini deger olarak tutar."""

      def __init__(self):
          self.agac = Trie()

      def ekle(self, ucus_kodu, yolcu, koltuk):
          self.agac.ekle(ucus_kodu, (yolcu, koltuk))

      def ucus_yolculari(self, ucus_kodu):
          return [yolcu for yolcu, _ in self.agac.ara(ucus_kodu)]

      def filo_tara(self, onek):
          return [yolcu for yolcu, _ in self.agac.onek_tara(onek)]

      def tum_ucuslar(self):
          return [ucus for ucus, _ in self.agac]
  REZ
  cat > veri.txt <<'VERI'
  TK1980 Ada 12A
  TK1980 Bora 12B
  TK1981 Cem 3C
  TK2450 Deniz 7A
  TK2450 Ece 7B
  AJ3001 Fatih 1A
  AJ3001 Gizem 1B
  AJ3002 Hakan 9C
  VERI

goal_tr: >
  rezervasyon/trie/agac.py icindeki Trie sinifinin __iter__ metodunu, tum
  (ucus_kodu, kayit) ciftlerini ucus koduna gore artan sirada uretecek
  bicimde duzelt; boylece rezervasyon/akis/rezervasyon.py icindeki
  RezervasyonDefteri.tum_ucuslar dogru ucus kodlarini dondursun.

reference_solution: |
  cat > rezervasyon/trie/agac.py <<'AGAC'
  from rezervasyon.trie.dugum import Dugum


  class Trie:
      def __init__(self):
          self.kok = Dugum()
          self._boyut = 0

      def ekle(self, anahtar, kayit):
          dugum = self.kok
          for harf in anahtar:
              if harf not in dugum.cocuklar:
                  dugum.cocuklar[harf] = Dugum()
              dugum = dugum.cocuklar[harf]
          dugum.kayitlar.append(kayit)
          self._boyut += 1

      def ara(self, anahtar):
          dugum = self.kok
          for harf in anahtar:
              if harf not in dugum.cocuklar:
                  return []
              dugum = dugum.cocuklar[harf]
          return list(dugum.kayitlar)

      def onek_tara(self, onek):
          dugum = self.kok
          for harf in onek:
              if harf not in dugum.cocuklar:
                  return []
              dugum = dugum.cocuklar[harf]
          sonuc = []
          yigin = [dugum]
          while yigin:
              gecerli = yigin.pop()
              sonuc.extend(gecerli.kayitlar)
              for harf in sorted(gecerli.cocuklar, reverse=True):
                  yigin.append(gecerli.cocuklar[harf])
          return sonuc

      def __iter__(self):
          yigin = [(self.kok, "")]
          while yigin:
              dugum, onek = yigin.pop()
              for kayit in dugum.kayitlar:
                  yield (onek, kayit)
              for harf in sorted(dugum.cocuklar, reverse=True):
                  yigin.append((dugum.cocuklar[harf], onek + harf))

      def __len__(self):
          return self._boyut
  AGAC
  cat > rezervasyon/akis/rezervasyon.py <<'REZ'
  from rezervasyon.trie.agac import Trie


  class RezervasyonDefteri:
      """Ucus kodlarini anahtar, rezervasyon kayitlarini deger olarak tutar."""

      def __init__(self):
          self.agac = Trie()

      def ekle(self, ucus_kodu, yolcu, koltuk):
          self.agac.ekle(ucus_kodu, (yolcu, koltuk))

      def ucus_yolculari(self, ucus_kodu):
          return [yolcu for yolcu, _ in self.agac.ara(ucus_kodu)]

      def filo_tara(self, onek):
          return [yolcu for yolcu, _ in self.agac.onek_tara(onek)]

      def tum_ucuslar(self):
          return [ucus for ucus, _ in self.agac]
  REZ

