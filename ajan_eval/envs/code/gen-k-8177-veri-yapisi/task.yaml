  fleet/chain.py içindeki FleetChain sınıfını tamamla: verilen arac kayıtlarını iterator protokolüyle (__iter__/__next__) sırayla üretsin, __len__ kayıt sayısını, __contains__ plaka üyeliğini, total_km ise toplam kilometreyi doğru versin; iterator tükendikten sonra yeniden başlatılabilsin.

setup: |
  mkdir -p fleet
  cat > fleet/loader.py <<'LOADER'
  def read_lines(stream):
      return [ln.strip() for ln in stream if ln.strip() and not ln.startswith("#")]
  LOADER
  cat > fleet/parser.py <<'PARSER'
  from fleet.loader import read_lines


  def parse_vehicles(stream):
      out = []
      for ln in read_lines(stream):
          vid, plate, km = ln.split(";")
          out.append((vid, plate, int(km)))
      return out
  PARSER
  cat > fleet/chain.py <<'CHAIN'
  from fleet.parser import parse_vehicles


  class FleetChain:
      def __init__(self, stream):
          self._rows = parse_vehicles(stream)

      def __iter__(self):
          raise NotImplementedError

      def __next__(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError

      def __contains__(self, plate):
          raise NotImplementedError

      def total_km(self):
          raise NotImplementedError
  CHAIN
  cat > fleet/__init__.py <<'INIT'
  INIT
  cat > input.txt <<'DATA'
  # fleet dump
  v1;34-ABC-1;12000
  v2;06-XYZ-9;8000
  v3;35-LMN-2;45000
  DATA

goal_tr: >
  fleet/chain.py icindeki FleetChain sinifini, verilen arac kayitlarini
  iterator protokoluyle (__iter__/__next__) sirayla uretecek, __len__ ile
  kayit sayisini, __contains__ ile plaka uyeligini ve total_km ile toplam
  kilometreyi dogru hesaplayacak bicimde tamamla; iterator tukendikten sonra
  yeniden baslatilabilmeli.

reference_solution: |
  cat > fleet/chain.py <<'CHAIN'
  from fleet.parser import parse_vehicles


  class FleetChain:
      def __init__(self, stream):
          self._rows = parse_vehicles(stream)
          self._pos = 0

      def __iter__(self):
          self._pos = 0
          return self

      def __next__(self):
          if self._pos >= len(self._rows):
              raise StopIteration
          row = self._rows[self._pos]
          self._pos += 1
          return row

      def __len__(self):
          return len(self._rows)

      def __contains__(self, plate):
          return any(r[1] == plate for r in self._rows)

      def total_km(self):
          return sum(r[2] for r in self._rows)
  CHAIN

