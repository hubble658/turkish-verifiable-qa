# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  stock/queue.py içindeki PriorityQueue sınıfını ikili yığın (heap) olarak gerçekleştir; push, pop, peek ve __len__ çalışsın, en küçük öncelik değeri önce çıksın.

setup: |
  mkdir -p stock
  cat > stock/queue.py <<'QUEUE'
  class PriorityQueue:
      def __init__(self):
          raise NotImplementedError

      def push(self, priority, item):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError
  QUEUE
  cat > stock/moves.py <<'MOVES'
  from stock.queue import PriorityQueue


  def make_ledger():
      pq = PriorityQueue()

      def record(ticker, delta, urgency):
          pq.push(-urgency, (ticker, delta))
          return len(pq)

      def drain():
          out = []
          while len(pq):
              out.append(pq.pop())
          return out

      def next_move():
          if len(pq) == 0:
              return None
          return pq.peek()

      return record, drain, next_move
  MOVES
  cat > stock/main.py <<'MAIN'
  from stock.moves import make_ledger


  def run(events):
      record, drain, next_move = make_ledger()
      for ticker, delta, urgency in events:
          record(ticker, delta, urgency)
      peeked = next_move()
      drained = drain()
      return drained, peeked
  MAIN

goal_tr: >
  stock/queue.py icindeki PriorityQueue sinifini ikili yigin (heap) olarak
  gerceklestir; push, pop, peek ve __len__ calissin, en kucuk oncelik degeri
  once ciksin.

reference_solution: |
  cat > stock/queue.py <<'QUEUE'
  import heapq


  class PriorityQueue:
      def __init__(self):
          self._heap = []

      def push(self, priority, item):
          heapq.heappush(self._heap, (priority, item))

      def pop(self):
          return heapq.heappop(self._heap)[1]

      def peek(self):
          return self._heap[0][1]

      def __len__(self):
          return len(self._heap)
  QUEUE

