  def reachable(path, start):
      graph = build_graph(path)
      seen = set()
      stack = [start]
      while stack:
          node = stack.pop()
          if node in seen:
              continue
          seen.add(node)
          for nxt, _cost in graph.get(node, []):
              if nxt not in seen:
                  stack.append(nxt)
      return sorted(seen)
  PATHS

