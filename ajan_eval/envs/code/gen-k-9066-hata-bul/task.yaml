  cat > restoran/siparis/hesap.py <<'PY'
  from restoran.siparis.toplayici import Toplayici


  class Hesap:
      def __init__(self):
          self.toplayici = Toplayici()

      def kalem_ekle(self, ad, adet, fiyat):
          from restoran.siparis.kalem import Kalem
          return self.toplayici.ekle(Kalem(ad, adet, fiyat))

      def yeni_masa(self):
          return self.toplayici.sifirla()

      def toplam(self):
          return self.toplayici.toplam
  PY

