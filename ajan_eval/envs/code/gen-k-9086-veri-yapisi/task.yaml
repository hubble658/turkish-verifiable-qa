# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) sensors/reading.py dosyasını, make_reading düğüm fabrikasını tam olarak gerçekleştirecek biçimde yaz; bu fabrika verilen sensor_id ile celsius değerinden bir okuma düğümü sözlüğü oluştursun ve celsius değerini 1 ondalık basamağa yuvarlanmış olarak saklasın.

  2) sensors/chain.py dosyasını yaz; build_chain fonksiyonu (sensor_id, celsius) çiftlerinden tek yönlü bağlı bir okuma zinciri kurup baş düğümü döndürsün, boş dizi için None döndürsün; walk fonksiyonu ise baş düğümden kuyruğa kadar her düğüm için (sensor_id, celsius) üretsin.

  3) sensors/report.py dosyasını, make_reporter closure fabrikasını tam olarak gerçekleştirecek biçimde yaz; make_reporter(scale) ile üretilen rapor fonksiyonu pairs alıp count, peak ve series alanlarını doğru döndürsün; count okuma sayısı, peak boşken None aksi halde en büyük ölçeklenmiş değer, series ise zincir sırasındaki ölçeklenmiş değerlerin listesi olsun.

setup: |
  mkdir -p sensors
  cat > sensors/reading.py <<'READING'
  def make_reading(sensor_id, celsius):
      """Create a reading node dict. celsius is stored rounded to 1 decimal."""
      return {"sensor": sensor_id, "celsius": round(celsius, 1), "next": None}
  READING
  cat > sensors/chain.py <<'CHAIN'
  from sensors.reading import make_reading


  def build_chain(pairs):
      """Build a singly linked list of readings from (sensor_id, celsius) pairs.

      Returns the head node, or None for an empty sequence.
      """
      head = None
      for sensor_id, celsius in pairs:
          node = make_reading(sensor_id, celsius)
          node["next"] = head
          head = node
      return head


  def walk(head):
      """Yield (sensor_id, celsius) for each node from head to tail."""
      cursor = head
      while cursor:
          yield cursor["sensor"], cursor["celsius"]
          cursor = cursor["next"]
  CHAIN
  cat > sensors/report.py <<'REPORT'
  from sensors.chain import build_chain, walk


  def make_reporter(scale):
      """Return a closure that summarizes a chain of readings.

      The closure takes (pairs) and returns a dict with:
        'count'  -> number of readings
        'peak'   -> max scaled value, or None when empty
        'series' -> list of scaled values in chain order
      """
      def report(pairs):
          head = build_chain(pairs)
          values = [c * scale for _, c in walk(head)]
          peak = max(values)
          return {"count": len(values), "peak": peak, "series": values}
      return report
  REPORT

goal_tr: >
  sensors/reading.py, sensors/chain.py ve sensors/report.py dosyalarini;
  make_reading dugum fabrikasini, build_chain ile walk fonksiyonlarini ve
  make_reporter closure fabrikasini tam olarak gerceklestirecek bicimde yaz;
  boylece make_reporter(scale) ile uretilen rapor fonksiyonu
  count/peak/series alanlarini dogru dondursun.

reference_solution: |
  mkdir -p sensors
  cat > sensors/reading.py <<'READING'
  def make_reading(sensor_id, celsius):
      """Create a reading node dict. celsius is stored rounded to 1 decimal."""
      return {"sensor": sensor_id, "celsius": round(celsius, 1), "next": None}
  READING
  cat > sensors/chain.py <<'CHAIN'
  from sensors.reading import make_reading


  def build_chain(pairs):
      """Build a singly linked list of readings from (sensor_id, celsius) pairs.

      Returns the head node, or None for an empty sequence.
      """
      head = None
      tail = None
      for sensor_id, celsius in pairs:
          node = make_reading(sensor_id, celsius)
          if head is None:
              head = node
              tail = node
          else:
              tail["next"] = node
              tail = node
      return head


  def walk(head):
      """Yield (sensor_id, celsius) for each node from head to tail."""
      cursor = head
      while cursor is not None:
          yield cursor["sensor"], cursor["celsius"]
          cursor = cursor["next"]
  CHAIN
  cat > sensors/report.py <<'REPORT'
  from sensors.chain import build_chain, walk


  def make_reporter(scale):
      """Return a closure that summarizes a chain of readings.

      The closure takes (pairs) and returns a dict with:
        'count'  -> number of readings
        'peak'   -> max scaled value, or None when empty
        'series' -> list of scaled values in chain order
      """
      def report(pairs):
          head = build_chain(pairs)
          values = [c * scale for _, c in walk(head)]
          if not values:
              return {"count": 0, "peak": None, "series": []}
          return {"count": len(values), "peak": max(values), "series": values}
      return report
  REPORT

