          if self._i >= len(self._rows):
              raise StopIteration
          row = self._rows[self._i]
          self._i += 1
          return row

      def read_all(self):
          self._i = 0
          return [r for r in self]
  STREAM
  cat > sensor/report.py <<'REPORT'
  from sensor.stream import SensorStream, SensorError


  def peak_readings(rows, k):
      if k <= 0:
          raise SensorError("k must be positive")
      stream = SensorStream(rows)
      data = stream.read_all()
      data.sort(key=lambda r: r[1], reverse=True)
      return [r[0] for r in data[:k]]


  def hottest(rows):
      stream = SensorStream(rows)
      data = stream.read_all()
      best = None
      for name, temp in data:
          if best is None or temp > best[1]:
              best = (name, temp)
      return best[0]
  REPORT

