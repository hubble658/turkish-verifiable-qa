split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  roster/plan.py dosyasındaki ShiftPlan sınıfını context manager olarak koru; yani sınıfın mevcut context manager davranışını bozma. Bu sınıftaki is_covered metodunu, bir gün için toplam saat gereken eşiğe eşit olduğunda da o günü kapsandı sayacak şekilde düzelt. Başlangıçtaki roster/loader.py, roster/coverage.py, roster/plan.py ve schedule.txt dosyaları yerinde kalsın; yalnızca roster/plan.py içeriği bu düzeltmeyi yansıtacak biçimde güncellensin.

setup: |
  mkdir -p roster
  cat > roster/loader.py <<'LOADER'
  def load_shifts(rows):
      result = {}
      for row in rows:
          day = row["day"]
          if day not in result:
              result[day] = []
          result[day].append({"who": row["who"], "hours": row["hours"]})
      return result
  LOADER
  cat > roster/coverage.py <<'COVERAGE'
  from roster.loader import load_shifts


  def total_hours(rows, day):
      table = load_shifts(rows)
      return sum(s["hours"] for s in table.get(day, []))
  COVERAGE
  cat > roster/plan.py <<'PLAN'
  from roster.coverage import total_hours


  class ShiftPlan:
      def __init__(self, rows):
          self.rows = rows

      def __enter__(self):
          self._entered = True
          return self

      def __exit__(self, exc_type, exc, tb):
          self._entered = False
          return False

      def is_covered(self, day, need):
          total = total_hours(self.rows, day)
          if total > need:
              return True
          return False
  PLAN
  cat > schedule.txt <<'TXT'
  day=mon who=ada hours=6
  day=mon who=bo hours=3
  day=tue who=cy hours=4
  TXT

goal_tr: >
  roster/plan.py icindeki ShiftPlan sinifini context-manager olarak koruyup
  is_covered metodunu, gun bazinda toplam saat gereken esige esit oldugunda
  da kapsandi sayacak sekilde duzelt.

reference_solution: |
  cat > roster/plan.py <<'PLAN'
  from roster.coverage import total_hours


  class ShiftPlan:
      def __init__(self, rows):
          self.rows = rows

      def __enter__(self):
          self._entered = True
          return self

      def __exit__(self, exc_type, exc, tb):
          self._entered = False
          return False

      def is_covered(self, day, need):
          total = total_hours(self.rows, day)
          if total >= need:
              return True
          return False
  PLAN

