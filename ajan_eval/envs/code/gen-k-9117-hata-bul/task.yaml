id: gen-k-9117-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 20

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  docs/wordcount.py ve docs/report.py içindeki erken-dönüş hatalarını düzelt; top_word tüm belgelerde en sık geçen kelimeyi doğru döndürsün. docs/store.py'ye dokunma.

setup: |
  mkdir -p docs
  cat > docs/store.py <<'STORE'
  class DocumentStore:
      def __init__(self):
          self._docs = {}

      def add(self, doc_id, text):
          self._docs[doc_id] = text

      def get(self, doc_id):
          return self._docs.get(doc_id, "")

      def ids(self):
          return sorted(self._docs)
  STORE
  cat > docs/wordcount.py <<'COUNT'
  from docs.store import DocumentStore


  def word_frequencies(store):
      result = {}
      for doc_id in store.ids():
          text = store.get(doc_id)
          for word in text.lower().split():
              result[word] = result.get(word, 0) + 1
              return result
      return result
  COUNT
  cat > docs/report.py <<'REPORT'
  from docs.wordcount import word_frequencies


  def top_word(store):
      freq = word_frequencies(store)
      best = ""
      best_n = 0
      for word, n in freq.items():
          if n > best_n:
              best = word
              best_n = n
      return best
  REPORT

goal_tr: >
  docs/wordcount.py ve docs/report.py icindeki erken-donus hatalarini
  gidererek top_word fonksiyonunun tum belgeler uzerinde en sik gecen
  kelimeyi dogru dondurmesini sagla

reference_solution: |
  cat > docs/wordcount.py <<'COUNT'
  from docs.store import DocumentStore


  def word_frequencies(store):
      result = {}
      for doc_id in store.ids():
          text = store.get(doc_id)
          for word in text.lower().split():
              result[word] = result.get(word, 0) + 1
      return result
  COUNT
  cat > docs/report.py <<'REPORT'
  from docs.wordcount import word_frequencies


  def top_word(store):
      freq = word_frequencies(store)
      best = ""
      best_n = 0
      for word, n in sorted(freq.items()):
          if n > best_n:
              best = word
              best_n = n
      return best
  REPORT

