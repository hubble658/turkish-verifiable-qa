# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  inventory/walk.py içindeki StockWalker iteratorunu, adet değeri 0 olan ürünler de dahil olmak üzere her ürünü kendi adediyle döndürecek şekilde düzelt; böylece hiçbir ürün atlanmaz.

setup: |
  mkdir -p inventory
  cat > inventory/items.py <<'ITEMS'
  def load_items(data):
      """data: {"bolum": {"urun": adet}} -> duz sozluk {bolum/urun: adet}"""
      flat = {}
      for section, products in data.items():
          for name, qty in products.items():
              flat[section + "/" + name] = qty
      return flat


  def total_units(data):
      return sum(load_items(data).values())
  ITEMS
  cat > inventory/walk.py <<'WALK'
  from inventory.items import load_items


  class StockWalker:
      """Envanteri dolasan bir iterator."""

      def __init__(self, data):
          self._flat = load_items(data)
          self._paths = list(self._flat)
          self._i = 0

      def __iter__(self):
          return self

      def __next__(self):
          while self._i < len(self._paths):
              path = self._paths[self._i]
              qty = self._flat[path]
              self._i += 1
              if qty > 0:
                  return (path, qty)
          raise StopIteration


  def iter_stock(data):
      return StockWalker(data)
  WALK

goal_tr: >
  inventory/walk.py icindeki StockWalker iteratorunu, adet degeri 0 olan
  urunleri de (0 degeriyle) dondurecek bicimde duzelt; boylece hicbir urun
  atlanmaz.

