      def __next__(self):
          while self._i < len(self._paths):
              path = self._paths[self._i]
              qty = self._flat[path]
              self._i += 1
              return (path, qty)
          raise StopIteration


  def iter_stock(data):
      return StockWalker(data)
  WALK

