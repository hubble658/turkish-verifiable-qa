id: gen-k-8174-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) telemetry/window.py dosyasındaki peak_windows fonksiyonunu, her span'lik pencerenin gerçek en büyük değerini döndürecek şekilde düzelt.

  2) Düzeltme sonrası fonksiyonun, telemetry/reader.py içindeki SensorLog sınıfını kullanarak samples.csv dosyasını okumasını ve okunan değerler üzerinden pencereleri hesaplamasını sağla.

  3) telemetry/window.py dosyasını, her pencerede o pencerenin tüm elemanlarını kapsayacak ve pencerenin en büyük değerini döndürecek biçimde güncelle; dönen listede her pencerenin en büyük değeri yer alsın.

setup: |
  mkdir -p telemetry
  cat > telemetry/reader.py <<'READER'
  class SensorLog:
      def __init__(self, path, chunk):
          self.path = path
          self.chunk = chunk
          self._fh = None

      def __enter__(self):
          self._fh = open(self.path, "r", encoding="ascii")
          return self

      def __exit__(self, exc_type, exc, tb):
          if self._fh is not None:
              self._fh.close()
          self._fh = None
          return False

      def __iter__(self):
          return self

      def __next__(self):
          buf = []
          for _ in range(self.chunk):
              line = self._fh.readline()
              if not line:
                  break
              buf.append(line.rstrip("\n"))
          if not buf:
              raise StopIteration
          return buf
  READER
  cat > telemetry/window.py <<'WINDOW'
  from telemetry.reader import SensorLog


  def peak_windows(path, chunk, span):
      with SensorLog(path, chunk) as log:
          readings = []
          for block in log:
              for line in block:
                  parts = line.split(",")
                  readings.append(float(parts[1]))
      peaks = []
      for i in range(0, len(readings) - span + 1, span):
          peaks.append(max(readings[i:i + span - 1]))
      return peaks
  WINDOW
  cat > samples.csv <<'CSV'
  t0,3.5
  t1,9.1
  t2,4.2
  t3,7.7
  t4,1.1
  t5,6.8
  t6,2.4
  CSV

goal_tr: >
  telemetry/window.py icindeki peak_windows fonksiyonunu, her span'lik
  pencerenin gercek en buyuk degerini dondurecek sekilde duzelt.

reference_solution: |
  cat > telemetry/window.py <<'WINDOW'
  from telemetry.reader import SensorLog


  def peak_windows(path, chunk, span):
      with SensorLog(path, chunk) as log:
          readings = []
          for block in log:
              for line in block:
                  parts = line.split(",")
                  readings.append(float(parts[1]))
      peaks = []
      for i in range(0, len(readings) - span + 1, span):
          peaks.append(max(readings[i:i + span]))
      return peaks
  WINDOW

outputs:
  - {path: telemetry/window.py, kind: program, run: 'python3 -c ''from telemetry.window import peak_windows as f; assert f("samples.csv",2,3)==[9.1,7.7], f("samples.csv",2,3); assert f("samples.csv",7,7)==[9.1], f("samples.csv",7,7); assert f("samples.csv",1,1)==[3.5,9.1,4.2,7.7,1.1,6.8,2.4]; print("TAMAM")'''}

checks:
  - {op: run_stdout_eq, cmd: 'python3 -c ''from telemetry.window import peak_windows as f; assert f("samples.csv",2,3)==[9.1,7.7], f("samples.csv",2,3); assert f("samples.csv",7,7)==[9.1], f("samples.csv",7,7); assert f("samples.csv",1,1)==[3.5,9.1,4.2,7.7,1.1,6.8,2.4]; print("TAMAM")''', value: TAMAM}

