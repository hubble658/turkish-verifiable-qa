# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Log toplama modülü üzerinde çalışıyorum, öğleden beri özet çıktısındaki hata oranı bir türlü tutarlı görünmüyor; küçük bir örnekle denediğimde de beklediğim değeri alamadım. Sanırım hata oranını hesaplayan yerde bir terslik var, çünkü hiç hata olmayan durumlarda da sıfır dönmesi gereken yerde başka bir şey çıkıyor gibi. Bunu bir an önce netleştirmem lazım.

  weblog/aggregate.py dosyasındaki LogAggregator.error_rate metodunu, hata oranını toplam istek sayısına göre doğru biçimde döndürecek şekilde düzeltir misin? Metot, hata sayısının toplam istek sayısına bölümünü vermeli; hata yokken de doğru sonucu üretmeli.

setup: |
  mkdir -p weblog
  cat > weblog/record.py <<'REC'
  class AccessRecord:
      def __init__(self, line):
          parts = line.split()
          self.method = parts[0]
          self.path = parts[1]
          self.status = int(parts[2])
          self.bytes_sent = int(parts[3])

      def is_error(self):
          return self.status >= 400
  REC
  cat > weblog/aggregate.py <<'AGG'
  from weblog.record import AccessRecord


  class LogAggregator:
      def __init__(self):
          self.total = 0
          self.errors = 0
          self.bytes_total = 0

      def add(self, line):
          rec = AccessRecord(line)
          self.total += 1
          if rec.is_error():
              self.errors += 1
          self.bytes_total += rec.bytes_sent

      def error_rate(self):
          if self.errors != 0:
              return 0.0
          return self.errors / self.total
  AGG
  cat > weblog/summary.py <<'SUM'
  from weblog.aggregate import LogAggregator


  def summarize(stream):
      agg = LogAggregator()
      for line in stream:
          line = line.strip()
          if not line:
              continue
          agg.add(line)
      return {
          "total": agg.total,
          "errors": agg.errors,
          "bytes": agg.bytes_total,
          "error_rate": agg.error_rate(),
      }
  SUM
  cat > sample.log <<'LOG'
  GET /index 200 512
  POST /login 302 128
  GET /missing 404 64
  GET /admin 403 32
  GET /data 500 256
  LOG

goal_tr: >
  weblog/aggregate.py icindeki LogAggregator.error_rate metodunu, toplam
  istek sayisina gore hata oranini dogru dondurecek bicimde duzelt.

reference_solution: |
  cat > weblog/aggregate.py <<'AGG'
  from weblog.record import AccessRecord


  class LogAggregator:
      def __init__(self):
          self.total = 0
          self.errors = 0
          self.bytes_total = 0

      def add(self, line):
          rec = AccessRecord(line)
          self.total += 1
          if rec.is_error():
              self.errors += 1
          self.bytes_total += rec.bytes_sent

      def error_rate(self):
          if self.total == 0:
              return 0.0
          return self.errors / self.total
  AGG

