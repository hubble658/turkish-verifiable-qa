# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  callcenter/prefix.py içindeki prefix_totals fonksiyonunu, her çağrı merkezi temsilcisi için yalnızca o temsilciye ait sürelerin kümülatif (önek) toplamını temsilci başına ayrı ayrı hesaplayacak biçimde düzelt. callcenter/report.py içindeki agent_durations fonksiyonunu, prefix_totals sonucunu temsilci adına göre artan sırada (agent, toplam) ikililerinden oluşan liste döndürecek şekilde düzelt. Ayrıca callcenter/report.py içinde decorator_count adlı bir dekoratör tanımlayıp agent_durations fonksiyonunu onunla sar; öyle ki agent_durations çağrıldığında sonucu döndürmeden önce sonucun eleman sayısını fonksiyonun last_count özelliğine yazsın. callcenter/records.py ve callcenter/prefix.py dosyalarındaki mevcut yapıyı koru.

setup: |
  mkdir -p callcenter
  cat > callcenter/records.py <<'PY'
  RECORDS = [
      ("agent_a", 10, 4),
      ("agent_a", 25, 6),
      ("agent_b", 5, 2),
      ("agent_b", 40, 8),
      ("agent_c", 30, 3),
      ("agent_a", 15, 5),
  ]
  PY
  cat > callcenter/prefix.py <<'PY'
  def prefix_totals(records):
      totals = {}
      running = 0
      for agent, duration, score in records:
          running += duration
          totals[agent] = running
      return totals
  PY
  cat > callcenter/report.py <<'PY'
  from callcenter.records import RECORDS
  from callcenter.prefix import prefix_totals


  def agent_durations():
      return prefix_totals(RECORDS)
  PY

goal_tr: >
  callcenter/prefix.py icindeki prefix_totals fonksiyonunu, her cagri
  merkezi temsilcisi icin yalnizca o temsilciye ait surelerin kumulatif
  (onek) toplamini temsilci basina ayri ayri hesaplayacak bicimde duzelt;
  callcenter/report.py icindeki agent_durations fonksiyonunu, prefix_totals
  sonucunu temsilci adina gore artan sirada (agent, toplam) ikililerinden
  olusan liste dondurecek sekilde duzelt; ve callcenter/report.py icindeki
  decorator_count adli bir dekorator tanimlayip agent_durations fonksiyonunu
  onunla sar ki cagrildiginda sonucu donmeden once sonucun eleman sayisini
  fonksiyonun `last_count` ozelligine yazsin.

reference_solution: |
  cat > callcenter/prefix.py <<'PY'
  def prefix_totals(records):
      totals = {}
      running = {}
      for agent, duration, score in records:
          running[agent] = running.get(agent, 0) + duration
          totals[agent] = running[agent]
      return totals
  PY
  cat > callcenter/report.py <<'PY'
  from callcenter.records import RECORDS
  from callcenter.prefix import prefix_totals


  def decorator_count(func):
      def wrapper(*args, **kwargs):
          result = func(*args, **kwargs)
          wrapper.last_count = len(result)
          return result
      wrapper.last_count = 0
      return wrapper


  @decorator_count
  def agent_durations():
      totals = prefix_totals(RECORDS)
      return sorted(totals.items())
  PY

ara_adim: |
  cat > callcenter/prefix.py <<'PY'
