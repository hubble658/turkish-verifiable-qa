id: gen-k-6041-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) depo/oku.py, depo/isle.py ve depo/rapor.py dosyalarındaki tip karışmalarını gider; zincirde miktar ve yön değerlerinin tutarlı tiplerde taşınmasını sağla.

  2) depo/rapor.py içindeki stok_dengesi fonksiyonunun, her ürünün net stok miktarını doğru hesaplayıp ürün adlarını net miktarlara eşleyen bir sözlük döndürmesini sağla; her hareket bu toplama yansısın, ürün başına tek bir değer atamasıyla son hareketin diğerlerini ezmesi engellensin.

  3) Değişiklikleri hareketler.txt içeriğine karşı çalıştırarak vida, somun ve pul için net stok miktarlarının doğru çıktığını doğrula.

setup: |
  mkdir -p depo
  cat > depo/oku.py <<'OKU'
  def satirlari_uret(yol):
      """Dosyadaki her satiri (islem_id, urun, miktar, yon) demeti olarak uretir."""
      with open(yol, encoding="utf-8") as f:
          for line in f:
              line = line.strip()
              if not line:
                  continue
              parcalar = line.split(";")
              yield parcalar[0], parcalar[1], parcalar[2], parcalar[3]
  OKU
  cat > depo/isle.py <<'ISLE'
  from depo.oku import satirlari_uret


  def hareketleri_uret(yol):
      """Her satiri miktar int, yon +1/-1 olacak sekilde uretir."""
      for islem_id, urun, miktar, yon in satirlari_uret(yol):
          yon_degeri = 1 if yon == "GIRIS" else -1
          yield islem_id, urun, miktar, yon_degeri
  ISLE
  cat > depo/rapor.py <<'RAPOR'
  from depo.isle import hareketleri_uret


  def stok_dengesi(yol):
      """Urun -> net stok miktari sozlugu dondurur."""
      denge = {}
      for islem_id, urun, miktar, yon_degeri in hareketleri_uret(yol):
          denge[urun] = yon_degeri
      return denge
  RAPOR
  cat > hareketler.txt <<'VERI'
  H1;vida;10;GIRIS
  H2;somun;5;GIRIS
  H3;vida;4;CIKIS
  H4;somun;7;CIKIS
  H5;pul;3;GIRIS
  VERI

goal_tr: >
  depo/oku.py, depo/isle.py ve depo/rapor.py zincirindeki tip karismalarini
  gidererek stok_dengesi fonksiyonunun her urunun net stok miktarini dogru
  hesaplamasini sagla.

reference_solution: |
  cat > depo/oku.py <<'OKU'
  def satirlari_uret(yol):
      """Dosyadaki her satiri (islem_id, urun, miktar, yon) demeti olarak uretir."""
      with open(yol, encoding="utf-8") as f:
          for line in f:
              line = line.strip()
              if not line:
                  continue
              parcalar = line.split(";")
              yield parcalar[0], parcalar[1], int(parcalar[2]), parcalar[3]
  OKU
  cat > depo/isle.py <<'ISLE'
  from depo.oku import satirlari_uret


  def hareketleri_uret(yol):
      """Her satiri miktar int, yon +1/-1 olacak sekilde uretir."""
      for islem_id, urun, miktar, yon in satirlari_uret(yol):
          yon_degeri = 1 if yon == "GIRIS" else -1
          yield islem_id, urun, miktar, yon_degeri
  ISLE
  cat > depo/rapor.py <<'RAPOR'
  from depo.isle import hareketleri_uret


  def stok_dengesi(yol):
      """Urun -> net stok miktari sozlugu dondurur."""
      denge = {}
      for islem_id, urun, miktar, yon_degeri in hareketleri_uret(yol):
          denge[urun] = denge.get(urun, 0) + miktar * yon_degeri
      return denge
  RAPOR

