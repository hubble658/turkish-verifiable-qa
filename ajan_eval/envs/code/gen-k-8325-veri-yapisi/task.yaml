goal_tr: >
  grid/readings.py icinde, meter dosyasindaki okumalari sirayla isleyip her
  sayacin toplam tuketimini hesaplayan ve en yuksek toplami tasiyan sayac
  adini donduren MeterQueue baglam yoneticisini (context manager) yaz;
  __enter__ icinde dosyayi okuyup kuyrugu doldur, __exit__ icinde kaynaklari
  serbest birak ve toplam degerleri disariya aktar.

reference_solution: |
  cat > grid/readings.py <<'READINGS'
  def parse_lines(lines):
      rows = []
      for line in lines:
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          parts = line.split()
          rows.append((parts[0], int(parts[1])))
      return rows


  def read_meter_file(path):
      with open(path, "r", encoding="ascii") as handle:
          return parse_lines(handle.readlines())


  class MeterQueue:
      def __init__(self, path):
          self.path = path
          self._handle = None
          self._pending = []
          self.totals = {}
          self.closed = False

      def __enter__(self):
          self._handle = open(self.path, "r", encoding="ascii")
          try:
              rows = parse_lines(self._handle.readlines())
          finally:
              self._handle.close()
              self._handle = None
          for name, delta in rows:
              self._pending.append((name, delta))
          self._drain()
          return self

      def _drain(self):
          while self._pending:
              name, delta = self._pending.pop(0)
              self.totals[name] = self.totals.get(name, 0) + delta

      def peek_queue(self):
          return list(self._pending)

      def best_meter(self):
          if not self.totals:
              return None
          return max(self.totals.items(), key=lambda item: item[1])[0]

      def __exit__(self, exc_type, exc, tb):
          self._pending = []
          self.closed = True
          return False
  READINGS

