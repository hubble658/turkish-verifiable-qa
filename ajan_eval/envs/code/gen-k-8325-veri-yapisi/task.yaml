  grid/readings.py içinde MeterQueue adında bir bağlam yöneticisi (context manager) yaz. Bu yönetici, meter dosyasındaki okumaları sırayla işleyip her sayacın toplam tüketimini hesaplamalı ve en yüksek toplamı taşıyan sayacın adını döndürmeli. __enter__ içinde dosyayı okuyup kuyruğu doldur; __exit__ içinde kaynakları serbest bırak ve toplam değerleri dışarıya aktar.

