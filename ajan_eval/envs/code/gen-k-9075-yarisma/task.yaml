# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) plans/picker.py dosyasındaki pick_plans fonksiyonunu, her adımda bütçeye sığan tüm seçenekler arasından aylık ücreti en yüksek olanı seçerek açgözlü biçimde planları döndürecek şekilde düzelt.

  2) plans/summary.py dosyasındaki budget_report fonksiyonunu, seçilen planların özellik (features) toplamını döndürecek şekilde düzelt.

  3) plans/catalog.py dosyasındaki plan_catalog fonksiyonunu değiştirmeden koru.

setup: |
  mkdir -p plans
  cat > plans/catalog.py <<'CAT'
  def plan_catalog():
      return {
          "basic": {"monthly": 10, "features": 5},
          "plus": {"monthly": 18, "features": 12},
          "pro": {"monthly": 30, "features": 25},
          "team": {"monthly": 25, "features": 20},
      }
  CAT
  cat > plans/picker.py <<'PICK'
  from plans.catalog import plan_catalog


  def pick_plans(budget):
      catalog = plan_catalog()
      chosen = []
      spent = 0
      for name in catalog:
          price = catalog[name]["monthly"]
          if spent + price <= budget:
              chosen.append(name)
              spent += price
      return chosen
  PICK
  cat > plans/summary.py <<'SUM'
  from plans.picker import pick_plans


  def budget_report(budget):
      names = pick_plans(budget)
      return len(names)
  SUM

goal_tr: >
  plans/picker.py icindeki pick_plans fonksiyonunu, her adimda butceye
  sigani degil butceye sigan secenekler icinden aylik ucreti en yuksek olani
  secerek acgozlu bicimde planlari dondurecek sekilde duzelt;
  plans/summary.py icindeki budget_report ise secilen planlarin ozellik
  (features) toplamini dondursun.

reference_solution: |
  cat > plans/picker.py <<'PICK'
  from plans.catalog import plan_catalog


  def pick_plans(budget):
      catalog = plan_catalog()
      chosen = []
      spent = 0
      while True:
          affordable = [
              name
              for name in catalog
              if name not in chosen and spent + catalog[name]["monthly"] <= budget
          ]
          if not affordable:
              break
          best = max(affordable, key=lambda n: (catalog[n]["monthly"], n))
          chosen.append(best)
          spent += catalog[best]["monthly"]
      return chosen
  PICK
  cat > plans/summary.py <<'SUM'
  from plans.catalog import plan_catalog
  from plans.picker import pick_plans


  def budget_report(budget):
      catalog = plan_catalog()
      names = pick_plans(budget)
      return sum(catalog[name]["features"] for name in names)
  SUM

