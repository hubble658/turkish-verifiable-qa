goal_tr: >
  bank/accounts.py, bank/unions.py ve bank/report.py dosyalarindaki
  NotImplementedError govdelerini gercek gerceklestirimlerle doldur;
  load_accounts accounts.txt satirlarini (a,b) ciftleri olarak yield eden
  bir generator olsun, account_pairs her cifti iki yonlu kenar olarak yield
  etsin, UnionFind birlesim-bulma yapisi olsun ve merged_groups ile
  group_map hesaplanan gruplari dondursun.

reference_solution: |
  cat > bank/accounts.py <<'EOF'
  def load_accounts(path="accounts.txt"):
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              left, right = line.split(",")
              yield (left.strip(), right.strip())


  def account_pairs(path="accounts.txt"):
      for a, b in load_accounts(path):
          yield (a, b)
          yield (b, a)
  EOF
  cat > bank/unions.py <<'EOF'
  class UnionFind:
      def __init__(self, items):
          self._parent = {item: item for item in items}

      def find(self, x):
          root = x
          while self._parent[root] != root:
              root = self._parent[root]
          while self._parent[x] != root:
              self._parent[x], x = root, self._parent[x]
          return root

      def union(self, a, b):
          ra, rb = self.find(a), self.find(b)
          if ra != rb:
              self._parent[rb] = ra
          return ra

      def groups(self):
          buckets = {}
          for item in self._parent:
              buckets.setdefault(self.find(item), []).append(item)
          return {root: sorted(members) for root, members in buckets.items()}
  EOF
  cat > bank/report.py <<'EOF'
  from bank.accounts import load_accounts, account_pairs
  from bank.unions import UnionFind


  def merged_groups(path="accounts.txt"):
      names = []
      seen = set()
      for a, b in load_accounts(path):
          for name in (a, b):
              if name not in seen:
                  seen.add(name)
                  names.append(name)
      uf = UnionFind(names)
      for a, b in account_pairs(path):
          uf.union(a, b)
      return uf.groups()


  def group_map(path="accounts.txt"):
      result = {}
      for members in merged_groups(path).values():
          for name in members:
              result[name] = members[0]
      return result
  EOF

