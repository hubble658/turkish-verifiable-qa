  bank/accounts.py, bank/unions.py ve bank/report.py dosyalarındaki NotImplementedError gövdelerini gerçek gerçekleştirimlerle doldur. bank/accounts.py içindeki load_accounts, accounts.txt dosyasındaki satırları (a, b) çiftleri olarak yield eden bir generator olsun; account_pairs ise her çifti iki yönlü kenar olarak yield etsin. bank/unions.py içindeki UnionFind sınıfı bir birleşim-bulma (union-find) yapısı olsun. bank/report.py içindeki merged_groups ve group_map, hesaplanan grupları döndürsün.

  Şu şartlar sağlanmalı:
  - bank/accounts.py, bank/unions.py ve bank/report.py dosyalarında NotImplementedError kalmamalı.
  - load_accounts, accounts.txt dosyasındaki her satırı (a, b) çifti olarak yield eden bir generator olmalı.
  - account_pairs, her çifti iki yönlü kenar olarak yield etmeli.
  - UnionFind sınıfı çalışan bir birleşim-bulma yapısı sunmalı.
  - merged_groups ve group_map, hesaplanan grupları döndürmeli.
  - accounts.txt içeriği alice,bob / carol,dave / bob,carol / erin,frank satırlarıyla aynı kalmalı.

