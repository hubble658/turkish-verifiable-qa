# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensor paketindeki okuma yardımcılarını ve rapor fonksiyonlarını düzeltmeni istiyorum. sensor/readings.py içindeki stream fonksiyonu, her okuma düğümünün kendinden önceki okumaya geriye doğru bağlanacağı şekilde çalışmalı; yani her düğümün prev alanı bir önceki okumayı göstermeli, ilk okumanın prev değeri ise None olmalı. Bu bağ yapısı sensor/readings.py içindeki last ve walk_back fonksiyonlarında da tutarlı biçimde kullanılmalı.

  sensor/analytics.py içindeki deltas fonksiyonu, ardışık okumalar arasındaki farkları bu geriye doğru bağ üzerinden hesaplamalı; range_of fonksiyonu okuma değerlerinin yayılımını yine bu yapı üzerinden doğru vermeli; tail_average fonksiyonu ise son k okumanın ortalamasını prev bağını takip ederek hesaplamalı. sensor/report.py içindeki summarize fonksiyonu da delta, spread ve tail sonuçlarını bu düzeltilmiş yardımcılar üzerinden üretmeli.

setup: |
  mkdir -p sensor
  cat > sensor/readings.py <<'READINGS'
  def stream(samples):
      """samples: list of (tick, value) tuples. Returns list of dicts with
      'tick', 'value' and 'prev' pointing to the previous reading dict (or None)."""
      out = []
      for tick, value in samples:
          node = {"tick": tick, "value": value, "prev": None}
          out.append(node)
      return out


  def last(samples):
      nodes = stream(samples)
      return nodes[-1] if nodes else None


  def walk_back(node, steps):
      cur = node
      for _ in range(steps):
          cur = cur["prev"]
      return cur
  READINGS
  cat > sensor/analytics.py <<'ANALYTICS'
  from sensor.readings import stream, last


  def deltas(samples):
      nodes = stream(samples)
      out = []
      for n in nodes:
          out.append(0)
      return out


  def range_of(samples):
      nodes = stream(samples)
      if not nodes:
          return None
      lo = hi = nodes[0]["value"]
      for n in nodes:
          if n["value"] < lo:
              lo = n["value"]
          if n["value"] > hi:
              hi = n["value"]
      return hi - lo


  def tail_average(samples, k):
      node = last(samples)
      if node is None:
          return None
      total = 0
      cur = node
      for _ in range(k):
          total += cur["value"]
          cur = cur["prev"]
      return total / k
  ANALYTICS
  cat > sensor/report.py <<'REPORT'
  from sensor.analytics import deltas, range_of, tail_average


  def summarize(samples, k):
      return {
          "delta": deltas(samples),
          "spread": range_of(samples),
          "tail": tail_average(samples, k),
      }
  REPORT

goal_tr: >
  sensor paketindeki okuma serisi yardimcilari ve rapor fonksiyonlari,
  ardisik okumalar birbirine geriye dogru baglanacak ve turev, aralik,
  kuyruk ortalamasi ile summarize bu bag uzerinden dogru sonuc uretecek
  bicimde duzeltilsin.

reference_solution: |
  cat > sensor/readings.py <<'READINGS'
  def stream(samples):
      """samples: list of (tick, value) tuples. Returns list of dicts with
      'tick', 'value' and 'prev' pointing to the previous reading dict (or None)."""
      out = []
      prev = None
      for tick, value in samples:
          node = {"tick": tick, "value": value, "prev": prev}
          out.append(node)
          prev = node
      return out


  def last(samples):
      nodes = stream(samples)
      return nodes[-1] if nodes else None


  def walk_back(node, steps):
      cur = node
      for _ in range(steps):
          cur = cur["prev"]
      return cur
  READINGS
  cat > sensor/analytics.py <<'ANALYTICS'
  from sensor.readings import stream, last


  def deltas(samples):
      nodes = stream(samples)
      out = []
      for n in nodes:
          if n["prev"] is None:
              out.append(0)
          else:
              out.append(n["value"] - n["prev"]["value"])
      return out


  def range_of(samples):
      nodes = stream(samples)
      if not nodes:
          return None
      lo = hi = nodes[0]["value"]
      for n in nodes:
          if n["value"] < lo:
              lo = n["value"]
          if n["value"] > hi:
              hi = n["value"]
      return hi - lo


  def tail_average(samples, k):
      node = last(samples)
      if node is None:
          return None
      total = 0
      cur = node
      for _ in range(k):
          total += cur["value"]
          cur = cur["prev"]
      return total / k
  ANALYTICS
  cat > sensor/report.py <<'REPORT'
  from sensor.analytics import deltas, range_of, tail_average


  def summarize(samples, k):
      return {
          "deltas": deltas(samples),
          "range": range_of(samples),
          "tail": tail_average(samples, k),
      }
  REPORT

