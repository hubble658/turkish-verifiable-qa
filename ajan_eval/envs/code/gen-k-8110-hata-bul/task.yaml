# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  roster/plan.py dosyasında ShiftPlan sınıfının hours_for metodu var; bu metot bir işçinin toplam vardiya saatini yanlış hesaplıyor. hours_for metodunu, verilen işçinin tüm vardiyalarındaki toplam çalışma saatini doğru şekilde döndürecek biçimde düzelt. Diğer metotlara, sınıfın geri kalanına ve roster/loader.py ile shifts.txt dosyalarına dokunma; sadece hours_for içindeki hesabı düzelt.

setup: |
  mkdir -p roster
  cat > roster/loader.py <<'LOADER'
  def load_shifts(path):
      rows = []
      with open(path, "r", encoding="utf-8") as fh:
          for line in fh:
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              worker, start, end = line.split(",")
              rows.append((worker, int(start), int(end)))
      return rows
  LOADER
  cat > roster/plan.py <<'PLAN'
  from roster.loader import load_shifts


  class ShiftPlan:
      def __init__(self, shifts):
          self.shifts = shifts

      def total_hours(self):
          total = 0
          for _, start, end in self.shifts:
              total += end - start
          return total

      def hours_for(self, worker):
          total = 0
          for name, start, end in self.shifts:
              if name == worker:
                  total += end - start - 1
          return total

      def busiest(self):
          best = None
          best_hours = -1
          for name, start, end in self.shifts:
              h = self.hours_for(name)
              if h > best_hours:
                  best_hours = h
                  best = name
          return best

      def __add__(self, other):
          return ShiftPlan(self.shifts + other.shifts)

      def __len__(self):
          return len(self.shifts)

      def __repr__(self):
          return "ShiftPlan(%d shifts)" % len(self.shifts)


  def build(path):
      return ShiftPlan(load_shifts(path))
  PLAN
  cat > shifts.txt <<'SHIFTS'
  # worker,start,end
  ada,8,16
  bora,9,13
  ada,18,22
  cem,7,15
  bora,14,20
  SHIFTS

goal_tr: >
  roster/plan.py icindeki ShiftPlan.hours_for metodunu, bir iscinin toplam
  vardiya saatini dogru hesaplayacak bicimde duzelt.

