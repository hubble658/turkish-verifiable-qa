# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  restaurant/queue.py ve restaurant/kitchen.py dosyalarındaki sınıfları gerçek kuyruk davranışıyla doldur.

  restaurant/queue.py içindeki OrderQueue sınıfında enqueue, dequeue, peek, size ve is_empty metotları bulunuyor. Bu metotlar şu an NotImplementedError fırlatıyor; hepsini gerçek bir kuyruk (FIFO) davranışıyla çalışacak şekilde doldur.

  restaurant/kitchen.py içindeki Kitchen sınıfında place, next_order ve pending metotları bulunuyor. Bu metotlar da şu an NotImplementedError fırlatıyor; hepsini doldur. Kitchen sınıfı, bekleyen siparişleri tutmak için OrderQueue sınıfını kullanmalı.

  Şu şartlar sağlanmalı:
  - restaurant/queue.py içindeki OrderQueue sınıfında enqueue, dequeue, peek, size ve is_empty metotlarının hepsi doldurulmuş olmalı; hiçbiri NotImplementedError fırlatmamalı.
  - OrderQueue gerçek FIFO davranışı göstermeli: enqueue ile eklenen siparişler, dequeue ile eklenme sırasıyla çıkarılmalı.
  - peek, kuyruktan eleman çıkarmadan sıradaki siparişi döndürmeli.
  - size, kuyruktaki eleman sayısını döndürmeli; is_empty kuyruk boşken True döndürmeli.
  - restaurant/kitchen.py içindeki Kitchen sınıfında place, next_order ve pending metotlarının hepsi doldurulmuş olmalı; hiçbiri NotImplementedError fırlatmamalı.
  - Kitchen, bekleyen siparişleri sıralamak için OrderQueue sınıfını kullanmalı.
  - place ile verilen sipariş kuyruğa eklenmeli; next_order kuyruktan sıradaki siparişi çıkarıp döndürmeli; pending bekleyen siparişleri döndürmeli.
  - restaurant/orders.py içindeki Order sınıfı değiştirilmemeli.

