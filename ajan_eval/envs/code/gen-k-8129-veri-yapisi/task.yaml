  from restaurant.orders import Order


  class Kitchen:
      def __init__(self):
          self.queue = OrderQueue()

      def place(self, order_id, table, item):
          raise NotImplementedError

      def next_order(self):
          raise NotImplementedError

      def pending(self):
          raise NotImplementedError
  KITCHEN
  cat > restaurant/__init__.py <<'INIT'
  INIT

goal_tr: >
  restaurant/queue.py icindeki OrderQueue sinifini (enqueue, dequeue, peek,
  size, is_empty) ve restaurant/kitchen.py icindeki Kitchen sinifini (place,
  next_order, pending) gercek kuyruk davranisiyla (FIFO) doldur; Kitchen
  sirasi icin OrderQueue kullanmali.

reference_solution: |
  cat > restaurant/queue.py <<'QUEUE'
  from restaurant.orders import Order


  class OrderQueue:
      def __init__(self):
          self._items = []

      def enqueue(self, order):
          self._items.append(order)

      def dequeue(self):
          if not self._items:
              raise IndexError("dequeue from empty queue")
          return self._items.pop(0)

      def peek(self):
          if not self._items:
              raise IndexError("peek from empty queue")
          return self._items[0]

      def size(self):
          return len(self._items)

      def is_empty(self):
          return len(self._items) == 0
  QUEUE
  cat > restaurant/kitchen.py <<'KITCHEN'
  from restaurant.queue import OrderQueue
  from restaurant.orders import Order


  class Kitchen:
      def __init__(self):
          self.queue = OrderQueue()

      def place(self, order_id, table, item):
          self.queue.enqueue(Order(order_id, table, item))

      def next_order(self):
          return self.queue.dequeue()

      def pending(self):
          return self.queue.size()
  KITCHEN

