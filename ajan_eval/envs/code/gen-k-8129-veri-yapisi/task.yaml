      def dequeue(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def size(self):
          raise NotImplementedError

      def is_empty(self):
          raise NotImplementedError
  QUEUE
  cat > restaurant/kitchen.py <<'KITCHEN'
