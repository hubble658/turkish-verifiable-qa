  - {op: run_stdout_eq, cmd: 'python3 -c ''from grid.billing.invoice import invoice as f; rows=[("home",100),("shop",40),("home",20)]; assert f(rows)==28.0, f(rows); assert f([])==0.0, f([]); assert f([("shop",4)])==1.0, f([("shop",4)]); print("ZINCIR-TAMAM")''', value: ZINCIR-TAMAM}
