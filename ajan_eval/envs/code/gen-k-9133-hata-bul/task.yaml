  - {op: run_stdout_eq, cmd: 'python3 -c ''from grid.billing.tariff import line_total as f; assert f("home",10)==1.5, f("home",10); assert f("shop",4)==1.0, f("shop",4); print("REGRESYON-TAMAM")''', value: REGRESYON-TAMAM}

