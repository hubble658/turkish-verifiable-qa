split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) flights/ledger.py dosyasındaki seat_report fonksiyonunu, koltuk toplamları eşit olan uçuşlarda alfabetik uçuş koduna göre kararlı bir sıra döndürecek biçimde düzelt.

  2) Aynı fonksiyonda, seat_report'a aktarılan limit değeri negatif olduğunda NoSeats istisnası yükseltilecek biçimde düzelt.

  3) Bu düzeltmelerden sonra bookings.txt için seat_report(..., 3) çağrısının [("BA2", 10), ("LH3", 10), ("TK1", 10)] döndürdüğünü doğrula.

setup: |
  mkdir -p flights
  cat > flights/errors.py <<'ERRORS'
  class BookingError(Exception):
      pass


  class NoSeats(BookingError):
      def __init__(self, flight, count):
          super().__init__("no seats")
          self.flight = flight
          self.count = count
  ERRORS
  cat > flights/ledger.py <<'LEDGER'
  from flights.errors import NoSeats


  def build_ledger(rows):
      ledger = {}
      for row in rows:
          code, seats = row
          ledger.setdefault(code, []).append(seats)
      return ledger


  def seat_report(rows, limit):
      ledger = build_ledger(rows)
      totals = [(code, sum(v)) for code, v in ledger.items()]
      totals.sort(key=lambda item: item[1])
      return totals[:limit]
  LEDGER
  cat > bookings.txt <<'DATA'
  TK1,4
  TK1,6
  BA2,9
  BA2,1
  LH3,5
  LH3,5
  DATA

goal_tr: >
  flights/ledger.py icindeki seat_report fonksiyonunu, koltuk toplamlari
  esit olan ucuslarda alfabetik ucus koduna gore kararli bir sira dondurecek
  ve seat_report'a aktarilan limit degeri negatif oldugunda NoSeats
  istisnasi yuksetecek bicimde duzelt; boylece bookings.txt icin
  seat_report(...,3) cagrisi [("BA2",10),("LH3",10),("TK1",10)] dondursun.

reference_solution: |
  cat > flights/ledger.py <<'LEDGER'
  from flights.errors import NoSeats


  def build_ledger(rows):
      ledger = {}
      for row in rows:
          code, seats = row
          ledger.setdefault(code, []).append(seats)
      return ledger


  def seat_report(rows, limit):
      if limit < 0:
          raise NoSeats("request", limit)
      ledger = build_ledger(rows)
      totals = [(code, sum(v)) for code, v in ledger.items()]
      totals.sort(key=lambda item: (-item[1], item[0]))
      return totals[:limit]
  LEDGER

