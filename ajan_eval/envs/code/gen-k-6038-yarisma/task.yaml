# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  maint/parse/records.py dosyasındaki satır ayrıştırmasını, her satırı makine adı, bakım türü, saat ve maliyet olmak üzere dört ayrı alana doğru şekilde ayıracak biçimde düzelt. Ayrıca maint/report/summary.py dosyasındaki MaintenanceLedger.total_cost metodunu, verilen bir makinenin tüm kayıtlarının maliyetini toplayacak şekilde düzelt. Bu düzeltmelerden sonra log.txt üzerinde machines, total_cost ve busiest doğru sonuç vermeli.

setup: |
  mkdir -p maint/parse maint/report
  cat > maint/parse/records.py <<'RECORDS'
  """Parsing of raw maintenance log lines."""


  def split_line(line):
      # BUG 1: rsplit(..., 2) splits from the right, so the FIRST field
      # (machine name) absorbs everything before the last two commas.
      parts = line.strip().rsplit(",", 2)
      if len(parts) != 3:
          raise ValueError("bad line: %r" % line)
      return parts


  def parse_line(line):
      machine, kind, tail = split_line(line)
      hours, cost = tail.split(",")
      return {
          "machine": machine.strip(),
          "kind": kind.strip(),
          "hours": float(hours),
          "cost": float(cost),
      }


  def parse_log(text):
      out = []
      for line in text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          out.append(parse_line(line))
      return out
  RECORDS
  cat > maint/report/summary.py <<'SUMMARY'
  """Aggregation of parsed maintenance records."""

  from maint.parse.records import parse_log


  class MaintenanceLedger:
      def __init__(self):
          self._records = []

      def load(self, text):
          self._records.extend(parse_log(text))
          return self

      def machines(self):
          seen = []
          for rec in self._records:
              if rec["machine"] not in seen:
                  seen.append(rec["machine"])
          return sorted(seen)

      def total_cost(self, machine):
          total = 0.0
          for rec in self._records:
              if rec["machine"] == machine:
                  # BUG 2: returns after the first matching record instead
                  # of accumulating all of them.
                  return total + rec["cost"]
          return total

      def busiest(self):
          best = None
          best_hours = -1.0
          for rec in self._records:
              if rec["hours"] > best_hours:
                  best_hours = rec["hours"]
                  best = rec["machine"]
          return best
  SUMMARY
  cat > maint/__init__.py <<'INIT'
  INIT
  cat > maint/parse/__init__.py <<'INIT'
  INIT
  cat > maint/report/__init__.py <<'INIT'
  INIT
  cat > log.txt <<'LOG'
  # maintenance log
  press-A,oil,2.5,120.0
  press-A,filter,1.0,40.0
  lathe-B,belt,3.25,90.5
  press-A,oil,0.5,15.0
  lathe-B,oil,2.0,60.0
  LOG

