id: gen-k-2000-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  arena/board/table.py içindeki ScoreTable sıralamasını düzelt: en yüksek puan üstte olsun, eşit puanda önce eklenen üstte kalsın. arena/report.py doğru sonuç döndürsün; gerekirse arena/board/entry.py'yi de kullan.

setup: |
  mkdir -p arena/board
  cat > arena/board/entry.py <<'ENTRY'
  class Entry:
      def __init__(self, player, points, order):
          self.player = player
          self.points = points
          self.order = order
  ENTRY
  cat > arena/board/table.py <<'TABLE'
  from arena.board.entry import Entry


  class ScoreTable:
      def __init__(self):
          self._entries = []
          self._next = 0

      def add(self, player, points):
          self._entries.append(Entry(player, points, self._next))
          self._next += 1

      def ranked(self):
          rows = sorted(self._entries, key=lambda e: e.points)
          return [e.player for e in rows]

      def best(self):
          rows = sorted(self._entries, key=lambda e: e.points)
          return rows[0].player
  TABLE
  cat > arena/report.py <<'REPORT'
  from arena.board.table import ScoreTable


  def standings(rows):
      table = ScoreTable()
      for player, points in rows:
          table.add(player, points)
      return table.ranked()


  def champion(rows):
      table = ScoreTable()
      for player, points in rows:
          table.add(player, points)
      return table.best()
  REPORT

goal_tr: >
  arena/board/table.py icindeki ScoreTable sinifini, esit puanlarda once
  eklenen oyuncu ustte kalacak ve en yuksek puan one gelecek sekilde sirala;
  boylece arena/report.py dogru sonuc dondursun.

reference_solution: |
  cat > arena/board/table.py <<'TABLE'
  from arena.board.entry import Entry


  class ScoreTable:
      def __init__(self):
          self._entries = []
          self._next = 0

      def add(self, player, points):
          self._entries.append(Entry(player, points, self._next))
          self._next += 1

      def ranked(self):
          rows = sorted(self._entries, key=lambda e: (-e.points, e.order))
          return [e.player for e in rows]

      def best(self):
          rows = sorted(self._entries, key=lambda e: (-e.points, e.order))
          return rows[0].player
  TABLE

