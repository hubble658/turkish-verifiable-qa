# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  clinic/schedule.py içindeki Schedule sınıfını tamamla. Sınıfın merge() metodu, aynı hekimin bitişik ya da kesişen randevu aralıklarını tek bir aralıkta birleştirip sonucu (başlangıç, bitiş, hekim) üçlüleri halinde, başlangıca göre artan sırada döndürsün. total_minutes() metodu, birleştirilmiş aralıkların toplam süresini dakika cinsinden döndürsün. overlaps(other) metodu ise başka bir Schedule nesnesiyle herhangi bir çakışma olup olmadığını doğru şekilde döndürsün. clinic/records.py dosyasındaki load_visits fonksiyonu zaten mevcut ve randevu kayıtlarını okuyor; onu olduğu gibi kullan. Girdi olarak visits.txt dosyası kullanılacak; bu dosyada her satırda noktalı virgülle ayrılmış başlangıç, bitiş ve hekim bilgisi var.

setup: |
  mkdir -p clinic
  cat > clinic/records.py <<'RECORDS'
  def load_visits(path):
      rows = []
      with open(path, encoding="ascii") as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              parts = line.split(";")
              rows.append((int(parts[0]), int(parts[1]), parts[2]))
      return rows
  RECORDS
  cat > clinic/schedule.py <<'SCHEDULE'
  from clinic.records import load_visits


  class Schedule:
      def __init__(self, path):
          self.path = path
          self.visits = load_visits(path)
          self.merged = self._merge_visits(self.visits)

      def _merge_visits(self, visits):
          by_doctor = {}
          for start, end, doctor in visits:
              by_doctor.setdefault(doctor, []).append((start, end))
          merged = []
          for doctor in sorted(by_doctor):
              spans = sorted(by_doctor[doctor])
              for start, end in spans:
                  if merged and merged[-1][2] == doctor and start <= merged[-1][1]:
                      prev_start, prev_end, _ = merged[-1]
                      merged[-1] = (prev_start, max(prev_end, end), doctor)
                  else:
                      merged.append((start, end, doctor))
          return merged

      def merge(self):
          return []

      def total_minutes(self):
          return 0

      def overlaps(self, other):
          raise NotImplementedError
  SCHEDULE
  cat > visits.txt <<'VISITS'
  540;600;dr-ayse
  600;660;dr-ayse
  660;720;dr-ayse
  480;540;dr-bora
  540;570;dr-bora
  900;960;dr-ceren
  VISITS

goal_tr: >
  clinic/schedule.py icindeki Schedule sinifini, ayni hekimin
  bitisik/kesisen randevu araliklarini birlestirip merge() ile [(baslangic,
  bitis, hekim)] listesini baslangica gore artan sirada, total_minutes() ile
  birlestirilmis toplam dakikayi, overlaps(other) ile baska bir Schedule ile
  cakisma olup olmadigini dogru dondurecek bicimde tamamla.

reference_solution: |
  cat > clinic/schedule.py <<'SCHEDULE'
  from clinic.records import load_visits


  class Schedule:
      def __init__(self, path):
          self.path = path
          self.visits = load_visits(path)
          self.merged = self._merge_visits(self.visits)

      def _merge_visits(self, visits):
          by_doctor = {}
          for start, end, doctor in visits:
              by_doctor.setdefault(doctor, []).append((start, end))
          merged = []
          for doctor in sorted(by_doctor):
              spans = sorted(by_doctor[doctor])
              for start, end in spans:
                  if merged and merged[-1][2] == doctor and start <= merged[-1][1]:
                      prev_start, prev_end, _ = merged[-1]
                      merged[-1] = (prev_start, max(prev_end, end), doctor)
                  else:
                      merged.append((start, end, doctor))
          merged.sort(key=lambda item: (item[0], item[2]))
          return merged

      def merge(self):
          return self.merged

      def total_minutes(self):
          return sum(end - start for start, end, _ in self.merged)

      def overlaps(self, other):
          for a_start, a_end, _ in self.merged:
              for b_start, b_end, _ in other.merged:
                  if a_start < b_end and b_start < a_end:
                      return True
          return False
  SCHEDULE
  cat > other.txt <<'OTHER'
  540;570;dr-derya
  OTHER

