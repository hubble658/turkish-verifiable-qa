split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 22

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) depo/records.py dosyasındaki StockRecord sınıfını incele; available metodu kullanılabilir miktarı eldeki miktardan rezerve miktarını çıkararak doğru hesaplasın, is_short metodu ise eşik değerine eşit olduğunda kaydı kısa stoklu sayacak şekilde doğru karşılaştırsın.

  2) depo/stream.py dosyasındaki parse_line fonksiyonunu incele; her satırdaki alanlar (sku, quantity, reserved) doğru sırayla ve doğru alanlara eşlensin, reserved alanı quantity ile karıştırılmasın.

  3) depo/report.py dosyasındaki total_available ve short_skus fonksiyonlarını incele; total_available her kaydın doğru hesaplanmış kullanılabilir miktarını toplayarak doğru toplamı versin, short_skus ise eşik dahil olacak şekilde kısa stoklu ürünlerin sku değerlerini doğru seçsin.

setup: |
  mkdir -p depo
  cat > depo/records.py <<'RECORDS'
  from dataclasses import dataclass


  @dataclass
  class StockRecord:
      sku: str
      quantity: int
      reserved: int

      def available(self):
          # BUG 1: reserved cikarilmasi gerekirken toplaniyor
          return self.quantity + self.reserved

      def is_short(self, threshold):
          return self.available() < threshold
  RECORDS
  cat > depo/stream.py <<'STREAM'
  from depo.records import StockRecord


  def parse_line(line):
      parts = line.strip().split(";")
      # BUG 2: reserved alani quantity ile karistirilmis
      return StockRecord(sku=parts[0], quantity=int(parts[1]), reserved=int(parts[1]))


  def iter_records(text):
      for line in text.splitlines():
          if not line.strip():
              continue
          yield parse_line(line)
  STREAM
  cat > depo/report.py <<'REPORT'
  from depo.stream import iter_records


  def total_available(text):
      total = 0
      for rec in iter_records(text):
          total += rec.available()
      return total


  def short_skus(text, threshold):
      out = []
      for rec in iter_records(text):
          # BUG 3: esik karsilastirmasi ters yonde (<= yerine <, ve esitlikte disla)
          if rec.available() < threshold:
              out.append(rec.sku)
      return out
  REPORT
  cat > inventory.txt <<'INV'
  widget;10;3
  gadget;4;4
  bolt;100;0
  nut;2;5
  INV

goal_tr: >
  Envanter raporu yanlis toplam veriyor ve kisa stoklu urunleri yanlis
  seciyor: depo paketindeki modulleri inceleyip, her kaydin kullanilabilir
  miktarinin (eldeki eksi rezerve) dogru hesaplanmasini, kayitlarin
  alanlarinin dogru eslenmesini ve esik karsilastirmasinin (esik dahil kisa
  sayilacak sekilde) dogru calismasini sagla.

reference_solution: |
  cat > depo/records.py <<'RECORDS'
  from dataclasses import dataclass


  @dataclass
  class StockRecord:
      sku: str
      quantity: int
      reserved: int

      def available(self):
          return self.quantity - self.reserved

      def is_short(self, threshold):
          return self.available() < threshold
  RECORDS
  cat > depo/stream.py <<'STREAM'
  from depo.records import StockRecord


  def parse_line(line):
      parts = line.strip().split(";")
      return StockRecord(sku=parts[0], quantity=int(parts[1]), reserved=int(parts[2]))


  def iter_records(text):
      for line in text.splitlines():
          if not line.strip():
              continue
          yield parse_line(line)
  STREAM
  cat > depo/report.py <<'REPORT'
  from depo.stream import iter_records


  def total_available(text):
      total = 0
      for rec in iter_records(text):
          total += rec.available()
      return total


  def short_skus(text, threshold):
      out = []
      for rec in iter_records(text):
          if rec.available() <= threshold:
              out.append(rec.sku)
      return out
  REPORT

