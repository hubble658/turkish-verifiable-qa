goal_tr: >
  clinic/queue/store.py icindeki QueueStore sinifini FIFO kuyruk
  (add/remove/peek/drain/len), clinic/queue/priority.py icindeki
  PriorityQueueStore sinifini ise (oncelik, sira) ciftine gore
  kucuk-oncelik-once davranan kuyruk olarak gerceklestir;
  clinic/triage.py'deki make_queue, _fifo ve _priority closure fabrikalarini
  kullanarak her cagride bagimsiz bir kuyruk dondursun.

reference_solution: |
  cat > clinic/queue/store.py <<'STORE'
  class QueueStore:
      def __init__(self):
          self._items = []
          self._seq = 0

      def _next_seq(self):
          self._seq += 1
          return self._seq

      def add(self, item):
          seq = self._next_seq()
          self._items.append((seq, item))
          return seq

      def remove(self, key):
          for i, (seq, item) in enumerate(self._items):
              if seq == key:
                  del self._items[i]
                  return item
          raise KeyError(key)

      def peek(self):
          if not self._items:
              raise IndexError("peek from empty queue")
          return self._items[0][1]

      def drain(self):
          out = [item for _, item in self._items]
          self._items = []
          return out

      def __len__(self):
          return len(self._items)
  STORE
  cat > clinic/queue/priority.py <<'PRIO'
  class PriorityQueueStore:
      def __init__(self):
          self._items = []
          self._seq = 0

      def _next_seq(self):
          self._seq += 1
          return self._seq

      def add(self, item):
          priority, value = item
          seq = self._next_seq()
          self._items.append((priority, seq, value))
          return seq

      def remove(self, key):
          for i, (priority, seq, value) in enumerate(self._items):
              if seq == key:
                  del self._items[i]
                  return value
          raise KeyError(key)

      def _ordered(self):
          return sorted(self._items, key=lambda r: (r[0], r[1]))

      def peek(self):
          if not self._items:
              raise IndexError("peek from empty queue")
          return self._ordered()[0][2]

      def drain(self):
          out = [value for _, _, value in self._ordered()]
          self._items = []
          return out

      def __len__(self):
          return len(self._items)
  PRIO
  cat > clinic/triage.py <<'TRIAGE'
  from clinic.queue.store import QueueStore
  from clinic.queue.priority import PriorityQueueStore


  def make_queue(kind):
      if kind == "fifo":
          return _fifo()
      if kind == "priority":
          return _priority()
      raise ValueError("unknown queue kind: " + str(kind))


  def _fifo():
      store = QueueStore()

      def add(item):
          return store.add(item)

      def remove(key):
          return store.remove(key)

      def peek():
          return store.peek()

      def drain():
          return store.drain()

      def size():
          return len(store)

      return {"add": add, "remove": remove, "peek": peek,
              "drain": drain, "size": size}


  def _priority():
      store = PriorityQueueStore()

      def add(item):
          return store.add(item)

      def remove(key):
          return store.remove(key)

      def peek():
          return store.peek()

      def drain():
          return store.drain()

      def size():
          return len(store)

      return {"add": add, "remove": remove, "peek": peek,
              "drain": drain, "size": size}
  TRIAGE

