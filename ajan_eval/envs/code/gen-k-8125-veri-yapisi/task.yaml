goal_tr: >
  registrar/core/intervals.py icindeki SpanSet sinifini oyle gercekle ki add
  ile eklenen araliklar merged cagrisinda artan sirada ve kesisen ya da
  birbirine degerek temas eden araliklar tek Span olacak sekilde
  birlestirilsin, coverage ise birlesik araliklarin toplam uzunlugunu
  dondursun.

reference_solution: |
  cat > registrar/core/intervals.py <<'PY'
  from dataclasses import dataclass, field


  @dataclass
  class Span:
      start: int
      end: int
      tags: list = field(default_factory=list)

      def __post_init__(self):
          if self.end < self.start:
              raise ValueError("end before start")


  class SpanSet:
      def __init__(self):
          self._spans = []

      def add(self, span):
          self._spans.append(span)

      def merged(self):
          ordered = sorted(self._spans, key=lambda s: (s.start, s.end))
          out = []
          for span in ordered:
              if not out or span.start > out[-1].end:
                  out.append(Span(span.start, span.end, list(span.tags)))
              else:
                  last = out[-1]
                  if span.end > last.end:
                      last.end = span.end
                  for tag in span.tags:
                      if tag not in last.tags:
                          last.tags.append(tag)
          return out

      def coverage(self):
          return sum(s.end - s.start for s in self.merged())
  PY

