      def merged(self):
          raise NotImplementedError

      def coverage(self):
          raise NotImplementedError
  PY
  cat > registrar/merge/stream.py <<'PY'
  from registrar.core.intervals import Span, SpanSet


  def parse_span(line):
      parts = line.strip().split("|")
      start, end = parts[0].split(":")
      tags = parts[1].split(",") if len(parts) > 1 and parts[1] else []
      return Span(int(start), int(end), tags)


  def feed(lines):
      box = SpanSet()
      for line in lines:
          if not line.strip():
              continue
          box.add(parse_span(line))
      return box
  PY
  cat > registrar/__init__.py <<'PY'
  PY
  cat > registrar/core/__init__.py <<'PY'
  PY
  cat > registrar/merge/__init__.py <<'PY'
