          if merged and start <= merged[-1][1]:
              merged[-1] = (merged[-1][0], max(merged[-1][1], end))
          else:
              merged.append((start, end))
      return merged
  INTERVALS
  cat > plans/reader.py <<'READER'
  from plans.intervals import normalize


  def parse_lines(lines):
      records = []
      for line in lines:
          line = line.strip()
          if not line:
              continue
          plan, span = line.split(":")
          start, end = span.split("-")
          records.append((plan, normalize((int(start), int(end)))))
      return records


  def load_plans(path):
      with open(path, "r", encoding="ascii") as handle:
          return parse_lines(handle.readlines())
  READER

