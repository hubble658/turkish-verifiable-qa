      def __init__(self):
          self._items = []

      def push(self, start, name):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError


  def make_queue():
      raise NotImplementedError
  PY

goal_tr: >
  planner/queue.py icindeki EventQueue sinifini ve make_queue fabrika
  fonksiyonunu, stdin'den satir satir okunan "SS:DD isim" bicimindeki
  etkinlikleri baslangic saatine gore artan sirada cikaracak bir oncelik
  kuyrugu olacak sekilde gerceklestir; esit saatlerde once okunan once
  cikmali, pop en erken etkinligin adini dondurmeli, peek kuyrugu bozmadan
  en erken adi dondurmeli ve len eleman sayisini vermeli.

reference_solution: |
  cat > planner/queue.py <<'PY'
  from planner.core.clock import minutes


  class EventQueue:
      def __init__(self):
          self._items = []
          self._seq = 0

      def push(self, start, name):
          item = (minutes(start), self._seq, name)
          self._seq += 1
          self._items.append(item)
          self._items.sort(key=lambda t: (t[0], t[1]))

      def pop(self):
          if not self._items:
              raise IndexError("empty queue")
          return self._items.pop(0)[2]

      def peek(self):
          if not self._items:
              raise IndexError("empty queue")
          return self._items[0][2]

      def __len__(self):
          return len(self._items)


  def make_queue():
      return EventQueue()
  PY

