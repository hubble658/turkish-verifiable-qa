# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) planner/queue.py dosyasındaki EventQueue sınıfını, "SS:DD isim" biçimindeki etkinlikleri başlangıç saatine göre artan sırada çıkaracak bir öncelik kuyruğu olacak şekilde gerçekleştir.

  2) Aynı anda okunan etkinlikler arasında önce okunan önce çıksın.

  3) push yöntemi kuyruğa yeni bir etkinlik eklesin.

  4) pop yöntemi en erken etkinliğin adını döndürsün ve onu kuyruktan çıkarsın.

  5) peek yöntemi kuyruğu bozmadan en erken etkinliğin adını döndürsün.

  6) len işlemi kuyruktaki eleman sayısını versin.

  7) planner/queue.py dosyasındaki make_queue fabrika fonksiyonunu, bu kuyruğu oluşturacak ve stdin'den satır satır okunan etkinlikleri kuyruğa ekleyecek şekilde gerçekleştir.

setup: |
  mkdir -p planner/core
  cat > planner/core/__init__.py <<'PY'
  PY
  cat > planner/__init__.py <<'PY'
  PY
  cat > planner/core/clock.py <<'PY'
