id: gen-k-9506-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 24

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  slots.txt'teki araliklardan coverage üretiliyor ama bir aralık kayboluyor ve örtüşen/bitişik aralıklar birleşmiyor. orders/schedule.py, orders/parse.py ve orders/windows.py'yi düzelt; coverage tam ve doğru birleşmiş listeyi döndürsün.

setup: |
  mkdir -p orders
  touch orders/__init__.py
  cat > orders/parse.py <<'PARSE'
  def load_slots(path):
      slots = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              a, b = line.split(",")
              slots.append((int(a), int(b) - 1))
      return slots
  PARSE
  cat > orders/windows.py <<'WINDOWS'
  def normalize(rows):
      out = []
      for start, end in rows:
          if start > end:
              start, end = end, start
          out.append((start, end))
      out.sort()
      return out


  def merge(rows):
      result = []
      for start, end in normalize(rows):
          if result and start <= result[-1][1]:
              prev_start, prev_end = result[-1]
              result[-1] = (prev_start, end)
          else:
              result.append((start, end))
      return result
  WINDOWS
  cat > orders/schedule.py <<'SCHEDULE'
  from orders.parse import load_slots
  from orders.windows import merge


  def coverage(path):
      merged = merge(load_slots(path))
      return merged[:-1]
  SCHEDULE
  cat > slots.txt <<'SLOTS'
  5,10
  1,3
  12,15
  11,11
  20,25
  SLOTS

goal_tr: >
  slots.txt dosyasindaki zaman araliklarindan uretilen coverage sonucu
  araliklardan birini kaybediyor ve ortusen ya da bitisik araliklari tek
  aralik haline getirmiyor; coverage tam ve dogru birlestirilmis aralik
  listesini dondursun.

reference_solution: |
  cat > orders/parse.py <<'PARSE'
  def load_slots(path):
      slots = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              a, b = line.split(",")
              slots.append((int(a), int(b)))
      return slots
  PARSE
  cat > orders/windows.py <<'WINDOWS'
  def normalize(rows):
      out = []
      for start, end in rows:
          if start > end:
              start, end = end, start
          out.append((start, end))
      out.sort()
      return out


  def merge(rows):
      result = []
      for start, end in normalize(rows):
          if result and start <= result[-1][1] + 1:
              prev_start, prev_end = result[-1]
              result[-1] = (prev_start, max(prev_end, end))
          else:
              result.append((start, end))
      return result
  WINDOWS
  cat > orders/schedule.py <<'SCHEDULE'
  from orders.parse import load_slots
  from orders.windows import merge


  def coverage(path):
      return merge(load_slots(path))
  SCHEDULE

ara_adim: |
  cat > orders/parse.py <<'PARSE'
  def load_slots(path):
      slots = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              a, b = line.split(",")
              slots.append((int(a), int(b)))
      return slots
  PARSE

