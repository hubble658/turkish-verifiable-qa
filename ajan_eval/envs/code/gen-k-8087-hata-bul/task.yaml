workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  weblog/parse.py'deki parse_line'ın döndürdüğü kayıtları nitelik erişimli hale getir; weblog/report.py'deki summarize'ı bir dekoratör ile alan erişimini denetleyerek bu kayıtları okuyacak biçimde düzelt, özet doğru üretilsin.

setup: |
  mkdir -p weblog
  cat > weblog/parse.py <<'PARSE'
  import re

  LINE_RE = re.compile(r'^(\S+) - - \[(.+?)\] "(\w+) (\S+) \S+" (\d{3}) (\d+)$')


  def parse_line(line):
      m = LINE_RE.match(line.strip())
      if not m:
          return None
      host, ts, method, path, status, size = m.groups()
      return {
          "host": host,
          "ts": ts,
          "method": method,
          "path": path,
          "status": int(status),
          "size": int(size),
      }
  PARSE
  cat > weblog/aggregate.py <<'AGG'
  from weblog.parse import parse_line


  def load_log(text):
      return [r for r in (parse_line(l) for l in text.splitlines()) if r]


  def count_by(records, field):
      counts = {}
      for r in records:
          key = r[field]
          counts[key] = counts.get(key, 0) + 1
      return counts
  AGG
  cat > weblog/report.py <<'REPORT'
  from weblog.aggregate import load_log, count_by


  def summarize(text):
      records = load_log(text)
      by_status = count_by(records, "status")
      by_method = count_by(records, "method")
      total_bytes = sum(r["size"] for r in records)
      return {
          "total": len(records),
          "bytes": total_bytes,
          "status": by_status,
          "method": by_method,
      }
  REPORT
  cat > access.log <<'LOG'
  10.0.0.1 - - [01/Jan/2024:10:00:00 +0000] "GET /a 1.1" 200 100
  10.0.0.2 - - [01/Jan/2024:10:00:01 +0000] "POST /b 1.1" 404 50
  10.0.0.1 - - [01/Jan/2024:10:00:02 +0000] "GET /c 1.1" 200 25
  10.0.0.3 - - [01/Jan/2024:10:00:03 +0000] "GET /a 1.1" 500 75
  LOG

goal_tr: >
  weblog/parse.py icindeki parse_line'in dondurdugu kayitlari nitelik
  erisimli (attribute) hale getir ve weblog/report.py'deki summarize'i bu
  kayitlari, bir dekorator ile alan erisimini denetleyerek okuyacak bicimde
  duzelt; boylece ozet dogru uretilsin

reference_solution: |
  cat > weblog/parse.py <<'PARSE'
  import re


  class LogRecord:
      def __init__(self, host, ts, method, path, status, size):
          self.host = host
          self.ts = ts
          self.method = method
          self.path = path
          self.status = status
          self.size = size


  LINE_RE = re.compile(r'^(\S+) - - \[(.+?)\] "(\w+) (\S+) \S+" (\d{3}) (\d+)$')


  def parse_line(line):
      m = LINE_RE.match(line.strip())
      if not m:
          return None
      host, ts, method, path, status, size = m.groups()
      return LogRecord(host, ts, method, path, int(status), int(size))
  PARSE
  cat > weblog/aggregate.py <<'AGG'
  from weblog.parse import parse_line


  def load_log(text):
      return [r for r in (parse_line(l) for l in text.splitlines()) if r]


  def count_by(records, field):
      counts = {}
      for r in records:
          key = getattr(r, field)
          counts[key] = counts.get(key, 0) + 1
      return counts
  AGG
  cat > weblog/report.py <<'REPORT'
  from weblog.aggregate import load_log, count_by


  def requires_fields(*fields):
      def decorator(fn):
          def wrapper(text):
              records = load_log(text)
              for r in records:
                  for f in fields:
                      if not hasattr(r, f):
                          raise AttributeError(f)
              return fn(records)
          return wrapper
      return decorator


  @requires_fields("size", "status", "method")
  def summarize(records):
      by_status = count_by(records, "status")
      by_method = count_by(records, "method")
      total_bytes = sum(r.size for r in records)
      return {
          "total": len(records),
          "bytes": total_bytes,
          "status": by_status,
          "method": by_method,
      }
  REPORT

