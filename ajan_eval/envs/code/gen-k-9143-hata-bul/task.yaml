# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  release/rollup.py içindeki VersionRollup sınıfını, sürüm parçalarını doğru sırayla birleştirip en büyük sürümü latest() ile döndürecek şekilde düzelt. release/stream.py içindeki parse_chunk'ı da fazla boşlukları temizleyip eksik bileşenleri sıfırla tamamlayacak hale getir.

setup: |
  mkdir -p release
  cat > release/stream.py <<'STREAM'
  from abc import ABC, abstractmethod


  class VersionSource(ABC):
      @abstractmethod
      def chunks(self):
          """Yield raw version strings in arrival order."""
          ...


  class ListSource(VersionSource):
      def __init__(self, items):
          self._items = list(items)

      def chunks(self):
          for item in self._items:
              yield item


  def parse_chunk(chunk):
      parts = chunk.strip().split(".")
      return tuple(int(p) for p in parts)
  STREAM
  cat > release/rollup.py <<'ROLLUP'
  from release.stream import parse_chunk


  class VersionRollup:
      def __init__(self, source):
          self._source = source
          self._latest = None

      def consume(self):
          total = 0
          for chunk in self._source.chunks():
              ver = parse_chunk(chunk)
              total = total + sum(ver)
              if self._latest is None:
                  self._latest = ver
          return total

      def latest(self):
          return self._latest
  ROLLUP

goal_tr: >
  release/rollup.py icindeki VersionRollup sinifini, akan surum parcalarini
  dogru sirada birlestirip en buyuk surumu latest() ile dondurecek bicimde
  duzelt; ayrica release/stream.py icindeki parse_chunk, parca icindeki
  fazla bosluklari temizleyip eksik bilesenleri sifirla tamamlayacak bicimde
  duzeltilsin.

reference_solution: |
  cat > release/stream.py <<'STREAM'
  from abc import ABC, abstractmethod


  class VersionSource(ABC):
      @abstractmethod
      def chunks(self):
          """Yield raw version strings in arrival order."""
          ...


  class ListSource(VersionSource):
      def __init__(self, items):
          self._items = list(items)

      def chunks(self):
          for item in self._items:
              yield item


  def parse_chunk(chunk):
      parts = [p.strip() for p in chunk.strip().split(".")]
      if len(parts) < 3:
          parts = parts + ["0"] * (3 - len(parts))
      return tuple(int(p) for p in parts)
  STREAM
  cat > release/rollup.py <<'ROLLUP'
  from release.stream import parse_chunk


  class VersionRollup:
      def __init__(self, source):
          self._source = source
          self._latest = None

      def consume(self):
          total = 0
          for chunk in self._source.chunks():
              ver = parse_chunk(chunk)
              total = total + sum(ver)
              if self._latest is None or ver > self._latest:
                  self._latest = ver
          return total

      def latest(self):
          return self._latest
  ROLLUP

