id: gen-k-0101-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16
prompt: 'stack_orders.py dosyasındaki OrderStack sınıfının reverse_orders, top_n ve remove_order metodlarını gerçekleştir.
  reverse_orders yığını ters çevirsin, top_n yığındaki en üst n elemanı döndürsün (n yığın boyutundan büyükse tümünü), remove_order
  ise belirtilen sipariş numarasını yığından silsin (yoksa hata fırlatmasın).


  top_n elemanları en üstteki başta olacak şekilde döndürsün.

  '
setup: "cat > stack_orders.py <<'PY'\nclass OrderStack:\n    def __init__(self):\n        self._items = []\n\n    def push(self,\
  \ order_id):\n        self._items.append(order_id)\n\n    def pop(self):\n        if self.is_empty():\n            raise\
  \ IndexError(\"pop from empty stack\")\n        return self._items.pop()\n\n    def peek(self):\n        if self.is_empty():\n\
  \            raise IndexError(\"peek from empty stack\")\n        return self._items[-1]\n\n    def is_empty(self):\n  \
  \      return len(self._items) == 0\n\n    def size(self):\n        return len(self._items)\n\n    def clear(self):\n  \
  \      self._items = []\n\n    def reverse_orders(self):\n        raise NotImplementedError\n\n    def top_n(self, n):\n\
  \        raise NotImplementedError\n\n    def remove_order(self, order_id):\n        raise NotImplementedError\nPY\n"
goal_tr: 'stack_orders.py icindeki OrderStack sinifinin reverse_orders, top_n ve remove_order metodlarini gerceklestir: reverse_orders
  yigini ters cevirir, top_n yigindaki en ust n elemani (n yigin boyutundan buyukse tumunu) dondurur, remove_order belirtilen
  siparis numarasini yigindan siler (yoksa hata firlatmaz)

  '
reference_solution: "cat > stack_orders.py <<'PY'\nclass OrderStack:\n    def __init__(self):\n        self._items = []\n\n\
  \    def push(self, order_id):\n        self._items.append(order_id)\n\n    def pop(self):\n        if self.is_empty():\n\
  \            raise IndexError(\"pop from empty stack\")\n        return self._items.pop()\n\n    def peek(self):\n     \
  \   if self.is_empty():\n            raise IndexError(\"peek from empty stack\")\n        return self._items[-1]\n\n   \
  \ def is_empty(self):\n        return len(self._items) == 0\n\n    def size(self):\n        return len(self._items)\n\n\
  \    def clear(self):\n        self._items = []\n\n    def reverse_orders(self):\n        self._items.reverse()\n\n    def\
  \ top_n(self, n):\n        return self._items[-n:][::-1] if n > 0 else []\n\n    def remove_order(self, order_id):\n   \
  \     if order_id in self._items:\n            self._items.remove(order_id)\nPY\n"
