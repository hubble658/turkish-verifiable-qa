# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  weblog/store/stack.py dosyasındaki LogStack sınıfını ve make_stack fabrikasını, son giren ilk çıkar mantığıyla çalışacak biçimde tamamla. Yığın; eleman ekleme, eleman çıkarma, en üstteki elemana bakma, boyut bildirme, boş olup olmadığını söyleme ve tüm elemanları boşaltma davranışlarını eksiksiz yerine getirmeli; make_stack ise kullanıma hazır bir LogStack örneği döndürmeli. Bu sayede weblog/report/summary.py içindeki summarize fonksiyonu doğru toplamı ve yolları ters sırada döndürebilsin.

setup: |
  mkdir -p weblog/store weblog/parse weblog/report
  cat > weblog/store/stack.py <<'STACK'
  class LogStack:
      def __init__(self):
          self._items = []

      def push(self, item):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def size(self):
          raise NotImplementedError

      def is_empty(self):
          raise NotImplementedError

      def drain(self):
          raise NotImplementedError


  def make_stack():
      raise NotImplementedError
  STACK
  cat > weblog/parse/reader.py <<'READER'
  from weblog.store.stack import make_stack


  def parse_lines(lines):
      stack = make_stack()
      for line in lines:
          line = line.strip()
          if not line:
              continue
          path, status = line.rsplit(" ", 1)
          stack.push((path, int(status)))
      return stack
  READER
  cat > weblog/report/summary.py <<'SUMMARY'
  from weblog.parse.reader import parse_lines


  def summarize(text):
      stack = parse_lines(text.splitlines())
      total = stack.size()
      paths = []
      while not stack.is_empty():
          paths.append(stack.pop()[0])
      return total, paths
  SUMMARY
  cat > logs.txt <<'LOGS'
  /index 200
  /about 404
  /index 500
  /contact 200
  LOGS

goal_tr: >
  weblog/store/stack.py icindeki LogStack sinifini ve make_stack
  fabrikasini, yigin son giren ilk cikar mantigiyla calisacak sekilde
  tamamla; boylece weblog/report/summary.py icindeki summarize dogru toplam
  ve ters sirada yollari dondursun.

reference_solution: |
  cat > weblog/store/stack.py <<'STACK'
  class LogStack:
      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          if not self._items:
              raise IndexError("pop from empty stack")
          return self._items.pop()

      def peek(self):
          if not self._items:
              raise IndexError("peek from empty stack")
          return self._items[-1]

      def size(self):
          return len(self._items)

      def is_empty(self):
          return len(self._items) == 0

      def drain(self):
          out = []
          while self._items:
              out.append(self._items.pop())
          return out


  def make_stack():
      return LogStack()
  STACK

