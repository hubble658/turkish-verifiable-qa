goal_tr: >
  nav/route.py icindeki Route ve Router siniflarini, verilen grafta
  start'tan goal'a en dusuk maliyetli yolu bulan ve Route.render ile
  "a->b->c (12)" biciminde metin ureten sekilde gerceklestir; yol yoksa
  shortest None dondursun.

reference_solution: |
  cat > nav/route.py <<'PY'
  from dataclasses import dataclass


  @dataclass
  class Route:
      path: list
      total: int

      def __post_init__(self):
          if not self.path:
              raise ValueError("empty path")
          if self.total < 0:
              raise ValueError("negative total")

      def render(self):
          return "{} ({})".format("->".join(self.path), self.total)


  class Router:
      def __init__(self, graph):
          self.graph = graph

      def shortest(self, start, goal):
          if start == goal:
              return Route([start], 0)
          best = {start: 0}
          prev = {}
          pending = [start]
          done = set()
          while pending:
              pending.sort(key=lambda n: (best[n], n))
              node = pending.pop(0)
              if node in done:
                  continue
              done.add(node)
              for nxt, cost in self.graph.neighbors(node):
                  cand = best[node] + cost
                  if nxt not in best or cand < best[nxt]:
                      best[nxt] = cand
                      prev[nxt] = node
                      if nxt not in done:
                          pending.append(nxt)
          if goal not in best:
              return None
          path = [goal]
          while path[-1] != start:
              path.append(prev[path[-1]])
          path.reverse()
          return Route(path, best[goal])
  PY

