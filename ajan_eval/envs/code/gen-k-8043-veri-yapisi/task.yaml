  nav/route.py içindeki Route ve Router sınıflarını gerçekleştir; Router.shortest verilen grafta start'tan goal'a en düşük maliyetli yolu bulsun, yol yoksa None döndürsün, Route.render ise "a->b->c (12)" biçiminde metin üretsin.

setup: |
  mkdir -p nav
  cat > nav/edges.py <<'PY'
  from dataclasses import dataclass, field


  @dataclass(frozen=True)
  class Edge:
      src: str
      dst: str
      cost: int


  @dataclass
  class Graph:
      edges: list = field(default_factory=list)

      def add(self, src, dst, cost):
          self.edges.append(Edge(src, dst, cost))
          return self

      def neighbors(self, node):
          return [(e.dst, e.cost) for e in self.edges if e.src == node]

      def nodes(self):
          seen = []
          for e in self.edges:
              for n in (e.src, e.dst):
                  if n not in seen:
                      seen.append(n)
          return seen
  PY
  cat > nav/parser.py <<'PY'
  from nav.edges import Graph


  def parse(text):
      g = Graph()
      for line in text.strip().splitlines():
          if not line.strip():
              continue
          src, dst, cost = line.split()
          g.add(src, dst, int(cost))
      return g
  PY
