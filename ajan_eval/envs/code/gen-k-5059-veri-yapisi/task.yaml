goal_tr: >
  stock/cache.py icindeki LRUCache sinifini ve stock/ledger.py icindeki
  StockLedger sinifini, parcali akista her sku icin en son stok seviyesini
  tutacak ve en son kullanilan sku onbellegi kapasiteyi asinca en eski
  kullanilani atacak bicimde tamamla.

reference_solution: |
  cat > stock/cache.py <<'CACHE'
  class LRUCache:
      def __init__(self, capacity):
          self.capacity = capacity
          self.store = {}
          self.order = []

      def _touch(self, key):
          if key in self.order:
              self.order.remove(key)
          self.order.append(key)

      def get(self, key):
          if key not in self.store:
              return None
          self._touch(key)
          return self.store[key]

      def put(self, key, value):
          self.store[key] = value
          self._touch(key)
          while len(self.order) > self.capacity:
              old = self.order.pop(0)
              del self.store[old]

      def __len__(self):
          return len(self.store)
  CACHE
  cat > stock/ledger.py <<'LEDGER'
  from stock.events import parse_events
  from stock.cache import LRUCache


  class StockLedger:
      def __init__(self, cache_capacity):
          self.cache = LRUCache(cache_capacity)
          self.levels = {}

      def apply_chunk(self, text):
          for kind, sku, qty in parse_events(text):
              current = self.levels.get(sku, 0)
              if kind == 'in':
                  self.levels[sku] = current + qty
              else:
                  self.levels[sku] = current - qty
              self.cache.put(sku, self.levels[sku])
          return self

      def level(self, sku):
          cached = self.cache.get(sku)
          if cached is not None:
              return cached
          return self.levels.get(sku, 0)
  LEDGER

