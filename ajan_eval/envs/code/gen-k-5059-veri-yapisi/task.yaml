prompt: |
  stock/cache.py içindeki LRUCache sınıfını ve stock/ledger.py içindeki StockLedger sınıfını tamamla. LRUCache, en son kullanılan önbellek mantığıyla çalışsın: kapasiteyi aşınca en eski kullanılan anahtarı atsın; get, put ve len düzgün çalışsın. StockLedger ise stock/events.py içindeki parse_events ile parçalı akış metinlerini işlesin, her sku için en son stok seviyesini tutsun ve içinde bir LRUCache kullansın. apply_chunk verilen metni işleyip sonucu güncellesin, level ise bir skunun en son stok seviyesini döndürsün.

setup: |
  mkdir -p stock
  cat > stock/events.py <<'EVENTS'
  def parse_events(text):
      events = []
      for line in text.strip().splitlines():
          if not line:
              continue
          kind, sku, qty = line.split(';')
          events.append((kind, sku, int(qty)))
      return events
  EVENTS
  cat > stock/cache.py <<'CACHE'
  class LRUCache:
      def __init__(self, capacity):
          raise NotImplementedError

      def get(self, key):
          raise NotImplementedError

      def put(self, key, value):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError
  CACHE
  cat > stock/ledger.py <<'LEDGER'
  from stock.events import parse_events
  from stock.cache import LRUCache


  class StockLedger:
      def __init__(self, cache_capacity):
          raise NotImplementedError

      def apply_chunk(self, text):
          raise NotImplementedError

      def level(self, sku):
          raise NotImplementedError
  LEDGER
  cat > chunk1.txt <<'C1'
  in;bolt;5
  out;bolt;2
  in;nut;10
  C1
  cat > chunk2.txt <<'C2'
  out;bolt;1
  in;bolt;4
  out;nut;3
