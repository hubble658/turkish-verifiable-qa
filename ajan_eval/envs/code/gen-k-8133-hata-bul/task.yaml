workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  restaurant/service.py içindeki Service.top_table metodu şu an en yüksek toplam tutara sahip masayı doğru şekilde döndürmüyor; bu metodu, toplamı en yüksek olan masayı doğru biçimde döndürecek şekilde düzelt. Düzeltmeyi yalnızca restaurant/service.py dosyası üzerinde yap; restaurant/storage.py, restaurant/totals.py ve restaurant/receipt.py dosyalarına dokunma.

setup: |
  mkdir -p restaurant
  cat > restaurant/storage.py <<'STORAGE'
  class OrderStore:
      def __init__(self):
          self._orders = []

      def add(self, table, item, qty, unit_price):
          self._orders.append({"table": table, "item": item, "qty": qty, "unit_price": unit_price})

      def all_orders(self):
          return list(self._orders)
  STORAGE
  cat > restaurant/totals.py <<'TOTALS'
  from restaurant.storage import OrderStore


  class TotalCalculator:
      def __init__(self, store):
          self.store = store

      def per_table(self):
          result = {}
          for order in self.store.all_orders():
              table = order["table"]
              amount = order["qty"] * order["unit_price"]
              if table in result:
                  result[table] += amount
              else:
                  result[table] = amount
          return result
  TOTALS
  cat > restaurant/receipt.py <<'RECEIPT'
  from restaurant.storage import OrderStore
  from restaurant.totals import TotalCalculator


  class Receipt:
      def __init__(self, store):
          self.store = store
          self.calc = TotalCalculator(store)

      def table_lines(self):
          totals = self.calc.per_table()
          lines = []
          for table in sorted(totals):
              lines.append((table, totals[table]))
          return lines

      def grand_total(self):
          totals = self.calc.per_table()
          return sum(totals.values())
  RECEIPT
  cat > restaurant/service.py <<'SERVICE'
  from restaurant.storage import OrderStore
  from restaurant.receipt import Receipt


  class Service:
      def __init__(self):
          self.store = OrderStore()

      def order(self, table, item, qty, unit_price):
          self.store.add(table, item, qty, unit_price)

      def summary(self):
          receipt = Receipt(self.store)
          return receipt.table_lines(), receipt.grand_total()

      def top_table(self):
          receipt = Receipt(self.store)
          lines = receipt.table_lines()
          best = None
          best_total = 0
          for table, total in lines:
              if total > best_total:
                  best_total = total
                  best = table
          return best
  SERVICE

goal_tr: >
  restaurant/service.py icindeki Service.top_table metodunu, en yuksek
  toplamli masayi dogru dondurecek bicimde duzelt.

reference_solution: |
  cat > restaurant/service.py <<'SERVICE'
  from restaurant.storage import OrderStore
  from restaurant.receipt import Receipt


  class Service:
      def __init__(self):
          self.store = OrderStore()

      def order(self, table, item, qty, unit_price):
          self.store.add(table, item, qty, unit_price)

      def summary(self):
          receipt = Receipt(self.store)
          return receipt.table_lines(), receipt.grand_total()

      def top_table(self):
          receipt = Receipt(self.store)
          lines = receipt.table_lines()
          best = None
          best_total = None
          for table, total in lines:
              if best_total is None or total > best_total:
                  best_total = total
                  best = table
          return best
  SERVICE

