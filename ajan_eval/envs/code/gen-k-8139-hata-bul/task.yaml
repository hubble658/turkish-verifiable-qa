split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  docs/summary.py içindeki summarize fonksiyonunu, geçerli kayıtlarda yazar adına göre sayım döndürecek ve eksik alanlı ya da biçimi bozuk satırlarda uygun DocError alt sınıfını fırlatacak biçimde düzelt.

setup: |
  mkdir -p docs
  cat > docs/loader.py <<'LOADER'
  def load_lines(path):
      with open(path, "r", encoding="utf-8") as fh:
          return [ln.rstrip("\n") for ln in fh if ln.strip()]


  def index_documents(paths):
      index = {}
      for path in paths:
          for line in load_lines(path):
              key = line.strip().lower()
              index[key] = index.get(key, 0) + 1
      return index
  LOADER
  cat > docs/errors.py <<'ERRORS'
  class DocError(Exception):
      pass


  class MissingFieldError(DocError):
      def __init__(self, field):
          super().__init__("missing field: " + field)
          self.field = field


  class BadFormatError(DocError):
      def __init__(self, line):
          super().__init__("bad format: " + line)
          self.line = line
  ERRORS
  cat > docs/summary.py <<'SUMMARY'
  from docs.errors import BadFormatError, MissingFieldError
  from docs.loader import load_lines


  def parse_record(line):
      parts = line.split("::")
      if len(parts) != 3:
          raise BadFormatError(line)
      return {"title": parts[0].strip(), "author": parts[1].strip(), "year": parts[2].strip()}


  def summarize(path):
      counts = {}
      for line in load_lines(path):
          record = parse_record(line)
          key = record["writer"]
          counts[key] = counts.get(key, 0) + 1
      return counts
  SUMMARY
  cat > data.txt <<'DATA'
  Notes::Ada::1843
  Notes::Ada::1843
  Sketches::Grace::1952
  DATA

goal_tr: >
  docs/summary.py icindeki summarize fonksiyonunu, gecerli kayitlarda yazar
  adina gore sayim dondurecek ve eksik alanli ya da bicimi bozuk satirlarda
  uygun DocError alt sinifini firlatacak bicimde duzelt.

reference_solution: |
  cat > docs/summary.py <<'SUMMARY'
  from docs.errors import BadFormatError, MissingFieldError
  from docs.loader import load_lines


  def parse_record(line):
      parts = line.split("::")
      if len(parts) != 3:
          raise BadFormatError(line)
      record = {"title": parts[0].strip(), "author": parts[1].strip(), "year": parts[2].strip()}
      if not record["author"]:
          raise MissingFieldError("author")
      return record


  def summarize(path):
      counts = {}
      for line in load_lines(path):
          record = parse_record(line)
          key = record["author"]
          counts[key] = counts.get(key, 0) + 1
      return counts
  SUMMARY

