  class Record:
      __slots__ = ("agent", "duration")

      def __init__(self, agent, duration):
          self.agent = agent
          self.duration = duration

      def __repr__(self):
          return "Record(%r, %r)" % (self.agent, self.duration)


  def load_records(path):
      out = []
      with open(path, "r", encoding="ascii") as fh:
          for line in fh:
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              agent, duration = line.split(",")
              out.append(Record(agent.strip(), int(duration)))
      return out
  RECORDS
