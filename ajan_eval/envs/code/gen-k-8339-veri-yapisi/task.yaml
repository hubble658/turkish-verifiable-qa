reference_solution: |
  cat > callcenter/cache.py <<'CACHE'
  class LRUCache:
      def __init__(self, capacity):
          if capacity <= 0:
              raise ValueError("capacity must be positive")
          self.capacity = capacity
          self._store = {}
          self._order = []

      def _touch(self, key):
          self._order.remove(key)
          self._order.append(key)

      def get(self, key):
          if key not in self._store:
              return None
          self._touch(key)
          return self._store[key]

      def put(self, key, value):
          if key in self._store:
              self._store[key] = value
              self._touch(key)
              return
          self._store[key] = value
          self._order.append(key)
          if len(self._order) > self.capacity:
              oldest = self._order.pop(0)
              del self._store[oldest]

      def __len__(self):
          return len(self._store)

      def __contains__(self, key):
          return key in self._store

      def __iter__(self):
          return iter(list(self._order))
  CACHE
  cat > callcenter/stats.py <<'STATS'
  from callcenter.cache import LRUCache


  class AgentStats:
      def __init__(self, capacity):
          self._cache = LRUCache(capacity)
          self._totals = {}

      def total_for(self, agent, records):
          cached = self._cache.get(agent)
          if cached is not None:
              return cached
          total = 0
          for rec in records:
              if rec.agent == agent:
                  total += rec.duration
          self._cache.put(agent, total)
          return total

      def leaderboard(self, records):
          agents = []
          seen = set()
          for rec in records:
              if rec.agent not in seen:
                  seen.add(rec.agent)
                  agents.append(rec.agent)
          rows = [(name, self.total_for(name, records)) for name in agents]
          rows.sort(key=lambda row: (-row[1], row[0]))
          return rows
  STATS
  cat > callcenter/report.py <<'REPORT'
  from callcenter.records import load_records
  from callcenter.stats import AgentStats


  class Report:
      def __init__(self, path, capacity):
          self.path = path
          self.capacity = capacity
          self.stats = AgentStats(capacity)

      def load(self):
          return load_records(self.path)

      def leaderboard(self):
          return self.stats.leaderboard(self.load())

      def total(self, agent):
          return self.stats.total_for(agent, self.load())
  REPORT

