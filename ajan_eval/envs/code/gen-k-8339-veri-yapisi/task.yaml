  callcenter/cache.py icindeki LRUCache sinifini (kapasite sinirli, en son
  kullanilan sonda olacak sekilde get/put/__len__/__contains__/__iter__),
  callcenter/stats.py icindeki AgentStats.total_for ve leaderboard'u ve
