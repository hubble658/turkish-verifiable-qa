# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  callcenter/queue.py dosyasındaki order_by_priority fonksiyonu şu an sadece öncelik değerine göre büyükten küçüğe sıralama yapıyor; eşit öncelikli çağrılar arasında bir sıra garantisi yok. Bu fonksiyonu, öncelik değeri büyük olan çağrı önce gelecek ve aynı öncelik değerine sahip çağrılarda başlangıç zamanı küçük olan önce gelecek şekilde kararlı bir sıralama yapacak biçimde düzelt. Sıralama kararlı olmalı; yani eşit öncelik ve eşit başlangıç zamanına sahip kayıtlar girdideki göreli sıralarını korumalı. queue.py içindeki load_calls fonksiyonu ve core modülleri olduğu gibi kalmalı, yalnızca order_by_priority fonksiyonunun davranışı değişmeli.

setup: |
  mkdir -p callcenter/core
  cat > callcenter/core/errors.py <<'ERR'
  class CallCenterError(Exception):
      pass


  class BadRecordError(CallCenterError):
      pass
  ERR
  cat > callcenter/core/parser.py <<'PAR'
  from callcenter.core.errors import BadRecordError


  def parse_line(line):
      parts = line.split('|')
      if len(parts) != 4:
          raise BadRecordError('expected 4 fields')
      agent, start, duration, priority = parts
      try:
          return (agent, int(start), int(duration), int(priority))
      except ValueError:
          raise BadRecordError('bad number')
  PAR
  cat > callcenter/queue.py <<'QUE'
  from callcenter.core.parser import parse_line


  def load_calls(path):
      calls = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if line:
                  calls.append(parse_line(line))
      return calls


  def order_by_priority(calls):
      ordered = sorted(calls, key=lambda c: c[3], reverse=True)
      return ordered
  QUE
  cat > calls.txt <<'TXT'
  ayse|100|30|2
  bora|200|10|5
  cem|150|20|2
  deniz|300|15|5
  TXT

goal_tr: >
  callcenter/queue.py icindeki order_by_priority fonksiyonunu, oncelik
  degeri buyuk olan once gelecek ve esit oncelikli cagrilarda baslangic
  zamani kucuk olan once gelecek bicimde kararli bir siralama yapacak
  sekilde duzelt.

reference_solution: |
  cat > callcenter/queue.py <<'QUE'
  from callcenter.core.parser import parse_line


  def load_calls(path):
      calls = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if line:
                  calls.append(parse_line(line))
      return calls


  def order_by_priority(calls):
      ordered = sorted(calls, key=lambda c: (-c[3], c[1]))
      return ordered
  QUE

