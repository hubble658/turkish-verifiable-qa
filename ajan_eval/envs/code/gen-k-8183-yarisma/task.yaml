prompt: |
  orders.py dosyasındaki OrderBook sınıfına shared_cuisines metodunu ekle. Metot, her tablo için o tablonun mutfak kümesini ve tüm tabloların ortak mutfak kesişimini hesaplayıp {table_id: set} biçiminde döndürsün. Hiçbir tabloda ortak mutfak yoksa her tablo için boş küme döndürsün; hiç sipariş yoksa boş sözlük döndürsün.

  Şu şartlar sağlanmalı:
  - orders.py içindeki OrderBook sınıfında shared_cuisines metodu tanımlı olmalı ve NotImplementedError fırlatmamalı.
  - Metot, her tablo için o tablonun mutfak kümesini ve tüm tabloların ortak mutfak kesişimini hesaplamalı.
  - Dönüş değeri {table_id: set} biçiminde olmalı.
  - Hiçbir tabloda ortak mutfak yoksa her tablo için boş küme döndürmeli.
  - Hiç sipariş yoksa boş sözlük döndürmeli.

setup: |
  cat > orders.py <<'ORDERS'
  class OrderBook:
      """Stateful order book. Orders are stored as nested dicts:
      {table_id: {dish: qty}}. Every dish maps to a cuisine."""

      def __init__(self, cuisines):
          # cuisines: {dish: cuisine}
          self.cuisines = dict(cuisines)
          self.orders = {}

      def add(self, table_id, dish, qty):
          table = self.orders.setdefault(table_id, {})
          table[dish] = table.get(dish, 0) + qty

      def tables(self):
          return set(self.orders)

      def dishes(self, table_id):
          return set(self.orders.get(table_id, {}))

      def cuisine_set(self, table_id):
          return set(self.cuisines[d] for d in self.dishes(table_id))

      def shared_cuisines(self):
          raise NotImplementedError
  ORDERS
  cat > menu.py <<'MENU'
  CUISINES = {
      "ramen": "japanese",
      "sushi": "japanese",
      "pizza": "italian",
      "pasta": "italian",
      "taco": "mexican",
      "burrito": "mexican",
      "curry": "indian",
      "naan": "indian",
  }
  MENU

goal_tr: >
  orders.py icindeki OrderBook sinifinda shared_cuisines metodunu
  gerceklestir; her tablo icin o tablonun mutfak kumesini ve tum tablolarin
  ortak mutfak kesisimini hesaplayip {table_id: set} biciminde dondursun,
  hicbir tabloda ortak mutfak yoksa her tablo icin bos kume dondursun ve hic
  siparis yoksa bos sozluk dondursun.

reference_solution: |
  cat > orders.py <<'ORDERS'
  class OrderBook:
      """Stateful order book. Orders are stored as nested dicts:
      {table_id: {dish: qty}}. Every dish maps to a cuisine."""

      def __init__(self, cuisines):
          # cuisines: {dish: cuisine}
          self.cuisines = dict(cuisines)
          self.orders = {}

      def add(self, table_id, dish, qty):
          table = self.orders.setdefault(table_id, {})
          table[dish] = table.get(dish, 0) + qty

      def tables(self):
          return set(self.orders)

      def dishes(self, table_id):
          return set(self.orders.get(table_id, {}))

      def cuisine_set(self, table_id):
          return set(self.cuisines[d] for d in self.dishes(table_id))

      def shared_cuisines(self):
          if not self.orders:
              return {}
          common = None
          for table_id in self.orders:
              cs = self.cuisine_set(table_id)
              if common is None:
                  common = set(cs)
              else:
                  common = common & cs
          return {table_id: set(common) for table_id in self.orders}
  ORDERS

