# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  bank/statement.py dosyasındaki Statement sınıfı şu an labels ve amounts listelerindeki son elemanı atlıyor; bu yüzden accounts.txt içindeki bir satır hareket olarak sayılmıyor. Statement sınıfını, labels ve amounts listelerinin tüm elemanlarından birer Entry oluşturacak biçimde düzelt; böylece accounts.txt dosyasındaki her satır hareket olarak hesaba katılsın. Sınıfın mevcut davranışı ve diğer dosyalar (bank/records.py ve bank/audit.py) olduğu gibi kalsın, yalnızca bank/statement.py içindeki Statement sınıfı bu isteği karşılayacak şekilde güncellensin.

setup: |
  mkdir -p bank
  cat > bank/records.py <<'RECORDS'
  from abc import ABC, abstractmethod


  class Ledger(ABC):
      def __init__(self, entries):
          self._entries = entries

      @abstractmethod
      def entries(self):
          raise NotImplementedError

      def balance(self):
          total = 0.0
          for e in self.entries():
              total += e.amount
          return total
  RECORDS
  cat > bank/audit.py <<'AUDIT'
  from bank.records import Ledger


  class Audit(Ledger):
      def __init__(self, entries, opening):
          super().__init__(entries)
          self._opening = opening

      def entries(self):
          return list(self._entries)

      def closing(self):
          return self._opening + self.balance()
  AUDIT
  cat > bank/statement.py <<'STMT'
  from bank.audit import Audit


  class Entry:
      def __init__(self, label, amount):
          self.label = label
          self.amount = amount


  class Statement(Audit):
      def __init__(self, labels, amounts, opening):
          entries = []
          for i in range(len(labels) - 1):
              entries.append(Entry(labels[i], amounts[i]))
          super().__init__(entries, opening)

      def labels(self):
          return [e.label for e in self.entries()]
  STMT
  cat > accounts.txt <<'TXT'
  salary,1200.0
  rent,-450.0
  food,-120.0
  TXT

goal_tr: >
  bank/statement.py icindeki Statement sinifini, labels ve amounts
  listelerinin tum elemanlarindan Entry olusturacak bicimde duzelt; boylece
  accounts.txt satirlarinin tamami hareket olarak sayilsin.

reference_solution: |
  cat > bank/statement.py <<'STMT'
  from bank.audit import Audit


  class Entry:
      def __init__(self, label, amount):
          self.label = label
          self.amount = amount


  class Statement(Audit):
      def __init__(self, labels, amounts, opening):
          entries = []
          for i in range(len(labels)):
              entries.append(Entry(labels[i], amounts[i]))
          super().__init__(entries, opening)

      def labels(self):
          return [e.label for e in self.entries()]
  STMT

