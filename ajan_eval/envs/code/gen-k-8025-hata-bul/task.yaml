# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) clinic/schedule.py dosyasındaki Schedule.totals fonksiyonunu düzelt: her doktorun toplam dakikasını tamsayı olarak hesaplasın.

  2) Bu hesaplamayı yaparken clinic/stream.py içindeki RecordStream bağlam yöneticisini kullan; akış yalnızca açıkken okunmalı.

  3) Sonuç sözlüğünde her doktorun değeri tamsayı olsun; dakikalar metin olarak değil sayı olarak toplansın.

setup: |
  mkdir -p clinic
  cat > clinic/stream.py <<'STREAM'
  class RecordStream:
      """Context manager over a chunked record source.

      On __enter__ it opens the underlying chunk list; __exit__ closes it.
      Iterating yields (patient, doctor, minutes) tuples with minutes as str.
      """

      def __init__(self, chunks):
          self._chunks = chunks
          self._open = False

      def __enter__(self):
          self._open = True
          return self

      def __exit__(self, exc_type, exc, tb):
          self._open = False
          return False

      def __iter__(self):
          if not self._open:
              raise RuntimeError("stream is not open")
          for chunk in self._chunks:
              for line in chunk.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  patient, doctor, minutes = line.split(';')
                  yield patient, doctor, minutes
  STREAM
  cat > clinic/schedule.py <<'SCHEDULE'
  from clinic.stream import RecordStream


  class Schedule:
      """Aggregates total booked minutes per doctor using a RecordStream."""

      def __init__(self, chunks):
          self._chunks = chunks

      def totals(self):
          result = {}
          with RecordStream(self._chunks) as stream:
              for patient, doctor, minutes in stream:
                  result[doctor] = result.get(doctor, 0) + minutes
          return result

      def busiest(self):
          totals = self.totals()
          best = None
          for doctor, total in totals.items():
              if best is None or total > totals[best]:
                  best = doctor
          return best
  SCHEDULE
  cat > clinic/__init__.py <<'INIT'
  INIT

goal_tr: >
  clinic/schedule.py icindeki Schedule.totals fonksiyonunu, RecordStream
  baglam yoneticisini kullanarak her doktorun toplam dakikasini tamsayi
  olarak dogru hesaplayacak bicimde duzelt.

reference_solution: |
  cat > clinic/schedule.py <<'SCHEDULE'
  from clinic.stream import RecordStream


  class Schedule:
      """Aggregates total booked minutes per doctor using a RecordStream."""

      def __init__(self, chunks):
          self._chunks = chunks

      def totals(self):
          result = {}
          with RecordStream(self._chunks) as stream:
              for patient, doctor, minutes in stream:
                  result[doctor] = result.get(doctor, 0) + int(minutes)
          return result

      def busiest(self):
          totals = self.totals()
          best = None
          for doctor, total in totals.items():
              if best is None or total > totals[best]:
                  best = doctor
          return best
  SCHEDULE

