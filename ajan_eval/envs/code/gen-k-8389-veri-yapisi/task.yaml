prompt: |
  warehouse/union.py dosyasındaki UnionFind sınıfını ve merge_pairs ile load_and_merge fonksiyonlarını tamamla. Sınıf, verilen eşleşme çiftlerinden birleşim-bulma yöntemiyle grupları hesaplamalı ve her grubun sipariş kodlarını sıralı liste halinde döndürmelidir. merge_pairs fonksiyonu çiftlerden grupları üretmeli, load_and_merge ise warehouse/io/reader.py içindeki read_records ile data/links.txt dosyasını okuyup aynı sonucu döndürmelidir. Dönen yapıda her grup için kodlar sıralı olmalı ve gruplar da kendi içinde tutarlı bir sırayla listelenmelidir; mevcut read_records fonksiyonunun davranışı korunmalıdır.

setup: |
  mkdir -p warehouse/io data
  cat > warehouse/io/reader.py <<'READER'
  def read_records(path):
      with open(path, "r", encoding="utf-8") as handle:
          lines = handle.read().strip().splitlines()
      pairs = []
      for line in lines:
          left, right = line.split("|")
          pairs.append((left.strip(), right.strip()))
      return pairs
  READER
  cat > warehouse/union.py <<'UNION'
