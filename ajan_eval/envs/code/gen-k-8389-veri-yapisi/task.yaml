  class UnionFind:
      def __init__(self, n):
          raise NotImplementedError

      def find(self, x):
          raise NotImplementedError

      def union(self, a, b):
          raise NotImplementedError

      def groups(self):
          raise NotImplementedError


  def merge_pairs(pairs):
      raise NotImplementedError


  def load_and_merge(path):
      raise NotImplementedError
  UNION
  cat > data/links.txt <<'LINKS'
  a|b
  b|c
  d|e
  LINKS

goal_tr: >
  warehouse/union.py icindeki UnionFind sinifini ve merge_pairs ile
  load_and_merge fonksiyonlarini, verilen eslesme ciftlerinden
  birlesim-bulma ile gruplari hesaplayip ayni gruptaki siparis kodlarini
  sirali liste halinde dondurecek bicimde gerceklestir.

reference_solution: |
  cat > warehouse/union.py <<'UNION'
  from warehouse.io.reader import read_records


  class UnionFind:
      def __init__(self, n):
          self.parent = list(range(n))
          self.rank = [0] * n

      def find(self, x):
          root = x
          while self.parent[root] != root:
              root = self.parent[root]
          while self.parent[x] != root:
              self.parent[x], x = root, self.parent[x]
          return root

      def union(self, a, b):
          ra, rb = self.find(a), self.find(b)
          if ra == rb:
              return False
          if self.rank[ra] < self.rank[rb]:
              ra, rb = rb, ra
          self.parent[rb] = ra
          if self.rank[ra] == self.rank[rb]:
              self.rank[ra] += 1
          return True

      def groups(self):
          buckets = {}
          for i in range(len(self.parent)):
              buckets.setdefault(self.find(i), []).append(i)
          return buckets


  def merge_pairs(pairs):
      codes = []
      index = {}
      for left, right in pairs:
          for name in (left, right):
              if name not in index:
                  index[name] = len(codes)
                  codes.append(name)
      uf = UnionFind(len(codes))
      for left, right in pairs:
          uf.union(index[left], index[right])
      buckets = uf.groups()
      result = {}
      for members in buckets.values():
          names = sorted(codes[i] for i in members)
          for name in names:
              result[name] = names
      return result


  def load_and_merge(path):
      return merge_pairs(read_records(path))
  UNION

