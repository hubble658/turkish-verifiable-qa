# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  release paketindeki find_version fonksiyonunu düzelt. release/index.py içindeki find_version, verilen dosyadan sürümleri okuyup verilen ada göre aramada eşleşen kaydın sürüm demetini döndürmeli. Şu an bazı adlar için yanlış sürüm dönüyor ve dosyada bulunmayan bir ad verildiğinde None yerine hatalı bir sonuç üretiyor; bu iki sorunu gider.

  Gerekirse release/store.py içindeki yardımcı fonksiyonları da gözden geçir, ancak düzeltmenin asıl amacı find_version'ın doğru sürüm demetini döndürmesi ve dosyada olmayan ad için None döndürmesidir. Çalışma dizini /workspace; veri dosyası data.txt.

setup: |
  mkdir -p release
  cat > release/store.py <<'STORE'
  class VersionStore:
      def __init__(self, path):
          self.path = path
          self._rows = None

      def __enter__(self):
          self._fh = open(self.path, "r")
          self._rows = []
          for line in self._fh:
              line = line.strip()
              if not line:
                  continue
              name, ver = line.split('=')
              self._rows.append(
                  (name.strip(), tuple(int(p) for p in ver.strip().split('.')))
              )
          return self

      def __exit__(self, exc_type, exc, tb):
          self._fh.close()
          return False

      def rows(self):
          return list(self._rows)


  def parse_versions(text):
      rows = []
      for line in text.strip().splitlines():
          name, ver = line.split('=')
          rows.append((name.strip(), tuple(int(p) for p in ver.strip().split('.'))))
      return rows


  def sort_versions(rows):
      return sorted(rows, key=lambda r: r[1])
  STORE
  cat > release/index.py <<'INDEX'
  from release.store import VersionStore, sort_versions


  def find_version(path, name):
      with VersionStore(path) as store:
          ordered = sort_versions(store.rows())
      lo, hi = 0, len(ordered) - 1
      while lo < hi:
          mid = (lo + hi) // 2
          if ordered[mid][0] < name:
              lo = mid + 1
          else:
              hi = mid
      return ordered[lo][1]
  INDEX
  cat > data.txt <<'DATA'
  alpha=1.2.0
  beta=0.9.1
  gamma=2.0.0
  delta=1.10.3
  epsilon=1.2.10
  DATA

goal_tr: >
  release paketindeki find_version, verilen dosyadan surumleri okuyup ada
  gore sirali aramada eslesen kaydin surum demetini dondurmeli; su an bazi
  adlar icin yanlis surum donuyor ve dosyada bulunmayan bir ad icin None
  yerine hatali bir sonuc uretiyor, bunu duzelt.

reference_solution: |
  cat > release/store.py <<'STORE'
  class VersionStore:
      def __init__(self, path):
          self.path = path
          self._rows = None

      def __enter__(self):
          self._fh = open(self.path, "r")
          self._rows = []
          for line in self._fh:
              line = line.strip()
              if not line:
                  continue
              name, ver = line.split('=')
              self._rows.append(
                  (name.strip(), tuple(int(p) for p in ver.strip().split('.')))
              )
          return self

      def __exit__(self, exc_type, exc, tb):
          self._fh.close()
          return False

      def rows(self):
          return list(self._rows)


  def parse_versions(text):
      rows = []
      for line in text.strip().splitlines():
          name, ver = line.split('=')
          rows.append((name.strip(), tuple(int(p) for p in ver.strip().split('.'))))
      return rows


  def sort_versions(rows):
      return sorted(rows, key=lambda r: r[0])
  STORE
  cat > release/index.py <<'INDEX'
  from release.store import VersionStore, sort_versions


  def find_version(path, name):
      with VersionStore(path) as store:
          ordered = sort_versions(store.rows())
      lo, hi = 0, len(ordered) - 1
      while lo < hi:
          mid = (lo + hi) // 2
          if ordered[mid][0] < name:
              lo = mid + 1
          else:
              hi = mid
      if lo < len(ordered) and ordered[lo][0] == name:
          return ordered[lo][1]
      return None
  INDEX

