id: gen-k-9014-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 20

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  fleet/route.py dosyasındaki load_manifest fonksiyonunu, her satırdaki yakıt alanını int'e çevirecek şekilde düzelt. Ardından fleet/planner.py içindeki next_vehicle fonksiyonunu, skip parametresini kullanarak doğru aracı döndürecek hale getir; skip değeri kadar aracı atlayıp sıradakini döndürmeli. fleet/dispatch.py dosyasındaki mevcut sıralama ve öncelik mantığı bozulmadan kalmalı, bu dosyaya dokunma. manifest.txt içeriği de aynen korunmalı.

setup: |
  mkdir -p fleet
  cat > fleet/route.py <<'ROUTE'
  def load_manifest(path):
      legs = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              vid, km, fuel = line.split(",")
              legs.append((vid, int(km), fuel))
      return legs
  ROUTE
  cat > fleet/dispatch.py <<'DISPATCH'
  from fleet.route import load_manifest


  def priority_of(leg):
      vid, km, fuel = leg
      return fuel * 1000 + km


  def rank_legs(legs):
      ranked = sorted(legs, key=priority_of)
      return ranked
  DISPATCH
  cat > fleet/planner.py <<'PLANNER'
  from fleet.dispatch import rank_legs
  from fleet.route import load_manifest


  def next_vehicle(path, skip=0):
      legs = rank_legs(load_manifest(path))
      return legs[0][0]
  PLANNER
  cat > manifest.txt <<'MAN'
  truck-a,120,30
  truck-b,80,45
  truck-c,200,10
  MAN

goal_tr: >
  fleet/route.py icindeki load_manifest fonksiyonunu yakit alanini int'e
  cevirecek sekilde duzelt ve fleet/planner.py'deki next_vehicle
  fonksiyonunu skip parametresini kullanip dogru araci dondurecek hale
  getir.

reference_solution: |
