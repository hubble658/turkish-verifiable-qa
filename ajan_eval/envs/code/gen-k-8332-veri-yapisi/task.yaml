# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  orders.py içindeki IntervalBook sınıfını, aynı müşterinin iç içe geçen ya da komşu sipariş aralıklarını tek aralıkta birleştirecek şekilde düzelt. merged metodu, müşteri için birleştirilmiş aralıkları sıralı demet listesi olarak döndürmeli; total metodu ise müşterinin toplam kapsanan miktarını doğru hesaplamalı. Sınıfın mevcut arayüzü korunmalı: add, merged ve total metotları aynı adlarla çalışmaya devam etmeli.

setup: |
  cat > orders.py <<'PY'
  class IntervalBook:
      """Merge overlapping order quantity intervals per customer."""

      def __init__(self):
          self._books = {}

      def add(self, customer, start, end):
          self._books.setdefault(customer, []).append([start, end])

      def merged(self, customer):
          spans = sorted(self._books.get(customer, []))
          out = []
          for s, e in spans:
              if out and s <= out[-1][1] and e <= out[-1][1]:
                  out[-1][1] = e
              else:
                  out.append([s, e])
          return [tuple(x) for x in out]

      def total(self, customer):
          return sum(e - s for s, e in self.merged(customer))
  PY

goal_tr: >
  orders.py icindeki IntervalBook sinifini, ayni musterinin ic ice gecen ya
  da komsu siparis araliklarini tek araliga birlestirip merged ile sirali
  demet listesi ve total ile toplam kapsanan miktari dogru dondurecek
  bicimde duzelt.

reference_solution: |
  cat > orders.py <<'PY'
  class IntervalBook:
      """Merge overlapping order quantity intervals per customer."""

      def __init__(self):
          self._books = {}

      def add(self, customer, start, end):
          self._books.setdefault(customer, []).append([start, end])

      def merged(self, customer):
          spans = sorted(self._books.get(customer, []))
          out = []
          for s, e in spans:
              if out and s <= out[-1][1]:
                  if e > out[-1][1]:
                      out[-1][1] = e
              else:
                  out.append([s, e])
          return [tuple(x) for x in out]

      def total(self, customer):
          return sum(e - s for s, e in self.merged(customer))
  PY

