id: gen-k-9501-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 22

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensör alarm kurallarında eşikleri aşan ölçümler yanlış sırada bildiriliyor. sensors/stack.py içindeki alarm yığınının, limits.txt dosyasındaki eşiklere göre alarmları son giren ilk çıkar sırasında döndürmesini sağla; böylece iter_alarms ile üretilen alarmlar en son eklenen ölçümden başlayarak geriye doğru gelsin.

setup: |
  mkdir -p sensors
  cat > sensors/rules.py <<'RULES'
  def load_rules(path):
      rules = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              name, limit = line.split("=")
              rules.append((name.strip(), float(limit)))
      return rules
  RULES
  cat > sensors/stack.py <<'STACK'
  from sensors.rules import load_rules


  class AlarmStack:
      def __init__(self, rules_path):
          self._rules = load_rules(rules_path)
          self._items = []

      def push(self, name, value):
          self._items.append((name, value))

      def pop(self):
          return self._items.pop(0)

      def peek(self):
          return self._items[0]

      def __len__(self):
          return len(self._items)

      def __bool__(self):
          return bool(self._items)

      def __iter__(self):
          while self._items:
              yield self._items.pop(0)


  def iter_alarms(rules_path, readings):
      stack = AlarmStack(rules_path)
      limits = dict(stack._rules)
      for name, value in readings:
          if name in limits and value > limits[name]:
              stack.push(name, value)
      for item in stack:
          yield item
  STACK
  cat > limits.txt <<'LIMITS'
  temp=80
  pressure=100
  # comment
  vibration=5
  LIMITS

goal_tr: >
  sensor alarm kurallarinda esikleri asan olcumler yanlis sirada
  bildiriliyor; limits.txt esiklerine gore alarmlari son-giren-ilk-cikar
  sirasinda donduren davranisi sagla.

reference_solution: |
  cat > sensors/rules.py <<'RULES'
  def load_rules(path):
      rules = []
      with open(path) as fh:
          for line in fh:
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              name, limit = line.split("=")
              rules.append((name.strip(), float(limit)))
      return rules
  RULES
  cat > sensors/stack.py <<'STACK'
  from sensors.rules import load_rules


  class AlarmStack:
      def __init__(self, rules_path):
          self._rules = load_rules(rules_path)
          self._items = []

      def push(self, name, value):
          self._items.append((name, value))

      def pop(self):
          if not self._items:
              raise IndexError("pop from empty stack")
          return self._items.pop()

      def peek(self):
          if not self._items:
              raise IndexError("peek on empty stack")
          return self._items[-1]

      def __len__(self):
          return len(self._items)

      def __bool__(self):
          return bool(self._items)

      def __iter__(self):
          while self._items:
              yield self._items.pop()


  def iter_alarms(rules_path, readings):
      stack = AlarmStack(rules_path)
      limits = dict(stack._rules)
      for name, value in readings:
          if name in limits and value > limits[name]:
              stack.push(name, value)
      for item in stack:
          yield item
  STACK

