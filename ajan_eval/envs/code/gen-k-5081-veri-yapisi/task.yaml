# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  grid/billing.py içindeki BillingEngine sınıfını, charge çağrılarını en son kullanılan önbellek (LRU) mantığıyla ve kapasite sınırında önbelleğe alacak biçimde gerçekleştir. charge sonucu, registry'deki okuma ile tariff oranının çarpımı olmalı. cached_count ise önbellekteki kayıt sayısını döndürmeli.

  Şu şartlar sağlanmalı:
  - grid/billing.py dosyası BillingEngine sınıfını içermeli.
  - charge, registry'deki okuma ile tariff oranının çarpımını sonuç olarak vermeli.
  - charge çağrıları LRU mantığıyla önbelleğe alınmalı.
  - Önbellek kapasite sınırını aşmamalı; sınır aşıldığında en son kullanılan kayıt çıkarılmalı.
  - cached_count, önbellekteki kayıt sayısını döndürmeli.

setup: |
  mkdir -p grid
  cat > grid/registry.py <<'REGISTRY'
  class MeterRegistry:
      def __init__(self):
          self._readings = {}

      def add(self, meter_id, kwh):
          self._readings[meter_id] = kwh

      def reading(self, meter_id):
          return self._readings.get(meter_id)
  REGISTRY
  cat > grid/tariff.py <<'TARIFF'
  RATES = {"residential": 0.20, "commercial": 0.35, "industrial": 0.12}


  def cost(reading, category):
      return reading * RATES[category]
  TARIFF
  cat > grid/billing.py <<'BILLING'
  from grid.registry import MeterRegistry
  from grid.tariff import cost


  class BillingEngine:
      def __init__(self, capacity):
          self._capacity = capacity
          self._cache = {}
          self._order = []

      def charge(self, meter_id, category):
          raise NotImplementedError

      def cached_count(self):
          raise NotImplementedError
  BILLING

goal_tr: >
  grid/billing.py icindeki BillingEngine sinifini, en son kullanilan
  onbellek (LRU) mantigiyla charge cagrilarini kapasite sinirinda onbellege
  alip cached_count ile onbellekteki kayit sayisini dondurecek bicimde
  gerceklestir; charge sonucu registry'deki okuma ile tariff oraninin
  carpimidir.

reference_solution: |
  cat > grid/billing.py <<'BILLING'
  from grid.registry import MeterRegistry
  from grid.tariff import cost


  class BillingEngine:
      def __init__(self, capacity):
          self._capacity = capacity
          self._cache = {}
          self._order = []

      def _touch(self, key):
          if key in self._order:
              self._order.remove(key)
          self._order.append(key)

      def charge(self, meter_id, category):
          key = (meter_id, category)
          if key in self._cache:
              self._touch(key)
              return self._cache[key]
          reading = self._registry.reading(meter_id)
          value = cost(reading, category)
          self._cache[key] = value
          self._touch(key)
          if len(self._cache) > self._capacity:
              oldest = self._order.pop(0)
              del self._cache[oldest]
          return value

      def cached_count(self):
          return len(self._cache)
  BILLING

