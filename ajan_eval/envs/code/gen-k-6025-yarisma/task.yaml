      return acc
  TOPLAM

outputs:
  - {path: restoran/siparis.py, kind: program, run: 'python3 -c ''from restoran.siparis import oku_satirlar as f, ayir as g; r=f("restoran/veri.txt"); assert len(r)==7, len(r); assert r[0]=="1,cay,3,10", r[0]; assert g("2,tost,2,40")==("2","tost",2,40); print("REGRESYON-TAMAM")'''}
  - {path: restoran/toplam.py, kind: program, run: 'python3 -c ''from restoran.toplam import masa_toplamlari as f; from restoran.siparis import oku_satirlar as g; r=g("restoran/veri.txt"); assert f(r)=={"1":80,"2":155,"3":235}, f(r); print("ILERLEME-TAMAM")'''}
  - {path: restoran/rapor/olustur.py, kind: program, run: 'python3 -c ''from restoran.rapor.olustur import kumulatif as f; assert f("restoran/veri.txt")==[("1",80),("2",235),("3",470)], f("restoran/veri.txt"); print("TAMAM")'''}

