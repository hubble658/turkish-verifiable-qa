id: gen-k-5164-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  versions/resolver.py içindeki pick_latest fonksiyonunu, verilen sürüm listesinden kısıtı sağlayan en yüksek sürümü döndürecek biçimde düzelt. versions/registry.py dosyasındaki mevcut yapıya ve hata sınıflarına dokunma; fonksiyon yine kısıtı sağlayan sürüm yoksa hata vermeye devam etsin.

setup: |
  mkdir -p versions
  cat > versions/registry.py <<'REGISTRY'
  class VersionError(Exception):
      pass


  class ParseError(VersionError):
      pass


  class ConstraintError(VersionError):
      pass


  def parse_version(text):
      parts = text.split(".")
      nums = []
      for p in parts:
          if not p.isdigit():
              raise ParseError("bad segment: " + p)
          nums.append(int(p))
      return tuple(nums)


  def compare(a, b):
      a = parse_version(a)
      b = parse_version(b)
      n = max(len(a), len(b))
      for i in range(n):
          x = a[i] if i < len(a) else 0
          y = b[i] if i < len(b) else 0
          if x != y:
              return -1 if x < y else 1
      return 0
  REGISTRY
  cat > versions/resolver.py <<'RESOLVER'
  from versions.registry import parse_version, compare, ConstraintError


  def _bounds(spec):
      op = spec[:2]
      if op in (">=", "<=", "==", "!="):
          return op, spec[2:]
      op = spec[0]
      if op in (">", "<"):
          return op, spec[1:]
      raise ConstraintError("bad spec: " + spec)


  def pick_latest(versions, spec):
      op, target = _bounds(spec)
      ok = []
      for v in versions:
          c = compare(v, target)
          if op == ">=" and c >= 0:
              ok.append(v)
          elif op == ">" and c > 0:
              ok.append(v)
          elif op == "<=" and c <= 0:
              ok.append(v)
          elif op == "<" and c < 0:
              ok.append(v)
          elif op == "==" and c == 0:
              ok.append(v)
          elif op == "!=" and c != 0:
              ok.append(v)
      if not ok:
          raise ConstraintError("no match for " + spec)
      ok.sort(key=parse_version)
      return ok[-2]
  RESOLVER

goal_tr: >
  versions/resolver.py icindeki pick_latest fonksiyonunu, verilen surum
  listesinden kisiti saglayan EN YUKSEK surumu dondurecek bicimde duzelt.

